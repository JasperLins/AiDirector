<style>
/* ============ 2. FONTS（本地字体缺失时回退栈仍保证版式） ============ */
@font-face{font-family:'SF Pro';font-weight:400;font-style:normal;src:local('SF Pro Text'),local('SF Pro')}
@font-face{font-family:'SF Pro';font-weight:700;font-style:normal;src:local('SF Pro Display Semibold'),local('SF Pro Bold')}
@font-face{font-family:'SF Pro Thin';font-weight:100;font-style:normal;src:local('SF Pro Display Thin'),local('SF Pro Thin')}
@font-face{font-family:'Aalto';font-weight:400;font-style:normal;src:local('Aalto')}

:root{font-family:'SF Pro',Arial,sans-serif;color:#fff;background:#090807;font-synthesis:none}

/* ============ 5. LAYOUT ============ */
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
.experience{position:relative;width:100%;height:100%;min-height:540px;overflow:hidden;background:#0a0908}
.backgrounds,.background,.shade,.transition-layer,.transition-layer video{position:absolute;inset:0;width:100%;height:100%}
.background{object-fit:cover;opacity:0;transition:opacity .8s ease}
.background.is-visible{opacity:1}
.shade{z-index:1;background:linear-gradient(to bottom,transparent 52%,rgba(0,0,0,.88) 100%);pointer-events:none}
.chrome{position:absolute;z-index:4;transition:opacity .45s ease,filter .45s ease}
.experience.is-transitioning .chrome{opacity:0;filter:blur(8px);pointer-events:none}

/* HEADER */
.header{left:clamp(18px,1.95vw,28px);right:clamp(18px,1.95vw,28px);top:clamp(18px,3.1vh,28px);display:flex;justify-content:space-between;align-items:center}
.header-actions{margin-left:auto;display:flex;align-items:center}
.nav{display:flex;align-items:center;height:42px;padding:4px 5px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.1);backdrop-filter:blur(12px);border-radius:999px}
.nav a{color:#fff;text-decoration:none;padding:8px 19px;border-radius:999px;line-height:1}
.nav a.active{background:#fff;color:#000}
.menu{height:42px;padding:0 20px;border:0;border-radius:999px;background:#fff;color:#000;cursor:pointer;font:inherit}
.menu-wrap{position:relative}
.menu-pop{position:absolute;top:calc(100% + 12px);right:0;min-width:238px;padding:7px;border:1px solid rgba(255,255,255,.45);background:rgba(10,9,8,.92);backdrop-filter:blur(14px);border-radius:16px;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .22s ease,transform .22s ease,visibility .22s}
.menu-wrap.open .menu-pop{opacity:1;visibility:visible;transform:none}
.menu-pop a{display:block;padding:10px 14px;border-radius:10px;color:#fff;text-decoration:none;font-size:13.5px;white-space:nowrap;transition:background .15s}
.menu-pop a:hover{background:rgba(255,255,255,.14)}

/* SIDEBAR（教学文档栏目导航） */
.planet-list{left:clamp(18px,1.95vw,28px);top:50%;transform:translateY(-43%);display:flex;flex-direction:column;gap:6px;font-size:16px}
.planet-item{display:flex;align-items:center;min-height:20px}
.planet-item a{color:inherit;text-decoration:none}
.planet-item.active{font-size:18px;font-weight:700;gap:8px}
.planet-item.active:before{content:'';width:16px;height:16px;border-radius:50%;background:#fff}

/* PORTAL（左下角圆形迷你传送门，约为原尺寸 1/4） */
.portal-wrap{left:clamp(24px,3vw,40px);bottom:clamp(24px,3vh,36px);top:auto;transform:none;display:flex;flex-direction:column;align-items:flex-start}
.portal-heading{display:flex;gap:6px;align-items:baseline;margin-bottom:10px;font-size:12px;letter-spacing:.05em;opacity:0;white-space:nowrap}
.portal-heading strong{font-size:13px;margin-left:0}
.portal{position:relative;display:block;width:160px;aspect-ratio:1/1;padding:0;overflow:visible;border:0;border-radius:50%;background:transparent;cursor:pointer;box-shadow:0 0 0 1px rgba(255,255,255,.4);transition:transform .35s cubic-bezier(.22,1,.36,1),box-shadow .35s ease}
.portal:hover{transform:scale(1.14);box-shadow:0 0 0 1px rgba(255,255,255,.95),0 0 28px rgba(255,255,255,.18)}
.portal video,.portal img{visibility:hidden;position:absolute;width:1px;height:1px;pointer-events:none}
.portal-canvas{position:fixed;inset:0;z-index:3;width:100%;height:100%;pointer-events:none}
/* （真实媒体元素不可见——它们只作为画布取样的像素源） */

/* CONTENT（框架介绍居中 + 悬停微交互） */
.planet-content{left:50%;top:75%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:flex-start;gap:12px;pointer-events:none;max-width:min(600px,88vw)}
.act-kicker{font-size:13px;letter-spacing:.35em;color:rgba(255,255,255,.72);opacity:0}
.planet-content dl{width:100%;margin:0;font-size:16.5px;pointer-events:auto}
.fact{display:grid;grid-template-columns:132px 1fr;gap:18px;padding:10px 14px 10px 12px;border-bottom:1px solid rgba(255,255,255,.22);border-radius:10px;opacity:0;transition:background .3s ease,transform .3s ease,border-color .3s ease}
.fact:last-child{border-bottom:0}
.fact:hover{background:rgba(255,255,255,.07);transform:translateX(6px);border-color:rgba(255,255,255,.55)}
.fact dt{font-weight:700;transition:color .3s ease}
.fact:hover dt{color:#fff}
.fact dd{margin:0;color:rgba(255,255,255,.82);transition:color .3s ease}
.fact:hover dd{color:#fff}

/* MISC */
.transition-layer{display:none}
.scene-canvas{display:none}
.loading{position:absolute;z-index:12;left:50%;bottom:30px;transform:translateX(-50%);opacity:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;transition:opacity .2s}
.experience.is-loading .loading{opacity:.8}
.experience.is-transitioning .header,.experience.is-transitioning .planet-list{opacity:1;filter:none;pointer-events:auto}
.experience.is-transitioning .shade{opacity:1}
.experience.is-committing .background{transition:none!important}

/* ============ 6. PRELOADER ============ */
.preloader{position:absolute;inset:0;z-index:20;background:#000;overflow:hidden}
.preloader video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.preloader-shade{position:absolute;inset:auto 0 0;height:35%;background:linear-gradient(to bottom,transparent,#000)}
.preloader.is-background{z-index:0;pointer-events:none}
.preloader.is-background .preloader-shade{opacity:0}
.floating-logo{position:fixed;z-index:22;left:50%;top:50%;width:59px;height:58px;transform:translate(-50%,-50%);will-change:left,top,width,height,transform;
  transition:left 2s cubic-bezier(.16,1,.3,1),top 2s cubic-bezier(.16,1,.3,1),width 2s cubic-bezier(.16,1,.3,1),height 2s cubic-bezier(.16,1,.3,1),transform 2s cubic-bezier(.16,1,.3,1)}
.floating-logo.is-docked{left:clamp(18px,1.95vw,28px);top:clamp(18px,3.1vh,28px);width:37px;height:36px;transform:none}
.floating-logo.is-settled{z-index:5}
.preloader-count{position:fixed;z-index:22;left:50%;bottom:clamp(22px,3.1vh,28px);display:flex;align-items:flex-end;gap:4px;transform:translateX(-50%);font-family:'SF Pro',Arial,sans-serif;line-height:1}
.preloader-count>span:first-child{font-family:'SF Pro Thin','SF Pro',Arial,sans-serif;font-size:64px;font-weight:100}
.preloader-count .percent{font-size:24px;padding-bottom:4px}
.preloader-count.is-leaving{animation:preload-count-out .75s cubic-bezier(.22,1,.36,1) both}
@keyframes preload-count-out{to{opacity:0;filter:blur(7px);transform:translate(-50%,-34px)}}
body:not(.preload-complete) .custom-cursor{opacity:0!important}
noscript{position:fixed;inset:auto 0 0 0;z-index:200;background:#000;padding:18px;text-align:center;font:14px/1.6 'SF Pro',Arial,sans-serif}
noscript a{color:#8ab4ff}

/* ============ 9. CUSTOM CURSOR ============ */
html,body,button,a,.portal{cursor:none!important}
.custom-cursor{display:block;position:fixed;left:0;top:0;z-index:100;width:1px;height:1px;pointer-events:none;opacity:0;transition:opacity .2s ease}
.custom-cursor.is-visible{opacity:1}
.cursor-dot,.cursor-orbit{position:absolute;left:0;top:0;border-radius:50%;transform:translate(-50%,-50%)}
.cursor-dot{width:12px;height:12px;background:#fff}
.cursor-orbit{width:36px;height:36px;border:1px solid #fff;background:rgba(255,255,255,.4);transition:transform .3s cubic-bezier(.22,1,.36,1)}
.custom-cursor.is-enter .cursor-orbit{transform:translate(-50%,-50%) scale(1.16)}
.cursor-label{position:absolute;top:26px;left:0;transform:translateX(-50%) translateY(-4px);font:16px/1.2 'SF Pro',Arial,sans-serif;white-space:nowrap;opacity:0;transition:opacity .2s ease,transform .3s cubic-bezier(.22,1,.36,1)}
.custom-cursor.is-enter .cursor-label{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============ 10. ENTRANCE / SWITCH ANIMATIONS ============ */
body:not(.intro-ready) .header,body:not(.intro-ready) .planet-list,body:not(.intro-ready) .planet-content .act-kicker,body:not(.intro-ready) .planet-content .fact{opacity:0}
.intro-ready .header{animation:reveal-down .9s cubic-bezier(.22,1,.36,1) .1s both}
.intro-ready .planet-list{animation:reveal-side .9s cubic-bezier(.22,1,.36,1) .65s both}
.content-revealing .act-kicker{animation:fact-rise .6s cubic-bezier(.22,1,.36,1) .15s both}
.content-revealing .fact{animation:fact-rise .72s cubic-bezier(.22,1,.36,1) both}
.fact:nth-child(1){animation-delay:.28s}
.fact:nth-child(2){animation-delay:.42s}
.fact:nth-child(3){animation-delay:.56s}
.fact:nth-child(4){animation-delay:.7s}
.mask-revealing .portal-heading{animation:portal-caption .85s cubic-bezier(.22,1,.36,1) both}
.planet-list.is-switching .planet-item{animation:menu-row .58s cubic-bezier(.22,1,.36,1) both}
.planet-list.is-switching .planet-item:nth-child(1){animation-delay:.02s}
.planet-list.is-switching .planet-item:nth-child(2){animation-delay:.05s}
.planet-list.is-switching .planet-item:nth-child(3){animation-delay:.08s}
.planet-list.is-switching .planet-item:nth-child(4){animation-delay:.11s}
.planet-list.is-switching .planet-item:nth-child(5){animation-delay:.14s}
.planet-list.is-switching .planet-item:nth-child(6){animation-delay:.17s}
.planet-list.is-switching .planet-item:nth-child(7){animation-delay:.2s}
.planet-list.is-switching .planet-item:nth-child(8){animation-delay:.23s}
.planet-list.is-switching .planet-item.active:before{animation:active-dot .55s cubic-bezier(.22,1,.36,1) .18s both}
@keyframes reveal-down{from{opacity:0;filter:blur(8px);transform:translateY(-18px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes reveal-side{from{opacity:0;filter:blur(8px);transform:translate(-20px,-43%)}to{opacity:1;filter:blur(0);transform:translate(0,-43%)}}
@keyframes fact-rise{from{opacity:0;filter:blur(7px);transform:translateY(18px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes portal-caption{from{opacity:0;filter:blur(7px);transform:translateY(22px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes menu-row{from{opacity:.35;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
@keyframes active-dot{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}

/* ============ 11. RESPONSIVE ============ */
@media(max-width:900px){
  .nav{height:36px;padding:3px 4px}

  .fact{grid-template-columns:110px 1fr}
  .planet-list{font-size:14px}
  .planet-item.active{font-size:16px}
}
@media(max-width:640px){
  .experience{min-height:600px}
  .planet-list{display:none}
  .planet-content{left:50%;transform:translate(-50%,-50%);max-width:92vw}
  .planet-content dl{font-size:14px}
  .fact{grid-template-columns:92px 1fr;padding:8px 10px}
  .portal{width:128px}
  .portal-heading{font-size:11px}
  .portal-heading strong{font-size:12px}
  .menu{height:38px}
}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}.portal{transform:none!important}}

<script>
/* ============ 1. REMOTE ASSETS ============ */
const BASE='https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P';
const MARS_BG  =BASE+'/3c83091e-4046-4fd6-adbb-2edb728be79a.mp4';
const TO_EARTH =BASE+'/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4';

/* ============ 4. DATA MODEL（AiDirector 三幕改编，保留 Planet 链骨架） ============ */
/* 教学文档栏目（8 项 = doc.html 八大板块锚点；active = 当前幕） */
const stations=[
  {label:'教学',   href:'doc/doc.html#tutorial'},

  {label:'角色',   href:'doc/doc.html#roles'},

  {label:'实验室', href:'doc/doc.html#lab'},
  {label:'门禁',   href:'doc/doc.html#scorer'}
];

const states={
 create:{ name:'Create', kicker:'第一幕 · 创作', next:'Generate', number:'[02]', station:0, portal:TO_EARTH, background:'mars-background',
   facts:[['角色系统','9 大专业智能体协同：编剧 · 导演 · 美术 · 场记 · 生图 · 视频 · 评分 · 剪辑 · 复盘'],
          ['两级记忆','全局权威知识库 × 剧集圣经与 @纯中文资产注册表，跨集状态快照防穿帮'],
          ['分镜工程','14 字段标准分镜表 · S/A/B 算力分级 · Cutaway 救场缓冲镜 · 180 度轴线守卫'],
          ['声画先行','台词按 字数÷语速 精算到 0.5 秒，重音秒位倒推视频动作节点']] },
 generate:{ name:'Generate', kicker:'第二幕 · 生成', next:'Refine', number:'[03]', station:6, portal:TO_VENUS, background:'earth-background',
   facts:[['KB 词典','12 册高密度工业词库——查表编译，拒绝空洞形容词自由造句'],

          ['自进化','实测复盘反哺词典与插件——框架越用越强，点击传送门进入教学文档']] }

/* ============ DOM refs ============ */

const main=document.querySelector('.experience');
const portalBtn=$('portal'), portalVideo=$('portal-video'), portalImage=$('portal-image');
const transitionVideo=$('transition-video');
const portalCanvas=$('portal-canvas'), sceneCanvas=$('scene-canvas');
const pctx=portalCanvas.getContext('2d'), sctx=sceneCanvas.getContext('2d');

/* ============ 7. THE PORTAL — state ============ */
let rotX=0,rotY=0,targetX=0,targetY=0;
let expansion=0, maskScale=1, canvasOpacity=1;
let transitionActive=false, frozenScene=false, busy=false;
let firstRender=true;

const easeInOutCubic=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function animateValue(setter,duration){return new Promise(res=>{const t0=performance.now();
  (function step(now){const t=Math.min(1,(now-t0)/duration);setter(easeInOutCubic(t));
    t<1?requestAnimationFrame(step):res();})(t0);});}
const twoRAF=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
function mediaReady(video,timeout){return new Promise(res=>{let done=false;const fin=()=>{if(!done){done=true;res();}};
  video.addEventListener('canplaythrough',fin,{once:true});video.addEventListener('canplay',fin,{once:true});
  video.addEventListener('error',fin,{once:true});setTimeout(fin,timeout);});}
const ended=video=>new Promise(res=>{video.addEventListener('ended',res,{once:true});setTimeout(res,9000);});

/* ---- canvases ---- */
function sizeCanvas(canvas,ctx){const d=Math.min(devicePixelRatio||1,2);
  canvas.width=innerWidth*d;canvas.height=innerHeight*d;
  canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';
  ctx.setTransform(d,0,0,d,0,0);}
function resizeCanvas(){sizeCanvas(portalCanvas,pctx);if(!frozenScene)sizeCanvas(sceneCanvas,sctx);}
addEventListener('resize',resizeCanvas);

/* ---- cover / contain draw + shade ---- */
function drawCover(ctx,media){const mw=media.videoWidth||media.naturalWidth||16;
  const mh=media.videoHeight||media.naturalHeight||9;if(!mw||!mh)return;
  const scale=Math.max(innerWidth/mw,innerHeight/mh),w=mw*scale,h=mh*scale;
  ctx.drawImage(media,(innerWidth-w)/2,(innerHeight-h)/2,w,h);}
function drawContain(ctx,media){const mw=media.videoWidth||media.naturalWidth||16;
  const mh=media.videoHeight||media.naturalHeight||9;if(!mw||!mh)return;
  const scale=Math.min(innerWidth/mw,innerHeight/mh),w=mw*scale,h=mh*scale;
  ctx.drawImage(media,(innerWidth-w)/2,(innerHeight-h)/2,w,h);}
function drawShade(ctx){const g=ctx.createLinearGradient(0,innerHeight*.52,0,innerHeight);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.88)');
  ctx.fillStyle=g;ctx.fillRect(0,innerHeight*.52,innerWidth,innerHeight*.48);}

/* ---- 圆角矩形 44 点采样 + 焦距 850 伪透视投影 ---- */
function roundedPoints(w,h,r){r=Math.min(r,w/2,h/2);const pts=[];
  const arcs=[[w/2-r,-h/2+r,-Math.PI/2,0],[w/2-r,h/2-r,0,Math.PI/2],
              [-w/2+r,h/2-r,Math.PI/2,Math.PI],[-w/2+r,-h/2+r,Math.PI,Math.PI*1.5]];
  for(const[cx,cy,a0,a1]of arcs)for(let i=0;i<=10;i++){const a=a0+(a1-a0)*i/10;
    pts.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);}
  return pts;}
function project(x,y,cx,cy,rx,ry){const ax=rx*Math.PI/180,ay=ry*Math.PI/180;
  const xx=x*Math.cos(ay),yy=y*Math.cos(ax),z=x*Math.sin(ay)-y*Math.sin(ax),p=850/(850+z);
  return[cx+xx*p,cy+yy*p];}

/* ---- frame loop ---- */
let lastT=performance.now();
function draw(now){const dt=Math.min(40,now-lastT);lastT=now;
  rotX+=(targetX-rotX)*Math.min(1,dt*.009);
  rotY+=(targetY-rotY)*Math.min(1,dt*.009);
  pctx.clearRect(0,0,innerWidth,innerHeight);
  if(frozenScene){pctx.drawImage(sceneCanvas,0,0,innerWidth,innerHeight);drawShade(pctx);}
  const rect=portalBtn.getBoundingClientRect(),e=expansion;
  const rcx=rect.left+rect.width/2,rcy=rect.top+rect.height/2;
  const cx=rcx+(innerWidth/2-rcx)*e;
  const cy=rcy+(innerHeight/2-rcy)*e;
  const scale=e?1:maskScale;
  const w=(rect.width+(innerWidth-rect.width)*e)*scale;
  const h=(rect.height+(innerHeight-rect.height)*e)*scale;
  const r=90*(1-e)*scale,rx=rotX*(1-e),ry=rotY*(1-e);
  if(w>1&&h>1){
    const pts=roundedPoints(w,h,r);pctx.save();pctx.globalAlpha=canvasOpacity;
    pctx.beginPath();
    pts.forEach((p,i)=>{const s=project(p[0],p[1],cx,cy,rx,ry);
      i?pctx.lineTo(s[0],s[1]):pctx.moveTo(s[0],s[1]);});
    pctx.closePath();pctx.clip();
    pctx.fillStyle='#030303';pctx.fillRect(0,0,innerWidth,innerHeight);
    /* 静态图片用 contain 完整居中展示；视频保持 cover 铺满 */
    if(transitionActive)drawCover(pctx,transitionVideo);
    else if(states[current].image)drawContain(pctx,portalImage);
    else drawCover(pctx,portalVideo);
    if(transitionActive)drawShade(pctx);
    pctx.restore();}
  requestAnimationFrame(draw);}

/* ---- pointer tilt ---- */
addEventListener('pointermove',e=>{if(busy)return;
  targetY=(e.clientX/innerWidth-.5)*37.4;targetX=(e.clientY/innerHeight-.5)*-33;});
document.addEventListener('mouseleave',()=>{targetX=0;targetY=0;});

/* ============ render() ============ */
function render(){const s=states[current];
  main.dataset.planet=current;
  $('act-kicker').textContent=s.kicker;
  $('next-name').textContent=s.next;$('next-number').textContent=s.number;
  portalBtn.setAttribute('aria-label',current==='refine'?'打开教学文档':'进入下一幕');
  const facts=$('facts');facts.innerHTML='';
  s.facts.forEach(([k,v])=>{const d=document.createElement('div');d.className='fact';
    d.innerHTML=`<dt>${k}</dt><dd>${v}</dd>`;facts.appendChild(d);});
  const list=document.querySelector('.planet-list');list.innerHTML='';
  stations.forEach((st,i)=>{const sp=document.createElement('span');
    sp.className='planet-item'+(i===s.station?' active':'');
    sp.innerHTML=`<a href="${st.href}">${st.label}</a>`;list.appendChild(sp);});
  if(!firstRender){list.classList.remove('is-switching');void list.offsetWidth;list.classList.add('is-switching');}
  firstRender=false;
  document.querySelectorAll('.background').forEach(v=>v.classList.toggle('is-visible',v.id===s.background));
  if(s.image){portalImage.src=s.image;portalImage.style.display='';portalVideo.style.display='none';}
  else{portalVideo.style.display='';portalImage.style.display='none';
    if(portalVideo.src!==s.portal)portalVideo.src=s.portal;}
}

/* ============ 8. TRAVEL ============ */
function revealMask(){main.classList.remove('mask-revealing');void main.offsetWidth;
  main.classList.add('mask-revealing');maskScale=0;
  return animateValue(v=>maskScale=v,1050);}
function revealPlanetContent(){main.classList.remove('content-revealing');void main.offsetWidth;
  main.classList.add('content-revealing');}

async function travel(){
  if(busy)return;
  if(current==='refine'){                       /* 终态：传送门 = 教学文档入口 */
    document.querySelector('.loading').textContent='正在打开教学文档…';
    main.classList.add('is-loading');
    setTimeout(()=>location.href='doc/doc.html',350);return;}
  busy=true;targetX=0;targetY=0;
  const next=current==='create'?'generate':'refine';
  try{
    transitionVideo.src=states[current].portal;transitionVideo.load();
    main.classList.add('is-loading');
    await mediaReady(transitionVideo,1600);
    main.classList.remove('is-loading','content-revealing','mask-revealing');
    main.classList.add('is-transitioning');
    transitionVideo.currentTime=0;transitionVideo.playbackRate=1.3;
    canvasOpacity=1;transitionActive=true;
    try{await transitionVideo.play();}catch(e){}
    await animateValue(v=>expansion=v,1100);    /* 窗口吞没屏幕 */
    await ended(transitionVideo);
    /* 冻结末帧进 #scene-canvas */
    sctx.fillStyle='#000';sctx.fillRect(0,0,innerWidth,innerHeight);
    drawCover(sctx,transitionVideo);frozenScene=true;
    current=next;main.classList.add('is-committing');render();await twoRAF();
    transitionActive=false;expansion=0;maskScale=0;canvasOpacity=1;
    main.classList.remove('is-transitioning','is-committing');
    const mr=revealMask();setTimeout(revealPlanetContent,100);await mr;
    setTimeout(()=>{transitionVideo.removeAttribute('src');transitionVideo.load();},450);
    busy=false;
  }catch(err){
    transitionActive=false;expansion=0;maskScale=1;canvasOpacity=1;
    main.classList.remove('is-transitioning','is-committing','is-loading');
    busy=false;}
}
portalBtn.addEventListener('click',travel);
addEventListener('wheel',()=>{                     /* 滚轮上下滑动 = 等效点击传送门跳转 */
  if(busy||!document.body.classList.contains('preload-complete'))return;
  travel();},{passive:true});

/* ============ 6. PRELOADER ============ */
function runPreloader(){const pv=$('preloader-video'),value=$('preloader-value'),
    count=$('preloader-count'),logo=$('floating-logo'),box=$('preloader');
  let finished=false;
  const finish=()=>{if(finished)return;finished=true;
    value.textContent='100';count.classList.add('is-leaving');
    logo.classList.add('is-docked');
    box.classList.add('is-background');
    document.body.classList.add('preload-complete');
    startExperience();
    setTimeout(()=>count.remove(),750);
    setTimeout(()=>logo.classList.add('is-settled'),2000);};
  pv.addEventListener('loadedmetadata',()=>{pv.playbackRate=Math.max(.25,pv.duration/3);
    pv.play().catch(finish);});
  pv.addEventListener('ended',finish);pv.addEventListener('error',finish);
  setTimeout(finish,8000);                       /* 离线/加载失败兜底：8s 后照常进入 */
  (function tick(){if(finished)return;
    value.textContent=Math.round(pv.currentTime/(pv.duration||1)*100);
    requestAnimationFrame(tick);})();}

async function startExperience(){
  await mediaReady(states[current].image?portalImage:portalVideo,3000);
  await revealMask();
  document.body.classList.add('intro-ready');
  setTimeout(revealPlanetContent,850);}

/* ============ 9. CUSTOM CURSOR ============ */
const cursor=document.querySelector('.custom-cursor');
const cursorDot=document.querySelector('.cursor-dot'),cursorOrbit=document.querySelector('.cursor-orbit');
let cx2=innerWidth/2,cy2=innerHeight/2,px2=cx2,py2=cy2,cursorSeen=false;
addEventListener('pointermove',e=>{px2=e.clientX;py2=e.clientY;
  cursorSeen=true;cursor.classList.add('is-visible');});
document.documentElement.addEventListener('mouseleave',()=>cursor.classList.remove('is-visible'));
document.documentElement.addEventListener('mouseenter',()=>cursor.classList.add('is-visible'));
addEventListener('wheel',e=>{                       /* 滚轮=指针在场：点亮光标并吸收事件自带坐标 */
  if(e.clientX||e.clientY){px2=e.clientX||px2;py2=e.clientY||py2;}
  cursor.classList.add('is-visible');},{passive:true});
portalBtn.addEventListener('pointerenter',()=>cursor.classList.add('is-enter'));
portalBtn.addEventListener('pointerleave',()=>cursor.classList.remove('is-enter'));
function cursorLoop(){cx2+=(px2-cx2)*.2;cy2+=(py2-cy2)*.2;
  cursorDot.style.left=px2+'px';cursorDot.style.top=py2+'px';
  cursorOrbit.style.left=cx2+'px';cursorOrbit.style.top=cy2+'px';
  requestAnimationFrame(cursorLoop);}

/* ============ 13. 右上角菜单（下拉 + 外点关闭） ============ */
const menuWrap=document.querySelector('.menu-wrap'),menuBtn=document.getElementById('menuBtn');
function closeMenu(){menuWrap.classList.remove('open');menuBtn.setAttribute('aria-expanded','false');}
menuBtn.addEventListener('click',e=>{e.stopPropagation();
  const open=menuWrap.classList.toggle('open');
  menuBtn.setAttribute('aria-expanded',String(open));});
document.addEventListener('click',e=>{if(!menuWrap.contains(e.target))closeMenu();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();});
menuWrap.querySelectorAll('.menu-pop a').forEach(a=>a.addEventListener('click',closeMenu));

/* ============ 12. BOOT ORDER ============ */
document.querySelectorAll('.background').forEach(v=>{try{v.pause();v.currentTime=0;}catch(e){}});
resizeCanvas();render();
requestAnimationFrame(draw);requestAnimationFrame(cursorLoop);
runPreloader();
</script>
</body>
</html>
