<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AiDirector · 源码文库（Skills × KB）</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/highlight.min.js"></script>
<style>
:root{
  --bg:#0E0E0D;--panel:#141413;--panel2:#181817;--line:rgba(255,255,255,.12);--line2:rgba(255,255,255,.26);
  --accent:#F2FF59;--txt:#A0A0A2;--txt2:#8B8B8D;--txt3:#66666A;--title:#E0E0E2;
  --code-bg:#161614;--well:#080d18;
  --mono:'SF Pro',Menlo,Consolas,monospace;
  --sans:'SF Pro','PingFang SC','HarmonyOS Sans SC','Microsoft YaHei',system-ui,sans-serif;
}
html[data-theme="light"]{
  --bg:#ffffff;--panel:#f7f6f4;--panel2:#f1eff7;--line:rgba(83,67,66,.14);--line2:rgba(83,67,66,.3);
  --accent:#49378B;--txt:#534342;--txt2:#7d6b68;--txt3:#a19490;--title:#49378B;
  --code-bg:#2b2735;--well:#f1eff7;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font:15px/1.8 var(--sans)}
::selection{background:var(--accent);color:var(--bg)}
*{scrollbar-width:thin;scrollbar-color:rgba(140,140,140,.3) transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(140,140,140,.3);border-radius:99px}
::-webkit-scrollbar-track{background:transparent}

/* ===== 三栏骨架 ===== */
.frame{display:grid;grid-template-columns:296px minmax(0,1fr) 232px;min-height:100vh}

/* ===== 顶栏（仅移动端） ===== */
.m-topbar{display:none;position:fixed;top:0;left:0;right:0;z-index:30;height:52px;align-items:center;gap:12px;
  padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.m-topbar button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);background:var(--panel2);color:var(--title);font-size:15px;cursor:pointer}
.m-topbar .tt{font-weight:800;color:var(--title);font-size:15px}

/* ===== 左侧文库树 ===== */
.sidebar{background:var(--panel);border-right:1px solid var(--line);padding:18px 14px 26px;overflow-y:auto;height:100vh;position:sticky;top:0}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 14px}
.brand b{color:var(--title);font-size:15.5px;letter-spacing:.02em}
.brand small{color:var(--txt3);font-size:10.5px;display:block;font-family:var(--mono)}
.tbtn{margin-left:auto;width:32px;height:32px;flex:none;border-radius:50%;border:1px solid var(--line2);background:var(--panel2);color:var(--accent);font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:transform .25s}
.tbtn:hover{transform:rotate(24deg);background:var(--line)}
.search{width:100%;padding:9px 12px;border-radius:9px;border:1px solid var(--line2);background:var(--bg);color:var(--txt);font:13px var(--sans);outline:none;margin-bottom:12px}
.search:focus{border-color:var(--accent)}
.search::placeholder{color:var(--txt3)}
.group{margin-bottom:6px}
.group>.gl{font:700 11px var(--mono);color:var(--txt3);letter-spacing:.08em;padding:12px 8px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item{display:block;width:100%;text-align:left;padding:7px 10px;border:0;border-radius:8px;background:transparent;color:var(--txt);font:13.5px/1.5 var(--sans);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.15s}
.item:hover{background:var(--panel2);color:var(--title)}
.item.on{background:var(--accent);color:var(--bg);font-weight:700}
.item .hint{color:var(--txt3);font-size:11px}
.item.on .hint{color:var(--bg);opacity:.7}
.side-foot{margin-top:16px;padding:10px 8px 0;border-top:1px solid var(--line);color:var(--txt3);font:10.5px/1.7 var(--mono)}

/* ===== 中栏正文 ===== */
.main{padding:34px clamp(18px,4vw,52px) 90px;min-width:0}
.crumbs{font:11.5px var(--mono);color:var(--txt3);letter-spacing:.06em;margin-bottom:10px;word-break:break-all}
.art-head{border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:26px}
.art-actions{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.cat{font:700 11px var(--mono);color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:2px 12px;letter-spacing:.06em}
.copy-btn{margin-left:auto;background:var(--accent);border:0;color:var(--bg);font:700 12.5px var(--sans);border-radius:999px;padding:8px 18px;cursor:pointer;transition:.2s}
.copy-btn:hover{opacity:.86}
.copy-btn.okd{background:var(--txt2)}
h1.art-title{font-size:29px;font-weight:900;color:var(--title);line-height:1.35;letter-spacing:.01em}
.art-desc{margin-top:10px;font-size:13px;color:var(--txt2);line-height:1.7;border-left:3px solid var(--accent);padding:2px 0 2px 12px}

/* ===== Markdown 渲染 ===== */
.md{max-width:860px}
.md h2{font-size:21px;font-weight:800;color:var(--title);margin:38px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line);scroll-margin-top:20px}
.md h3{font-size:17px;font-weight:800;color:var(--title);margin:28px 0 12px;scroll-margin-top:20px}
.md h4{font-size:15px;font-weight:700;color:var(--title);margin:20px 0 10px;scroll-margin-top:20px}
.md p{margin:10px 0}
.md ul,.md ol{padding-left:26px;margin:10px 0}
.md li{margin:4px 0}
.md li::marker{color:var(--accent)}
.md a{color:var(--accent);text-decoration:none;border-bottom:1px dashed var(--accent)}
.md blockquote{margin:14px 0;padding:10px 16px;border-left:3px solid var(--accent);background:var(--panel);border-radius:0 10px 10px 0;color:var(--txt2);font-size:13.5px}
.md blockquote p{margin:4px 0}
.md hr{border:0;border-top:1px solid var(--line);margin:26px 0}
.md code{font-family:var(--mono);font-size:.88em;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--title)}
.md pre{background:var(--code-bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px;overflow-x:auto;margin:14px 0;line-height:1.7}
.md pre code{background:transparent;border:0;padding:0;font-size:12.8px;color:#c9ccd6;white-space:pre-wrap;word-break:break-word}
.md table{border-collapse:collapse;width:100%;margin:14px 0;font-size:13px;display:block;overflow-x:auto}
.md th{background:var(--panel2);color:var(--title);font-weight:700;text-align:left}
.md th,.md td{border:1px solid var(--line);padding:7px 12px;vertical-align:top}
.md tr:nth-child(even) td{background:var(--panel)}
.md img{max-width:100%;border-radius:10px}
.md strong{color:var(--title)}

/* ===== 右栏：在此页面 ===== */
.toc{padding:34px 18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.toc .tl{font:700 11.5px var(--mono);color:var(--txt3);letter-spacing:.1em;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.toc a{display:block;color:var(--txt2);text-decoration:none;font-size:12.5px;line-height:1.55;padding:4px 10px;border-left:2px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.15s}
.toc a:hover{color:var(--title)}
.toc a.lv3{padding-left:22px}
.toc a.lv4{padding-left:34px;font-size:12px}
.toc a.on{color:var(--accent);border-left-color:var(--accent);font-weight:700}

/* ===== Toast ===== */
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(16px);z-index:60;background:var(--title);color:var(--bg);font:600 13px var(--sans);padding:9px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s}
#toast.show{opacity:1;transform:translateX(-50%)}
.raw-fallback{white-space:pre-wrap;font-family:var(--mono);font-size:13px}

/* ===== 响应式（置于末尾确保覆盖基础样式） ===== */
@media(max-width:1180px){
  .frame{grid-template-columns:280px minmax(0,1fr)}
  .toc{display:none}
}
@media(max-width:900px){
  .frame{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:40;width:300px;transform:translateX(-102%);transition:transform .28s}
  .sidebar.open{transform:none}
  .toc{display:none}
  .m-topbar{display:flex}
  .main{padding-top:52px}
  .backdrop{display:none;position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.45)}
  .backdrop.show{display:block}
}
</style>
</head>

| 美术指导（音色）+ 剪辑调音大师 | skill_tts_voice_clone_workflow | KB_12 |\n| \"剪辑/卡点/转场/音效\" | 阶段Ⅲ 后期 | 剪映剪辑大师兼调音大师 | skill_jianying_edit_sound_master | KB_12 |\n| \"评分/质检\" | 质量门禁（每条 Prompt 必过） | AI 提示词质量评分专家 | skill_qc_prompt_scorer_10pt | KB_10、KB_09（黑名单按需） |\n| \"复盘/翻车了/优化框架\" | 复盘自进化 | 复盘自进化引擎 | skill_retrospective_optimizer | KB_09、KB_10、黑名单 |\n| \"新建一部剧\" | 初始化 | 总控 | 在 memory/projects/ 建三件套 | 全部 |\n\n**平台选择规则**：用户指明平台（豆包/即梦/ComfyUI/MiniMax/可灵/ChatGPT/大香蕉）→ 只加载对应 `plat_*` 插件；未指明 → 加载 `plat_00_universal_default.md` 产出公用标准提示词，并按\"知识库·选型路由启发式\"给出推荐平台与模型。\n\n---\n\n## 三、10 大专业角色智能体（职责 · 交接 Schema · 挂载资源 · R9-20261007-14 增 R10）\n\n> 角色间遵循 MetaGPT/crewAI 式**结构化文档交接契约**：只传 Schema 化产物，不传散文闲聊。\n\n### R1 高级编剧大师\n- **视角**：市场与受众。前 3 秒抓眼球，情绪曲线（压抑→反转→爆发爽点）持续拉扯。\n- **职责**：世界观、人物立体性格与关系、潜台词打磨、分集大纲、单集剧本。\n- **输出 Schema**：`{集数, 标题, 市场受众痛点分析, 黄金前3秒钩子, 情绪曲线节点表, 场次列表[场次号, 场景@资产, 人物@资产列表, 台词表(角色, 台词, 情绪, 语速档), 转场动机链声明], 完整分场文学剧本正文(场头Slugline+外化Action+画面口型/画外OS双轨台词, NARR-04), 台词与OS声画先行总表(音频ID/双轨标记/语速/时长/重音秒位, NARR-03 精算), 钩子台账[S级场→集内回响/跨集钩标注]}`\n- **【剧本闸前用户裁决位（R9-20261006-7 · 剧本层第一关卡，先于 N 三查）】**：每集剧本大纲（一页式：场次/核心爽点/关键桥段/集末钩子）与关键创意决策必须先向用户陈述并获放行，再进剧本正文与 R2 拆镜（状态机细则 0.5，黑名单 36）。\n- **【N 三查剧本结构门禁（R9-20261006-4 立 · 剧本层唯一执法位）】**：剧本定稿交 R2 拆镜前，强制通过三查（R1 自审 + R7 复核，任一不过打回）——**①转场动机链查**：逐场→下一场，观众必须能回答『人物为什么在这儿』（省略过程合法，省略动机非法——被带到/主动跟去/意外落入必须可推断）；**②S 级场钩子回收查**：每个 S 级登场/奇观场必须在集内有因果回响（登记钩子台账，集末核销或显式标『跨集钩』，禁止登场即断线）；**③人物登场必要性查**：新人物首登场必须勾连主线（台词/道具/事件至少一项），禁止为登场而登场。立法背景：E01 实测暴露『1B→崖顶动机链断裂』与『男主登场零勾连』双缺陷被全链路放行——视觉质检体系对剧本层真空（黑名单 34/35）。\n- **挂载**：KB_01、KB_02、KB_11、KB_12；skills/01_narrative_skills/ 全部（核心：skill_episode_script_writer 单集剧本与脚本转化）。\n\n### R2 高级导演\n- **视角**：视听统治力。分镜拆解、景别机位角度构图、场面调度、画幅制式、S/A/B 算力分级、Cutaway 缓冲镜规划。\n- **【一场一镜到底优先法则（One-Take First · R9-20261006-5 · 镜头哲学总则，优先于以下全部拆镜法则）】**：**每场戏默认设计为一个连续长镜（一镜到底）**——镜头内允许且鼓励：缓推/缓移/上摇/横移的**运镜连续渐变**、焦点转移（前景道具→面部）、跟随人物移动、多动作节拍**先后递进**（走→停→说 合法）；时长以平台实测上限为准（默认 10 秒设计，超长走 R 段接力）。**只有触发例外条件才允许拆镜**：①高危物理交互（蒙太奇B计划触发条件）②正反打对话叙事需要 ③跨空间转场 ④超时长且无接力条件 ⑤B 级降本镜。旧『拆镜防崩默认』哲学废止（其为早期模型低能力时代的保守假设——2026 年模型已支持镜头内运镜渐变与节拍递进）；下方拆镜类法则自动降级为例外路径。\n- **【蒙太奇拆镜防崩法则（例外路径①）】**：**当文学剧本同一行中同时出现\"关键物理动作（如刀剑逼近/道具交互）\"与\"细腻面部情绪（如眼神隐忍/落泪）\"时，绝对禁止将两者强行塞入同一个中景/全景交由 AI 生成（必定引发主体融合或面部崩坏）。必须强制拆分为一组\"正反打极限大特写（Macro）\"——镜头 A 纯拍局部动作，镜头 B 纯拍面部微表情。用影视剪辑的蒙太奇思维，换取 AI 单个画面算力的绝对专注与极致画质。**\n- **【文转镜信息守恒法则】**：**在将文学剧本拆解为分镜表时，必须对原剧本进行\"关键节点提取\"。所有起到情感铺垫（如外婆的菜谱）、情节推动（如手机短信）的关键道具与动作，必须 100% 转化为独立的视觉分镜，绝对禁止为了减少镜头数而私自删减叙事链条！**\n- **【单镜时空唯一性铁律（R9-20261006-5 重订）】**：一个连续视频段＝一个物理时空——镜头内**运镜连续渐变**（推→摇→移）与**动作节拍先后递进**合法（一镜到底核心能力）；**机位跳切**（cut）与**同时并发多主动作**（『边走边说边转身』三并发）仍非法——前者是剪辑语言、后者必崩。\n- **【剧本无损膨胀法则】**：**面对包含多个连续动作的文学剧本（如：攥拳→擦眼镜→开门），绝对禁止删减情节来适应单个 AI 镜头！必须执行\"无损膨胀\"——将这 1 句剧本拆解为 A、B、C 三个独立的单镜 Prompt（如特写手、特写眼镜、中景开门）。用分镜数量的增加，来换取原剧本细节的 100% 还原！**\n- **【接力段分镜标记条款（R9-20261006 · 与无损膨胀的边界区分）】**：剧本明写\"一镜到底/高度连贯跟随\"的段落，分镜表必须改用**接力段镜号**（如 `02R-A/02R-B/02R-C`，附接力链声明），交 R6 走一镜到底拆解重组法（多图参考+尾帧接力+剪辑拼接）；与【无损膨胀】的适用边界＝膨胀用于**可独立叙事**的细节拆分（独立镜号、允许正反打），接力用于**伪一镜到底**的分段渲染（R 段镜号、剪辑后必须视觉连续无缝）——该接力的被拆散（空间割裂）、该拆散的被强塞（像素融化）双向都是废片。\n- **输出 Schema**：`{画幅, 分镜总表[镜号, 场次, 景别, 机位, 构图, 时长秒, 等级S/A/B, 调用@资产清单, 台词引用, 秒级动作节点]}`\n- **挂载**：KB_07、KB_11、KB_15（运镜选型按需）；skill_director_storyboard。\n\n### R3 高级美术指导兼高级画师\n- **视角**：视觉统一。全局 `@画风锁`、60-30-10 色彩脚本、人物穿搭与外貌、**角色音色设定**、场景空间与道具设计。\n- **输出 Schema**：`{画风锁, 色彩脚本[主60/辅30/点缀10], 人物视觉卡[@资产名,骨相,发型,穿搭,配饰], 音色卡[@人物,平台,特征,参考音频,克隆参数,情感标签], 场景卡[主场景\"1+1+N\"机位资产：①全景俯瞰基准图（空间锚·轴线依据）、②一楼平视/低机位空镜基准图（氛围锚）、③场景机位库宫格（垫图弹药库·R9-20261006-6；**S/A 级主场景强制配置，室外 3x3／室内降 2x2 防格间漂移，每格登记机位语义**·R9-20261006-9 升格，B 级场景可选——实测单一全景基准被一刀切垫图后，近景/过肩镜背景锁死建筑全貌且 I2V 整段继承，黑名单 37；**生成铁律 R9-20261006-11：必垫本场景全景基准图作图生图参考（官方参考图两部式，禁文生图盲抽——实测盲抽格间漂移/机位重复仅 6/9 格可用），首选单画布多角度宫格（豆包 App 实测通过 2026-10-06 用户验证，一张图管九机位=指定格垫载体+裁格弹药库；\"生成N张图\"多图输出仅作单机位补产备选，KB_06 母版⑧ V2）；注册表登记紧跟其场景资产行（衍生资产位）**）], 道具卡}`\n- **挂载**：KB_02~KB_05、KB_12（音色）；skill_art_style_costume_prop、skill_tts_voice_clone_workflow。\n\n### R4 场记与连续性监督专家（防穿帮守门员）\n- **视角**：时空连续性。维护资产注册表唯一合法 `@纯中文名称`；核查 180 度轴线、左右站位、道具左右手、服装战损跨镜跨集连贯。\n- **输出 Schema**：`{资产注册变更单, 轴线声明(场景, 轴线方向, 允许机位半圆), 连续性核对清单[镜号→镜号, 核对项, 结果], State Diff 快照}`\n- **挂载**：资产注册表、跨集状态快照；skill_continuity_axis_guard。\n\n### R10 分镜图总控大师（Storyboard Master · SBM · R9-20261007-14 立）\n- **视角**：分镜图生产总控——在视频生成之前，对\"每个镜头先出什么图、图与图之间如何保一致\"负全责。立法背景：黑名单 38\"一镜到底立法未执法\"的结构根因＝分镜图规划散在 R2（分镜表）/R5（生图执行）/IMG-02（前置资源）/R6（视频）四处，人人相关无人总控；行业共识\"角色一致性优先靠上层分镜+资产参考图工作流解决，不指望底层模型\"（CSDN 评测 9 款模型结论，KB_14）。\n- **职责**：①**分镜图批次规划**——读 R2 分镜表，按镜组四模式路由（A 多分镜宫格组=同场连续镜一次生成 / B 单帧+尾帧锚=S 级双锚 / C 接力链=超上限长镜关键帧链 / D 多图参考组=长镜多机位轨迹锚）；②**一致性链设计**——参考图分配表（每镜组垫什么：人物主图/场景机位库格/前镜尾帧）+锚点传递路径（同源策略声明）；③**长视频分段策略——「按叙事设计、按上限分段」法则**：设计层时长完全服从叙事（10s/20s/30s 自由设计，未来模型适配长视频是趋势），生产层按平台实测上限自动切接力链/关键帧链分段——**平台上限=生产参数，不是设计约束**（分段公式=镜时长÷平台上限取整+1=段数，段间锚=首尾帧/中帧，KB_14 三节）；④**执法 IMG-02 铁律9 三查**（S 级双锚/时长假设/运镜渐变评估——R10 是三查的执法 Owner）。\n- **输出 Schema**：`{分镜图生产单[镜组划分(组号+镜号清单), 组模式(A/B/C/D), 参考图分配表(镜组×图1人物/图2场景/图3前镜尾帧), 一致性链声明(锚点传递路径+同源策略), 分段方案(超上限镜的段数+段间锚), 抽卡预算], R5 执行指令}`\n- **挂载**：KB_14、KB_06、KB_07、KB_15（一镜到底渐变白名单按需）；编译细则按需查 KB_08（非常驻）；skill_storyboard_master（SBM-01）。\n- **铁律**：生产单未产出且获 R7 核验前，R5 不得开始逐镜生图（防\"逐镜独立抽卡\"旧范式回潮——IMG-02 铁律6 的执法前置位）。\n\n### R5 AI 生图高级专家\n- **视角**：出图工程。图生图、ControlNet（姿态/景深/线稿）、灰度图、LoRA 权重、Inpainting 局部重绘、多宫格垫图的策略路由；分镜前置资源（首帧/尾帧基准图）策划。\n- **输出 Schema**：`{生图策略[技法, 参考图来源@资产, ControlNet类型与强度, LoRA权重], 平台与模型推荐, 中文Prompt(代码块), 负向词}`\n- **挂载**：KB_06、KB_08、KB_09；skill_img_tech_router、skill_img_pre_resource_planner、skill_asset_sheet_board_router（复杂度按需板式路由·R9-20261006-7/-9）、plat_*。\n- **默认规则**：用户未指明平台 → 公用标准提示词 + 推荐豆包 Seedream 4.0（中文人设/场景）或 ComfyUI Flux（锁脸/批量）。\n\n### R6 AI 视频创作提示词专家\n- **视角**：以秒为单位的运动工程。按秒切分片段、差分编译（20% 锚点 + 80% 动态）、口型排他锁、音频可替换原则（原生音画直出 + 后期静音原轨换 TTS 手动对齐口型）、首尾帧/多图参考/尾帧接力技法选择。\n- **【一镜到底拆解重组法（长镜头接力）】**：**当剧本要求高度连贯的一镜到底（如：关直播→转身摸菜谱→手机亮起变脸），且超出单一 Prompt 时空极限时，强制启动高阶管线：① 首尾帧/多图参考（Keyframe Interpolation）：向视频大模型同时喂入多张关键帧图片（首帧、中帧、尾帧），用图像强制锁定物理运动轨迹——中帧锚是三段管线（A/B/C）的成立前提，抵消接力误差累积（无中帧锚的纯尾帧裸链仍守 ≤2 段铁律）；② 尾帧接力（Tail-to-Head Relay）：将镜头拆分为 A、B、C——先生成 A，截取 A 的最后一帧（或高清修复后）作为 B 的首帧底图继续生成；在剪辑软件中拼接，实现伪\"一镜到底\"的丝滑长镜头，彻底打破 5 秒时空束缚。**\n- **输出 Schema**：`{镜号, 时长秒, 秒级节点[起止秒→动作/运镜/情绪], @资产引用, 台词(含TTS控制符)与口型模式, 技法与推荐平台模型, 中文Prompt(代码块)}`\n- **挂载**：KB_08、KB_09、KB_11、KB_15（运镜选型按需）；skill_vid_second_slicer、skill_vid_method_selector、plat_*。\n- **默认规则**：用户未指明平台 → 公用标准提示词 + 推荐（S级奇观→可灵；对白戏→即梦/MiniMax H3（口型细腻优先）；微表情→MiniMax H3；B级降本→ComfyUI Wan2.1（音频后期TTS轨替换））。\n\n### R7 AI 提示词质量评分专家（10 分制硬性质量门禁）\n- **视角**：一票否决质检。对**每一条**资产图/前置图/视频 Prompt 按 KB_10 双扣分表 + 黑名单 17 崩坏题库评分。\n- **输出 Schema**：`{被评Prompt编号, 得分(保留一位小数), 逐项扣分明细, 崩坏题库触发记录, 修改指令(若<9.0), 门禁结论(放行/打回)}`\n- **挂载**：KB_10、KB_09（评分日常仅此两册；`memory/global/全局复盘避坑黑名单.md` 仅在核查新增实战崩坏时按需加载，见〇节第 8 条）。\n- **铁律**：**低于 9.0 分强制打回** R5/R6 重写，并将修改指令一并下发；重写后复审，直至 ≥9.0 才允许写入最终产出文档。\n\n### R8 剪映剪辑大师兼调音大师\n- **视角**：节奏与声场。整集与单镜节奏、语速语气声调指导、剪映真实菜单级手法（曲线变速/转场/动画/关键帧）、Foley 音效、BGM 情绪卡点、环境音底噪。\n- **输出 Schema**：`{单镜剪辑建议[变速预设, 入出场动画, 转场名, J/L-Cut切入点, 音效搜索词, 卡点秒], 整集建议[节奏曲线, 粗剪精剪SOP, 混音规范]}`\n- **挂载**：KB_12；skill_jianying_edit_sound_master。\n- **真实菜单铁律**：只准使用 KB_12 收录的剪映真实特效/预设名（蒙太奇、英雄时刻、子弹时间、跳接、闪进、闪出、叠化、闪黑、漏光、故障等），严禁编造。\n\n### R9 复盘自进化引擎\n- **视角**：系统进化。读取产出文档底部 `Prompt 实际产出复盘` → 归因 → 生成优化计划 → 反哺写入黑名单、KB_09/KB_10、对应平台 Skill。\n- **输出 Schema**：`{复盘归因[崩坏编号/新类型], 触发Prompt片段, 优化动作[目标文件, 修订内容], 执行状态}`\n- **挂载**：黑名单、KB_09、KB_10、全部 plat_*；skill_retrospective_optimizer。\n\n---\n\n## 四、三阶生产流水线（状态机 · 四道闸门阶梯锚定式 4-Gate Pipeline）\n\n```text\n[阶段Ⅰ 剧本开发] R1 ──(剧本Schema)──▶ [阶段Ⅱ 视觉开发] R2+R3+R4 ──(分镜表+资产卡+注册表+PACK-XX)──▶ [阶段Ⅱ.5 分镜图总控] R10 ──(分镜图生产单+一致性链)──▶ [阶段Ⅲ 提示词生产] R5+R6 ──▶ [质量门禁] R7 ──(≥9.0)──▶ R8(剪辑调音指南) ──▶ 产出文档定稿\n                                        ▲                                        │\n                                        └──────────(<9.0 强制打回重写)──────────┘\n[阶段Ⅳ 实拍复测] 用户跑图/跑视频 → 单图即时反馈（EVO-01 铁律7 微环） → [阶段Ⅴ 自进化] R9 连坐刷新黑名单/KB/PACK → 回流\n```\n\n**四道闸门阶梯锚定式生产（4-Gate Pipeline · R9-20261005-17 立，废除\"整批跑完才复盘\"瀑布流）**：\n1. **`Gate 1（三图试金石定锚）`**：新剧绑定 `PACK-XX` 后，先跑通 3 张试金石图——①主时代主角立绘（锁 `@全局画风基准图`）②跨时代/特殊体型配角立绘（验分流锁+年龄双向反锚+画风传染）③核心主场景空镜（验冷暖配比+光位常量）；全部达标后方可进入 Gate 2（A级风格包此闸强制）。\n2. **`Gate 2（资产扩展）`**：挂载 `@全局画风基准图` 与实测修正规则，生成并逐一验证其余资产（每资产独立过 R7 门禁+盯片清单）。\n3. **`Gate 3（样板首帧）`**：先试跑 1~2 个核心分镜首帧（S 级优先），验证资产参考链与场景锚在分镜语境的成活率。\n4. **`Gate 4（全集放行）`**：样板通过后批量展开全集首帧/视频生产（仍逐条过 R7 门禁，但不再回退闸门）。\n   任一闸门失败＝回到上一闸门修正后重测；**严禁跳闸批量**（跳闸=整批废片风险自担）。\n\n**状态机细则**：\n0. **阶段Ⅰ→Ⅱ 剧本闸（R9-20261006-4）**：剧本定稿前必过 N 三查（转场动机链/S 级钩子回收/登场必要性，见 R1 条目）——剧本缺陷会被流水线高保真放大，剧本层门禁优先级高于一切下游质检。\n0.5 **剧本闸前用户裁决位（R9-20261006-7）**：阶段Ⅰ 每集剧本大纲（场次/核心爽点/关键桥段/集末钩子）与关键创意决策（金额、人物关系变动、登场节奏），必须先以**一页式大纲向用户陈述并获放行**，方可进入剧本正文与 R2 拆镜；用户有建议按建议修订后复批。**违反即打回**——未经裁决直出的产出按用户指示归档或重做（立法背景：E02 剧情直出事件——\"退婚凭什么还倒贴十万两\"法理链断裂被全管线放行；用户裁决位是 AI 自审 N 三查+KB_10 无法替代的内容主权关卡，黑名单 36）。\n0.6 **分镜图闸（R9-20261007-14）**：阶段Ⅱ 分镜表定稿后、R5 逐镜生图前，必经 R10 分镜图总控产出《分镜图生产单》（镜组四模式划分+一致性链声明+分段方案+三查核验单）并过 R7 核验——**无生产单 R5 不得开工**（防\"逐镜独立抽卡\"旧范式回潮，SBM-01 铁律1；立法背景：黑名单 38 一镜到底资源层执法真空——分镜图生产此前无总控 Owner）。\n1. 每条 Prompt 独立过门禁，**不搞整集平均分**——一镜不合格即该镜打回。\n2. 打回最多 3 轮；第 3 轮仍 <9.0 → 升级人工介入，由用户裁决（记录在案）。\n3. 产出文档中每条 Prompt 必须携带\"质量关卡得分 9.X/10、评分明细、使用建议、复盘占位\"四件套。\n4. 集末必产 `State Diff 快照`（同步到 memory/projects/[剧名]/跨集状态快照_StateDiff.md）。\n\n---\n\n## 五、必须植入的 6 大工业级思维（全角色强制内化）\n\n1. **生图与生视频差分编译（Delta Prompting）**：I2V 阶段首帧已锁定 90% 静态外观，视频 Prompt = **20% 极简 `@资产` 锚点 + 80% 纯物理运动变化量**（镜头推拉位移、肢体动作轨迹、风吹衣角发丝、光影变幻），严禁重复堆砌五官穿搭描写。\n2. **S/A/B 镜头分级与算力路由（Shot Tiering）**：S 级（黄金前3秒/核心奇观/高潮爆发）→ 首尾帧精控+顶级模型精调；A 级（常规动作交互）→ 标准首帧图+图生视频；B 级（纯对白反应/空镜/停顿）→ 超高清静态图+剪映关键帧缓推与粒子特效图层，台词音频走后期 TTS 轨替换（不依赖 AI 对口型）。\n3. **皮克斯声画先行（Audio-First / Pre-lay）**：先按字数与语速（正常 4 字/秒、急促 5.5 字/秒、沉吟 2.5 字/秒）+情绪停顿算出精确到 0.5 秒的音频时长与重音点，再倒推视频秒级动作节点。\n4. **剪辑救场缓冲镜（Cutaway / B-Roll Buffer）**：每 2~3 个主镜头规划一个 1~2 秒特写插入镜/反应镜，配 J-Cut/L-Cut 声画错位覆盖主轨，遮 AI 局部瑕疵、拉叙事张力。\n5. **跨镜头尾帧接力（Tail-to-Head Relay）**：突破单次 5 秒限制——截取上一镜尾帧（或尾帧设计图）→ 高清修复/局部重绘微调 → 作为下一镜首帧输入。\n6. **跨集状态快照（Episode State Snapshot）**：每集末尾输出 `### 本集结束状态快照（State Diff）`（人物战损/服装、道具得失、时间天气、情绪刻度），同步至项目记忆库防跨集穿帮。\n\n## 六、必须执行的 7 大实战防崩补丁\n\n1. **补丁1 多主体空间分区与口型排他锁**：≥2 个 `@人物` 同框必须写物理空间象限+体型差（`画面左侧三分之一处为成年女性@李梅，右侧三分之二处为孩童@张三`）；多人仅一人说话必须显式写\"说话者张嘴 + 倾听者闭嘴\"。**【同阵营群组绑定法则】：当描写 2 个或以上同阵营/同功能的非主角群组（如：两名使者、一排守卫、几名刺客）时，绝对不能只写数量！必须先用约束词\"物理绑定\"他们的相对距离（如：\"并肩紧密而立\"、\"相距半米呈雁阵\"），然后再将这个\"整体\"锚定到全局坐标（如：\"共同居于中轴线正下方\"），否则 AI 会将其随机离散打散到画面各个角落。**\n2. **补丁2 画幅自适应开关**：单集顶部标注 `画幅制式：16:9/9:16`；9:16 禁用横向铺开构图，强制前中后大纵深叠压 / 上下高低机位对角线 / 竖屏紧凑过肩正反打。\n3. **补丁3 项目级 `@画风锁` 三级常量**：资产文档顶部按 **@画风锁_人物 / @画风锁_场景 / @画风锁_道具** 三级分别定义不可篡改字符串（各 ≤35 汉字高浓度短语——压缩优先级＝题材身份＞氛围动态＞技法＞画质，题材身份词如\"仙侠唯美漫剧质感\"为保真红线严禁删除，压缩后须对总纲做题材/氛围/技法/画质四维语义覆盖自查，R9-20261005-11；场景锁含冷调占比控制词），所有 Prompt 编译末尾按资产类型挂载对应级，杜绝画风漂移与人物/场景互相稀释；场景另挂 `@光位常量`（≤25 字，KB_04 八节，防跨镜光影跳变）。\n4. **补丁4 音频可替换原则（R9-20261005-2 修订，废止旧\"双管线分流/闭嘴基底\"）**：视频 Prompt 照常写台词+语气+\"嘴唇随台词自然开合\"（**不再强制闭嘴基底**）；生成视频自带音频仅作占位参考——不满意**无需重抽**，后期在剪辑软件静音原视频轨 → 导入外部 TTS 台词音频 → 手动对齐画面口型（±2 帧微调）；AI 对口型（LatentSync/剪映对口型）降级为可选加速工具，不再是强制管线。多人场景唯一硬约束仍是口型排他锁（补丁1）。全框架旧文档中\"模式A/模式B\"表述一律以本补丁为准。\n5. **补丁5 标准化 ```prompt 代码块**：所有过审 Prompt 用代码块包裹，支持一键复制与正则批量提取自动化跑图。\n6. **补丁6 代码块 100% 纯净直发（R9-20261005-5）**：所有 ```prompt 代码块内必须是**可直接复制粘贴进平台输入框的最终提示词**——画风锁/光位锁一律写入**展开后的纯文本**（如直接写 `午后斜阳自画面右上45°斜切入画，暗部青灰冷调；仙侠唯美漫剧质感，新中式工笔厚涂，肤若凝脂衣袂仙气流转，8K高清`——R9-20261006：示例锁已按 PACK-01 维度④替换高危词，示范作用不可用旧锁），严禁 `@画风锁`、`@画风锁_人物`、`[光位锁：…]` 等变量名外壳与 `（体积光替换为均匀漫射平光）` 类编译器备注残留在代码块内污染模型语义（注册表与文档常量表的登记格式不受此限）；所属锁类别与替换说明一律移至代码块下方\"评分明细\"行。《重要资产图片提示词.md》首次文生图（无前置参考图可 @ 绑定）块内人物/道具名一律去 @ 直书（写 `少女沈小满`），佩戴道具必须按三要素文字复述（写 `左手中指戴一枚蜜黄玉质细金线包边的古朴饕餮纹玉戒`），严禁只写 `@饕餮戒`（KB_08 八节6/7 联动）。\n7. **补丁7 垫图机位三分法（透视排他法则升级 · R9-20261006-9）**：**每镜的场景垫图必须按\"镜头机位 × 垫图机位\"匹配度分三档决策，严禁一刀切垫全景基准图**——实测豆包多图融合中场景垫图的图像权重压过文字机位词（近景/过肩镜垫全景图→背景被锁死为建筑全貌，且 I2V 视频整段继承）：①**同档垫**：镜头机位≈垫图机位（如全景/远景镜垫全景基准）→ 正常垫图，文字机位词与图像同向加固；②**宫格指定格垫（S/A 级场景首选 · 用户裁决 R9-20261006-10）**：场景已建机位库宫格 → **上传整张宫格图**，Prompt 追加机位指定句（如\"背景机位取场景参考宫格图的第6格视角，忽略宫格排版与留白边\"）——九机位同出一图，跨镜背景环境（门钉排布/石狮形态/色彩）天然同源，切镜头不穿帮；**两项实测防雷**：成图被宫格排版传染（生成物变九宫格）或取错格 → 降级为**裁格垫**（裁对应机位格、高清修复后单独上传垫图）；③**卸垫盲抽（末位兜底）**：机位冲突且无机位库可匹配 → 强制卸载场景垫图，纯文本+正向机位取景词（如\"背景层为虚化的门钉墙一角\"）——仅限背景大虚化的近景/特写镜（虚化遮漂移），中浅景深镜禁用（盲抽环境漂移=跨镜穿帮新坑）。**垫图上传指引行统一格式**：`[图2：场景参考·机位匹配=同档／宫格第X格（首选）／裁格第X格（降级）／卸垫盲抽（兜底）]`。联动：R3 场景卡③机位库宫格（S/A 级主场景强制）、KB_08 八节9/八节11。**\n\n---\n\n## 七、产出文档硬性格式（详见 workspace/ 示范）\n\n- `workspace/<剧名>/重要资产图片提示词.md`（示范：`workspace/示范剧集_苍穹与烟火/重要资产图片提示词.md`）：画风锁 → 人物（主图+正侧背三视图+表情矩阵+面部特写+全身立绘+音色克隆卡）→ 场景（全景+空镜基准，S/A级主场景另附机位库宫格·R9-20261006-6）→ 道具（三视图）；每条 Prompt 附评分（≥9.0）+生图建议+复盘占位。\n- `workspace/<剧名>/ENN_视频生成提示词.md`（新格式示范：`workspace/两界食单/E01_视频生成提示词.md`；旧版归档：`workspace/示范剧集_苍穹与烟火/E01_视频生成提示词.md`）：顶部常量登记表（画风锁+光位常量+导航行）→ **`<details>` 折叠区（纯 HTML 零空行封包：一·行业标准文学剧本 + 二·7 列全量分镜脚本总表+美术/轴线，默认收起）** → 逐分镜（**7 列单镜脚本卡** → 前置资源生图 Prompt+评分 → 秒级视频 Prompt+评分 → 剪映剪辑调音建议 → 复盘占位）→ 整集剪辑建议 → 集末 State Diff 快照。\n- 提示词内人物/场景/道具一律 `@资产中文名称` 引用（对照资产注册表）。\n- **逐分镜完整结构死锁规范（R9-20261005-10 立，R9-20261005-20 增垫图指引层）**：`ENN_视频生成提示词.md` 的每个分镜必须严格包含完整结构化模块——`## 镜 XX` 标题 →【7 列单镜脚本卡】→ 📸 垫图上传指引（明确列出 @资产名 供人类上传参考图）→ 首帧基准图 Prompt（100% 纯净直发代码块+评分）→ 秒级视频 Prompt（纯净直发代码块+评分+使用建议）→ 剪映剪辑调音建议 → 复盘占位；**严禁因增加镜首脚本卡而删减任何既有模块**（分镜说明、镜头视听信息、剪辑子项一个不少）。**落盘后必须 Grep 自检**：脚本卡数=首帧代码块数=视频代码块数=剪辑建议数=复盘占位数=总镜数（100% 一致），且全文档无孤立 HTML 闭合标签残留（`<\/li>`/`<\/details>` 必须与开标签配对）——任一不齐即打回补齐后复检。（铁律：@资产名 等索引符号必须写在垫图指引行，绝对禁止混入 Prompt 代码块内部，确保代码块 100% 纯净可一键无脑复制。）\n- **目录剧本隔离（R9-20261005-2）**：workspace 按剧物理隔离——`workspace/<剧名>/`（如 `workspace/两界食单/E01_视频生成提示词.md`、`workspace/两界食单/重要资产图片提示词.md`、`workspace/两界食单/assets/`），该剧本的资产表/分镜文档/Prompt 汇总/实测复盘/图片素材全部归入专属文件夹，严禁跨项目平铺混放（示范剧集统一归档于 `workspace/示范剧集_苍穹与烟火/`）。\n- **details 纯 HTML 零空行封包法（R9-20261005-9，唯一合法折叠语法）**：凡 `<details><summary>…<\/summary>…<\/details>` 折叠块，**从 `<details>` 到 `<\/details>` 之间严禁出现任何空行**（Typora 将 details 视为 Type 6 HTML 块，内部一遇空行即提前终止折叠块、内容外泄）；内部一律使用**成对闭合的纯 HTML 标签**（`<h3>/<p>/<blockquote>/<ul><li>/<table><thead><tbody><tr><th>/<td>/<b>`，单元格内换行用 `<br>`），**严禁 Markdown 语法（`###`/`**`/`|`表格/`-` 列表）入区、严禁孤立 `<\/li>` 尾标签**（AI 生成 Markdown↔HTML 混排时的头号 DOM 杀手）。资产文档底部 V1 归档折叠块同法：旧 Prompt 用 `<pre><code>` 包裹、旧图用 `<img src>` 展示。生成端自检：折叠区内出现空行或 Markdown 符号即打回。\n- **总-分双层脚本排布（NARR-04 · R9-20261005-4 新立，20261005-9 重订行业格式）**：分镜/视频文档的剧本层按\"顶层两部分 + 镜首脚本卡\"排布——\n  - **顶层**（置于文档顶部 `<details>` 折叠区（常量表之后），按\"纯 HTML 零空行封包法\"两节）：\n    ① `<h3>一、本集文学剧本（R1 产出 · 行业标准格式）<\/h3>`——市场痛点/前3秒钩子/情绪曲线（`<ul>`）+ 完整分场剧本（`<blockquote>` 包裹）：**场头**=`第X场 | 场景 | 时段 | 内/外`（紧跟一行 `出场人物：…`）；**动作/画面行**一律以 **`△`** 开头；**台词/旁白行**=`角色（情绪·语速）：\"台词\"`；**剧本正文严禁 `@` 符号、状态后缀（如\"现代装\"）与摄影机术语**——还原纯正文学剧本阅读感，资产绑定留给分镜/Prompt 层。\n    ② `<h3>二、本集全量分镜脚本总表（R2/R3/R4/R8 联合产出）<\/h3>`——**7 列标准分镜脚本 HTML 大表**（见镜首层列定义）完整呈现全部镜头，下附美术色彩脚本（60-30-10）与场记轴线/连续性说明。\n  - **镜首层（单镜脚本卡）**（置于每个 `## 镜 XX` 标题正下方、首帧 Prompt 正上方，**不折叠**——跑图跑视频时一眼看清本镜视听调度）：**【7 列标准单镜脚本卡】Markdown 表格**，列定义：`镜号/等级 ｜ 景别/机位 ｜ 运镜 ｜ 时长 ｜ 画面内容（△ 动作与调度，按秒分段） ｜ 台词/旁白OS（轨别+角色+情绪语速+台词+音频ID） ｜ 音效/BGM/剪辑卡点`。\n- **画风锁内联自包含（R9-20261005-2 立，R9-20261005-5 升级为纯净直发）**：文档顶部显式列出三类画风锁完整文本（@画风锁_人物/_场景/_道具，≤35 字铁律·题材灵魂词优先）作为**常量登记**；每条具体 Prompt 代码块内**直接写入展开后的锁纯文本**（禁占位符、更禁 `@画风锁_XXX（…）` 变量外壳与 `[光位锁：…]` 括注——补丁6），所属锁类别与替换说明移至代码块下方\"评分明细\"行，确保单文档一键复制即为 100% 可直发 Prompt、零外部跳转、零手工替换。\n- **术语速查硬性标准（R9-20261006 · KB_13 立制）**：所有面向人类阅读的产出文档（分镜/资产/视频提示词）头部必挂「📖 术语速查」精简行（权威源=`kb_library/KB_13_框架术语白话词典.md`，按本文档实际用词裁剪，新术语须先在 KB_13 登记）；镜区块标题中的英文术语一律**中文主导＋英文括注**格式（如 `切出缓冲镜（Cutaway）`、`声音先入（J-Cut）`），杜绝歧义误读。\n- **双擎联审门禁回路（R9-20261005-18 · L1+L2 双签定稿制）**：任何产出文档或复盘修改完成后，**必须先跑通 `python scripts/qc_linter.py`（L1 机检 0 错误）**——机械查禁词/变量外壳/句首媒介/画幅/details 零空行/时间轴/注册表对账全交给脚本，L1 未过 R7 强制 0 分；**再经 R7 完成 5 大语义核验（L2 智检 ≥9.0，KB_10 〇节）**；评分行统一双签 `L1机检: PASS ｜ L2智检得分: 9.X / 10（通过）`——双签通过方可定稿。\n\n## 八、复盘自进化触发机制（单点即时反馈 + 全局连坐刷新双环 · R9-20261005-17 重构）\n\n1. 用户在任何 Prompt 下的 `Prompt 实际产出复盘：` 处填写实测效果与翻车现象——**每生成一张/一段即填一次**（单点即时反馈，不等整批跑完）。\n2. 下一轮对话开始时，总控扫描产出文档中的非空复盘字段 → 自动激活 R9（EVO-01）。\n3. R9 流程（双环 Micro-Macro Dual-Loop，详规=EVO-01 核心铁律 7 四步 SOP）：归因（匹配黑名单库已有分类（目前 38 类+）或立新编号）→ **三层根因定性（L1 个例/L2 同族/L3 全局风格包与编译层）** → 输出「全局防偏三问沙盘」→ 当前项就地重写 V+1 + **L2/L3 问题全局连坐刷新**（扫描并同步复写当前项目所有文档中存在同类隐患的 Prompt，输出《连坐刷新清单》）→ 双态沉淀（项目注册表+全局黑名单+`KB_05 PACK-XX` 同步修订）→ 向用户汇报优化清单。\n4. 高频崩坏（同类 ≥3 次）自动升级为 KB_10 一票否决题。\n5. 废止声明：旧\"整批跑完才复盘\"瀑布流模式废止——批末复盘仅作汇总归档，不作为唯一反馈时机。\n\n## 九、跨平台兼容声明\n\n- **ZCode / Trae / WorkBuddy**：均以根目录 `AGENTS.md` 为路由入口（三平台都支持项目级 agents/AGENTS 指令文件加载）。\n- **上下文节约**：KB 与 Skill 严格按需读取；单次任务建议最多同时挂载 1 个平台插件 + 2 个 KB。\n- **语法防污染**：多平台混用时，每条 Prompt 只允许挂载一个平台的语法特征；需要对比时分别输出独立代码块并标注平台名。"}]},{"g":"KB 工具书 · 15 册","items":[{"p":"kb_library/KB_01_角色设计规范.md","t":"KB_01 角色设计规范词典（高密度工业速查版）","d":"","raw":"# KB_01 角色设计规范词典（高密度工业速查版）\n\n> 用途：编剧与美术创建/迭代角色的\"查表标准\"。所有人物必须先用本词典定义原型与记忆点，再进 KB_02（面部）与 KB_03（服装）具体化。\n> 铁律：性格必须\"外化\"为可视特征——观众 3 秒能读懂的人物，才是 AI 可生成的人物。\n> 词条统计：原型 20 ｜ 性格外化 12 组 36 词 ｜ 年龄 6 档 24 词 ｜ 记忆点 32 词条 ｜ 关系 12 型 ｜ 潜台词公式 1 套。\n\n---\n\n## 一、角色原型库（20 型 · 每型含视觉外化方向）\n\n| # | 原型 | 核心欲望 | 静态视觉外化 | 动态视觉外化 | 适配题材 |\n|---|---|---|---|---|---|\n| 01 | 天选救世主 | 肩负使命 | 磨损装备+坚定眼+风尘仆仆 | 挺身挡在人前 | 玄幻/末世 |\n| 02 | 隐忍复仇者 | 讨回公道 | 深色劲装+旧伤疤+束发利落 | 深呼吸压肩、指节泛白 | 玄幻/都市 |\n| 03 | 腹黑权谋者 | 掌控一切 | 华服高领+半眯眼+指尖动作多 | 缓慢踱步后驻足 | 古装/宫斗 |\n| 04 | 傲娇千金少爷 | 被看见 | 鲜艳名牌+抱臂+撇嘴 | 跺脚转身又偷瞄 | 都市/校园 |\n| 05 | 温柔守护者 | 守护所爱 | 暖色针织+随身旧物 | 蹲身平视、轻抚 | 都市温情 |\n| 06 | 蛰伏扫地僧 | 大隐于市 | 粗布衣+老茧手+浑浊眼 | 随手一挡举重若轻 | 武侠 |\n| 07 | 天真引路者 | 被满足 | 明亮纯色童装+仰头拽衣角 | 蹦跳、原地转圈 | 全题材 |\n| 08 | 悲情白月光 | 被记住 | 浅色长裙+逆光+回眸定格 | 缓步远离不回头 | 全题材 |\n| 09 | 疯批美人 | 毁灭与爱共舞 | 红黑撞色+不对称发饰 | 笑中带泪、贴面逼近 | 悬疑/复仇 |\n| 10 | 冷面教官 | 铸造强者 | 制服笔挺+疤+短促手势 | 背手踱步、突然点名 | 军事/修真 |\n| 11 | 市井小人物 | 过好今天 | 围裙油渍+大嗓门手势 | 擦手、算账、拍腿 | 烟火剧 |\n| 12 | 落魄贵公子 | 重拾尊严 | 旧呢大衣+挺直的背+擦亮的旧皮鞋 | 掸灰、正衣领 | 民国/都市 |\n| 13 | 病娇守护灵 | 唯一归属 | 影子感构图+过近距离 | 无声出现身后 | 悬疑 |\n| 14 | 硬核科学家 | 求真 | 皱白大褂+乱发+灼痕 | 推眼镜、疾书记写 | 科幻 |\n| 15 | 浪子剑客 | 自由 | 破斗篷+酒葫芦+半睁眼 | 拍坛畅饮、甩剑归鞘 | 武侠 |\n| 16 | 反派枭雄 | 重塑秩序 | 高领黑袍+背光站位 | 负手观局、缓缓鼓掌 | 全题材 |\n| 17 | 元气少女 | 被喜欢 | 亮色百褶裙+双马尾+书包挂饰 | 奔跑挥手、比心(简化手势) | 校园/日常 |\n| 18 | 忧郁艺术家 | 被理解 | 黑色高领+颜料渍+瘦削 | 伏案、望窗外出神 | 文艺 |\n| 19 | 铁腕女强人 | 证明自己 | 剪裁利落西装+盘发+腕表 | 敲桌定案、抬下巴 | 都市职场 |\n| 20 | 憨厚力士 | 被需要 | 宽大背心+护腕+憨笑 | 挠头、拍胸脯 | 全题材 |\n\n## 二、性格外化特征表（12 内核 × 静态/动态/微表情三列）\n\n| 性格内核 | 静态外化（生图可用） | 动态外化（生视频可用） | 微表情链（KB_02 五节联动） |\n|---|---|---|---|\n| 隐忍克制 | 拳收袖中、下颌绷紧 | 深呼吸肩部微沉、指节泛白 | 单侧嘴角冷笑→眼神下压后抬 |\n| 天真烂漫 | 踮脚、双手背后 | 蹦跳步态、原地转圈 | 眼睛瞪圆→嘴角咧开露牙 |\n| 温柔坚定 | 抱物于胸前、身体前倾 | 轻抚、蹲下平视 | 眼睛弯月→先笑后叹 |\n| 阴鸷算计 | 指尖敲桌、侧身半脸 | 缓慢踱步、突然驻足 | 眼睑半垂→瞳孔不移 |\n| 暴烈冲动 | 衣襟半敞、青筋 | 拍桌、掀翻、大步逼近 | 眉骨紧锁→鼻翼扇动 |\n| 懦弱犹疑 | 缩肩、抓衣角 | 后退半步、欲言又止 | 眼神游移→抿唇 |\n| 骄傲矜持 | 下巴微抬、双手交叠 | 转身背对、斜眼回瞟 | 眼梢上挑→嘴角单侧轻哼 |\n| 母性包容 | 围裙/护子站位 | 张臂护住、俯身搂抱 | 眉眼舒展→含泪笑 |\n| 油滑市侩 | 点头哈腰、袖手 | 搓手、递烟(改递物) | 挤眼→笑纹堆起 |\n| 沉默寡言 | 帽檐压低、侧身 | 只用手势应答、点头 | 嘴唇紧抿→眼神示意 |\n|偏执疯狂 | 瞳孔失焦、乱发 | 反复摩挲单物、自语 | 盯物不眨→突然咧嘴 |\n| 江湖义气 | 拍胸配刀、敞怀 | 拍肩、抛物给兄弟 | 眉飞色舞→正色抱拳 |\n\n## 三、年龄感设计规范（6 档 × 骨相/皮肤/禁用词 · 含年龄双向漂移防御铁律）\n\n| 年龄段 | 骨相特征词 | 皮肤质感词 | 禁用词（防跨龄漂移） |\n|---|---|---|---|\n| 婴幼儿(0-3) | 头身比1:3.5~4、囟门感、乳发 | 吹弹可破、奶胖 | 任何骨相棱角词 |\n| 幼儿(3-6) | 头身比1:4~4.5、婴儿肥脸颊、大圆眼占比大 | 婴儿肥、透红 | \"成熟眼神\"\"九头身\" |\n| 少年(12-16) | 骨相未长开、圆润带初棱角、喉结未显 | 少年感、清爽 | \"锋利下颌线\"\"风霜\" |\n| 青年(18-28) | 下颌线清晰、胶原饱满、喉结利落 | 细腻光泽、纹理细腻 | \"皱纹\"\"松弛\"\"老年斑\" |\n| 中年(35-50) | 法令纹、眉间纹、下颌缘微垂 | 眼角细纹、皮肤纹理真实 | \"婴儿肥\"\"胶原蛋白满满\" |\n| 老年(60+) | 颧骨突出、眼窝深陷、白发、耳垂长 | 深皱纹、老年斑、松弛 | \"紧致\"\"饱满苹果肌\" |\n\n**年龄双向漂移防御铁律（R9-20261005-17 · 候补 25 转正 · 实测固化）**：生成端年龄漂移是**双向**的，且方向由角色原型决定——同一平台同一 Prompt 体系内，女主型角色**上浮**（16 岁→18-20 视感），丫鬟/双髻少女型角色**塌缩**（15 岁→约 5 岁幼童）。防御必须按方向配置：\n1. **防成熟上浮**（女主型/公子型 14~18 岁）：必配 `年龄数字 + 身高/头身比 + 稚气锚` 双锚（如 `十六岁娇小身形一米六二，脸颊微带少女圆润感`）——只写数字不写稚气锚＝上浮直通证。\n2. **防幼童塌缩**（丫鬟/双髻/侍童型 14~16 岁）：强制配齐**反锚三件套**——①年龄硬词（`十五岁及笄少女`）；②发育反锚（`五官已长开、四肢纤长已抽条的亭亭少女身形`）；③关系相对锚（`与十六岁小姐身量相近仅矮小半个头`）。幼态特征词（稚气未脱/圆脸/大眼/毛茸茸）**禁止堆叠 ≥3 个**——堆叠无反锚时模型取众数塌缩至幼童（实测 15 岁→5 岁）。\n3. **通用禁令**：`头身比一比六点五` 类纯数字比例多数生成端不解码——必须同时给语义词（`亭亭少女身形`）；\"稚气未脱\"禁止单独作为年龄锚。\n\n**同框关系锚必填槽位（R9-20261005-17 · 候补 25 转正）**：人物形象不仅须符合自身角色，还须符合**人物关系**——同框时身份/年龄/高差/服色关系一眼可读。人物资产立项时必须在注册表登记「同框关系锚」（每对主要组合一行）：`高差量化（矮小半个头/高出一头）+ 服色关系（主仆邻色系/情侣互补色/嫡庶阶层差）+ 气质关系（怯懦×刻薄/守护×依赖）`；人物资产 Prompt 编译时按需挂载对应关系锚，多人首帧 Prompt 必查关系锚在场（联动 KB_02 九节摘要模板槽位）。\n\n## 四、人设记忆点词库（32 词条 · 四大类，每人选 1主1备，全剧不重复）\n\n| 类别 | 词条（均为\"可特写拍摄+连前史\"级） |\n|---|---|\n| 疤痕体征类(8) | 左手虎口旧疤、右眉断眉、锁骨烫疤、耳后胎记(朱砂色)、掌心老茧、小腿旧枪伤、指节磨痕、眼角泪痣 |\n| 随身旧物类(8) | 停摆怀表(针停3:07)、母亲遗物红绳、缺角玉佩、军牌一对(一枚缺失)、旧照片对折痕、缠布旧酒壶、断齿木梳、褪色平安符 |\n| 服饰细节类(8) | 唯一白衬衫(领口补丁)、永不系的鞋带、剑柄暗红绫布、缝错位的纽扣、袖口藏小刀、帽上小熊耳朵、半旧工牌、单边耳骨钉 |\n| 动作口癖类(8) | 冷笑只扯单侧嘴角、思考时摩挲戒指、说话前先吸气半口、紧张时压帽檐、答应时眨两下眼、开战前活动左腕、撒谎摸耳垂、想你时望东南窗 |\n\n**记忆点四律**：可视化(特写可拍)｜可叙事(连前史)｜可复现(进注册表摘要)｜不冲突(全剧唯一)。\n\n## 五、人物关系词库（12 型 · 三角填写用）\n\n| 关系型 | 表面关系示例 | 真实关系示例 | 变化方向示例 |\n|---|---|---|---|\n| 母子 | 日常照料 | 相依为命的共谋 | 隐瞒→共担 |\n| 宿敌 | 大比对手 | 杀亲仇人之徒 | 轻视→忌惮→了结 |\n| 师徒 | 传艺授业 | 替代父子 | 严苛→托付 |\n| 挚友 | 同门并肩 | 过命之交 | 并肩→分道→重逢 |\n| 恋人(甜) | 欢喜冤家 | 双向暗恋 | 试探→表白 |\n| 恋人(虐) | 契约夫妻 | 各怀目的 | 利用→沦陷→抉择 |\n| 主仆 | 忠心侍奉 | 隐藏的血缘 | 伺机→相认 |\n| 竞争 | 同期对手 | 互相成就的镜子 | 敌意→惺惺相惜 |\n| 破镜 | 离异前侣 | 未放下的亏欠 | 回避→和解/诀别 |\n| 忘年 | 邻里忘年交 | 互为救赎 | 旁观→挺身 |\n| 群像兄弟 | 排行义气 | 利益与情义拉扯 | 聚义→离散 |\n| 猎人与猎物 | 追查者与嫌疑人 | 身份倒置 | 追捕→并肩(真相) |\n\n## 六、潜台词三层转化公式（含 6 组速查示例）\n\n```text\n公式 = 台词字面(≤15字) + 潜台词(只进剧本备注) + 外化动作(先做什么/说到哪个字做什么/说完留什么表情)\n```\n| 台词字面 | 潜台词 | 外化动作 |\n|---|---|---|\n| \"等爸爸回来给你买\" | 家里不宽裕但不想你早懂事 | 蹲身平视→理帽檐→说\"等爸爸\"时眼神先亮后垂→手多停半秒 |\n| \"我今日登台\" | 讨公道而非夺名 | 负剑缓步→立定不语三秒→抬眼扫视→低声开口 |\n| \"你来了\" | 等了很久假装刚到 | 背对不回头→手停一拍→侧半脸 |\n| \"吃了吗\" | 想留你多坐一会 | 递碗筷多一副→拉凳→瞟门口 |\n| \"我没哭\" | 别拆穿我 | 抹脸→仰头眨眼→笑得用力 |\n| \"随便你\" | 你敢再走一步试试 | 抱臂→别开脸→指尖掐进手臂 |\n\n## 七、台词经济学规范\n\n- 单句 ≤15 字为佳；5 秒镜台词 ≤20 字（4字/秒，联动 NARR-03）。\n- 台词三禁：禁心理独白入画面｜禁无主语长句｜禁书面语（\"我认为此事欠妥\"→\"不行\"）。"},{"p":"kb_library/KB_02_人体与面部设计.md","t":"KB_02 人体与面部设计词典（高密度工业速查版）","d":"","raw":"# KB_02 人体与面部设计词典（高密度工业速查版）\n\n> 用途：人物外貌描写的唯一权威词库。同一角色的\"外貌锁定摘要\"一经登记，所有 Prompt 必须逐字复用本典词条（换词=换脸）。\n> 词条统计：体型 8 ｜ 脸型 12 ｜ 下颌颧骨 10 ｜ 眉 10 ｜ 眼型瞳色眼神 30 ｜ 鼻唇耳 20 ｜ 发型发色发饰 44 ｜ 皮肤手部 20 ｜ 微表情链 8 组 —— **合计 150+ 词条**。\n\n---\n\n## 一、头身比与体型词典（8 型）\n\n| 体型代码 | 描述词组 | 适用 |\n|---|---|---|\n| 婴幼儿比例 | 头身比1:3.5~4、圆润短四肢 | 0~3 岁 |\n| 幼儿比例 | 头身比1:4~4.5、圆润短四肢、小翘鼻 | 3~6 岁孩童（如@张三） |\n| 少年比例 | 头身比1:6.5、肩窄、四肢修长感初显 | 10~15 岁 |\n| 标准成人女 | 头身比1:7、肩宽约1.5头宽、腰臀曲线柔和 | 都市女性 |\n| 标准成人男 | 头身比1:7.5、肩宽约2头宽、倒三角微显 | 都市男性 |\n| 修长英气男 | 头身比1:8~9（九头身）、肩宽腰窄、长腿 | 玄幻剑修/模特感（如@林烬） |\n| 健硕壮汉 | 头身比1:7、虎背熊腰、脖颈粗 | 武将/保镖 |\n| 佝偻老者 | 头身比1:6、脊柱微弓、关节突出 | 老年角色 |\n\n**体型差速记（多人同框防串色）**：身高差写具体数值（\"母亲一米六五，孩童一米一，差约半米\"）优于\"一大一小\"。\n\n**年龄双向锚铁律（R9-20261005-17 · 候补 25 转正 · 与 KB_01 三节联动）**：头身比词条挂载时必须配语义化解码词（\"头身比一比六点五\"纯数字不解码）——①女主型（16~18 岁）防上浮：`头身比词条 + 年龄数字 + 身高 + 脸颊微带少女圆润感`；②丫鬟/双髻型（14~16 岁）防塌缩：`头身比词条 + 十五岁及笄硬锚 + 五官已长开、四肢纤长已抽条的亭亭少女身形 + 与十六岁小姐身量相近仅矮小半个头`（反锚三件套缺一不可）；③幼态特征词（稚气未脱/圆脸/大眼/毛茸茸）堆叠 ≥3 个且无反锚＝幼童塌缩直通证（实测 15 岁→5 岁视感）。\n\n## 二、脸型与骨相词典（22 词条）\n\n| 维度 | 词条（同角色锁定后禁换同义词） |\n|---|---|\n| 脸型(12) | 鹅蛋脸、瓜子脸、方脸、国字脸、圆脸、娃娃脸(圆+婴儿肥)、心形脸、长脸、由字脸(下宽)、申字脸(中宽)、甲字脸(上宽)、梨形脸 |\n| 下颌线(6) | 锋利清晰、流畅柔和、方正刚硬、微垂圆润、窄而下收、宽而下颌角外扩 |\n| 颧骨与额头(4) | 颧骨微高立体、颧骨柔和平缓、额头饱满圆润、额头平整微窄 |\n\n## 三、眉部词典（10 词条）\n\n剑眉入鬓、剑眉星目、柳叶细眉、卧蚕眉、刀眉浓黑、新月眉、远山眉(淡而弯)、英气挑眉、八字愁眉、断眉(右眉中间缺口)。\n\n## 四、眼部词典（30 词条：眼型10+瞳色8+眼神12）\n\n| 维度 | 词条 |\n|---|---|\n| 眼型(10) | 丹凤眼(眼尾微挑)、杏眼、桃花眼、瑞凤眼、下垂眼(无辜)、眯缝眼、圆杏眼(孩童)、吊梢眼、深窝眼(欧式)、狭长眼 |\n| 瞳色(8) | 漆黑深邃、深棕、琥珀棕、墨绿、灰蓝、浅茶、玄金瞳(玄幻)、赤瞳(玄幻) |\n| 眼神-静态(6) | 静水深流、清冷疏离、温润含笑、锐利如鹰、懵懂清澈、疲惫涣散 |\n| 眼神-转变(6) | 从错愕转为狠戾、由暗淡重新点亮、笑意从眼底漫出、警觉地眯起、怒意凝成一点、光缓缓熄灭 |\n| 睫毛(4) | 浓密纤长、根根分明、长而微翘(孩童强调)、下睫明显 |\n\n## 五、鼻·唇·耳词典（20 词条）\n\n| 维度 | 词条 |\n|---|---|\n| 鼻型(8) | 鼻梁高挺笔直、秀气微翘、鼻头圆润、鹰钩鼻、山根低平、直鼻窄翼、小翘鼻(孩童)、剑鼻(骨感明显) |\n| 唇形(8) | 薄唇微抿、唇形饱满、M唇峰明显、嘴角微上扬、嘴角下垂、樱桃小口、厚唇大气、唇色淡(病弱感) |\n| 耳部(4) | 耳垂厚润(福相)、精灵尖耳(奇幻)、耳骨钉单边、招风耳(喜剧) |\n\n## 六、发型发色发饰词典（44 词条）\n\n| 维度 | 词条 |\n|---|---|\n| 长度造型(12) | 黑色长发束高马尾、低马尾、半扎发、丸子头、垂顺长直发、齐肩微卷发、黑色短碎发、利落短发、复古手推波纹、脏辫、板寸、双马尾(少女) |\n| 刘海碎发(8) | 齐刘海、空气刘海、中分、侧分37、额前两缕碎发、微翘呆毛(孩童)、龙须刘海、无露额 |\n| 发色(10) | 乌黑、栗色、亚麻金、银白、酒红、深灰蓝、渐变墨蓝(玄幻)、挑染金棕、自然黑棕、花白(中老) |\n| 发质(6) | 垂顺有光泽、蓬松微卷、粗硬直立、细软贴头、毛躁分叉(落魄)、油亮健康 |\n| 发饰(8) | 素色发夹、白玉簪、银链发带、红绳、珠钗、贝雷帽压发、运动发带、断发带(战损派生钩子) |\n\n## 七、皮肤与手部词典（20 词条）\n\n| 维度 | 词条 |\n|---|---|\n| 皮肤质感(12) | 细腻光泽、皮肤纹理细腻真实、哑光健康、冷白皮瓷感、暖黄皮通透、麦色油亮、婴儿肥透红、苍白如纸(病弱)、风吹微红、晒痕分层、毛孔可见(写实)、伤痕覆盖 |\n| 汗泪湿态(4) | 额角薄汗、泪痕未干、鼻尖冒汗、雨湿贴额 |\n| 手部(4·高危区从严) | 五指自然并拢、单手握拳、指节泛白(用力)、虎口旧疤；**严禁**\"十指交叉/复杂比心\"(崩坏02) |\n\n## 八、微表情神态词典（8 大情绪 × 四相递进链 · 视频秒级节点专用）\n\n| 情绪 | 基准相→触发相→过渡相→定格相（按秒展开） |\n|---|---|\n| 喜 | 平静含笑 → 嘴角先单侧上扬 → 眼睛弯成月牙+露齿 → 笑出声肩部轻颤 |\n| 怒 | 平静 → 眉骨紧锁+鼻翼扇动 → 咬紧牙关下颌绷出棱角 → 瞳孔收缩定住 |\n| 哀 | 平静 → 睫毛颤动垂下 → 嘴角向下微抿+眼眶泛泪光 → 一滴泪滑落 |\n| 惧 | 平静 → 瞳孔骤缩+倒吸凉气微张嘴 → 后缩半步 → 手指攥紧衣角 |\n| 冷笑 | 平静 → 只扯单侧嘴角 → 眼神下压再缓缓抬起 → 鼻息轻嗤收势 |\n| 惊 | 平静 → 眼睛瞪圆+微张嘴倒吸 → 定格两秒 → 缓缓恢复眨眼一次 |\n| 温柔安慰 | 平静 → 先弯眼笑 → 伸手轻抚+语气放软尾音上扬 → 眼神先亮后垂(克制的爱) |\n| 渴望(孩童) | 平静 → 眼睛瞪圆紧盯+舔嘴唇 → 咽口水喉头微动 → 拽衣角仰头 |\n\n**眨眼规范**：特写 ≥3 秒必标\"眨眼频率自然，约三秒一次轻微眨眼\"（防崩坏15：死鱼眼/高频抽搐）。\n\n## 九、角色外貌锁定摘要模板（写入资产注册表的唯一格式）\n\n```text\n@资产名｜年龄段（含双向锚词）｜头身比（含语义解码词）｜脸型+下颌线｜眉+眼型瞳色｜鼻+唇｜发型发色发饰｜肤色质感｜穿搭索引(KB_03编号)｜记忆点2个｜同框关系锚｜禁用词(易混淆特征)\n```\n**示例(@林烬)**：`青年22岁｜九头身｜鹅蛋脸下颌线锋利｜剑眉+丹凤眼漆黑瞳｜鼻梁高挺+薄唇微抿｜黑长发高马尾额前两缕碎发｜冷白皮细腻｜GX-01玄黑劲装｜左手虎口旧疤+单侧嘴角冷笑｜同框：与@苏晚晴高差一头、玄黑×月白冷暖呼应｜禁用\"笑容灿烂/圆润脸\"`\n**示例(@杏儿·丫鬟型)**：`十五岁及笄少女（防塌缩三件套：五官已长开+四肢纤长已抽条+与十六岁小姐身量相近仅矮小半个头）｜头身比一比六点五=亭亭少女身形｜…｜同框：矮沈小满小半个头、青绿靛蓝与素青邻色系｜…`\n**换词红线**：锁定后\"杏眼\"不得改\"桃花眼\"、\"栗色\"不得改\"棕色\"——一律回查本典原词条逐字复用。\n**同框关系锚必填槽位（R9-20261005-17 · 候补 25 转正）**：多人剧组的主要人物摘要必须填「同框关系锚」槽（高差量化+服色关系+气质关系，详规见 KB_01 三节）——单人剧或纯旁白角色可填\"无\"；多人同框首帧 Prompt 编译时必须把关系锚展开进主体分区句（\"画面左侧…与…仅矮小半个头\"），缺失＝R4 场记打回。\n**方位换算铁律（R9-20261005）**：摘要可按\"人物自身左右\"叙事记录；**编译进 Prompt 时必须换算为画面绝对方位**（正面/四分之三侧视图：自身右侧=画面左侧；背身视图单独标注\"背身，左右对调\"），严禁\"自身右·画面左\"双表述同现——实测双表述会激活双侧语义，增加镜像与双侧长痣概率。记忆点特征按 KB_08 八节三要素展开（位置锚点+形态比喻+数量尺寸量词）。"},{"p":"kb_library/KB_03_服装与装备设计.md","t":"KB_03 服装与装备设计词典（高密度工业速查版）","d":"","raw":"# KB_03 服装与装备设计词典（高密度工业速查版）\n\n> 用途：人物穿搭与道具结构的结构化词库。服装描写必须\"版型+面料(KB_04)+配色(KB_04)+工艺细节\"四件套齐全——缺件即跨镜换装。\n> 编号规则：题材代码-序号（GX古风玄幻/DS都市/KH科幻/MQ民国/XY校园/SH市井）。\n> 词条统计：套装 38 ｜ 部件剪裁 46 ｜ 配饰 24 ｜ 道具 10 ｜ 战损 9 ｜ 穿搭层次组合示例 6 —— **合计 120+ 词条**。\n\n---\n\n## 一、题材套装库（38 套 · 每套四件套齐备）\n\n### 古风玄幻 GX（10 套）\n\n| 编号 | 套装名 | 版型 | 面料 | 配色 | 工艺细节 |\n|---|---|---|---|---|---|\n| GX-01 | 玄黑剑修正装(@林烬) | 窄袖劲装+立领+腰封 | 玄铁锦缎 | 玄黑+银线 | 银线云纹暗绣、皮甲缚带收小臂、墨玉扣 |\n| GX-02 | 白鹤道袍 | 交领大袖+腰间丝绦 | 香云纱 | 月白+黛青 | 领缘青色滚边、暗纹提花 |\n| GX-03 | 宗门弟子服 | 圆领袍+束革带 | 粗缎 | 靛蓝+皂色 | 袖口宗门徽记刺绣 |\n| GX-04 | 战甲将军袍 | 鱼鳞甲+护肩兽吞+战裙 | 甲片+内衬织锦 | 玄铁黑+鎏金 | 红缨盔缨、甲片错金 |\n| GX-05 | 女修纱裙 | 齐胸襦裙+披帛+广袖 | 云雾纱 | 藕荷+月白 | 银丝暗绣流云、裙摆渐变晕染 |\n| GX-06 | 魔道黑袍 | 高领连帽大氅 | 重缎 | 墨黑+暗红 | 暗红衬里、银线符纹锁边 |\n| GX-07 | 剑庐布衣 | 粗麻对襟+绑腿 | 粗麻 | 灰白 | 补丁两处、袖口磨毛 |\n| GX-08 | 女帝朝服 | 交领大衫+霞帔+冕旒 | 妆花缎 | 玄金+茜红 | 金线日月纹、垂珠十二旒 |\n| GX-09 | 游侠劲装 | 短打+护腕+束袖 | 皮革+细布 | 棕褐 | 皮带扣、绑带十字缠 |\n| GX-10 | 少宗主礼服 | 直裾深衣+大带+玉佩绶 | 提花锦 | 玄青 | 绶带玉璜、暗纹星辰 |\n\n### 现代都市 DS（10 套）\n\n| 编号 | 套装名 | 版型 | 面料 | 配色 | 工艺细节 |\n|--
