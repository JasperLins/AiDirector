原则（原生直出+后期静音原轨换TTS手动对齐口型）。WHEN：每个分镜的视频提示词生产、用户要求'按秒拆/秒级提示词/差分编译'时触发。","raw":"# 视频秒级切片器（VID-01 · 视频提示词核心）· 工业级完整版\n\n## 一、核心职责与工业级法则（7 条硬核铁律）\n\n1. **20/80 差分铁律**：视频 Prompt = **20% 极简锚点（@资产名+最多 2 个骨相词）+ 80% 纯物理运动变化量**（1 种运镜+幅度、1 主动作、1 次级微动作、材质动态、可选光影变化）。外貌描写超过 2 个骨相词即 V2 一票否决——首帧已锁定 90% 外观，堆砌外貌=浪费动态算力+诱发身份漂移（崩坏09）。\n2. **一镜一动一主体台词铁律**：单镜只允许 1 个主动作；同一时刻只允许 **1 个主体说台词**（配排他锁）；第二个主动作或第二主体开口=拆镜（崩坏03/04/05 前置）。\n3. **秒级节点铁律**：节点格式 `[00-02s]…；[02-05s]…`——节点数 ≤3、相邻节点间隔 ≥1 秒、全部对齐 0.5 秒网格（继承 NARR-03 精算）；\"持续地/渐渐地\"这类无锚时段词禁用（时间必须可指）。\n4. **口型双保险铁律**：多人画面+台词 → 必须写**口型排他锁**（\"说话者@X 张嘴说话嘴唇自然开合；一旁的@Y 保持双唇闭合、[神态]倾听，不发一言\"）；单人台词 → 写\"嘴唇随台词自然开合\"；静默镜 → 写\"双唇闭合无张嘴动作\"。无锁无声明=V5/V6 双否决。\n5. **音频可替换铁律（R9-20261005-2，取代旧 Mode A/B 分流）**：\n   - 台词镜照常写台词文本+语气+张嘴动作（原生音频平台的直出音频仅作占位参考）；\n   - **严禁再写\"闭嘴基底/预留 Lip-Sync 干净基底\"**——视频自带音频不满意时**不重抽、不强制闭嘴**，后期静音原视频轨 → 导入外部 TTS → 剪辑手动对齐口型（±2 帧微调，联动 R8/KB_12）；\n   - AI 对口型（LatentSync/剪映对口型）为可选加速工具，不再是强制管线。\n6. **分区句式铁律**：≥2 个人物资产同框 → KB_07 空间分区句式必挂（象限+身高差数值+服装主色差三重锚定），单靠 @名 引用防不住串色（崩坏06）。\n7. **末尾挂锁铁律**：Prompt 末尾逐字挂 @画风锁+线别追加缀+画幅+时长秒数；四缺一=V11/V12 扣分。\n\n## 二、标准执行 SOP（Step-by-Step）\n\n**Step 1 · 读入**：读分镜表行（镜号/景别/机位/构图/运镜/时长/等级/@资产/台词精算）+ 前置资源清单（首帧/尾帧是否就位）+ 目标平台（未指定→挂 plat_00 公用版）。\n\n**Step 2 · 搭骨架**：按差分公式五层拼装——锚点层（≤2 词）→ 动态层（运镜 1 种+幅度、主动作、微动作、材质动态、光影可选）→ 时长层（秒级节点 ≤3）→ 口型层（模式声明+排他锁）→ 画风层（锁+缀+画幅+秒数）。\n\n**Step 3 · 台词落位**（有台词镜）：把 NARR-03 的秒级节点直接引入（铺垫→开口→余韵三段）；台词文本以引号内嵌+语气标注+TTS 控制符；多人加排他锁句。\n\n**Step 4 · 崩坏扫描**：对照黑名单触发词逐个排查（360度转身/狂奔/瞬移/十指交叉/镜内切机位/强逆光首帧引用…）——命中即改写或退回 VIS-01 改镜。\n\n**Step 5 · 平台增强**（指定平台时）：按 plat_* 插件语法重排/补专属件（即梦素材位清单+一致性行 / MiniMax 方括号运镜+眨眼规范+声音栏 / 可灵首尾帧声明+四段式 / ComfyUI 中英双轨+节点参数+负向包）。\n\n**Step 6 · 送检交付**：R7 评分（V 表 12 项）≥9.0 → 代码块封装入档；同步给 R8 剪辑卡点备注（重音秒位/Cutaway 衔接点）。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约\n\n| 字段 | 类型 | 必填 | 说明 |\n|---|---|---|---|\n| 分镜表行 | 14字段 | 是 | VIS-01 产出 |\n| 台词精算 | NARR-03 | 有台词必填 | 含秒级节点+TTS控制符串 |\n| 前置资源 | IMG-02 | 是 | 首帧/尾帧/垫图就位状态 |\n| 目标平台 | enum | 否 | 未指定=公用+推荐 |\n\n### 输出契约（下游：plat_* 落地 / R7 / R8）\n\n```yaml\n镜号: 镜头2 ｜ 时长: 3秒 ｜ 等级: A ｜ 平台: 即梦Seedance(原生音频)\n秒级节点串: \"[00-00.8s]拽衣角仰头铺垫 → [00.8-03.0s]张嘴说台词(2.2s)+李梅闭嘴锁\"\n差分Prompt·公用版: \"```prompt 米白开衫母亲@李梅与天蓝卫衣孩童@张三行于@光大街边：画面左侧三分之一为成年女性@李梅（身高约一米六五），右侧三分之二为孩童@张三（身高约一米一），两人牵手间距一臂；[00-00.8s]远景镜头缓慢推近，母子缓步前行，@张三仰头拽动母亲衣角，梧桐树影斑驳、馄饨摊白雾轻晃；[00.8-03.0s]@张三抬头张嘴说话，嘴唇随台词自然开合：\\\"妈妈，我要吃莽莽\\\"（奶声奶气，尾音拖长，渴望语气）；一旁的@李梅保持双唇闭合、嘴角含笑低头倾听，不发一言，@画风锁+暖金橙主调黄昏柔焦光晕，16:9，3秒```\"\n口型模式: \"A（即梦原生音画）｜排他锁双句齐备\"\n负向词包: \"多人融合, 手指粘连, 成人比例孩童, 文字, 水印\"\nR7送检状态: \"9.4分放行（V2锚点2+2词/V3单主动作/V5双锁/V8分区齐）\"\n交R8备注: \"重音'吃'@开口后1.4s(全镜2.2s处)可卡点；尾音'莽莽~'预留0.5s L-Cut延入镜3白雾\"\n```\n\n## 四、编译素材调用指针与拆解决策（表存于 KB，此处只存指针与逻辑）\n\n> 去重铁律：秒级模板、差分八层表、分区句式、口型句式均已收录为 KB 唯一权威源，本技能不抄写副本——编译时按下表指针现查现用，防版本漂移。\n\n| 素材 | 唯一权威源（现查现用） |\n|---|---|\n| 三档秒级模板（5s 标准 / 3s 对白 / 10s 长条） | `KB_08` 第二节「可复制母版（三档时长）」 |\n| 差分公式八层分解表（占比/词源/违规判定） | `KB_08` 第二节「八层分解表」 |\n| 口型排他锁句式（多人双锁/单人/静默锁/音频可替换原则） | `KB_08` 第三节「口型排他锁句式库」 |\n| 多人空间分区句式（并行/对峙/过肩/竖屏双人） | `KB_07` 第二节「多人空间分区句式库」 |\n| 秒级节点 6 条规范（含长条重锚 / 换指令边界） | `KB_08` 第四节 |\n| 首尾帧与尾帧接力编译规范 | `KB_08` 第五节 |\n\n### 拆解决策注意点（VID-01 独有逻辑，KB 不载）\n\n1. **模板档选择**：镜长 ≤3s 且有台词 → 3 秒对白式；常规 5s → 标准式；即梦 2.5 类长条（>8s）→ 长条式并在第 15 秒类中段重锚 @资产名。\n2. **音频策略**：台词镜一律原生口型写法（嘴唇随台词自然开合）；无声端（ComfyUI Wan）输出无音频也照常写口型动作，后期统一 TTS 轨替换对齐；平台未定 → 公用版并标注\"音频后期可整轨替换\"。\n3. **接力镜锚点压缩**：标注\"首帧=上一镜尾帧\"的镜头，锚点层压至 1 词，动态层只写增量（规范见 `KB_08` 五节）。\n4. **静默镜也锁嘴**：无台词的 S 级压场镜照挂\"双唇闭合无张嘴动作\"（崩坏05 不豁免静默镜——表演层防乱张嘴，非音频约束）。\n5. **节点边界换指令**：MiniMax 类方括号运镜换档必须落在秒级节点边界，禁同段叠加（红线见 `KB_11` 八节）。\n\n## 五、常见错误示范 vs 满分工业级示范\n\n### 对比组 1：差分编译\n\n❌ **Bad Case（外貌堆砌+三违）**：\n> @李梅（鹅蛋脸柳叶眉温润杏眼、栗色齐肩微卷发别素色发夹、米白罗纹针织开衫配浅杏色A字连衣裙、斜挎帆布托特包、平底软鞋、温婉气质）牵着@张三（娃娃脸婴儿肥大圆眼长睫毛黑色短碎发呆毛、天蓝小熊耳连帽卫衣深灰长裤黄雨靴）走在街上边走边聊天，先拍全景再切妈妈特写再切孩子反应，两个人有说有笑，大概五秒钟。\n\n**扣分点**：外貌 60+ 字（V2 否决）；\"边走边聊+两人对话\"双主体台词无排他锁（V5 否决）；\"全景→特写→反应\"三机位（V3 否决）；\"有说有笑/大概\"不可执行——三重否决，评分 ≤8.0 强制打回。\n\n✅ **Good Case**：见\"输出契约\"镜头 2 完整示例——锚点 2+2 词、单主动作（张三说话）、双闭嘴锁、分区句式带身高差、秒级节点对齐精算、末尾四件齐挂——9.4 分放行。\n\n### 对比组 2：音频不满意的处理（音频可替换原则 · R9-20261005-2）\n\n❌ **Bad Case（旧思维：为音频重抽/强制闭嘴）**：\n> 这条视频人物说话节奏和语气都不对，重新抽一张；或者改成闭嘴版本，后期再用对口型软件配音。\n\n**扣分点**：为音频重抽=把画面质量与音频质量捆绑，浪费已合格的画面；强制闭嘴+AI对口型=表演损失+重影风险（旧崩坏16 形态）。\n\n✅ **Good Case（新原则：画面定稿，音频后期替换）**：\n> 画面抽卡取优后即定稿；剪辑软件中静音原视频音频轨 → 导入 Fish Audio 克隆台词（NARR-03 控制符串 `(softly)…(breath)…`，时长校验=镜长±0.2s）→ 逐句 ±2 帧手动对齐口型重音秒位。——微表情全保留、音频质量完全可控，9.3 分放行。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **三人以上同框**：分区句式只保\"主互动双人\"，第三人降级为\"背景虚化剪影/画外声音\"——三清晰人脸=串脸温床；确需三人清晰 → 拆正反打轮播（每人单镜）。\n2. **9:16 竖屏镜**：分区句式换\"上下分区/纵深叠压\"（`KB_07` 二节竖屏双人句式）；运镜禁横移改纵深推拉；画幅字段写 9:16；字幕安全区备注交 R8。\n3. **超长台词（>20 字）**：不塞单镜——回 NARR-03 拆句接力（A 镜说前半+Cutaway 承气口+B 镜说后半）；两个半句各自带排他锁。\n4. **30 秒长条（即梦 2.5）**：节点加密至 5~7 段但\"每段单动作\"；台词分句落在不同段；首段必须重现锚点层（长条中段身份漂移风险高，中途第 15 秒左右再重锚一次 `@资产名`）。\n5. **接力镜（Tail-to-Head）**：锚点层压至 1 词（`@林烬`），动态层只写\"增量变化\"（新增动作/光移），参考节注明\"首帧=上一镜尾帧\"。\n6. **静默爆发镜（S 级无台词压场）**：仍写\"双唇闭合无张嘴动作\"；威压感全部转嫁给运镜幅度+材质动态+光影变化三件套（参考第 01 集分镜 1）。"}]},{"g":"🔌 平台语法插件","items":[{"p":"skills/05_platform_plugins/plat_00_universal_default.md","t":"公用默认标准提示词插件（PLAT-00）· 工业级完整版","d":"WHAT：公用默认标准提示词插件——五大平台模型在人物特写/大幅度打斗/中式美学/多主体交互/运镜控制上的优劣对比矩阵、公用标准中文提示词公式与多题材完整示例、平台智能推荐逻辑。WHEN：用户未指定生图/生视频平台时作为兜底插件触发；或需要跨平台通用版提示词与平台推荐建议时。","raw":"# 公用默认标准提示词插件（PLAT-00）· 工业级完整版\n\n## 一、核心职责与工业级法则（6 条硬核铁律）\n\n1. **安全交集铁律**：公用版只使用全平台安全交集语法——纯中文自然语言、`@资产名` 引用、`[00-02s]` 秒级节点、空间分区句式、口型排他锁；**严禁**混入任何平台专属件（MiniMax 方括号运镜、即梦素材位计数、可灵四段式、ComfyUI 节点参数）——语法污染会让\"通用版\"在半数平台失效。\n2. **推荐必附铁律**：输出公用版的同时必须给出\"首推平台+次推平台+理由\"，理由必须引用优劣矩阵的具体维度（\"S 级大幅动作→可灵：首尾帧锚定+物理规律模拟强项\"），禁止\"都行/看喜好\"。\n3. **迁移提示铁律**：每条公用 Prompt 附\"迁移差异清单\"——转即梦补素材位清单+一致性行；转可灵补首尾帧声明+四段式重排；转 MiniMax 补方括号运镜+声音设计栏；转 ComfyUI 补中英双轨+节点参数+负向包；转豆包补三层空间分句+4K 词缀；转 ChatGPT 补句尾英文单幅短指令+记忆点三要素展开；转大香蕉补镜像防御绝对方位+\"双手空无一物\"道具排他。\n4. **互斥加载铁律**：本插件与 plat_01~07 互斥（含 R9-20261005 实测新增的 PLAT-06 ChatGPT 生图 / PLAT-07 大香蕉生图）——用户一旦指定平台立即卸载本插件转对应插件；跨平台对比场景必须分次产出独立代码块并逐块标注平台名。\n5. **公式对齐铁律**：公用公式即 `KB_08` 编译器的平台中立投影——生图八层黄金语序（句首媒介前置+表情前置+正向构图锚定）、视频 20/80 差分；本插件不得增删公式层，只做\"语法中立化\"。\n6. **风险前置铁律**：输出时必须预告该镜头类型在推荐平台的已知崩坏点（引用黑名单编号），让用户抽卡前就知道要盯什么。\n\n## 二、标准执行 SOP（Step-by-Step）\n\n**Step 1 · 读入镜头特征**：任务类型、景别、动作幅度、资产数、台词模式、题材——五个特征向量。\n\n**Step 2 · 查矩阵定推荐**：按 4.1 优劣矩阵逐维度比对，得出首推+次推平台与理由；同时读 `memory/global/权威工作流与影视知识库.md` 三节选型路由表交叉验证。\n\n**Step 3 · 编译公用版**：按 4.2 公式（生图八层 / 视频 20/80 差分）编译全平台安全交集语法的中文 Prompt，代码块封装。\n\n**Step 4 · 生成迁移提示**：按铁律 3 逐平台列差异清单。\n\n**Step 5 · 风险前置**：按镜头类型引用黑名单编号输出 1~2 条已知崩坏点与盯片要点。\n\n**Step 6 · 送检**：R7 评分 ≥9.0 后交付；产出文档标注\"默认公用提示词（附最佳模型推荐）\"。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约\n\n| 字段 | 类型 | 必填 | 示例 |\n|---|---|---|---|\n| 任务类型 | enum | 是 | 生视频 |\n| 镜头特征 | 结构化 | 是 | 近景过肩/微动作/2资产/对白/都市温情 |\n| 用户限制 | text | 否 | 无本地显卡（排除ComfyUI） |\n\n### 输出契约（下游：用户直用 / plat_* 迁移 / R7）\n\n```yaml\n平台推荐: {首推: \"即梦Seedance 2.5\", 次推: \"MiniMax H3\", 理由: \"原生对白直出+双素材位锁双人；H3微表情细腻可作备选\"}\n公用Prompt: \"```prompt …（安全交集语法）…```\"\n迁移提示: {转即梦: \"+素材位清单(李梅立绘/张三立绘/空镜)+一致性行\", 转可灵: \"四段式重排+音频后期TTS轨替换\", 转MiniMax: \"运镜换[固定]+补声音设计栏\", 转ComfyUI: \"中英双轨+IP-Adapter 0.7+负向包\"}\n风险提示: \"双人同框盯串脸(崩坏06)与乱张嘴(崩坏05)——排他锁已写入；抽卡2~3次取双脸同真的一张\"\n```\n\n## 四、专项工具箱\n\n### 4.1 五大平台模型优劣对比矩阵（★=强 ☆=可用 ✕=弱）\n\n| 维度 | 豆包 Seedream 4.0（生图） | 即梦 Seedance 2.x（生视频） | ComfyUI Flux/Wan（生图+视频） | MiniMax H3（生视频） | 可灵 Kling（生视频） |\n|---|---|---|---|---|---|\n| 人物特写 | ★ 中文骨相词响应佳 | ☆ 依赖参考图质量 | ★ PuLID 锁脸天花板 | ★★ 微表情细腻度第一 | ☆ 需主体参考急救 |\n| 大幅度打斗 | ✕（生图平台） | ☆ 长条中段易漂 | ☆ Wan Motion 0.7~0.9 可控但慢 | ✕ 极限动作受限 | ★★ 3D时空注意力+物理规律 |\n| 中式美学 | ★★ 原生中文+新国风强 | ☆ 继承即系审美 | ☆ 靠 LoRA/画风锁文字 | ☆ | ☆ |\n| 多主体交互 | ★ 空间象限排布强 | ★★ 素材位≤4 多资产融合 | ☆ 双 IP-Adapter 可行但打架 | ☆ 参考模式六栏位 | ☆ 主体参考单一 |\n| 运镜控制 | ✕（不执行运镜） | ★ 自然语言运镜+秒级时间轴 | ☆ ControlNet 间接控 | ★★ 方括号指令直执行 | ★★ 首尾帧+幅度匹配 |\n| 附加维度 | 4K 原生/组图 | 30s 长条/原生音频 | 本地零 API 费/负向词独立 | 32kHz 立体声原生 | 首尾帧锚定/长镜物理 |\n\n**选型口诀**：人设场景找豆包，对白融合用即梦，锁脸批量 ComfyUI，微表情找海螺，大动作交给可灵。\n\n### 4.1b 实测平台画像增补（R9-20261005 · E01 首轮 20 图实测 · 生图向）\n\n> 依据：《两界食单》E01 七资产 × 三平台实测复盘（详见 workspace/两界食单/_archive/复盘_E01资产图首轮实测_20261005.md）。**七资产最佳基准分属三平台，无单一平台全胜**——按任务路由而非按习惯选平台。\n\n| 平台 | 实测强项 | 实测弱项 | 任务路由定位 |\n|---|---|---|---|\n| ChatGPT（GPT-4o Image） | 记忆点位置服从度最高（泪痣/玉戒精确）；画风锁还原最正；唯一文字可控（\"茶/酒\"可读） | 版式自作主张（擅出三视图拼图→须版式锁）；正脸仍无法杜绝 | **人物主图/道具特写/文字入画首选**（4/7 基准） |\n| 大香蕉（Nano Banana） | 气质拿捏最准（15岁侍女稚气）；玉质感/微光物理感最强 | 复杂纹样最弱（蟒纹缺失）；左右镜像风险（→方位绝对化）；规格外道具冗余（→\"双手空无一物\"排他） | **气质定调/材质微光参考**；多轮编辑型修图 |\n| 豆包 Seedream 4.5 | 面料工艺细节最强（补丁/缺腿方桌唯一还原）；中式审美稳 | 面部微特征漂移（瞳色/痣/雀斑形态）；年龄上浮成熟化；文字全糊；人群正脸最多 | **服饰工艺参考/场景要素还原**；中式场景 |\n\n**任务→模型路由启发式（生图）**：人物主图→ChatGPT 首推（大香蕉核气质）｜面料工艺特写→豆包｜场景空镜→ChatGPT/豆包（盯正脸与文字）｜道具微距→ChatGPT（微光态参考大香蕉）｜文字入画→ChatGPT｜跨平台迁移→必带\"垫图类型声明+记忆点文字复述\"双保险（KB_08 八节6）。\n\n**版式控制新制（R9-20261005-17 · 句首负向版式锁已废除）**：旧版式锁句 `单幅满画幅画面，严禁设定集排版、多视图分格、画中画特写` **已全面废除**——①霸占句首前 15 字最高注意力权重导致画种媒介被压垮（候补 22 真人化根因）；②\"设定集/分格/画中画\"在自然语言平台触发粉色大象效应反向激活分格概念。公用安全交集版式控制＝**八层黄金语序第②层正向构图锚定**（`单人全身居中立像` / `单幅侧面微距平视特写`，KB_08 一节）；ChatGPT 防拼图唯一合法形态＝**句尾规格层英文短指令** `Single full-frame illustration of one character only`（英文版整句禁入句首，严禁抢占中文句首权重）。\n\n**负向语法分流**：自然语言三平台（ChatGPT/大香蕉/豆包）正文严禁\"不要X\"堆砌→正向排他句（KB_08 八节4、KB_09 三节④）。\n\n### 4.2 公用标准中文提示词完整公式（与 KB_08 一节八层黄金语序对齐）\n\n**生图（八层黄金语序 · 按权重从高到低）**：\n```text\n[①媒介前置] 项目PACK-XX维度①（古=国风仙侠漫剧插画…/现=现代都市漫剧插画…） + [②表情前置短句+正向构图锚定 单人全身居中立像/单幅侧面微距平视特写] + [③身份+年龄双向锚+骨相5~8词+记忆点三要素+正向排他句] + [④服饰四件套+关系色] + [⑤单一姿态+手部状态/道具三要素复述] + [⑥空间三层 前景…中景…远景…] + [⑦轨道光影 按PACK-XX维度③分流+高光不过曝] + [⑧画风锁纯文本(维度②矩阵)+画幅重复+分辨率]\n```\n**生视频（20/80 差分）**：\n```text\n[锚点20% @资产+≤2骨相词] + [动态80% 运镜1种+幅度｜主动作1个｜微动作1个｜材质动态｜光影变化(可选)] + [时长层 秒级节点≤3] + [口型层 台词+口型排他锁 / 静默镜闭唇（音频后期可整轨替换）] + [画风层 @画风锁+缀] + [规格 画幅+秒数]\n```\n\n### 4.3 三个不同题材完整示例\n\n**示例① 东方玄幻打斗（生视频 · S 级）**：\n```prompt\n黑衣长发@林烬立于@玄天宗比武台中央，[00-02s]镜头低角度缓慢推近，衣摆与额前碎发被罡风掀起轻扬，雷云天光渐暗翻涌；[02-05s]他缓缓抬眼扫视四周，右手取@焚天断剑自下而上划出弧线斜指前方，剑身暗红纹路亮起，气流掀动衣摆与马尾定格，台下人群剪影后倾半步，雷云中一道银白光柱落台，双唇闭合无张嘴动作，@画风锁+冷青蓝主调剑气银白高光，16:9，5秒\n```\n\n**示例② 都市温情对白（生视频 · A 级）**：\n```prompt\n米白开衫母亲@李梅与天蓝卫衣孩童@张三行于@光大街边：画面左侧三分之一为成年女性@李梅（身高约一米六五），右侧三分之二为孩童@张三（身高约一米一），两人牵手间距一臂；[00-00.8s]远景镜头缓慢推近，@张三仰头拽动母亲衣角，梧桐树影斑驳、馄饨摊白雾轻晃；[00.8-03.0s]@张三抬头张嘴说话，嘴唇随台词自然开合：\"妈妈，我要吃莽莽\"（奶声奶气，尾音拖长）；一旁的@李梅保持双唇闭合、嘴角含笑低头倾听，不发一言，@画风锁+暖金橙主调黄昏柔焦光晕，16:9，3秒\n```\n\n**示例③ 悬疑夜巷氛围（生图 · 氛围海报 · 八层黄金语序示范）**：\n```prompt\n悬疑夜巷漫剧插画，二维厚涂画风；神情警觉压帽檐，单幅中景立像：墨绿色调老城窄巷纵深构图，前景层为湿漉漉的石板路面反光（虚化），中景层为一盏昏黄路灯下侧身而立的黑风衣侦探沈默（四分之三背对，右手插袋，帽檐压低遮眼），背景层为巷口浓雾中一个模糊人影剪影（虚化）；体积雾浓厚，单点暖光与大面积冷暗对比（高光不过曝保留暗部层次），低机位平视，引导线构图，@画风锁+墨绿紫黑主调单点暖光缀，16:9，4K\n```\n\n## 五、常见错误示范 vs 满分工业级示范\n\n### 对比组 1：公用版语法污染\n\n❌ **Bad Case**：\n> （用户未指定平台的）公用提示词：`[推近]镜头…素材位1上传@李梅…负向词：多余手指…`混合了 MiniMax 方括号、即梦素材位、ComfyUI 负向输入三种专属语法。\n\n**扣分点**：违反安全交集铁律——方括号在豆包/可灵被当普通文本、素材位计数在无素材位平台误导用户、负向词在不支持负向输入的端直接画进画面。\n\n✅ **Good Case**：\n> 公用版纯安全交集（见 4.3 示例②），随后附迁移提示：\"转 MiniMax：句首运镜改 `[推近]缓慢`+段尾补声音设计栏；转即梦：前置素材位清单；转 ComfyUI：补英文双轨与负向包输入端。\"\n\n### 对比组 2：无理由推荐\n\n❌ **Bad Case**：\n> 这个镜头用哪个平台都差不多，你自己挑一个顺手的就行，提示词我已经写好了。\n\n**扣分点**：推荐必附铁律违例——无矩阵维度引用、无崩坏风险预告；用户在错误平台抽卡浪费的每一次都是框架的责任。\n\n✅ **Good Case**：\n> 首推即梦 Seedance 2.5（原生对白直出+素材位双锁，矩阵\"多主体交互★\"）；次推 MiniMax H3（\"人物特写★★\"，微表情细腻）；风险预告：双人同框盯崩坏06 串脸与崩坏05 乱张嘴——排他锁已写入，抽卡取\"双脸同真\"那张。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **跨平台对比需求**：分次激活各平台插件产出独立代码块，逐块标注平台名；禁止一条 Prompt 标\"多平台通用\"之外再标某平台专属件。\n2. **平台能力更新（模型迭代）**：以 `memory/global/权威工作流与影视知识库.md` 为准——复盘引擎 EVO-01 检测到平台语法变更时先更新知识库再更新本矩阵，本插件矩阵注明\"最后核实日期\"。\n3. **用户受限（无本地显卡/无某平台配额）**：推荐链自动裁剪排除项（ComfyUI 需显存、可灵需配额），沿\"即梦→MiniMax→豆包\"降级。\n4. **B 级降本镜头**：推荐固定为\"不生成视频\"（静态图+剪映关键帧缓推；台词音频后期 TTS 轨替换对齐）——本插件输出静态图 Prompt 与 R8 动效指令单，不走视频推荐链。\n5. **公用版被用户直接拿去不支持中文的平台**：迁移提示中显式警告\"目标平台中文支持弱，请转 ComfyUI 英文双轨版\"，并附英文对照串（KB_06）。"},{"p":"skills/05_platform_plugins/plat_chatgpt_image.md","t":"ChatGPT / GPT-4o Image 平台插件（PLAT-06）· 工业级完整版","d":"WHAT：ChatGPT/GPT-4o Image 专属生图插件——版式锁语法（防擅自拼图）、记忆点三要素锁定技法（位置锚点+形态比喻+数量量词）、正向排他句式（无负向框）、文字入画三档策略、多轮对话式编辑修图工作流与正反例。WHEN：用户指定ChatGPT/GPT-4o生图，或需要记忆点精确锁定、道具特写、文字入画时触发（R9-20261005 实测新增，工业级完整版）。","raw":"# ChatGPT / GPT-4o Image 平台插件（PLAT-06）· 工业级完整版\n\n## 一、核心职责与工业级法则（6 条硬核铁律）\n\n1. **防拼图句尾短指令铁律（实测最痛弱项置顶 · R9-20261005-17 版式锁改制）**：ChatGPT 收到单图请求会擅自输出\"三视图+特写\"拼图（实测 E01 复现），下游单图管线需人工裁切、损失分辨率——防拼图约束**一律置于句尾规格层**，且改为纯英文短指令：`Single full-frame illustration of one character only`，**严禁抢占中文句首权重**（旧句首中文版式锁 `单幅满画幅画面，严禁设定集排版、多视图分格、画中画特写` 已废除——①霸占句首前 15 字最高注意力权重导致画种媒介被压垮；②\"设定集/分格/画中画\"触发粉色大象效应反向激活分格概念）。中文正文一律以 `PACK-XX` 维度①媒介声明开头，版式控制由第②层正向构图锚定（`单人全身居中立像`）承担，句尾再挂英文单幅短指令双保险。\n2. **纯自然语言正向排他铁律**：本平台无独立负向框——正文严禁\"不要X/无X\"式内容否定（粉色大象效应，越写越出）；一律转**正向排他句**（\"其余面部肌肤光洁无瑕\"\"双手空无一物\"）；版式控制走句尾英文短指令与第②层正向构图锚定（铁律1），正文中文部分零\"严禁设定集/多视图/分格/画中画\"字眼。\n3. **记忆点三要素展开铁律（本平台最强项，值得写满）**：实测记忆点位置服从度三平台最高（\"画面左侧眉尾泪痣\"\"素圈玉戒\"精确落地）——每个记忆点必须展开为**位置锚点＋形态比喻＋数量尺寸量词**三要素（见 4.2 词表），写细不罚，服从度撑得起。\n4. **绝对方位铁律**：方位一律用\"画面左侧/右侧\"绝对方位（viewer's left/right），禁\"人物自身左右手侧\"双表述歧义（KB_08 八节2）；单侧记忆点（痣/疤/梨涡）生成后肉眼终审左右。\n5. **文字入画三档铁律**：短词（2~4 字）唯一可尝试档（实测\"茶/酒\"招牌可读，仍需抽卡）；长句清晰文字必乱码（崩坏11）；远景匾额一律虚化/留白＋剪映后期贴字。\n6. **多轮编辑迭代铁律**：本平台原生支持\"在上一张基础上只改X\"的对话式修图——基准图精修（局部改妆/改持物/改光影）优先走多轮编辑而非重抽；每轮必须回复核记忆点三要素（多轮编辑是身份漂移崩坏09 的温床）。\n\n## 二、标准执行 SOP（Step-by-Step）\n\n**Step 1 · 读入初稿**：取 KB_08 编译初稿（八层全量）＋资产注册表外貌锁定摘要（热记忆）；确认出图目标与是否单幅管线。\n\n**Step 2 · 句首媒介+句尾防拼图**：正文首句挂 `PACK-XX` 维度①媒介声明+第②层正向构图锚定；句尾规格层附英文单幅短指令 `Single full-frame illustration of one character only`（铁律1）；三视图任务走 4.4 边界3 的特殊处理。\n\n**Step 3 · 负向转正向**：把 KB_09 标准负向包逐条转译为正向排他句（\"多指\"→\"五指自然并拢分明\"；\"多余配饰\"→\"双手空无一物\"）。\n\n**Step 4 · 记忆点展开**：按 4.2 三要素词表把注册表记忆点逐条展开；方位全部绝对方位化。\n\n**Step 5 · 文字方案**：按 4.3 三档策略处理画面文字需求（无文字/虚化/短词尝试+后期备份）。\n\n**Step 6 · 规格挂锁与抽卡建议**：末尾依序挂 @画风锁（三级压缩锁 ≤35 字直挂，题材身份词必须保留）＋画幅＋分辨率；给抽卡次数与选优标准（版式纯净度优先、记忆点逐项对照、正脸数量）。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约\n\n| 字段 | 类型 | 必填 | 示例 |\n|---|---|---|---|\n| 出图目标 | enum | 是 | 人物资产主图 |\n| KB_08 初稿 | text | 是 | 八层编译稿 |\n| 记忆点特征清单 | list | 是 | 左眉尾泪痣一枚；左手中指素圈玉戒 |\n| 管线模式 | enum | 是 | 单幅首出 / 多轮编辑迭代 |\n\n### 输出契约（下游：用户跑图 / R7 / IMG-02 复用）\n\n```yaml\nChatGPT版Prompt: \"```prompt 国风仙侠漫剧插画，二维国漫工笔厚涂画风；神情温婉含笑，画面左侧脸颊浅现一枚梨涡，单人全身居中立像：少女沈小满，……画面左侧眉尾一枚米粒大小深褐色泪痣，左手中指戴一枚素圈银戒……双手空无一物，其余肌肤光洁无瑕，@画风锁（展开纯文本），16:9，4K，Single full-frame illustration of one character only```\"\n版式控制: \"句首媒介声明+第②层正向构图锚定（单人全身居中立像）；句尾英文短指令 Single full-frame illustration of one character only（禁入句首）\"\n正向排他句: [\"五指自然并拢分明\", \"双手空无一物\", \"其余面部肌肤光洁无瑕\"]\n记忆点展开: [{泪痣: \"画面左侧眉尾+米粒大小深褐色+一枚\"}, {玉戒: \"左手中指+素圈窄边银质+一枚\"}]\n文字方案: \"无文字（招牌只写色块形状）\"\n抽卡建议: \"3次；选优标准=版式纯净不拼图>记忆点三项全中>正脸≤2；版式拼图即废\"\n```\n\n## 四、专项工具箱\n\n### 4.0 实测画像（E01 七资产 × 20 图对照 · R9-20261005）\n\n- **强项**：记忆点位置服从度三平台最高（\"画面左侧眉尾泪痣\"\"素圈玉戒\"精确落地）；画风锁还原最正（长街\"青碧玄黑冷调+暖橙点缀\"唯一达标）；**唯一文字可控**（\"茶/酒\"招牌可读，仍需抽卡）；蟒纹等复杂纹样可辨认。\n- **弱项**：**版式自作主张**——单图请求会擅出\"三视图+特写\"拼图（须句首媒介+句尾英文单幅短指令+正向构图锚定三重防线，见铁律1）；人群正脸仍无法杜绝（2~6 人）；远匾额文字仍不可辨。\n- **定位**：人物主图/道具特写/文字入画首选（E01 实测 4/7 基准图出自本平台）。\n\n### 4.1 版式控制与构图语法（句首媒介 + 句尾英文短指令）\n\n**结构模板**：\n```text\n[媒介前置·PACK-XX维度①]＋[表情前置短句＋正向构图锚定 单人全身居中立像]＋[主体层…]＋[记忆点三要素…]＋[排他句…]＋[@画风锁展开]＋[画幅，分辨率]＋[英文单幅短指令 Single full-frame illustration of one character only]\n```\n- 媒介声明置于**句首**（画种权重位，古/现按维度①分流）；防拼图英文短指令置于**句尾规格层**（实测旧句首中文锁反而升高拼图率——粉色大象+权重挤占，R9-20261005-17 废除）。\n- 构图量化：主体占比写\"占画面左2/3\"\"居中满幅\"；机位写\"平视胸像\"\"微俯全身\"。\n- 三视图需求：显式解除单幅约束，改写\"单图一张，内含正视/左侧/右侧三视图分格设定集排版\"（与单幅管线互斥，二选一，见 4.4 边界3）。\n\n### 4.2 记忆点三要素锁定技法（模板 + 词表）\n\n**结构模板**：`[绝对方位锚点] + [形态比喻句] + [数量/尺寸量词]`\n\n| 要素 | 词表 |\n|---|---|\n| 位置锚点 | 画面左侧眉尾 / 右眼角下方 / 左手中指第二指节 / 耳垂后方发际线 / 右颧骨上方 / 下颌左侧 |\n| 形态比喻 | 米粒大小深褐色泪痣 / 浅浅一枚梨涡（仅笑时显现）/ 三厘米细线状旧疤 / 指甲盖大小胎记 |\n| 数量量词 | 一枚 / 一道 / 一粒（至多一粒）/ 疏落三两点（至多三粒） |\n\n**服从度红利**：本平台对记忆点的执行精度支持\"写满写细\"——三要素全给的落地率实测最高；但**数量上限必须显式**（\"至多三粒\"），否则离散特征有外溢倾向。\n\n### 4.3 文字入画三档策略\n\n| 档位 | 适用 | 写法 | 风险 |\n|---|---|---|---|\n| ① 无文字 | 默认 | 不提文字；招牌只写色块与形状 | 零 |\n| ② 虚化文字 | 氛围招牌/匾额 | `招牌字迹模糊虚化不可辨认，作为景深元素` | 低 |\n| ③ 短词尝试 | 剧情必需（2~4字） | `木匾上书\"茶\"一字，楷书笔画清晰` + 抽卡 3 次 | 中（错字/变形字存在，必配剪映贴字备份） |\n\n### 4.4 多轮对话式编辑工作流（基准图精修管线）\n\n1. **首轮**：句首媒介+第②层正向构图锚定+句尾英文单幅短指令出基准图，抽卡至记忆点三项全中，定稿为\"母版\"。\n2. **迭代指令**：`在上一张图基础上，只将[局部目标]改为[新状态]，其余一切（含左右方位、痣与配饰位置）保持不变`——一次只改一个变量（改妆/改持物/改光影三选一）。\n3. **每轮盯片**：逐项回复核母版记忆点三要素与绝对方位；任何一项漂移即回退上一轮。\n4. **定稿归档**：精修终稿同步资产注册表（母版图路径+迭代说明），剧情态变体（素戒→微光戒）按\"同一资产的剧情态\"登记而非新资产。\n5. **跨平台迁移出图**：以本平台图为垫图喂豆包/ComfyUI 时，Prompt 声明\"保持参考图构图与人物外观\"+记忆点文字复述双保险（KB_08 八节6）。\n\n### 4.5 推荐规格与抽卡策略\n\n| 场景 | 规格 | 抽卡建议 |\n|---|---|---|\n| 人物资产主图/道具特写 | 16:9 或 9:16，4K | 3 次；选优=版式纯净>记忆点全中>正脸≤2 |\n| 场景空镜 | 16:9，4K | 2~3 次；盯人群正脸与招牌乱码 |\n| 文字入画（短词档③） | 按剧情 | 3 次起步；错字即后期贴字 |\n| 多轮编辑迭代 | 沿用母版规格 | 每轮 1~2 次；漂移即回退 |\n\n## 五、常见错误示范 vs 满分工业级示范\n\n### 对比组 1：版式与记忆点\n\n❌ **Bad Case**：\n> 画一个少女，眉尾有颗痣，手上戴着戒指，古风，好看点，高清。\n\n**扣分点**：无句首媒介声明（画种权重位空置）；无句尾英文单幅短指令（实测必出三视图拼图）；\"眉尾\"未绝对方位（左右漂移）；痣与戒指无形态与数量（\"颗\"\"戴\"无锚点，服从度红利全浪费）；\"古风/好看\"空洞无画风锁。\n\n✅ **Good Case**：\n```prompt\n国风仙侠漫剧插画，二维国漫工笔厚涂画风；含笑，画面左侧脸颊浅现一枚梨涡，单人全身居中立像：平视胸像构图，少女沈小满居中占画面三分之二：圆润杏眼浅琥珀瞳微微低垂，柳叶眉，鼻梁小巧微翘，唇珠饱满轻抿，画面左侧眉尾一枚米粒大小深褐色泪痣，左手中指戴一枚素圈窄边银戒，五指自然并拢分明，双手空无一物，其余面部肌肤光洁无瑕；仙侠唯美漫剧质感，新中式工笔厚涂，肤若凝脂衣袂仙气流转，8K高清，16:9，4K，Single full-frame illustration of one character only\n```\n\n### 对比组 2：文字入画\n\n❌ **Bad Case**：\n> 街边挂一块招牌写着\"沈记食铺百年老店童叟无欺\"，字要清晰漂亮。\n\n**扣分点**：12 字长句清晰文字（铁律5 红线，必乱码，崩坏11）；\"清晰漂亮\"无三档策略。\n\n✅ **Good Case**：\n> 档③短词：`檐下木匾上书\"食\"一字，楷书笔画清晰`（抽卡 3 次备剪映贴字）；其余招牌档②虚化：`远处招牌字迹模糊虚化不可辨认，作为黄昏景深元素`。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **人群正脸失控（实测 2~6 人）**：人群戏显式排他——`街市行人疏落五六人，全部背身或侧身剪影，无正脸`；仍出正脸即改大香蕉重跑或 Inpainting 擦脸。\n2. **竖屏（9:16）**：构图改纵向叠压——\"前（虚化）—中（主体满幅）—上（天空/招牌留白）\"三层；人物立绘写\"全身完整入画，头顶脚下留白各一成\"。\n3. **三视图需求与版式锁冲突**：单幅管线与多视图互斥——三视图任务显式改写\"单图一张，内含正视/左视/右视三格设定集\"；一致性要求高（锁脸级）时评估转 ComfyUI（Lineart 钉轮廓+PuLID）。\n4. **跨平台迁移出图**：以本平台基准图为垫图时必带\"垫图类型声明+记忆点文字复述\"双保险（KB_08 八节6）——仅靠垫图不改文字，微特征会在他平台漂移。\n5. **多轮编辑身份漂移**：连续 ≥3 轮迭代后累积漂移风险上升——第 3 轮起逐项全文复述记忆点三要素；漂移则回退母版重新分支。\n6. **版式拼图已发生**：拼图废稿不裁切将就（分格分辨率不足 I2V 首帧标准）——带句首媒介+句尾英文单幅短指令重出；复盘占位归档触发 EVO-01 修订本插件画像。"},{"p":"skills/05_platform_plugins/plat_comfyui.md","t":"ComfyUI 平台插件（PLAT-03）· 工业级完整版","d":"WHAT：ComfyUI 专属插件——Flux 生图与 Wan2.1/2.2 生视频的工作流节点配置建议（PuLID/Redux 锁脸、ControlNet 预处理器与权重、LoRA 区间、采样器/步数/CFG）、结构化 Tag+自然语言混合语法与专属 Negative Prompt 模板。WHEN：用户指定 ComfyUI（Flux/Wan/SD系）生图或生视频，或需要本地可控管线、锁脸批量出图、无声视频输出降本时触发。","raw":"# ComfyUI 平台插件（PLAT-03）· 工业级完整版\n\n## 一、核心职责与工业级法则（6 条硬核铁律）\n\n1. **中英双轨铁律**：Flux/SD/Wan 系英文语义强——交付必须双轨：`正向EN（喂模型）+ 中文存档行（人读与注册表对照）`；中文稿直接喂英文模型=语义损耗过半。\n2. **节点参数随行铁律**：ComfyUI 是工作流引擎，Prompt 必须与节点配置单**同单交付**（锁脸节点+权重、ControlNet 预处理器+强度、LoRA 权重、采样器/步数/CFG、视频 Motion）——无参数的 Prompt 无法复现，等于没交付。\n3. **负向独立铁律**：ComfyUI 保留独立负向输入端——负向模板必挂（4.4）；把负向内容写进正向自然语言（\"不要六指\"）反而注入概念激活。\n4. **音频可替换铁律（R9-20261005-2，废止\"闭嘴基底\"）**：Wan 无声输出照常写口型动作（\"嘴唇随台词自然开合\"），**不再强制闭嘴基底**；成片台词由后期\"静音原轨→TTS 导入→剪辑手动对齐（±2 帧）\"完成，AI 对口型（LatentSync）为可选加速工具。\n5. **锁脸优先铁律**：已注册人物入画必挂锁脸件——角色 LoRA（0.6~0.85）> PuLID（0.6~0.8）> IP-Adapter（0.5~0.7，挂单人立绘/面部特写）；三视图整图禁止入参考位（多头怪）。\n6. **显存预算铁律**：交付前核对显存档位（4.5 节降级链）；24G 满配、12G 降采样两段式、8G 以下建议转在线平台并在选型备注声明。\n\n## 二、标准执行 SOP（Step-by-Step）\n\n**Step 1 · 读入定件**：读编译稿+锁脸需求+ControlNet 需求+显存预算 → 按 IMG-01 路由结论确定节点件清单。\n\n**Step 2 · 组配置单**：按 4.1/4.2 表逐项填节点参数（生图走 Flux 段，视频走 Wan 段），锁脸与控制件按铁律 5 与权重区间。\n\n**Step 3 · 双轨编译**：正向 EN（Tag 前置+自然语言主体段，权重语法 `(tag:1.2)`）+ 中文存档行（@资产名保留原样——注册表对照用）。\n\n**Step 4 · 挂负向**：按 4.4 模板裁剪（生图全量/视频全量+口型声明条目）。\n\n**Step 5 · 视频附加段**：首帧声明、Motion Strength 定档（情绪 0.4~0.6/常规 0.5~0.7/动作 0.7~0.9）、口型声明（台词镜写\"嘴唇随台词自然开合\"）、Wan2.2-S2V 特例（无限时长数字人）。\n\n**Step 6 · 送检交付**：R7 评分（平台附加项：负向齐/双轨齐/参数齐）≥9.0 → 单据化交付。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约\n\n| 字段 | 类型 | 必填 | 示例 |\n|---|---|---|---|\n| 编译稿 | text | 是 | KB_08/VID-01 |\n| 任务类型 | enum | 是 | 生视频 I2V（无声输出） |\n| 锁脸/控制需求 | list | 是 | 双人锁脸+Depth |\n| 显存预算 | enum | 是 | 24G |\n\n### 输出契约（下游：用户载工作流 / R7）\n\n```yaml\n工作流节点配置单:\n  生图段: {底模: \"Flux.1-dev\", 锁脸: \"PuLID(flux) 0.7\", 控制: \"ControlNet-Depth 0.6(预处理器:MidasDepth)\", LoRA: \"角色LoRA×0(已有PuLID不双挂)\", 采样: \"euler + simple｜steps 24｜guidance 3.5\", 分辨率: \"1344×768(16:9)\"}\n  视频段: {模型: \"Wan2.1-I2V-14B\", 首帧: \"前置基准图\", Motion: \"0.5(情绪戏)\", 采样: \"uni_pc｜steps 20｜cfg 5.0\", 输出: \"无声(口型照常写，音频后期TTS轨替换)\"}\n正向EN: \"```prompt masterpiece, (1girl:1.2), beige knit cardigan …lips moving naturally with the dialogue …```\"\n中文存档: \"-- 米白开衫@李梅过肩镜头…嘴唇随台词自然开合…@画风锁\"\n负向模板: \"```prompt …4.4裁剪版…```\"\n交付格式: \"双轨+节点单同页；文件名含镜号与版本\"\n```\n\n## 四、专项工具箱\n\n### 4.1 Flux 生图工作流节点配置表（基线值）\n\n| 节点段 | 推荐配置 | 参数区间 | 越界后果 |\n|---|---|---|---|\n| 底模 | Flux.1-dev（fp8 可省显存） | —— | —— |\n| PuLID（锁脸） | PuLID(flux)，权重 0.7 | 0.6~0.8 | >0.8 表情锁死 |\n| IP-Adapter | 面部特写参考 0.6 | 0.5~0.7 | >0.7 串风格 |\n| Redux（参考重铺） | 参考图风格迁移 0.5 | 0.4~0.6 | >0.6 抄图 |\n| ControlNet-OpenPose | 预处理器 DWPose，强度 0.7 | 0.6~0.8 | >0.8 肢体僵 |\n| ControlNet-Depth | 预处理器 MidasDepth，0.6 | 0.5~0.7 | >0.7 画面糊 |\n| ControlNet-Canny/Lineart | 预处理器 Canny，0.6 | 0.5~0.7 | >0.7 描边感 |\n| LoRA | 角色专属 0.7 | 0.6~0.85 | >0.9 塑胶脸 |\n| 采样器 | euler + simple | flux guidance 3.0~4.0 | guidance>5 过饱和 |\n| 步数 | 24 | 20~28 | >30 边际极小 |\n| SDXL 旧管线备选 | DPM++ 2M Karras，steps 28，CFG 6 | CFG 5~7 | CFG>7 油画感 |\n\n### 4.2 Wan2.1/2.2 生视频节点配置表\n\n| 节点段 | 推荐配置 | 区间 | 说明 |\n|---|---|---|---|\n| 模型 | Wan2.1-I2V-14B（首帧锚定） | —— | T2V 仅空镜用 |\n| Fun Control 三分支 | 姿态/深度/边缘引导视频 | 单支起步 | 官方工作流，多支各×0.7 |\n| Motion Strength | 情绪 0.5 | 0.4~0.6 | 静态表情戏 |\n| Motion Strength | 常规 0.6 | 0.5~0.7 | 行走交互 |\n| Motion Strength | 动作 0.8 | 0.7~0.9 | 打斗（配合首尾帧思路） |\n| 采样 | uni_pc，steps 20，cfg 5.0 | steps 20~30 / cfg 5~6 | cfg>6 运动过冲 |\n| 帧率/时长 | 16fps × 5s = 80 帧 | ≤5s/条 | 长镜走接力 |\n| Wan2.2-S2V | 数字人无限时长口播 | —— | 口播特化（音频后期TTS轨替换） |\n| 输出 | 无声（口型照常写） | —— | 后期 TTS 导入+手动对齐（AI 对口型可选） |\n\n### 4.3 结构化 Tag + 自然语言混合语法\n\n```text\n正向EN结构 = [质量Tag: masterpiece, best quality, 8k] + [主体Tag(带权重): (1girl:1.2), black high ponytail] +\n           [自然语言段: a young sword cultivator stands center of stone arena, robe hem lifted by wind…] +\n           [光学/构图Tag: cinematic lighting, low angle] + [@画风锁中文行原样保留于存档行]\n权重语法：(tag:1.2) 强化 / (tag:0.8) 弱化；Tag 在前抢注意力，自然语言在后管语义连贯。\n```\n\n### 4.4 专属 Negative Prompt 模板（裁剪用母版）\n\n**生图母版**：\n```prompt\n多余手指, 六指, 手指粘连, 面部扭曲, 五官移位, 高光过曝, 硬阴影, 透视畸变, 双人融合, 三个相同人物, 复制人, 文字, 乱码, 水印, 签名, 低分辨率, 模糊, 噪点, 肢体比例错误, 畸形, 过饱和, 卡通辱画风\n```\n**生视频母版（+口型声明条目）**：\n```prompt\n镜头切换, 机位跳切, 人物瞬移, 全员张嘴, 多人张嘴, 口型大开, 身份漂移, 肢体穿模, 手指畸形, 背景闪烁, 拖影, 鬼影, 色彩断层, 画面撕裂, 文字出现, 水印\n```\n\n## 五、常见错误示范 vs 满分工业级示范\n\n### 对比组 1：无参数交付\n\n❌ **Bad Case**：\n> ComfyUI 提示词：一个穿黑衣服的长发剑客站在台子上，风吹起衣角，电影感，高清。（就这些，节点自己看着配）\n\n**扣分点**：纯中文喂英文模型（语义损耗）；无节点配置单（无法复现）；无锁脸件（人物即兴）；无负向；\"电影感高清\"空洞——违反铁律 1/2/3/5。\n\n✅ **Good Case**：\n> 节点单：`Flux.1-dev + PuLID(flux)0.7(@林烬面部特写) + Depth 0.6(MidasDepth) ｜ euler+simple, steps 24, guidance 3.5 ｜ 1344×768`；正向EN：`masterpiece, (1boy:1.2), black outfit, high ponytail, a young sword cultivator stands center of stone arena, robe hem and loose strands lifted by wind force…`；负向母版全挂；中文存档行含 `@林烬…@画风锁`。——单据化可复现交付。\n\n### 对比组 2：音频替换处理\n\n❌ **Bad Case**：\n> Wan 视频：@李梅情绪饱满地大声说话，嘴型夸张开合，台词激昂，生成后我再用对口型软件配音。\n\n**扣分点**：旧\"强制闭嘴+LatentSync\"管线已废止（R9-20261005-2）——口型照常写，音频后期静音原轨换 TTS 手动对齐即可，微表情全保留。\n\n✅ **Good Case**：\n> Wan 无声输出，口型照常写（`lips moving naturally with the dialogue`）+微表情链保留（eye smile→gaze lowers→lash flutter）；台词按 NARR-03 控制符串由 Fish Audio 克隆 → 剪辑静音原轨导入 TTS → 逐句 ±2 帧手动对齐（需 AI 加速时才用 LatentSync）。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **显存不足（<16G）**：降级链——fp8 底模 → 分辨率降档（1024 级）→ Tiled VAE 分块解码 → 视频换 Wan2.1-1.3B 草稿迭代+单帧高清；8G 以下建议整任务转在线平台并备注。\n2. **双参考打架（双人物锁脸失衡）**：双 IP-Adapter 各 0.6 起步；一人不像→该位换面部特写；仍打架→Depth 0.6 钉纵深+单 PuLID 只锁主角，配角靠分区句式。\n3. **Wan 输出抖动（高频微震）**：Motion 降 0.1 档；fps 帧率补齐（16→24 补帧）；仍抖→剪辑段用剪映「智能补帧」+稳定（R8 流程）并复盘归档。\n4. **批量出图（同角色多镜）**：固定种子区间+批量 Prompt 队列（JSON 清单）；每批抽 20% 人工抽检锁脸；注册表摘要词全程逐字复用。\n5. **Flux guidance 过曝**：guidance 降到 3.0~3.5；高光区仍爆→正向加 `soft highlight rolloff`，负向加 `overexposed`。\n6. **英文 Tag 与中文 @资产共存需求**：喂模型用 EN；@资产名只活在中文存档行与素材命名（文件名=镜号_@资产_版本）——保证批量脚本按名归档不错位。"},{"p":"skills/05_platform_plugins/plat_doubao_seedream.md","t":"豆包 Seedream 平台插件（PLAT-01）· 工业级完整版","d":"WHAT：豆包 Seedream 专属生图插件——长句空间方位排布语法（前景/中景/背景+左中右象限）、中式光影质感词库、中文文字渲染技巧、分辨率推荐与正反例。WHEN：用户指定豆包/Seedream 生图，或镜头需要中式美学、多主体空间分区构图、4K 组图时触发。","raw":"# 豆包 Seedream 平台插件（PLAT-01）· 工业级完整版\n\n## 一、核心职责与工业级法则（6 条硬核铁律）\n\n1. **中文原生铁律**：豆包 Seedream 中文理解顶级（官方 4.0 中文原生）——**禁止翻译成英文**喂豆包；英文串只在 ComfyUI 用。中文打光/材质/骨相术语直响应，翻译反而丢语义。\n2. **三层空间分句铁律（R9-20261006-8 术语消歧）**：豆包对\"前景层…中景层…背景层…\"分句式空间层次理解极强——任何含空间的图必须按三层分句组织；三层顺序固定（前景层→中景层→背景层），每层一句，句内给虚实（\"虚化/实焦\"）。层词一律带\"层\"字（KB_08 八节10：杜绝与景别词\"中景/远景\"双义撞车——近景/特写构图下\"中景为…\"可能被误读为半身景拉远取景；第三层用\"背景层\"而非\"远景层\"）。\n3. **象限量化铁律**：多主体排布必须用量化象限词——`画面左侧三分之一 / 右侧三分之二 / 左前景 / 右后景纵深处 / 中轴线上`；模糊的\"旁边/一旁\"在多主体时必串位（配合身高差+服装色差三重锚定）。\n4. **光影直命名铁律**：光学层直接点名光型术语（豆包强项）——伦勃朗光/轮廓光/逆光/分割光/环形光/顶光/丁达尔体积光；同时保留\"高光不过曝、保留面部细节\"防护句（I2V 首帧必挂，崩坏10）。\n5. **文字克制铁律**：豆包 4.0 中文文字能力虽有增强，但**长句清晰文字仍不稳**——画面文字策略：①无文字（首选）②\"字迹模糊虚化\"（景深元素化）③短词 2~4 字（招牌/匾额，可尝试且备后期）；清晰长文一律剪映后期贴字。\n6. **分辨率声明铁律**：末尾缀 `2K` / `4K`（4.0 原生 4K）；横幅资产/场景 4K、竖屏立绘 4K、快速草稿 2K；组图需求显式写\"组图\"并说明每格内容。\n7. **画风权重保卫铁律（R9-20261005-12 实测新增，R9-20261005-17 对齐八层黄金语序）**：插画/漫剧类目标**首句必须前置媒介声明**（按项目 `PACK-XX` 维度①：古装/仙侠=「国风仙侠漫剧插画，二维国漫工笔厚涂画风；」、现代/都市=「现代都市漫剧插画，二维国漫厚涂画风；」）——画风词只放句尾会被前文写实人体/服饰/摄影词压垮（实测 V1 真人棚拍化）；**句首负向版式锁已废除**（`单幅满画幅…严禁设定集排版、多视图分格与画中画特写` 整句禁用——霸占句首权重+粉色大象），版式控制改由第②层正向构图锚定承担（`单人全身居中立像`/`单幅侧面微距平视特写`）；代码块内**禁用摄影工程词**（无影棚/相机/正交投影/贴图 Albedo），零光影需求改绘画语（平涂式均匀柔和平光/光影平面化处理）；锁文本含「写实/电影感」时按 `PACK-XX` 维度④替换表编译（详见 4.5）。\n\n## 二、标准执行 SOP（Step-by-Step）\n\n**Step 1 · 读入初稿**：取 KB_08 编译初稿（八层全量）；确认出图目标与多主体数。\n\n**Step 2 · 空间重排**：按铁律 2/3 把初稿的空间/环境/主体层重排为\"前景句→中景句→远景句\"，多主体套象限句式+身高差+服装色差。\n\n**Step 3 · 光影替换**：按 4.2 光影词替换表把通用光学描述换成豆包直响应术语；首帧图加过曝防护句。\n\n**Step 4 · 文字方案**：按铁律 5 处理画面文字需求（三选一）。\n\n**Step 5 · 规格与挂锁**：末尾依序挂 @画风锁+线别缀+画幅+分辨率；资产锁定图按 KB_06 例外条款替换光影词为 Albedo 平光组。\n\n**Step 6 · 抽卡建议**：给次数（资产 2~3 次/首帧 3~5 次）与选优标准（下颌线最锐/双脸同真/白雾层次最好等具体指标）。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约\n\n| 字段 | 类型 | 必填 | 示例 |\n|---|---|---|---|\n| 出图目标 | enum | 是 | 分镜首帧基准图 |\n| KB_08 初稿 | text | 是 | 八层编译稿 |\n| 多主体数 | int | 否 | 2 |\n| 文字需求 | enum | 否 | 招牌短词 |\n\n### 输出契约（下游：用户跑图 / R7 / IMG-02 复用）\n\n```yaml\n豆包版Prompt: \"```prompt 远景俯瞰@玄天宗比武台：前景层为青石台面与四角符文石柱局部（微虚化）…中景…远景…，雷云压城冷青蓝主调…，16:9，4K```\"\n光影替换: {\"柔和侧光\"→\"伦勃朗光+暗部补光\", \"背光\"→\"侧逆光镶金边\"}\n文字渲染方案: \"招牌'光大小吃'四字短词可尝试(备后期贴字)；其余字迹全部虚化\"\n分辨率推荐: \"4K（资产/首帧）；2K（草稿迭代）\"\n抽卡建议: \"3次取雷云密度最压迫的一张；石柱符文若糊，Inpainting局部修(羽化25px)\"\n```\n\n## 四、专项工具箱\n\n### 4.0 实测画像增补（Seedream 4.5 · R9-20261005）\n\nE01 实测（对照 ChatGPT/大香蕉）：**强**＝面料与工艺细节还原（衣摆补丁/缺腿方桌等\"贫穷感\"差异化道具唯一还原）、中式审美稳定、三层空间分句响应佳；**弱**＝面部微特征漂移（瞳色、痣与雀斑形态易错）、年龄上浮成熟化（15岁→18-20 视感，须显式头身比+稚气锚）、场景文字全糊（只用①无文字/②虚化两档）、人群正脸最多（须\"疏落六七人全部背身或侧身剪影\"量化排他）。任务定位：服饰工艺参考+中式场景要素还原；人物主图建议 ChatGPT 出基准后以垫图复用（声明构图参考+记忆点文字复述）。\n\n### 4.1 长句空间方位排布语法（结构模板 + 象限词表）\n\n**结构模板**：\n```text\n[媒介前置]（PACK-XX维度①，古/现分流）＋[景别+视角]@[场景/主体]：前景层为[元素+虚实+占比暗示]，中景层为[主体/核心元素+状态]，背景层为[延伸元素+虚化]；\n（多主体时）画面[象限词]为@人物A（身高+服装主色），[象限词]为@人物B（身高差+服装主色差）；\n[光学层+色温]，[镜头层构图]，@画风锁+[缀]，[画幅]，[分辨率]\n```\n**象限词表**：`画面左侧三分之一 / 画面右侧三分之二 / 左半区 / 右半区 / 中轴线上 / 左前景 / 右前景 / 左后景纵深处 / 右后景纵深处 / 上三分之一（天空区）/ 下三分之一（地面区）`。\n**虚实词表**：前景虚化 / 微虚化 / 实焦 / 大光圈虚化 / 焦点落于… / 景深外柔化。\n\n### 4.2 中式光影质感词库（豆包直响应术语 · 替换表）\n\n| 通用写法（弱） | 豆包直响应术语（强） |\n|---|---|\n| 脸上有光有影 | `伦勃朗光（单侧三角光）` / `分割光（左右脸明暗对分）` |\n| 背着光 | `侧逆光镶金边` / `逆光剪影（高光不过曝）` |\n| 光从上面来 | `顶光压迫感` / `教堂式顶光垂落` |\n| 有氛围光 | `丁达尔体积光柱自云隙垂落` / `晨雾中的体积光` |\n| 脸打匀了 | `蝴蝶光（环形光）` / `大型柔光箱正面平光` |\n| 金属亮 | `精钢寒光凛冽镜面打磨` / `鎏金温润斑驳做旧` |\n| 水汽感 | `白雾蒸腾自锅沿翻涌` / `薄雾漫过石板路面` |\n\n### 4.3 中文文字渲染技巧（三档策略）\n\n| 档位 | 适用 | 写法 | 风险 |\n|---|---|---|---|\n| ① 无文字 | 默认 | 不提文字；负向意识上规避（招牌只写色块形状） | 零 |\n| ② 虚化文字 | 氛围招牌/匾额 | `招牌字迹模糊虚化不可辨认，作为景深元素` | 低 |\n| ③ 短词尝试 | 剧情必需招牌（2~4字） | `匾额上书\"玄天宗\"三字楷书` + 抽卡 3 次 | 中（错字率存在，必配后期贴字备份） |\n\n### 4.4 推荐分辨率与规格\n\n| 场景 | 规格 |\n|---|---|\n| 资产三视图/场景全景/首帧基准 | 16:9 / 9:16，4K |\n| 独立立绘（竖） | 9:16，4K |\n| 快速草稿迭代（构图试错） | 2K（定稿后 4K 重出） |\n| 组图（表情/分镜/场景机位库/头身分区/轮转板宫格） | 显式写\"组图/九宫格\"+每格内容，4K |\n\n### 4.5 画种权重替换表（R9-20261005-12 · 真人化防御）\n\n| 危险词（真人化引力） | 替换词（插画引力） |\n|---|---|\n| 写实厚涂 | 工笔厚涂 / 厚涂插画 |\n| 8K电影感 | 8K高清 / 8K高清插画 |\n| 环形无影棚均匀漫射平光 | 平涂式均匀柔和平光，光影平面化处理 |\n| 正交投影相机零透视畸变 | 标准正面立绘构图（删\"相机/投影\"字样） |\n| 漫反射固有色贴图质感（Flat Lit Albedo） | 保持插画光感（英文贴图术语清零） |\n| 肤色温润白皙 | 肤色白皙如瓷 |\n| 首句无媒介词 | 首句前置「国风仙侠漫剧插画，」等媒介声明 |\n| 媒介词与内容时代冲突（仙侠×现代装） | 媒介词与内容同向：现代装→「现代都市漫剧插画，二维国漫厚涂画风」 |\n\n## 五、常见错误示范 vs 满分工业级示范\n\n### 对比组 1：空间排布\n\n❌ **Bad Case**：\n> 一个大大的比武台，很多人围着看，远处有山有云有宫殿，主角站在中间很威风，光线很有氛围感，画质高清。\n\n**扣分点**：无三层分句（豆包的空间强项没用上）；\"很多人/有山有云\"堆名词无层次无虚实；\"中间/远处\"未量化；\"氛围感/高清\"空洞——人群必糊成一团，宫殿飘在云上无纵深。\n\n✅ **Good Case**：\n```prompt\n国风仙侠漫剧插画，二维国漫工笔厚涂画风；远景俯瞰@玄天宗比武台：前景层为青石台面与四角符文石柱局部（微虚化），中景层为立于台心的黑衣长发@林烬（九头身，玄黑劲装银线暗纹，小比例不抢戏），背景层为云海之上层叠浮空山岳与凌霄殿玄铁飞檐（虚化）；台下环形人群剪影散布广场两翼；雷云压城冷青蓝主调天光，丁达尔光柱自云隙垂落三道，符文银白高光点缀石柱；低角度仰拍与中心构图，@画风锁+冷青蓝主调剑气银白高光，16:9，4K\n```\n\n### 对比组 2：文字与光影\n\n❌ **Bad Case**：\n> 街道招牌上写着\"光大美食街欢迎品尝正宗手工馄饨\"，字体清晰漂亮，人物站在光线下，光影效果好。\n\n**扣分点**：12 字长句清晰文字（铁律5 红线，必乱码崩坏11）；\"光影效果好\"无术语（豆包直响应能力被浪费）。\n\n✅ **Good Case**：\n> 文字档②：`街道两侧招牌字迹模糊虚化不可辨认，作为黄昏景深元素`（\"光大小吃\"四字若剧情必需，短词尝试 3 次并备剪映贴字）；光影直命名：`黄昏暖金橙主调，侧逆光为@李梅母子镶金边轮廓，高光不过曝保留面部细节`。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **多主体 ≥3**：豆包象限词只保主互动 2 人量化分区；第三人写\"背景虚化剪影\"（清晰三人脸=串脸温床，崩坏06）。\n2. **竖屏（9:16）图**：象限词改纵向——\"上三分之一天空区/下三分之一地面区/中轴主体贯穿\"；空间三层改\"下前景/中主体/上远景\"纵向叠压。\n3. **多图融合编辑（改图需求）**：豆包 4.0 支持多图融合创作——底图（要保留的构图）+人物参考图（立绘）双上，Prompt 注明\"保持底图构图与人物参考外观\"；重绘等效幅度靠\"轻改/仅改光影层\"文字指令控制。\n4. **组图九宫格表情矩阵**：写\"3x3组图\"+九格情绪词逐格列出（每格给具体面部动作词）；抽卡选优标准=\"九格同一张脸\"，不同脸即废；V2 增强：垫主图达标图作参考+首句\"参考图中的人物形象，3x3九宫格表情矩阵图…\"（KB_06 母版③注记·R9-20261006-11）。\n5. **资产锁定图（三视图）**：本插件同样适用——Albedo 平光词组是豆包可执行的正面物理描述；但三视角一致性要求高时，评估转 ComfyUI（Lineart 钉轮廓）；V2 增强：垫主图参考+首句\"参考图中的人物形象，角色设定三视图…\"降抽卡轮次（KB_06 母版②注记）。\n6. **生成结果画幅不符**：豆包偶发画幅漂移——Prompt 末尾画幅词重复一次（\"16:9横幅，16:9\"），仍漂则后期裁切并在复盘占位归档（EVO-01 修订本插件）。\n7. **豆包图生视频（Seedance 同源 · R9-20261006 补记）**：豆包 App 的图生视频入口与即梦 Seedance 同为字节系引擎——差分视频 Prompt 语法沿用即梦系（秒级节点+素材位/参考图上传+一致性行），技法路由统一走 VID-02（等级路由/幅度匹配/接力链调和均适用）；《两界食单_豆包测试版/E01_视频生成提示词_豆包版.md》即按此口径生产（差分铁律：零静态外貌/服饰词，仅运镜+物理动作+光影变幻三维度）。本插件仍以 Seedream 生图为主责，视频细节语法查 plat_jimeng。\n8. **官方参考图生图两部式（R9-20261006-11 立 · 火山方舟官方指南）**：凡有参考图的派生生成（机位库/三视图增强/同主体续产），Prompt 必含两部分——**①指明参考对象**（\"参考图中的这座将军府正门\"/\"参考图中的人物形象\"：清晰描述要从参考图提取保留的元素）+ **②描述生成画面**（新生成内容与视角）；**派生资产禁纯文生图盲抽**（实测：机位库盲抽九宫格仅 6/9 格可用——机位重复/格间漂移/匾额涂黑/人物乱入，黑名单 37）。\n9. **多图输出范式（R9-20261006-11 立 · 官方组图规则；同日复测订正）**：用\"一系列/一套/组图\"或**具体数字**（官方例式：\"生成四张图，影视分镜，分别对应：…\"）可触发 **N 张独立满分辨率成图**（每张独立构图独立 4K、单张可独立重抽）——**但机位库/分镜组图类需求的主路径＝单画布多角度宫格**（**2026-10-06 用户实测验证：垫基准图+V2 提示词产出 3x3 九格、格间建筑一致、无崩坏**——一张图管九机位=指定格垫载体+裁格弹药库，黑名单 37 复测②）；多图输出仅作**单机位补产/裁格图重跑备选**（API 或 App 逐机位拆跑）。**长文本重要信息前置**——一致性声明勿压句尾（末段语义降权，句号切段实测）。**证据位阶警示：官方文档描述的平台倾向 ≠ 本项目实测事实，用户实测>官方文档（AGENTS 〇节9）**。\n10. **宫格极简版式铁律（R9-20261006-11 立 · 黑名单 37 复测③④ · 用户实测）**：参考图已承载主体一致性（建筑/人物）的**宫格/组图生成**，文字层必须极简——①**版式触发词（\"3x3组图/N宫格\"）前置**且全篇唯一；②**禁用每格量化构图锚**（\"占画面X分之一\"类——九组量化锚互相竞争，模型当同图构图要求**融合成单图**，实测 500+ 字版出\"九机位融合怪\"单图）；③**机位用开放式顿号列表、禁绑格位编号**（复测④：`第一格…第二格…`式绑定无效——模型做不了标签→格位一一映射，错配+偷懒重复填格；开放列表让模型自选有把握的机位排队，**成图后按实际内容回填格位登记表**，垫图引用以登记表为准）；④**文字只管\"版式+镜头位置\"**，构件复述/光位句/线别缀一律删（参考图承载——复测④：这些与机位主任务抢权重，用户裁决\"有参考主图只需要镜头位置\"）；⑤**单视角参考图外推弱**——偏离参考图视角的机位（俯瞰/街面对望/反向框景）最易被放弃而退回参考图视角填格（实测门钉特写×3），缺的机位用\"生成N张图\"单机位补产（六节9）；⑥文字总长 ≤150 字；⑦仍失败时降级极短指令\"场景多机位 9 宫格图\"（实测稳定路径，至今唯一全通过写法）。\n7. **全身构图中的微道具（R9-20261005-13 实测新增；R9-20261005-19 双轨制升级，废止「手背朝向+清晰可辨」妥协）**：全身立绘中\"戒指级\"微道具默认不可见且**强行要求展示＝算力过载手部融化**（崩坏 01 变种实测）——①主图**绝对禁止描写**微距级细小配饰，一律剥离由独立道具特写资产承担（分层出图）；②主图手部双轨制：优先「空手自然态」（双手空无一物自然下垂五指并拢），反复穿模才降级「藏拙法」（双手背于身后）；③中近景叙事镜（道具参与表演）不受此限，勿在全身主图 Prompt 反复加码。"},{"p":"skills/05_platform_plugins/plat_jimeng.md","t":"即梦 Seedance 平台插件（PLAT-02）· 工业级完整版","d":"WHAT：即梦（Jimeng / Seedance）专属生视频插件——@资产参考图素材位绑定语法、自然语言运镜词库（推拉摇移环绕跟随升降）、按秒时间轴叙事结构、运动幅度控制建议与完整示例。WHEN：用户指定即梦/Seedance 生成视频，或需要多素材参考融合、30秒内分秒叙事、原生对白直出时触发。","raw":"# 即梦 Seedance 平台插件（PLAT-02）· 工业级完整版\n\n## 一、核心职责与工业级法则（6 条硬核铁律）\n\n1. **四段公式铁律**：即梦官方结构 = `主体（外貌+服装）+ 动作序列 + 镜头语言（运镜）+ 视觉风格 + 约束条件`——差分稿迁入时按此序重排；主体段锚点仍守 20%（≤2 骨相词），禁止借\"四段式\"之名堆外貌。\n2. **素材位前置铁律**：Prompt 正文之前必须先输出素材位规划清单（`素材位1：@资产立绘…`），且 @资产名与位次一一对应；人物立绘/面部特写/场景空镜/道具特写各占其位，**总数 ≤4**（素材位克制铁律，权重失衡串色）。\n3. **秒级时间轴铁律**：即梦原生支持秒级时间戳——统一用 `[0-1秒]…[1-3秒]…` 格式（带\"秒\"字）；单条 ≤30 秒；长条（>10s）中段第 15 秒左右重锚一次 @资产名（中段漂移高发）。\n4. **一致性行铁律**：凡挂了素材位，Prompt 末尾必附一致性行——`人物与场景外观全程与参考素材保持一致`；无此行即梦不保证跨镜同脸。\n5. **口型铁律**：即梦是原生音画同出首选——台词写引号内嵌+语气标注+张嘴动作+**倾听者闭嘴锁**；环境音/音效可随音频能力一并写明（\"童声对白与脚步环境音同步生成\"）；原生音频仅占位，不满意静音原轨换 TTS（音频可替换原则）。\n6. **幅度克制铁律**：即梦运镜与动作写\"幅度副词+运动词\"（缓慢推近/平稳横移）；大幅高速动作（急速转身/狂奔）是其弱区——需求出现时改可灵或拆解降速，并在选型备注声明。\n\n## 二、标准执行 SOP（Step-by-Step）\n\n**Step 1 · 读入**：VID-01 差分公用稿 + 分镜行（等级/时长/台词声明）+ 参考图清单。\n\n**Step 2 · 规划素材位**：按铁律 2 列清单——人物 1~2 位（立绘优先，微表情戏换面部特写）+ 场景空镜 1 位 + 道具特写 ≤1 位；标注每位用途。\n\n**Step 3 · 四段重排**：主体段（锚点 ≤2 词+服装主色）→ 动作序列（秒级时间轴）→ 镜头语言（运镜词库映射）→ 视觉风格（@画风锁+缀）→ 约束（分区句式+口型锁+一致性行）。\n\n**Step 4 · 时间轴本地化**：`[00-00.8s]` → `[0-0.8秒]`；节点对齐 0.5 秒网格；长条加密节点仍守\"每段单动作\"。\n\n**Step 5 · 音频备注**：台词+语气+同步声说明（原生音频仅占位参考，后期可整轨替换）。\n\n**Step 6 · 盯片建议**：给抽卡次数与盯片点（双脸同真/尾帧可用性/口型对齐）；送 R7 评分 ≥9.0 交付。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约\n\n| 字段 | 类型 | 必填 | 示例 |\n|---|---|---|---|\n| VID-01 差分稿 | text | 是 | 公用版 20/80 |\n| 台词声明 | 开合/闭唇 | 是 | 开合 |\n| 参考图清单 | list | 是 | @李梅立绘/@张三立绘/@光大街边空镜 |\n\n### 输出契约（下游：用户即梦跑片 / R7 / R8 卡点）\n\n```yaml\n素材位规划: [{位1: \"@李梅全身立绘\", 用途: \"锁母亲外观\"}, {位2: \"@张三全身立绘\", 用途: \"锁孩童\"}, {位3: \"@光大街边空镜\", 用途: \"锁场景\"}]\n即梦版Prompt: \"```prompt 素材位1：@李梅全身立绘；素材位2：@张三全身立绘；素材位3：@光大街边空镜。\\n黄昏@光大街边人行道，画面左侧三分之一为成年女性@李梅（米白针织开衫，身高约一米六五）…[0-0.8秒]…[0.8-3秒]…人物与场景外观全程与参考素材保持一致，@画风锁+暖金橙主调黄昏柔焦光晕，16:9```\"\n运镜映射: {\"远景镜头缓慢推近\"→\"远景缓慢推近（自然语言保留）\", \"环绕\"→\"镜头环绕主体缓慢旋转\"}\n幅度建议: \"推近配'缓慢'；行走配'平稳'；禁'急速/猛然'\"\n原生音频: \"童声对白与街道环境音同步生成；尾音'莽莽~'拖长\"\n盯片建议: \"抽3次：①双脸同真 ②李梅全程闭嘴 ③白雾层次未糊\"\n```\n\n## 四、专项工具箱\n\n### 4.1 @资产参考图素材位绑定语法\n\n**清单格式（Prompt 首行块）**：\n```text\n素材位1：@李梅全身立绘；素材位2：@张三全身立绘；素材位3：@光大街边空镜；素材位4：@焚天断剑特写（按需）。\n```\n**绑定规则**：①正文 @资产名与位次名严格同名（纯中文优势：名即位即引用三合一）；②人物位优先立绘（全身份），微表情特写镜可换面部特写占人物位；③场景空镜必占一位（无场景位=街景自由发挥）；④道具位仅道具叙事镜挂；⑤总位 ≤4——平台上限 50 位（2.5），但实用四位，多则权重稀释串色。\n\n### 4.2 自然语言运镜词库（公用词 → 即梦写法 + 幅度副词）\n\n| 公用运镜词 | 即梦自然语言写法 | 微幅副词 | 中幅 | 大幅（慎用） |\n|---|---|---|---|---|\n| 推 | `镜头缓慢推近` / `推镜` | 缓慢 | 匀速推进 | 急速推近（弱区） |\n| 拉 | `镜头缓缓拉远` | 缓缓 | 匀速拉远 | 骤然拉开 |\n| 摇 | `镜头左摇/右摇` | 轻缓 | 平稳 | 甩镜（禁，易崩） |\n| 移 | `镜头平稳横移` | 缓慢平移 | 平稳横移 | 快速横移 |\n| 环绕 | `镜头环绕主体缓慢旋转` | 缓慢环绕 | 环绕一周（禁>180°） | —— |\n| 跟随 | `镜头平稳跟随人物前行` | 缓步跟随 | 跟拍 | 追逐跟拍（弱区） |\n| 升降 | `镜头缓缓上升/下降` | 缓缓 | 匀速 | —— |\n| 固定 | `镜头固定不动` | —— | —— | —— |\n\n### 4.3 按秒时间轴叙事结构（三档模板）\n\n**3 秒对白镜**：`[0-0.8秒]铺垫微动作；[0.8-3秒]张嘴说台词（引号+语气）+排他锁`\n**5 秒动作镜**：`[0-2秒]运镜+材质动态；[2-5秒]主动作+微动作`\n**30 秒长条**：`[0-2秒]…[2-5秒]…[5-8秒]…[8-12秒]…[15秒处重锚@资产名]…[25-30秒]收势定格`——每段单动作，台词分句落段。\n\n### 4.4 运动幅度控制建议表\n\n| 内容类型 | 建议幅度档 | 理由 |\n|---|---|---|\n| 情绪对白/微表情 | 全部\"缓慢/轻\" | 即梦微动态稳定，大幅反漂 |\n| 行走/日常交互 | \"平稳/匀速\" | 中幅安全区 |\n| 打斗/奔跑 | 拆解降速或转可灵 | 即梦大幅物理弱区 |\n| 镜内位移 | ≤1 身位 | 大位移瞬移崩坏13 |\n\n## 五、常见错误示范 vs 满分工业级示范\n\n### 对比组 1：素材位绑定\n\n❌ **Bad Case**：\n> 提示词：一对母子在黄昏的街上走路，孩子说想吃东西，妈妈安慰他，画面温馨唯美，人物要好看。（未上传任何参考图，也未写素材位）\n\n**扣分点**：无素材位=人物外观全凭模型即兴（跨镜必换脸）；\"温馨唯美/要好看\"不可执行；台词未引号未排他锁；无时间轴无一致性行——四段公式与素材位体系全部旁路。\n\n✅ **Good Case**：见\"输出契约\"完整示例——三位清单前置、四段重排、`[0-0.8秒]`/`[0.8-3秒]` 时间轴、台词引号+奶声奶气+李梅闭嘴锁、末尾一致性行+画风锁+画幅。\n\n### 对比组 2：时间轴与幅度\n\n❌ **Bad Case**：\n> [0-5秒] 母子俩快步跑过街道，妈妈突然转身抱起孩子转了一圈，然后镜头先是环绕又推近再拉远，孩子大喊妈妈我要吃莽莽妈妈说好好好下次买。\n\n**扣分点**：单段三主动作（跑+抱+转，V3 否决）；三种运镜连用（V9）；360 度转圈（崩坏03 一票否决）；双主体台词挤一句无排他锁（V5 否决）；台词 20+ 字无时间锚。\n\n✅ **Good Case**：\n> 拆三镜：镜A `[0-3秒] 镜头平稳跟随母子缓步前行，@张三仰头说\"妈妈，我要吃莽莽\"（奶声尾音拖长），@李梅双唇闭合含笑倾听`；镜B Cutaway 白雾特写（B级静态）；镜C `[0-4秒] 固定镜头，@李梅蹲身抚头说\"等爸爸回来给你买\"（温柔轻叹），@张三闭嘴仰望`——每镜单动单运镜单台词主体。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **音频不满意（后期替换）**：即梦强项是原生音画直出；音频不满意时静音原轨换 TTS 手动对齐即可（音频可替换原则），不再需要改写闭嘴基底或转无声管线。\n2. **素材位人物不像（权重失衡）**：不像的那位参考图从立绘换**面部特写**重试；仍不像 → 该镜降级单人对拍+剪辑正反打合成。\n3. **30 秒长条中段漂移**：第 15 秒处 Prompt 重锚 `@资产名+1 骨相词`；仍漂 → 拆两条 15 秒独立生成+转场缝合（叠化 0.2s）。\n4. **竖屏长条**：时间轴规则不变；构图过 VIS-01 转换表（纵深叠压）；竖屏对白镜面部占画面高 ≥1/3，字幕安全区底部 15% 备注 R8。\n5. **音频不同步（口型滞后）**：即梦音频-口型偶发半帧差——导出后剪映微移音频 ±2 帧；反复不同步则静音原轨换 TTS 手动对齐（音频可替换原则；复盘占位归档，EVO-01 修订本插件\"原生音频备注\"）。\n6. **首帧图与素材位冲突（既有首帧又有参考图）**：以首帧为主锚（I2V），素材位减至\"人物面部特写 1 位\"辅助锁脸；场景不再占位（首帧已含），避免双场景指令打架。"},{"p":"skills/05_platform_plugins/plat_kling.md","t":"可灵 Kling 平台插件（PLAT-05）· 工业级完整版","d":"WHAT：可灵（Kling）专属插件——首尾帧精准锚定语法、长镜头物理流体/布料解算描述词、运镜参数化控制（幅度×速度矩阵）与高表现模式提示词模板。WHEN：用户指定可灵/Kling 生成视频，或镜头为S级奇观、大幅度打斗、需要首尾帧精准控制或物理规律模拟时触发。","raw":"# 可灵 Kling 平台插件（PLAT-05）· 工业级完整版\n\n## 一、核心职责与工业级法则（6 条硬核铁律）\n\n1. **四段式公式铁律**：可灵官方公式 = `主体（主体描述）+ 运动 + 场景（场景描述）+（镜头语言 + 光影 + 氛围）`——迁入差分稿时按此序重排；核心三要素主体+运动+场景缺一不可。\n2. **首尾帧过渡铁律**：首尾帧模式下 Prompt **只写中间过渡运动**——起止状态的静态描述（首帧已含）严禁复述（浪费过渡算力+诱发漂移）；开头必须显式声明 `首帧=图1（…），尾帧=图2（…）`。\n3. **幅度匹配铁律**（可灵第一铁律）：运镜与动作幅度必须匹配首尾帧画面差异——差异大→大幅词（快速/急速），差异小→\"缓慢\"；错配的直接后果是**运镜指令不执行**（可灵实测）。\n4. **物理语言铁律**：可灵 3D 时空联合注意力擅长物理规律模拟——大幅动作必写物理因果词（重力/惯性/气流/反冲/落地缓冲）；\"凭空帅气地飞起\"不如\"借剑撑地反冲跃起，落地单膝下沉缓冲\"。\n5. **锚点间隔铁律**：多镜头分段叙事（单条内多段）时时间锚点间隔 ≥3 秒，否则分镜切换生硬；单条常规 ≤5s，长镜走接力。\n6. **主体参考急救铁律**：生成主体崩坏（脸漂/形变）→ 两步急救：①Prompt 增加外貌细节锚 ②挂主体参考图；仍崩则降级备选技法（即梦多图参考）并填复盘占位。\n\n## 二、标准执行 SOP（Step-by-Step）\n\n**Step 1 · 读入**：差分稿 + 分镜行（等级/幅度/时长）+ 首尾帧图就位状态 + 物理类型需求。\n\n**Step 2 · 定锚定方式**：S 级大幅→首尾帧双图；A 级→首帧单图（图生视频）；无图文生视频仅限纯空镜。\n\n**Step 3 · 四段重排**：主体段（锚点 ≤2 词）→ 运动段（只写过渡+物理因果）→ 场景段（三层）→ 镜头语言段（运镜+幅度+光影+氛围）。\n\n**Step 4 · 幅度定档**：按 4.3 差异-幅度对照表给运镜与动作定幅度词；差异与幅度错配即回 IMG-02 调尾帧图。\n\n**Step 5 · 物理注入**：按 4.2 解算词库把物理类型词注入运动段（流体/布料/碰撞/坠落各选）。\n\n**Step 6 · 模式与交付**：标准/高性能档建议（4.4 模板）；盯片点（收势定格是否到尾帧/物理是否违和）；R7 ≥9.0 交付；备选降级条件随单。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约\n\n| 字段 | 类型 | 必填 | 示例 |\n|---|---|---|---|\n| 差分稿 | text | 是 | VID-01 公用版 |\n| 首尾帧 | 就位状态 | S级必填 | 图1静立/图2剑指定格 |\n| 物理类型 | enum | 大幅镜必填 | 气流+布料+碰撞 |\n| 模式偏好 | enum | 否 | 标准（高质量） |\n\n### 输出契约（下游：用户可灵跑片 / R7 / VID-02 接力链）\n\n```yaml\n可灵版Prompt: \"```prompt 首帧=图1（@林烬负剑静立于@玄天宗比武台台心），尾帧=图2（@林烬持@焚天断剑斜指前方、衣袂上扬定格）。主体：黑衣长发@林烬；运动：镜头低角度推近的同时，他缓缓抬眼扫视，右手取@焚天断剑自下而上划出弧线，剑身暗红纹路亮起，气流自剑锋扩散掀动衣摆与马尾，台下人群剪影后倾半步，光柱落台后定格（符合气流惯性与重力）；场景：青石比武台、四角符文石柱、云海山岳、雷云压城；镜头语言：低角度推近，冷青蓝主调天光，剑气银白高光，威压氛围，双唇闭合无张嘴动作，@画风锁+冷青蓝主调剑气银白高光，16:9，5秒```\"\n差异-幅度结论: \"两图差异=中（站位同/剑势与衣袂变）→运镜'推近'中幅+动作'划出弧线'中速\"\n物理注入: \"气流扩散(轻流体)+衣摆马尾(布料)+后倾(群体惯性)+光柱落台(光影物理)\"\n模式建议: \"标准档（S级不省）；备选降级：可灵两轮废片→即梦多图参考(素材位3)\"\n```\n\n## 四、专项工具箱\n\n### 4.1 首尾帧精准锚定语法\n\n```text\n挂载声明（Prompt 首行）：首帧=图1（[一句静态概括]），尾帧=图2（[一句静态概括]）。\n主体段：@资产名+≤2骨相词。\n运动段：只写\"从首帧状态到尾帧状态\"的中间过程——过程拆为 2~3 个物理子动作，每子动作带因果词。\n场景段：与首帧图同源的三层描述（简写，防模型重造空间）。\n镜头语言段：运镜+幅度（按对照表）+光影+氛围+口型声明+@画风锁+画幅+秒数。\n红线：①不复述首帧静态 ②运镜幅度匹配差异 ③尾帧必须是\"动作顶点定格\"而非中间态。\n```\n\n### 4.2 长镜头物理流体/布料解算描述词库\n\n| 物理类型 | 高表现描述词（可灵强区） | 慎用/降级词 |\n|---|---|---|\n| 流体-水 | 雨滴沿发梢坠落飞溅细珠、水面向外荡开同心涟漪、倾注水流表面张力拉出弧线 | 瓢泼大雨（闪烁）、海啸巨浪 |\n| 流体-气 | 气流自剑锋呈扇面扩散、罡风掀起衣摆前缘、尘土随落地弥散上扬 | 龙卷风 |\n| 布料 | 衣袂随气流上扬后受重力缓落、袖口随抬手垂坠摆动、裙摆涟漪式荡开 | 大风狂舞布料撕扯 |\n| 毛发 | 马尾随转体惯性甩出弧线后回摆、碎发拂过眼角 | 高速甩发糊影 |\n| 碰撞/惯性 | 剑刃相击迸出火星反震手臂后移半寸、落地单膝下沉缓冲尘土轻扬 | 高速连击多段碰撞 |\n| 坠落/重力 | 坠落加速衣摆向上翻涌、落地屈膝卸力 | 无缓冲直坠（违和） |\n\n### 4.3 运镜参数化控制（差异-幅度-速度三维对照）\n\n| 首尾帧差异 | 运镜幅度词 | 动作速度词 | 组合示例 |\n|---|---|---|---|\n| 微差（同景微变） | 缓慢 | 轻缓 | `[缓慢推近]`+衣摆轻扬 |\n| 中差（动作完成/位移半身位） | 中幅（推近/横移） | 匀速/中速 | `推近`+划弧取剑 |\n| 大差（全景→特写/大位移） | 快速/急速 | 急速（配锚定） | `急速推近`+跃起（首尾帧必须双锚） |\n| 环绕需求 | 缓慢环绕（≤180°） | 匀速 | 高光时刻环绕 |\n\n**速度副词阶梯**：轻缓 → 缓慢 → 匀速 → 中速 → 快速 → 急速（急速必须配首尾帧，裸用必糊）。\n\n### 4.3-b 接力链操作要点（一镜到底三段管线 · R9-20261006 · VID-02 指定本平台为管线首选）\n\n> 适用：剧本明写一镜到底（R2 标记 02R-A/B/C 段）。本平台以首尾帧锚定见长，是三段管线主战平台。\n\n1. **A 段（首段）**：首尾帧模式生成——首帧=IMG-02 基准首帧，尾帧=A 段结束位设计图（同源改三点：动作中间态+机位中间位）；Prompt 只写段内过渡运动（幅度匹配铁律照常生效）；\n2. **截帧**：A 段成片截取最后一帧（导出最高画质；模糊即高清修复/局部重绘微调）；\n3. **B 段（接力段）**：截取尾帧作 B 段首帧；有中帧关键帧（IMG-02 产出）时同时挂首+中双图参考锁轨迹；Prompt 锚点压至 1 词、只写增量动作；\n4. **段数红线**：有中帧锚 ≤3 段；无中帧裸链 ≤2 段（第 3 段重锚全量首帧）——误差累积是接力固有税；\n5. **拼接交棒**：全部段落交 R8 按「接力段拼接」手法缝合（帧级对位/匹配剪辑/J-Cut 跨缝）。\n\n### 4.4 高表现模式提示词模板\n\n```text\n模板（S级标准档）：\n首帧=图1（…），尾帧=图2（…）。主体：@资产+2词；运动：[运镜+幅度]的同时，[物理子动作1因果词]，[物理子动作2]，[群体/环境反应]，[顶点定格描述]（符合[重力/惯性/气流]物理规律）；场景：[三层简写]；镜头语言：[景别+角度]，[色温主调]，[高光类型]，[氛围词]，双唇闭合无张嘴动作，@画风锁+[线别缀]，16:9，5秒\n\n模式建议：S级用\"标准档\"保质量（不省算力）；A级行走交互可用\"高性能档\"提速；批量 B级禁用可灵（静态图方案）。\n```\n\n## 五、常见错误示范 vs 满分工业级示范\n\n### 对比组 1：首尾帧使用\n\n❌ **Bad Case**：\n> 上传了首帧和尾帧图。提示词：@林烬穿着黑色劲装束着高马尾背着断剑静静地站在比武台中央，四周是符文石柱和云海，雷云密布，他看起来很威严。（100 字全在复述首帧静态）\n\n**扣分点**：运动段被静态复述挤占（铁律2）——模型没有\"过渡指令\"只能在两帧间匀速淡变；外貌超 2 词（V2）；\"看起来很威严\"不可生成；未声明首尾帧挂载。\n\n✅ **Good Case**：见\"输出契约\"全文——首行双图声明、运动段三物理子动作、幅度中档匹配中差、四段式齐、双唇闭合防乱张嘴——9.3 分放行。\n\n### 对比组 2：物理与幅度\n\n❌ **Bad Case**：\n> 首帧=站立，尾帧=站远处的另一个位置。提示词：镜头急速360度环绕旋转，人物瞬间移动到远处，衣角飞舞，帅到爆炸。\n\n**扣分点**：360 度环绕（崩坏03 一票否决）；\"瞬间移动\"（崩坏13）；两帧差异大却无过程拆解；\"帅到爆炸\"空洞——V10 否决打回。\n\n✅ **Good Case**：\n> 拆解：首帧=站立 → 尾帧=三步外收势 → 运动段写\"借右腿蹬地起身前冲三步（惯性），衣摆向后翻涌（气流），末步落地屈膝缓冲尘土轻扬（重力），随即立定收剑\"；运镜\"`跟随`匀速\"匹配中差；物理三因果齐——违和感归零。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **首尾帧差异过大（全景→特写）**：超出\"过渡可插值\"范围——放弃尾帧，改\"首帧 I2V+剪辑切镜\"；或回 IMG-02 重出\"同机位推进版尾帧\"。\n2. **运镜不执行（画面只做动作没推近）**：三步排查——①幅度与差异错配？②动态层缺\"运镜理由\"（加光斑移动/景深变化）？③锚点间隔 <3s？——逐项修后重试，仍不执行则该运镜降为固定+剪辑关键帧模拟（R8）。\n3. **续写长镜（尾帧接力）**：可灵首尾帧与接力天然契合——上镜生成视频截尾帧修复后作下镜首帧，尾帧另拍\"下一顶点\"；有中帧锚≤3段／裸链≤2 段第 3 段重锚全量首帧（接力链调和铁律，操作详见 4.3-b）。\n4. **对白镜头（音频可替换）**：可灵对白原生质感弱——照常出口型画面即可，音频后期静音原轨换 TTS 手动对齐（音频可替换原则，不强制闭嘴）；重原生音频质感则转即梦/H3（选型联动 VID-02）。\n5. **群体场景物理（人群后倾）**：群体动作写\"整体趋势\"不写个体——`台下人群剪影整体后倾半步` 可执行；`第三排左侧那个人后退` 必崩（个体级控制超出能力）。\n6. **高性能档废片率高**：降回标准档重跑；高性能档只用于 A 级预览迭代，S 级成片禁用（复盘归档经验）。"},{"p":"skills/05_platform_plugins/plat_minimax_h3.md","t":"MiniMax 海螺 H3 平台插件（PLAT-04）· 工业级完整版","d":"WHAT：MiniMax 海螺 H3 专属插件——原生方括号运镜指令全表（[推近]/[拉远]/[左移]/[右移]/[上摇]/[下摇]/[环绕]/[固定]及其分镜组合用法）、细腻微表情递进描写公式、32kHz原生音频声音设计与物理动态优势。WHEN：用户指定 MiniMax/海螺 H3 生成视频，或镜头以微表情情感戏、原生对白音频、运镜指令直执行为核心诉求时触发。","raw":"# MiniMax 海螺 H3 平台插件（PLAT-04）· 工业级完整版\n\n## 一、核心职责与工业级法则（6 条硬核铁律）\n\n1. **方括号单指令铁律**：运镜用 H3 原生方括号指令（`[推近]` `[拉远]` `[左移]` `[右移]` `[上摇]` `[下摇]` `[环绕]` `[固定]`，`[推进]` 为同义写法）——**一个时间段只挂一个指令**；组合运镜靠\"分段换指令\"实现，同段叠两个方括号=执行混乱。\n2. **微表情链优先铁律**：H3 的第一生产力是细腻微表情——凡近景/特写，主动作位让给\"微表情递进链\"（4.2 公式），大幅肢体动作反是其弱区（让给可灵）。\n3. **声音设计栏铁律**：H3 原生预测 32kHz 立体声（对白/音效/音乐同出）——有台词的镜头必须在 Prompt 末尾显式写\"环境音：…；对白：…；音效：…\"声音设计栏，不写=浪费原生音频能力且音轨随机（原生音频仅占位，后期可整轨替换）。\n4. **参考保留行铁律**：挂参考图必写保留行——`参考图1：@资产面部特写（保持@资产面部与参考一致）`；多人多位参考时逐位声明；眨眼规范随行（`眨眼频率自然，约三秒一次轻微眨眼`，防崩坏15）。\n5. **物理克制铁律**：H3 物理动态优势体现在\"轻物理\"（发丝惯性、衣料轻摆、水汽流动、光斑游移）；重物理（高速碰撞/坠落/流体泼溅）弱区——需求出现拆镜降速或转可灵。\n6. **20/80 不豁免铁律**：H3 语法花活不改变差分编译本质——锚点 ≤2 词、单主动作、秒级节点、口型锁（多人）照常；方括号只替换\"运镜层\"的表达形式。\n\n## 二、标准执行 SOP（Step-by-Step）\n\n**Step 1 · 读入**：VID-01 差分稿 + 分镜行 + 微表情链（分镜备注或 KB_02 五节词典选取）。\n\n**Step 2 · 运镜映射**：按 4.1 映射表把公用运镜词换成方括号指令+幅度副词（`[推近]缓慢`）；组合运镜拆时间段（`[00-02s][固定]…；[02-05s][推近]…`）。\n\n**Step 3 · 微表情落链**：按 4.2 公式把微表情链落进对应秒级节点（每节点一个\"表情相\"）。\n\n**Step 4 · 参考与保留**：列参考图位（面部特写优先）+ 保留行 + 眨眼规范。\n\n**Step 5 · 声音设计栏**：环境音+对白（语气/语速）+点状音效三行写全（原生音频仅占位参考，后期可整轨替换）。\n\n**Step 6 · 盯片交付**：盯片点（眨眼自然/口型对齐/身份第 5 秒仍稳）+ 抽卡建议；R7 ≥9.0 交付。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约\n\n| 字段 | 类型 | 必填 | 示例 |\n|---|---|---|---|\n| VID-01 差分稿 | text | 是 | 公用版 |\n| 微表情链 | list | 近景必填 | 弯眼含笑→眼神先亮后垂→睫毛轻颤 |\n| 台词声明 | 开合/闭唇 | 是 | 开合 |\n| 参考图清单 | list | 是 | @李梅面部特写 |\n\n### 输出契约（下游：用户 H3 跑片 / R7 / R8）\n\n```yaml\nH3版Prompt: \"```prompt [固定]近景过肩，参考图1：@李梅面部特写（保持@李梅面部与参考一致），眨眼频率自然约三秒一次轻微眨眼。[00-00.4s]她垂眸含笑，右手五指并拢抬入画抚向画外孩子头顶；[00.4-03.6s]…眼神先亮起随即轻轻垂下，睫毛轻颤一次…；[03.6-04s]抚头的手轻拍一下收势。肩前@张三后脑静止虚化、双唇闭合倾听。环境音：黄昏街道市井嘈杂低鸣；对白：温软女声与轻微衣料摩擦声同步；@画风锁+暖金橙主调黄昏柔焦光晕，16:9```\"\n运镜映射: {\"固定镜头微幅\"→\"[固定]\", \"缓慢推近\"→\"[推近]缓慢\", \"镜头上摇\"→\"[上摇]\"}\n微表情核对: \"三相连环✓(基准→触发→过渡→定格四步齐全)\"\n参考保留行: \"✓ 双位声明（面部+立绘截肩）\"\n盯片建议: \"抽3次盯：①眨眼自然非抽搐 ②'等爸爸'眼神转变清晰 ③第4秒脸未漂\"\n```\n\n## 四、专项工具箱\n\n### 4.1 方括号运镜指令全表与组合用法\n\n| 指令 | 公用词映射 | 幅度副词 | 典型用途 |\n|---|---|---|---|\n| `[推近]`（同义 `[推进]`） | 镜头缓慢推近 | 缓慢/匀速 | 聚焦情绪、压场逼近 |\n| `[拉远]` | 镜头缓缓拉远 | 缓缓 | 孤独揭示、退场余韵 |\n| `[左移]` / `[右移]` | 镜头左摇/右摇、横移 | 平稳 | 展示空间、跟移 |\n| `[上摇]` | 镜头仰角上抬 | 缓缓 | 揭示高度（脚→脸） |\n| `[下摇]` | 镜头俯角下压 | 缓缓 | 揭示细节（脸→手） |\n| `[环绕]` | 镜头环绕主体 | 缓慢 | 高光时刻（≤180°） |\n| `[固定]` | 固定镜头 | —— | 对白/微表情戏首选 |\n\n**组合用法（分段换指令，禁同段叠加）**：\n```text\n[00-02s][固定]面部特写微表情铺垫；[02-04s][推近]缓慢，情绪聚焦；[04-05s][拉远]缓缓，环境余韵收势。\n（一条 5 秒镜最多 2 次换指令；每次换指令必须落在秒级节点边界上）\n```\n\n### 4.2 细腻微表情递进描写公式\n\n```text\n微表情链 = [基准相]（0.5~1s，静止情绪底色：垂眸含笑）\n         + [触发相]（台词/事件点，1~2s，第一反应：眼神先亮起）\n         + [过渡相]（0.5~1s，情绪转折：随即轻轻垂下、睫毛轻颤一次）\n         + [定格相]（收势，嘴角笑意未消微微收拢）\n词源：KB_02 五节微表情词典（喜怒哀惧冷笑惊七链）\n规则：每秒级节点一个\"相\"；触发相对齐台词重音秒位（NARR-03）；禁写心理词（\"她很感动\"→写成四相）。\n```\n\n### 4.3 物理动态优势词库（H3 强区：轻物理）\n\n| 类别 | 推荐描述词（H3 表现稳定） | 弱区（改可灵） |\n|---|---|---|\n| 毛发 | 发丝随呼吸轻颤、碎发被微风拂起、马尾惯性轻摆 | 高速甩发 |\n| 衣料 | 衣摆轻扬、袖口随抬手垂坠、裙摆涟漪 | 大风狂舞 |\n| 光影 | 光斑在脸上游移、烛光摇曳映瞳 | 强光爆闪 |\n| 水汽 | 白雾缓缓升腾漫过、热气氤氲 | 泼水飞溅 |\n| 眼部 | 眨眼频率自然约三秒一次、瞳孔微缩 | —— |\n\n### 4.4 声音设计栏模板（原生音频镜头）\n\n```text\n环境音：黄昏街道市井嘈杂低鸣（持续铺底）；\n对白：温软女声（4.5字/秒，\"等爸爸\"前轻换气），与轻微衣料摩擦声同步；\n音效：抚头轻拍声卡 3.8s（点状）。\n```\n\n## 五、常见错误示范 vs 满分工业级示范\n\n### 对比组 1：运镜指令使用\n\n❌ **Bad Case**：\n> [推近][环绕][拉远] 镜头不断运动，@李梅深情地看着孩子，表情非常丰富感人，说了很多心里话，画面十分唯美动人。\n\n**扣分点**：三个指令同段叠加（铁律1，执行混乱）；\"深情/丰富感人/很多心里话/唯美\"全是不可生成词；无秒级节点无声音栏无保留行——H3 三大强项全废。\n\n✅ **Good Case**：\n> `[固定]近景过肩，参考图1：@李梅面部特写（保持@李梅面部与参考一致），眨眼频率自然约三秒一次轻微眨眼。[00-00.4s]垂眸含笑抬手抚向画外头顶；[00.4-03.6s]开口说台词（引号+语气+排他锁）…四相微表情链落节点；[03.6-04s]轻拍收势。环境音/对白/音效三行声音栏。`——9.4 分放行（见输出契约全文）。\n\n### 对比组 2：微表情 vs 心理描写\n\n❌ **Bad Case**：\n> @林烬内心翻江倒海，想起了母亲的死，悲愤交加，情绪复杂到了极点，眼眶渐渐湿润，最后化作坚定。\n\n**扣分点**：\"内心/想起/悲愤交加/复杂到极点\"全是心理词（模型无法生成）；\"渐渐/最后\"无秒锚；无四相结构。\n\n✅ **Good Case**：\n> `[推近]缓慢，参考图：@林烬面部特写（保持一致），眨眼自然。[00-01s]基准相：眼神静水深流直视前方；[01-02.5s]触发相：眉骨骤然紧锁，瞳孔微缩，下颌绷紧；[02.5-04s]过渡相：眼眶泛起泪光盈盈但未落，喉结滚动一次；[04-05s]定格相：泪意收回，眼神转为狠戾，嘴角紧抿。环境音：风声低鸣；音效：剑鸣轻颤卡 4s。`——四相俱全、秒锚清晰、心理全部外化。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **指令不执行（画面静止没推近）**：幅度副词与内容矛盾所致——`[推近]` 配\"静立\"内容会失效；改写动态层（衣摆扬起/光斑移动）给运镜\"理由\"，或换 `[推近]缓慢`。\n2. **多人镜头**：H3 参考位多时易串——保主互动双位（面部特写×2）+分区句式+口型锁；第三人虚化或画外声。\n3. **长时漂移（8~10s 条）**：H3 长条中段脸漂风险——第 5 秒左右 Prompt 重锚 `保持@资产面部与参考一致`；仍漂拆两条 5s。\n4. **音频替换需求**：H3 原生音频是其价值，但成片不满意时照常静音原轨换 TTS 手动对齐（音频可替换原则）；纯无声管线建议 Wan。\n5. **指令与竖屏**：`[左移]/[右移]` 在 9:16 中位移感被压缩——竖屏改 `[推近]/[拉远]/[上摇]/[下摇]` 纵向族。\n6. **音频过载（对白+音乐+音效糊）**：声音栏降密——对白镜只写\"环境音+对白\"两行，音乐交 R8 后期铺（-20dB 轨）。"},{"p":"skills/05_platform_plugins/plat_nano_banana.md","t":"大香蕉 / Nano Banana 平台插件（PLAT-07）· 工业级完整版","d":"WHAT：大香蕉/Nano Banana(Gemini系) 专属生图插件——镜像防御绝对方位语法、气质定调词法（稚气/怯懦/英气等气质拿捏最强）、材质与发光态强物理句库（玉质/微光/缝隙辉光）、规格外道具排他与数量量化句式、多轮编辑修图工作流与正反例。WHEN：用户指定大香蕉/Nano Banana生图，或需要气质定调、材质微光参考、多轮编辑修图时触发（R9-20261005 实测新增，工业级完整版）。","raw":"# 大香蕉 / Nano Banana 平台插件（PLAT-07）· 工业级完整版\n\n## 一、核心职责与工业级法则（6 条硬核铁律）\n\n1. **镜像防御铁律（实测最痛弱项置顶）**：本平台存在**左右镜像风险**（实测泪痣疑似翻转到对侧）——方位一律用\"画面左侧/右侧\"**绝对方位**（KB_08 八节2）；关键单侧特征（痣/疤/梨涡/单耳坠）生成后**肉眼终审左右，镜像即整张重抽**（镜像图裁切救不回来）；单侧特征至少两个时，抽卡选优标准里左右终审置顶。\n2. **纯自然语言正向排他铁律**：无独立负向框——内容否定一律转**正向排他**（\"双手空无一物\"\"其余肌肤光洁无瑕\"），严禁正文\"不要X\"堆砌（粉色大象效应）；版式控制不得占用句首权重位、正文严禁\"设定集/多视图/分格/画中画\"字眼（同样触发粉色大象）——版式一律由第②层正向构图锚定（`单人全身居中立像`）承担，首句保留给 `PACK-XX` 维度①媒介声明（R9-20261005-17）。\n3. **规格外道具排他铁律**：实测无指令自添折扇/配饰——人物资产图**必写**`双手空无一物`（或显式持物清单三要素复述：`右手执一柄湘妃竹骨折扇，扇面收拢`）；背景元素写`画面中无其他陈设道具`。\n4. **数量量化铁律**：离散特征数量控制不稳（实测\"三两点\"雀斑出 8~10 颗）——凡离散特征必写**显式数量+硬上限**（\"疏落三两点，至多三粒\"\"泪痣仅一枚，别无其他\"）。\n5. **复杂纹样垫图补强铁律**：蟒纹/云锦类复杂纹样本平台最弱（实测蟒纹缺失变云纹）——纹样类任务**必带参考垫图**（ChatGPT/豆包版构图参考）＋文字三要素复述（\"蟒纹暗绣盘绕全身清晰可辨\"）；无垫图则改道 ChatGPT/豆包。\n6. **气质与材质强物理句铁律（本平台最强项，值得写满）**：气质拿捏三平台最准（实测 15 岁侍女稚气/怯懦忠心眼神最佳）、玉质感与微光物理感最强——气质词直给（4.2 词表）、材质态用**强物理比喻句**（4.3 句库），抽象形容词（\"有气质\"\"质感好\"）一律禁用。\n\n## 二、标准执行 SOP（Step-by-Step）\n\n**Step 1 · 读入初稿**：取 KB_08 编译初稿＋注册表记忆点摘要；**标注单侧特征清单**（镜像风险项）与纹样复杂度（垫图需求）。\n\n**Step 2 · 挂镜像防御**：全部方位绝对方位化；单侧特征挂数量硬上限（铁律1/4）。\n\n**Step 3 · 负向转正向**：负向包逐条转排他句——多指→\"五指自然并拢分明\"；自添道具→\"双手空无一物\"。\n\n**Step 4 · 气质与材质升格**：按 4.2/4.3 把气质与材质层替换为直给气质词+强物理句（如\"玉质感好\"→\"玉质温润半透，缝隙深处透出细如发丝的暗红辉光，如余烬\"）。\n\n**Step 5 · 纹样垫图判定**：蟒纹/云锦/错金类→必挂垫图声明+三要素复述；素面/浅纹样→直出。\n\n**Step 6 · 规格挂锁与抽卡建议**：末尾挂 @画风锁（展开纯文本，题材身份词保留）＋画幅＋分辨率；盯片顺序=**单侧特征左右终审（置顶）→ 纹样存失 → 规格外道具 → 数量越界**。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约\n\n| 字段 | 类型 | 必填 | 示例 |\n|---|---|---|---|\n| 出图目标 | enum | 是 | 道具材质微光参考 |\n| KB_08 初稿 | text | 是 | 八层编译稿 |\n| 单侧特征清单 | list | 是 | 右眼角下方泪痣一枚（单侧·镜像高危） |\n| 纹样复杂度 | enum | 是 | 素面 / 浅纹样 / 复杂纹样（蟒纹级） |\n| 参考垫图 | file | 纹样类必填 | ChatGPT 版蟒纹袍构图参考 |\n\n### 输出契约（下游：用户跑图 / R7 / IMG-02 复用）\n\n```yaml\n大香蕉版Prompt: \"```prompt 国风仙侠漫剧插画，二维国漫工笔厚涂画风；神情怯懦含忠心，单人全身居中立像：平视胸像构图，少女杏儿居中：十五岁及笄少女……画面右侧外眼角一枚针尖大小浅褐色泪痣，仅此一枚，别无其他……双手空无一物，五指自然并拢分明……玉质温润半透，缝隙深处透出细如发丝的暗红辉光，如余烬……@画风锁（展开纯文本），16:9，4K```\"\n镜像防御句: [\"画面右侧绝对方位声明\", \"泪痣仅一枚，别无其他\"]\n排他与数量句: [\"双手空无一物\", \"雀斑疏落三两点，至多三粒\"]\n材质强物理句: \"缝隙深处透出细如发丝的暗红辉光，如余烬\"\n抽卡盯片: \"①泪痣左右终审（置顶）②纹样存失③有无自添折扇④雀斑数≤3\"\n```\n\n## 四、专项工具箱\n\n### 4.0 实测画像（E01 七资产 × 20 图对照 · R9-20261005）\n\n- **强项**：**气质拿捏三平台最准**（15 岁侍女稚气/怯懦忠心眼神最佳，E01 杏儿基准图）；**玉质感与微光物理感最强**（缝隙内发丝状暗红辉光唯一稳定呈现）；雀斑等浅色细微特征形态正确。\n- **弱项**：**左右镜像风险**（泪痣疑似翻转到对侧——方位一律绝对方位+肉眼终审）；**复杂纹样最弱**（蟒纹缺失变云纹）；**规格外道具冗余**（无指令自添折扇）；数量控制不稳（\"三两点\"雀斑出 8~10 颗）。\n- **定位**：气质定调、材质与发光态参考、多轮编辑修图首选；复杂纹样场景避开或垫图补强。\n\n### 4.1 镜像防御与绝对方位语法\n\n**结构模板**：\n```text\n[媒介前置·PACK-XX维度①] + [表情前置短句+正向构图锚定（单人全身居中立像等）] + [方位全部绝对方位化] + [单侧特征三要素+硬上限] + [成对/对称特征显式声明] + [@画风锁展开] + [规格]\n```\n- 绝对方位词表：`画面左侧 / 画面右侧 / 画面左前景 / 画面右后景纵深处 / 中轴线上`——禁\"她的左手边/身体左侧\"（生成端左右手定义与人类直觉相反时必镜像）。\n- 单侧特征模板：`画面[左/右]侧[锚点]+[形态]+仅一枚/一道，别无其他`。\n- 对称特征显式声明：双眼/双耳坠类写\"左右对称各一枚\"——不写则可能单边化。\n- **终审流程**：出图后第一眼先查单侧特征左右→对镜像零容忍，整张重抽（局部翻转修图会引入新的形变）。\n\n### 4.2 气质定调词法（本平台最强项）\n\n气质不写形容词堆砌，写**\"气质词+神态锚点+视线/微表情\"三件套**：\n\n| 气质目标 | 直给气质词 | 神态锚点 |\n|---|---|---|\n| 稚气怯懦（幼齿侍女） | 十五岁稚气脸型、怯懦忠心 | 眼睛微微低垂、双手交叠于腹前、欲言又止抿唇 |\n| 清冷疏离（仙门师姐） | 清冷出尘、眉目疏淡 | 平视远方、唇线平直、下颌微抬 |\n| 市井烟火（老板娘） | 泼辣爽利、眉眼带笑 | 眼尾上挑、嘴角一侧含笑、叉腰 |\n| 少年英气（小将） | 英气挺拔、锋芒内敛 | 剑眉入鬓、直视镜头、肩背挺直 |\n\n**用法**：气质词 2~3 个为限（多则互相稀释），配 1~2 个神态锚点动作；实测本平台对\"年龄感\"执行最准（15 岁稚气不跑成 20 岁）——年龄写具体数字+头身比（\"十五岁，约一米五二，头身比一比六\"）。\n\n### 4.3 材质与发光态强物理句库\n\n| 材质目标 | 强物理句（直用） |\n|---|---|\n| 玉质微光道具 | `玉质温润半透，边缘薄处透光，缝隙深处透出细如发丝的暗红辉光，如余烬` |\n| 鎏金做旧 | `鎏金表面温润斑驳，磨亮处映烛光成一点暖黄光斑` |\n| 精钢寒光 | `剑身打磨如镜，寒光沿刃口一线流淌，映出模糊人影` |\n| 烛焰氛围 | `烛焰豆大，焰心一点亮白，四周晕开暖黄光圈，在墙面投出摇曳浅影` |\n| 粗棉麻织物 | `粗棉麻纹理清晰可辨，肘部磨得发亮，衣摆两处补丁针脚细密` |\n\n**写法规则**：材质句必含**光源逻辑**（光从哪来、落在哪、什么形状的光斑）——本平台物理感执行强，\"玉质感好\"这类抽象词是对强项的浪费。\n\n### 4.4 排他与数量上限句库\n\n| 风险 | 排他/量化句 |\n|---|---|\n| 自添折扇/配饰 | `双手空无一物`；持物时 `右手执一柄湘妃竹骨折扇（扇面收拢），左手空无一物` |\n| 雀斑/痣点失控 | `雀斑疏落三两点，至多三粒，集中于鼻梁两侧`；`泪痣仅一枚，别无其他` |\n| 多余陈设 | `背景纯色无接缝，画面中无其他陈设道具` |\n| 多指 | `五指自然并拢分明` |\n| 正脸人群 | `街市行人疏落五六人，全部背身或侧身剪影，无正脸` |\n\n### 4.5 多轮编辑修图工作流（对话式迭代）\n\n1. **母版定稿**：首轮出图过四项盯片（左右/纹样/道具/数量）后定母版。\n2. **单变量迭代**：`在上一张基础上，只将[材质/微光强度/持物]改为[新状态]，其余保持原样`——道具剧情态迭代（素戒→微光戒→认主纹路亮起）是本插件最佳场景。\n3. **每轮终审**：单侧特征左右复核置顶；材质态变化不牵动五官（牵动即回退）。\n4. **跨平台迁移**：本平台气质定调图作为他平台的**气质参考垫图**；本平台吃垫图时纹样类必带（铁律5）。\n5. **定稿归档**：剧情态变体登记注册表为同一资产的剧情态，不新开资产。\n\n## 五、常见错误示范 vs 满分工业级示范\n\n### 对比组 1：单侧特征与数量\n\n❌ **Bad Case**：\n> 一个可爱的小侍女，脸上有雀斑和一颗泪痣，戴一枚玉戒指，很有气质，画质高清。\n\n**扣分点**：\"脸上有\"未绝对方位（镜像高危）；雀斑无上限（实测外溢到 8~10 颗）；\"一枚\"无\"别无其他\"封口；\"有气质\"抽象词浪费本平台气质强项；未声明双手（自添折扇风险）。\n\n✅ **Good Case**：\n```prompt\n国风仙侠漫剧插画，二维国漫工笔厚涂画风；神情怯懦中带忠心，侍女低调拘谨，单人全身居中立像：平视胸像构图，少女杏儿居中占画面三分之二：十五岁及笄少女，五官已长开、四肢纤长已抽条的亭亭少女身形，约一米五二头身比一比六，圆润杏眼微微低垂含怯意，欲言又止轻抿唇；雀斑疏落三两点至多三粒，集中于鼻梁两侧；画面右侧外眼角一枚针尖大小浅褐色泪痣，仅此一枚，别无其他；双手交叠于腹前五指自然并拢分明，双手空无一物；素青粗棉麻襦裙纹理清晰可辨，肘部磨亮；仙侠唯美漫剧质感，新中式工笔厚涂，肤若凝脂衣袂仙气流转，8K高清，16:9，4K\n```\n\n### 对比组 2：材质微光\n\n❌ **Bad Case**：\n> 一枚古老的玉戒指，很有神秘感，微微发光，材质高级。\n\n**扣分点**：\"微微发光\"无光源逻辑与形态（物理感强项全浪费）；\"神秘感/高级\"抽象空洞；无辉光位置（缝隙？表面？）。\n\n✅ **Good Case**：\n> `一枚古朴饕餮纹玉戒特写：蜜黄玉质温润半透，边缘薄处透光；纹路凹槽深处透出细如发丝的暗红辉光，如余烬将熄；戒身内圈一道细金线包边，磨亮处映出一点暖黄光斑；深色绒布衬底，浅景深虚化`。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **复杂纹样任务（蟒纹/云锦/错金）**：无垫图直出必缺失（实测蟒纹→云纹）——必挂 ChatGPT/豆包参考垫图+纹样三要素复述；垫图后仍失真则整单改道 ChatGPT（蟒纹可辨认档）。\n2. **镜像已发生**：单侧特征翻边即整张重抽（禁局部修图——Inpainting 翻转区会造新形变）；连续 2 次镜像→该资产改道 ChatGPT 出基准，本平台转做气质参考。\n3. **竖屏（9:16）立绘**：三层纵向叠压（前虚化—中主体—上留白）+`全身完整入画，头顶脚下各留白一成`；立绘防拼图＝首句媒介声明+第②层正向构图锚定（`单人全身居中立像`），禁句首负向版式锁（已废除，R9-20261005-17）。\n4. **多人同框**：象限分区+身高差+服装色差三重锚定（同豆包象限句式）；倾听者显式`双唇闭合不发一言`（口型排他锁补丁1）。\n5. **数量特征全灭（雀斑一颗都没有）**：升格形态描写（\"鼻梁两侧浅褐色小雀斑隐约可见\"）+再抽；仍无则接受素颜版，雀斑改后期或放弃该记忆点（浅层记忆点可协商降级）。\n6. **气质定调跨平台复用**：本平台定调图作为全局\"气质锚\"垫图供他平台参考时，Prompt 中声明`人物气质与神态参考所附图片，五官与记忆点以文字复述为准`——防气质图反向污染五官锁定。"}]},{"g":"⚖️ 评分·配音·剪辑·自进化","items":[{"p":"skills/06_audio_edit_qc_skills/skill_jianying_edit_sound_master.md","t":"剪映剪辑调音技能（EDT-01）· 工业级完整版","d":"WHAT：剪映专业版(CapCut)剪辑调音技能——真实存在的曲线变速/转场/出入场动画/调色特效名词库、J-Cut与L-Cut声画错位手法详解、人声+BGM卡点+Foley+环境底噪四轨混音SOP(含dB值)。WHEN：每条视频提示词下方的单镜剪辑建议、整集末尾剪辑总指南、用户问'怎么剪/怎么卡点/加什么音效'时触发。","raw":"# 剪映剪辑调音技能（EDT-01）· 工业级完整版\n\n## 一、核心职责与工业级法则（6 条硬核铁律）\n\n1. **真实菜单铁律**：只准使用 KB_12 收录的剪映专业版真实功能名——曲线变速 6 预设（`蒙太奇/英雄时刻/子弹时间/跳接/闪进/闪出`）、转场（`叠化/闪黑/闪白/推进/拉远/左移/右移/旋转/模糊/漏光/故障/燃烧`）、音频（`人声美化/智能降噪/声音克隆/变声/音频卡点`）——**严禁编造**\"时光倒流转场/梦幻星轨\"等不存在的效果名。\n2. **卡点秒位铁律**：任何变速/音效/转场建议必须给到秒位（\"「英雄时刻」上在取剑顶点帧 3.5s 处\"）——无秒位的建议是给剪辑师的谜语；秒位来源=NARR-03 重音锚+分镜秒级节点。\n3. **声画错位遮瑕铁律**：每 2~3 主镜的 Cutaway 缓冲镜必须配 J-Cut/L-Cut 落点（\"镜2 尾音'莽莽~'延入镜3 前 0.5s\"）——Cutaway 是素材，声画错位才是缝合线；两者配套交付。\n4. **四轨dB铁律**：混音固定四轨分层——人声轨 -6dB ＞ Foley 动作音效轨 -12dB ＞ BGM 情绪卡点轨 -18~-20dB ＞ 环境音底噪轨 -24dB；对白段 BGM 手动压低 30%（等效侧链）；导出前整轨响度统一校验。\n5. **变速不保调铁律**：剪映常规变速勾选\"变调\"会破音高——曲线变速默认保调；需要\"慢放压嗓\"效果时才开变调并在备注声明。\n6. **音频替换闭环铁律（R9-20261005-2）**：替换人声必须走完\"静音原轨→智能降噪→人声美化→逐句手动对齐口型（±2 帧微调）\"——少一步就是\"贴脸念稿\"；AI 对口型为可选加速工具。\n\n## 二、标准执行 SOP（Step-by-Step）\n\n**Step 1 · 读入**：分镜行（等级/秒级节点/Cutaway 标记）+ NARR-03 重音秒位 + 台词音频清单 + 情绪波形。\n\n**Step 2 · 单镜变速定档**：按 `KB_12` 4.1 曲线变速预设表（唯一权威源）选曲线变速（爆点镜=英雄时刻/子弹时间；卡点快剪=跳接；无缝出入=闪进/闪出；常规=不变速 1.0~1.2x）；标注入点秒位。\n\n**Step 3 · 动画转场**：按 4.2 表选出入场动画与转场名（同场次同转场族）；叠化统一 0.2~0.3s。\n\n**Step 4 · J/L-Cut 落位**：为 Cutaway 镜标注错位切入秒点（J-Cut 声先入 0.3s / L-Cut 声延出 0.5s）。\n\n**Step 5 · 音频配置**：Foley 搜索词+卡点秒；BGM 情绪铺排（按波形表）；环境底噪铺底 dB；人声指导（引用音色卡参数）。\n\n**Step 6 · 整集汇总**：集末输出整集指南（节奏曲线/粗精剪 SOP/四轨混音/对口型流程/竖屏字幕安全区）。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约\n\n| 字段 | 类型 | 必填 | 示例 |\n|---|---|---|---|\n| 分镜行 | 14字段 | 是 | 镜1（S级/5s/3.5s顶点帧） |\n| 重音秒位 | list | 有台词必填 | \"吃@2.2s\" |\n| 台词音频 | list | 有台词必填 | 集数_镜号_音色ID |\n\n### 输出契约（下游：剪辑师执行 / 产出文档）\n\n```yaml\n单镜剪辑建议:\n  变速: \"曲线变速「英雄时刻」上在取剑顶点帧3.5s\"\n  动画转场: \"出场无动画；与下一镜转场「闪白」0.2s\"\n  JLCut: \"无Cutaway（本镜为被缓冲主镜）\"\n人声指导: \"无台词；@林烬音色备用\"\n音效配置: \"「雷声低鸣」铺底-24dB｜「剑鸣出鞘」卡2.8s -18dB｜「风声呼啸」3~5s渐强至-18dB后速收\"\nBGM: \"低频弦乐渐强；5s「闪白」处骤停0.3s接暖钢琴\"\n```\n\n## 四、专项工具箱\n\n### 4.1 曲线变速预设 · 调用指针（表存于 KB_12）\n\n> 去重铁律：6 种真实预设（`蒙太奇/英雄时刻/子弹时间/跳接/闪进/闪出`）的节奏效果、短剧用途与入点规则，以 `KB_12` 4.1 节为唯一权威源——定档时现查现用；本技能铁律 1（真实菜单名）与铁律 2（卡点秒位）不变。\n\n### 4.2 转场/动画/调色/特效真实名词库\n\n| 类别 | 真实名（KB_12 核实） | 用法要点 |\n|---|---|---|\n| 转场-基础 | `叠化`（0.2~0.3s）`闪黑` `闪白` | 时空切换/爆点收束 |\n| 转场-运镜 | `推进` `拉远` `左移` `右移` `旋转` `模糊` | 模拟机位运动 |\n| 转场-氛围MG | `漏光`（氛围/光效类）`故障`（转场-特效搜\"故障\"）`燃烧` | 风格化段落 |\n| 出入场动画 | `渐显/渐隐`、`放大/缩小入场`、`向左上/右上飞入`、`弹入`、`旋入` | 出入点轻修饰（勿滥用） |\n| 调色 | 「调节」面板：亮度/对比度/饱和度/色温/色调/HSL；「LUT」导入；滤镜库按类目筛选 | 双线剧分线 LUT：冷青蓝/暖金橙+接缝 0.3s 交叉 |\n| 特效 | 特效面板「氛围」类（漏光/光斑类）、「MG」「复古胶片」类；搜索关键词：漏光/光斑/金粉 | Cutaway 静态镜叠粒子光斑，不透明度 ≤40% |\n| 音频处理 | `人声美化` `智能降噪` `变声` `音频卡点` | 人声三件套+节拍标记 |\n| 功能 | `智能补帧` `关键帧` `画中画` `蒙版` `色度抠图` `文本朗读` `美颜美体` | B级动效/合成/字幕 |\n\n### 4.3 J-Cut / L-Cut 声画错位详解\n\n```text\nJ-Cut（声先画后）：下一镜的音频提前 0.3s 入（听觉先导引）——用于\"听其声先到再见面\"；\n  剪映操作：下一镜音频块左移拖出画面块前缘，J 型错位。\nL-Cut（画先声后/声延画外）：上一镜的台词尾音延入下一镜画面 0.5s（对话余韵）；\n  剪映操作：上一镜音频右缘拉长覆盖在下一镜画面上方，L 型错位。\n遮瑕标准用法：Cutaway 缓冲镜（白雾/道具特写1.5s）覆盖主轨，主镜尾音 L-Cut 延入——\n  观众耳朵在主镜、眼睛在缓冲镜，主镜局部崩坏帧被视觉跳过。\n```\n\n### 4.4 四轨混音 SOP · 调用指针（表存于 KB_12）\n\n> 去重铁律：四轨 dB 明细与操作要点以 `KB_12` 第六节「四轨混音 dB 表」为唯一权威源。**主值速记**：人声 -6dB ＞ Foley -12dB ＞ BGM -18~-20dB（对白段压低 30%）＞ 环境底噪 -24dB；导出前校验（不失真/人声抽检/竖屏字幕安全区）同查 KB_12 六节。\n\n### 4.5 接力段拼接（伪一镜到底 · R9-20261006 新增 · 配合 R6 一镜到底拆解重组法）\n\n> 职责边界：A/B/C 接力段的**生成**归 R6/VID-02（多图参考+尾帧接力）；本节负责把已生成的接力段在剪映中**拼成视觉连续无缝的伪一镜到底**——接缝可见＝前功尽弃。\n\n| 手法 | 操作要点 |\n|---|---|\n| **帧级对位** | A 段尾帧与 B 段首帧为同源（截取/修复关系）——按动作顶点（手抬至最高点/脚步落地瞬间）逐帧对齐剪切点，禁在动作中途剪 |\n| **匹配剪辑（Match Cut）** | 接缝两侧保留同一运动方向的延续（A 段手臂向左→B 段继续向左），运动矢量不断裂即无\"跳一下\"感 |\n| **接缝隐藏** | 首选**硬切藏于动作顶点**（0 帧转场，动作本身遮盖剪切）；次选「叠化」2~4 帧轻融（仅限同机位静态过渡段）；严禁长叠化（=承认拼接） |\n| **音频跨缝连续（J-Cut）** | B 段音频（环境音/台词）提前 0.3~0.5s 延入 A 段尾部——听觉先于视觉缝合，是伪一镜到底的最后一块拼图 |\n| **画幅/调色统一** | 全链段统一画幅缩放与滤镜 LUT（同一 LUT 参数复制粘贴，禁逐段手调）；发现某段色偏即回 R6 重生成，禁靠调色硬救 |\n\n**红线**：接力段拼接后必须整段连播审片三遍（动作连贯/无跳变/无闪帧）；任一接缝可感知＝该缝重新对位或回退该段重生成（勿用转场特效遮丑——特效盖不住物理断裂）。\n\n## 五、常见错误示范 vs 满分工业级示范\n\n### 对比组 1：单镜剪辑建议\n\n❌ **Bad Case**：\n> 这个镜头剪的时候节奏拉满，配合燃爆的bgm，加个帅气的转场和慢动作，音效随便配点打铁声就行。\n\n**扣分点**：编造/模糊效果名（\"帅气的转场\"不是剪映菜单名，违反铁律1）；无秒位（\"剪的时候\"=何时？）；\"随便配点\"无搜索词无 dB——剪辑师无法执行。\n\n✅ **Good Case**：见\"输出契约\"——`「英雄时刻」@3.5s 顶点帧｜「闪白」0.2s 转下镜｜「剑鸣出鞘」卡 2.8s -18dB｜「风声呼啸」3~5s 渐强-18dB｜BGM 低频弦乐 5s 骤停 0.3s 接暖钢琴`——每个名词真实存在、每个动作有秒位有 dB。\n\n### 对比组 2：混音与对口型\n\n❌ **Bad Case**：\n> 配音直接拖进剪映和视频叠一起，BGM 音量开到和台词差不多响，这样气氛足；口型对不上就多看几遍习惯一下。\n\n**扣分点**：BGM 与人声同级（人声被吞，铁律4）；未走降噪美化三件套；\"习惯一下\"违反音频替换闭环铁律——口型不同步是崩坏16 的成片形态。\n\n✅ **Good Case**：\n> 人声 -6dB（智能降噪→人声美化）｜BGM -20dB 且台词段压低 30%｜Foley -12dB 卡重音｜环境 -24dB 铺底；对口型：LatentSync/剪映对口型→逐句 ±2 帧微调至音节与抚头动作节拍吻合——四轨分层+闭环微调。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **竖屏 9:16 集**：字幕底部 15% 安全区；构图下沿关键信息上移；「旋转/左移/右移」转场在竖屏观感放大，慎用（改用叠化族）。\n2. **变速后音频变调**：曲线变速默认保调；误开变调致压嗓——关闭变调或重挂该段音频。\n3. **BGM 版权**：剪映音乐库商用曲与个人曲授权不同——发布前核对授权范围；自制剧建议使用可商用分类并留存曲目名记录。\n4. **Cutaway 缺素材（缓冲镜未拍）**：从主镜废片中抽\"手部/白雾\"局部放大做替补（0.5x~2x 放大裁切）；无可用素材则用「漏光」特效+黑场 0.5s 过渡替代遮瑕。\n5. **口型反复对不齐（±5 帧以上漂移）**：音频整体变速 5%（NARR-03 重算备案）或该句重出视频版本——复盘归档\"该平台口型合格率\"给 EVO-01。\n6. **整集只有环境无台词（空镜集）**：四轨退化三轨（T1 空置）；BGM 升 -16dB 主导；环境轨分\"近场/远景\"两条增强纵深。"},{"p":"skills/06_audio_edit_qc_skills/skill_qc_prompt_scorer_10pt.md","t":"十分制评分官（QC-01 · 质量门禁）· 工业级完整版","d":"WHAT：【质量门禁】10分制提示词评分官——生图与视频双硬性扣分表（各10项明细）、<9.0标准《打回重写指令单》与初稿7.5分被打回修改至9.5分的完整实战演示。WHEN：R5/R6每产出一条提示词后无条件触发；用户要求'评分/质检/为什么打回'时触发。","raw":"# 十分制评分官（QC-01 · 质量门禁）· 工业级完整版\n\n## 一、核心职责与工业级法则（7 条硬核铁律）\n\n1. **每条必检铁律**：框架产出的**每一个单独的提示词**（资产图/前置资源图/分镜视频）独立送检——不搞整集平均分、不搞\"这批一起过\"；一镜不合格即该镜打回，同批其余照常。\n2. **双擎联审铁律（R9-20261005-18 · L1 先行）**：评分启动前**必须先运行 `python scripts/qc_linter.py`**——L1 机检报错未清零时，本技能（L2）**强制输出 0 分打回**，严禁越权对含机械违规的 Prompt 给分；L1 `PASS` 后，本技能 100% 聚焦 KB_10 〇节 5 大语义核验（人设三要素与关系色／单镜动作机位纯度与蒙太奇B计划挂载／空间象限口型排他锁／20/80 差分纯度／光位轴线跨镜连续性）；产出评分行统一双签 `L1机检: PASS ｜ L2智检得分: 9.X / 10（通过）`。\n3. **一票否决铁律**：否决级项任一触发，无论其余项多优秀，得分强制 ≤8.9 并出具打回单——否决项对应 KB_09 崩坏编号（串色/乱张嘴/镜内切机位/口型无锁等），是实测废片率最高的四类。\n4. **证据可审计铁律**：每个 ✓/✗ 必须引用 Prompt 原文片段作证据（\"V5 ✓——原文'一旁的@李梅保持双唇闭合'\"）；无证据的分数无效，评分明细随 Prompt 写入产出文档接受复核。\n5. **指令可执行铁律**：打回单的每条修改指令必须\"可直接改写\"——给出具体句式（\"在 [0.8-3秒] 节点后追加……\"），禁止\"再优化一下/加强一致性\"这类空话。\n6. **三轮上限铁律**：同一 Prompt 打回 ≤3 轮；第 3 轮仍 <9.0 → 标注\"人工裁决\"上报用户并记录在案（问题归档给 EVO-01）。\n7. **免检豁免铁律**：B 级降本镜头的\"无视频 Prompt\"（纯静态图+剪映动效方案）免视频表——按降本方案完整性评分（三件套齐=高分）；但其静态图 Prompt 本身仍走生图表全检。\n\n## 二、标准执行 SOP（Step-by-Step）\n\n**Step 1 · 定表**：先跑 `python scripts/qc_linter.py`（L1 机检，非 0 错误即输出 0 分打回并终止）；Prompt 类型 → 生图走 `KB_10` 生图表（G1~G12），视频走 `KB_10` 视频表（V1~V12）；B 级降本镜走豁免规则（铁律 6）。\n\n**Step 2 · 逐项核验**：按 KB_10 双表逐项打 ✓/✗ 并摘录原文证据；否决项标红。核查 G1/V1 时对照《资产注册表》，核查 G4/G5/G9/V11 时读注册表第五节 `PACK-XX` 绑定信息（维度③轨道+维度④禁词表）执行多轨与六维合规执法，核查崩坏词时对照 `KB_09` 第一节崩坏大表（`全局复盘避坑黑名单.md` 仅核查新增实战崩坏时按需加载）。\n\n**Step 3 · 计分**：`得分 = 10 − Σ扣分`（下限 0，保留一位小数）；任一否决项触发 → 得分强制 ≤8.9。\n\n**Step 4 · 裁决**：≥9.0 放行（输出明细+使用建议）；<9.0 打回（出具《打回重写指令单》）。\n\n**Step 5 · 归档**：评分明细+轮次写入产出文档；第 3 轮失败升级人工裁决并抄送 EVO-01。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约\n\n| 字段 | 类型 | 必填 | 说明 |\n|---|---|---|---|\n| 被评 Prompt | 代码块 | 是 | ```prompt 封装 |\n| Prompt 类型 | enum | 是 | 生图 / 生视频 |\n| 分镜上下文 | 结构化 | 视频必填 | 等级/台词/资产数 |\n| 打回轮次 | int | 是 | 1~3 |\n\n### 输出契约（下游：R5/R6 重写 / 产出文档 / EVO-01）\n\n```yaml\n得分: 9.4\n逐项明细: [\"G1 ✓ @李梅@张三均注册在册\", \"G4 ✓ Albedo平光词组逐字在（'360度环形无影棚拍柔光…'）\", \"G7 ✓ 分区句式带身高差（'左侧三分之一…一米六五'）\", …]\n否决记录: []\n门禁结论: \"放行\"\n使用建议: \"IP-Adapter 0.6/0.6 双锁；抽卡3次取双脸同真；白雾糊则Inpainting修\"\n```\n\n## 四、专项工具箱\n\n### 4.1 扣分表唯一权威引用（G1~G12 / V1~V12 · 不维护并行表）\n\n生图扣分表 **G1~G12** 与视频扣分表 **V1~V12** 以 `kb_library/KB_10_资产与视频质量检查.md` 为**唯一权威来源**，本技能直接引用其编号、分值与扣分判定标准，**严禁在任何 Skill 内另行抄写合并版**（防编号错位与分值漂移——本节曾存在的 10 项合并版已因此废弃）。\n\n- **计分**：`得分 = 10 − Σ扣分`（下限 0，保留一位小数）；任一◆否决项触发 → 强制 ≤8.9 判打回。\n- **否决项速记**（编号语义以 KB_10 为准）：生图 **G1 / G4 / G7 / G8 / G9**｜视频 **V1 / V2 / V3 / V5 / V6 / V8 / V10 / V11**。\n- **G4/G5 多轨兼容执法（R9-20261005-17）**：先读项目《资产注册表》第五节绑定的 `PACK-XX` → 按其维度③对应轨道评分——PACK-01 项目使用 B 轨平涂柔光与标准立绘构图词组**直接判满分**；若在 PACK-01 中误用 A 轨\"无影棚/正交相机/Albedo\"**反判 G4 ◆ 一票否决**（同理 PACK-02 项目误用 B 轨绘画语、PACK-03/04 跨轨混用均 ◆）。\n- **G9/V11 六维合规门禁执法（R9-20261005-17 升格 ◆）**：逐项核查①句首媒介词是否就位且古/现时代匹配（维度①）；②尾锁是否按资产类型与时代矩阵正确挂载（维度②）；③**全文是否零命中该项目风格包维度④的排斥禁词——逐词扫描，一旦命中任何 1 个排斥禁词，直接触发 G9/V11 ◆ 一票否决，强制打回重写**；执法依据＝注册表第五节登记的禁词表（阶段Ⅲ日常只读注册表热记忆，无需重载 KB_05）。\n- **多项否决并发取重规则**：多个◆项同时触发时，扣分只计最重一项（保得分可读），其余触发项以\"证据+修改指令\"形式列入打回单——**修改义务不减免**。\n- 分档扣分细则（如 G3\"每缺一项扣 0.25\"）与全部判定标准，逐条以 KB_10 表内原文为准；评分输出中的条款编号一律使用全序号（G1~G12 / V1~V12）。\n\n### 4.3 《打回重写指令单》标准格式\n\n```markdown\n## 🔴 打回重写指令单（第 N 轮）\n- **被评对象**：[镜号/Prompt编号] · [生图/生视频] · 目标平台[…]\n- **初稿得分**：X.X / 10（触发否决项：[编号+崩坏号]）\n- **扣分明细**：\n  1. [V5 ◆ −1.5] 证据：\"（引用初稿原文）\"——问题：多人台词无倾听者闭嘴锁（崩坏05）\n  2. [V2 ◆ −1.5] 证据：\"（原文 40 字外貌）\"——问题：外貌超锚点配额（分值以 KB_10 为准）\n- **修改指令（逐条可直接执行）**：\n  1. 在 [0.8-3秒] 台词节点后原样追加句式：\"一旁的@李梅保持双唇闭合、面带微笑低头倾听，不发一言\"\n  2. 将主体段删改为\"米白开衫母亲@李梅与天蓝卫衣孩童@张三\"（保留 ≤2 词/人），其余外貌信息移入首帧图职责\n  3. （…）\n- **复审入口**：按上修改后重新送检；预计通过线 ≥9.0\n- **抄送**：产出文档评分栏（留痕）｜若为第3轮 → 升级人工裁决\n```\n\n## 五、实战演示：初稿 7.5 分被打回 → 修改后 9.5 分（完整过程）\n\n**❌ Bad Case【初稿】**（镜2 · 例子1 镜头1 · 视频类 · 第 1 轮送检）：\n```prompt\n@李梅（鹅蛋脸柳叶眉温润杏眼、栗色齐肩微卷发别素色发夹、米白罗纹针织开衫配浅杏连衣裙、斜挎帆布托特包）牵着@张三（娃娃脸婴儿肥大圆眼长睫毛黑色短碎发呆毛、天蓝小熊耳连帽卫衣）走在黄昏的街上，孩子跟妈妈说想吃东西，妈妈温柔地回应他，镜头先是全景然后慢慢推近最后切到孩子特写，两人有说有笑，大概五秒钟，画面温馨，@画风锁+暖金橙主调\n```\n\n**【第 1 轮评分：7.5 / 10 · 打回】**（编号按 KB_10 V1~V12）\n- V1 ✓（资产在册）\n- **V2 ◆ −1.5（取重计分项）**：证据\"（鹅蛋脸柳叶眉…帆布托特包）+（娃娃脸婴儿肥…连帽卫衣）\"——外貌 50+ 字堆砌，超 ≤2 词锚点配额\n- **V4 −0.5**：无秒级节点、\"大概五秒钟\"非 0.5s 网格（台词时长测算缺失与本题同源，从重并计不叠加）\n- **V12 −0.5**：缺画幅与秒数标注 → Σ=2.5 → **7.5**（已处否决线内）\n- 取重留档（不计分、修改义务不减）：**V3 ◆** 证据\"先是全景然后慢慢推近最后切到孩子特写\"=单镜三机位（崩坏04）｜**V5 ◆** 证据\"孩子跟妈妈说想吃东西，妈妈温柔地回应\"=双主体台词、无台词文本、无口型排他锁（崩坏05/16 双高危）｜V9 \"先推近再切特写\"复合运镜证据并入 V3 修改项\n\n**【打回重写指令单（第 1 轮）】**：\n1. 主体段压缩为\"米白开衫母亲@李梅与天蓝卫衣孩童@张三\"（各 1 词）；全部外貌移入首帧基准图职责（IMG-02）。\n2. 删除\"最后切到孩子特写\"——单镜单机位\"远景缓慢推近\"。\n3. 台词落 NARR-03 精算：张三台词\"妈妈，我要吃莽莽\"（8字/4字每秒≈2.2s+铺垫0.8s=3s）；李梅改\"双唇闭合含笑倾听\"（本镜单台词主体）。\n4. 补秒级节点 `[0-0.8秒]`/`[0.8-3秒]`；补画幅与秒数标注。\n5. 补空间分区句式（左1/3 母·一米六五 / 右2/3 子·一米一）。\n\n**✅ Good Case【修改稿】**（第 2 轮送检）：\n```prompt\n米白开衫母亲@李梅与天蓝卫衣孩童@张三行于@光大街边：画面左侧三分之一为成年女性@李梅（身高约一米六五），右侧三分之二为孩童@张三（身高约一米一），两人牵手间距一臂；[00-00.8s]远景镜头缓慢推近，母子缓步前行，@张三仰头拽动母亲衣角，梧桐树影斑驳、馄饨摊白雾轻晃；[00.8-03.0s]@张三抬头张嘴说话，嘴唇随台词自然开合：\"妈妈，我要吃莽莽\"（奶声奶气，尾音拖长，渴望语气）；一旁的@李梅保持双唇闭合、嘴角含笑低头倾听，不发一言，@画风锁+暖金橙主调黄昏柔焦光晕，16:9，3秒\n```\n\n**【第 2 轮评分：9.5 / 10 · 放行】**（V1~V12 逐项，编号同 KB_10）：\n- V1 ✓ ｜ V2 ✓ 锚点 1+1 词 ｜ V3 ✓ 单主动作（说话）+铺垫微动作 ｜ V4 ✓ 双节点 0.5s 网格 ｜ V5 ✓ 双锁齐（张嘴者+闭嘴者）｜ V6 ✓ 台词口型开合（语气标注）｜ V7 ✓ 测算在册（8 字÷4 字/秒+铺垫 0.8s=3s）｜ V8 ✓ 分区+身高差 ｜ V9 ✓ 单运镜\"缓慢推近\" ｜ V10 ✓ 无崩坏词 ｜ V11 ✓ 锁+缀挂载 ｜ V12 ✓ 画幅+秒数标注\n- 扣分 −0.5（审慎扣减）：\"拽衣角+树影斑驳+白雾轻晃\"三动态并列，虽属微动作/环境层允许范围，预留 0.5 分人工复核空间 → **9.5**\n- **使用建议**：即梦素材位 3 位（双立绘+空镜）；抽卡 3 次取\"双脸同真+李梅全程闭嘴\"；尾帧可复用作镜 4 前参考。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **三轮仍 <9.0**：出\"人工裁决单\"（问题清单+三轮演进+建议人工决策点）上报用户；该 Prompt 标记冻结，问题归档 EVO-01（可能暴露 KB 词库缺口）。\n2. **平台专属附加项**：指定平台的 Prompt 追加平台项核验——即梦（素材位清单/一致性行）、ComfyUI（双轨/节点单/负向包）、MiniMax（方括号单指令/声音栏）、可灵（首尾帧声明/幅度匹配）、豆包（三层分句/4K 缀）——缺项各扣 0.3（非否决）。\n3. **修改稿引入新问题**：只盯指令单条目复核+全表快扫——新问题新一轮计分，不因\"改了旧的\"豁免新的。\n4. **同一 Prompt 多平台版本**：每平台版本独立送检独立计分（语法差异不共享分数）。\n5. **用户坚持发布 <9.0 的 Prompt**：产出文档标注\"未过门禁·用户裁决发布\"，复盘占位预填\"重点关注：[否决项]\"——废片后 EVO-01 有据可归因。\n6. **打回单被 R5/R6 部分执行**：复审逐条对账——未执行条目原样重列并轮次+1；连续两轮部分执行升级导演介入。"},{"p":"skills/06_audio_edit_qc_skills/skill_retrospective_optimizer.md","t":"复盘自进化技能（EVO-01 · 自进化引擎）· 工业级完整版","d":"WHAT：复盘自进化引擎——解析产出文档底部「Prompt实际产出复盘」的标准工作流：崩坏关键词提取、缺陷定位(KB词典/平台插件/分镜层)、补丁自动生成并写入全局黑名单与对应Skill文件。WHEN：用户填写了实测复盘、反馈'翻车/崩了/效果不对'，或要求'优化框架/更新黑名单'时触发。","raw":"# 复盘自进化技能（EVO-01 · 自进化引擎）· 工业级完整版\n\n## 一、核心职责与工业级法则（7 条硬核铁律）\n\n1. **非占位即触发铁律**：总控每次任务开始时扫描产出文档中所有 `Prompt 实际产出复盘：` 字段——凡非\"占位\"即激活本技能；用户口头反馈\"翻车了\"同样触发（先补录进复盘字段再走流程）；**单张生成即刻反馈**（铁律7）：每张图/每段视频生成后即填即响应，不等整批。\n2. **编号归因铁律**：每条复盘必须归因到黑名单 01~17 编号；全部不匹配才立新号（从 18 起，附触发条件+根因假设+待验证标记）——\"归因不了就放着\"是框架腐烂的开始。\n3. **高频升级铁律**：同类崩坏在实战区归档 ≥3 次 → 自动升级为 KB_10 一票否决题 + 通知 QC-01 更新扣分表；\"屡犯不改\"的规则不是规则。\n4. **补丁落盘铁律**：归因必须落到具体文件的具体节区（\"KB_09 二节速查表 07 行\"+\"plat_jimeng 四节幅度建议表\"），修订内容直接写入文件本体并在文件内留 `<!-- EVO 修订 YYYY-MM-DD -->` 注释——只汇报不落盘=没修。\n5. **复测闭环铁律**：每次补丁附复测指令（哪些 Prompt 按新规则重跑、跑几次、看什么指标）——无复测的优化无法验证，黑名单永远是假设。\n6. **就地更新与旧版归档铁律（R9-20261005-5 修订废止旧\"禁改产出文档\"条款；R9-20261005-18 修正旧版残留矛盾）**：当用户填写复盘并完成 R9 调优后，必须**直接将产出文档主位置的代码块就地更新为修订后的最新 V2 版 Prompt**（遵守总控补丁6\"代码块 100% 纯净直发\"规范）；原首轮测试的 V1 旧版 Prompt 与首轮测试图，统一以 `<details><summary>🕰️ 点击展开：V1 首轮测试版 Prompt 与实测图归档<\/summary>`（**从 `<details>` 到 `<\/details>` 之间严禁出现任何空行，内部纯 HTML 闭合标签封装，对齐 AGENTS.md 纯 HTML 零空行封包法**）折叠收纳在该资产/分镜区块下方，保留证据链；并在用户每一条 `反馈：` 下方显式追加状态行 `> ✅ **【已处理 · R9-YYYYMMDD】**：[一句话归因+本条 Prompt 已执行的具体修改点]`——只修框架文件、把修订版藏进文末复测区，会让主位置永远留着错误旧版（2026-10-05 实测教训，已废止）。框架文件（黑名单/KB/Skill）照常同步修订，两者并行不悖。\n7. **单张生成即刻反馈·全局连坐刷新铁律（Micro-Macro Dual-Loop · R9-20261005-17 新立，废止\"整批跑完才复盘\"瀑布流）**：用户**每生成一张图/一段视频即填写一次复盘**，R9 即时响应并执行以下标准四步 SOP——\n   - **Step 1【三层根因定性】**：判定问题属于哪一层——`L1 个例层`（仅当前 Prompt 编译失误：错字/漏挂锁/单条记忆点漂移）、`L2 同族层`（同类角色/同时代装束/同类景别的系统性风险：如所有丫鬟型角色年龄塌缩、所有现代装 Prompt 锁错配）、`L3 全局风格包/编译层`（`PACK-XX` 六维或 KB_08 八层黄金语序本身的缺陷：如维度④禁词表漏词、媒介声明与锁不同源）。\n   - **Step 2【强制输出「全局防偏三问沙盘」】**：①**横向反作用自检**——本次修正对古/现不同时代、不同角色年龄原型、不同景别是否有反作用？（有则当场拆分条件分支，如\"及笄反锚\"只挂丫鬟型不挂女主型，防止把女主压成幼态）；②**纵向引用链自检**——列出受影响的下游分镜/资产清单（谁还在引用同一锁/同一参考图/同一编译模式）；③**主干词典与风格包冲突自检**——项目注册表与 `KB_05 PACK-XX`、`KB_01~12` 是否同步（防修了项目层、框架层仍留坑）。\n   - **Step 3【当前项就地重写 + 全文档同族连坐刷新（Ripple Update）】**：就地更新当前主代码块为最新纯文本版（旧版折入 `<details>` **零空行**归档，该条反馈标 `> ✅【已处理】`，铁律6）；凡属 `L2/L3` 问题，**必须当场自动扫描并同步复写当前项目所有文档中尚未测试但存在同类隐患的全部 Prompt**（同族角色/同时代装束/同景别逐一过新规则），输出《本次连坐刷新清单（共修改 X 处）》——漏刷 1 条即视为本次复盘未完成。\n   - **Step 4【双态沉淀 + 双擎重审】**：同步更新项目《资产注册表》（第五节 PACK 常量/同框关系锚/基准图版本）、全局黑名单（归档行+索引）及 `KB_05` 对应 `PACK-XX` 预设包（S 级包修订须复跑三图试金石；A 级包两轮验证后升 S）；随后**必须运行 `python scripts/qc_linter.py`（L1 机检 0 错误）+ R7 语义复审（L2 ≥9.0 双签）**，双签通过本次复盘方可闭环。\n\n## 二、标准执行 SOP（Step-by-Step · 标准工作流）\n\n**Step 1 · 提取崩坏关键词**：读复盘原文，按 4.1 症状词字典抽取关键现象词（\"嘴都动了/脸变了/腿穿了/糊了/闪了\"），规范化为症状术语（乱张嘴/身份漂移/肢体穿模/模糊/闪烁）。\n\n**Step 2 · 编号映射**：症状术语 → 对照 4.2 映射表命中黑名单编号；一条复盘含多个症状则逐个映射（一因多果也拆开）。\n\n**Step 3 · 缺陷定位**（为何门禁没拦住？）：按 4.3 定位树找漏网环节——①Prompt 是否含触发词（KB_09 词库缺口？）②评分表是否有对应检查项（KB_10 缺项？）③平台专属写法是否诱因（plat_* 正例缺失/参数基线错误？）④分镜层是否先天高危（VIS-01 拆镜不当）——定位到文件+节区。\n\n**Step 4 · 补丁生成**：按 4.4 模板产出修订内容——黑名单实战区归档行、KB_09 速查行、KB_10 扣分项（高频时）、plat_* 正反例/参数修订。\n\n**Step 5 · 落盘写入**：逐文件执行写入（Edit 落盘+修订注释）；确认输出各文件\"已写入\"；产出文档按铁律 6 就地更新主代码块为 V2 纯净直发版、折叠归档 V1 与首轮实测图、逐条回填 `✅【已处理】` 状态行。\n\n**Step 6 · 复测指令与汇报**：输出复测清单（镜号×次数×盯片指标）+ 向用户汇报优化摘要（改了什么/为什么/下次如何避免）。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约\n\n| 字段 | 类型 | 必填 | 示例 |\n|---|---|---|---|\n| 复盘原文 | text | 是 | \"镜2跑出来妈妈嘴也在动…\" |\n| Prompt 编号 | text | 是 | 第01集·分镜2·镜头1 |\n| 平台/模型 | text | 是 | 即梦 Seedance 2.0 |\n| 黑名单编号上限 | int | 是 | 17 |\n\n### 输出契约（下游：框架文件落盘 / 用户复测）\n\n```yaml\n关键词提取: [\"嘴也在动→乱张嘴\", \"脸不太像→轻微身份漂移\"]\n归因结论: [{症状: \"乱张嘴\", 编号: \"崩坏05\", 置信度: \"高\"}, {症状: \"身份漂移\", 编号: \"崩坏09\", 置信度: \"中(待复测)\"}]\n缺陷定位: [{文件: \"plat_jimeng.md\", 节: \"4.4幅度建议\", 缺陷: \"未声明'多人长条需中段重锚'\"}, {文件: \"KB_09.md\", 节: \"二节速查05行\", 缺陷: \"修正写法缺即梦素材位版本\"}]\n补丁清单: [{目标: \"全局复盘避坑黑名单.md·实战区\", 内容: \"归档行(见4.4模板)\"}, {目标: \"plat_jimeng.md\", 内容: \"4.4节追加'长条15秒重锚'规则+正例\"}]\n复测指令: [\"镜2按新版重跑2次：盯李梅全程闭嘴\", \"镜4参考图换面部特写重跑1次：盯第4秒脸稳\"]\n档案写入确认: [\"黑名单实战区+1行 ✓\", \"plat_jimeng 4.4 修订 ✓\"]\n```\n\n## 四、专项工具箱\n\n### 4.1 崩坏症状关键词字典（口语 → 术语 → 编号）\n\n| 用户口语（复盘常见） | 规范症状术语 | 映射编号 |\n|---|---|---|\n| 嘴都在动/嘴跟着动/全员说话 | 多人乱张嘴 | 崩坏05 |\n| 脸变了/不像了/越看越不像 | 身份漂移 | 崩坏09 |\n| 手指头多了/手糊了 | 手部崩坏 | 崩坏01 |\n| 腿穿过去了/腿打结 | 肢体穿模 | 崩坏07 |\n| 画面裂了/场景接不上 | 空间撕裂 | 崩坏04 |\n| 两个人长一块了/换脸了 | 多主体串脸 | 崩坏06 |\n| 一闪一闪的/背景在跳 | 背景闪烁 | 崩坏17 |\n| 白了一大片/曝了 | 高光过曝 | 崩坏10 |\n| 字是乱的 | 文字乱码 | 崩坏11 |\n| 剑不见了/东西变了 | 道具变形 | 崩坏12 |\n| 人闪现/瞬移了 | 位移瞬移 | 崩坏13 |\n| 嘴型对不上声音 | 口型不同步 | 崩坏16 |\n| 衣服粘身上了 | 衣物粘连 | 崩坏08 |\n| 眼睛不眨/眨太快 | 眨眼异常 | 崩坏15 |\n| 水不像水/布硬邦邦 | 流体布料违和 | 崩坏14 |\n| 转个头五官歪了 | 转身五官移位 | 崩坏03 |\n\n### 4.2 归因与定位树（为何门禁没拦住）\n\n```text\n症状命中编号 → 三问定位：\nQ1 该Prompt当时含触发词吗？\n ├─ 含 → 门禁失职 → 查KB_10对应项是否否决级/评分是否漏检 → 补丁: KB_10升级或QC流程\n └─ 不含（写法合规仍崩）→ Q2 平台特有诱因？\n     ├─ 是 → plat_*缺该场景正例/参数基线错 → 补丁: 平台插件修订\n     └─ 否 → Q3 分镜层先天高危（长条/多主体/大幅）？\n         ├─ 是 → VIS-01规则缺口 → 补丁: 拆镜/重锚规则升级\n         └─ 模型能力边界 → 补丁: 黑名单实战区标注\"该平台规避方案\"+选型路由降级建议\n```\n\n### 4.3 高频升级规则\n\n同类编号在黑名单实战区累计 ≥3 次 → ①KB_10 对应项升为否决级（若未是）②QC-01 扣分表同步 ③产出文档模板对应字段加粗提醒——三处同步落盘。\n\n### 4.4 补丁模板（逐文件）\n\n**黑名单实战区归档行**：\n```text\n【YYYY-MM-DD】平台/模型 ｜ 崩坏NN ｜ 触发Prompt片段（≤30字） ｜ 实际现象 ｜ 框架动作（补丁清单摘要）\n```\n**KB_09 速查行追加**：`| NN | 症状细化 | Prompt级修正写法（含平台版本） | 技法级修正 |`\n**plat_* 修订**：对应节追加规则句 + 一组正反例（❌触发写法 vs ✅修正写法）。\n**KB_10 升级**：该项分值/否决级调整 + 表下注\"依据：实战区N次归档\"。\n\n## 五、常见错误示范 vs 满分工业级示范\n\n### 对比组 1：复盘归因\n\n❌ **Bad Case**：\n> 用户复盘：\"镜2生成出来妈妈的嘴也在动，而且第二遍脸跟第一遍不一样。\"处理：回复\"好的，下次提示词会写得保守一点，多注意一致性。\"\n\n**扣分点**：未提取关键词、未映射编号（崩坏05/09 明明白白）；无缺陷定位（plat_jimeng 缺长条重锚规则这个真漏洞被放过）；无补丁落盘、无复测——同类问题必然第三次复发（违反全部六条铁律）。\n\n✅ **Good Case**：\n> 关键词：嘴也在动→乱张嘴(05)；脸不一样→身份漂移(09)。定位：Prompt 本身有排他锁（门禁无失职）→ 平台诱因=即梦 3 秒镜无需重锚但该用户误用 10 秒长条 → plat_jimeng 4.3 缺\"长条 15 秒重锚\"在本场景的强制化表述。补丁：①黑名单实战区归档 ②plat_jimeng 4.3 追加规则+正反例 ③复测：拆 3+7 秒两镜重跑 2 次盯\"李梅闭嘴+第 7 秒脸稳\"。——四件套齐活，落盘留痕。\n\n### 对比组 2：新崩坏立号\n\n❌ **Bad Case**：\n> 用户复盘：\"生成的人胸口徽章一直在旋转，像活的一样。\"处理：归到\"道具变形(12)\"完事。\n\n**扣分点**：徽章自旋≠道具变形（12 是丢失/形变，自旋是动态幻听式新现象）——强行套旧号会稀释词典精度，下次修正写法对不上。\n\n✅ **Good Case**：\n> 01~17 全不匹配 → 立新号 **崩坏18（贴附物自旋）**：触发条件\"胸前/墙上贴附小物件在视频中持续旋转\"；根因假设\"小贴附物动态自由度误释放\"；预防写法\"`徽章为静态缝制贴附物，不旋转不反光变化`\"；标\"待验证\"——两次复测命中后转正并同步 KB_09 速查表。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **新崩坏类型**：立号 18+（4.4 对比组 2 流程）；两次复测验证后转正，验证失败则归档\"个例/平台偶发\"不进主库。\n2. **跨平台共性崩坏**（豆包/即梦/可灵同现）：定位指向 KB 层（非单一 plat_*）——补丁落 KB_09/KB_10 通用词库，各 plat_* 只加引用不重复维护。\n3. **用户描述模糊**（\"就是感觉不对劲\"）：反问三选一锁定（脸的问题/动作的问题/画面质感的问题）+ 请用户贴一张废片截图；实在无法定位则按\"疑似 09\"低置信度归档待复测。\n4. **复盘指向分镜而非提示词**（\"这镜头就不该这么拍\"）：升级 VIS-01/VID-02 规则而非 KB_09——缺陷在哪层补丁打在哪层，禁止全打在提示词条上。\n5. **批量废片（整集翻车）**：先抽样 3 镜归因——若同根因（如画风锁被误改）走单补丁全集复测；若多因并发按频率排序逐个打补丁。\n6. **无复盘不进化**：用户长期不填复盘字段 → 定期（每 5 集）由总控输出\"复盘邀请卡\"（列出当前黑名单实战区空白状态与填写模板），降低填写门槛。"},{"p":"skills/06_audio_edit_qc_skills/skill_tts_voice_clone_workflow.md","t":"音色克隆工作流技能（AUD-01）· 工业级完整版","d":"WHAT：TTS音色克隆工作流技能——Fish Audio/Noiz/MiniMax/CosyVoice四平台音色特征卡模板（年龄/共鸣腔/采样标准）、克隆工作流步骤与全套情感/停顿/呼吸控制标签字典。WHEN：新角色音色落地、台词需要TTS合成方案、用户要求'配音/克隆声音/音色卡'时触发。","raw":"# 音色克隆工作流技能（AUD-01）· 工业级完整版\n\n## 一、核心职责与工业级法则（6 条硬核铁律）\n\n1. **干声标准铁律**：克隆参考音频必须干声——发音清晰、情绪平稳、背景干净（无 BGM/无混响/无他人声）；Fish Audio 最少 10 秒、推荐 15~30 秒（更准复刻说话模式）、最佳 1~3 分钟；ComfyUI Instant Voice Clone 节点 1~20 段、每段 10~30 秒、总时长硬校验 <270 秒。\n2. **参数真实铁律**：只用 KB_12 收录的真实克隆参数与标签语法（Fish S2 词级、MiniMax `<#>`/`( )`、CosyVoice `<|HAPPY|>` instruct 模式）——**严禁编造**\"情感强度 87%\"之类不存在的参数。\n3. **注音先行铁律**：每句台词先过\"注音方案\"再合成——副语言标签+语速档+重音字+停顿位+多音字/儿化标注；裸文本直接合成=机器念稿。\n4. **音色ID唯一铁律**：每个角色一个音色ID（`音色-@资产名-特征摘要`），登记资产注册表后跨集复用不重制；换音色=新 ID+双签（等于换演员）。\n5. **音频可替换铁律（R9-20261005-2）**：生成视频的原生音频仅占位参考——TTS/克隆是成片人声主路径；合成后走\"静音原轨→降噪→美化→逐句手动对齐口型（±2 帧）\"闭环（AI 对口型可选，联动 R8）。\n6. **平台分工铁律**：Fish Audio=真人克隆主力；MiniMax=情绪标签与儿童声；CosyVoice=本地批量+instruct 副语言；Noiz=快速风格化备选——按角色特征自动分配，不平均用力。\n\n## 二、标准执行 SOP（Step-by-Step）\n\n**Step 1 · 读基线**：读角色音色基线（质感/语速档/情感倾向）与台词清单（含 NARR-03 控制符串）。\n\n**Step 2 · 选平台**：按铁律 6 分配——有干声且要复刻→Fish Audio；情绪浓/童声→MiniMax；本地批量→CosyVoice；快速占位→Noiz/预设。\n\n**Step 3 · 填音色卡**：按 4.1 四平台模板逐字段填写（年龄/共鸣腔/质感/语速/参考音频要求/克隆参数）。\n\n**Step 4 · 注音**：逐句台词落\"注音方案\"——从 `KB_12` 第二节「副语言控制标签字典」（唯一权威源）选标签，标重音字与停顿位，多音字注音。\n\n**Step 5 · 合成与验收**：执行克隆工作流（4.2 步骤）；验收标准=音色像度（与基线比对）+情感达标+无电音/吞字。\n\n**Step 6 · 登记交付**：音色ID 登记注册表；交付 R8（轨位/对口型流程/响度 -6dB 入轨）。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约\n\n| 字段 | 类型 | 必填 | 示例 |\n|---|---|---|---|\n| 角色 | @资产名 | 是 | @李梅 |\n| 音色基线 | 结构化 | 是 | 温软治愈/4字每秒/尾音轻扬 |\n| 平台 | enum | 否 | 自动分配 |\n| 台词清单 | list | 是 | 含 NARR-03 控制符串 |\n\n### 输出契约（下游：R8 混音 / 注册表 / 后期音频替换）\n\n```yaml\n音色特征卡: {平台: \"Fish Audio\", 音色ID: \"音色-李梅-温软治愈女声\", 共鸣腔: \"胸腔偏前+软腭轻抬\", 参考音频: \"20~25秒干声(含一段安慰语气)\", 克隆参数: \"Instant Voice Clone(总<270秒)+S2词级控制'买'重音\"}\n注音方案: [{台词: \"张三，上次我们才吃了，等爸爸回来给你买\", 标签串: \"(softly)…(breath)…\", 语速: \"4字/秒\", 重音: \"爸@2.2s/买@3.6s\", 多音字: \"'吃了'轻声\"}]\n音色ID登记单: {新增: [\"音色-李梅-温软治愈女声\"], 复用: []}\n交付剪映备注: \"人声轨-6dB；音频替换：静音原轨导入后±2帧手动对齐（AI对口型可选）；导出响度见R8四轨SOP\"\n```\n\n## 四、专项工具箱\n\n### 4.1 四平台音色特征卡模板（逐字段）\n\n**Fish Audio 卡**：\n```text\n音色ID：音色-@资产-特征摘要\n年龄感：34岁年轻感 ｜ 共鸣腔：胸腔偏前、软腭轻抬（暖而不闷）\n音色质感：温软圆润、气声占比中、无沙哑\n语速档：正常 4 字/秒（安慰段 3.5） ｜ 情感倾向：尾音轻扬带暖意\n参考音频要求：15~30 秒干声（最少 10 秒可克隆；最佳 1~3 分钟）；含\"自然陈述+轻柔安慰\"两种能量态；ComfyUI 节点总时长 <270 秒\n克隆参数：Instant Voice Clone；S2 词级控制标注重音字与拖音\n```\n**Noiz 卡**：`风格化预设选型（年龄感+性别+质感三键筛选）→ 微调音高±2半音/语速±10% → 试听 3 句定版；无克隆需求时作快速占位`。\n**MiniMax 卡**：`音色选型：预设库\"温柔女声/儿童声\"微调（音调+3、语速-10%）｜ 情绪机制：文本内嵌 <#> 情绪标签 + ( ) 停顿 ｜ 混合音色可选（对白+旁白双声）`。\n**CosyVoice 卡**：`模式：instruct（副语言自然语言指令：\"用压抑着难过的平静语气说\"）｜ 头部情感标记：<|HAPPY|>/<|SAD|>/<|ANGRY|>/<|SURPRISED|>/<|CALM|>（全大写、长文可多点插入）｜ 克隆：3 秒样本即可（音色像度要求低时用）；已知限制：2.0 克隆模式下自然语言语气描述可能失效→语气控制一律走 instruct`。\n\n### 4.2 克隆工作流步骤（以 Fish Audio 为例）\n\n1. 录/选干声（手机安静房 20 秒，距嘴一拳，勿压嗓）→ 2. 上传 Instant Voice Clone（校验 <270 秒）→ 3. 试合成 3 句基准台词（含一句重音句）→ 4. 像度验收（与基线比对，不像则加样本至 40 秒重克隆）→ 5. 台词批量合成（注音方案逐句）→ 6. 剪映入轨（静音原视频轨；人声 -6dB，智能降噪→人声美化）→ 7. TTS 逐句对齐口型重音秒位，±2 帧微调 → 8. 音色ID 登记与音频归档（文件名=集数_镜号_音色ID）。\n\n### 4.3 副语言标签字典 · 调用指针（表存于 KB_12）\n\n> 去重铁律：情感 / 笑叹泣 / 呼吸 / 停顿 / 重音 / 语速 / 声调及 MiniMax、CosyVoice、Fish S2 平台专属语法共 40 词条，以 `KB_12` 第二节「副语言控制标签字典」为唯一权威源，本技能不抄写副本——注音时现查现用；语速档位查 `KB_12` 第三节「语速基准表」。\n\n## 五、常见错误示范 vs 满分工业级示范\n\n### 对比组 1：注音方案\n\n❌ **Bad Case**：\n> 台词：\"妈妈，我要吃莽莽\"。合成设置：音色选儿童声，其他默认，直接生成。\n\n**扣分点**：裸文本机器念稿——无情感标签、无拖音（\"莽莽\"是钩子词）、无重音；默认语速偏快失去奶音感；未联动 NARR-03 的 2.2s 时长（口型将对不上）。\n\n✅ **Good Case**：\n> 注音方案：`(excited)` 前置 + 语速 4 字/秒 + 重音\"吃\"（开口后 1.4s）+ \"莽莽\"mǎng-mǎng 轻声拖长尾音；平台 MiniMax 儿童预设（音调+3、语速-10%）；合成时长校验=2.2s±0.2s（对齐 NARR-03）；入轨后 ±2 帧手动对齐口型。\n\n### 对比组 2：参考音频质量\n\n❌ **Bad Case**：\n> 用一段带背景音乐的短视频人声做克隆素材，8 秒长，里面还夹着别人的笑声。\n\n**扣分点**：非干声（BGM+混响+他人声）——克隆出的音色带\"音乐底噪人格\"；8 秒低于 Fish 10 秒下限；含他人声会串音色（音频版\"串色\"）。\n\n✅ **Good Case**：\n> 20 秒纯净干声（安静房手机距嘴一拳录制），含\"自然陈述一句+轻柔安慰一句\"两种能量态；上传前剪辑去头尾气口杂音；总时长 20s（<270s 校验通过）；试合成 3 句验收像度后定版，音色ID 登记。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **童声合规**：优先 MiniMax/平台儿童预设（微调实现），避免克隆真实儿童声音的授权风险；确需克隆须有监护人授权样本。\n2. **方言/多语种台词**：先折普通话字数测时长（方言 ÷0.9）；Fish 支持 13+ 语种零样本跨语种；CosyVoice SSML 控发音。\n3. **多音字/生僻名**：注音方案显式标注（\"莽莽=mǎng mǎng 轻声\"\"燕=yān 作地名\"）；合成后逐句听校，错读重合成该句。\n4. **参考音频不足 10 秒**：Fish 降级不可用——转 CosyVoice（3 秒可克隆，像度打折）或 MiniMax 近似预设微调；并在音色卡备注样本局限。\n5. **克隆像度不足（三句验收不像）**：加样本时长（20→40 秒）重克隆；仍不像→改\"风格近似\"策略（预设微调+注音方案补味），并在注册表标注\"近似音色\"。\n6. **长集批量合成（40+ 句）**：CosyVoice 本地批处理（instruct 统一基线）；逐句文件名含镜号；批量后抽检 20% 句听校（电音/吞字/抢拍）。"}]},{"g":"全局记忆","items":[{"p":"memory/global/权威工作流与影视知识库.md","t":"权威工作流与影视知识库（全局记忆层）","d":"","raw":"# 权威工作流与影视知识库（全局记忆层）\n\n> 本文档由框架初始化阶段的靶向联网检索提炼而成，是整个【AIGC 影视与短剧多智能体工业化创作框架】的知识地基。\n> 所有角色智能体（Roles）、专业词典（KB）与技能插件（Skills）在产出提示词时，必须优先引用本文档中经过核实的权威结论，**严禁凭空编造平台语法、特效菜单名与模型能力**。\n> 检索时间：2026-10 ｜ 用途：跨项目全局共享 ｜ 维护者：复盘自进化引擎\n\n---\n\n## 一、高星权威开源仓库架构提炼（学系统骨架）\n\n### 1.1 anthropics/skills（官方 Agent Skills 规范，179k+ Stars）\n- **核心规范**：一个 Skill = 一个文件夹 + 一个 `SKILL.md`；文件顶部必须有 YAML Frontmatter，其中 `name` 与 `description` 为必填字段，`description` 是决定智能体是否自动调用该 Skill 的**首要触发机制**。\n- **description 黄金结构**：必须同时包含 **WHAT（这个技能做什么）+ WHEN（什么条件下触发使用）**，例如：\"为即梦 Seedance 撰写多主体参考视频提示词。当用户指定即梦平台或需要多图参考融合时触发。\"\n- **按需加载（Progressive Disclosure）三段式**：① 元数据层（name/description，常驻索引）→ ② 正文层（SKILL.md 主体，调用时才读取）→ ③ 附属资源层（词典、脚本，执行到对应步骤才读取）。本框架的 `skills/SKILL_INDEX.md` 路由即仿照此机制设计，用于在 ZCode / Trae / WorkBuddy 中节省上下文 Token。\n- **常见故障**：Skill 无法被识别的首要原因是 Frontmatter 缺失或 YAML 格式错误——本框架所有 Skill 文件创建时必须自检 Frontmatter 完整性。\n\n### 1.2 chatfire-AI/huobao-drama（火宝短剧，15k+ Stars，AI 短剧一站式平台）\n- **全流程管线**（本框架三阶流水线直接吸收）：\n  `小说原文导入 → AI 改写为可拍摄剧本（按集拆分、标注场景与角色） → 角色/场景/道具一致性资产提取与生成 → 分镜拆解 → 基于资产参考的视频提示词生成 → 视频合成`。\n- **关键设计**：剧本阶段即\"按集拆分并标注场景与角色\"，角色形象提取后以**资产引用（本框架升级为 `@中文资产名称` 体系）**方式注入后续所有生图与生视频提示词，保证跨镜头一致性。\n- **多模型路由**：文本模型（改写）、图像模型（资产/分镜图）、视频模型、TTS 模型分离配置——对应本框架\"平台插件式 Skills\"分层。\n\n### 1.3 HKUDS/ViMax（港大多智能体视频框架，12k+ Stars）\n- **多智能体协同管线**：Screenwriter（编剧）→ Shot Planner（分镜规划）→ Character Styling（角色造型）→ Image Generation → Video Generation → **VLM-based Quality Control（视觉语言模型质检回路）** → Final Assembly。导演（Director）+ 编剧 + 制片人（Producer）三核心角色统筹。\n- **首帧一致性（First Frame Consistency）**：视频片段的画面一致性依赖\"先生成关键帧图像，再以该图像作为视频首帧\"的锚定策略——这正是本框架\"分镜前置资源（首帧基准图）\"的理论来源。\n- **质检回路**：生成结果先经视觉语言模型审片打分，不合格自动打回重生成——本框架\"10 分制评分官 + 低于 9 分强制重写\"机制由此强化。\n\n### 1.4 FoundationAgents/MetaGPT 与 crewAIInc/crewAI（多智能体协作范式）\n- **结构化交接契约（Hand-off Schema）**：角色之间不传闲聊，只传\"结构化文档\"——编剧交出标准剧本 JSON/表格，导演交出分镜表，美术交出资产设定卡。下游角色只依赖上游的结构化产物工作。本框架规定每个角色的\"输出 Schema\"即由此而来。\n- **质量门禁与打回（Guardrail）**：crewAI 的 Task 可挂 Guardrail 回调，输出不达标即拦截并要求重做——本框架评分官的\"一票否决扣分题库 + 强制重写回路\"同源。\n- **角色=职责+工具+预期输出**：定义智能体时必须写清三者，防止角色越界互相抢活。\n\n### 1.5 垂直提示词实战库（awesome-seedance 系列等）\n- **按秒切分时间轴写法**：`[0-2s] 镜头缓推，主角抬头；[2-5s] 衣袂翻飞，握紧剑柄`——Seedance 2.5 官方即支持秒级时间戳分段叙事，单条最长可达 30 秒。\n- **一镜一主动作原则**：单个 5 秒镜头只安排一个主动作 + 一个镜头运动，多动作串联必拆多镜，否则模型在时间轴中段动作漂移。\n- **多宫格分镜垫图法（Storyboard Grid）**：用一张网格图（如 2x2 四格）垫底生成连贯分镜，再逐格裁切为视频首帧，可低成本锁定同一场景内的构图延续性。\n- **对白时长测算**：中文正常语速约 4 字/秒，急促 5.5 字/秒，沉吟 2.5 字/秒——台词字数除以语速再加情绪停顿 0.3~0.8 秒，得镜头最短时长。\n\n---\n\n## 二、四大靶向专业数据（核实版词库与语法）\n\n### 2.1 靶向一：扩散模型零光影正交三视图 & Albedo 固有色词库\n\n**原理**：扩散模型对否定词（\"无高光\"\"无阴影\"）不敏感——否定词在 cross-attention 中反而注入了\"高光/阴影\"的概念激活。正确做法是**用正面物理状态描述替代否定**，即描述\"光被均匀化了\"这一事实，而非\"光不存在\"。\n\n**核心正面词库（中文编译版，已核实）**：\n- 布光状态：`360度环形无影棚拍柔光`、`大型柔光箱正面平光`、`均匀漫射平光（Flat Even Lighting）`、`影棚基准平光`\n- 贴图质感：`漫反射固有色贴图质感（Flat Lit Albedo / Diffuse Pass）`、`PBR 漫反射贴图`、`哑光固有色`\n- 投影方式：`正交投影相机（Orthographic Projection）`、`零透视畸变`、`平行投影无近大远小`\n- 背景规范：`中性18%灰背景`、`纯白背景`、`无接缝纯色背景（Seamless Backdrop）`\n- 姿态规范：`A-Pose 双臂自然微张`（防衣袖与躯干粘连，优于 T-Pose）、`T-Pose 双臂水平展开`（适合需要完整展袖的服装）、`双脚与肩同宽站立基准`\n- 版式规范：`角色设定三视图（Turnaround Sheet）`、`正面/左侧面/背面三视图等距水平排列`、`model sheet 排版`、`同一角色三个视角比例严格一致`\n\n**国际通用英文关键词对照**（供 ComfyUI/Flux 类英文语义更强的模型使用）：\n`character turnaround sheet, three view (front / side / back), orthographic projection, T-pose / A-pose, full body, consistent proportions, flat lighting, albedo map style, neutral white background, model sheet layout`\n\n**三视图 vs 单镜头参考的关键区分（防\"三个人同框\"崩坏）**：\n- 三视图**只用于锁定资产设定**（人设存档、LoRA 训练集、重绘参考）。\n- 喂给视频模型做首帧/参考图时，**必须先裁切出单一视角的\"独立全身立绘\"或\"独立面部特写\"**，否则视频模型会把三视图识别为三个人同框，导致多人乱张嘴、串脸、复制人。\n- 因此资产库中每个角色除三视图外，必须额外产出：`独立正面全身立绘图` + `独立面部特写图`（均为零光影平光规范）。\n\n### 2.2 靶向二：各平台最新真实语法特征\n\n**① 豆包（Seedream 4.0，生图）**——中式美学与空间排布之王\n- 中文原生理解优秀，**无需翻译成英文**；直接写中文打光术语即可精准响应：`伦勃朗光`、`轮廓光`、`逆光`、`分割光`、`环形光`、`顶光`。\n- **长文本空间方位语法**：按\"前景…中景…远景…\"分句描述，4.0 对空间层次理解极强，可精准执行 `画面左侧三分之一` / `右侧三分之二` / `左前景虚化` 等排布指令。\n- 分辨率控制：提示词末尾缀 `2K` / `4K`；4.0 原生支持 4K 与组图生成、多图融合创作。\n- 适合：东方玄幻场景、人物主图、多主体空间分区构图、海报级质感图。\n\n**② 即梦（Jimeng / Seedance，生视频）**——多主体参考融合与分秒叙事\n- **多模态参考**：Seedance 2.x 支持上传多张参考素材（人物图、场景图、道具图，2.5 版最多可达 50 个素材位），在提示词中以引用关系绑定。\n- **秒级时间轴**：官方支持 `[0-4秒]…[5-10秒]…` 时间戳分段叙事，单条最长 30 秒。\n- **结构化公式**：`主体（外貌+服装）+ 动作序列 + 镜头语言（推/拉/摇/移/跟随/环绕）+ 视觉风格 + 约束条件`。\n- **原生音画同出**：Seedance 支持直出对白与音效，写明台词文本与语气即可生成带口型的说话画面（原生音画直出首选平台之一；音频不满意后期静音原轨换 TTS）。\n\n**③ MiniMax 海螺（H3，生视频）**——多模态统一与运镜指令\n- H3 为通用多模态视频模型：文/图/首末帧输入（T2VA / I2VA / Frames）、原生预测视频帧 + 32kHz 立体声音轨（对白、音效、音乐可同出）。\n- **参考模式（Reference Mode）**：支持素材标记与保留标记词，六栏位结构化提示词（主体参考/动作/时间节拍/声音设计等）。\n- **方括号运镜指令**：社区实战语法以方括号置于句首/句中控制运镜：`[推近]`、`[拉远]`、`[左移]`、`[右移]`、`[上摇]`、`[下摇]`、`[环绕]`、`[固定]`；配合细腻面部微表情递进描述（`嘴角缓缓上扬`、`眼神从错愕转为狠戾`）效果拔群。官方另提供 9 个可直接套用的 Skill 模板。\n- 适合：情感戏、微表情特写、带原生对白音频的镜头（原生音频仅占位参考，后期可整轨替换 TTS）。\n\n**④ ComfyUI（Flux + Wan2.1/2.2，工作流自建）**——可控性天花板\n- **Flux 主体一致性**：PuLID（人脸 ID 锁定）、IP-Adapter（风格/角色参考注入）、Redux（参考图重铺）；LoRA 权重常规 0.6~0.85，过高（>0.9）易画风僵硬。\n- **ControlNet 组合**：Depth（景深结构）、OpenPose（姿态骨架）、Canny/线稿（边缘轮廓）；视频侧 Wan2.1 Fun Control 官方工作流支持姿态/深度/边缘三分支引导视频生成。\n- **Wan 视频模型**：支持动态幅度控制（Motion Strength / 视频差分引导），图生视频以首帧锚定；Wan2.2-S2V 支持无限时长数字人口播。\n- **标准 Negative Prompt 传统**：ComfyUI 生态保留独立负向词输入端，可用\"多余手指、肢体畸变、面部扭曲、闪烁、伪影\"等负向词兜底。\n- 适合：B 级降本镜头（静态图+关键帧）、大批量资产图、极端可控的 S 级精修。\n\n**⑤ 可灵（Kling，生视频）**——首尾帧锚定与物理规律\n- **提示词公式（官方）**：`主体（主体描述）+ 运动 + 场景（场景描述）+（镜头语言 + 光影 + 氛围）`，核心是主体+运动+场景。\n- **首尾帧（First & Last Frame）**：上传首帧+尾帧两张图锚定起止画面，提示词只描述中间过渡运动；**运镜幅度必须匹配首尾帧画面差异**，否则运镜指令不执行。\n- **物理规律**：3D 时空联合注意力机制可模拟真实物理（重力、惯性、碰撞），提示词写符合物理的动作描述效果更佳。\n- **锚点间隔**：多镜头分段叙事时，时间锚点间隔至少 3 秒，否则分镜切换生硬；主体崩坏时增加外貌细节描述 + 使用主体参考。\n- 适合：S 级长镜头、大幅度打斗、首尾帧精准控制的奇观镜头。\n\n### 2.3 靶向三：剪映专业版真实菜单名 & TTS 真实语音标签（严禁编造）\n\n**剪映专业版·曲线变速（入口：选中素材 → 右侧调节面板 →「变速」→「曲线变速」）**——系统内置 6 种预设，名称核实无误：\n| 预设名 | 节奏效果 | 典型用途 |\n|---|---|---|\n| `蒙太奇` | 先慢后快再慢 | 片头快速闪过、结尾聚焦 |\n| `英雄时刻` | 突然变慢再恢复 | 高光/燃点瞬间 |\n| `子弹时间` | 极致慢放 | 动作定格、戏剧化瞬间 |\n| `跳接` | 节奏跳跃 | 卡点、快剪 |\n| `闪进` | 开场加速 | 无缝入场转场 |\n| `闪出` | 结尾加速 | 无缝出场转场 |\n另支持自定义曲线（横轴时间、纵轴速度倍数拖锚点调节）。\n\n**剪映专业版·转场特效（入口：「转场」面板，白色竖线衔接处应用）**：\n- 基础类：`叠化`（含淡入淡出，建议时长 0.2~0.3 秒）、`闪黑`、`闪白`\n- 运镜类：`推进`、`拉远`、`左移`、`右移`、`旋转`、`模糊`\n- 光效与 MG 类：`漏光`（特效→氛围/光效分类）、`故障`（转场-特效中搜索\"故障\"，故障模糊）、`燃烧`\n- 快捷键：`Alt+T` 打开转场面板\n\n**剪映专业版·音频处理（入口：音频轨道 → 音频调节面板）**：\n- `人声美化`、`智能降噪`、`声音克隆`（内置音色复刻）、`变声`、`音频卡点`（节拍标记自动对齐）\n\n**TTS 平台真实参数与副语言控制符（核实版）**：\n- **Fish Audio**：参考音频最少 10 秒可克隆，15~30 秒更准确复刻说话模式与情感，官方建议最佳 1~3 分钟；ComfyUI Instant Voice Clone 节点接受 1~20 段录音、每段 10~30 秒、总时长硬性校验 <270 秒；S2 版本支持行内开放域标签与词级控制（如重音、停顿、语种切换）。\n- **MiniMax 语音（speech 系列）**：预设库标签可直接内嵌文本——情绪标签 `<#>`、停顿 `( )`、语气词标记；支持混合音色与情感风格调节。\n- **CosyVoice**：instruct 指令模式可用自然语言控制副语言；文本开头使用全大写情感标记 `<|HAPPY|>`、`<|SAD|>`、`<|ANGRY|>` 等，长文本可插入多个标记实现情感转换；克隆模式 3 秒即可，但 2.0 克隆模式下自然语言语气描述可能失效（已知问题，需 instruct 模式）。\n- **通用副语言写法（英文括号/方括号标签，多数平台兼容）**：`(sigh)` 叹气、`(laughter)`/`[laughter]` 笑声、`(breath)` 换气、`(pause)` 停顿、`(whisper)` 气声；语速以倍率或字/秒指定；情绪以\"开心/悲伤/愤怒/惊讶/平静\"等标签前置。\n\n### 2.4 靶向四：AI 视频 17 种高频物理崩坏条件（Failure Modes）\n\n详见姊妹文档《全局复盘避坑黑名单.md》的 17 条编号崩坏模式库（含触发条件、根因、预防写法、一票否决扣分规则）。此处列出速查索引：\n手部六指/手指融化、双手十指交叉穿模、360 度转身五官移位、单镜多机位硬切空间撕裂、多人同框全员乱张嘴、多主体串色串脸、快速奔跑双腿交替穿模、衣物与身体粘连、面部身份漂移（越动越不像）、首帧强逆光过曝崩坏、文字与招牌乱码、道具中途变形、人物瞬移/穿墙、液体与布料物理违和、眨眼缺失或高频抽搐、口型与台词不同步、背景周期性闪烁。\n\n---\n\n## 三、各 AI 平台模型优劣对比与选型路由表\n\n| 平台/模型 | 类型 | 核心优势 | 主要短板 | 本框架推荐用途 |\n|---|---|---|---|---|\n| 豆包 Seedream 4.0 | 生图 | 中文理解顶级、4K 原生、空间方位精准、光影术语直响应 | 动态视频非其职 | 人物主图、场景全景、多主体分区构图、海报 |\n| 即梦 Seedance 2.x | 生视频 | 多参考素材（最多50）、秒级时间轴、原生对白音画同出 | 长镜头物理偶发漂移 | 对白镜头、多主体融合、30秒内叙事 |\n| MiniMax 海螺 H3 | 生视频 | 多模态统一、[运镜]指令、微表情细腻、32kHz立体声 | 极限动作幅度受限 | 情感特写、微表情戏、带声镜头 |\n| 可灵 Kling | 生视频 | 首尾帧锚定精准、物理规律模拟强、大幅度运动合理 | 提示词公式约束较强
