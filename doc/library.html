| 多人乱张嘴 | 崩坏05 |\n| 脸变了/不像了/越看越不像 | 身份漂移 | 崩坏09 |\n| 手指头多了/手糊了 | 手部崩坏 | 崩坏01 |\n| 腿穿过去了/腿打结 | 肢体穿模 | 崩坏07 |\n| 画面裂了/场景接不上 | 空间撕裂 | 崩坏04 |\n| 两个人长一块了/换脸了 | 多主体串脸 | 崩坏06 |\n| 一闪一闪的/背景在跳 | 背景闪烁 | 崩坏17 |\n| 白了一大片/曝了 | 高光过曝 | 崩坏10 |\n| 字是乱的 | 文字乱码 | 崩坏11 |\n| 剑不见了/东西变了 | 道具变形 | 崩坏12 |\n| 人闪现/瞬移了 | 位移瞬移 | 崩坏13 |\n| 嘴型对不上声音 | 口型不同步 | 崩坏16 |\n| 衣服粘身上了 | 衣物粘连 | 崩坏08 |\n| 眼睛不眨/眨太快 | 眨眼异常 | 崩坏15 |\n| 水不像水/布硬邦邦 | 流体布料违和 | 崩坏14 |\n| 转个头五官歪了 | 转身五官移位 | 崩坏03 |\n\n### 4.2 归因与定位树（为何门禁没拦住）\n\n```text\n症状命中编号 → 三问定位：\nQ1 该Prompt当时含触发词吗？\n ├─ 含 → 门禁失职 → 查KB_10对应项是否否决级/评分是否漏检 → 补丁: KB_10升级或QC流程\n └─ 不含（写法合规仍崩）→ Q2 平台特有诱因？\n     ├─ 是 → plat_*缺该场景正例/参数基线错 → 补丁: 平台插件修订\n     └─ 否 → Q3 分镜层先天高危（长条/多主体/大幅）？\n         ├─ 是 → VIS-01规则缺口 → 补丁: 拆镜/重锚规则升级\n         └─ 模型能力边界 → 补丁: 黑名单实战区标注\"该平台规避方案\"+选型路由降级建议\n```\n\n### 4.3 高频升级规则\n\n同类编号在黑名单实战区累计 ≥3 次 → ①KB_10 对应项升为否决级（若未是）②QC-01 扣分表同步 ③产出文档模板对应字段加粗提醒——三处同步落盘。\n\n### 4.4 补丁模板（逐文件）\n\n**黑名单实战区归档行**：\n```text\n【YYYY-MM-DD】平台/模型 ｜ 崩坏NN ｜ 触发Prompt片段（≤30字） ｜ 实际现象 ｜ 框架动作（补丁清单摘要）\n```\n**KB_09 速查行追加**：`| NN | 症状细化 | Prompt级修正写法（含平台版本） | 技法级修正 |`\n**plat_* 修订**：对应节追加规则句 + 一组正反例（❌触发写法 vs ✅修正写法）。\n**KB_10 升级**：该项分值/否决级调整 + 表下注\"依据：实战区N次归档\"。\n\n## 五、常见错误示范 vs 满分工业级示范\n\n### 对比组 1：复盘归因\n\n❌ **Bad Case**：\n> 用户复盘：\"镜2生成出来妈妈的嘴也在动，而且第二遍脸跟第一遍不一样。\"处理：回复\"好的，下次提示词会写得保守一点，多注意一致性。\"\n\n**扣分点**：未提取关键词、未映射编号（崩坏05/09 明明白白）；无缺陷定位（plat_jimeng 缺长条重锚规则这个真漏洞被放过）；无补丁落盘、无复测——同类问题必然第三次复发（违反全部六条铁律）。\n\n✅ **Good Case**：\n> 关键词：嘴也在动→乱张嘴(05)；脸不一样→身份漂移(09)。定位：Prompt 本身有排他锁（门禁无失职）→ 平台诱因=即梦 3 秒镜无需重锚但该用户误用 10 秒长条 → plat_jimeng 4.3 缺\"长条 15 秒重锚\"在本场景的强制化表述。补丁：①黑名单实战区归档 ②plat_jimeng 4.3 追加规则+正反例 ③复测：拆 3+7 秒两镜重跑 2 次盯\"李梅闭嘴+第 7 秒脸稳\"。——四件套齐活，落盘留痕。\n\n### 对比组 2：新崩坏立号\n\n❌ **Bad Case**：\n> 用户复盘：\"生成的人胸口徽章一直在旋转，像活的一样。\"处理：归到\"道具变形(12)\"完事。\n\n**扣分点**：徽章自旋≠道具变形（12 是丢失/形变，自旋是动态幻听式新现象）——强行套旧号会稀释词典精度，下次修正写法对不上。\n\n✅ **Good Case**：\n> 01~17 全不匹配 → 立新号 **崩坏18（贴附物自旋）**：触发条件\"胸前/墙上贴附小物件在视频中持续旋转\"；根因假设\"小贴附物动态自由度误释放\"；预防写法\"`徽章为静态缝制贴附物，不旋转不反光变化`\"；标\"待验证\"——两次复测命中后转正并同步 KB_09 速查表。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **新崩坏类型**：立号 18+（4.4 对比组 2 流程）；两次复测验证后转正，验证失败则归档\"个例/平台偶发\"不进主库。\n2. **跨平台共性崩坏**（豆包/即梦/可灵同现）：定位指向 KB 层（非单一 plat_*）——补丁落 KB_09/KB_10 通用词库，各 plat_* 只加引用不重复维护。\n3. **用户描述模糊**（\"就是感觉不对劲\"）：反问三选一锁定（脸的问题/动作的问题/画面质感的问题）+ 请用户贴一张废片截图；实在无法定位则按\"疑似 09\"低置信度归档待复测。\n4. **复盘指向分镜而非提示词**（\"这镜头就不该这么拍\"）：升级 VIS-01/VID-02 规则而非 KB_09——缺陷在哪层补丁打在哪层，禁止全打在提示词条上。\n5. **批量废片（整集翻车）**：先抽样 3 镜归因——若同根因（如画风锁被误改）走单补丁全集复测；若多因并发按频率排序逐个打补丁。\n6. **无复盘不进化**：用户长期不填复盘字段 → 定期（每 5 集）由总控输出\"复盘邀请卡\"（列出当前黑名单实战区空白状态与填写模板），降低填写门槛。"},{"p":"skills/06_audio_edit_qc_skills/skill_tts_voice_clone_workflow.md","t":"音色克隆工作流技能（AUD-01）· 工业级完整版","d":"WHAT：TTS音色克隆工作流技能——Fish Audio/Noiz/MiniMax/CosyVoice四平台音色特征卡模板（年龄/共鸣腔/采样标准）、克隆工作流步骤与全套情感/停顿/呼吸控制标签字典。WHEN：新角色音色落地、台词需要TTS合成方案、用户要求'配音/克隆声音/音色卡'时触发。","raw":"# 音色克隆工作流技能（AUD-01）· 工业级完整版\n\n## 一、核心职责与工业级法则（6 条硬核铁律）\n\n1. **干声标准铁律**：克隆参考音频必须干声——发音清晰、情绪平稳、背景干净（无 BGM/无混响/无他人声）；Fish Audio 最少 10 秒、推荐 15~30 秒（更准复刻说话模式）、最佳 1~3 分钟；ComfyUI Instant Voice Clone 节点 1~20 段、每段 10~30 秒、总时长硬校验 <270 秒。\n2. **参数真实铁律**：只用 KB_12 收录的真实克隆参数与标签语法（Fish S2 词级、MiniMax `<#>`/`( )`、CosyVoice `<|HAPPY|>` instruct 模式）——**严禁编造**\"情感强度 87%\"之类不存在的参数。\n3. **注音先行铁律**：每句台词先过\"注音方案\"再合成——副语言标签+语速档+重音字+停顿位+多音字/儿化标注；裸文本直接合成=机器念稿。\n4. **音色ID唯一铁律**：每个角色一个音色ID（`音色-@资产名-特征摘要`），登记资产注册表后跨集复用不重制；换音色=新 ID+双签（等于换演员）。\n5. **模式对齐铁律**：模式A（平台直出音频）音轨已内嵌，TTS 只做备选修复；模式B（后期对口型）TTS 是唯一人声源——合成后必须走\"对口型→±2 帧微调\"闭环（联动 R8）。\n6. **平台分工铁律**：Fish Audio=真人克隆主力；MiniMax=情绪标签与儿童声；CosyVoice=本地批量+instruct 副语言；Noiz=快速风格化备选——按角色特征自动分配，不平均用力。\n\n## 二、标准执行 SOP（Step-by-Step）\n\n**Step 1 · 读基线**：读角色音色基线（质感/语速档/情感倾向）与台词清单（含 NARR-03 控制符串）。\n\n**Step 2 · 选平台**：按铁律 6 分配——有干声且要复刻→Fish Audio；情绪浓/童声→MiniMax；本地批量→CosyVoice；快速占位→Noiz/预设。\n\n**Step 3 · 填音色卡**：按 4.1 四平台模板逐字段填写（年龄/共鸣腔/质感/语速/参考音频要求/克隆参数）。\n\n**Step 4 · 注音**：逐句台词落\"注音方案\"——从 `KB_12` 第二节「副语言控制标签字典」（唯一权威源）选标签，标重音字与停顿位，多音字注音。\n\n**Step 5 · 合成与验收**：执行克隆工作流（4.2 步骤）；验收标准=音色像度（与基线比对）+情感达标+无电音/吞字。\n\n**Step 6 · 登记交付**：音色ID 登记注册表；交付 R8（轨位/对口型流程/响度 -6dB 入轨）。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约\n\n| 字段 | 类型 | 必填 | 示例 |\n|---|---|---|---|\n| 角色 | @资产名 | 是 | @李梅 |\n| 音色基线 | 结构化 | 是 | 温软治愈/4字每秒/尾音轻扬 |\n| 平台 | enum | 否 | 自动分配 |\n| 台词清单 | list | 是 | 含 NARR-03 控制符串 |\n\n### 输出契约（下游：R8 混音 / 注册表 / 模式B对口型）\n\n```yaml\n音色特征卡: {平台: \"Fish Audio\", 音色ID: \"音色-李梅-温软治愈女声\", 共鸣腔: \"胸腔偏前+软腭轻抬\", 参考音频: \"20~25秒干声(含一段安慰语气)\", 克隆参数: \"Instant Voice Clone(总<270秒)+S2词级控制'买'重音\"}\n注音方案: [{台词: \"张三，上次我们才吃了，等爸爸回来给你买\", 标签串: \"(softly)…(breath)…\", 语速: \"4字/秒\", 重音: \"爸@2.2s/买@3.6s\", 多音字: \"'吃了'轻声\"}]\n音色ID登记单: {新增: [\"音色-李梅-温软治愈女声\"], 复用: []}\n交付剪映备注: \"人声轨-6dB；模式B：LatentSync对口型后±2帧微调；导出响度见R8四轨SOP\"\n```\n\n## 四、专项工具箱\n\n### 4.1 四平台音色特征卡模板（逐字段）\n\n**Fish Audio 卡**：\n```text\n音色ID：音色-@资产-特征摘要\n年龄感：34岁年轻感 ｜ 共鸣腔：胸腔偏前、软腭轻抬（暖而不闷）\n音色质感：温软圆润、气声占比中、无沙哑\n语速档：正常 4 字/秒（安慰段 3.5） ｜ 情感倾向：尾音轻扬带暖意\n参考音频要求：15~30 秒干声（最少 10 秒可克隆；最佳 1~3 分钟）；含\"自然陈述+轻柔安慰\"两种能量态；ComfyUI 节点总时长 <270 秒\n克隆参数：Instant Voice Clone；S2 词级控制标注重音字与拖音\n```\n**Noiz 卡**：`风格化预设选型（年龄感+性别+质感三键筛选）→ 微调音高±2半音/语速±10% → 试听 3 句定版；无克隆需求时作快速占位`。\n**MiniMax 卡**：`音色选型：预设库\"温柔女声/儿童声\"微调（音调+3、语速-10%）｜ 情绪机制：文本内嵌 <#> 情绪标签 + ( ) 停顿 ｜ 混合音色可选（对白+旁白双声）`。\n**CosyVoice 卡**：`模式：instruct（副语言自然语言指令：\"用压抑着难过的平静语气说\"）｜ 头部情感标记：<|HAPPY|>/<|SAD|>/<|ANGRY|>/<|SURPRISED|>/<|CALM|>（全大写、长文可多点插入）｜ 克隆：3 秒样本即可（音色像度要求低时用）；已知限制：2.0 克隆模式下自然语言语气描述可能失效→语气控制一律走 instruct`。\n\n### 4.2 克隆工作流步骤（以 Fish Audio 为例）\n\n1. 录/选干声（手机安静房 20 秒，距嘴一拳，勿压嗓）→ 2. 上传 Instant Voice Clone（校验 <270 秒）→ 3. 试合成 3 句基准台词（含一句重音句）→ 4. 像度验收（与基线比对，不像则加样本至 40 秒重克隆）→ 5. 台词批量合成（注音方案逐句）→ 6. 剪映入轨（人声 -6dB，智能降噪→人声美化）→ 7. 模式B：对口型对齐重音秒位，±2 帧微调 → 8. 音色ID 登记与音频归档（文件名=集数_镜号_音色ID）。\n\n### 4.3 副语言标签字典 · 调用指针（表存于 KB_12）\n\n> 去重铁律：情感 / 笑叹泣 / 呼吸 / 停顿 / 重音 / 语速 / 声调及 MiniMax、CosyVoice、Fish S2 平台专属语法共 40 词条，以 `KB_12` 第二节「副语言控制标签字典」为唯一权威源，本技能不抄写副本——注音时现查现用；语速档位查 `KB_12` 第三节「语速基准表」。\n\n## 五、常见错误示范 vs 满分工业级示范\n\n### 对比组 1：注音方案\n\n❌ **Bad Case**：\n> 台词：\"妈妈，我要吃莽莽\"。合成设置：音色选儿童声，其他默认，直接生成。\n\n**扣分点**：裸文本机器念稿——无情感标签、无拖音（\"莽莽\"是钩子词）、无重音；默认语速偏快失去奶音感；未联动 NARR-03 的 2.2s 时长（模式B 口型将对不上）。\n\n✅ **Good Case**：\n> 注音方案：`(excited)` 前置 + 语速 4 字/秒 + 重音\"吃\"（开口后 1.4s）+ \"莽莽\"mǎng-mǎng 轻声拖长尾音；平台 MiniMax 儿童预设（音调+3、语速-10%）；合成时长校验=2.2s±0.2s（对齐 NARR-03）；模式B 对口型后 ±2 帧微调。\n\n### 对比组 2：参考音频质量\n\n❌ **Bad Case**：\n> 用一段带背景音乐的短视频人声做克隆素材，8 秒长，里面还夹着别人的笑声。\n\n**扣分点**：非干声（BGM+混响+他人声）——克隆出的音色带\"音乐底噪人格\"；8 秒低于 Fish 10 秒下限；含他人声会串音色（音频版\"串色\"）。\n\n✅ **Good Case**：\n> 20 秒纯净干声（安静房手机距嘴一拳录制），含\"自然陈述一句+轻柔安慰一句\"两种能量态；上传前剪辑去头尾气口杂音；总时长 20s（<270s 校验通过）；试合成 3 句验收像度后定版，音色ID 登记。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **童声合规**：优先 MiniMax/平台儿童预设（微调实现），避免克隆真实儿童声音的授权风险；确需克隆须有监护人授权样本。\n2. **方言/多语种台词**：先折普通话字数测时长（方言 ÷0.9）；Fish 支持 13+ 语种零样本跨语种；CosyVoice SSML 控发音。\n3. **多音字/生僻名**：注音方案显式标注（\"莽莽=mǎng mǎng 轻声\"\"燕=yān 作地名\"）；合成后逐句听校，错读重合成该句。\n4. **参考音频不足 10 秒**：Fish 降级不可用——转 CosyVoice（3 秒可克隆，像度打折）或 MiniMax 近似预设微调；并在音色卡备注样本局限。\n5. **克隆像度不足（三句验收不像）**：加样本时长（20→40 秒）重克隆；仍不像→改\"风格近似\"策略（预设微调+注音方案补味），并在注册表标注\"近似音色\"。\n6. **长集批量合成（40+ 句）**：CosyVoice 本地批处理（instruct 统一基线）；逐句文件名含镜号；批量后抽检 20% 句听校（电音/吞字/抢拍）。"}]},{"g":"全局记忆","items":[{"p":"memory/global/权威工作流与影视知识库.md","t":"权威工作流与影视知识库（全局记忆层）","d":"","raw":"# 权威工作流与影视知识库（全局记忆层）\n\n> 本文档由框架初始化阶段的靶向联网检索提炼而成，是整个【AIGC 影视与短剧多智能体工业化创作框架】的知识地基。\n> 所有角色智能体（Roles）、专业词典（KB）与技能插件（Skills）在产出提示词时，必须优先引用本文档中经过核实的权威结论，**严禁凭空编造平台语法、特效菜单名与模型能力**。\n> 检索时间：2026-10 ｜ 用途：跨项目全局共享 ｜ 维护者：复盘自进化引擎\n\n---\n\n## 一、高星权威开源仓库架构提炼（学系统骨架）\n\n### 1.1 anthropics/skills（官方 Agent Skills 规范，179k+ Stars）\n- **核心规范**：一个 Skill = 一个文件夹 + 一个 `SKILL.md`；文件顶部必须有 YAML Frontmatter，其中 `name` 与 `description` 为必填字段，`description` 是决定智能体是否自动调用该 Skill 的**首要触发机制**。\n- **description 黄金结构**：必须同时包含 **WHAT（这个技能做什么）+ WHEN（什么条件下触发使用）**，例如：\"为即梦 Seedance 撰写多主体参考视频提示词。当用户指定即梦平台或需要多图参考融合时触发。\"\n- **按需加载（Progressive Disclosure）三段式**：① 元数据层（name/description，常驻索引）→ ② 正文层（SKILL.md 主体，调用时才读取）→ ③ 附属资源层（词典、脚本，执行到对应步骤才读取）。本框架的 `skills/SKILL_INDEX.md` 路由即仿照此机制设计，用于在 ZCode / Trae / WorkBuddy 中节省上下文 Token。\n- **常见故障**：Skill 无法被识别的首要原因是 Frontmatter 缺失或 YAML 格式错误——本框架所有 Skill 文件创建时必须自检 Frontmatter 完整性。\n\n### 1.2 chatfire-AI/huobao-drama（火宝短剧，15k+ Stars，AI 短剧一站式平台）\n- **全流程管线**（本框架三阶流水线直接吸收）：\n  `小说原文导入 → AI 改写为可拍摄剧本（按集拆分、标注场景与角色） → 角色/场景/道具一致性资产提取与生成 → 分镜拆解 → 基于资产参考的视频提示词生成 → 视频合成`。\n- **关键设计**：剧本阶段即\"按集拆分并标注场景与角色\"，角色形象提取后以**资产引用（本框架升级为 `@中文资产名称` 体系）**方式注入后续所有生图与生视频提示词，保证跨镜头一致性。\n- **多模型路由**：文本模型（改写）、图像模型（资产/分镜图）、视频模型、TTS 模型分离配置——对应本框架\"平台插件式 Skills\"分层。\n\n### 1.3 HKUDS/ViMax（港大多智能体视频框架，12k+ Stars）\n- **多智能体协同管线**：Screenwriter（编剧）→ Shot Planner（分镜规划）→ Character Styling（角色造型）→ Image Generation → Video Generation → **VLM-based Quality Control（视觉语言模型质检回路）** → Final Assembly。导演（Director）+ 编剧 + 制片人（Producer）三核心角色统筹。\n- **首帧一致性（First Frame Consistency）**：视频片段的画面一致性依赖\"先生成关键帧图像，再以该图像作为视频首帧\"的锚定策略——这正是本框架\"分镜前置资源（首帧基准图）\"的理论来源。\n- **质检回路**：生成结果先经视觉语言模型审片打分，不合格自动打回重生成——本框架\"10 分制评分官 + 低于 9 分强制重写\"机制由此强化。\n\n### 1.4 FoundationAgents/MetaGPT 与 crewAIInc/crewAI（多智能体协作范式）\n- **结构化交接契约（Hand-off Schema）**：角色之间不传闲聊，只传\"结构化文档\"——编剧交出标准剧本 JSON/表格，导演交出分镜表，美术交出资产设定卡。下游角色只依赖上游的结构化产物工作。本框架规定每个角色的\"输出 Schema\"即由此而来。\n- **质量门禁与打回（Guardrail）**：crewAI 的 Task 可挂 Guardrail 回调，输出不达标即拦截并要求重做——本框架评分官的\"一票否决扣分题库 + 强制重写回路\"同源。\n- **角色=职责+工具+预期输出**：定义智能体时必须写清三者，防止角色越界互相抢活。\n\n### 1.5 垂直提示词实战库（awesome-seedance 系列等）\n- **按秒切分时间轴写法**：`[0-2s] 镜头缓推，主角抬头；[2-5s] 衣袂翻飞，握紧剑柄`——Seedance 2.5 官方即支持秒级时间戳分段叙事，单条最长可达 30 秒。\n- **一镜一主动作原则**：单个 5 秒镜头只安排一个主动作 + 一个镜头运动，多动作串联必拆多镜，否则模型在时间轴中段动作漂移。\n- **多宫格分镜垫图法（Storyboard Grid）**：用一张网格图（如 2x2 四格）垫底生成连贯分镜，再逐格裁切为视频首帧，可低成本锁定同一场景内的构图延续性。\n- **对白时长测算**：中文正常语速约 4 字/秒，急促 5.5 字/秒，沉吟 2.5 字/秒——台词字数除以语速再加情绪停顿 0.3~0.8 秒，得镜头最短时长。\n\n---\n\n## 二、四大靶向专业数据（核实版词库与语法）\n\n### 2.1 靶向一：扩散模型零光影正交三视图 & Albedo 固有色词库\n\n**原理**：扩散模型对否定词（\"无高光\"\"无阴影\"）不敏感——否定词在 cross-attention 中反而注入了\"高光/阴影\"的概念激活。正确做法是**用正面物理状态描述替代否定**，即描述\"光被均匀化了\"这一事实，而非\"光不存在\"。\n\n**核心正面词库（中文编译版，已核实）**：\n- 布光状态：`360度环形无影棚拍柔光`、`大型柔光箱正面平光`、`均匀漫射平光（Flat Even Lighting）`、`影棚基准平光`\n- 贴图质感：`漫反射固有色贴图质感（Flat Lit Albedo / Diffuse Pass）`、`PBR 漫反射贴图`、`哑光固有色`\n- 投影方式：`正交投影相机（Orthographic Projection）`、`零透视畸变`、`平行投影无近大远小`\n- 背景规范：`中性18%灰背景`、`纯白背景`、`无接缝纯色背景（Seamless Backdrop）`\n- 姿态规范：`A-Pose 双臂自然微张`（防衣袖与躯干粘连，优于 T-Pose）、`T-Pose 双臂水平展开`（适合需要完整展袖的服装）、`双脚与肩同宽站立基准`\n- 版式规范：`角色设定三视图（Turnaround Sheet）`、`正面/左侧面/背面三视图等距水平排列`、`model sheet 排版`、`同一角色三个视角比例严格一致`\n\n**国际通用英文关键词对照**（供 ComfyUI/Flux 类英文语义更强的模型使用）：\n`character turnaround sheet, three view (front / side / back), orthographic projection, T-pose / A-pose, full body, consistent proportions, flat lighting, albedo map style, neutral white background, model sheet layout`\n\n**三视图 vs 单镜头参考的关键区分（防\"三个人同框\"崩坏）**：\n- 三视图**只用于锁定资产设定**（人设存档、LoRA 训练集、重绘参考）。\n- 喂给视频模型做首帧/参考图时，**必须先裁切出单一视角的\"独立全身立绘\"或\"独立面部特写\"**，否则视频模型会把三视图识别为三个人同框，导致多人乱张嘴、串脸、复制人。\n- 因此资产库中每个角色除三视图外，必须额外产出：`独立正面全身立绘图` + `独立面部特写图`（均为零光影平光规范）。\n\n### 2.2 靶向二：各平台最新真实语法特征\n\n**① 豆包（Seedream 4.0，生图）**——中式美学与空间排布之王\n- 中文原生理解优秀，**无需翻译成英文**；直接写中文打光术语即可精准响应：`伦勃朗光`、`轮廓光`、`逆光`、`分割光`、`环形光`、`顶光`。\n- **长文本空间方位语法**：按\"前景…中景…远景…\"分句描述，4.0 对空间层次理解极强，可精准执行 `画面左侧三分之一` / `右侧三分之二` / `左前景虚化` 等排布指令。\n- 分辨率控制：提示词末尾缀 `2K` / `4K`；4.0 原生支持 4K 与组图生成、多图融合创作。\n- 适合：东方玄幻场景、人物主图、多主体空间分区构图、海报级质感图。\n\n**② 即梦（Jimeng / Seedance，生视频）**——多主体参考融合与分秒叙事\n- **多模态参考**：Seedance 2.x 支持上传多张参考素材（人物图、场景图、道具图，2.5 版最多可达 50 个素材位），在提示词中以引用关系绑定。\n- **秒级时间轴**：官方支持 `[0-4秒]…[5-10秒]…` 时间戳分段叙事，单条最长 30 秒。\n- **结构化公式**：`主体（外貌+服装）+ 动作序列 + 镜头语言（推/拉/摇/移/跟随/环绕）+ 视觉风格 + 约束条件`。\n- **原生音画同出**：Seedance 支持直出对白与音效，写明台词文本与语气即可生成带口型的说话画面（模式 A 首选平台之一）。\n\n**③ MiniMax 海螺（H3，生视频）**——多模态统一与运镜指令\n- H3 为通用多模态视频模型：文/图/首末帧输入（T2VA / I2VA / Frames）、原生预测视频帧 + 32kHz 立体声音轨（对白、音效、音乐可同出）。\n- **参考模式（Reference Mode）**：支持素材标记与保留标记词，六栏位结构化提示词（主体参考/动作/时间节拍/声音设计等）。\n- **方括号运镜指令**：社区实战语法以方括号置于句首/句中控制运镜：`[推近]`、`[拉远]`、`[左移]`、`[右移]`、`[上摇]`、`[下摇]`、`[环绕]`、`[固定]`；配合细腻面部微表情递进描述（`嘴角缓缓上扬`、`眼神从错愕转为狠戾`）效果拔群。官方另提供 9 个可直接套用的 Skill 模板。\n- 适合：情感戏、微表情特写、带原生对白音频的镜头（模式 A）。\n\n**④ ComfyUI（Flux + Wan2.1/2.2，工作流自建）**——可控性天花板\n- **Flux 主体一致性**：PuLID（人脸 ID 锁定）、IP-Adapter（风格/角色参考注入）、Redux（参考图重铺）；LoRA 权重常规 0.6~0.85，过高（>0.9）易画风僵硬。\n- **ControlNet 组合**：Depth（景深结构）、OpenPose（姿态骨架）、Canny/线稿（边缘轮廓）；视频侧 Wan2.1 Fun Control 官方工作流支持姿态/深度/边缘三分支引导视频生成。\n- **Wan 视频模型**：支持动态幅度控制（Motion Strength / 视频差分引导），图生视频以首帧锚定；Wan2.2-S2V 支持无限时长数字人口播。\n- **标准 Negative Prompt 传统**：ComfyUI 生态保留独立负向词输入端，可用\"多余手指、肢体畸变、面部扭曲、闪烁、伪影\"等负向词兜底。\n- 适合：B 级降本镜头（静态图+关键帧）、大批量资产图、极端可控的 S 级精修。\n\n**⑤ 可灵（Kling，生视频）**——首尾帧锚定与物理规律\n- **提示词公式（官方）**：`主体（主体描述）+ 运动 + 场景（场景描述）+（镜头语言 + 光影 + 氛围）`，核心是主体+运动+场景。\n- **首尾帧（First & Last Frame）**：上传首帧+尾帧两张图锚定起止画面，提示词只描述中间过渡运动；**运镜幅度必须匹配首尾帧画面差异**，否则运镜指令不执行。\n- **物理规律**：3D 时空联合注意力机制可模拟真实物理（重力、惯性、碰撞），提示词写符合物理的动作描述效果更佳。\n- **锚点间隔**：多镜头分段叙事时，时间锚点间隔至少 3 秒，否则分镜切换生硬；主体崩坏时增加外貌细节描述 + 使用主体参考。\n- 适合：S 级长镜头、大幅度打斗、首尾帧精准控制的奇观镜头。\n\n### 2.3 靶向三：剪映专业版真实菜单名 & TTS 真实语音标签（严禁编造）\n\n**剪映专业版·曲线变速（入口：选中素材 → 右侧调节面板 →「变速」→「曲线变速」）**——系统内置 6 种预设，名称核实无误：\n| 预设名 | 节奏效果 | 典型用途 |\n|---|---|---|\n| `蒙太奇` | 先慢后快再慢 | 片头快速闪过、结尾聚焦 |\n| `英雄时刻` | 突然变慢再恢复 | 高光/燃点瞬间 |\n| `子弹时间` | 极致慢放 | 动作定格、戏剧化瞬间 |\n| `跳接` | 节奏跳跃 | 卡点、快剪 |\n| `闪进` | 开场加速 | 无缝入场转场 |\n| `闪出` | 结尾加速 | 无缝出场转场 |\n另支持自定义曲线（横轴时间、纵轴速度倍数拖锚点调节）。\n\n**剪映专业版·转场特效（入口：「转场」面板，白色竖线衔接处应用）**：\n- 基础类：`叠化`（含淡入淡出，建议时长 0.2~0.3 秒）、`闪黑`、`闪白`\n- 运镜类：`推进`、`拉远`、`左移`、`右移`、`旋转`、`模糊`\n- 光效与 MG 类：`漏光`（特效→氛围/光效分类）、`故障`（转场-特效中搜索\"故障\"，故障模糊）、`燃烧`\n- 快捷键：`Alt+T` 打开转场面板\n\n**剪映专业版·音频处理（入口：音频轨道 → 音频调节面板）**：\n- `人声美化`、`智能降噪`、`声音克隆`（内置音色复刻）、`变声`、`音频卡点`（节拍标记自动对齐）\n\n**TTS 平台真实参数与副语言控制符（核实版）**：\n- **Fish Audio**：参考音频最少 10 秒可克隆，15~30 秒更准确复刻说话模式与情感，官方建议最佳 1~3 分钟；ComfyUI Instant Voice Clone 节点接受 1~20 段录音、每段 10~30 秒、总时长硬性校验 <270 秒；S2 版本支持行内开放域标签与词级控制（如重音、停顿、语种切换）。\n- **MiniMax 语音（speech 系列）**：预设库标签可直接内嵌文本——情绪标签 `<#>`、停顿 `( )`、语气词标记；支持混合音色与情感风格调节。\n- **CosyVoice**：instruct 指令模式可用自然语言控制副语言；文本开头使用全大写情感标记 `<|HAPPY|>`、`<|SAD|>`、`<|ANGRY|>` 等，长文本可插入多个标记实现情感转换；克隆模式 3 秒即可，但 2.0 克隆模式下自然语言语气描述可能失效（已知问题，需 instruct 模式）。\n- **通用副语言写法（英文括号/方括号标签，多数平台兼容）**：`(sigh)` 叹气、`(laughter)`/`[laughter]` 笑声、`(breath)` 换气、`(pause)` 停顿、`(whisper)` 气声；语速以倍率或字/秒指定；情绪以\"开心/悲伤/愤怒/惊讶/平静\"等标签前置。\n\n### 2.4 靶向四：AI 视频 17 种高频物理崩坏条件（Failure Modes）\n\n详见姊妹文档《全局复盘避坑黑名单.md》的 17 条编号崩坏模式库（含触发条件、根因、预防写法、一票否决扣分规则）。此处列出速查索引：\n手部六指/手指融化、双手十指交叉穿模、360 度转身五官移位、单镜多机位硬切空间撕裂、多人同框全员乱张嘴、多主体串色串脸、快速奔跑双腿交替穿模、衣物与身体粘连、面部身份漂移（越动越不像）、首帧强逆光过曝崩坏、文字与招牌乱码、道具中途变形、人物瞬移/穿墙、液体与布料物理违和、眨眼缺失或高频抽搐、口型与台词不同步、背景周期性闪烁。\n\n---\n\n## 三、各 AI 平台模型优劣对比与选型路由表\n\n| 平台/模型 | 类型 | 核心优势 | 主要短板 | 本框架推荐用途 |\n|---|---|---|---|---|\n| 豆包 Seedream 4.0 | 生图 | 中文理解顶级、4K 原生、空间方位精准、光影术语直响应 | 动态视频非其职 | 人物主图、场景全景、多主体分区构图、海报 |\n| 即梦 Seedance 2.x | 生视频 | 多参考素材（最多50）、秒级时间轴、原生对白音画同出 | 长镜头物理偶发漂移 | 模式A对白镜头、多主体融合、30秒内叙事 |\n| MiniMax 海螺 H3 | 生视频 | 多模态统一、[运镜]指令、微表情细腻、32kHz立体声 | 极限动作幅度受限 | 情感特写、微表情戏、带声镜头 |\n| 可灵 Kling | 生视频 | 首尾帧锚定精准、物理规律模拟强、大幅度运动合理 | 提示词公式约束较强 | S级奇观、打斗、首尾帧接力 |\n| ComfyUI Flux | 生图 | PuLID/IP-Adapter/Redux+ControlNet 全可控、LoRA 生态 | 工作流搭建成本高 | 资产批量图、锁脸精修、三视图 |\n| ComfyUI Wan2.1/2.2 | 生视频 | 姿态/深度/边缘三分支控制、动态幅度可调、本地部署零 API 费用 | 显存要求高、速度慢 | B级降本镜头、极端可控精修 |\n| Fish Audio | TTS | 10秒极速克隆、词级控制、13语种 | 中文情感极致度一般 | 角色音色克隆主力 |\n| MiniMax TTS | TTS | 情绪标签内嵌、混合音色、中文情感丰富 | 克隆需授权流程 | 情绪浓烈台词 |\n| CosyVoice | TTS | instruct 副语言指令、3秒克隆、可本地部署 | 2.0 克隆模式语气描述失效 | 本地化批量配音 |\n\n**选型路由启发式**：\n1. 用户指定平台 → 直接加载对应 `plat_*` 插件。\n2. 未指定平台生图 → 默认公用标准提示词 + 推荐豆包 Seedream 4.0（中文/人设）或 ComfyUI Flux（需锁脸/批量）。\n3. 未指定平台生视频 → 默认公用标准提示词 + 按镜头类型推荐：S 级奇观→可灵；对白戏→即梦（模式A）或 MiniMax H3（模式A）；微表情情感戏→MiniMax H3；B 级降本→ComfyUI Wan2.1（模式B）+ 后期对口型。\n\n---\n\n## 四、权威来源清单（持续追加）\n\n- anthropics/skills（Agent Skills 官方规范）：https://github.com/anthropics/skills\n- chatfire-AI/huobao-drama（火宝短剧）：https://github.com/chatfire-AI/huobao-drama\n- HKUDS/ViMax（多智能体视频框架）：https://github.com/hkuds/vimax\n- FoundationAgents/MetaGPT：https://github.com/FoundationAgents/MetaGPT\n- crewAIInc/crewAI：https://github.com/crewAIInc/crewAI\n- Seedance 2.0 提示词撰写指南（Skill）：https://github.com/dexhunter/seedance2-skill/blob/main/zh/SKILL.md\n- awesome-seedance-2-prompts：https://github.com/YouMind-OpenLab/awesome-seedance-2-prompts\n- awesome-minimax-h3-prompts（中文）：https://github.com/AtlasCloudAI/awesome-minimax-h3-prompts/blob/main/i18n/README_zh.md\n- Seedream 4.0 官方：https://seed.bytedance.com/zh/seedream4_0\n- Coze 官方 Seedream 教程：https://docs.coze.cn/tutorial_seedream4_prompt\n- 可灵官方提示词指南：https://kling.ai/quickstart/text-to-video-prompt-guide\n- Kling AI Guide SKILL.md：https://github.com/kevingao-ai/kling-ai-guide/blob/main/SKILL.md\n- ComfyUI Wan2.1 ControlNet 官方工作流：https://comfy.org/zh/workflows/wan2.1_fun_control-524727db7cac\n- Fish Audio 官网/开发者指南：https://fish.audio/zh-CN ；https://fish.audio/zh-CN/blog/text-to-speech-api-developer-guide\n- MiniMax TTS：https://www.minimaxi.com/audio/text-to-speech\n- 剪映曲线变速教程（CSDN）：https://blog.csdn.net/m0_53619432/article/details/136112453\n- AI 视频失败模式分析：https://www.elser.ai/zh/blog/why-ai-video-generators-mess-up-hands-and-faces ；https://morphic.com/resources/how-to/ai-video-troubleshooting"},{"p":"memory/global/全局复盘避坑黑名单.md","t":"全局复盘避坑黑名单（17 种崩坏速查索引 + 动态实战档案区）","d":"","raw":"# 全局复盘避坑黑名单（17 种崩坏速查索引 + 动态实战档案区）\n\n> **职责分工（封板版）**：\n> - `kb_library/KB_09` 第一节 = **17 种崩坏静态规则的唯一权威源**（编号/症状/触发/根因/Prompt级修正/技法级修正/负向词七列全表），日常评分与修正只读 KB_09；\n> - 本文件 = **动态实战增量档案**（第三部分），由复盘自进化引擎 R9 唯一写入，记录实测翻车案例与框架升级动作。\n> **加载策略（冷热隔离）**：日常评分仅挂 `KB_10 + KB_09`；仅在核查新增实战崩坏或执行 R9 复盘时才加载本文件（见 AGENTS.md 〇节第 8 条）。\n> 初始化时间：2026-10 ｜ 全局生效，跨项目共享\n\n---\n\n## 第一部分：17 种崩坏模式速查索引（详表 → KB_09 第一节）\n\n| 编号 | 崩坏名 | 一句话触发 | 评分否决项 |\n|---|---|---|---|\n| 01 | 手部六指/融化 | 手部特写/快速手势/手指交叉 | G8/V10 |\n| 02 | 十指交叉融化 | \"十指交叉/双手对插\"描述 | G8/V10 |\n| 03 | 360度转身五官移位 | 单镜360度旋转/急速甩头 | V10 |\n| 04 | 镜内切机位空间撕裂 | 一条 Prompt 含多机位描述 | V3 |\n| 05 | 多人同框乱张嘴 | 多人+台词无口型归属 | V5/V6 |\n| 06 | 多主体串脸 | 多人同框无空间分区 | G7/V8 |\n| 07 | 奔跑双腿穿模 | \"狂奔/疾跑/连续跳跃\" | V10 |\n| 08 | 衣袖粘连/消失 | 宽袍大袖+大动作/A-Pose 不足 | G3/V10 |\n| 09 | 面部身份漂移 | 长镜/接力未刷新 @资产锚定 | V2/V10 |\n| 10 | 首帧强逆光过曝 | 首帧剪影/背光大高光用于 I2V | G4/G8/V10 |\n| 11 | 文字招牌乱码 | 要求生成清晰可读文字 | G8/V10 |\n| 12 | 道具中途变形 | 手持道具换手/离画无过渡 | G3/V10 |\n| 13 | 人物瞬移穿墙 | 单镜长距离位移描述 | V10 |\n| 14 | 液体布料违和 | 泼水/瓢泼大雨/瀑布流体 | V10 |\n| 15 | 眨眼缺失/抽搐 | 长特写凝视无眨眼规范句 | V4 |\n| 16 | 口型不同步 | 台词无时长测算/模式B大嘴基底 | V4~V7 |\n| 17 | 背景周期闪烁 | 高频重复纹理+运动镜头 | V10 |\n\n> 完整七列对照（触发条件/根因/Prompt 级修正写法/技法级修正/负向词）一律查 `kb_library/KB_09` 第一节大表；本索引仅作秒级定位，不承载修正内容。\n\n---\n\n## 第二部分：通用防崩负向词包（可直接挂载）\n\n**生图负向词（ComfyUI 类）**：\n`多余手指, 六指, 手指粘连, 面部扭曲, 五官移位, 高光过曝, 硬阴影, 透视畸变, 双人融合, 文字乱码, 水印, 低分辨率, 噪点, 肢体比例错误, 三个相同人物, 复制人`\n\n**生视频负向提示（豆包/即梦/可灵等以正向描述规避为主，此包供支持负向输入的端使用）**：\n`镜头切换, 机位跳切, 人物瞬移, 全员张嘴, 身份漂移, 肢体穿模, 背景闪烁, 卡顿, 慢动作鬼影, 色彩断层`\n\n---\n\n## 第三部分：实战复盘动态增量档案区（R9 专属热区 · 本文件的核心价值）\n\n> **归档格式**：`【日期】平台/模型 ｜ 崩坏编号或新类型 ｜ 触发 Prompt 片段 ｜ 实际现象 ｜ 框架优化动作`\n>\n> **运行规则（封板强化）**：\n> 1. **唯一写入者**：本区由【复盘自进化引擎 R9】唯一写入——用户在任何 Prompt 下方\"实际产出复盘\"处填写实测结果后，每次复盘**必追加一行归档**，不留空档；\n> 2. **高频自动升级**：同类崩坏在本区累计 ≥3 次 → R9 自动升级 KB_10 对应检查项为否决级并同步 QC-01 引用（升级动作本身也要在本区留痕）；\n> 3. **新编号孵化田**：本区是全框架唯一允许\"规则之外\"的实验区——新崩坏类型从编号 18 起在此孵化，**两次复测验证通过后**才转入 KB_09 第一节静态大表（转正时在本区标记\"已转正→KB_09\"）；\n> 4. **冷热隔离**：日常评分与修正读 KB_09 + KB_10，**不加载本文件**；仅 R9 复盘与新增实战崩坏核查进入本区——动态增量不拖慢日常生产的上下文预算。\n\n（暂无档案——等待首轮实测复盘注入）"}]}]</script>

<script>
const GROUPS=JSON.parse(document.getElementById('library-data').textContent);
const $=id=>document.getElementById(id);
let cur=null;

/* ---------- 主题（与 doc.html 同色系，独立记忆键） ---------- */
function applyTheme(t){document.documentElement.dataset.theme=t;
  const icon=t==='light'?'🌙':'☀️';
  $('themeToggle').textContent=icon;$('themeToggleM').textContent=icon;
  try{localStorage.setItem('aidoc-lib-theme',t);}catch(e){}}
$('themeToggle').onclick=$('themeToggleM').onclick=()=>applyTheme(document.documentElement.dataset.theme==='light'?'dark':'light');
applyTheme(localStorage.getItem('aidoc-lib-theme')||'dark');

/* ---------- 侧栏文库树 ---------- */
function renderTree(filter){
  const q=(filter||'').trim().toLowerCase();
  const tree=$('docTree');tree.innerHTML='';
  GROUPS.forEach((g,gi)=>{
    const items=g.items.filter(d=>!q||(d.t+' '+d.d+' '+d.p).toLowerCase().includes(q));
    if(!items.length)return;
    const wrap=document.createElement('div');wrap.className='group';
    wrap.innerHTML=`<div class="gl">${g.g}</div>`;
    items.forEach(d=>{
      const b=document.createElement('button');b.className='item'+(cur===d.p?' on':'');b.type='button';
      b.innerHTML=d.t+`<span class="hint">　${d.p.split('/').pop()}</span>`;
      b.title=d.t+'\n'+d.p;
      b.onclick=()=>{openDoc(d.p);closeMobile();};
      wrap.appendChild(b);});
    tree.appendChild(wrap);});
}
$('search').addEventListener('input',e=>renderTree(e.target.value));

/* ---------- Markdown 渲染 ---------- */
function renderMarkdown(d){
  const box=$('article');
  if(typeof marked==='undefined'){box.innerHTML='<div class="raw-fallback"></div>';
    box.firstChild.textContent=d.raw;return [];}
  box.innerHTML=marked.parse(d.raw,{gfm:true,breaks:false});
  const h1=box.querySelector('h1');if(h1)h1.remove();          /* 标题已在文章头展示 */
  box.querySelectorAll('img').forEach(im=>im.onerror=()=>{
    const s=document.createElement('span');s.style.cssText='color:var(--txt3);font-size:12px;font-family:var(--mono)';
    s.textContent='［图片未随文库内联：'+im.getAttribute('src')+'］';im.replaceWith(s);});
  if(window.hljs)box.querySelectorAll('pre code').forEach(c=>{try{hljs.highlightElement(c);}catch(e){}});
  const heads=[];
  box.querySelectorAll('h2,h3,h4').forEach((h,i)=>{
    h.id='sec-'+i;heads.push({level:+h.tagName[1],text:h.textContent,id:h.id});});
  return heads;
}

/* ---------- 打开文档 ---------- */
function openDoc(path,keepHash){
  const d=GROUPS.flatMap(g=>g.items).find(x=>x.p===path);
  if(!d){toast('文库中未收录：'+path);return;}
  cur=path;
  $('crumbs').textContent=path;
  $('artCat').textContent=GROUPS.find(g=>g.items.includes(d)).g;
  $('artTitle').textContent=d.t;
  const de=$('artDesc');
  if(d.d){de.style.display='';de.textContent=d.d;}else de.style.display='none';
  const heads=renderMarkdown(d);
  const tl=$('tocList');tl.innerHTML=heads.map(h=>
    `<a href="#${h.id}" class="lv${h.level}" data-id="${h.id}">${h.text}</a>`).join('');
  renderTree($('search').value);
  if(!keepHash){try{location.hash='#/p='+encodeURIComponent(path);}catch(e){}}
  window.scrollTo({top:0,behavior:'auto'});
}

/* ---------- 滚动高亮"在此页面" ---------- */
let spyLock=false;
function spy(){
  if(spyLock)return;
  const heads=document.querySelectorAll('#article h2[id],#article h3[id],#article h4[id]');
  let curId='';
  heads.forEach(h=>{if(h.getBoundingClientRect().top<=120)curId=h.id;});
  document.querySelectorAll('#tocList a').forEach(a=>a.classList.toggle('on',a.dataset.id===curId));
}
addEventListener('scroll',()=>{spy();clearTimeout(window.__spyT);window.__spyT=setTimeout(spy,140);},{passive:true});
$('tocList').addEventListener('click',e=>{
  const a=e.target.closest('a');if(!a)return;e.preventDefault();spyLock=true;
  const el=document.getElementById(a.dataset.id);
  if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
  setTimeout(()=>spyLock=false,800);});

/* ---------- 复制页面（原文 Markdown） ---------- */
function copyText(txt,btn){
  const done=()=>{if(btn){const o=btn.textContent;btn.textContent='✓ 已复制';
    setTimeout(()=>btn.textContent=o,1500);}toast('已复制整页 Markdown');};
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(txt).then(done,()=>fallback());
  else fallback();
  function fallback(){const ta=document.createElement('textarea');ta.value=txt;
    document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){toast('复制失败，请手动选择');}
    ta.remove();}
}
$('copyPage').onclick=()=>{const d=GROUPS.flatMap(g=>g.items).find(x=>x.p===cur);
  if(d)copyText(d.raw,$('copyPage'));};

/* ---------- 文库内 .md 互链跳转 ---------- */
document.addEventListener('click',e=>{
  const a=e.target.closest('.md a[href]');if(!a)return;
  const href=a.getAttribute('href');
  if(/^(https?:|#|mailto:)/i.test(href))return;
  e.preventDefault();
  const all=GROUPS.flatMap(g=>g.items).map(x=>x.p);
  const hit=all.find(p=>p.endsWith(href.split('/').pop()))||
             all.find(p=>p.replace(/\\/g,'/').endsWith(href));
  if(hit)openDoc(hit);else toast('文库内未收录该链接：'+href);
});

/* ---------- 移动端侧栏 ---------- */
function closeMobile(){$('sidebar').classList.remove('open');$('backdrop').classList.remove('show');}
$('mMenu').onclick=()=>{$('sidebar').classList.add('open');$('backdrop').classList.add('show');};
$('backdrop').onclick=closeMobile;

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1800);}

/* ---------- 启动（支持 #/p=<路径> 深链） ---------- */
(function(){
  let target=GROUPS[0].items[0].p;
  const m=location.hash.match(/^#\/p=(.+)$/);
  if(m){const want=decodeURIComponent(m[1]);
    if(GROUPS.some(g=>g.items.some(x=>x.p===want)))target=want;}
  openDoc(target,true);
  addEventListener('hashchange',()=>{
    const mm=location.hash.match(/^#\/p=(.+)$/);
    if(mm){const want=decodeURIComponent(mm[1]);
      if(want!==cur&&GROUPS.some(g=>g.items.some(x=>x.p===want)))openDoc(want,true);}});
  spy();
})();
</script>
