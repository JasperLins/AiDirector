KB_15（运镜选型按需） | 当需要按秒切分视频、执行一镜一动一主体台词、差分编译、口型排他锁与音频可替换原则时 |\n| VID-02 技法选择器 | `04_video_gen_skills/skill_vid_method_selector.md` | KB_08、KB_09 | 当需要在首帧图生视频/首尾帧控制/分镜图转视频/多图参考融合/尾帧接力之间选型时 |\n\n## 05 平台专属插件类（platform_plugins · 互斥加载）\n\n| 技能ID | 路径 | 挂载KB | WHEN 触发条件 |\n|---|---|---|---|\n| PLAT-00 公用默认 | `05_platform_plugins/plat_00_universal_default.md` | KB_08 | 当用户未指定平台时（产出公用标准提示词+平台推荐） |\n| PLAT-01 豆包Seedream | `05_platform_plugins/plat_doubao_seedream.md` | KB_04、KB_08 | 当用户指定豆包/Seedream 生图时 |\n| PLAT-02 即梦 | `05_platform_plugins/plat_jimeng.md` | KB_08、KB_11 | 当用户指定即梦/Seedance 生视频时 |\n| PLAT-03 ComfyUI | `05_platform_plugins/plat_comfyui.md` | KB_06、KB_09 | 当用户指定ComfyUI（Flux/Wan2.1/2.2）时 |\n| PLAT-04 MiniMax H3 | `05_platform_plugins/plat_minimax_h3.md` | KB_08、KB_11 | 当用户指定MiniMax海螺H3生视频时 |\n| PLAT-05 可灵 | `05_platform_plugins/plat_kling.md` | KB_08、KB_11 | 当用户指定可灵/Kling生视频时 |\n| PLAT-06 ChatGPT生图 | `05_platform_plugins/plat_chatgpt_image.md` | KB_06、KB_08 | 当用户指定ChatGPT/GPT-4o生图，或需要记忆点精确锁定/文字入画/道具特写时（R9-20261005实测新增·工业级完整版） |\n| PLAT-07 大香蕉生图 | `05_platform_plugins/plat_nano_banana.md` | KB_06、KB_08 | 当用户指定大香蕉/Nano Banana/Gemini生图，或需要气质定调/材质微光/多轮编辑修图时（R9-20261005实测新增·工业级完整版） |\n\n## 06 音频后期质检类（audio_edit_qc）\n\n| 技能ID | 路径 | 挂载KB | WHEN 触发条件 |\n|---|---|---|---|\n| QC-01 十分制评分官 | `06_audio_edit_qc_skills/skill_qc_prompt_scorer_10pt.md` | KB_10、KB_09 | 每条提示词产出后必触发（<9.0 打回重写） |\n| AUD-01 音色克隆工作流 | `06_audio_edit_qc_skills/skill_tts_voice_clone_workflow.md` | KB_12 | 当需要制作角色音色或执行TTS克隆生成时 |\n| EDT-01 剪映剪辑调音 | `06_audio_edit_qc_skills/skill_jianying_edit_sound_master.md` | KB_12 | 当需要输出剪辑手法、语速声调、音效BGM配置时 |\n| EVO-01 复盘自进化 | `06_audio_edit_qc_skills/skill_retrospective_optimizer.md` | KB_09、KB_10 | 当用户填写\"实际产出复盘\"后自动触发 |\n\n---\n\n## 互斥与组合规则\n\n1. **平台互斥**：05 类一次仅激活一个 plat_*；跨平台对比需分次产出独立代码块。\n2. **固定组合**：任何 `plat_*` 激活时必伴随 KB_08（编译器）；评分 QC-01 对每条 Prompt 无条件触发。\n3. **上下文预算**：单次任务建议挂载 ≤1 个平台插件 + ≤2 个 KB + ≤3 个技法 Skill。\n4. **索引自检**：新增 Skill 必须同步登记本表（技能ID/路径/挂载KB/WHEN），否则总控视为不存在。"}]},{"g":"✍️ 编剧叙事","items":[{"p":"skills/01_narrative_skills/skill_dialogue_second_calc.md","t":"台词秒数精算器（NARR-03 · 皮克斯声画先行）· 工业级完整版","d":"WHAT：皮克斯声画先行（Audio-First）台词时长精算器——按情绪语速换算字数时长、计算气口停顿、锚定重音触发动作秒数，倒推视频秒级节点。WHEN：任何含台词的镜头在进入视频提示词编译（VID-01）之前必须先经本技能精算；用户要求'算台词时长/卡重音/倒推动作节点'时触发。","raw":"# 台词秒数精算器（NARR-03 · 皮克斯声画先行）· 工业级完整版\n\n## 一、核心职责与工业级法则（6 条硬核铁律）\n\n1. **以音定画铁律**：凡有台词的镜头，音频时长是因、视频节点是果——先算台词精确时长，再倒推动作节拍与镜头长度。禁止先定镜头时长再往里硬塞台词（嘴型赶帧是崩坏16 的第一大诱因）。\n2. **0.5 秒取整铁律**：台词总时长四舍五入到 0.5 秒粒度（TTS 与剪辑工具的时间轴最小舒适刻度）；镜内任何动作节点同样对齐 0.5 秒网格，禁止出现 2.3s 这种剪辑师没法卡的节点。\n3. **气口即戏铁律**：每个标点都是一个可设计的气口（换气/哽咽/蓄势），气口必须显式给秒数并入总时长；\"一口气念完\"只在急促吵架档允许，且单镜 ≤12 字。\n4. **铺垫+余韵铁律**：开口前留 0.5~1.5 秒动作铺垫（观众需要看\"谁要说话\"），收口后留 ≥0.5 秒情绪余韵（表情收势或对方反应）——镜头时长 = 铺垫 + 台词时长 + 余韵，三者必须分别列明。\n5. **重音锚定铁律**：每句台词圈定 1~2 个重音字，并标注其发生秒位（计算式见 4.3），重音秒位即 BGM 重拍/Foley 卡点/微表情爆发点的锚——无锚的卡点是剪辑师猜的，猜的就是错的。\n6. **超长截断铁律**：单镜台词 >20 字（正常档 >5 秒）必须拆镜或拆句接力；截断点必须落在语义完整处（逗号/句号后），禁止在词组中间切镜。\n\n## 二、标准执行 SOP（Step-by-Step）\n\n**Step 1 · 查表定档**：读 `KB_12` 第三节「语速基准表」（唯一权威源），按说话人情绪定语速档（用户覆写优先）；孩童自动套童声档，威压/深情自动套沉吟档。\n\n**Step 2 · 数字数**：台词去掉标点数汉字数 N（数字按位数计；儿语叠词\"莽莽\"计 2 字；语气词\"呀/呢/吧\"各计 1 字）。\n\n**Step 3 · 算气口**：按 4.2 气口停顿规则逐标点给秒数，列出明细表；特殊气口（哽咽/冷笑前置/换气蓄势）按情绪附加。\n\n**Step 4 · 求总时长**：`总时长 = N ÷ 语速 + Σ气口`，四舍五入到 0.5 秒。\n\n**Step 5 · 锚重音**：按 4.3 公式计算每个重音字的发生秒位（含铺垫偏移），生成\"重音锚点表\"。\n\n**Step 6 · 倒推节点**：`[铺垫 X~Ys]（动作…）→ [开口 Y~Zs]（台词+口型）→ [余韵 Z~W s]（收势动作）`，输出秒级节点串与镜头时长建议。\n\n**Step 7 · 校验**：与镜头预算时长比对，差值 >0.5s 时二选一——调语速档重算（注明\"紧凑处理\"）或上报导演改镜长；同步产出 TTS 控制符串交 AUD-01。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约\n\n| 字段 | 类型 | 必填 | 示例 |\n|---|---|---|---|\n| 台词原文 | text(含标点) | 是 | \"张三，上次我们才吃了，等爸爸回来给你买\" |\n| 说话人 | @资产名 | 是 | @李梅 |\n| 情绪档 | enum | 是 | 温柔（正常档偏缓） |\n| 口型声明 | 开合/闭唇 | 是 | 开合 |\n| 镜头预算 | 秒 | 否 | 4 |\n\n### 输出契约（下游：导演 R2 定镜长 / VID-01 编译 / AUD-01 合成 / R8 卡点）\n\n```yaml\n台词精算:\n  原文: \"张三，上次我们才吃了，等爸爸回来给你买\"\n  有效字数: 15 ｜ 语速档: 正常偏缓4.0字/秒\n  气口明细: [逗号@字3:0.3s, 逗号@字10:0.3s, \"等爸爸\"前换气:0.4s]\n  台词时长: 15÷4.0+1.0=4.75 → 取4.5s（语速微提至4.5字/秒的紧凑处理,已注明）\n  重音锚点: [{字:\"买\", 秒位: 开口后3.6s, 触发: \"手在头顶轻拍收势\"}, {字:\"爸\", 秒位: 开口后2.2s, 触发: \"眼神先亮后垂+睫毛轻颤\"}]\n  秒级节点: \"[00-00.4s]蹲身平视理帽檐 → [00.4-03.6s]开口说台词(口型开合) → [03.6-04.0s]抚头轻拍收势\"\n  镜头时长建议: 4.0s（预算吻合,差值0）\n  TTS控制符串: \"(softly)张三，上次我们才吃了，(breath)等爸爸回来给你买 ‖ 4.5字/秒 ′ 买=降调收温\"\n  合规判定: 预算4.0s vs 精算4.5s → 紧凑档处理后吻合 ✓\n```\n\n## 四、专项工具箱\n\n### 4.1 语速基准 · 调用指针（表存于 KB_12）\n\n> 去重铁律：8 档情绪语速 × 字数安全区 × 气口特点全表（急促5.5/正常4/偏缓3.5~4.5/童声/沉吟/哭腔/耳语/宣誓），以 `KB_12` 第三节「语速基准表」为唯一权威源，本技能不抄写副本——测算时现查现用。\n\n**本技能独有速查公式**：`台词时长 ≈ 字数 ÷ 语速 + Σ气口`；20 字正常档 ≈ 5~5.5s（含气口）→ 已达单镜上限（超限按铁律 6 拆镜或拆句接力）。\n\n### 4.2 气口停顿 +0.5s 规则（标点 → 秒数）\n\n| 标点/情境 | 停顿时长 | 备注 |\n|---|---|---|\n| 逗号 | +0.3s | 换气或语势转折 |\n| 句号 | +0.5s | 语义闭合，允许对方插反应帧 |\n| 顿号 | +0.2s | 快速列举 |\n| 省略号/欲言又止 | +0.8s | 眼神动作填充 |\n| 问号 | +0.5s | 留给对方张嘴前的迟疑 |\n| 感叹号 | +0.2s | 情绪顶点后速收 |\n| 重音前微停 | +0.2s | 强调蓄势（\"我~要吃\"） |\n| 句首情绪前置（冷笑/叹气） | +0.5s | `(sigh)` `(breath)` 落点 |\n| 台词收口→镜头切走 | ≥+0.5s | 情绪余韵，禁止话音未落硬切 |\n\n### 4.3 重音触发动作秒数锚定示例\n\n**锚定公式**：`重音秒位 = 铺垫时长 + (重音字前的字数 + 0.5) ÷ 语速 + 其间气口Σ`\n\n**示例 A（@张三\"妈妈，我要吃莽莽\"，童声 4 字/秒，铺垫 0.8s）**：\n- 重音字\"吃\"前有 4 字 → (4+0.5)÷4 = 1.1s + 逗号 0.3s = 1.4s → **\"吃\"发生在开口后 1.4s，全镜 2.2s 处**\n- 锚定动作：`@李梅在 2.2s 处低头含笑视线落向孩子`（倾听反应卡点）；Foley\"衣角轻拽\"卡 0.8s 铺垫末。\n\n**示例 B（@林烬\"我今日登台，只为讨一个公道\"，沉吟 2.8 字/秒，铺垫 1.2s）**：\n- 重音\"公\"前有 11 字 → (11+0.5)÷2.8 ≈ 4.1s + 逗号 0.6s = 4.7s → **\"公\"发生在开口后 4.7s，全镜 5.9s 处**\n- 锚定：BGM 低频重拍卡 5.9s；`剑指前方的手在此秒位再压低半寸`（威压二次加码）。\n\n## 五、常见错误示范 vs 满分工业级示范\n\n### 对比组 1：时长测算\n\n❌ **Bad Case**：\n> 镜头4（5秒）：@李梅蹲下来跟孩子说了几句安抚的话，大概五六秒的样子，然后牵着孩子继续走。\n\n**扣分点**：\"说了几句/大概\"无字数无语速；台词内容缺失（TTS 无法合成）；无重音无节点；镜头 5 秒与\"五六秒\"自相矛盾；触发 KB_10 V7 扣 0.5 + 导演无法定镜。\n\n✅ **Good Case**：见\"输出契约\"完整示例——字数 15、语速 4.0、气口三处、总时长 4.75→4.5s 紧凑处理、重音\"爸@2.2s/买@3.6s\"双锚、秒级节点三段、镜头建议 4.0s 与预算吻合、TTS 控制符串齐备。\n\n### 对比组 2：超长台词处理\n\n❌ **Bad Case**：\n> 镜头7（5秒）：@李梅对孩子说：\"张三，听话，妈妈不是不给你买，是家里这个月真的很难，爸爸在外面打工挣钱也很辛苦，我们要体谅他，等他回来了，让他给你买好不好，乖。\"\n\n**扣分点**：52 字 ÷ 4 字/秒 ≈ 13s 塞进 5 秒镜——嘴型 2.6 倍速快放，崩坏16 一票否决；句意四层揉一镜，无重音重点。\n\n✅ **Good Case（截断拆镜接力）**：\n> 拆三镜：镜7a（4s，沉吟起）\"张三，听话，妈妈不是不给你买。\"（12字，重音\"不\"）→ 镜7b（3s，Cutaway 特写孩子攥紧的手，话音延入 L-Cut）→ 镜7c（4.5s，回过肩）\"是家里这个月真的很难。等爸爸回来，让他给你买，好不好？\"（19 字正常档，重音\"难/买\"）。三镜语义各完整、时长各自吻合、情绪由缓到哽到暖形成递进。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **双人抢话/台词重叠**：重叠部分只给主说话人算时长，被抢话者台词降为\"半句+被打断\"（字数 ≤6，结尾用破折号）；两镜间用 J-Cut 让抢话声音先入 0.3s。\n2. **无台词镜头**：本技能输出\"空镜节点卡\"——按预估动态时长（B 级 1.5s / 空镜 2s）给环境音卡点替代重音锚。\n3. **多语种/方言台词**：字数按音节折算（英语单词≈2 汉字时长）；方言先折普通话字数再 ÷0.9（方言普遍略慢）；TTS 控制符串注明语种标签。\n4. **唱词/吟诵**：套\"宣誓/吟唱档\"（2.0 字/秒、字字等距）；重音锚改为\"乐句重拍\"（每 4 字一拍）。\n5. **台词中途被动作打断（跌倒/门响）**：打断点前按正常测算，打断后余下字数重起一段测算并 +0.5s 反应气口；两段可分属前后两镜。\n6. **孩童超长句**：童声档单镜 >10 字即拆（孩童换气能力弱）；拆点必在逗号且给孩子一个 0.5s 小动作（舔嘴/拽衣角）过渡。"},{"p":"skills/01_narrative_skills/skill_episode_script_writer.md","t":"单集剧本与脚本转化器（NARR-04 · 剧本 vs 脚本三层边界）· 工业级完整版","d":"WHAT：单集完整文学剧本撰写与「文学剧本→分镜脚本→生成提示词」三层边界界定器——以好莱坞 Fountain/Slugline 规范为格式底座，产出分场文学剧本（外化动作行 + 画面口型/画外OS 双轨台词 + 音频ID 预埋）与台词声画先行总表。WHEN：用户要求'写单集剧本/写剧本正文/把大纲或小说改编成可拍摄剧本/剧本转分镜'，或任何剧集进入阶段Ⅰ需要产出/补齐单集剧本正文时触发（上游 NARR-01/02，下游 NARR-03 秒数精算与 VIS-01 分镜拆解）。","raw":"# 单集剧本与脚本转化器（NARR-04 · 剧本 vs 脚本三层边界）· 工业级完整版\n\n## 〇、理论与格式底座（权威来源，严禁自造非标野路子）\n\n本技能的一切格式规范均锚定 `memory/global/权威工作流与影视知识库.md` 已核实的权威结论，禁止自创格式：\n\n1. **huobao-drama 小说改剧本管线（知识库 1.2 节）**：`小说原文导入 → AI 改写为可拍摄剧本（按集拆分、标注场景与角色）→ 资产提取 → 分镜拆解 → 提示词生成`。本技能负责该管线的第二环——\"改写为可拍摄剧本\"：按集拆分、每场标注场景与角色（`@资产`），为下游资产引用与分镜拆解供给结构化原料。\n2. **HKUDS/ViMax 职责解耦（知识库 1.3 节）**：Screenwriter（编剧）与 Shot Planner（分镜规划）是**两个独立智能体**——编剧只产出故事层文本，分镜规划只消费编剧产物做视听切分。本框架对应 R1（本技能）与 R2（VIS-01）；职责解耦的物理表现就是\"文学剧本里绝不出现运镜术语，分镜脚本里绝不新增故事内容\"。\n3. **好莱坞标准剧本格式 / Fountain 纯文本规范**：一场戏 = **Slugline 场景头**（`INT./EXT. 地点 - 日/夜`）→ **Action 外化动作行**（只写镜头拍得到的东西，现在时态）→ **对白块**（角色名提示行 + 台词 + 括号语气注）；画外音标 **V.O.**（Voice-Over）、画外音源标 **O.S.**（Off-Screen）。本框架汉化映射见 4.2 表——概念与骨架照搬国际标准，仅做中文表达本地化。\n\n## 一、核心职责与工业级法则（6 条硬核铁律 + N 三查剧本结构门禁）\n\n1. **三层边界·概念严禁混淆铁律**：全框架只有三层文本产物，单向流转、严禁越层——\n   - **【文学剧本（Literary Script）】（R1 产出）**：纯故事与戏剧叙事层。按 `【第X场 · 场景名 · 日/夜 · 内/外】` 编写连贯的故事画面、人物动作博弈、神态反应、完整台词与 `【画外OS】`。**文学剧本内严禁出现\"推近、拉远、特写、慢镜头、ControlNet、I2V、首帧、垫图、LoRA\"等一切机器与摄影机术语**——专心把故事爽点、潜台词与人设张力写透。\n   - **【分镜脚本（Shooting Script / 镜首切片）】（R2 产出）**：视听调度与执行层。将文学剧本切分为具体镜号，输出 14 字段分镜总表（VIS-01 规范），且必须在每个分镜 `## 镜 XX` 标题正下方输出 **2 行高浓度镜首脚本切片**（`> 📜 本镜脚本` + `> 🎙️ 台词 / OS`），作为连接文学剧本与 AI 提示词的桥梁。\n   - **【生成提示词（AI Prompts）】（R5/R6 产出）**：机器编译层。严格按 KB_08 公式由分镜脚本编译为 ```prompt 代码块，严禁跳层把剧本散文直译成提示词。\n2. **场头 Slugline 汉化铁律**：每场以 `【第X场 · 场景名@资产 · 日/夜(可细化时段：清晨/午后/黄昏/入夜/深夜) · 内/外】` 开场，对齐好莱坞 Slugline 与 Fountain 规范；**一场一景一时段**，时段变更必须新起场头并剧本明写（对应场记\"时间天气锁定\"铁律，供 @光位常量 派生）；双时空剧集在场头尾加\"（现代·地球）/（沧澜·某国）\"界别缀防串界。一集内有大场景位移时可下设子场头（第1场A/第1场B），但顶级场次数保持与剧本头信息的场次列表一致。\n3. **小说改剧本去心理化铁律**：将原著/大纲改编为单集文学剧本时，所有心理描写要么**外化为可见肢体动作与神态反应**（写\"指尖攥皱衣角、喉头滚动\"，不写\"她很紧张\"），要么转化为女主专属的 `【画外OS】` 吐槽台词。Action 行只写\"摄影机拍得到的东西\"；原文对白必须按剧集圣经版权红线原创化改写（禁原著专名/原句/情节链复刻）。\n4. **台词双轨物理隔离铁律**：文学剧本和分镜切片中每句台词必须显式标注轨别——`【画面口型】`（角色在画面内张嘴说话，编译进视频 Prompt 口型层，受口型排他锁约束）与 `【画外OS·不张嘴】`（内心吐槽或旁白，**严禁编译进视频张嘴动作**，仅走后期音频轨）；无台词镜标 `【纯静默】`。轨别一旦判定，R5/R6/R8 三方不得串轨——OS 张嘴、台词闭嘴，都是一票否决级崩坏。\n5. **标准音频文件名预埋铁律**：每句台词/OS 在剧本总表与镜首脚本切片中必须同步分配标准音频保存文件名 `[音频ID: E集数_S镜号_角色_台词前四字.wav]`（前四字=去标点后台词的前四个汉字），供 TTS 批量生成命名与剪映素材池一键对齐；同镜同人双台词靠\"台词前四字\"天然去重，角色名取 `@资产名` 去 @ 符号。\n6. **声画先行交接铁律**：剧本正文完成 ≠ 阶段Ⅰ完成——必须交 NARR-03 按字数/语速/气口精算每句时长与重音秒位，回填\"台词与OS声画先行总表\"（轨别/语速档/时长/重音秒位/音频ID 五要素齐全），连同剧本正文一并写入分镜文档顶层折叠区；R2 拆分镜后逐一核对镜首切片台词与总表**逐字一致**——分镜可以删节台词（删节须在总表标注、对应音频ID 作废回收），**严禁改写或新增**。\n\n## 二、标准执行 SOP（Step-by-Step）\n\n**Step 1 · 读记忆承状态**：读剧集三件套（圣经/资产注册表/StateDiff），确认本集起点状态（上集遗留在场人物、伤势服装、道具、时间天气）；涉及 `@资产` 引用时只使用注册表已注册名。\n\n**Step 2 · 定钩子与曲线**：以 NARR-01 产出的市场痛点、黄金前 3 秒钩子、情绪曲线节点表为输入，确定本集\"悬→暖→恨→痛→燃→…\"的节拍骨架与集末钩子。\n\n**Step 3 · 排场次**：把大纲切分为场（一场一景一时段），逐场写 Slugline 场头；核对场次列表与场景 `@资产`、人物 `@资产` 的对应；一次性未注册场景（如\"MCN 办公室\"）标注\"未注册一次性场景\"，交 R4 查重决议。\n\n**Step 4 · 写正文**：逐场撰写 Action（外化、现在时态、可视化）与台词（双轨标签 + 语气·语速括注）；全篇扫描禁词表（推近/拉远/特写/镜头/ControlNet/I2V/首帧/垫图……），命中即改写为故事语言。\n\n**Step 5 · 预埋音频ID**：为每句台词/OS 分配 `[音频ID: E集数_S镜号_角色_台词前四字.wav]`；镜号未定时分场预分配，R2 定镜后回填精确镜号。\n\n**Step 6 · 交 NARR-03 精算**：每句台词/OS 过秒数精算（字数÷语速+气口，0.5s 取整），回填声画先行总表的时长与重音秒位列。\n\n**Step 6.5 · N 三查自审（R9-20261006-4 · 剧本层结构门禁）**：定稿前逐项自审并在输出契约附审查记录——①**转场动机链查**：逐场问『观众能回答人物为什么在这儿吗』（省略过程合法，省略动机非法；被胁迫/被诱导/主动前往必须可从台词或动作推断）；②**S 级场钩子回收查**：每个 S 级登场/奇观场登记钩子台账（钩子内容→集内回响镜号 或 显式标『跨集钩』）；③**人物登场必要性查**：新人物首登场必须以台词/道具/事件勾连主线。任一不过→就地补写动机锚/钩子，禁止带病下交（剧本缺陷会被 R2~R8 全链路高保真放大）。\n\n**Step 7 · 交 R2 并回检**：剧本正文+总表交 R2 拆分镜；R2 产出后逐镜核对镜首切片（📜/🎙️ 两行）与总表逐字一致，删节台词回收音频ID；分歧上报总控裁决。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约\n\n| 字段 | 类型 | 必填 | 示例 |\n|---|---|---|---|\n| 剧集三件套 | 文件 | 是 | 圣经/资产注册表/StateDiff |\n| 本集大纲节点 | text | 是 | \"E01：穿越+退婚冷插\" |\n| 时长预算 | 分钟 | 是 | 2~4 分钟（约 56s 生成素材） |\n| 原著/改编素材 | text | 否 | 小说章节（触发去心理化改写） |\n\n### 输出契约（下游：NARR-03 秒数精算 / VIS-01 分镜拆解 / AUD-01 TTS 批量 / R8 剪辑对齐）\n\n```yaml\n单集剧本:\n  集数: E01 ｜ 标题: 《我的合伙人把我推下了悬崖》\n  剧本头信息: {市场痛点, 黄金前3秒钩子, 情绪曲线节点表, 场次列表}\n  文学剧本正文:\n    - 场头: \"【第3场 · @沈府偏院 · 午后 · 内（沧澜·东澜国）】\"\n      动作行: \"@沈玉罗杏黄襦裙，捏着粗针，针尖悬在素青衣袖少女的手臂上方寸许——少女双目紧闭，气若游丝。\"\n      台词块:\n        - 轨别: 画外OS·不张嘴 ｜ 说话人: @沈小满\n          原文: \"上一秒我还在直播间教两百万人熬高汤，下一秒有人拿针刺我。\"\n          语气语速: 冷静吐槽·4字/秒 ｜ 音频ID: E01_S01_沈小满_上一秒我.wav\n        - 轨别: 画面口型 ｜ 说话人: @杏儿\n          原文: \"小姐！你吓死杏儿了！\"\n          语气语速: 软糯哭腔·3.5字/秒 ｜ 音频ID: E01_S05_杏儿_小姐你吓.wav\n  台词与OS声画先行总表:\n    表头: [镜号, 轨别, 说话人, 原文, 语速档, 时长, 重音秒位, 音频ID]\n    静默行: \"S04 ｜ 纯静默 ｜ — ｜ （风声吞没一切） ｜ — ｜ — ｜ BGM骤停留风声 ｜ —\"\n```\n\n## 四、专项工具箱\n\n### 4.1 三层产物对照表（谁产出 / 写什么 / 禁什么）\n\n| 层 | 产出角色 | 内容 | 严禁 |\n|---|---|---|---|\n| 文学剧本 | R1（本技能） | 场头+外化动作+双轨台词+OS | 摄影机/机器术语、心理描写直译 |\n| 分镜脚本 | R2（VIS-01） | 14字段总表+镜首2行切片（📜/🎙️） | 新增/改写台词、新增故事内容 |\n| 生成提示词 | R5/R6（KB_08） | ```prompt 代码块 | 跳层直译散文、混入他平台语法 |\n\n### 4.2 好莱坞/Fountain → 本框架汉化映射表\n\n| 国际规范 | 本框架汉化 | 说明 |\n|---|---|---|\n| Slugline `INT. 房间 - 日` | `【第X场 · 房间@资产 · 日 · 内】` | INT/EXT→内/外；地点挂 `@资产` |\n| Action 行 | 动作行（现在时态、只写拍得到的） | 心理描写禁入，改 OS 或外化 |\n| 角色名提示行 | `**@角色**【轨别】：` | 双轨标签为本土增强项 |\n| `TOM (V.O.)` 画外音 | `【画外OS·不张嘴】` | 严禁编译进视频张嘴动作 |\n| `TOM (O.S.)` 画外音源 | `【画外OS·不张嘴】`（同轨处理） | 画面外声源，走后期轨 |\n| `(parenthetical)` 括注 | `（语气·语速档）` | 供 NARR-03 定语速档 |\n| `CUT TO:` / `FADE OUT.` | 不使用（剪辑术语归 R2/R8） | 场头切换由排版自然承担 |\n\n### 4.3 OS 写作三原则\n\n1. **人格专属**：OS 默认只给\"穿越/重生/现代灵魂\"型主视角（其他角色的内心一律外化为动作神态）；密度每集 ≤5 处，S 级泪点镜与伏笔特写镜禁 OS。\n2. **吐槽即爽点**：OS 用现代语汇对冲古代情境的沉痛（痛感+幽默同帧），但遵守圣经网梗铁律（沧澜本土角色禁现代词汇）。\n3. **留声不留口**：OS 文本一律标注 `【画外OS·不张嘴】`，进总表走后期 TTS 轨；在镜首切片中注明入点（如\"入点镜01 2.5s，J-Cut 跨镜\"）。\n\n### 4.4 音频ID 命名细则\n\n`E集数_S镜号_角色_台词前四字.wav`——集数两位（E01）、镜号与分镜总表一致（S12C 表为 S12-CUT 时取 S12C）；角色取注册表资产名去 @；台词前四字=去标点后前四个汉字（\"好啦宝子们，明晚…\"→`好啦宝子`）；同镜同人双台词天然靠前四字去重；分镜删节台词的音频ID 即时作废并在总表标注。\n\n## 五、常见错误示范 vs 满分工业级示范\n\n### 对比组 1：剧本与分镜混淆（本技能最高频事故）\n\n❌ **Bad Case**：\n> 【第3场 · 偏院 · 日 · 内】镜头缓缓推近，给她一个面部的特写，然后切到杏儿反应镜头，节奏上做个慢动作；这里可以用 ControlNet 锁姿态，I2V 出 5 秒；她心里很难过，想起外婆的温柔。\n\n**扣分点**：一句话犯满三条铁律——\"推近/特写/切/慢动作\"是 R2 的视听语言（铁律1）；\"ControlNet/I2V/5秒\"是 R5/R6 的机器语言（铁律1）；\"心里很难过\"是心理直译（铁律3）。下游 R2 拿到后无法判断故事目的，R7 无从评分。\n\n✅ **Good Case**：\n> 【第3场 · @沈府偏院 · 入夜 · 内（沧澜·东澜国）】\n> 暮色四合，屋里点起一盏豆大的油灯。@沈小满倚在床头，就着灯火翻那册蓝布面线装手札；她合上手札，摩挲左手中指的旧玉戒——指尖针眼被戒身硌开，一滴血珠滚落，正落在戒面饕餮纹的兽目上。血珠像被吸了进去，纹路深处泛起一线暗金微光，转瞬即敛。她指尖一颤，仿佛触到一点温热。\n> **@沈小满**【画外OS·不张嘴】：\"第一笔，记上了。\"（冷静·3.5字/秒）[音频ID: E01_S06_沈小满_第一笔记.wav]\n\n### 对比组 2：台词无轨别 / OS 张嘴\n\n❌ **Bad Case**：\n> 旁白：上一秒我还在直播间熬高汤。（画面里\"沈小满\"嘴巴一张一合地念出这句话）\n\n**扣分点**：OS 无轨别标签，编译时会混入口型层——\"OS 张嘴\"是观众瞬间出戏的一票否决崩坏（铁律4）。\n\n✅ **Good Case**：OS 行标 `【画外OS·不张嘴】` 并注明入点（\"入点镜01 2.5s，J-Cut 跨入镜02\"）；画面内角色保持闭唇隐忍，OS 由后期 TTS 轨压入——痛感与幽默同帧，嘴不张。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **原著改编版权红线**：改写时禁用原著专名/原句/具体情节链（对照剧集圣经〇节五条红线）；情绪节拍可参考，文字表达必须原创；改写完成后过一遍红线自查表。\n2. **冷开场/闪回/插叙**：文学剧本按**故事时序**书写；冷开场、闪回、平行插叙等蒙太奇重排属 R2 分镜层手法——分镜总说明中注明源场次（如\"镜01 为第3场针刺事件的前置闪切\"），镜首切片回填对应镜号即可，剧本不重排。\n3. **无名群演/一次性角色**（退婚使、轿夫、仪仗兵）：不注册资产，剧本以身份称谓+外貌描写承载；过 R4 查重，不与注册名冲突、不抢戏份。\n4. **剧本台词与分镜压缩冲突**：2~4 分钟单集容不下剧本全部台词时，R2 可删节但**严禁改写或新增**；删节须回写总表（标\"分镜删节\"、音频ID 作废回收），保持三层文本严格同源。\n5. **无对白集/默片段**：总表仍须产出——每镜占一行标 `【纯静默】`，环境音与 BGM 卡点位填入\"重音秒位\"列，音频ID 留\"—\"。\n6. **双时空平行叙事**：两界戏场头必须带界别缀（\"（现代·地球）/（沧澜·东澜国）\"），同日平行事件在场头标注\"另一端/与此同时\"；时段各自独立锁定，防场记时空调错与光位常量误派生。"},{"p":"skills/01_narrative_skills/skill_market_hook_research.md","t":"市场钩子与情绪曲线技能（NARR-01）· 工业级完整版","d":"WHAT：短剧市场受众调研、黄金前3秒钩子公式设计与整集情绪过山车波形排布技能。WHEN：当需要分析目标市场受众、设计开局钩子、规划情绪曲线或新建剧集/新开一集进入剧本阶段时触发。","raw":"# 市场钩子与情绪曲线技能（NARR-01）· 工业级完整版\n\n## 一、核心职责与工业级法则（6 条硬核铁律）\n\n1. **3 秒生死线铁律**：短剧观众滑动决策窗口 ≤3 秒。前 3 秒内必须完成\"钩子事件启动\"（画面异动 + 身份反差或危机成立），禁止用空镜、片头 LOGO、缓慢环境铺垫开场——那是横屏电影的特权，不是竖屏短剧的。\n2. **痛点先行铁律**：先锁定受众\"未被满足的心理缺口\"（被轻视、亏欠、等待、逆袭渴望、护短、窥秘），钩子必须是痛点的直接引爆，而不是\"氛围感\"。写不出痛点分析的剧本不准进入分镜阶段。\n3. **情绪刻度量化铁律**：情绪必须用 1~10 的刻度标注在时间轴上，形成波形表；相邻两个情绪拐点间隔 ≤15 秒（竖屏）或 ≤25 秒（横屏），超过即\"情绪平原\"，观众流失。\n4. **钩子可画面化铁律**：任何钩子必须能翻译成\"一个可生成的首镜画面 + 一句台词/一个动作\"，写不进画面的钩子（\"他内心充满了不甘\"）判为废钩。\n5. **双钩备份铁律**：每集必须交付主钩 + 备钩两个方案，并注明 A/B 测试建议（同集双版本投放对比 3 秒完播率）。\n6. **钩尾闭环铁律**：每集结尾必须埋\"下一集钩子\"（悬念/反转/承诺悬置），并与本集开篇钩子形成呼应；只管开头不管结尾的剧本不是工业品。\n\n## 二、标准执行 SOP（Step-by-Step）\n\n**Step 1 · 查表定位受众**：读 `KB_01` 第一节原型库与第二节性格外化表，结合用户输入的题材赛道，在下方\"受众痛点核对清单\"中勾选 2~3 个核心痛点（不得超过 3 个——贪多则散）。\n\n**Step 2 · 选钩子公式并填空**：从\"五大钩子公式\"中选型，按公式字段逐项填空（身份反差元素、危机倒计时、反常道具、当众冲突、稚语戳心），产出主钩与备钩，各附\"首镜画面描述\"（交导演可直接拆镜）。\n\n**Step 3 · 绘制情绪过山车波形表**：按单集时长切格（竖屏 15s/格，横屏 25s/格），逐格填写情绪刻度与事件，强制满足\"压抑→反转→爆发\"至少一轮、大爆点 ≥1、小爆点 ≥2；波形表必须出现至少一次刻度落差 ≥4 的\"俯冲\"（压抑段）与落差 ≥5 的\"爬升\"（爆发段）。\n\n**Step 4 · 标注爽点秒位并交棒**：把爆点秒位换算为镜头等级建议（S 级对齐大爆点），写入输出 Schema 的\"爽点清单\"，交棒备注中明确提示导演 R2：黄金前 3 秒的钩子镜头固定 S 级。\n\n**Step 5 · 自检**：对照\"受众痛点核对清单\"与\"波形合规标准\"逐项打勾，缺项回炉。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约（上游：用户/总控）\n\n| 字段 | 类型 | 必填 | 示例 |\n|---|---|---|---|\n| 题材赛道 | enum | 是 | 男频玄幻爽剧 |\n| 分发画幅 | enum | 是 | 9:16 竖屏 |\n| 单集时长 | enum | 是 | 90 秒 |\n| 剧本梗概 | text | 是 | 叛徒之子重返宗门大比 |\n| 对标作品 | text | 否 | 《XXX》前三集 |\n\n### 输出契约（下游：导演 R2 / 美术 R3）\n\n```yaml\n市场受众分析:\n  赛道: 男频玄幻爽剧（竖屏分发）\n  核心痛点: [被轻视后的逆袭渴望, 为亲人正名的亏欠感]\n  对标: …\n黄金前3秒钩子:\n  主钩: {钩型: 压场型, 画面: \"雷云骤暗，@林烬负断剑立于台心，千名弟子齐退半步\", 首句台词: \"（无台词，静默压场）\", 等级建议: S}\n  备钩: {钩型: 冲突型, 画面: \"长老令牌掷于@林烬脚下碎裂\", 首句台词: \"罪人之子，也配登台？\", 等级建议: S}\n情绪过山车波形表:\n  - {秒位: 0-3,  刻度: 7, 事件: 钩子·压场}\n  - {秒位: 3-15, 刻度: 3, 事件: 压抑·讥笑如潮}\n  - {秒位: 15-30, 刻度: 6, 事件: 小反转·断剑纹路亮起}\n  - {秒位: 30-45, 刻度: 2, 事件: 再压·长老出手镇压}\n  - {秒位: 45-60, 刻度: 9, 事件: 大爆点·罡风席卷全场}\n  - {秒位: 60-90, 刻度: 8, 事件: 钩尾·\"只为讨一个公道\"+悬念}\n爽点清单: [{秒位: 15, 内容: 断剑觉醒, 等级: S}, {秒位: 60, 内容: 全场噤声, 等级: S}]\n交棒备注: \"0-3s 钩子镜头固定 S 级；45-60s 再压段建议 A 级反应镜；钩尾 88s 定格留白给剪辑上闪黑\"\n```\n\n## 四、专项工具箱\n\n### 4.1 短剧黄金前 3 秒五大钩子公式\n\n| 钩型 | 公式（字段填空） | 首镜画面要素 | 台词/声音 | 适用痛点 |\n|---|---|---|---|---|\n| 压场型 | `[被轻视者] + [反差实力道具/气场] + [全场噤声反应]` | 主体中心构图+环境异动（雷云/灯光骤变）+围观者后退 | 无台词静默 或 一句低声宣示 | 逆袭渴望 |\n| 危机型 | `[倒计时/坠落/走失] + [弱者无助] + [救援未至]` | 时钟/悬崖/人流大特写+主体渺小化 | 急促呼吸声+一句呼救 | 护短、亏欠 |\n| 悬念型 | `[反常细节特写] + [与常理矛盾] + [追问无人应]` | 停摆怀表/无人的生日蛋糕/反锁的门 | 环境死寂+一句自语 | 窥秘 |\n| 冲突型 | `[当众羞辱动作] + [隐忍者微表情] + [旁观者反应]` | 掷物/泼水动作顶点帧+主角攥拳特写 | 羞辱台词一句（≤12字） | 被轻视 |\n| 温情型 | `[稚语/弱者请求] + [守护者为难] + [环境温度反差]` | 孩童仰头视角+暖光食物特写对切 | 一句稚语（奶音拖尾） | 等待与承诺 |\n\n### 4.2 情绪过山车波形表（90 秒竖屏标准模板）\n\n| 秒位格 | 波段角色 | 情绪刻度目标 | 强制事件 | 禁止事件 |\n|---|---|---|---|---|\n| 0-3s | 钩子 | ≥7 | 钩子事件启动 | 空镜铺垫/LOGO |\n| 3-15s | 第一压抑 | ≤3 | 对立面施压 | 过早爆发 |\n| 15-30s | 小反转 | 5~6 | 实力/真相微露 | 全部解决 |\n| 30-45s | 第二压抑 | ≤2 | 代价显现/再受挫 | 情绪平原 |\n| 45-60s | 大爆点 | ≥9 | 爽点全额兑现+他人震惊反应 | 爆点无反应镜 |\n| 60-85s | 余韵+二次钩 | 6~8 | 收益展示/关系推进 | 新冲突无解 |\n| 85-90s | 钩尾 | 8（悬置） | 悬念定格/承诺悬置 | 圆满闭合 |\n\n### 4.3 受众痛点核对清单（Step 1 勾选用，≤3 项）\n\n- [ ] 被轻视后的逆袭渴望（爽）　[ ] 为亲人正名的亏欠感（燃）\n- [ ] 等待与承诺的悬置（泪）　[ ] 护短—弱者受欺（怒→爽）\n- [ ] 窥秘—反常事件（奇）　　[ ] 错位身份/错过的遗憾（唏嘘）\n- [ ] 占有/嫉妒反转（女频虐恋）　[ ] 生存倒计时（紧张）\n\n## 五、常见错误示范 vs 满分工业级示范\n\n### 对比组 1：钩子设计\n\n❌ **Bad Case（废钩三连）**：\n> 开头：夜幕降临，镜头缓缓扫过玄天宗的巍峨山门，云雾缭绕，配以悠远的古筝音乐，营造出神秘而宏大的氛围，为主角登场做铺垫。（约 5 秒）\n\n**扣分点**：纯空镜铺垫吃掉生死 3 秒；无痛点引爆；\"神秘宏大氛围\"不可量化、不可画面化判定成败；无钩子公式字段。\n\n✅ **Good Case（压场型公式填空）**：\n> **主钩（压场型）**：0-3s——雷云骤暗压城（环境异动），@林烬负 @焚天断剑一步踏上青石比武台（被轻视者+反差道具），台下千名弟子笑声戛然而止、齐退半步（全场噤声反应）。首句台词（低声，2.5 字/秒）：\"我今日登台——\"（留半句给 45-60s 大爆点闭环）。等级建议：S 级，首镜画面：低角度仰拍中心构图，剑柄自左肩探出入画。\n\n### 对比组 2：情绪波形排布\n\n❌ **Bad Case（情绪平原）**：\n> 0-30s 主角练剑；30-60s 与师兄弟切磋；60-90s 长老点评收尾。（刻度恒定 4-4-4）\n\n**扣分点**：无压抑无爆发，相邻拐点间隔=全集；90 秒零爆点；钩尾圆满闭合无悬念。\n\n✅ **Good Case（过山车波形）**：\n> 0-3s 钩子(7) 压场登台 → 3-15s 压抑(3) 讥笑如潮\"罪人之子\" → 15-30s 小反转(6) 断剑暗红纹路自亮，nearest 弟子惊退 → 30-45s 再压(2) 长老出手剑气镇压，@林烬单膝触地 → 45-60s 大爆点(9) 罡风席卷全场衣袂如黑焰 → 60-85s 余韵(7) 众弟子跪伏，长老眯眼（二次钩：长老袖中旧信） → 85-90s 钩尾(8) 定格 @林烬 抬眼：\"只为讨一个公道\"+闪黑。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **系列剧第 N 集（N>3）开场**：老观众已知世界观，钩子改为\"上集钩尾的即时兑付\"（悬念解决的前 3 秒先给一半），波形表首格从 5 起跳而非 7（保留空间给本集新钩）。\n2. **横屏 3-5 分钟漫剧**：生死线放宽到 8 秒（横屏观众耐受更高），但波形格改为 25s/格，且强制两个完整\"压抑→爆发\"轮回。\n3. **温情线接在爆爽线之后（双线剧）**：两线切换点必须落在前一线的情绪高点后 2 秒内（趁热换轨），切换瞬间用声音骤停/色温对撞（冷青→暖金）标记，防止观众误以为换台。\n4. **超短时长（≤30s 单元剧）**：波形压缩为\"钩子(7)→压抑(3)→爆点(9)\"三格，钩尾并入爆点最后一帧。\n5. **痛点冲突（勾选的痛点互斥，如\"窥秘+护短\"）**：以赛道主痛点为准，次痛点降级为本集暗线只埋不爆，下集再爆。"},{"p":"skills/01_narrative_skills/skill_world_character_arc.md","t":"世界观与人物弧光技能（NARR-02）· 工业级完整版","d":"WHAT：世界观三问建模、人物立体小传、性格缺陷外化与潜台词转化技能。WHEN：当新建剧集初始化 memory/projects/[剧名]/剧集圣经、立新人设、加深人物弧光或修改人物关系时触发。","raw":"# 世界观与人物弧光技能（NARR-02）· 工业级完整版\n\n## 一、核心职责与工业级法则（6 条硬核铁律）\n\n1. **世界观三问铁律**：世界观只用三句话定义——规则（力量/社会体系如何运作）、稀缺（什么最珍贵）、禁忌（什么不可为）。短剧观众不读百科，超出三问的设定一律砍掉或降为台词中的只言片语。\n2. **性格必须外化铁律**：所有性格描写必须同时落成三列——静态外化（生图可画）/ 动态外化（视频可生成）/ 微表情（KB_02 五节词典）。写不出三列的\"深沉复杂\"人物判为废卡。\n3. **缺陷驱动铁律**：主角必须有 1 个致命性格缺陷（过度隐忍/不信任/报喜不报忧），且该缺陷必须在本集剧情中至少造成一次\"付出代价\"的失误——无缺陷的主角没有弧光，只有爽文提线木偶。\n4. **记忆点 2+1 铁律**：每人 ≥2 个视觉记忆点（1 主 1 备，满足可视化/可叙事/可复现/全剧不重复四条）+1 个口头禅式微表情（如\"只扯单侧嘴角冷笑\"）。\n5. **外貌锁定唯一铁律**：人物外貌以\"外貌锁定摘要\"为唯一权威（KB_02 七节模板），写入资产注册表后，后续所有 Prompt 只能引用 `@资产名`+摘要关键词，严禁换同义词（\"杏眼\"不得时而写\"桃花眼\"——换词=换脸）。\n6. **潜台词禁入画面铁律**：台词只写字面，心理活动必须转化为外化动作写进\"动作节拍\"列；视频提示词里出现\"他心想/他内心\"字样即判废（模型无法生成心理）。\n\n## 二、标准执行 SOP（Step-by-Step）\n\n**Step 1 · 查表选型**：读 `KB_01` 第一节 16 型原型库，为人物选定原型；读第三节年龄感表，锁定年龄段与禁用词（防 AI 脸龄漂移）。\n\n**Step 2 · 填人物立体小传模板**（见 4.1），逐字段填写；性格缺陷必须填\"外化三列\"与\"本集代价事件\"。\n\n**Step 3 · 生成外貌锁定摘要**：按 `KB_02` 七节模板拼装（骨相 5~8 词 + 体型 + 发型 + 肤质 + 穿搭编号 + 记忆点 + 禁用词），交场记 R4 登记资产注册表，领取 `@纯中文资产名`。\n\n**Step 4 · 织关系三角网**：为每对主要人物填\"表面/真实/变化方向\"三栏（见 4.3），确保无孤立人物。\n\n**Step 5 · 潜台词转化**：对关键台词执行\"潜台词转化公式\"（见 4.4），产出\"台词字面 + 外化动作\"两列交付导演；心理描写清除出剧本。\n\n**Step 6 · 自检**：对照铁律 2/3/4/6 逐条打勾；新资产同步进\"资产注册变更单\"。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约\n\n| 字段 | 类型 | 必填 | 说明 |\n|---|---|---|---|\n| 人物需求 | enum | 是 | 新立 / 迭代 / 补缺陷 |\n| 基础设定 | text | 是 | 一句话也行：\"带娃等丈夫的年轻妈妈\" |\n| 所属线/阵营 | text | 是 | 苍穹线 / 烟火线 / 中立 |\n| 与已有人物关系 | text | 迭代必填 | \"与@林烬为宿敌\" |\n\n### 输出契约（下游：场记 R4 / 导演 R2 / 美术 R3）\n\n```yaml\n人物立体小传:\n  @资产名: 林烬\n  原型: 隐忍复仇者 ｜ 年龄段: 青年(18-28)\n  表层性格: 冷峻寡言 ｜ 深层渴望: 为母正名 ｜ 致命缺陷: 过度隐忍(该求助时不求助)\n  外化三列: {静态: \"拳收袖中、下颌绷紧、负剑而立\", 动态: \"深呼吸肩部微沉、指节泛白\", 微表情: \"单侧嘴角冷笑、眼神下压后抬\"}\n  记忆点: {主: \"左手虎口旧疤(母亲护子所留)\", 备: \"剑柄缠暗红绫(母亲遗物)\", 口头禅式: \"冷笑只扯单侧嘴角\"}\n  本集代价事件: \"因隐忍拒接师妹递的伤药，伤势恶化埋下第3集败局\"\n外貌锁定摘要: \"青年22岁｜九头身｜鹅蛋脸下颌线锋利｜剑眉+丹凤眼漆黑瞳｜鼻梁高挺+薄唇微抿｜黑长发高马尾额前两缕碎发｜冷白皮｜GX-01玄黑劲装｜记忆点:虎口旧疤+单侧冷笑｜禁用:笑容灿烂/圆润脸\"\n关系三角: [{对: \"@林烬—@玄天宗大师兄\", 表面: \"大比对手\", 真实: \"杀母仇人之徒\", 变化: \"由轻视到忌惮\"}]\n资产注册变更单: {新增: [\"@林烬\"], 派生: [], 备注: \"纯中文命名已自查\"}\n```\n\n## 四、专项工具箱\n\n### 4.1 人物立体小传模板（逐字段，禁留空）\n\n```text\n@资产名｜原型(KB_01)｜年龄段(KB_01)\n表层性格（一句话）｜深层渴望（一句话）｜致命缺陷（一句话）\n外化三列：静态外化… ／ 动态外化… ／ 微表情链…\n记忆点：主…（前史…）｜备…（前史…）｜口头禅式微表情…\n高光台词风格（语速档/情感倾向，联动 AUD-01）\n本集代价事件（缺陷如何让他付出代价）\n禁忌（该角色绝不会做的事——防 OOC）\n```\n\n### 4.2 性格缺陷外化表（缺陷 → 可生成画面）\n\n| 缺陷内核 | 静态外化 | 动态外化 | 微表情链 | 本集代价示例 |\n|---|---|---|---|---|\n| 过度隐忍 | 拳收袖中、伤处自行遮掩 | 拒绝递来的手、转身先走 | 眼神下压→深吸气→抬眼已平静 | 错过救援窗口伤势恶化 |\n| 报喜不报忧 | 笑容标准得体、手机屏朝下 | 掐灭已拨一半的电话 | 先弯眼笑→瞳孔失焦一瞬→笑恢复 | 谎言堆积引发误会爆发 |\n| 不信任 | 背对人而坐、物品随身不离手 | 接东西用双手但身体后倾 | 目光快速扫视对方双手 | 错过真心相助者 |\n| 控制欲 | 领带一丝不苟、物品码放整齐 | 反复调整他人摆好的物件 | 看到错位时眉心一跳 | 逼走最亲近的人 |\n| 天真执拗(孩童) | 攥紧许愿物不放 | 踮脚反复确认承诺 | 眼睛瞪圆→嘴角渐渐瘪 | 当众拆穿大人的谎 |\n\n### 4.3 关系三角表模板\n\n| 人物对 | 表面关系 | 真实关系 | 变化方向（本季终点） |\n|---|---|---|---|\n| @李梅—@张三 | 母子日常 | 相依为命的共谋者 | 由单向隐瞒走向共担 |\n| @李梅—（丈夫·未登场） | 电话里的承诺 | 缺席的悬念本体 | 由期待到真相揭晓 |\n\n### 4.4 潜台词转化公式\n\n```text\n潜台词三层转化 = 台词字面（≤15字，只写说什么）\n              + 潜台词（一句话，只进剧本备注，禁入画面）\n              + 外化动作（写进动作节拍：先做什么、说到哪个字时做什么、说完留什么表情）\n示例：\n  字面：\"张三，上次我们才吃了。\"\n  潜台词：家里不宽裕，但我不想让你懂事得太早。\n  外化动作：蹲身与孩子平视(先) → 说到\"吃了\"时替他理一下帽檐 → 说\"等爸爸回来\"时眼神先亮后垂、手在他头顶多停半秒(后)。\n```\n\n## 五、常见错误示范 vs 满分工业级示范\n\n### 对比组 1：人物卡\n\n❌ **Bad Case**：\n> @林烬是一个外冷内热、复杂深邃的角色，他背负着血海深仇，内心充满矛盾，时而冷酷时而温柔，是一个非常立体饱满的人物。\n\n**扣分点**：零外化（图画不出\"复杂\"）；无原型无年龄段；无记忆点；无缺陷代价；\"时而…时而…\"是 AI 无法执行的性格描述。\n\n✅ **Good Case**：见\"输出契约\"中 @林烬 完整小传——原型/缺陷/外化三列/记忆点带前史/代价事件/禁忌全部落地，美术可直接引用锁定摘要出图，导演可直接把外化列切进秒级节点。\n\n### 对比组 2：潜台词处理\n\n❌ **Bad Case（心理入画面）**：\n> 视频提示词：@李梅看着孩子渴望的眼神，心中一阵酸楚，她想起丈夫离家时的背影，内心挣扎许久，最终温柔地说：\"等爸爸回来给你买。\"\n\n**扣分点**：\"心中酸楚/想起背影/内心挣扎\"全是心理活动，视频模型无法生成；时长不可测（\"许久\"是几秒？）；触发 KB_10 V6 类问题。\n\n✅ **Good Case（外化入节拍）**：\n> 台词字面：\"等爸爸回来给你买。\"（8字，4字/秒）\n> 外化动作节拍：[先] 蹲身平视+理帽檐 → [说\"等爸爸\"时] 眼神先亮后垂、睫毛轻颤一次 → [说完] 手在头顶轻拍一下收势，嘴角笑意微收。\n> 潜台词（备注栏）：不想让孩子过早懂事。——心理只存在于备注，画面只存在动作。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **配角/群演快速立卡**：不填完整小传，走\"一句话卡\"：`@资产名｜原型｜1 个静态外化｜1 句功能台词`；无记忆点不注册美术资产，仅剧本引用。\n2. **反派魅力化**：反派也必须满足铁律 2/4（外化三列+记忆点），其\"魅力\"来自反差记忆点（如屠刀+喂猫）；禁止用\"纯粹的恶\"糊弄——观众记不住的脸留不住剧。\n3. **双主角弧光交织**：两主角缺陷必须互补互激（隐忍 × 报喜不报忧），本季终点两人缺陷各让一步产生关系跃迁；弧光时间表错峰（A 在第 3 集付代价，B 在第 5 集）。\n4. **人物中途换演员级设定变更（容貌/声线）**：视为新资产——旧名冻结、新名注册（如 @林烬面具形态），旧新关系写入关系三角表，跨集快照同步双状态。\n5. **孩童角色**：年龄段锁定幼儿档（KB_01），禁用词生效（成人比例/成熟眼神）；其\"缺陷\"降级为\"天真特质\"，代价事件不得涉及真实伤害（平台合规）。\n6. ** deceased/回忆角色（白月光）**：只以\"定格画面+逆光回眸\"资产存在，禁止给完整动态小传——回忆角色的崩坏成本最高，出场即特写定格。"}]},{"g":"🎬 导演·美术·场记","items":[{"p":"skills/02_visual_director_skills/skill_art_style_costume_prop.md","t":"美术风格与穿搭道具技能（VIS-02）· 工业级完整版","d":"WHAT：美术指导技能——全局@画风锁制定与变更管控、60-30-10色彩脚本、人物穿搭层次拆解、场景与道具视觉设定、音色视觉转听觉基线。WHEN：剧集初始化定画风、新角色/场景/道具上妆、出具色彩脚本或美术总说明时触发。","raw":"# 美术风格与穿搭道具技能（VIS-02）· 工业级完整版\n\n## 一、核心职责与工业级法则（6 条硬核铁律）\n\n1. **画风锁唯一权威铁律（R9-20261005-17 升级为预设包制）**：新剧初始化定画风时，**必须从 `KB_05` 第七节 4 套风格预设包中选择与题材匹配的 `PACK-XX`**，将其 **6 大维度（①句首媒介前置词／②二维尾锁矩阵／③绑定零光影轨道／④画种排斥禁词与替换表／⑤比例与年龄防漂移基线／⑥画风基准传染协议）完整实例化写入 `memory/projects/[剧名]/资产注册表.md` 第五节**，并强制执行「Gate 1 三图试金石校准测试」（①主时代主角立绘锁 `@全局画风基准图` → ②跨时代/特殊体型配角立绘 → ③核心主场景空镜，三图全过才放行批量）；`@画风锁` 由本技能制定、由资产注册表常量区登记、由所有 Prompt 末尾逐字挂载；**阶段Ⅲ日常生产直接读取《资产注册表》热记忆，无需重复加载 `KB_05`**。锁内四要素（题材画种/核心技法/材质光感/画质词缀）缺一即不合格。\n2. **双签变更铁律**：画风锁一经定稿不可篡改；变更须美术指导提请 + 编剧确认（不影响叙事调性）双签，全局替换并通知所有未完成分集重编译，旧锁在变更登记中留档（回滚依据）。\n3. **色彩 60-30-10 强制配比铁律**：每个场景必须给出主色 60% / 辅助 30% / 点缀 10% 的具体色相与占比句式（可直接编译进 Prompt）；无配比的\"氛围温暖\"判废。人物服装主色不得与场景主导色同色相（防人物融进背景）。\n4. **穿搭四件套+三层次铁律**：每套服装必须齐\"版型+面料+配色+工艺细节\"四件套，并拆解为三层（基底层/中间层/点缀层）；层次 ≥3 的穿搭视频镜头必须降速（层次越多越易粘连，崩坏08）。\n5. **道具可拆解铁律**：核心道具必须拆到\"部件×材质×记忆点\"三级（如剑身/剑格/剑柄各自材质索引 KB_04），并绑定归属人物与持握手别——不可拆解的道具没法出三视图，没三视图的道具跨镜必变形（崩坏12）。\n6. **色温连续性铁律**：同场次色温锁定（黄昏金橙不得中途变正午）；双线剧两线色温对撞须在分线追加缀中显式声明，切换点由导演备注（转场类型）承接。\n\n## 二、标准执行 SOP（Step-by-Step）\n\n**Step 1 · 取风格预设包定画风（R9-20261005-17）**：读 `KB_05` 第七节 4 套 `PACK-XX` 标准档案（01 国风仙侠×现代都市漫剧厚涂·S级／02 真人写实·A级／03 3D国漫CG·A级／04 赛璐璐番剧·A级）→ 按题材与认证等级选包（A级包须预告 Gate 1 强制校准）→ 将包的 **6 大维度完整实例化**写入《资产注册表》第五节（媒介词/尾锁矩阵/轨道/禁词表/年龄基线/传染协议逐项登记）→ 组织「三图试金石校准测试」全过 → 交注册表登记；严禁绕过预设包自造散装画风锁（自造=无禁词表=无 G9 门禁执法依据）。\n\n**Step 2 · 出色彩脚本**：读 `KB_04` 五节色彩心理学表与六节 60-30-10 公式，为每个场景填色彩脚本表（含编译句式列——逐字可进 Prompt）。\n\n**Step 3 · 拆穿搭**：读 `KB_03` 题材套装表选编号 → 补齐四件套 → 按三层次拆解表展开 → 配饰 ≤3 件 → 写入人物视觉卡并同步 KB_02 外貌锁定摘要的穿搭索引。\n\n**Step 4 · 拆场景**：每场景出\"空间三段（前/中/远景）+光源方向与色温+关键陈设记忆物 3 件\"；S/A 级主场景另评估是否加产**场景机位库宫格**（R9-20261006-6）——从 R2 分镜表反推高频机位清单（俯瞰/平视远近中景/低角度仰拍/纵深过道/陈设特写等），按 KB_06 母版⑧ 编排固定机位序（3x3，室内降 2x2 防格间漂移），格序登记注册表；俯瞰全景与平视空镜两件基准图**仍独立保留**（轴线依据/氛围锚职能不可替代），机位库仅为垫图扩展层。\n\n**Step 5 · 拆道具**：按三级拆解 + 材质索引 + 持握手别 + 记忆点；交 VIS-03 出三视图。\n\n**Step 6 · 音色转听觉**：为每人出音色基线（音色质感/语速档/情感倾向），交 AUD-01 落地克隆卡。\n\n**Step 7 · 自检**：对照 4.1 画风锁自检清单与铁律 3/4/5 逐项打勾；产出变更登记（如有）。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约\n\n| 字段 | 类型 | 必填 | 示例 |\n|---|---|---|---|\n| 题材/基调 | text | 是 | 东方玄幻×冷 / 都市温情×暖 |\n| 人物清单 | list | 是 | 含原型与年龄段（来自 NARR-02） |\n| 场景/道具清单 | list | 是 | @玄天宗比武台 / @焚天断剑 |\n| 参考风格 | text | 否 | \"对标《XXX》电影感\" |\n\n### 输出契约（下游：VIS-03 资产 / R5 生图 / R6 视频 / AUD-01）\n\n```yaml\n风格预设包绑定:\n  取包: \"KB_05 七节 PACK-01（国风仙侠×现代都市唯美漫剧厚涂包 · 🌟S级实测封板）\"\n  六维实例化: \"①媒介（古=国风仙侠漫剧插画…/现=现代都市漫剧插画…）②尾锁矩阵（古装人物/现代人物/古装场景/现代场景/道具 五锁）③轨道（B轨平涂柔光）④排斥禁词表（写实厚涂/8K电影感/无影棚/正交相机/Albedo/毛孔可见/轻熟→替换词）⑤年龄双向锚基线 ⑥画风基准传染协议——全部登记于资产注册表第五节，Gate 1 三图试金石通过\"\n@画风锁:\n  常量: \"仙侠唯美漫剧质感，新中式工笔厚涂，肤若凝脂衣袂仙气流转，8K高清（＝PACK-01 维度②古装人物锁）\"\n  追加缀: {沧澜线: \"+青碧玄黑的冷调山水+锅气橘金的暖光点缀\", 人间线: \"+现代都市高饱和暖色+浅景深糖水感\"}\n  轨道例外: \"资产锁定图按 PACK-01 维度③ B 轨平涂柔光词组执行（禁摄影工程词）\"\n色彩脚本:\n  - 场景: \"@光大街边\"\n    编译句式: \"画面以暖金橙黄昏色调为主导（约六成），辅以梧桐绿荫与楼宇灰调（约三成），点缀美食摊蒸腾白雾与暖黄灯串（约一成）\"\n人物穿搭:\n  - \"@李梅\": {套装编号: \"DS-01\", 四件套: \"米白针织开衫+浅杏连衣裙｜罗纹针织面料｜米白+浅杏｜小圆领罗纹袖口\", 三层: \"基底=浅杏连衣裙 / 中间=米白开衫 / 点缀=帆布托特包+素色发夹\", 配饰: 3件, 视频降速: \"层次3层,奔跑镜禁用\"}\n道具卡:\n  - \"@焚天断剑\": {归属: \"@林烬(右手)\", 三级拆解: \"剑身=玄黑锻打+暗红余烬纹 / 剑格=火焰纹铸铜 / 剑柄=暗红绫布缠绕\", 材质索引: \"KB_04玄铁+精钢+绫布\", 记忆点: \"断而不折(缺口位置固定在剑尖下1/3)\", 持握手别: \"右手持/背负时剑柄自左肩后探出\"}\n音色基线:\n  - \"@李梅\": \"温软治愈女声｜4字/秒｜尾音轻扬带暖意｜安慰段气声增多\"\n```\n\n## 四、专项工具箱\n\n### 4.1 全局 @画风锁 制定规范（预设包制）\n\n**取包优先公式（R9-20261005-17）**：\n```text\n新剧画风 = KB_05 七节选 PACK-XX → 6 维实例化登记注册表第五节 → Gate 1 三图试金石 → 放行批量\n@画风锁 单锁结构（包内维度②每条锁仍须满足） = [题材画种]（PACK维度①同源） + [核心技法]（工笔厚涂/CG渲染/勾线平涂…） + [材质光感]（肤若凝脂/真实皮肤纹理/PBR材质…） + [画质词缀]（8K高清/4K作画…）\n```\n**自造锁红线**：跳过预设包自造散装锁（无维度④禁词表、无维度③轨道绑定）＝Gate 1 直接打回——无禁词表的锁在 KB_10 G9 门禁无执法依据，画风漂移不可审计。\n**制定流程**：选包 → 六维登记 → 三图试金石 → 双线剧另出追加缀 → 登记 → 全剧挂载（阶段Ⅲ读注册表热记忆，不重载 KB_05）。\n**自检清单**：\n- [ ] 已从 KB_05 七节取包且 6 维完整登记（缺一维即不合格）？\n- [ ] 包内六维正交互锁（维度②③零命中维度④禁词，逐词 grep 复核）？\n- [ ] 尾锁矩阵按 [古/现]×[人物/场景/道具] 齐备且每条 ≤35 字、四要素齐全？\n- [ ] A级包已预告 Gate 1 强制三图校准；S级包沿用封板参数？\n- [ ] 各线追加缀色温声明？\n- [ ] 变更流程（双签+全局替换+留档）已写进剧集圣经？\n\n### 4.2 60-30-10 色彩脚本表（含编译句式）\n\n| 场景 | 主导色 60% | 辅助色 30% | 点缀色 10% | 可编译句式（逐字入 Prompt） |\n|---|---|---|---|---|\n| @玄天宗比武台 | 冷青蓝（天光+雷云） | 灰白云海+石质灰 | 符文银白高光 | \"冷青蓝主调天光为主导（约六成），辅以云海灰白与石质灰（约三成），符文银白高光点缀（约一成）\" |\n| @光大街边 | 暖金橙（黄昏） | 梧桐绿荫+楼宇灰 | 白雾热气+暖黄灯串 | \"暖金橙黄昏色调为主导（约六成），辅以梧桐绿荫与楼宇灰调（约三成），点缀蒸腾白雾与暖黄灯串（约一成）\" |\n| 悬疑夜巷 | 墨绿+紫黑 | 冷灰水泥 | 单点暖光（一盏灯） | \"墨绿紫黑主调（约六成），冷灰（约三成），单点暖光（约一成）\" |\n\n**点缀色在场核查**：逐镜核对 10% 点缀色元素是否入画——点缀色丢失=画面变\"脏\"（场记核查项）。\n\n### 4.3 人物穿搭层次与道具细节拆解表\n\n| 拆解维度 | 人物穿搭（@李梅 示例） | 道具（@焚天断剑 示例） |\n|---|---|---|\n| 基底/部件一 | 浅杏色连衣裙（A字裙摆） | 剑身：玄黑锻打纹理+暗红余烬纹+断口在剑尖下1/3 |\n| 中间/部件二 | 米白针织开衫（罗纹袖口、小圆领） | 剑格：火焰纹铸铜 |\n| 点缀/部件三 | 帆布托特包（斜挎）+素色发夹 | 剑柄：暗红绫布缠绕+剑镡云纹 |\n| 面料/材质索引 | KB_04 针织/帆布 | KB_04 玄铁/精钢/绫布 |\n| 状态派生登记 | 派生 `@李梅雨夜`（湿发+贴身裙摆）需登记 | 派生 `@焚天断剑觉醒`（纹路发亮）需登记 |\n| 视频防崩备注 | 层次 3 层→奔跑镜禁用/风镜降速 | 大动作镜加\"剑始终握于右手、不入画出画\" |\n\n## 五、常见错误示范 vs 满分工业级示范\n\n### 对比组 1：画风锁制定\n\n❌ **Bad Case**：\n> 画风：整体要高级一点，有电影感，然后色彩要丰富，人物要精致，背景要有意境，偶尔可以来点国风元素。\n\n**扣分点**：五要素全缺；\"高级/意境/偶尔\"不可执行不可验收；无画质词缀无色温声明；双线剧无追加缀——每条 Prompt 挂载后必然画风漂移。\n\n✅ **Good Case**：\n> `@画风锁 = 电影级东方新国风写实厚涂质感（流派+质感），细腻皮肤纹理与织物纤维细节（颗粒度），volumetric 体积光氛围（光影），高对比冷暖双色温影调（色温），8K超高清画质、电影感构图（词缀）`；苍穹线追加\"冷青蓝主调+剑气银白高光\"，烟火线追加\"暖金橙主调+黄昏柔焦光晕\"；资产图例外条款：体积光→均匀漫射平光。已登记注册表常量区。\n\n### 对比组 2：穿搭拆解\n\n❌ **Bad Case**：\n> @李梅穿着一身温柔知性的秋装，米色系搭配很有气质，整体给人岁月静好的感觉，包包和鞋子也很搭配。\n\n**扣分点**：无版型（开衫还是风衣？）、无面料、无工艺细节、无三层次、\"米色系\"到底几件米色？视频模型自由发挥=每镜换装；\"岁月静好\"不是服装词。\n\n✅ **Good Case**：见\"输出契约\"中 @李梅 完整拆解——DS-01 编号+四件套+三层拆解+配饰 3 件+降速备注；美术、生图、场记三方拿同一张卡工作，跨镜零歧义。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **双线双色温剧**：两线各自追加缀独立声明；切换集的切换镜在色彩脚本中加\"交叉过渡 0.3s\"条目（冷青→暖金交叉溶），交 R8 执行。\n2. **派生画风锁（回忆/梦境/幻境）**：不新建锁——在主锁后追加强限定缀（\"水彩晕染回忆滤镜/低饱和梦境\"），并限定仅在该段落镜头挂载；段落结束回归主锁。\n3. **跨季/跨篇章服装升级**：新套装=新派生资产（`@林烬宗门大比礼服`），走 VIS-03 五件套流程；旧套装注册表不删（ flashback 镜头引用）。\n4. **服装与背景同色相冲突**：优先改服装点缀层色相（成本最低）；服装已锁定则改场景辅助色 30% 的色相，并在色彩脚本表更新编译句式。\n5. **道具频繁易主剧情**：道具卡\"归属\"列改多人清单+持握手别矩阵（谁/哪只手/何时）；每次易主在分镜备注强制写显式交接动作（抛/递/掉落），交 R4 入核对清单。\n6. **极简主义/黑白风格剧集**：60-30-10 退化为\"明度 60-30-10\"（高调/中调/低调配比），色彩脚本表填明度值而非色相，其余流程不变。"},{"p":"skills/02_visual_director_skills/skill_asset_pure_chinese_no_light.md","t":"纯中文零光影资产技能（VIS-03 · 核心）· 工业级完整版","d":"WHAT：【核心】重要资产图策划技能——@纯中文资产名命名正则约束、Albedo漫反射零高光阴影正面物理词库、人物主图/正交三视图/多表情矩阵/全景场景/道具三视图五套完整编译模板、三视图切分单人参考图防多头怪指南。WHEN：新资产入库、产出《重要资产图片提示词》文档、任何需要资产设定图的时刻触发。","raw":"# 纯中文零光影资产技能（VIS-03 · 核心）· 工业级完整版\n\n## 一、核心职责与工业级法则（6 条硬核铁律）\n\n1. **命名正则铁律**：资产名必须满足 `^@[\\u4e00-\\u9fa5]{2,6}$`——`@` 后接 2~6 个纯中文汉字，严禁英文字母、数字、下划线、连字符、空格与任何特殊符号。派生名 = `@母资产名+状态词`（如 `@林烬战损`、`@光大街边夜`），同样受正则约束。未通过正则的名字，场记 R4 拒绝登记，生图专家 R5 拒绝引用。\n2. **正面物理描述铁律（四轨制 · R9-20261005-17 拆分）**：扩散模型对否定词不敏感——\"无高光无阴影\"反而注入高光/阴影的概念激活。资产图一律使用 `KB_06` 第〇节**四轨总表**（唯一权威源）中的**正面物理状态描述**：**【A轨·写实真人向】**（`360度环形无影棚拍柔光…`）／**【B轨·漫剧/厚涂插画向】**（`平涂式均匀柔和平光，光影平面化处理…`）／**【C轨·3D CG向】**（`3D引擎标准无影漫反射视口光照…`）／**【B-Cel轨·赛璐璐向】**（`二维动画设定稿标准均匀平光…`）——四轨与 `KB_05` 的 `PACK-01~04` **一一对应互锁**：按项目注册表第五节绑定的 `PACK-XX` 维度③取轨，**严禁跨包混轨**（B 轨项目误用 A 轨\"无影棚/正交相机/Albedo\"任一词＝G4 ◆ 一票否决）。\n3. **图集五件套铁律（人物）**：每位人物必须产出——①人物主图 ②正侧背正交三视图 ③多表情矩阵（3x3）④独立面部特写 ⑤独立全身立绘。缺任何一件，该人物禁止进入视频生产（④⑤是防\"三人同框\"的解药，见 4.4）。\n4. **画风锁轨道对齐铁律（R9-20261005-17 四轨化）**：资产锁定图（三视图/矩阵/立绘/特写）挂载 @画风锁 时，光影一律按项目 `PACK-XX` 维度③对应轨道词组执行（B 轨平涂柔光／A 轨无影棚／C 轨视口柔光／B-Cel 轨设定稿平光，KB_06 第〇节），锁文本内与轨道冲突的光影词按维度④替换表编译——零光影铁律优先级高于画风锁，且**严禁跨包混轨**。\n5. **单镜防呆铁律**：三视图/表情矩阵只用于锁定设定（存档/LoRA 训练/Inpainting 锁脸参考），**严禁直接喂给视频模型或作为单镜首帧**——必须先切分出单人参考图（4.4 指南）。**多格板红线扩展（R9-20261006-7）**：头身分区板/非人形分区轮转板（母版⑨⑩）同此红线——多格=多头怪高危，禁入参考位。\n6. **先登记后引用铁律**：任何 Prompt 中出现的 `@资产名` 必须先在资产注册表登记（含外貌锁定摘要）；评分官 R7 对未注册资产直接 G1/V1 一票否决。\n\n## 二、标准执行 SOP（Step-by-Step）\n\n**Step 1 · 命名与登记**：按铁律 1 正则起名 → 查注册表去重（同音歧义禁止，如\"李梅/李湄\"不同时注册）→ 场记登记（人物/场景/道具/派生分区）→ 领取使用权。\n\n**Step 2 · 查表定图集**：人物走五件套；场景两件套（全景图+空镜基准图），S/A 级主场景可选扩为三件套（＋机位库宫格·KB_06 母版⑧·R9-20261006-6）；道具两件套（正交三视图+特写基准图）。**路由触发（R9-20261006-7 立 · R9-20261006-9 订）**：复杂度识别命中（人物头部记忆点≥3项并发或服饰层次≥3层）、非人形/大型道具、表情精度需求，或用户点名宫格备用抽卡 → 先过 VIS-05 板式路由器（skill_asset_sheet_board_router）定板式再回本流程编译；未命中 → 传统五件套直行（默认主流）。在输出契约\"图集清单\"中打勾管理。\n\n**Step 3 · 逐图编译**：调取 `KB_06` 第四节母版①~⑦逐字复制后填空编译（[ ] 占位符全部替换为注册表锁定摘要关键词，禁留空，并过本技能 4.3 填空校验清单）；每条 Prompt 末尾挂画风锁（按铁律 4 替换光影词）+ 画幅 + 分辨率。\n\n**Step 4 · 防呆标注**：在三视图与矩阵 Prompt 下方追加\"单镜参考防呆说明\"（4.4 精简版），并在《重要资产图片提示词.md》〇节统一声明。\n\n**Step 5 · 送检**：全部 Prompt 送 R7 评分（G 表，G1/G4/G7/G8 为否决级），≥9.0 写入产出文档；同时附生图平台建议（豆包 Seedream 4.0 主力 / ComfyUI Flux 锁脸批量）。\n\n**Step 6 · 自检**：对照 4.5 质检自查表逐项打勾，交注册变更单给场记归档。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约\n\n| 字段 | 类型 | 必填 | 说明 |\n|---|---|---|---|\n| 资产类型 | enum | 是 | 人物 / 场景 / 道具 |\n| 设定来源 | 卡片 | 是 | 人物小传（NARR-02）/ 场景卡、道具卡（VIS-02） |\n| 母资产名 | @名 | 派生时 | 生成 `@母+状态词` |\n| 图集需求 | enum | 是 | 五件套 / 两件套 |\n\n### 输出契约（下游：R5 生图执行 / R7 评分 / R4 登记）\n\n```yaml\n命名合规判定: {资产名: \"@林烬\", 正则: \"^@[一-龥]{2,6}$\", 判定: \"通过\", 查重: \"无冲突\"}\n图集清单: {主图: \"✓9.4分\", 三视图: \"✓9.3分\", 表情矩阵: \"✓9.2分\", 面部特写: \"✓9.5分\", 全身立绘: \"✓9.4分\"}\n编译Prompt: [\"```prompt …```\" × 5]\n防呆说明: \"三视图仅锁定设定；视频首帧前必须切分④⑤单人参考图，防多头怪\"\n送检状态: \"全部≥9.0，已写入 workspace/<剧名>/重要资产图片提示词.md\"\n注册变更单: {新增: [], 派生: [], 摘要更新: []}\n```\n\n## 四、专项工具箱\n\n### 4.1 @纯中文资产名命名正则与规则\n\n```text\n正则：^@[\\u4e00-\\u9fa5]{2,6}$\n合规示例：@林烬 @李梅 @张三 @玄天宗比武台 @光大街边 @焚天断剑 @林烬战损 @光大街边夜\n违规示例（一律打回）：\n  @LiMei_v2（英文+数字+下划线）  @street-01（英文+连字符）  @张三3（数字）\n  @焚天·断剑（特殊符号）  @玄天宗比武台广场连带观礼席（超6字冗长）\n命名细则：2~6字为宜；人物用姓名或姓名+身份词；场景用地点核心名；派生用\"@母+状态词\"且状态词≤2字优先。\n```\n\n### 4.2 零光影四轨词库与分轨母版 · 调用指针（表存于 KB_06，此处不抄副本）\n\n> 去重铁律：四轨正反词组与七套分轨母版以 `kb_library/KB_06` 为唯一权威源——本技能只存指针与填空校验，防两处版本漂移。\n\n| 素材 | 唯一权威源（现查现用） |\n|---|---|\n| 零光影轨道四轨总表（A 写实真人／B 漫剧厚涂／C 3D CG／B-Cel 赛璐璐 · 与 KB_05 PACK-01~04 互锁）+ A 轨正反词组 22 组 + B/C/B-Cel 轨替换表 + 英文对照串 | `KB_06` 第〇节~第一节 |\n| 分轨编译母版：①人物主图 ②正交三视图 ③3x3表情矩阵 ④独立面部特写 ⑤独立全身立绘 ⑥场景空镜基准 ⑦道具三视图 ⑧场景机位库九宫格（场景件·R9-20261006-6，挂场景锁+光位常量，不用轨道光影词组）⑨人物头身分区板 ⑩非人形分区轮转板（⑨⑩＝R9-20261006-7 设定锁定件，经 VIS-05 路由触发，多格板禁入参考位）（①~⑦ `[轨道光影词组]` 按项目 PACK-XX 维度③选轨逐字填入） | `KB_06` 第四节（逐字复制后填空） |\n\n### 4.3 母版填空校验清单（调用 KB_06 母版后逐项核对）\n\n- [ ] 每个 `[ ]` 槽位均用**注册表锁定摘要原词**填充（禁现场自造同义词）？\n- [ ] 骨相槽取 `KB_02` 摘要 5~8 词；套装槽取 `KB_03` 编号+四件套？\n- [ ] 三视图\"背面关键细节\"槽：背饰/包带/垂帽走向已明确？\n- [ ] 表情矩阵九格均为\"具体面部动作\"词（禁抽象词\"开心/难过\"）？\n- [ ] `@画风锁` 已挂载且按 `PACK-XX` 维度②矩阵取对应时代×类型锁（轨道＝维度③对应轨，无跨轨混用）？\n- [ ] 线别追加缀、画幅、分辨率（4K）三件齐？ [ ] （机位库⑧）固定机位序逐格标注、同光位同色温约束句在（R9-20261006-6）？\n\n### 4.4 三视图切分单人参考图防多头怪指南\n\n**问题**：视频/单镜生图模型把三视图识别为\"三个人同框\"→ 复制人、全员乱张嘴、串脸（黑名单崩坏05/06 前置诱因）。\n\n**切分流程（四步）**：\n1. **选格**：从三视图中裁出\"正面\"单格（视频首帧基本只用正面；侧面格供侧拍镜备用）。\n2. **补图**：裁切格分辨率不足时，以该格为图生图参考（重绘 0.3）重出高清单人图——`独立正面全身立绘图`（A-Pose 微张 20 度，纯白背景，9:16 竖构图便于竖屏镜）。\n3. **特写**：另出 `独立面部特写图`（发际线至锁骨，1:1）——多图参考素材位的锁脸首选。\n4. **入位**：即梦素材位\"人物立绘 1 位 + 面部特写可选 1 位\"；ComfyUI 用 PuLID/IP-Adapter 挂面部特写；可灵首帧直接用单人立绘合成图。\n\n**红线**：素材位/首帧/ControlNet 参考图中出现完整三视图或矩阵图 = 防呆违规，R7 按 G8 关联扣分。\n\n### 4.5 资产图质检自查表（送 R7 前自检）\n\n- [ ] 名称过正则且在册？ [ ] 五件套/两件套齐全？ [ ] 项目 PACK-XX 维度③对应轨道词组逐字在、无否定式残留、无跨轨混用？\n- [ ] A-Pose 手臂与躯干间空隙可见（无粘连）？ [ ] 背景纯白/18%灰？\n- [ ] 三视角同比例同间距无透视？ [ ] 矩阵九格同一张脸（骨相一致）？\n- [ ] 画风锁挂载且光影词已按例外条款替换？ [ ] 画幅+分辨率标注？\n- [ ] 防呆说明已附（三视图/矩阵图下方）？ [ ] ④⑤单人参考图已列入生产计划？\n\n## 五、常见错误示范 vs 满分工业级示范\n\n### 对比组 1：零光影写法\n\n❌ **Bad Case**：\n> @李梅三视图：米色穿搭的温柔女性三视图，无高光，无阴影，不要透视，背景干净，画面简洁，细节丰富。\n\n**扣分点**：全否定式（模型反而注入光影概念）；\"米色穿搭\"无四件套；无 A-Pose（衣袖粘连风险）；\"背景干净/细节丰富\"空洞矛盾——G4 一票否决，评分 ≤8.5 打回。\n\n✅ **Good Case**（模板②填空 · A 轨示例＝项目绑定 PACK-02 真人写实包时使用；漫剧项目换 B 轨词组+PACK-01 媒介）：\n```prompt\n古装真人实拍电影剧照，35mm定焦镜头光学摄影质感；角色设定三视图（Turnaround Sheet）：@李梅，圆脸尖下巴柳叶眉杏眼，栗色齐肩微卷发素色发夹，米白针织开衫+浅杏色连衣裙，帆布托特包斜挎；A-Pose双臂自然微张约30度防袖身粘连，双脚与肩同宽；正面、左侧面、背面三视角等距水平排列，同一角色三个视角比例严格一致（非三个人物，非合影），全身完整造型含背面斜挎包带走向；360度环形无影棚拍柔光，均匀漫射平光，漫反射固有色贴图质感（Flat Lit Albedo / Diffuse Pass），正交投影相机零透视畸变，中性18%灰背景，电影级写实质感，真实皮肤纹理与织物细节，8K超高清电影感，16:9横幅，4K\n```\n**过审依据**：对应轨道物理词逐字挂载、四件套齐全、A-Pose 防粘连、含\"非三个人物\"反制词——G4/G5/G6 全过，9.4 分放行。\n\n### 对比组 2：单镜参考使用\n\n❌ **Bad Case**：\n> 镜头2 视频生成：上传 @张三 的三视图作为参考图，生成孩子在街上走路的视频，保持人物一致。\n\n**扣分点**：三视图整张入参考位=多头怪诱因（视频模型见\"三个张三\"）；\"保持一致\"无机制支撑。\n\n✅ **Good Case**：\n> 镜头2 素材位1：@张三 独立全身立绘（自三视图正面格切分+重绘 0.3 补高清）；Prompt 引用 `@张三（天蓝小熊耳卫衣，身高约一米一）`+一致性行\"人物与参考素材保持一致\"；备选素材位 2：@张三 独立面部特写（微表情戏时替换主参考）。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **带翅膀/披风/长裙摆角色三视图**：横向上占用超宽导致三视角挤压——改出\"两件套拆分版\"：正面+侧面一张、背面单独一张（均同规范）；或 T-Pose 改 A-Pose 收窄展幅；裙摆触地角色加\"裙摆边缘与背景留 5% 空隙\"防粘连。\n2. **双人 CP 资产（情侣/母子连体镜高频）**：可注册\"双人组合立绘\"派生资产（`@母子同行`，母左子右固定站位），一次性锁定双人身高差与间距——比每次双参考融合更稳；命名仍受正则约束。\n3. **场景带文字招牌需求**：资产阶段一律生成\"字迹模糊虚化\"版本（清晰文字必乱码，崩坏11）；拍摄所需可读文字由剪映后期贴字，在场景卡备注\"文字后期贴\"。\n4. **道具与手部强绑定（戒指/手套类）**：特写基准图加\"无手部佩戴展示，悬空平摆\"规避手部崩坏；佩戴态由视频阶段差分生成。\n5. **非人形资产（灵宠/机甲/法器）**：五件套退化为三件套（主图/三视图/特写），\"表情矩阵\"改为\"形态矩阵\"（待机/攻击/受损三形态）；**三视图件可升级为非人形分区轮转板**（KB_06 母版⑩·R9-20261006-7：上排头部三视角+下排全身三视角+尺寸标注——轮转板锁空间轴、形态矩阵锁状态轴正交互补；经 VIS-05 路由触发，多格板禁入参考位）。\n6. **资产迭代（用户对已过审资产改设定）**：旧图不删——新摘要登记后出\"V2 图集\"，注册表标注版本与生效集数；已拍镜头维持 V1（防跨集突变），未拍镜头切 V2。\n7. **场景机位库子图登记（R9-20261006-6）**：机位库母图随场景资产正常注册；逐格裁切子图**不另立资产名**（正则禁数字+防注册表膨胀）——注册表母图行下挂\"机位格索引\"一行（第一格俯瞰全景/第二格平视远景/…，格序=KB_06 母版⑧机位序）；分镜垫图指引按\"@场景名 机位库第N格\"（汉字数字）引用；子图须回填 IMG-01 补高清重绘 0.3 后方可入垫图位，S 级首帧仍单独精出（宫格裁切图仅作垫图/参考锚，禁直出）。"},{"p":"skills/02_visual_director_skills/skill_asset_sheet_board_router.md","t":"资产设定板式路由器技能（VIS-05 · R9-20261006-7 立 · R9-20261006-9 订：按需触发+备用抽卡）· 工业级完整版","d":"WHAT：资产设定板式路由器——按「资产类型×细节焦点×复杂度」三维按需路由宫格设定板式：人物头身分区设定板（头部细节不因全身等比缩小而丢失）、非人形分区轮转板（怪兽/灵宠/机甲/大型道具 头部+全身多视角+尺寸标注）、表情矩阵增强格位（wink单侧闭眼/口型张合）、宫格备用抽卡模式（与正视图并行生成择优）。WHEN：框架识别资产复杂度高（人物头部记忆点≥3项并发或服饰层次≥3层/非人形多形态/大型道具）时主动按需调用，或需在《重要资产图片提示词》生成宫格备用抽卡方案时触发——默认走传统单视图五件套，本技能同 IMG-02 多宫格分镜垫图一样按需使用（R9-20261006-9）。","raw":"# 资产设定板式路由器技能（VIS-05 · R9-20261006-7 立 · R9-20261006-9 订：按需触发+备用抽卡）· 工业级完整版\n\n## 一、核心职责与工业级法则（6 条硬核铁律）\n\n1. **按需触发铁律（R9-20261006-9 订 · 废除 S/A 级人物等级触发）**：**传统单视图五件套（母版①~⑦）为默认主流产出体系，本技能永不自动替代**——仅当 VIS-03（Step 2 查表定图集）识别**复杂度命中**时才主动调用（同 IMG-02 4.3 多宫格分镜垫图的适用判定范式，按需使用）：①人物资产且**头部记忆点 ≥3 项并发**（发饰+瞳色+疤痕/泪痣/骨相标志等同时存在）**或服饰层次 ≥3 层且部件记忆点密集**；②**非人形资产**（怪兽/灵宠/机甲/法器）；③**大型道具**或表情精度需求（wink/口型格）。复杂度未命中 → 传统五件套直行，本技能不介入。\n2. **多格板参考位禁入铁律（红线）**：头身分区板/分区轮转板均为**多格板**，与三视图/表情矩阵同源红线（VIS-03 铁律 5）——**只用于锁定设定（存档/LoRA 训练/Inpainting 参考），严禁直接喂视频模型或作单镜首帧**（多格=多头怪高危，崩坏 05/06）。视频参考仍走 VIS-03 ④⑤单人参考图。\n3. **母版唯一权威源铁律（去重）**：板式 A/B 的编译母版⑨⑩本体只存在于 `KB_06` 第四节；本技能只存指针、格位分配表与适用判定——严禁在任何 Skill 内抄写母版（防两处版本漂移，VIS-03 4.2 同款铁律）。\n4. **格间一致性铁律**：头身分区板＝**上排同一颗头**（三头像骨相同源）+**下排同一套服饰**（人台三视角部件一致）；轮转板＝**六格同一生物同一比例**。编译时一致性约束句逐字必写（母版内已内置），验收时逐格比对——任一格跨格矛盾＝该格废弃局部重绘（同 KB_10 宫格核查族处置）。\n5. **平台版式锁铁律**：多格板平台首选**豆包 Seedream**（组图写法有表情矩阵实测——plat_01 四节组图规格行与\"组图九宫格表情矩阵\"实测条；**组图主路径＝单画布多角度宫格**——豆包 App 实测支持（2026-10-06 用户验证·场景机位库 3x3 九格无崩坏），\"生成N张图\"多图输出仅作单机位补产备选，plat_01 六节 9·R9-20261006-11）；**ChatGPT 平台强制版式锁**（单幅约束+显式格数声明）——黑名单前科\"ChatGPT 擅自三视图拼图\"（2026-10-05 归档），无版式锁的多格请求会被擅自拼改。\n6. **Gate 1 实测转正铁律**：头身分区板（无头人台写法）与分区轮转板均为**零实测新板式**——新剧绑定 PACK 后按场景机位库先例（R9-20261006-6）在 Gate 1 阶段**各先试一张**，实测格间漂移率与版式遵从度后填复盘占位转正；实测前一切触发结论均为建议级非强制（含备用抽卡模式的\"优于正视图\"假设）。\n\n## 二、标准执行 SOP（Step-by-Step）\n\n**Step 1 · 路由判定（R9-20261006-9 订）**：按 4.4 决策树表输入「资产类型×细节焦点×复杂度」→ 得路由结论（板式 A / 板式 B / 板式 C 增强 / 备用抽卡模式 / 维持传统五件套——后者为默认，未命中不介入）。\n\n**Step 2 · 板式分流**：板式 A（人物头身分区板）→ 4.1；板式 B（非人形/大型道具轮转板）→ 4.2；板式 C（表情矩阵增强格位）→ 4.3；无命中 → 退回 VIS-03 传统五件套流程。\n\n**Step 3 · 格位分配表**：按对应板式专节模板列\"格位分配表\"（每格视角/内容/词源节次），标注裁切用途（上排头像格→微表情参考位候选/下排服饰格→Inpainting 锁服参考——**均须裁切+回填 IMG-01 补高清重绘 0.3 后方可入参考位**，整板禁入见铁律2）。\n\n**Step 4 · 指针取母版编译**：到 `KB_06` 第四节复制母版⑨/⑩逐字填空——头部区槽位取 `KB_02` 二节（骨相）/四节（眼部）/六节（发型发饰）注册表锁定摘要原词；服饰区槽位取 `KB_03` 二节（部件剪裁）+套装四件套；严禁现场自造同义词（VIS-03 4.3 填空校验同款）。`KB_02/KB_03` 仅按槽位取词时翻对应节，不常驻全册（防与 VIS-03 并发挂载时突破\"≤2 KB\"上下文预算）。\n\n**Step 5 · 送检**：全部 Prompt 送 R7 评分（G 表 + KB_10 宫格资产附加核查族）；≥9.0 写入《重要资产图片提示词.md》，生图策略行注明\"多格板·设定锁定件·禁入参考位\"。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约\n\n| 字段 | 类型 | 必填 | 说明 |\n|---|---|---|---|\n| @资产名 | @名 | 是 | 须已过 VIS-03 正则与注册表登记 |\n| 资产类型 | enum | 是 | 人物 / 非人形（怪兽/灵宠/机甲/法器） / 大型道具 |\n| 细节焦点 | enum | 是 | 头部高精度 / 服饰结构 / 表情控制 / 形体结构 |\n| 复杂度判定 | enum | 人物必填 | 高（头部记忆点≥3项并发或服饰层次≥3层）/ 常规（板式 A 触发依据·R9-20261006-9） |\n\n### 输出契约（下游：R5 生图执行 / R7 评分 / R4 登记）\n\n```yaml\n板式路由结论: {资产: \"@林烬\", 结论: \"板式A 头身分区设定板\", 依据: \"头部记忆点3项并发（浅琥珀瞳+束高马尾黑发绳+右眼下泪痣）命中复杂度判定\", 触发: \"复杂度判定命中·按需产出（传统五件套仍为默认主流）\"}\n格位分配表: [{区: \"上排\", 格: \"左/中/右\", 内容: \"左侧正侧面头像/正面头像/右侧正侧面头像\", 词源: \"KB_02二/四/六节\"}, {区: \"下排\", 格: \"正/侧/背\", 内容: \"无头人台三视角服饰\", 词源: \"KB_03二节\"}]\n编译Prompt: \"```prompt （指针取 KB_06 母版⑨ 填空产出）```\"\n格间一致性约束: \"上排三头像骨相同源；下排人台同一套服饰部件一致；上排与下排为同一角色同一套服饰\"\n平台版式锁: \"豆包组图写法首选；ChatGPT 强制版式锁（3+3格显式声明）\"\n送检状态: \"9.X 分放行（G表+宫格附加核查族双检）\"\n```\n\n## 四、专项工具箱\n\n### 4.1 板式A 人物头身分区设定板（指针：KB_06 母版⑨ · R9-20261006-7）\n\n**解决的问题**：传统母版②正侧背全身三视图把头部等比缩小至约 1/8 画幅——发丝/瞳色/发饰/疤痕级记忆点细节全灭；本板式把头部拆出单独占上排三格满分辨率，下排以无头人台（Fashion Mannequin）承载服饰三视角。\n\n**适用判定（R9-20261006-9 订 · 复杂度触发，废除人物等级触发）**：人物资产 + **头部记忆点 ≥3 项并发**（如：特殊瞳色+标志性发饰+疤痕/泪痣同时存在）**或服饰层次 ≥3 层且部件记忆点密集**。传统母版②正侧背三视图为**默认主流**（所有人物必产）；板式 A 仅复杂度命中或用户点名时按需产出（可与母版②并行生成择优，见 4.5 备用抽卡模式）；按铁律 6 实测转正前均为建议级。\n\n**格位分配表**：\n\n| 区位 | 格位 | 内容 | 词源 |\n|---|---|---|---|\n| 上排（头部三角度高精度特写） | 左 | 左侧正侧面头像 | KB_02 二节骨相+六节发型发饰 |\n| 上排 | 中 | 正面头像 | KB_02 四节眼部（瞳色记忆点必写） |\n| 上排 | 右 | 右侧正侧面头像 | 同左格（镜像侧发饰走向） |\n| 下排（无头人台服饰三视角） | 正/侧/背 | 等距水平排列无头人台 | KB_03 二节部件剪裁+四件套 |\n\n**裁切用途**：上排任一头像格 → 表情矩阵母版③的\"同一张脸\"验收基准候选 + Inpainting 锁脸参考；下排背格 → 背饰/包带走向唯一高清源。裁切子图不另立资产名，且**须回填 IMG-01 补高清重绘 0.3 后方可使用**（4K 六格裁后单格仅约 1/6 画幅，直用分辨率不足——对齐母版⑧④ 补高清铁律）；垫图指引按\"@资产名 分区板上排中格\"式自然语言引用。\n\n### 4.2 板式B 非人形分区轮转板（指针：KB_06 母版⑩ · R9-20261006-7）\n\n**适用判定**：非人形资产（怪兽/灵宠/机甲/法器）**或**大型道具（有头部结构/形态复杂）——升级 VIS-03 边界 5\"非人形退化三件套\"中的三视图件（形态矩阵保留不变）。\n\n**格位分配表**：\n\n| 区位 | 格位 | 内容 | 词源 |\n|---|---|---|---|\n| 上排（头部三视角特写） | 3/4侧/正/侧 | 头部结构+獠牙/角/眼部等记忆点三要素 | KB_02 四节眼部（活体）+注册表记忆点 |\n| 下排（全身三视角） | 正/侧/背 | 等距排列全身形体+材质 | KB_04 材质词典 |\n| 旁标 | 尺寸槽 | 体长约[X]米/体高约[X]米（跨镜体量一致性依据） | 剧集圣经体型设定 |\n\n**与形态矩阵的关系**：轮转板锁**空间轴**（视角），形态矩阵锁**状态轴**（待机/攻击/受损）——两者正交互补，非替代；非人形资产完整图集＝轮转板⑩ + 形态矩阵 + 特写基准。\n\n### 4.3 板式C 表情矩阵增强格位（指针：KB_06 母版③格位扩展注 · R9-20261006-7）\n\n母版③（3x3 表情矩阵）已覆盖标准九格；本增强仅新增两类**可选格位**替换默认格（不扩格数）：①**wink 单侧闭眼格**（写\"右眼闭合呈眨眼wink状态，左眼睁开\"——单侧动作必须写明左右，防双眼全闭）；②**口型张合格**（写\"嘴唇张开呈O型，齿列微露\"——口型戏高发角色用，供视频口型锚参考）。仍守母版③铁律：只给具体面部动作词，禁抽象情绪词；九格同一张脸。\n\n### 4.4 板式路由决策树\n\n| 资产类型 | 细节焦点/复杂度 | 路由结论 |\n|---|---|---|\n| 人物 | 头部记忆点≥3项并发 或 服饰层次≥3层（复杂度高） | 板式 A 可选（⑨，按需产出） |\n| 人物 | 常规（复杂度未命中） | 维持传统五件套（母版②默认主流，本技能不介入） |\n| 人物 | 表情精度需求（wink/口型戏） | 板式 C 增强（母版③格位扩展） |\n| 非人形（怪兽/灵宠/机甲/法器） | 形体结构+头部记忆点 | 板式 B（⑩）+形态矩阵 |\n| 大型道具 | 头部结构/形态复杂 | 板式 B（⑩） |\n| 常规道具 | 结构展示 | 维持道具两件套（母版⑦） |\n| 兽人/精怪（人格化非人形） | 头部表情+形体双需求 | 板式 B + 上排头部格加人格化表情注记 |\n| 任意资产 | 用户点名/择优需求（不看复杂度） | 备用抽卡模式（4.5） |\n\n### 4.5 备用抽卡模式（R9-20261006-9 立 · 可选，非默认）\n\n**定位**：不看复杂度的**可选项**——任何资产可在《重要资产图片提示词.md》中与正统单视图/三视图**并行**追加一条宫格板 Prompt（母版⑨/⑩/③任一），同批次跑图抽卡择优。\n\n**原理（待实测假设）**：宫格一次生成＝格间同源互锚（同脸同服同画风同光位强制绑定），裁切上排中格（正面头像）可能比单独文生图的主图/三视图更稳——正视图抽卡 3 次不稳时，宫格备选池可能一击命中；此为实战假设，须填复盘占位实测验证后转正（铁律 6）。\n\n**择优规则**：正视图（母版①/②）为**主选产出**，宫格裁切图为**备选池**——两案并跑对比，**裁切格须回填 IMG-01 补高清重绘 0.3 后**方可择优入注册表基准位（六格裁后单格分辨率不足以直入基准位）；未对比前默认正视图为主。**V2 参考图增强（R9-20261006-11）**：宫格 Prompt 垫本角色主图达标图作参考+首句改\"参考图中的人物形象，…\"（官方参考图生图两部式，plat_01 六节 8）——格间同脸率显著提升，主图已锁定时必用；主图未锁定时退纯文生图。\n\n**成本提示**：每追加一条宫格 Prompt＝多一次生成成本，默认不追加；仅正视图连续抽卡 ≥3 次不稳、或用户点名时启用。\n\n## 五、常见错误示范 vs 满分工业级示范\n\n### 对比组：头部细节保留\n\n❌ **Bad Case**：\n> @沈小满 三视图：正面、左侧面、背面三视角等距水平排列，全身完整入画，脸部清晰。\n\n**扣分点**：\"全身完整入画\"= 头部被等比压缩至约 1/8 画幅，浅琥珀瞳色/马尾发绳等记忆点细节全灭；\"脸部清晰\"无机制支撑——这正是板式 A 立法要解决的问题本身。\n\n✅ **Good Case**：\n> 复杂度判定：头部记忆点 3 项并发（浅琥珀瞳+束高马尾黑发绳+右眼下泪痣）命中 → 板式 A 按需产出（传统②仍并行主选，可并跑择优 4.5）：上排三角度头像满分辨率特写（浅琥珀瞳色/柳叶眉/束高马尾黑色发绳逐字入格）+ 下排无头人台正侧背服饰三视角（素青交领襦裙四件套+部件剪裁词）；上排三头像骨相同源、下排同一套服饰、上排与下排为同一角色同一套服饰，格间留白；豆包组图写法+ChatGPT 版式锁。生成后上排中格作表情矩阵\"同一张脸\"验收基准。\n> ——9.X 分放行（G 表+宫格附加核查族双检）。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **兽人/精怪类人格化非人形**：走板式 B，上排头部三格追加人格化表情注记（眉骨情绪/瞳孔收缩）；表情控制需求强时另出形态矩阵加表情维度。\n2. **竖屏（9:16）剧集**：分区板/轮转板总幅仍 1:1（多格板恒用方幅利于格间均质），裁切后单格按 16:9 安全区出（与 IMG-02 宫格裁切规范一致）；首帧直出需求走 VIS-03 ④⑤ 单人参考图，不从分区板裁切直出首帧。\n3. **与场景机位库（R9-20261006-6）的边界**：机位库＝**场景**多机位垫图弹药库（空间轴·可垫图）；本技能板式＝**人物/非人形**设定锁定件（禁垫图）——服务对象、垫图准入相反，严禁混用。\n4. **头部记忆点与服饰记忆点双弱资产**：无显著细节焦点 → 不触发本路由器，维持传统五件套（板式是细节焦点的放大器，不是所有资产的必需品）。\n5. **分区板实测失败回退**：无头人台写法生成不稳（人台长出头/双排比例漂移）→ 回退方案＝母版②传统三视图 + 母版④独立面部特写补头部精度（等效细节覆盖，两张图成本略高）；回退结论填复盘占位触发 EVO-01。"},{"p":"skills/02_visual_director_skills/skill_continuity_axis_guard.md","t":"连续性轴线守卫技能（VIS-04 · 防穿帮守门员）· 工业级完整版","d":"WHAT：场记与连续性监督技能——180度轴线法则校验表、跨镜头左右站位/视线方向/手持道具左右手/战损污渍状态四项核对清单、跨集State Diff快照生成与继承。WHEN：分镜表产出后核查、每集定稿生成快照、下一集开拍前读快照核对、发现穿帮问题时触发。","raw":"# 连续性轴线守卫技能（VIS-04 · 防穿帮守门员）· 工业级完整版\n\n## 一、核心职责与工业级法则（6 条硬核铁律）\n\n1. **轴线半圆铁律**：一场戏确立轴线（人物 A→B 连线或运动方向线）后，本场所有机位必须位于轴线**同一侧半圆**内活动；任何镜位的\"机位\"字段必须能回代到轴线声明，回代失败=疑似越轴，整场退回导演。\n2. **合法越轴三选一铁律**：确需越轴时必须且只能用——①中性镜过渡（正对/背对轴线的骑轴镜）②动作剪辑点越轴（大幅动作顶点帧遮越轴）③主体改写轴线（转身/走动，需一个跟随镜交代）；三种手段之外的越轴一律不批。\n3. **左右站位跨镜恒定铁律**：人物在画面中的左右位置跨镜恒定（对话正反打尤甚）；同场内站位变化必须由剧本显式事件（换位/推开）驱动，并在分镜备注留痕。\n4. **持物手别恒定铁律**：每个道具绑定\"归属人+左右手\"（@焚天断剑=林烬右手）；换手/易主必须写显式过渡动作（抛/递/掉落）；无过渡的换手=穿帮。\n5. **战损只增不减铁律**：服装战损/污渍/发型凌乱按时间单向累积，只有剧本明确事件（更换/治疗/洗澡）才能重置；每处战损按\"部位+程度+左右侧\"三要素登记进快照。\n6. **快照继承放行铁律**：下一集任何提示词引用人物/场景前，必须与最新 State Diff 快照五项全对齐（服装/伤势/持物/位置/情绪刻度+场景时空）——不对齐不准开拍，上报导演回修剧本。\n\n## 二、标准执行 SOP（Step-by-Step）\n\n**Step 1 · 读入**：读 `KB_07` 七节轴线与机位半圆规范；读入分镜总表 14 字段、场次轴线声明表、最新跨集快照。\n\n**Step 2 · 轴线校验**：逐镜把\"机位\"字段回代到所属场次轴线声明——同侧打 ✓；异侧检查该镜\"轴线标记/备注\"列是否有合法越轴三选一记录，有则 ✓（标记\"合法越轴\"），无则 ✗ 记入穿帮上报单。\n\n**Step 3 · 四项核对**：按 4.2 清单逐\"镜号→镜号\"对核对：左右站位 / 视线方向 / 持物手别 / 战损污渍；任何一项冲突记上报单（镜号对+核对项+冲突描述）。\n\n**Step 4 · 时空核对**：逐场次核对时间天气光效（黄昏金橙不得中途变正午）与关键陈设（白雾/灯串在场状态）。\n\n**Step 5 · 生成快照**：本集定稿时按 4.3 模板产出\"本集结束状态快照\"（人物五项表+场景表+道具流向+叙事钩子遗留+音色状态），同步写入 `memory/projects/[剧名]/跨集状态快照_StateDiff.md`（新快照置顶，旧快照归档）。\n\n**Step 6 · 派生登记**：快照中出现的新状态（战损/换装/夜景）→ 同步在《资产注册表.md》派生区登记（如 `@林烬战损`），未登记的派生态禁止上镜。\n\n**Step 7 · 放行判定**：轴线+四项+时空全绿 → 出具\"开拍放行判定\"；有红项 → 穿帮上报单退回导演 R2 修表。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约\n\n| 字段 | 类型 | 必填 | 说明 |\n|---|---|---|---|\n| 分镜总表 | 14字段表 | 是 | VIS-01 产出 |\n| 轴线声明表 | table | 是 | VIS-01 Step2 产出 |\n| 最新快照 | StateDiff | 是 | 上一集留存 |\n| 变更事件清单 | list | 是 | 剧本中的换装/易主/受伤事件 |\n\n### 输出契约（下游：R2 回修 / R5R6 生产放行 / 记忆库）\n\n```yaml\n轴线校验结果:\n  - {场次: A, 镜号范围: 1, 轴线: \"台心—长老席连线\", 结果: \"✓东半圆\", 越轴: \"镜1骑轴俯拍=合法(手段②)\"}\n  - {场次: B, 镜号范围: 2-4, 轴线: \"街道纵深(向右)\", 结果: \"✓南半圆全程\", 越轴: \"无\"}\n四项核对清单:\n  - {对: \"镜2→镜4\", 站位: \"✓母左子右\", 视线: \"✓张三仰视→李梅垂视互为对望\", 手别: \"✓李梅右手抚头\", 战损: \"✓均无伤\"}\n穿帮上报单: []   # 无\nStateDiff快照: {…见4.3…}\n资产注册变更单: {派生新增: [], 摘要更新: []}\n开拍放行判定: \"✅ 放行（轴线/四项/时空 全绿）\"\n```\n\n## 四、专项工具箱\n\n### 4.1 180 度轴线法则校验表（逐镜填写）\n\n| 镜号 | 场次轴线定义 | 本镜机位描述 | 回代判定 | 越轴手段（仅异侧时填） | 结论 |\n|---|---|---|---|---|---|\n| 2 | B场·街道纵深线（行进向右） | 平视前侧45°跟拍 | 同侧·南半圆 | —— | ✓ |\n| 3 | 同上 | 固定平视（摊位侧） | 同侧·南半圆 | —— | ✓ |\n| 4 | 同上 | 越@张三右肩拍@李梅 | 同侧·南半圆 | —— | ✓ |\n| 1 | A场·台心—长老席连线 | 低角度仰拍（东） | 同侧·东半圆 | —— | ✓ |\n\n### 4.2-b 新增核对项三项（R9-20261006 · 群组/关系锚/多机位）\n\n| 核对项 | 核对内容 | 数据源 | 常见穿帮 |\n|---|---|---|---|\n| 群组阵型绑定 | 同阵营群组（使者/守卫等 ≥2 人）Prompt 是否含相对距离约束词（\"并肩紧凑而立\"）+全局坐标锚（\"共同居于中轴线\"） | AGENTS 补丁1 | 只写数量→随机离散 |\n| 同框关系锚在场 | 主要人物双人首帧是否展开高差量化+服色关系+气质关系（注册表「同框关系锚」小节） | 资产注册表 | 高差/服色关系跨镜漂移 |\n| 双机位基准注册 | 核心场景是否登记俯瞰全景+平视/低机位双基准图；分镜垫图与镜头机位是否同机位（冲突即按补丁7 卸载） | 注册表场景区+补丁7 | 俯瞰图垫平视镜→缝合怪 |\n\n### 4.2 四项跨镜核对清单（\"镜号→镜号\"逐对过）\n\n| 核对项 | 核对内容 | 数据源 | 常见穿帮 |\n|---|---|---|---|\n| ① 左右站位 | 人物画面左右位置跨镜恒定 | 分镜表机位+构图字段 | 正反打拍反（左右互换） |\n| ② 视线方向 | A 视线出画方向 = B 所在方位；对望镜互为反向 | 秒级节点+备注 | A 向左看 B 却在左侧画内（应 B 在画外左） |\n| ③ 持物手别 | 道具归属人+左右手跨镜一致；换手有显式过渡 | 道具卡+分镜备注 | 镑剑忽左忽右；摸头手左右横跳 |\n| ④ 战损污渍 | 部位+程度+左右侧按时间单向累积 | StateDiff+变更事件 | 上镜已伤下镜痊愈；血痕左右脸跳 |\n\n**执行格式**：`{对: \"镜N→镜N+1\", 站位: ✓/✗, 视线: ✓/✗, 手别: ✓/✗, 战损: ✓/✗}`，任一 ✗ 触发上报。\n\n### 4.3 State Diff 快照模板（集末五表）\n\n```markdown\n### 本集结束状态快照（Episode State Snapshot）\n**人物状态**：\n| @人物 | 服装 | 伤势/妆容 | 情绪刻度(1-10) | 持有道具 | 位置 |\n**场景状态**：\n| @场景 | 时间 | 天气/光效 | 关键陈设变化 |\n**道具流向**：[道具→归属人+手别+状态]\n**叙事钩子遗留（供下集承接）**：[≥1条]\n**音色状态**：[克隆方案有无异常]\n```\n\n### 4.4 开拍前继承核对流程（下集 Step 0）\n\n1. 读最新快照五表 → 2. 逐人物比对：服装/伤势/持物/位置/情绪 → 3. 逐场景比对：时间天气陈设 → 4. 全对齐出具放行；任一冲突 → 上报 R2 回修剧本（改剧本比穿帮重拍便宜一百倍）。\n\n## 五、常见错误示范 vs 满分工业级示范\n\n### 对比组 1：轴线校验\n\n❌ **Bad Case**：\n> 镜头2 从母亲背后拍摄母子前行；镜头3 切到母亲面前迎面拍摄母子走来；镜头4 越孩子肩膀拍母亲。\n\n**扣分点**：镜2\"背后拍\"与镜3\"迎面拍\"分属轴线两侧且无任何合法越轴手段记录——观众方向感瞬间崩塌（孩子从妈妈右边跳到左边）。\n\n✅ **Good Case**：\n> 轴线声明：B场·街道纵深线（行进向右），机位锁南侧半圆。镜2 前侧 45°跟拍（南）→ 镜3 摊位侧固定（南）→ 镜4 越 @张三 右肩拍 @李梅（南）。如确需迎面镜：先插镜 2.5 骑轴正俯（手段①中性镜），再接迎面镜——校验表标注\"镜2.5=合法越轴过渡\"。\n\n### 对比组 2：战损与持物跨集继承\n\n❌ **Bad Case（穿帮三连）**：\n> 第2集开拍：@林烬 衣袍整洁立于台心（第1集结尾明明已\"左肩撕裂渗血\"）；@焚天断剑 挂在左侧剑鞘（注册表锁右手持/背负剑柄自左肩探出——剑柄方向反了）；@张三 手里多了个没来由的气球（第1集道具流向=无）。\n\n**扣分点**：三个穿帮全是\"没读快照直接开拍\"——战损重置违反铁律5、剑柄方向违反道具卡、气球无来源违反道具流向。\n\n✅ **Good Case**：\n> 第2集 Step0 继承核对：读快照\"左肩衣袍撕裂渗血、剑收入背负（剑柄自左肩后探出）、张三无持物\"→ 剧本如有\"疗伤\"事件则先登记 `@林烬疗后`（浅色绷带+撕裂仍在）派生资产再开拍；无事件则所有镜头 Prompt 引用 `@林烬战损` 状态词——五项全对齐，出具放行。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **运动轴线切换（人物转身改行进方向）**：轴线随之改写——必须在\"转身镜\"的分镜备注写明\"本镜后轴线改写为 X\"，校验表分前后两段分别回代；缺失改写记录按穿帮处理。\n2. **多轴线同场（三人以上对话）**：以\"主要对手戏二人连线\"为主动轴，第三人以\"插入镜+越轴三选一\"处理；禁止三人各自成轴（观众无法建立空间感）。\n3. **跨集快照冲突（下集剧本与快照矛盾）**：一律剧本让步回修；若剧本不可改（档期原因），走\"显式过渡事件\"补拍一镜（换装镜/疗伤镜）抹平差异并更新快照。\n4. **平行蒙太奇双线并行**：两线各自独立轴线与快照，剪辑顺序不影响各自连续性；快照按线分别记录，合并进同一 StateDiff 文档的两个分区。\n5. **回忆/闪回镜头**：闪回内使用\"回忆时点快照\"（历史版本），非当前快照——StateDiff 文档保留历史归档区供回溯引用；闪回镜在分镜备注标\"闪回@第N集状态\"。\n6. **长镜头接力段的场记**：尾帧接力（VID-02）的接力镜视为同场次延续，站位/手别以尾帧实际画面为准回填核对清单——发现尾帧画面已漂移时，以快照登记值为准重出尾帧。"},{"p":"skills/02_visual_director_skills/skill_director_storyboard.md","t":"导演分镜拆解技能（VIS-01）· 工业级完整版","d":"WHAT：导演分镜拆解技能——剧本场次切镜、14字段标准分镜表填写、S/A/B算力分级判定、16:9与9:16构图互转、Cutaway救场缓冲镜规划。WHEN：剧本定稿进入视觉开发阶段，或用户要求'拆分镜/镜头分级/竖屏改造/加缓冲镜/定轴线'时触发。","raw":"# 导演分镜拆解技能（VIS-01）· 工业级完整版\n\n## 一、核心职责与工业级法则（9 条硬核铁律）\n\n1. **主动作链递进铁律（R9-20261006-5 重订·一镜到底优先）**：一场戏默认一镜到底——主动作**先后递进链**（走→停→说）+运镜连续渐变（推→摇）合法；非法项仅剩：**同时并发**多主动作（『边走边说边转身』三并发必崩，崩坏04/03）与机位跳切。拆镜仅在例外条件触发（高危交互/正反打/跨空间/超时长/降本）。\n2. **一镜一机位基点铁律（R9-20261006-5 重订）**：单条 Prompt 一个机位**基点**——镜头内缓推/上摇/横移**连续渐变**与焦点转移合法（一镜到底核心语言）；『先全景再特写』式**跳切**仍非法——跳切发生在剪辑台上，不发生在 Prompt 里。\n3. **时长来自声画先行铁律**：台词镜头的时长由 NARR-03 精算结果决定（铺垫+台词+余韵），导演无权为了节奏硬改——要改节奏就改语速档重算或拆镜。\n4. **S/A/B 强制标注铁律**：每镜必须标注算力等级且通过 4.2 判定标准打分（≥3 项命中 S）；S 级镜头数量每集 ≤15%（约每 6~7 镜 1 个 S），防止算力预算爆炸。\n5. **Cutaway 配额铁律**：每 2~3 个主镜头必须规划 1 个 1~2 秒缓冲镜（特写插入/反应镜），全集 Cutaway 占比 ≥15%；缓冲镜默认 B 级（零视频生成，静态图+关键帧）。\n6. **轴线先行铁律**：拆镜前先写场次轴线声明（谁在左、运动方向、机位半圆侧），分镜表每镜的机位字段必须能回代到轴线声明上；场记 R4 核查不通过的表整场退回。\n7. **高危物理交互·蒙太奇B计划铁律（Montage Fallback Plan B · R9-20261005-18 新增）**：凡分镜涉及 **①双人近身肢体抓握/推搡/反扣/夺物**、**②微小道具（细针/戒指/丹药）在动态中交接或脱落**、**③单镜 ≥3 个紧凑动作节拍**——同时触发崩坏 01（手部融化）+ 崩坏 07（肢体穿模）+ 崩坏 12（道具变形）的高危区——除提供主方案外，**必须在该分镜下方同步附带一套【零崩坏·3切快剪蒙太奇B计划】**（拆解公式见 4.5）；当主方案抽卡 2 轮出现穿模/手崩时，直接启用 B 计划零废片成片。分镜表高危镜加注 `⚠️B计划已备` 标记，R7 语义智检第二项（单镜动作纯度）对此强制核查——高危镜无 B 计划＝打回。\n8. **文转镜信息守恒与无损膨胀铁律（R9-20261006 · R2 法则技能层镜像）**：拆解分镜时对剧本做\"关键节点提取\"——情感铺垫（外婆的菜谱）/情节推动（手机短信）类关键道具与动作 **100% 转化为独立视觉分镜**，严禁为减镜数删减叙事链条；多个连续动作（攥拳→擦眼镜→开门）按【无损膨胀】拆为独立单镜 Prompt，用分镜数量换剧本细节 100% 还原；\"一镜一主动作+一镜一机位\"（铁律 1/2）即【单镜时空唯一性】的技能层形态——I2V 无剪辑能力，单 Prompt 只描述一个 3-5 秒连续物理时空。\n9. **接力段分镜标记铁律（R9-20261006 · 与铁律 8 的边界）**：剧本明写\"一镜到底/高度连贯跟随\"的段落，分镜表改用**接力段镜号**（`02R-A/B/C`+接力链声明），交 VID-02 走一镜到底三段管线（多图参考+尾帧接力+R8 拼接）；独立叙事细节拆分用独立镜号（无损膨胀），伪一镜到底用 R 段镜号——该接力的被拆散、该拆散的被强塞双向都是废片。\n\n## 二、标准执行 SOP（Step-by-Step）\n\n**Step 1 · 查表读入**：读 `KB_07`（构图词典+多人空间分区+竖屏法则+轴线规范）、`KB_11`（景别/机位/运镜词典+幅度控制）；读入 NARR-01 情绪波形表与 NARR-03 台词精算表。\n\n**Step 2 · 切场次+立轴线**：按\"场景×时空单元\"切场次；每场填轴线声明表（人物左右站位/运动方向线/机位半圆），写进分镜总说明。\n\n**Step 3 · 逐场拆镜**：按铁律 1/2/3 拆镜；台词镜先填\"时长\"列（来自精算），动作镜按 5s 上限（单镜 ≤5s，需更长走尾帧接力并标注）。\n\n**Step 4 · 逐镜分级**：按 4.2 判定标准给每镜打 S/A/B；统计 S 级占比（≤15%）与 B 级占比（≥20% 为健康，降本）。\n\n**Step 5 · 画幅适配**：16:9 集按 KB_07 三节构图；9:16 集逐镜过 4.3 转换表重写构图字段（禁横向铺开）。\n\n**Step 6 · 排 Cutaway**：在对话场次与长动作场次按铁律 5 插入缓冲镜，标注供 R8 做 J/L-Cut 的切入点秒位。\n\n**Step 7 · 填 14 字段总表并自检**：逐镜 14 字段无空缺；交 R4 场记核查轴线与连续性，通过后交 R5/R6 生产。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约\n\n| 字段 | 类型 | 必填 | 说明 |\n|---|---|---|---|\n| 单集剧本 | text | 是 | 含台词与 NARR-03 精算结果 |\n| 画幅制式 | enum | 是 | 16:9 / 9:16 |\n| 情绪波形表 | table | 是 | NARR-01 产出（爆点秒位对齐 S 级） |\n| @资产清单 | list | 是 | 必须在资产注册表内 |\n\n### 输出契约（下游：R4 场记 / R5 生图 / R6 视频 / R8 剪辑）\n\n#### 14 字段标准分镜工作表（R2 内部交棒字段 · 供 R4/R5/R6/R8 生产管理用）\n\n> **双表关系声明（R9-20261005-9）**：本 14 字段表是 R2 拆解镜头时的**内部工作字段**（轴线、Cutaway、备注等生产管理信息在此维护，向下游交棒）；**产出文档落版一律用 4.0 节《行业标准 7 列分镜脚本表》**（顶层《全量分镜脚本总表》HTML 大表 + 镜首《单镜脚本卡》）。两表字段映射：#1+#8→7列表\"镜号/等级\"列；#3+#4→\"景别/机位\"列；#5+#6→\"运镜\"与\"画面内容\"列；#11→\"画面内容\"列的 `△ 按秒分段\"；#10→\"台词/旁白OS\"列；#12/#13/#14→\"音效/BGM/剪辑卡点\"列与镜级备注行。\n\n| # | 字段 | 填写规范（词源） | 示例 |\n|---|---|---|---|\n| 1 | 镜号 | 全集唯一递增 | 镜头3 |\n| 2 | 场次 | 场次号+场次名 | 场次B·母子买莽莽 |\n| 3 | 景别 | KB_11 一节八档 | 近景过肩 |\n| 4 | 机位 | KB_11 二节（含轴线回代） | 越@张三右肩拍@李梅（南侧半圆） |\n| 5 | 构图 | KB_07 一/三/四节 | 竖屏式紧凑过肩，主体占左2/3 |\n| 6 | 运镜 | KB_11 三节1种+幅度词 | 固定镜头·微幅 |\n| 7 | 时长 | NARR-03 精算或动作预估 | 4秒 |\n| 8 | 等级 | S/A/B（4.2 判定） | A级 |\n| 9 | @资产清单 | 注册表内纯中文名 | @李梅@张三@光大街边 |\n| 10 | 台词轨别+时长 | 轨别【画面口型/旁白OS·不张嘴/纯静默】+NARR-03 精算时长+音频ID（音频可替换原则·补丁4：台词照写+嘴唇自然开合，成片音频后期TTS轨替换，原生音频仅占位参考） | 【画面口型】李梅台词（4s 含铺垫余韵，音频ID 李梅_E01_03.wav） |\n| 11 | 秒级节点摘要 | 0.5s 网格 | [00-0.4s]抬手抚头；[0.4-3.6s]说台词；[3.6-4s]轻拍收势 |\n| 12 | Cutaway标记 | 是/否+用途 | 否（本镜为被缓冲主镜） |\n| 13 | 轴线标记 | 回代场次轴线声明 | B场·南半圆·不越轴 |\n| 14 | 备注 | 交棒特殊说明 | 手部腕部截断入画防崩；戏眼=说\"等爸爸\"眼神先亮后垂 |\n\n## 四、专项工具箱\n\n### 4.0 行业标准 7 列分镜脚本表（R9-20261005-9 · 总表与单镜脚本卡统一格式）\n\n影视/短剧行业通用 **7 列标准分镜脚本表**，既用于分集文档顶部《全量分镜脚本总表》（`<details>` 折叠区内 HTML 大表），也用于每个 `## 镜 XX` 标题正下方的《单镜脚本卡》（Markdown 表，不折叠）：\n\n| 列 | 定义与填写规范 |\n|---|---|\n| 镜号/等级 | `镜 01`＋`(S/A/B级)`，与 S/A/B 算力分级联动 |\n| 景别/机位 | 景别（大特写/特写/近景/中景/全景/远景）＋机位（平视/仰拍/俯拍/过肩/微距），换行并列 |\n| 运镜 | 固定/推近/拉远/横移/跟拍/缓推＋幅度词，**一镜一种**（V9 铁律） |\n| 时长 | 秒数（对齐 NARR-03 声画精算） |\n| 画面内容（△ 动作与调度） | **按秒分段以 `△ 0-1s`／`△ 1-3s` 开头**，写清主体动作、空间调度、神态反应（多主体含空间分区）；每段一个主动作 |\n| 台词/旁白OS（含音频ID） | 轨别标注【画面口型】/【旁白OS·不张嘴】/【纯静默】＋角色（情绪·语速·重音@秒位）＋台词原文＋`音频ID.wav`（NARR-03 精算口径）；多人必配口型排他锁说明 |\n| 音效/BGM/剪辑卡点 | 【音效】拟声清单＋【BGM】情绪/留白/卡点＋【剪辑】变速/转场/特效建议（联动 R8，用 KB_12 真实菜单名） |\n\n**配套文学剧本格式铁律（R1 交接层）**：剧本正文场头=`第X场｜场景｜时段｜内/外`＋`出场人物`行；动作/画面行一律 **`△`** 开头；台词行=`角色（情绪·语速）：\"台词\"`；**正文严禁 `@` 符号、状态后缀与摄影机术语**（资产绑定与镜头语言留在分镜层）。\n\n### 4.1 轴线声明表模板\n\n| 场次 | 轴线定义 | 人物站位 | 机位半圆 | 合法越轴手段（如有） |\n|---|---|---|---|---|\n| 场次B | 街道纵深线（行进向右） | @李梅左 / @张三右 | 南侧半圆全镜位 | 无（对话紧凑不越轴） |\n| 场次A | 比武台中心—长老席连线 | @林烬台心面向北 | 东侧半圆 | 骑轴俯拍1镜（大爆点揭示） |\n\n### 4.2 S/A/B 算力分级判定标准（命中 ≥3 项判 S；命中 1~2 项判 A；0 项判 B）\n\n| 判定项 | S 级信号 | A 级信号 | B 级信号 |\n|---|---|---|---|\n| 时间位置 | 黄金前3秒 / 集尾大爆点 | 中段常规推进 | 过渡/缓冲 |\n| 动作幅度 | 大幅肢体+特效（剑气/罡风） | 行走/转头/抬手 | 静止或微动 |\n| 视觉奇观 | 奇观元素（光柱/变身/坍塌） | 常规场景动态 | 特写静物/空镜 |\n| 情绪刻度 | 波形表刻度 ≥9 的爆点 | 5~8 推进段 | ≤4 铺垫段 |\n| 多资产复合 | ≥3 资产同框互动 | 2 资产 | 1 资产或纯空镜 |\n| 生成路线 | 首尾帧双锚+顶级模型 | 首帧单锚 I2V | 静态图+Lip-Sync+剪映关键帧 |\n\n### 4.3 16:9 ↔ 9:16 构图转换表（逐项对照改写\"构图\"字段）\n\n| 构图维度 | 16:9 横屏写法 | 9:16 竖屏强制转换写法 |\n|---|---|---|\n| 空间铺开 | 宗门广场横向铺开、建筑群水平展开 | 前中后大纵深叠压（前景白雾虚化/中景主体/远景楼宇虚化） |\n| 双人对话 | 左右三分位并排+横向留白 | 上下高低机位对角线，或竖屏紧凑过肩（面部占画面高 ≥1/3） |\n| 人群场面 | 环形人群横向展开两翼 | 人群上下叠压虚化为背景层，主体贯穿对角线 |\n| 单人立像 | 中心构图+左右对称建筑 | 人物从头到脚沿对角线贯穿，头顶留 1/6 天空 |\n| 运动方向 | 左右横移跟随 | 纵深跟拍（迎面/背跟），位移≤1 身位 |\n| 字幕安全区 | 居下即可 | 底部 15% 预留，构图下沿避开关键信息 |\n| 特写 | 常规 1:1 取景 | 面部占高 ≥1/3，发际到下巴居中上 2/3 |\n\n### 4.4 Cutaway 剪辑救场特写插入规则\n\n| 规则项 | 标准 |\n|---|---|\n| 频率 | 每 2~3 个主镜头 1 个；对话场 ≥2 个/场 |\n| 时长 | 1~2 秒（1.5s 黄金值） |\n| 类型库 | 手部特写（握拳/攥衣角）、道具特写（剑柄/怀表/食物热气）、倾听者眼神微特写、环境反应（白雾/灯串/落叶）、脚步特写 |\n| 等级与生成路线 | 默认 B 级：超高清静态图 + 剪映关键帧缓推 + 粒子特效图层（零视频算力零崩坏面） |\n| 声画错位 | 每个缓冲镜标注 J-Cut/L-Cut 切入秒点（如\"镜3 尾音延入镜4 前 0.5s\"），交 R8 执行 |\n| 视线闭环 | 承接上一镜人物视线投向（他看什么→切什么），禁止无动机插入 |\n\n### 4.5 高危复杂交互镜头 → 3切快剪蒙太奇B计划拆解公式（R9-20261005-18 新增 · 铁律 7 执行标准）\n\n> **适用触发**：铁律 7 三条件任一命中（双人近身抓握/推搡/反扣/夺物 ｜ 微小道具动态交接或脱落 ｜ 单镜 ≥3 紧凑动作节拍）。主方案照常编写；B 计划 = 把\"一次高危物理交互\"拆成 **三个零接触生成单元**，每一切都规避 AI 生成端最弱的\"双人肢体接触帧\"。\n\n| 切镜 | 时长/等级 | 内容与生成路线 | 防崩原理 |\n|---|---|---|---|\n| **切镜 A（起势神态特写）** | 1.0~1.5s · A/B级 | 单人面部/眼神骤变 + 闪避起手（如\"睫毛猛颤睁眼、杏眼里怯懦涤净成锐利\"）——只拍一个人的一张脸，规避双人肢体接触 | 单主体=零串脸零穿模；眼神戏正是爽点情绪源 |\n| **切镜 B（接触点定格微距）** | 1.0~1.5s · B级（静态图推镜） | 仅拍局部接触定格画面（如\"一只素青衣袖的手如铁钳扣住一只杏黄衣袖的手腕\"／\"粗针脱手半空微距\"），**不生成复杂视频动态**——超高清静态图 + 剪映关键帧急推（100%→115%）+ 强 Foley 音效卡点（金属叮响/衣料急擦） | 定格帧无动态=零穿模；微距局部=手部结构最简；强音效补足打击感 |\n| **切镜 C（结果反应与台词中景）** | 2.0~3.0s · A级 | 直接切入动作完成后的结果态（受挫方跌坐捂腕闭唇瞪视 + 主导方立定开口说台词，挂口型排他锁）——跳过过程拍结果 | 两人已分离无接触=零穿模；结果态+台词=叙事信息不丢 |\n\n**成片规则**：A→B→C 依快剪节奏拼接（B 处配 0.2 倍变速+顿帧更佳）；三切合计 4~6s 与原主方案时长对齐，剧本情绪曲线零损失。**启用条件**：主方案抽卡 2 轮出现穿模/手崩/道具变形即切 B 计划；B 计划三切各自独立过 R7 门禁（A/C 走视频表，B 走生图+B级降本豁免）。\n\n## 五、常见错误示范 vs 满分工业级示范\n\n### 对比组 1：分镜表行\n\n❌ **Bad Case（14 字段残缺+三违）**：\n> 镜头2：母子俩在街上边走边聊，孩子说要吃莽莽，妈妈安慰他，先来个全景再切妈妈特写再切孩子反应，大概五六秒，温馨一点。\n\n**扣分点**：无场次/轴线/等级/资产引用；\"边走边聊+安慰\"≥2 主动作（V3 否决）；\"全景→特写→反应\"三个机位塞一镜（V3 否决）；\"五六秒/温馨一点\"不可执行。\n\n✅ **Good Case（14 字段满配）**：\n> 镜头2｜场次B·母子买莽莽｜远景｜平视前侧45°跟拍（南侧半圆）｜三分法+街道纵深引导线｜镜头缓慢推近·微幅｜3秒｜A级｜@李梅@张三@光大街边｜张三台词（口型开合，精算2.2s+铺垫0.8s）｜[00-0.8s]拽衣角仰头；[0.8-3.0s]张嘴说\"妈妈，我要吃莽莽\"；李梅闭嘴锁｜Cutaway否｜B场·南半圆·不越轴｜备注：张三瞟向画外右摊位，为镜3白雾特写埋视线\n\n### 对比组 2：9:16 竖屏转换\n\n❌ **Bad Case（横屏思维直灌竖屏）**：\n> 竖屏镜头1：@李梅和@张三并排在画面左右两侧走向镜头，街道美食摊从左到右一字排开，全景展示繁华的夜市全貌。\n\n**扣分点**：并排+左右站位在 9:16 中把两人压成两个细条；\"从左到右一字排开\"= 横向铺开，防崩补丁2 明令禁用；夜市全貌在竖屏里=主体过小。\n\n✅ **Good Case（纵深叠压转换）**：\n> 竖屏镜头1：前中后大纵深叠压——前景馄饨摊白雾与灯串虚化占下 1/4，中景母子牵手主体清晰（@李梅后半步居中偏左、@张三前半步居中偏右，上下半身入画），远景居民楼暖窗虚化占上 1/5；镜头纵深缓推·微幅；3 秒 A 级。构图下沿留 15% 字幕安全区。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **合法越轴三法**（必须三选一并写进轴线声明\"合法越轴手段\"列）：①中性镜过渡（正对/背对轴线的骑轴镜）；②动作剪辑点越轴（大幅动作顶点帧遮越轴，如挥剑转身瞬间）；③主体自身改变轴线（人物转身/走动改写轴线，需 1 个跟随镜交代）。\n2. **群像戏（≥4 人同框）**：禁止全人群像生成——拆为\"主体近景+人群虚化背景层+2~3 个反应 Cutaway\"三段式；人群只做剪影/虚化，绝给清晰人脸（多人串脸崩坏06 高危）。\n3. **一镜到底长镜头需求**：单镜 5s 上限不变，改走一镜到底拆解重组法（VID-02/铁律 9）：在分镜表标注接力段镜号（02R-A/B/C）与接力链声明；**接力链调和铁律（R9-20261006）**：有中帧图像锚（多图参考，IMG-02 产出）≤3 段；无中帧锚的纯尾帧裸链 ≤2 段，第 3 段起重锚全量首帧。\n4. **双线切换集（苍穹→烟火）**：切换点两镜必须同等级（S 接 S 或 A 接 A），且转场类型在备注列预声明（闪白/闪黑给 R8），防止情绪断层。\n5. **补拍救场（用户反馈某镜废片）**：优先把废镜降级为 Cutaway 蒙太奇素材；若必须重拍，等级最多升一级（A→S），禁止 B 级直接升 S（算力浪费）。\n6. **画幅中途变更（横转竖分发）**：不重拆镜——按 4.3 转换表逐行改写\"构图\"字段+复核\"运镜\"字段（横移改纵深），其余 12 字段不动（保持连续性资产不变）。"},{"p":"skills/02_visual_director_skills/skill_storyboard_master.md","t":"分镜图总控技能（SBM-01 · R9-20261007-14 立）· 工业级完整版","d":"WHAT：分镜图总控技能——视频生成之前的分镜图生产总关卡：镜组四模式路由（多分镜宫格组/单帧+尾帧锚/接力链/多图参考组）、一致性链设计（参考图分配+锚点传递+同源策略）、长视频分段策略（按叙事设计、按上限分段）、IMG-02 铁律9 三查执法。WHEN：R2 分镜表定稿后、R5 逐镜生图前强制触发；用户问'这些镜头怎么出图/怎么保持一致/长镜头怎么办/先出哪些图'时触发（R9-20261007-14 立·立法背景=黑名单 38 分镜图环节无总控 Owner）。","raw":"# 分镜图总控技能（SBM-01 · R9-20261007-14 立）· 工业级完整版\n\n## 一、核心职责与工业级法则（7 条硬核铁律）\n\n1. **生产单前置铁律**：本技能产出的《分镜图生产单》是 R5 逐镜生图的**唯一合法开工令**——生产单未产出且未经 R7 核验前，R5 不得开始逐镜生图（防\"逐镜独立抽卡\"旧范式回潮；IMG-02 铁律6 的执法前置位，黑名单 38 立法背景）。\n2. **镜组优先铁律**：镜组划分先于单镜评估——先按\"同场次×构图变化×机位族\"聚类分组，再对每组路由四模式；**默认倾向成组生产**（同源宫格/共享锚链的跨镜一致性远高于独立抽卡，且抽卡预算减半以上），单镜独立生产是例外且须说明理由。\n3. **一致性链先行铁律**：每组必须先写\"一致性链声明\"（锚点传递路径：参考图分配→组内同源→跨组锚复用）再写 Prompt——没有一致性链的生产单=未完成（KB_14 二节六法选型）。\n4. **「按叙事设计、按上限分段」铁律（长视频宪法）**：设计层时长完全服从叙事（10s/20s/30s 自由设计——未来模型适配长视频是趋势，框架定位长视频提示词生成）；生产层按平台**实测**上限自动切接力链分段：**分段公式＝镜时长÷平台上限，余数进位=段数；段间锚＝首尾帧（相邻段）+中帧锚（≥3 段链）**（KB_14 三节）。平台上限=生产参数，**不是设计约束**——禁止为迁就上限砍叙事时长；上限须实测校准一次（证据位阶铁律），校准后入注册表平台档案。\n5. **四模式互斥铁律**：一个镜组只路由一个主模式（A/B/C/D），辅助技法（尾帧锚/机位库垫图）作为组内增强挂载——禁止双主模式混跑（宫格组内又塞接力链=管线打架）。\n6. **证据位阶执法铁律**：本技能引用的一切平台能力（时长上限/参考图数量/宫格支持度）按 AGENTS 〇节9 位阶标注——用户实测＞本项目档案＞官方文档＞外部教程；KB_14 平台矩阵中未经本项目实测的条目只作参考值，生产单引用时标注\"待实测\"。\n7. **三查执法铁律**：生产单落盘前自跑 IMG-02 铁律9 三查（①S 级双锚齐备②超上限镜有分段方案③运镜渐变已评估或显式标注\"固定=叙事选择\"）——任一不过自打回，R7 复核再验。\n\n## 二、标准执行 SOP（Step-by-Step）\n\n**Step 1 · 读入**：R2 分镜表全镜（镜号/场次/景别机位/等级/时长/@资产）+ 资产图集就位状态 + 目标平台实测上限（未实测则标注并预排校准镜）。\n\n**Step 2 · 镜组划分**：按\"同场次 × 构图变化小 × 同机位族/同景别族\"聚类（跨场/景别跳级大的镜独立成组）；输出镜组清单（组号+镜号+共同特征）。\n\n**Step 3 · 组模式路由**（决策树见 4.1）：\n- 同场 ≥3 连续镜+构图变化小 → **A 多分镜宫格组**（2x2~5x4 规格，IMG-02 4.3 V2 极简模板）；\n- S 级关键镜（黄金前3秒/奇观/高潮）→ **B 单帧+尾帧锚**（首尾双锚独立精出，IMG-02 4.1/4.2）；\n- 单镜时长＞平台上限 → **C 接力链**（分段公式切 N 段，首尾帧+中帧锚，R6 拆解重组法联动）；\n- 长镜内多机位渐变/多主体轨迹 → **D 多图参考组**（机位库子图作轨迹关键帧锚，R6 多图参考联动）。\n\n**Step 4 · 一致性链设计**：逐组写参考图分配表（图1=人物主图@资产/图2=场景参考·机位库对应格或空镜基准/图3=前镜尾帧或共享锚图）+锚点传递路径声明（组内同源方式/跨组锚复用点）。\n\n**Step 5 · 分段方案**：对超上限镜按分段公式出段数与段间锚清单（中帧锚按\"首帧同源改三点\"预列）。\n\n**Step 6 · 三查自检**（铁律7）→ 产出《分镜图生产单》交 R7 核验 → ≥9.0 放行 → 下发 R5 执行指令（每组一条执行指令：模式+参考图位+宫格 Prompt 指针/单镜 Prompt 指针+抽卡预算）。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约\n\n| 字段 | 类型 | 必填 | 说明 |\n|---|---|---|---|\n| R2 分镜表 | 7列/14字段全镜 | 是 | 含等级/时长/景别机位/@资产 |\n| 资产就位状态 | list | 是 | 人物主图/场景机位库/空镜基准（缺项先回 Gate 2） |\n| 平台时长上限 | number | 是 | 须实测值；未实测标\"待校准\"并预排校准镜 |\n| 画幅 | enum | 是 | 16:9 / 9:16 |\n\n### 输出契约（下游：R5 生图执行 / R7 核验 / R6 视频生产）\n\n```yaml\n分镜图生产单:\n  - 组号: G1\n    镜号: [镜01, 镜01-A, 镜01-B]\n    组模式: A 多分镜宫格组(3镜,2x2)\n    参考图分配: {图1: \"@沈小满主图\", 图2: \"资产-11B 机位库·门钉侧面格\", 图3: \"无\"}\n    一致性链: \"组内同源宫格(连续瞬间)；跨组锚=G2 复用本组尾帧视角\"\n    分段方案: \"无(均≤上限)\"\n    抽卡预算: \"1-2 次/组\"\n  - 组号: G2\n    镜号: [镜02]\n    组模式: B 单帧+尾帧锚(S级双锚)\n    参考图分配: {图1: \"@沈小满主图\", 图2: \"资产-11B 机位库·低角度仰拍格\"}\n    一致性链: \"首尾同源改三点；尾帧复用 G1 收尾视角\"\n    分段方案: \"10s÷5s=2段, 段间锚=首尾帧+中帧(动作中间态预列)\"\n    抽卡预算: \"3-5 次\"\n三查核验单: {双锚: \"S级镜5/5齐\", 时长: \"超限镜2镜均有分段方案\", 运镜: \"正反打组固定=叙事选择已标注\"}\nR5执行指令: [\"G1: 宫格Prompt指针=IMG-02 4.3 V2模板填空\", \"G2: 首帧/尾帧Prompt指针=分镜表镜02区块\"]\n```\n\n## 四、专项工具箱\n\n### 4.1 镜组四模式路由决策树\n\n| 条件 | 路由 | 规格与联动 |\n|---|---|---|\n| 同场 ≥3 连续镜 + 构图变化小 + 时长均 ≤上限 | **A 多分镜宫格组** | 2x2(≤4镜)/3x3(≤9镜)/5x4(≤20镜·KB_14 四节20镜实例)；IMG-02 4.3 V2 极简模板（开放列表/零量化锚/≤150字）；垫机位库格或空镜基准+人物主图多图融合；成图后看图回填格位表 |\n| S 级关键镜（任何条件） | **B 单帧+尾帧锚** | 首帧+尾帧双锚独立精出（IMG-02 4.1/4.2 同源改三点）；宫格组内的 S 级镜=组内出首帧+独立补尾帧（A+B 复合，B 为主导） |\n| 单镜时长＞平台上限 | **C 接力链** | 分段公式：时长÷上限余数进位=段数；≤2 段=纯尾帧接力；≥3 段=必须中帧锚（R6 一镜到底拆解重组法/VID-02 接力链）；段间锚图先行产出 |\n| 长镜内运镜渐变跨机位 / 多主体轨迹控制 | **D 多图参考组** | 机位库子图作多图参考关键帧锚（起点格+终点格，长 trajectory 加中点格）；R6 首尾帧/多图参考技法；一镜到底长镜首选 |\n\n### 4.2 一致性六法选型矩阵（KB_14 二节精编·证据位阶标注）\n\n| 方法 | 适用 | 位阶/实测状态 |\n|---|---|---|\n| ①统一资产 DNA（人物主图/三视图/机位库先行锁定） | 一切生产的前提 | 本项目已实测✓（资产-01/04 基准锁定流程） |\n| ②多分镜宫格一次生成 | 同场连续镜组 | 本项目实测中（E02 正门组登记待跑）；外部验证✓（20镜宫格实例·KB_14 四节） |\n| ③首尾帧链（前镜尾帧=后镜首帧/描述前镜末状态） | 相邻镜衔接/接力段间锚 | 本项目部分实测（E01 02R 接力）；外部验证✓ |\n| ④关键帧续写（分段视频提示词+关键帧） | 超上限长镜/整集串联 | 外部资料（即梦实测案例 12-15s 拼 50s）·未经本项目实测 |\n| ⑤多素材参考（多图融合·参考图数量按平台） | 复杂多主体/多机位轨迹 | 本项目已实测✓（豆包多图融合人物+场景）；50张上限系即梦外部资料 |\n| ⑥局部重绘/编辑修补（单镜穿帮就位修图） | 抽卡仍不达标的残镜 | 外部资料（即梦局部编辑）·未经本项目实测 |\n\n### 4.3 分段公式与段间锚规范（KB_14 三节执法版）\n\n`段数 = ⌈镜时长 ÷ 平台实测上限⌉`（余数进位）；段长按叙事节拍切分（不机械平分——切在动作节拍/台词句读处）；段间锚：2 段链=尾帧接力（A 段尾帧高清修复后作 B 段首帧底图）；≥3 段链=加中帧锚（动作中间态/机位中间位/光影中间档，\"首帧同源改三点\"产出）；**全链同光源同色温同画风**（改三点法保证）。上限校准：新平台首用先跑一个校准镜（建议取 S 级长镜）实测最大可出时长，校准值入注册表平台档案——此后按值分段，不再逐镜试探。\n\n## 五、常见错误示范 vs 满分工业级示范\n\n### 对比组：E02 正门系（黑名单 38 教材）\n\n❌ **Bad Case**：拿到 18 镜分镜表 → 直接逐镜出首帧 Prompt → 逐镜独立抽卡垫同一张全景图 → 背景/机位/构图三失控（实测：背景锁死正门+机位错配+18 镜×3-5 抽卡预算爆炸）。\n**扣分点**：无镜组划分（9 个可成组镜全部独立跑）、无一致性链（垫图一刀切）、S 级无双锚、逐镜抽卡成本最大化——正是 R10 立法前 的真实翻车现场。\n\n✅ **Good Case**：R2 分镜表定稿 → R10 生产单：G1[镜01/01-A/01-B]=A 宫格组（垫机位库门钉格+小满主图，一次 3 帧同源）｜G2[镜02]=B 双锚（首帧+尾帧改三点）｜G3[镜05/06/07]=A 宫格组（正反打连续瞬间）｜镜04=单帧（构图跳变大独立）｜超上限镜分段方案齐备｜三查通过 → R5 按组执行 → 抽卡预算从 ~60 次压到 ~20 次。\n> ——生产单 9.X 分放行（R7 核验+三查单双签）。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **与 R2 的边界**：R2 产分镜表（拍什么），R10 产分镜图生产单（怎么出图保一致）——R10 不改分镜；发现分镜层一致性问题（如相邻镜机位跳变无叙事理由）退回 R2 附修改建议。\n2. **与 IMG-02 的边界**：IMG-02=单镜前置资源策划技法库（模板/铁律的权威源），R10=总控调度层（镜组路由/一致性链/分段的总决策）——R10 引用 IMG-02 模板产出生产单，不复制母版（防版本漂移，同 VIS-03 4.2 去重铁律）。\n3. **与 R6 的边界**：C/D 模式的段间锚设计与 R6 接力链/多图参考技法联动——R10 定\"分几段+锚在哪\"，R6 定\"视频 Prompt 怎么写\"。\n4. **资产未就位**：机位库/人物主图缺项 → 生产单退回 Gate 2 补资产（不带着缺项跑宫格组——参考图缺位=一致性链断链）。\n5. **平台上限漂移**（实测 10s 实际只能 8s）→ 重跑分段公式更新段数，校准值刷新注册表平台档案（单点校准全局生效）。\n6. **竖屏（9:16）剧集**：宫格组改 1x4 竖排条或 2x2 留竖向安全区（IMG-02 六节3 同款）；分段公式不变。"}]},{"g":"🖼️ 生图技法","items":[{"p":"skills/03_image_gen_skills/skill_img_pre_resource_planner.md","t":"分镜前置资源策划技能（IMG-02）· 工业级完整版","d":"WHAT：分镜前置图片资源策划技能——首帧基准图、尾帧/中帧关键帧（一镜到底三段管线）、场景双机位基准图（R3 契约）、场景机位库宫格查询（R9-20261006-6）、2x2/3x3多宫格连贯分镜垫图的策划流程与编译模板。WHEN：每个分镜进入视频提示词生产前由本技能策划前置资源；用户问'这个镜头要先出什么图/怎么做垫图/中帧怎么出'时触发。","raw":"# 分镜前置资源策划技能（IMG-02）· 工业级完整版\n\n## 一、核心职责与工业级法则（8 条硬核铁律·R9-20261006 增第 8 条）\n\n1. **等级决定资源铁律**：S 级=首帧基准图+**尾帧设计图**双锚；A 级=首帧基准图单锚；B 级=超高清静态图 1 张（不生成视频，后期关键帧缓推动态）。等级与资源错配（S 级只出首帧 / B 级出双图）一律退回重规划。\n2. **首帧即首秒铁律**：首帧基准图的景别/机位/构图必须与分镜表逐字对齐（视频第一秒就是这个画面），人物挂单人参考图（立绘/面部特写），三视图整图禁止入位（VIS-03 防呆）。\n3. **同源双图铁律**：首尾帧两张图必须同光源、同色温、同画风——尾帧只改变\"动作顶点状态+运镜推进量\"，其余逐字复用首帧 Prompt；可灵的运镜幅度匹配前提就是两图差异可控。\n4. **动态范围防护铁律**：I2V 首帧禁止强逆光/大面积高光/纯剪影（崩坏10 视频过爆放大器）；光学层必写\"高光不过曝、保留面部细节\"。\n5. **成对出图铁律**：过肩正反打的两张首帧必须同批次成对生成（同 Prompt 仅换越肩方向），防对白正反打色温跳变；单张抽卡合格后再补拍另一张=废片率高发区。\n6. **垫图省抽卡铁律**：同场次 ≥3 个连续镜头且构图变化小 → 必须评估多宫格垫图方案（一次生成锁构图延续性，逐格裁切为首帧），而非逐镜独立抽卡。\n7. **生图策略行与场景锚点铁律**（R9-20261005 新增）：每条首帧/尾帧 Prompt 落盘时必须同步附\"**生图策略**\"行——底图@来源（I2I 权重）｜人物参考@来源（参考位权重）｜特殊处置（无锚理由/首帧级资产直出回填等）；已注册场景必须以\"@场景名\"锚点进入 Prompt 文本（不得降级为纯自然语言描写），并以该场景空镜基准/全景图作 I2I 底图——首帧级新场景除外，须显式注明\"文生图直出后回填注册表\"。缺生图策略行或 @场景锚点丢失 → 视为资源策划未完成，SOP Step 6 送检前自查退回，禁止交 R7。\n\n8. **双机位基准与中帧关键帧铁律（R9-20261006 · R3 契约/KB_08 五节承诺落地）**：①核心场景（主角居所/主城街道等高频场景）策划时必须配套**双机位基准图**——俯瞰全景基准（宏观环境）+平视/低机位基准（人物对话与特写垫图），防补丁7 垫图透视冲突；已建**场景机位库**（R9-20261006-6）的场景，分镜机位与两基准图冲突时**先查机位库**——命中近似机位子图即垫图（裁切图须已补高清），无匹配才卸垫图盲抽；②一镜到底三段管线（R 段接力）的前置资源必须含**中帧关键帧**（首帧同源改三点法产出，改三点=动作中间态/机位中间位/光影中间档），中帧锚是三段接力的成立前提（VID-02 接力链调和铁律）。\n9. **一镜到底资源执法三查铁律（R9-20261006-13 立 · 20261007-14 执法主体升级：R10 分镜图总控为三查 Owner，R5 执行自查，R7 复核——立法背景：E02 四个 S 级镜全部漏尾帧、10 秒镜建立在未实测的平台假设上被全链路放行——One-Take First 只进了分镜表没进资源清单，黑名单 38）**：每集资源策划落盘前强制三查（**R10 生产单三查核验单主责**+R5 执行自查+R7 复核，任一不过打回）——**①S 级双锚查**：每个 S 级镜必须\"首帧基准图+尾帧设计图\"双锚齐备（4.2 同源改三点法），缺尾帧=资源未完成禁止送检；**②时长假设查**：超过平台常见上限（5s）的一镜到底镜，必须先实测该平台时长上限再定\"单镜直出 vs R 段接力\"——禁止以\"平台应该支持\"跳过实测（证据位阶铁律·AGENTS 〇节9），接力镜须预列中帧锚产出计划；**③运镜渐变评估查**：S/A 级镜的视频运镜禁默认单运镜（\"固定/固定微推\"保守式为旧防崩哲学残余，黑名单 139 已废止）——每镜评估\"缓推→上摇/焦点转移（前景道具→面部）/跟随移动\"等连续渐变是否适配本镜叙事，不适配者显式标注\"固定机位=叙事选择\"留痕。**附：机位库双用途（R9-20261006-13）**——场景机位库子图除作垫图弹药外，可作一镜到底长镜的多图参考关键帧锚（R6 首尾帧/多图参考技法的轨迹锚点：镜头在长镜内从机位A视角渐变至机位B视角，用两机位图锁运动轨迹）。\n\n## 二、标准执行 SOP（Step-by-Step）\n\n**Step 1 · 读入定资源**：读分镜表行（等级/景别/机位/构图/时长/@资产/台词）；按铁律 1 定资源清单（S 双图 / A 单图 / B 静态）。\n\n**Step 2 · 路由技法**：过 IMG-01 决策树得技法组合（底图选择+锁脸手段+ControlNet 需求），写\"生图技巧策划说明\"。\n\n**Step 3 · 编译首帧**：按 `KB_08` 生图全量公式八层编译（主体/服饰/动作/空间/环境/光学/镜头/画风+规格），景别机位构图逐字对齐分镜表；多人镜头挂 KB_07 空间分区句式。\n\n**Step 4 · 编译尾帧**（仅 S 级）：复制首帧 Prompt，只改——动作顶点描述（剑指前方定格/相拥瞬间）、运镜推进后的景别变化、可强化的氛围（光柱落台/雨落），光源色温逐字不动。\n\n**Step 5 · 垫图评估**（多镜连拍时）：先查该场景机位库子图可垫性（补丁7 冲突镜按 R9-20261006-6 查询顺序）；再按 4.3 流程策划 2x2/3x3 连贯分镜宫格垫图——列\"格位分配表\"（每格对应镜号与构图），编译宫格 Prompt。\n\n**Step 6 · 一致性保障与送检**：写同源保障措施（成对出图/尾帧复用句/宫格裁切规范）；全部 Prompt 送 R7 评分（G 表），≥9.0 交用户跑图，并留\"交 R6 备注\"（首帧即视频第一秒/尾帧用于可灵锚定）。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约\n\n| 字段 | 类型 | 必填 | 示例 |\n|---|---|---|---|\n| 分镜表行 | 14字段 | 是 | 镜头2（远景缓推 3s A级 母子…） |\n| 视频技法预选 | enum | 是 | 首帧I2V（即梦原生音频） |\n| @资产图集 | list | 是 | 含单人立绘/面部特写/空镜 |\n| 画幅 | enum | 是 | 16:9 |\n\n### 输出契约（下游：R5 执行跑图 / R6 视频生产 / R7 评分）\n\n```yaml\n资源清单: [{类型: \"首帧基准图\", 数量: 1, 用途: \"即梦I2V首帧+素材位\"}, {类型: \"尾帧设计图\", 数量: 0, 用途: \"—(A级不需)\"}]\n生图技巧策划说明: \"图生图(@光大街边空镜底图,重绘0.4) + IP-Adapter双参考(0.6/0.6) + OpenPose 0.7双骨架(母直站/子仰头拽衣角)；色温锁黄昏金橙与底图一致\"\n前置生图Prompt: [\"```prompt 黄昏@光大街边母子行进首帧基准图：画面左侧三分之一为…```\"]\n同源一致性保障: \"本镜与镜4过肩成对同批出图；若独立出图,镜4复用本镜光学层与环境层逐字\"\nR7送检状态: \"9.3分放行\"\n交R6备注: \"首帧即视频第0秒画面；素材位1=@李梅立绘 位2=@张三立绘 位3=本空镜\"\n```\n\n## 四、专项工具箱\n\n### 4.1 首帧基准图编译模板（八层全量）\n\n```prompt\n[场景与时段]@[场景名][镜头动作语境]首帧基准图：[空间分区句式(多人必填)——左侧三分之一为@人物A(身高+服装主色)，右侧三分之二为@人物B(身高差+服装主色)，间距与互动关系]；[主体姿态与手部状态(五指并拢等)]；[环境三层：前景虚化元素/中景主体动作/远景虚化延伸]；[光学层：色温+光型+「高光不过曝保留面部细节」]；[镜头层：景别+机位+构图(逐字对齐分镜表)]；@画风锁+[线别追加缀]，[画幅]，4K\n```\n\n**配套生图策略行格式**（铁律 7：紧跟每条首帧 Prompt 落盘，缺项=策划未完成）：\n\n```markdown\n- **生图策略**：底图＝@场景名 空镜基准（I2I 0.4）｜人物参考＝@人物A 主图（0.65）＋@人物B 主图（0.6）｜特殊处置＝无\n```\n\n### 4.2 尾帧设计图编译模板（S 级 · 同源改三点）\n\n```prompt\n（复制对应首帧Prompt，仅修改以下三层，其余逐字保留：）\n① 动作层 → 动作顶点定格描述（如\"右手持@焚天断剑斜指前方、衣袂上扬定格\"）\n② 镜头层 → 运镜推进后的景别/角度微变（如\"低角度仰拍推近后半段\"）\n③ 氛围层 → 可强化的戏剧元素（如\"雷云更暗、三道光柱落台、人群剪影后倾\"）\n光源、色温、人物骨相与服装层：逐字不动（可灵幅度匹配前提）\n```\n\n### 4.3 多宫格连贯分镜垫图策划流程与模板\n\n**适用判定**：同场次 ≥3 连续镜 + 构图变化小（同机位族/同景别族）+ 时长均 ≤5s → 用宫格垫图；跨场次/景别跳级大（远→特写）不适用。\n\n**策划流程**：\n1. **格位分配表**：把镜号映射进宫格（2x2 四格 / 3x3 九格），标注每格的\"构图差异增量\"（人物位置/朝向/前景元素微调）。\n2. **统一基准**：所有格共享——场景三层、光源色温、画风锁；仅变——格内主体姿态/朝向/局部前景。\n3. **编译宫格 Prompt**（模板如下）。\n4. **逐格裁切**：宫格图生成后按格裁切为独立首帧（4K 宫格裁后单格 ≥1080p 达标）；裁切图回填 IMG-01（补高清重绘 0.3）。\n5. **一致性红利**：同源宫格裁切的连续首帧，视频生成后镜头间空间延续性显著高于独立抽卡。\n\n**宫格模板（2x2 · V2 极简式·R9-20261006-12 连坐修订，复用 plat_01 六节 10 宫格极简版式铁律——复测④教训连坐：旧\"左上格[镜N]…\"式格位绑定+长模板与本技能同病）**：\n```prompt\n[媒介前置]；2x2组图，参考图中的@[场景名]同一机位族的四个连续瞬间——[瞬间A主体状态4~12字]、[瞬间B增量]、[瞬间C增量]、[瞬间D增量]（每条只写主体姿态/朝向/前景微调，禁量化构图锚）；四格同光源同画风，风格与参考图一致；16:9，4K\n```\n*执行要点（V2 修订）：①**机位/瞬间用开放式顿号列表、禁绑格位编号**（格位绑定实测无效——模型做不了标签→格位映射）；②**文字只管\"版式+瞬间状态\"**——场景/光源/画风交参考图（垫机位库子图或场景空镜基准）；③人物一致性另挂人物参考图（多图融合：图1=场景参考·机位库对应格或空镜基准，图2=人物主图）；④**成图后按实际内容回填格位分配表**（哪格是哪镜看图登记，剪辑顺序由镜号决定，不赖格位）；⑤全文 ≤150 字。*\n\n**格位分配表格式（成图后登记，非 Prompt 绑定）**：\n| 格位（成图后看图填） | 镜号 | 构图增量 |\n|---|---|---|\n| 看图登记 | 镜5 | 基准：母左子右中景行走 |\n| 看图登记 | 镜6 | +推近半档，子转头仰视 |\n| 看图登记 | 镜7 | +前景灯串入画一角 |\n| 看图登记 | 镜8 | +母低头含笑，子停下 |\n\n**与场景机位库宫格的边界（R9-20261006-6 · 两套宫格禁止混用模板）＋双层管线（R9-20261006-12 立）**：本节宫格的格位＝**时刻**（同机位族连续瞬间，时间轴，服务连续分镜首帧）；场景机位库宫格（VIS-03 三件套③ / KB_06 母版⑧）的格位＝**机位**（同场景不同视角，空间轴，服务跨分镜垫图弹药库）——前者格间变\"动作增量\"，后者格间变\"视角\"且全格同刻同光位、无人物。**两套为双层串联管线而非二选一**：先建机位库（空间轴·生产资料）→ 连续镜组分镜宫格**垫机位库对应子图**生首帧（时间轴·同源构图延续）→ 逐格裁切→I2V。垫图查询顺序（补丁7 冲突镜）：先查机位库子图 → 命中即垫（裁切图须已补高清 0.3）→ 未命中才卸场景垫图纯文本盲抽＋负向机位约束。**执法注记（R9-20261006-12）**：铁律 6 为强制评估项——同场次 ≥3 连续镜且构图变化小（如 E02 正门系过肩组/正反打组）未评估分镜宫格直接逐镜抽卡＝流程违规打回。\n\n## 五、常见错误示范 vs 满分工业级示范\n\n### 对比组 1：首帧策划\n\n❌ **Bad Case**：\n> 镜头4 前置资源：生成一张李梅在街上的图片，最好是黄昏，好看一点，人物清晰。平台随便，出来直接用。\n\n**扣分点**：无空间分区（过肩构图谁前谁后？）；无\"高光不过曝\"防护（黄昏逆光高危）；无参考图挂载（人物必漂移）；无同源保障（与镜2色温跳变）；\"好看一点/随便\"不可验收。\n\n✅ **Good Case**：\n> **策划说明**：图生图（@光大街边空镜底图，重绘 0.4）+ IP-Adapter（@李梅立绘 0.7 锁脸）+ OpenPose 0.6（垂眸+右手抬至胸前骨架）；与镜 2 成对同批出图防色温跳变。\n> **Prompt**：`过肩镜头首帧基准图：越过孩童@张三的右肩与后脑（画面右下角虚化剪影，天蓝卫衣帽可见）拍摄成年女性@李梅：@李梅位于画面左侧三分之二，[骨相+套装]…右手刚抬至胸前…黄昏金橙色温柔和平射光，高光不过曝保留面部细节…@画风锁+暖金橙主调黄昏柔焦光晕，16:9，4K`——9.3 分放行。\n\n### 对比组 2：多宫格垫图\n\n❌ **Bad Case**：\n> 镜5~8 每个镜头单独生成一张首帧图，各自写一遍完整提示词，多抽几次卡总能对上。\n\n**扣分点**：四张独立抽卡=四套独立空间解读，镜头间墙面/摊位/灯串位置各画各的，剪辑时空间跳跃；抽卡成本 4 倍；违反铁律 6。\n\n✅ **Good Case**：\n> 判定镜 5~8 同场次同机位族（中景行走+微推）→ 2x2 宫格垫图：左上基准（母左子右行走）→ 右上（+推近半档子转头）→ 左下（+前景灯串一角）→ 右下（+母低头子停步）；统一黄昏金橙与三层环境；生成后逐格裁切+补高清 0.3 → 四张同源首帧，空间延续性一次锁定。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **首帧含 ≥3 人**：禁止单图直出（串脸高危）——拆\"主双人首帧（分区句式）+ 第三人后期贴入（剪映画中画）\"或改分镜为反应 Cutaway 递补第三人存在感。\n2. **首尾帧差异过大（S 级大幅动作）**：两图差异超出\"改三点\"范围（如全景→特写）→ 放弃首尾帧锚定，改\"首帧 I2V + 尾帧弃用 + 剪辑切镜\"方案，并通知 VID-02 改技法预选。\n3. **竖屏（9:16）首帧**：宫格垫图改用\"1x4 竖排条\"（各格 9:16）或 2x2 正方形内留竖向安全区；首帧单独出图时画幅字段写 9:16 且构图过 VIS-01 的 4.3 转换表。\n4. **B 级静态图的高清要求**：静态图承担\"放大 108% 缓推\"余量，分辨率必须 4K（裁切后局部仍 ≥1080p）；不足时 IMG-01 补高清（重绘 0.3）。\n5. **场景无空镜基准图**（新场景漏产）：先回 VIS-03 补两件套再策划前置资源——禁止\"拿别人镜的首帧当底图\"（误差累积漂移）。\n6. **接力镜（Tail-to-Head）的首帧**：不新出图——直接取上一镜生成视频尾帧 + 高清修复/Inpainting 微调（改衣摆角度/光斑位置），本技能只出\"尾帧修复指令单\"交 IMG-01 执行。"},{"p":"skills/03_image_gen_skills/skill_img_tech_router.md","t":"生图技法路由器（IMG-01）· 工业级完整版","d":"WHAT：生图技法路由器——图生图、ControlNet(OpenPose/Depth/Canny/Lineart)、灰度图光影、LoRA权重、Inpainting局部重绘、多宫格垫图的决策树与参数区间表。WHEN：任何生图任务（资产图/首帧图/修图）在写Prompt前先经本路由器选技法；用户问'怎么改图/怎么保持一致/怎么控姿态'时触发。","raw":"# 生图技法路由器（IMG-01）· 工业级完整版\n\n## 一、核心职责与工业级法则（6 条硬核铁律）\n\n1. **先路由后写词铁律**：任何生图任务在写 Prompt 前必须先过本路由决策树确定技法组合——技法决定参考图挂载与参数，参数决定 Prompt 里哪些层要写哪些层省略（图生图低重绘时静态层可简写）。\n2. **重绘幅度安全铁律**：图生图重绘幅度（denoising strength）锁定 0.3~0.45 区间——低于 0.3 改不动，高于 0.45 换脸漂移；要大改就换技法（ControlNet），不要硬拉重绘。\n3. **保人优先铁律**：涉及已注册人物的任务，锁脸手段（LoRA 0.6~0.85 / PuLID 0.6~0.8 / IP-Adapter 0.5~0.7）优先级高于一切风格参数；LoRA 严禁 >0.9（画风僵硬+\"塑胶脸\"）。\n4. **单一控制源铁律**：ControlNet 同类控制只用一个源（姿态就用 OpenPose，别再叠 Canny 钉轮廓除非显式说明权重减半）；多控制叠加时权重各 ×0.7 且总和等效 ≤1.2，互相打架=两头不执行。\n5. **最小干预铁律**：只改局部必须用 Inpainting（蒙版圈选，羽化 20~30px，重绘限蒙版内）；用整图重绘修一只手=全图重新抽卡，已过审部分全部作废。\n6. **两轮升级铁律**：同一技法改词两轮仍翻车 → 立即升级技法级（见决策树第 5 层失败预案），禁止第三轮同法重试——时间成本高于换法成本。\n\n## 二、标准执行 SOP（Step-by-Step）\n\n**Step 1 · 查表读入**：读 `KB_06` 六节锁脸规范（参考图链与权重）、`KB_09` 四节修正工作流（翻车对号入座）；读入任务输入四要素（目标/保留/改变/参考图清单）。\n\n**Step 2 · 过决策树**：按 4.1 决策树五问逐层路由，得出技法组合结论（可多技法叠加，按铁律 4 控制权重）。\n\n**Step 3 · 填参数区间表**：按 4.2 参数区间表逐项给出数值与理由（如\"IP-Adapter 0.7——过肩近景保脸优先级最高\"）。\n\n**Step 4 · 列参考图挂载清单**：明确每张参考图（@资产图集内的面部特写/全身立绘/空镜底图）挂到哪个节点、什么权重——**只允许单人参考图入位，三视图/矩阵整图禁止**（VIS-03 防呆铁律）。\n\n**Step 5 · 配负向词包**：从 `KB_09` 三节标准负向包按任务裁剪（生图/视频分用），随 Prompt 交付。\n\n**Step 6 · 交平台与预案**：给出平台落地建议（豆包 Seedream 4.0 / ComfyUI Flux 分工）与失败预案（两轮翻车后的升级路线）。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约\n\n| 字段 | 类型 | 必填 | 示例 |\n|---|---|---|---|\n| 出图目标 | enum | 是 | 分镜首帧基准图 |\n| 保留项 | list | 是 | 人物脸×2、场景空间 |\n| 改变项 | list | 是 | 光影（平光→黄昏）、站位（双骨架） |\n| 参考图清单 | list | 是 | @李梅立绘/@张三立绘/@光大街边空镜 |\n| 目标平台 | enum | 否 | 豆包 Seedream 4.0 |\n\n### 输出契约（下游：IMG-02 / R5 执行 / plat_* 落地）\n\n```yaml\n路由结论: \"图生图(空镜底图,重绘0.4) + IP-Adapter双参考(李梅0.6/张三0.6) + ControlNet-OpenPose 0.7(双骨架)\"\n参数区间表:\n  - {项: \"图生图重绘\", 值: 0.40, 区间: \"0.3~0.45\", 理由: \"保留空镜空间结构,只注入人物与光\"}\n  - {项: \"IP-Adapter\", 值: \"0.6/0.6\", 区间: \"0.5~0.7\", 理由: \"双人对称保脸,单边过高致另一人串脸\"}\n  - {项: \"OpenPose\", 值: 0.7, 区间: \"0.6~0.8\", 理由: \"钉'母站子仰头'骨架,防姿态漂移\"}\n参考图挂载清单: [{图: \"@李梅全身立绘\", 节点: \"IP-Adapter-A\", 权重: 0.6}, {图: \"@光大街边空镜\", 节点: \"图生图底图\", —}]\n负向词包: \"多人融合, 手指粘连, 成人比例孩童, 高光过曝, 文字, 水印\"\n平台落地: \"豆包Seedream 4.0(空间排布强)或ComfyUI Flux(需严格双锁脸时)\"\n失败预案: \"两轮翻车→骨架改手摆+Depth 0.6钉纵深；仍败→拆两镜单人对拍+剪辑合成\"\n```\n\n## 四、专项工具箱\n\n### 4.1 技法路由决策树（五问五层）\n\n```text\nQ1 要不要动\"形\"？（姿态/构图/空间结构）\n ├─ 动形 → Q1a 什么形？\n │   ├─ 姿态/动作 → ControlNet-OpenPose（0.6~0.8）【骨架图先行】\n │   ├─ 空间纵深/机位 → ControlNet-Depth（0.5~0.7）【深度图先行】\n │   └─ 轮廓/边缘（改材质不改形）→ ControlNet-Canny/Lineart（0.5~0.7）\n └─ 不动形，只改\"色/光/质\" → Q2\nQ2 要不要保\"人\"？（已注册人物入画）\n ├─ 保人 → 锁脸三选一：角色LoRA（0.6~0.85）＞PuLID（0.6~0.8，Flux/SD系）＞IP-Adapter（0.5~0.7，挂单人立绘/面部特写）\n └─ 不保人（纯场景/道具）→ 直接进 Q3\nQ3 只改一小块？（换手/去光影/换天/改局部道具）\n ├─ 是 → Inpainting（蒙版圈选，羽化20~30px，重绘仅限蒙版内0.4~0.5）\n └─ 否 → Q4\nQ4 要不要先控\"明暗布局\"再上色？\n ├─ 是 → 灰度图二段式（灰度草图定明暗→上色段重绘0.35~0.45）\n └─ 否 → 图生图（0.3~0.45）或文生图直出\nQ5 翻车了吗？（同法改词两轮仍废）\n └─ 是 → 升级路线：改词 → 换控制源(OpenPose↔Depth) → 加锁脸权重+0.05 → 拆单主体分图 → 降级B级静态图+剪映动效\n```\n\n### 4.2 参数区间总表（核实版基线）\n\n| 技法/参数 | 安全区间 | 越界后果 | 适用场景 |\n|---|---|---|---|\n| 图生图重绘幅度 | 0.3~0.45 | <0.3 改不动 / >0.45 换脸漂移 | 微调光影/场景，人物已在底图 |\n| ControlNet-OpenPose | 0.6~0.8 | <0.6 姿态不执行 / >0.8 肢体僵直 | 控姿态/双人站位骨架 |\n| ControlNet-Depth | 0.5~0.7 | >0.7 画面糊成深度图 | 钉空间纵深/多主体前后层次 |\n| ControlNet-Canny/Lineart | 0.5~0.7 | >0.7 边缘生硬描边感 | 改材质不改形（换装/换色） |\n| 灰度图二段式 | 灰度→上色重绘 0.35~0.45 | 上色段过高破坏明暗布局 | 强设计感光影构图 |\n| 角色 LoRA 权重 | 0.6~0.85 | >0.9 画风僵硬塑胶脸 | 角色专属长相复现 |\n| PuLID（Flux/SD） | 0.6~0.8 | >0.8 表情锁死 | 人脸 ID 严格锁定 |\n| IP-Adapter | 0.5~0.7 | >0.7 风格污染串脸 | 单人立绘/面部特写参考注入 |\n| Inpainting 羽化 | 20~30px | <20 蒙版硬边 / >30 改出圈 | 局部修补（手/疤/光影残留） |\n| 多控制叠加 | 各×0.7，总和等效≤1.2 | 打架=两头不执行 | Pose+Depth 复合 |\n\n### 4.3 技法×场景速查矩阵\n\n| 任务 | 首选组合 | 参数速记 |\n|---|---|---|\n| 资产三视图 | 文生图 / Flux+Lineart 0.6 | KB_06 词组+英文串 |\n| 人物换装不换脸 | Canny 0.6 + LoRA 0.7 | 蒙版可省（全身换） |\n| 首帧基准图（有人有景） | I2I 空镜底图 0.4 + IP-Adapter 0.6~0.7 | 单人参考入位 |\n| 双人首帧 | I2I 0.4 + 双 IP-Adapter 0.6/0.6 + OpenPose 0.7 | 骨架手摆先行 |\n| 只修手部/去高光 | Inpainting 羽化 25px 重绘 0.45 | 蒙版内限定 |\n| 同场连拍多首帧 | 多宫格垫图（IMG-02） | 2x2 逐格裁切 |\n| 强光影构图海报 | 灰度二段式 | 上色 0.4 |\n\n## 五、常见错误示范 vs 满分工业级示范\n\n### 对比组 1：改光影任务路由\n\n❌ **Bad Case**：\n> 任务：把已过审的 @光大街边 母子首帧从白天改成黄昏。做法：重新文生图一张黄昏母子街景，提示词完整重写一遍。\n\n**扣分点**：文生图重出=人物/构图全部重新抽卡，已过审资产作废（违反最小干预）；无锁脸手段，母子必漂移（崩坏09）。\n\n✅ **Good Case**：\n> 路由：Q1 不动形 → Q2 保人 → Q3 非局部 → Q4 否 → **图生图（原首帧为底，重绘 0.35）+ IP-Adapter 双参考（@李梅立绘 0.6 / @张三立绘 0.6）**；Prompt 仅改光学层（\"黄昏金橙平射光，高光不过曝\"）+空间层逐字复用。产出与原图人物一致、仅色温切换。\n\n### 对比组 2：控姿态任务路由\n\n❌ **Bad Case**：\n> 任务：让 @林烬 从\"负剑静立\"改成\"抬剑指前方\"。做法：图生图重绘拉到 0.7 强度硬改。\n\n**扣分点**：0.7 重绘越安全区间（铁律2）——脸和衣服全部重新生成，等于换人；大幅姿态变化必须走骨架控制。\n\n✅ **Good Case**：\n> 路由：Q1 动形（姿态）→ **ControlNet-OpenPose 0.75（手摆\"抬剑指前\"骨架图）+ PuLID 0.7（@林烬面部特写）+ Canny 0.5×0.7（保服装轮廓）**；原图为底图重绘 0.4。产出姿态精准、脸服同源。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **双人 ControlNet 骨架重叠打架**：OpenPose 双人骨架先分层（骨架A/B 分离渲染再合并）；仍打架则 Depth 0.6 整体钉纵深 + 单人 OpenPose 只控主体、配角靠 Prompt 分区句式约束。\n2. **参考图互相污染（人物参考与画风参考打架）**：砍掉画风参考（画风交给 @画风锁 文字层）；IP-Adapter 只留人物——参考图越多，每张权重越被稀释串色。\n3. **无底图无参考的全新资产**：决策树从 Q1 走完直接文生图，但必须挂 KB_06/KB_08 编译模板与负向包；产出后立刻走\"裁切→单人参考图\"流程反哺图集。\n4. **平台不支持 ControlNet（豆包等在线端）**：降级方案——\"参考图多图融合 + Prompt 空间分区句式 + 抽卡 3~5 次人工选优\"；需要骨架精控的镜头转 ComfyUI 执行。\n5. **LoRA 与 IP-Adapter 同时可用时**：有角色 LoRA 用 LoRA（0.7），IP-Adapter 留给服装/道具参考——同源功能不双挂，权重打架。\n6. **修图连环套（改了 A 处又想改 B 处）**：禁止多次 Inpainting 叠加（画质衰减累积）；回到上一层重路由一次成型，或接受 A 处结果只修 B。"}]},{"g":"🎥 生视频技法","items":[{"p":"skills/04_video_gen_skills/skill_vid_method_selector.md","t":"视频技法选择器（VID-02）· 工业级完整版","d":"WHAT：视频生成技法选择器——首帧I2V、首尾帧过渡、多图@资产融合、尾帧截取接力长镜头(Tail-to-Head)四大技法的适用场景判定与操作指南。WHEN：分镜进入视频生产前选技法、用户要求'长镜头/无缝接力/多图融合/首尾帧控制'时触发。","raw":"# 视频技法选择器（VID-02）· 工业级完整版\n\n## 一、核心职责与工业级法则（6 条硬核铁律）\n\n1. **等级路由铁律**：S 级（大幅动作/奇观）→ 可灵首尾帧优先；A 级（常规）→ 首帧 I2V；B 级（对白反应/空镜）→ **不生成视频**（静态图+剪映关键帧缓推；台词音频后期 TTS 轨替换）。等级与技法错配（S 级裸 I2V 硬抽 / B 级上视频模型）= 算力浪费或质量不足，双向退回。\n2. **幅度匹配铁律**（可灵核心）：运镜与动作幅度必须匹配首尾帧画面差异——差异大写大幅（快速/急速），差异小写\"缓慢\"；错配的直接后果是**运镜指令不执行**（可灵实测）。\n3. **接力链调和铁律（R9-20261006 升级·一镜到底拆解重组法）**：尾帧接力长镜头分两档——**有中帧图像锚（多图参考 Keyframe Interpolation，中帧由 IMG-02 首帧同源改三点产出）≤3 段（A/B/C，总 ≤15 秒）**；**无中帧锚的纯尾帧裸链 ≤2 段，第 3 段必须重锚全量首帧**——误差累积漂移是接力段的固有税，裸链第 3 段的脸已经\"不是同一个人\"（崩坏09）；中帧锚正是三段管线抵消误差累积的成立前提。\n4. **素材位克制铁律**：多图参考融合以\"人物 1~2 位+场景 1 位+道具 1 位\"为宜（≤4）；把 50 个素材位塞满=权重互相稀释串色，参考越多每张越没用。\n5. **音频可替换铁律（R9-20261005-2）**：选型不再绑定口型模式——对白镜头按画面质量选平台（原生音频仅占位参考）；成片音频一律后期轨：静音原轨+TTS 导入+手动对齐（AI 对口型可选）。旧\"模式A/B 平台对齐\"规则废止。\n6. **备选即预案铁律**：每次选型必须同时给出备选技法与触发降级条件（\"若可灵首尾帧两轮废片 → 降级为即梦多图参考+首帧I2V\"）——没有预案的选型在废片面前是裸奔。\n\n## 二、标准执行 SOP（Step-by-Step）\n\n**Step 1 · 读入**：读分镜表行（等级/时长/动作幅度/资产数/台词+模式）+ 前置资源就位状态 + 相邻镜信息 + 平台清单。\n\n**Step 2 · 过决策树**：按 4.1 决策树判定主技法与备选技法。\n\n**Step 3 · 定平台**：按技法×平台适配（4.2 表）选平台与模型，写推荐理由（引用 `memory/global/权威工作流与影视知识库.md` 三节选型路由）。\n\n**Step 4 · 声明接力链**（长镜头时）：`镜A（5s·首尾帧）→ 尾帧F1 → 修复/微调 → 镜B（5s·接力I2V）`，标注每段锚点策略（镜B锚点压至 1 词）。\n\n**Step 5 · 出操作指南**：按 4.3 四大技法操作指南摘取本镜执行要点（步骤清单），联动备注给 VID-01（锚点压缩指令/一致性行/负向包）。\n\n**Step 6 · 送检闭环**：技法结论随差分 Prompt 一并交 R7；废片两轮 → 启动备选技法并记录到复盘占位。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约\n\n| 字段 | 类型 | 必填 | 说明 |\n|---|---|---|---|\n| 分镜表行 | 14字段 | 是 | 重点：等级/幅度/资产数/台词模式 |\n| 前置资源 | list | 是 | 首帧✓/尾帧✓/垫图 |\n| 相邻镜信息 | text | 接力时 | \"上一镜镜A可截尾帧\" |\n| 平台清单 | list | 否 | 默认全平台可选 |\n\n### 输出契约（下游：VID-01 编译 / plat_* 落地 / R7）\n\n```yaml\n技法结论: {主: \"首尾帧控制(可灵)\", 备: \"多图参考融合(即梦2.5)\", 降级条件: \"可灵两轮废片→切备选\"}\n平台推荐: {平台: \"可灵\", 模型: \"标准版\", 理由: \"首尾帧锚定强项+3D时空注意力物理规律,适合S级取剑大幅动作\"}\n接力链: \"无\"\n操作指南要点: [\"上传首帧图1(负剑静立)+尾帧图2(剑指定格)\", \"Prompt按官方四段式:主体→运动(只写中间过渡)→场景→镜头语言\", \"运镜幅度写'推近'匹配两图中等差异\", \"物理语言:气流惯性/落地下沉\"]\n差分Prompt联动备注: \"锚点压至2词；Prompt禁复述首帧静态外貌；末尾挂画风锁\"\nR7送检状态: \"9.3分放行\"\n```\n\n## 四、专项工具箱\n\n### 4.1 技法选择决策树\n\n```text\nQ1 镜头等级？\n ├─ B级 → 【静态图方案】不生成视频：超高清静态图 + 剪映关键帧缓推 + 粒子特效图层（台词后期TTS轨替换）\n ├─ A级 → Q2 前置资源？\n │   └─ 首帧就位 → 【首帧I2V】全平台通用；对白镜→口型细腻平台优先（即梦/MiniMax H3），音频后期可整轨替换\n └─ S级 → Q3 需求特征？\n     ├─ 大幅动作/物理奇观(打斗/坠落/爆发) → 【首尾帧控制】可灵（幅度匹配铁律）\n     ├─ 多资产复合(人+景+道具同镜强一致) → 【多图参考融合】即梦（素材位1~4）\n     ├─ 剧本明写一镜到底(关直播→摸菜谱→变脸类连贯长镜) → 【一镜到底三段管线】首/中/尾帧多图参考锁轨迹(可灵首尾帧优先，即梦素材位备选)+尾帧接力A/B/C+R8剪辑拼接伪一镜到底（中帧锚=R段三段前提，KB_08 五节）\n     └─ 需要>5s连续长镜(无中帧资源) → 【尾帧截取接力】裸链≤2段；首段按S/A正常产，次段锚点压至1词\nQ4 废片两轮？→ 启动备选技法 + 填复盘占位（EVO-01 归因）\n```\n\n### 4.2 四大技法适用场景与平台适配总表\n\n| 技法 | 原理 | 最佳平台 | 适用镜头 | 核心风险 | 备选切换 |\n|---|---|---|---|---|---|\n| 首帧 I2V | 首帧锚定 90% 外观 | 全平台（即梦/MiniMax H3 对白优先） | A 级常规、对白镜 | 首帧逆光过曝（崩坏10） | 多图融合 |\n| 首尾帧控制 | 双图锚定起止，Prompt 只写过渡 | **可灵**（强项） | S 级奇观/大幅动作 | 幅度错配→运镜不执行 | 即梦长条 |\n| 多图 @资产 融合 | 人物图+场景图+道具图同挂素材位 | **即梦 Seedance**（素材位多至50，实用≤4） | 多资产复合、跨场景合成 | 参考过多串色 | 首帧I2V+图生图合成 |\n| 尾帧接力 Tail-to-Head | 上镜尾帧→修复→下镜首帧 | 全平台 | >5s 长镜头、无缝衔接 | 累积漂移（链>2段） | 剪辑切镜+转场 |\n\n### 4.3 四大技法操作指南（逐技法步骤）\n\n**① 首帧 I2V 操作指南**：\n1. 首帧基准图就位（IMG-02 产出，含过曝防护）；2. VID-01 编译差分 Prompt（20/80）；3. 挂人物参考（即梦素材位/ComfyUI IP-Adapter）；4. 运镜 1 种+幅度；5. 写台词+口型排他锁（音频后期可整轨替换）；6. 生成 2~3 次取优，废片填复盘占位。\n\n**② 首尾帧控制（可灵）操作指南**：\n1. 首帧+尾帧双图就位（同源改三点，IMG-02 铁律 3）；2. Prompt 按官方四段式：`主体（≤2词）→ 运动（只写中间过渡，禁复述起止静态）→ 场景 → 镜头语言+光影+氛围`；3. 运镜幅度=两图差异档（大差大幅/小差\"缓慢\"）；4. 大幅动作写物理语言（重力/惯性/气流）；5. 锚点间隔 ≥3 秒（多镜分段时切换生硬红线）。\n\n**③ 多图 @资产 融合（即梦）操作指南**：\n1. 素材位规划清单前置（位1 人物立绘/位2 第二人物/位3 场景空镜/位4 道具特写，≤4 位）；2. Prompt 中 @资产名与素材位一一对应；3. 结尾挂一致性行\"人物与场景外观全程与参考素材保持一致\"；4. 分区句式+口型锁照常（参考图不豁免防崩规则）；5. 单参考图权重失衡（一人像一人不像）→ 该人参考图换面部特写重试。\n\n**④ 尾帧接力 Tail-to-Head 操作指南**：\n1. 首段正常生产（按等级走①或②）；2. 导出首段视频，**截取最后一帧**为 F1；3. F1 修复：高清修复 + Inpainting 微调（只改接力所需：衣摆角度/光斑位置，羽化 25px）；4. 次段以 F1' 为首帧，VID-01 锚点压至 1 词，Prompt 只写增量（新增动作/光移/表情递进）；5. 链长 ≤2 段；第 3 段起重锚全量首帧；6. 接力段剪辑禁转场（无缝是目的），段间音效连续。\n\n### 4.3-b 接力链声明模板\n\n```yaml\n接力链:\n  首段: {镜号: A, 时长: 5s, 技法: \"首尾帧(可灵)\", 尾帧: \"导出截取F1\"}\n  修复: {操作: \"高清修复+Inpainting微调衣摆角度\", 工具: \"IMG-01路由\"}\n  次段: {镜号: B, 时长: 3s, 技法: \"接力I2V\", 首帧: \"F1'\", 锚点: \"压缩至1词@林烬\", 增量: \"+右手抬剑指前+光柱落台\"}\n  终止条件: \"链止于2段；第3段需求→重锚全量首帧\"\n```\n\n## 五、常见错误示范 vs 满分工业级示范\n\n### 对比组 1：S 级技法选型\n\n❌ **Bad Case**：\n> 镜头1 是 S 级压场爆发镜（取剑划弧+罡风+人群后倾）。做法：只用首帧图生视频，提示词写\"激烈地挥剑战斗，快速运镜，画面震撼\"，多抽几次卡碰运气。\n\n**扣分点**：S 级大幅动作裸 I2V（等级路由错配）——首帧锚定后中段动作漂移概率极高；\"激烈/震撼\"是空洞幅度词（可灵幅度匹配失效）；无尾帧锚定=收势定格全凭运气；无备选预案。\n\n✅ **Good Case**：\n> 主技法：可灵首尾帧——首帧图1（负剑静立）+尾帧图2（剑指定格衣袂上扬）；Prompt 四段式只写中间过渡（\"抬眼扫视→右手取剑自下而上划弧→气流掀动衣摆→人群后倾→光柱落台定格\"，物理语言齐）；运镜幅度\"推近\"匹配两图中等差异。备选：即梦多图参考（@林烬立绘+@玄天宗比武台空镜+@焚天断剑特写三位），降级条件\"可灵两轮废片\"。——9.3 分放行。\n\n### 对比组 2：长镜头接力\n\n❌ **Bad Case**：\n> 要做一个 20 秒连续打斗长镜头：写一条超长提示词塞给模型一次生成，不行就截成四段每段独立生成，剪辑时加转场连起来。\n\n**扣分点**：单次 20s 超时长（平台不支持+漂移爆炸）；四段独立生成=四张不同的脸四套空间（段间断层）；加转场=承认不连续（违背\"长镜头\"需求本体）。\n\n✅ **Good Case**：\n> 20s 拆\"5+5+5+5\"四段，走接力链：段1 首尾帧（可灵）产 0~5s → 截尾帧 F1 修复 → 段2 接力 I2V（锚点 1 词，增量=+进身压制）→ 段3 接力（锚点 1 词，增量=+格挡反冲）→ **段4 重锚全量首帧**（接力链调和铁律·裸链档：段3 结束已到累积漂移红线，段4 用 IMG-02 新出首帧接续，剪辑在段3→4 之间安排 0.5s 武器碰撞特写 Cutaway 天然遮接缝；若段2/3 挂 IMG-02 中帧关键帧锚，可延至三段后重锚）。全程段间禁转场，音效连续。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **8~15 秒中长镜**：≤10s 优先即梦单条长条（秒级节点加密版，VID-01 边界 4）；>10s 走接力链（首段即梦长条 10s + 接力段 5s）。\n2. **高动态打斗连续镜**：打斗每段主动作仍限 1 个（劈→格→反冲分段）；段间用武器/拳风特写 Cutaway 遮接缝——既符合接力终止条件又保节奏。\n3. **对白镜选型分歧（原生音频平台可用但想用可灵）**：可灵对白能力弱 → 照常用可灵出口型画面，音频后期统一 TTS 轨替换对齐（音频可替换原则）；或拆\"可灵产无台词动作段 + 口型平台产面部段\"两段接力，音轨统一后期合成。\n4. **平台不可用（无 API/无配额）**：按备选技法降级链执行：可灵→即梦→MiniMax H3→ComfyUI Wan（本地兜底，无声输出+后期TTS轨替换）；选型输出注明\"降级原因=平台配额\"。\n5. **前置资源未就位**（尾帧图缺）：S 级镜头禁止带病开跑——回 IMG-02 补产；紧急情况降级为 A 级首帧 I2V 并通知导演改分镜表等级。\n6. **竖屏长条**：接力链规则不变；宫格垫图联动时用 1x4 竖排条（IMG-02 边界 3）；竖屏长条中段身份漂移更快，第 12 秒左右提前重锚。"},{"p":"skills/04_video_gen_skills/skill_vid_second_slicer.md","t":"视频秒级切片器（VID-01 · 视频提示词核心）· 工业级完整版","d":"WHAT：视频提示词核心编译技能——按秒切分[00-02s]模板、一镜一动一主体台词铁律、20%锚点+80%动态差分Prompt公式、多人同框空间分区与口型排他锁、音频可替换
