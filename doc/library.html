| S级奇观、打斗、首尾帧接力 |\n| ComfyUI Flux | 生图 | PuLID/IP-Adapter/Redux+ControlNet 全可控、LoRA 生态 | 工作流搭建成本高 | 资产批量图、锁脸精修、三视图 |\n| ComfyUI Wan2.1/2.2 | 生视频 | 姿态/深度/边缘三分支控制、动态幅度可调、本地部署零 API 费用 | 显存要求高、速度慢 | B级降本镜头、极端可控精修 |\n| Fish Audio | TTS | 10秒极速克隆、词级控制、13语种 | 中文情感极致度一般 | 角色音色克隆主力 |\n| MiniMax TTS | TTS | 情绪标签内嵌、混合音色、中文情感丰富 | 克隆需授权流程 | 情绪浓烈台词 |\n| CosyVoice | TTS | instruct 副语言指令、3秒克隆、可本地部署 | 2.0 克隆模式语气描述失效 | 本地化批量配音 |\n\n**选型路由启发式**：\n1. 用户指定平台 → 直接加载对应 `plat_*` 插件。\n2. 未指定平台生图 → 默认公用标准提示词 + 推荐豆包 Seedream 4.0（中文/人设）或 ComfyUI Flux（需锁脸/批量）。\n3. 未指定平台生视频 → 默认公用标准提示词 + 按镜头类型推荐：S 级奇观→可灵；对白戏→即梦或 MiniMax H3（口型细腻优先）；微表情情感戏→MiniMax H3；B 级降本→ComfyUI Wan2.1（音频后期 TTS 轨替换，音频可替换原则）。\n\n---\n\n## 四、权威来源清单（持续追加）\n\n- anthropics/skills（Agent Skills 官方规范）：https://github.com/anthropics/skills\n- chatfire-AI/huobao-drama（火宝短剧）：https://github.com/chatfire-AI/huobao-drama\n- HKUDS/ViMax（多智能体视频框架）：https://github.com/hkuds/vimax\n- FoundationAgents/MetaGPT：https://github.com/FoundationAgents/MetaGPT\n- crewAIInc/crewAI：https://github.com/crewAIInc/crewAI\n- Seedance 2.0 提示词撰写指南（Skill）：https://github.com/dexhunter/seedance2-skill/blob/main/zh/SKILL.md\n- awesome-seedance-2-prompts：https://github.com/YouMind-OpenLab/awesome-seedance-2-prompts\n- awesome-minimax-h3-prompts（中文）：https://github.com/AtlasCloudAI/awesome-minimax-h3-prompts/blob/main/i18n/README_zh.md\n- Seedream 4.0 官方：https://seed.bytedance.com/zh/seedream4_0\n- Coze 官方 Seedream 教程：https://docs.coze.cn/tutorial_seedream4_prompt\n- 可灵官方提示词指南：https://kling.ai/quickstart/text-to-video-prompt-guide\n- Kling AI Guide SKILL.md：https://github.com/kevingao-ai/kling-ai-guide/blob/main/SKILL.md\n- ComfyUI Wan2.1 ControlNet 官方工作流：https://comfy.org/zh/workflows/wan2.1_fun_control-524727db7cac\n- Fish Audio 官网/开发者指南：https://fish.audio/zh-CN ；https://fish.audio/zh-CN/blog/text-to-speech-api-developer-guide\n- MiniMax TTS：https://www.minimaxi.com/audio/text-to-speech\n- 剪映曲线变速教程（CSDN）：https://blog.csdn.net/m0_53619432/article/details/136112453\n- AI 视 力绝对专注 |\n| **F4 叙事保真与 AI 限制的矛盾** | 为适配模型删戏/强塞 | 攥拳擦镜开门被删、一镜到底 vs 5 秒极限 | 信息守恒＋无损膨胀＋一镜到底拆解重组（多图参考+尾帧接力+R8拼接） | 绝不削足适履——用加镜、接力、剪辑拼接等工程手段 100% 还原剧本 |\n| **F5 流程与门禁工程化** | 人检遗漏/操作盲区 | L2 抽检漏网、垫图说明埋没、评分单签 | 双擎联审（L1+L2）＋📸垫图上传指引硬性标准＋双签评分行＋R3 双机位资产契约 | 机器管确定性语法，人管视听语义；给人类操作者的信息必须有视觉焦点 |\n\n### 4.3 框架分层影响图（本轮立法的落位全景）\n\n| 层 | 载体 | 本轮新增/升级 |\n|---|---|---|\n| 决策层 | R2（AGENTS） | 蒙太奇拆镜／文转镜信息守恒／单镜时空唯一／剧本无损膨胀／接力段分镜标记——五法则 |\n| 资产层 | R3（AGENTS）+KB_08 八节9 | 场景卡双机位契约＋场景多机位注册法则 |\n| 编译层 | KB_08 一节八层 | ⑤层：微距配饰剥离+手部双轨+载具遮挡；⑥层：特写绝对坐标+透视焦段匹配+微距防穿帮；五节：多图参考+接力链调和 |\n| 词典层 | KB_01/02/03/05/06/10/11 | 年龄双向锚+同框关系锚／道具尺度分层／PACK×4／四轨互锁／G9·V11◆／接力对齐 |\n| 路由层 | VID-02/plat×4 | 一镜到底三段管线分支＋接力链调和＋平台语法全面对齐 |\n| 执法层 | qc_linter+QC-01+KB_10〇 | L1 八类机检（含轻熟/混挂）＋L2 五问＋双签制 |\n| 执行层 | R6/R8/VIS-01 | 一镜到底拆解重组＋接力段拼接手法＋蒙太奇B计划 |\n\n### 4.4 规则张力与调和记录（3 例 · 防未来误读）\n\n1. **T1 接力 ≤2 段 vs A/B/C 三段**：旧铁律源自崩坏 09 实测（第 3 段脸漂）——调和为**双档制**：有中帧图像锚（多图参考锁轨迹）≤3 段；纯尾帧裸链仍 ≤2 段第 3 段重锚（KB_08 五节/VID-02 铁律3/KB_11 已三处对齐）。\n2. **T2 无损膨胀 vs 一镜到底接力**：E01 镜 02 系（02-B/02-C）按**独立镜路线**拆分在先，一镜到底法则立于后——两者是**并存路线**非矛盾：R2 接力段标记条款已定边界（膨胀=可独立叙事的正反打拆分；接力=R 段伪一镜到底）；镜 02 系已按 R9-20261006-2 完成主备反转——**02R 三段接力为主路线**（R6 法则示例场，前置资源 F1/F2/F3 关键帧组已全量产出），独立镜 02/02-B/02-C 降级为备份（Gate 3 过审产物保留，02R 任一段两轮废片时启用）。\n3. **T3 负向语法禁令 vs 地貌排他**：微距防穿帮的\"绝对禁止出现远山旷野\"与自然语言平台负向禁令（粉色大象）表面冲突——裁决为**指令级空间约束豁免**（防地理穿帮优先于粉色大象顾虑，限用于背景地貌排他场景，不作通用放宽）。\n\n### 4.5 遗留风险清单（带处置状态 · 架构师裁决队列）\n\n| # | 风险项 | 状态 |\n|---|---|---|\n| L1 | KB_06 三节\"场景两件套（全景+空镜基准）\"与 R3 双机位契约（俯瞰+平视/低机位）口径未统一——建议升级\"核心场景三件套\"并回填两项目注册表 | 待裁决 |\n| L2 | 豆包版视频文档（E01_视频生成提示词_豆包版.md）原不在 qc_linter 审计面 | ✅ 已纳入（GRAND 收尾落地） |\n| L3 | KB_10 四节评分输出模板仍为单签旧格式 | ✅ 已双签化（GRAND 收尾落地） |\n| L4 | 主项目 E01 文学剧本层\"掀帘\"措辞与视觉层\"按剑\"不一致（文学层不编译，无废片风险，场记知悉即可） | 观察 |\n| L5 | 镜 05/06/09（室内卧房镜）垫偏院俯瞰全景作构图参考——按补丁7 精神属弱机位冲突，未见实测翻车 | 观察（Gate4 实测裁决） |\n| L6 | 黑名单第三部分已达 31 行——本总纲族级索引已缓解加载成本；若持续增长按 F1~F5 拆分卷宗 | 已缓解 |\n| L7 | 蒙太奇B计划（镜06）定义源在首帧文档，豆包视频文档为引用——跨文档单一权威源待 Gate4 实测后定稿 | 观察 |\n| L8 | GRAND 收尾同步（2026-10-06）：①黑名单速查表补齐 27~33 行（六新崩坏+垫图污染）；②VIS-01 补 R2 五法则镜像（9 条铁律）+边界3 调和版；③IMG-02 落地中帧关键帧+双机位基准策划（兑现 KB_08 承诺）；④plat_kling 增 4.3-b 接力链操作节；⑤plat_doubao 补豆包图生视频（Seedance 同源）口径；⑥R4 补三项新核对（群组阵型/关系锚/双机位注册）——影响分析驱动的六处技能/插件层同步；同日后续：R9-20261006-3 术语无歧义制（Cutaway 误读为剖面图触发）——新建 KB_13 框架术语白话词典（50 条三分区唯一权威源）+ AGENTS 七节「术语速查硬性标准」立法 + 五产出文档头部速查行对齐 + 英文术语中文主导化 | ✅ 已全部落盘 |\n\n### 4.6 本总纲落盘时的连带处置（三件）\n\n1. `kb_library/KB_10` 四节评分双模板升级为 L1+L2 双签格式（消除与产出层 39+ 处双签行的格式不一致）；\n2. `scripts/qc_linter.py` 审计面纳入豆包版视频文档（require_media_prefix=False/check_no_at_in_image=False——视频差分块不带媒介前缀与人名直书，机检以禁词/省略号/时间轴为主）；\n3. 本总纲自身作为第四部分常设（后续大复盘增量续写 4.x 小节，不另开文件）。"}]}]</script>

  <button class="tbtn" id="themeToggleM" type="button" title="切换白天/黑夜模式" style="margin-left:auto">🌙</button>
</div>
<div class="backdrop" id="backdrop"></div>

<div class="frame">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div><b>📚 AiDirector 文库</b><small>SKILLS × KB · 本地单文件</small></div>
      <button class="tbtn" id="themeToggle" type="button" title="切换白天/黑夜模式">🌙</button>
    </div>
    <input class="search" id="search" type="search" placeholder="筛选文档标题 / 关键词…">
    <nav id="docTree"></nav>
    <div class="side-foot">45 篇 · 278 KB<br>生成于 2026-10-07 02:00 · 改 md 后重跑 build_library.py</div>
  </aside>

  <main class="main">
    <div class="crumbs" id="crumbs"></div>
    <div class="art-head">
      <div class="art-actions">
        <span class="cat" id="artCat"></span>
        <button class="copy-btn" id="copyPage" type="button">📋 复制页面</button>
      </div>
      <h1 class="art-title" id="artTitle"></h1>
      <div class="art-desc" id="artDesc" style="display:none"></div>
    </div>
    <div class="md" id="article"></div>
  </main>

  <aside class="toc">
    <div class="tl">☰ 在此页面</div>
    <nav id="tocList"></nav>
  </aside>
</div>
<div id="toast"></div>

<script>
const GROUPS=JSON.parse(document.getElementById('library-data').textContent);
const $=id=>document.getElementById(id);
let cur=null;

/* ---------- 主题（与 doc.html 同色系，独立记忆键） ---------- */
function applyTheme(t){document.documentElement.dataset.theme=t;
  const icon=t==='light'?'🌙':'☀️';
  $('themeToggle').textContent=icon;$('themeToggleM').textContent=icon;
  try{localStorage.setItem('aidoc-lib-theme',t);}catch(e){}}
$('themeToggle').onclick=$('themeToggleM').onclick=()=>applyTheme(document.documentElement.dataset.theme==='light'?'dark':'light');
applyTheme(localStorage.getItem('aidoc-lib-theme')||'dark');

/* ---------- 侧栏文库树 ---------- */
function renderTree(filter){
  const q=(filter||'').trim().toLowerCase();
  const tree=$('docTree');tree.innerHTML='';
  GROUPS.forEach((g,gi)=>{
    const items=g.items.filter(d=>!q||(d.t+' '+d.d+' '+d.p).toLowerCase().includes(q));
    if(!items.length)return;
    const wrap=document.createElement('div');wrap.className='group';
    wrap.innerHTML=`<div class="gl">${g.g}</div>`;
    items.forEach(d=>{
      const b=document.createElement('button');b.className='item'+(cur===d.p?' on':'');b.type='button';
      b.innerHTML=d.t+`<span class="hint">　${d.p.split('/').pop()}</span>`;
      b.title=d.t+'\n'+d.p;
      b.onclick=()=>{openDoc(d.p);closeMobile();};
      wrap.appendChild(b);});
    tree.appendChild(wrap);});
}
$('search').addEventListener('input',e=>renderTree(e.target.value));

/* ---------- Markdown 渲染 ---------- */
function renderMarkdown(d){
  const box=$('article');
  if(typeof marked==='undefined'){box.innerHTML='<div class="raw-fallback"></div>';
    box.firstChild.textContent=d.raw;return [];}
  box.innerHTML=marked.parse(d.raw,{gfm:true,breaks:false});
  const h1=box.querySelector('h1');if(h1)h1.remove();          /* 标题已在文章头展示 */
  box.querySelectorAll('img').forEach(im=>im.onerror=()=>{
    const s=document.createElement('span');s.style.cssText='color:var(--txt3);font-size:12px;font-family:var(--mono)';
    s.textContent='［图片未随文库内联：'+im.getAttribute('src')+'］';im.replaceWith(s);});
  if(window.hljs)box.querySelectorAll('pre code').forEach(c=>{try{hljs.highlightElement(c);}catch(e){}});
  const heads=[];
  box.querySelectorAll('h2,h3,h4').forEach((h,i)=>{
    h.id='sec-'+i;heads.push({level:+h.tagName[1],text:h.textContent,id:h.id});});
  return heads;
}

/* ---------- 打开文档 ---------- */
function openDoc(path,keepHash){
  const d=GROUPS.flatMap(g=>g.items).find(x=>x.p===path);
  if(!d){toast('文库中未收录：'+path);return;}
  cur=path;
  $('crumbs').textContent=path;
  $('artCat').textContent=GROUPS.find(g=>g.items.includes(d)).g;
  $('artTitle').textContent=d.t;
  const de=$('artDesc');
  if(d.d){de.style.display='';de.textContent=d.d;}else de.style.display='none';
  const heads=renderMarkdown(d);
  const tl=$('tocList');tl.innerHTML=heads.map(h=>
    `<a href="#${h.id}" class="lv${h.level}" data-id="${h.id}">${h.text}</a>`).join('');
  renderTree($('search').value);
  if(!keepHash){try{location.hash='#/p='+encodeURIComponent(path);}catch(e){}}
  window.scrollTo({top:0,behavior:'auto'});
}

/* ---------- 滚动高亮"在此页面" ---------- */
let spyLock=false;
function spy(){
  if(spyLock)return;
  const heads=document.querySelectorAll('#article h2[id],#article h3[id],#article h4[id]');
  let curId='';
  heads.forEach(h=>{if(h.getBoundingClientRect().top<=120)curId=h.id;});
  document.querySelectorAll('#tocList a').forEach(a=>a.classList.toggle('on',a.dataset.id===curId));
}
addEventListener('scroll',()=>{spy();clearTimeout(window.__spyT);window.__spyT=setTimeout(spy,140);},{passive:true});
$('tocList').addEventListener('click',e=>{
  const a=e.target.closest('a');if(!a)return;e.preventDefault();spyLock=true;
  const el=document.getElementById(a.dataset.id);
  if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
  setTimeout(()=>spyLock=false,800);});

/* ---------- 复制页面（原文 Markdown） ---------- */
function copyText(txt,btn){
  const done=()=>{if(btn){const o=btn.textContent;btn.textContent='✓ 已复制';
    setTimeout(()=>btn.textContent=o,1500);}toast('已复制整页 Markdown');};
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(txt).then(done,()=>fallback());
  else fallback();
  function fallback(){const ta=document.createElement('textarea');ta.value=txt;
    document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){toast('复制失败，请手动选择');}
    ta.remove();}
}
$('copyPage').onclick=()=>{const d=GROUPS.flatMap(g=>g.items).find(x=>x.p===cur);
  if(d)copyText(d.raw,$('copyPage'));};

/* ---------- 文库内 .md 互链跳转 ---------- */
document.addEventListener('click',e=>{
  const a=e.target.closest('.md a[href]');if(!a)return;
  const href=a.getAttribute('href');
  if(/^(https?:|#|mailto:)/i.test(href))return;
  e.preventDefault();
  const all=GROUPS.flatMap(g=>g.items).map(x=>x.p);
  const hit=all.find(p=>p.endsWith(href.split('/').pop()))||
             all.find(p=>p.replace(/\\/g,'/').endsWith(href));
  if(hit)openDoc(hit);else toast('文库内未收录该链接：'+href);
});

/* ---------- 移动端侧栏 ---------- */
function closeMobile(){$('sidebar').classList.remove('open');$('backdrop').classList.remove('show');}
$('mMenu').onclick=()=>{$('sidebar').classList.add('open');$('backdrop').classList.add('show');};
$('backdrop').onclick=closeMobile;

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1800);}

/* ---------- 启动（支持 #/p=<路径> 深链） ---------- */
(function(){
  let target=GROUPS[0].items[0].p;
  const m=location.hash.match(/^#\/p=(.+)$/);
  if(m){const want=decodeURIComponent(m[1]);
    if(GROUPS.some(g=>g.items.some(x=>x.p===want)))target=want;}
  openDoc(target,true);
  addEventListener('hashchange',()=>{
    const mm=location.hash.match(/^#\/p=(.+)$/);
    if(mm){const want=decodeURIComponent(mm[1]);
      if(want!==cur&&GROUPS.some(g=>g.items.some(x=>x.p===want)))openDoc(want,true);}});
  spy();
})();
</script>
</body>
</html>
