<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AiDirector · 源码文库（Skills × KB）</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11/build/highlight.min.js"></script>
<style>
:root{
  --bg:#0E0E0D;--panel:#141413;--panel2:#181817;--line:rgba(255,255,255,.12);--line2:rgba(255,255,255,.26);
  --accent:#F2FF59;--txt:#A0A0A2;--txt2:#8B8B8D;--txt3:#66666A;--title:#E0E0E2;
  --code-bg:#161614;--well:#080d18;
  --mono:'SF Pro',Menlo,Consolas,monospace;
  --sans:'SF Pro','PingFang SC','HarmonyOS Sans SC','Microsoft YaHei',system-ui,sans-serif;
}
html[data-theme="light"]{
  --bg:#ffffff;--panel:#f7f6f4;--panel2:#f1eff7;--line:rgba(83,67,66,.14);--line2:rgba(83,67,66,.3);
  --accent:#49378B;--txt:#534342;--txt2:#7d6b68;--txt3:#a19490;--title:#49378B;
  --code-bg:#2b2735;--well:#f1eff7;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font:15px/1.8 var(--sans)}
::selection{background:var(--accent);color:var(--bg)}
*{scrollbar-width:thin;scrollbar-color:rgba(140,140,140,.3) transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(140,140,140,.3);border-radius:99px}
::-webkit-scrollbar-track{background:transparent}

/* ===== 三栏骨架 ===== */
.frame{display:grid;grid-template-columns:296px minmax(0,1fr) 232px;min-height:100vh}

/* ===== 顶栏（仅移动端） ===== */
.m-topbar{display:none;position:fixed;top:0;left:0;right:0;z-index:30;height:52px;align-items:center;gap:12px;
  padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.m-topbar button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);background:var(--panel2);color:var(--title);font-size:15px;cursor:pointer}
.m-topbar .tt{font-weight:800;color:var(--title);font-size:15px}

/* ===== 左侧文库树 ===== */
.sidebar{background:var(--panel);border-right:1px solid var(--line);padding:18px 14px 26px;overflow-y:auto;height:100vh;position:sticky;top:0}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 14px}
.brand b{color:var(--title);font-size:15.5px;letter-spacing:.02em}
.brand small{color:var(--txt3);font-size:10.5px;display:block;font-family:var(--mono)}
.tbtn{margin-left:auto;width:32px;height:32px;flex:none;border-radius:50%;border:1px solid var(--line2);background:var(--panel2);color:var(--accent);font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:transform .25s}
.tbtn:hover{transform:rotate(24deg);background:var(--line)}
.search{width:100%;padding:9px 12px;border-radius:9px;border:1px solid var(--line2);background:var(--bg);color:var(--txt);font:13px var(--sans);outline:none;margin-bottom:12px}
.search:focus{border-color:var(--accent)}
.search::placeholder{color:var(--txt3)}
.group{margin-bottom:6px}
.group>.gl{font:700 11px var(--mono);color:var(--txt3);letter-spacing:.08em;padding:12px 8px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item{display:block;width:100%;text-align:left;padding:7px 10px;border:0;border-radius:8px;background:transparent;color:var(--txt);font:13.5px/1.5 var(--sans);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.15s}
.item:hover{background:var(--panel2);color:var(--title)}
.item.on{background:var(--accent);color:var(--bg);font-weight:700}
.item .hint{color:var(--txt3);font-size:11px}
.item.on .hint{color:var(--bg);opacity:.7}
.side-foot{margin-top:16px;padding:10px 8px 0;border-top:1px solid var(--line);color:var(--txt3);font:10.5px/1.7 var(--mono)}

/* ===== 中栏正文 ===== */
.main{padding:34px clamp(18px,4vw,52px) 90px;min-width:0}
.crumbs{font:11.5px var(--mono);color:var(--txt3);letter-spacing:.06em;margin-bottom:10px;word-break:break-all}
.art-head{border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:26px}
.art-actions{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.cat{font:700 11px var(--mono);color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:2px 12px;letter-spacing:.06em}
.copy-btn{margin-left:auto;background:var(--accent);border:0;color:var(--bg);font:700 12.5px var(--sans);border-radius:999px;padding:8px 18px;cursor:pointer;transition:.2s}
.copy-btn:hover{opacity:.86}
.copy-btn.okd{background:var(--txt2)}
h1.art-title{font-size:29px;font-weight:900;color:var(--title);line-height:1.35;letter-spacing:.01em}
.art-desc{margin-top:10px;font-size:13px;color:var(--txt2);line-height:1.7;border-left:3px solid var(--accent);padding:2px 0 2px 12px}

/* ===== Markdown 渲染 ===== */
.md{max-width:860px}
.md h2{font-size:21px;font-weight:800;color:var(--title);margin:38px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line);scroll-margin-top:20px}
.md h3{font-size:17px;font-weight:800;color:var(--title);margin:28px 0 12px;scroll-margin-top:20px}
.md h4{font-size:15px;font-weight:700;color:var(--title);margin:20px 0 10px;scroll-margin-top:20px}
.md p{margin:10px 0}
.md ul,.md ol{padding-left:26px;margin:10px 0}
.md li{margin:4px 0}
.md li::marker{color:var(--accent)}
.md a{color:var(--accent);text-decoration:none;border-bottom:1px dashed var(--accent)}
.md blockquote{margin:14px 0;padding:10px 16px;border-left:3px solid var(--accent);background:var(--panel);border-radius:0 10px 10px 0;color:var(--txt2);font-size:13.5px}
.md blockquote p{margin:4px 0}
.md hr{border:0;border-top:1px solid var(--line);margin:26px 0}
.md code{font-family:var(--mono);font-size:.88em;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--title)}
.md pre{background:var(--code-bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px;overflow-x:auto;margin:14px 0;line-height:1.7}
.md pre code{background:transparent;border:0;padding:0;font-size:12.8px;color:#c9ccd6;white-space:pre-wrap;word-break:break-word}
.md table{border-collapse:collapse;width:100%;margin:14px 0;font-size:13px;display:block;overflow-x:auto}
.md th{background:var(--panel2);color:var(--title);font-weight:700;text-align:left}
.md th,.md td{border:1px solid var(--line);padding:7px 12px;vertical-align:top}
.md tr:nth-child(even) td{background:var(--panel)}
.md img{max-width:100%;border-radius:10px}
.md strong{color:var(--title)}

/* ===== 右栏：在此页面 ===== */
.toc{padding:34px 18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.toc .tl{font:700 11.5px var(--mono);color:var(--txt3);letter-spacing:.1em;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.toc a{display:block;color:var(--txt2);text-decoration:none;font-size:12.5px;line-height:1.55;padding:4px 10px;border-left:2px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.15s}
.toc a:hover{color:var(--title)}
.toc a.lv3{padding-left:22px}
.toc a.lv4{padding-left:34px;font-size:12px}
.toc a.on{color:var(--accent);border-left-color:var(--accent);font-weight:700}

/* ===== Toast ===== */
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(16px);z-index:60;background:var(--title);color:var(--bg);font:600 13px var(--sans);padding:9px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s}
#toast.show{opacity:1;transform:translateX(-50%)}
.raw-fallback{white-space:pre-wrap;font-family:var(--mono);font-size:13px}

/* ===== 响应式（置于末尾确保覆盖基础样式） ===== */
@media(max-width:1180px){
  .frame{grid-template-columns:280px minmax(0,1fr)}
  .toc{display:none}
}
@media(max-width:900px){
  .frame{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:40;width:300px;transform:translateX(-102%);transition:transform .28s}
  .sidebar.open{transform:none}
  .toc{display:none}
  .m-topbar{display:flex}
  .main{padding-top:52px}
  .backdrop{display:none;position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.45)}
  .backdrop.show{display:block}
}
</style>
</head>

<script id="library-data" type="application/json">[{"g":"总控路由","items":[{"p":"AGENTS.md","t":"AGENTS.md —【AIGC 影视与短剧多智能体工业化创作框架】总控路由协议","d":"","raw":"# AGENTS.md —【AIGC 影视与短剧多智能体工业化创作框架】总控路由协议\n\n> 本文件是整个框架的\"操作系统内核\"。任何 AI 编程/创作助手（ZCode、Trae、WorkBuddy 等）进入本项目工作区后，**必须先读取本文件**作为行为总纲。\n> 本框架遵循 anthropics/skills 的 Agent Skills 规范与按需加载（Progressive Disclosure）原则：常驻只读本路由 + `skills/SKILL_INDEX.md` 索引，具体词典（KB）与技能（Skill）在触发对应任务时才提取读取，节省上下文 Token 并防止平台语法互相污染。\n\n---\n\n## 〇、跨平台启动自检（ZCode / Trae / WorkBuddy 通用）\n\n1. 读取本 `AGENTS.md` → 掌握状态机与角色路由。\n2. 读取 `skills/SKILL_INDEX.md` → 获得全部技能插件的 ID、路径、触发条件与挂载 KB。\n3. 按用户任务关键词匹配\"任务路由表\"（见第二节），进入对应生产阶段。\n4. 涉及具体剧集时，先读取 `memory/projects/[剧名]/` 三件套（剧集圣经、资产注册表、跨集状态快照）再动笔。\n5. 产出任何提示词前后，分别执行\"编译前置检查\"与\"10 分制质量门禁\"。\n6. **【冷热记忆隔离锁】**：创作分集视频提示词（阶段Ⅲ）时，只读取热记忆 `memory/projects/[剧名]/资产注册表.md`（取外貌锁定摘要与音色ID）和 `跨集状态快照_StateDiff.md`；**严禁全文读取冷归档文件 `workspace/重要资产图片提示词.md` 及往集 `.md` 产出文档**，防止剧集连载时上下文滚雪球膨胀。\n7. **【阶段释放与分批生产铁律】**：单集超过 8 个分镜时，阶段Ⅲ按**每批 4~6 个分镜**分段产出并逐批过门禁；不同生产阶段切换时，主动释放上一阶段挂载的 KB 与 Skill（上下文预算保持 ≤1 平台插件 + ≤2 KB + ≤3 技法 Skill）。\n8. **【评分加载策略】**：日常评分只挂载 `KB_10 + KB_09`；仅当核查新增实战崩坏或执行 R9 复盘时，才加载 `memory/global/全局复盘避坑黑名单.md`（该文件已瘦身为动态档案区，17 种崩坏静态规则以 KB_09 第一节为唯一源）。\n\n---\n\n## 一、目录结构与职责总览\n\n```text\nai-video-framework/（本项目根 D:\\AiDirector）\n├── AGENTS.md                 # 本文件：总控路由（状态机/角色/门禁/自进化）\n├── index.html                # 可视化展示门户（浏览器双击打开）\n├── memory/global/            # 全局记忆层：权威知识库 + 复盘避坑黑名单\n├── memory/projects/[剧名]/   # 剧集记忆层：剧集圣经 / 资产注册表 / 跨集状态快照\n├── kb_library/KB_01~KB_12    # 12 个专业词典与编译器规范（查表编译，拒绝自由造句）\n├── skills/                   # 21 个插件式技能（含 plat_00，YAML Frontmatter 按需加载）\n│   ├── SKILL_INDEX.md        # 技能路由索引（必读）\n│   ├── 01_narrative_skills/  # 编剧叙事\n│   ├── 02_visual_director_skills/ # 导演/美术/场记\n│   ├── 03_image_gen_skills/  # 生图技法\n│   ├── 04_video_gen_skills/  # 生视频技法\n│   ├── 05_platform_plugins/  # 6 个平台专属语法插件\n│   └── 06_audio_edit_qc_skills/ # 评分/音色/剪映/自进化\n└── workspace/                # 标准产出工作区（资产提示词 + 分集视频提示词）\n```\n\n---\n\n## 二、任务路由表（用户输入 → 生产阶段 → 角色/技能调度）\n\n| 用户任务关键词示例 | 生产阶段 | 主责角色 | 加载 Skill | 挂载 KB |\n|---|---|---|---|---|\n| \"写剧本/改小说/前三秒钩子/情绪曲线\" | 阶段Ⅰ 剧本 | 高级编剧大师 | skill_market_hook_research、skill_world_character_arc、skill_dialogue_second_calc | KB_01、KB_02 |\n| \"拆分镜/镜头分级/竖屏构图\" | 阶段Ⅱ 视觉开发 | 高级导演 + 美术指导 + 场记 | skill_director_storyboard、skill_art_style_costume_prop、skill_continuity_axis_guard | KB_05、KB_07、KB_11 |\n| \"做资产/人物设定图/三视图/注册资产\" | 阶段Ⅱ 资产 | 美术指导 + 生图专家 | skill_asset_pure_chinese_no_light、skill_img_tech_router | KB_02~KB_07 |\n| \"出图片提示词/首帧图/垫图\" | 阶段Ⅲ 提示词 | AI 生图高级专家 | skill_img_pre_resource_planner + 指定平台 plat_* | KB_06、KB_08、KB_09 |\n| \"出视频提示词/按秒拆镜头\" | 阶段Ⅲ 提示词 | AI 视频创作提示词专家 | skill_vid_second_slicer、skill_vid_method_selector + 指定平台 plat_* | KB_08、KB_09、KB_11 |\n| \"配音/克隆音色/TTS\" | 阶段Ⅲ 音频 | 美术指导（音色）+ 剪辑调音大师 | skill_tts_voice_clone_workflow | KB_12 |\n| \"剪辑/卡点/转场/音效\" | 阶段Ⅲ 后期 | 剪映剪辑大师兼调音大师 | skill_jianying_edit_sound_master | KB_12 |\n| \"评分/质检\" | 质量门禁（每条 Prompt 必过） | AI 提示词质量评分专家 | skill_qc_prompt_scorer_10pt | KB_10、KB_09（黑名单按需） |\n| \"复盘/翻车了/优化框架\" | 复盘自进化 | 复盘自进化引擎 | skill_retrospective_optimizer | KB_09、KB_10、黑名单 |\n| \"新建一部剧\" | 初始化 | 总控 | 在 memory/projects/ 建三件套 | 全部 |\n\n**平台选择规则**：用户指明平台（豆包/即梦/ComfyUI/MiniMax/可灵）→ 只加载对应 `plat_*` 插件；未指明 → 加载 `plat_00_universal_default.md` 产出公用标准提示词，并按\"知识库·选型路由启发式\"给出推荐平台与模型。\n\n---\n\n## 三、9 大专业角色智能体（职责 · 交接 Schema · 挂载资源）\n\n> 角色间遵循 MetaGPT/crewAI 式**结构化文档交接契约**：只传 Schema 化产物，不传散文闲聊。\n\n### R1 高级编剧大师\n- **视角**：市场与受众。前 3 秒抓眼球，情绪曲线（压抑→反转→爆发爽点）持续拉扯。\n- **职责**：世界观、人物立体性格与关系、潜台词打磨、分集大纲、单集剧本。\n- **输出 Schema**：`{集数, 标题, 市场受众痛点分析, 黄金前3秒钩子, 情绪曲线节点表, 场次列表[场次号, 场景@资产, 人物@资产列表, 台词表(角色, 台词, 情绪, 语速档)]}`\n- **挂载**：KB_01、KB_02；skills/01_narrative_skills/ 全部。\n\n### R2 高级导演\n- **视角**：视听统治力。分镜拆解、景别机位角度构图、场面调度、画幅制式、S/A/B 算力分级、Cutaway 缓冲镜规划。\n- **输出 Schema**：`{画幅, 分镜总表[镜号, 场次, 景别, 机位, 构图, 时长秒, 等级S/A/B, 调用@资产清单, 台词引用, 秒级动作节点]}`\n- **挂载**：KB_07、KB_11；skill_director_storyboard。\n\n### R3 高级美术指导兼高级画师\n- **视角**：视觉统一。全局 `@画风锁`、60-30-10 色彩脚本、人物穿搭与外貌、**角色音色设定**、场景空间与道具设计。\n- **输出 Schema**：`{画风锁, 色彩脚本[主60/辅30/点缀10], 人物视觉卡[@资产名,骨相,发型,穿搭,配饰], 音色卡[@人物,平台,特征,参考音频,克隆参数,情感标签], 场景卡, 道具卡}`\n- **挂载**：KB_02~KB_05、KB_12（音色）；skill_art_style_costume_prop、skill_tts_voice_clone_workflow。\n\n### R4 场记与连续性监督专家（防穿帮守门员）\n- **视角**：时空连续性。维护资产注册表唯一合法 `@纯中文名称`；核查 180 度轴线、左右站位、道具左右手、服装战损跨镜跨集连贯。\n- **输出 Schema**：`{资产注册变更单, 轴线声明(场景, 轴线方向, 允许机位半圆), 连续性核对清单[镜号→镜号, 核对项, 结果], State Diff 快照}`\n- **挂载**：资产注册表、跨集状态快照；skill_continuity_axis_guard。\n\n### R5 AI 生图高级专家\n- **视角**：出图工程。图生图、ControlNet（姿态/景深/线稿）、灰度图、LoRA 权重、Inpainting 局部重绘、多宫格垫图的策略路由；分镜前置资源（首帧/尾帧基准图）策划。\n- **输出 Schema**：`{生图策略[技法, 参考图来源@资产, ControlNet类型与强度, LoRA权重], 平台与模型推荐, 中文Prompt(代码块), 负向词}`\n- **挂载**：KB_06、KB_08、KB_09；skill_img_tech_router、skill_img_pre_resource_planner、plat_*。\n- **默认规则**：用户未指明平台 → 公用标准提示词 + 推荐豆包 Seedream 4.0（中文人设/场景）或 ComfyUI Flux（锁脸/批量）。\n\n### R6 AI 视频创作提示词专家\n- **视角**：以秒为单位的运动工程。按秒切分片段、差分编译（20% 锚点 + 80% 动态）、口型排他锁、双管线（模式A原生音画/模式B后期对口型）、首尾帧/多图参考/尾帧接力技法选择。\n- **输出 Schema**：`{镜号, 时长秒, 秒级节点[起止秒→动作/运镜/情绪], @资产引用, 台词(含TTS控制符)与口型模式, 技法与推荐平台模型, 中文Prompt(代码块)}`\n- **挂载**：KB_08、KB_09、KB_11；skill_vid_second_slicer、skill_vid_method_selector、plat_*。\n- **默认规则**：用户未指明平台 → 公用标准提示词 + 推荐（S级奇观→可灵；对白戏→即梦/MiniMax H3 模式A；微表情→MiniMax H3；B级降本→ComfyUI Wan2.1 模式B）。\n\n### R7 AI 提示词质量评分专家（10 分制硬性质量门禁）\n- **视角**：一票否决质检。对**每一条**资产图/前置图/视频 Prompt 按 KB_10 双扣分表 + 黑名单 17 崩坏题库评分。\n- **输出 Schema**：`{被评Prompt编号, 得分(保留一位小数), 逐项扣分明细, 崩坏题库触发记录, 修改指令(若<9.0), 门禁结论(放行/打回)}`\n- **挂载**：KB_10、KB_09（评分日常仅此两册；`memory/global/全局复盘避坑黑名单.md` 仅在核查新增实战崩坏时按需加载，见〇节第 8 条）。\n- **铁律**：**低于 9.0 分强制打回** R5/R6 重写，并将修改指令一并下发；重写后复审，直至 ≥9.0 才允许写入最终产出文档。\n\n### R8 剪映剪辑大师兼调音大师\n- **视角**：节奏与声场。整集与单镜节奏、语速语气声调指导、剪映真实菜单级手法（曲线变速/转场/动画/关键帧）、Foley 音效、BGM 情绪卡点、环境音底噪。\n- **输出 Schema**：`{单镜剪辑建议[变速预设, 入出场动画, 转场名, J/L-Cut切入点, 音效搜索词, 卡点秒], 整集建议[节奏曲线, 粗剪精剪SOP, 混音规范]}`\n- **挂载**：KB_12；skill_jianying_edit_sound_master。\n- **真实菜单铁律**：只准使用 KB_12 收录的剪映真实特效/预设名（蒙太奇、英雄时刻、子弹时间、跳接、闪进、闪出、叠化、闪黑、漏光、故障等），严禁编造。\n\n### R9 复盘自进化引擎\n- **视角**：系统进化。读取产出文档底部 `Prompt 实际产出复盘` → 归因 → 生成优化计划 → 反哺写入黑名单、KB_09/KB_10、对应平台 Skill。\n- **输出 Schema**：`{复盘归因[崩坏编号/新类型], 触发Prompt片段, 优化动作[目标文件, 修订内容], 执行状态}`\n- **挂载**：黑名单、KB_09、KB_10、全部 plat_*；skill_retrospective_optimizer。\n\n---\n\n## 四、三阶生产流水线（状态机）\n\n```text\n[阶段Ⅰ 剧本开发] R1 ──(剧本Schema)──▶ [阶段Ⅱ 视觉开发] R2+R3+R4 ──(分镜表+资产卡+注册表)──▶ [阶段Ⅲ 提示词生产] R5+R6 ──▶ [质量门禁] R7 ──(≥9.0)──▶ R8(剪辑调音指南) ──▶ 产出文档定稿\n                                        ▲                                        │\n                                        └──────────(<9.0 强制打回重写)──────────┘\n[阶段Ⅳ 实拍复测] 用户跑图/跑视频 → 填写复盘 → [阶段Ⅴ 自进化] R9 更新黑名单与KB → 回流\n```\n\n**状态机细则**：\n1. 每条 Prompt 独立过门禁，**不搞整集平均分**——一镜不合格即该镜打回。\n2. 打回最多 3 轮；第 3 轮仍 <9.0 → 升级人工介入，由用户裁决（记录在案）。\n3. 产出文档中每条 Prompt 必须携带\"质量关卡得分 9.X/10、评分明细、使用建议、复盘占位\"四件套。\n4. 集末必产 `State Diff 快照`（同步到 memory/projects/[剧名]/跨集状态快照_StateDiff.md）。\n\n---\n\n## 五、必须植入的 6 大工业级思维（全角色强制内化）\n\n1. **生图与生视频差分编译（Delta Prompting）**：I2V 阶段首帧已锁定 90% 静态外观，视频 Prompt = **20% 极简 `@资产` 锚点 + 80% 纯物理运动变化量**（镜头推拉位移、肢体动作轨迹、风吹衣角发丝、光影变幻），严禁重复堆砌五官穿搭描写。\n2. **S/A/B 镜头分级与算力路由（Shot Tiering）**：S 级（黄金前3秒/核心奇观/高潮爆发）→ 首尾帧精控+顶级模型精调；A 级（常规动作交互）→ 标准首帧图+图生视频；B 级（纯对白反应/空镜/停顿）→ 超高清静态图+对口型模型 Lip-Sync+剪映关键帧缓推与粒子特效图层降本增稳。\n3. **皮克斯声画先行（Audio-First / Pre-lay）**：先按字数与语速（正常 4 字/秒、急促 5.5 字/秒、沉吟 2.5 字/秒）+情绪停顿算出精确到 0.5 秒的音频时长与重音点，再倒推视频秒级动作节点。\n4. **剪辑救场缓冲镜（Cutaway / B-Roll Buffer）**：每 2~3 个主镜头规划一个 1~2 秒特写插入镜/反应镜，配 J-Cut/L-Cut 声画错位覆盖主轨，遮 AI 局部瑕疵、拉叙事张力。\n5. **跨镜头尾帧接力（Tail-to-Head Relay）**：突破单次 5 秒限制——截取上一镜尾帧（或尾帧设计图）→ 高清修复/局部重绘微调 → 作为下一镜首帧输入。\n6. **跨集状态快照（Episode State Snapshot）**：每集末尾输出 `### 本集结束状态快照（State Diff）`（人物战损/服装、道具得失、时间天气、情绪刻度），同步至项目记忆库防跨集穿帮。\n\n## 六、必须执行的 5 大实战防崩补丁\n\n1. **补丁1 多主体空间分区与口型排他锁**：≥2 个 `@人物` 同框必须写物理空间象限+体型差（`画面左侧三分之一处为成年女性@李梅，右侧三分之二处为孩童@张三`）；多人仅一人说话必须显式写\"说话者张嘴 + 倾听者闭嘴\"。\n2. **补丁2 画幅自适应开关**：单集顶部标注 `画幅制式：16:9/9:16`；9:16 禁用横向铺开构图，强制前中后大纵深叠压 / 上下高低机位对角线 / 竖屏紧凑过肩正反打。\n3. **补丁3 项目级 `@画风锁` 全局常量**：资产文档顶部定义不可篡改字符串，所有 Prompt 编译末尾一致挂载，杜绝画风漂移。\n4. **补丁4 双管线分流**：`模式A（原生音画同出，即梦Seedance/可灵/MiniMax H3 直出对白）` 写明台词+语气+张嘴动作；`模式B（无声视频+后期克隆音频对口型，ComfyUI/MiniMax视频+LatentSync/剪映对口型）` 强制写\"嘴唇保持自然闭合或极轻微闭合微动（预留后期Lip-Sync口型合成干净基底）\"。\n5. **补丁5 标准化 ```prompt 代码块**：所有过审 Prompt 用代码块包裹，支持一键复制与正则批量提取自动化跑图。\n\n---\n\n## 七、产出文档硬性格式（详见 workspace/ 示范）\n\n- `workspace/重要资产图片提示词.md`：画风锁 → 人物（主图+正侧背三视图+表情矩阵+面部特写+全身立绘+音色克隆卡）→ 场景（全景+空镜基准）→ 道具（三视图）；每条 Prompt 附评分（≥9.0）+生图建议+复盘占位。\n- `workspace/episodes/第NN集_视频生成提示词.md`：顶部 `<details>` 折叠（剧本+分镜总说明）→ 逐分镜（前置资源生图 Prompt+评分 → 秒级视频 Prompt+评分 → 剪映剪辑调音建议 → 复盘占位）→ 整集剪辑建议 → 集末 State Diff 快照。\n- 提示词内人物/场景/道具一律 `@资产中文名称` 引用（对照资产注册表）。\n\n## 八、复盘自进化触发机制\n\n1. 用户在任何 Prompt 下的 `Prompt 实际产出复盘：` 处填写实测效果与翻车现象。\n2. 下一轮对话开始时，总控扫描产出文档中的非空复盘字段 → 自动激活 R9。\n3. R9 流程：归因（匹配黑名单 17 类或立新编号）→ 定策（修订黑名单/KB_09/KB_10/对应 plat_*）→ 执行写入 → 向用户汇报优化清单。\n4. 高频崩坏（同类 ≥3 次）自动升级为 KB_10 一票否决题。\n\n## 九、跨平台兼容声明\n\n- **ZCode / Trae / WorkBuddy**：均以根目录 `AGENTS.md` 为路由入口（三平台都支持项目级 agents/AGENTS 指令文件加载）。\n- **上下文节约**：KB 与 Skill 严格按需读取；单次任务建议最多同时挂载 1 个平台插件 + 2 个 KB。\n- **语法防污染**：多平台混用时，每条 Prompt 只允许挂载一个平台的语法特征；需要对比时分别输出独立代码块并标注平台名。"}]},{"g":"KB 工具书 · 12 册","items":[{"p":"kb_library/KB_01_角色设计规范.md","t":"KB_01 角色设计规范词典（高密度工业速查版）","d":"","raw":"# KB_01 角色设计规范词典（高密度工业速查版）\n\n> 用途：编剧与美术创建/迭代角色的\"查表标准\"。所有人物必须先用本词典定义原型与记忆点，再进 KB_02（面部）与 KB_03（服装）具体化。\n> 铁律：性格必须\"外化\"为可视特征——观众 3 秒能读懂的人物，才是 AI 可生成的人物。\n> 词条统计：原型 20 ｜ 性格外化 12 组 36 词 ｜ 年龄 6 档 24 词 ｜ 记忆点 32 词条 ｜ 关系 12 型 ｜ 潜台词公式 1 套。\n\n---\n\n## 一、角色原型库（20 型 · 每型含视觉外化方向）\n\n| # | 原型 | 核心欲望 | 静态视觉外化 | 动态视觉外化 | 适配题材 |\n|---|---|---|---|---|---|\n| 01 | 天选救世主 | 肩负使命 | 磨损装备+坚定眼+风尘仆仆 | 挺身挡在人前 | 玄幻/末世 |\n| 02 | 隐忍复仇者 | 讨回公道 | 深色劲装+旧伤疤+束发利落 | 深呼吸压肩、指节泛白 | 玄幻/都市 |\n| 03 | 腹黑权谋者 | 掌控一切 | 华服高领+半眯眼+指尖动作多 | 缓慢踱步后驻足 | 古装/宫斗 |\n| 04 | 傲娇千金少爷 | 被看见 | 鲜艳名牌+抱臂+撇嘴 | 跺脚转身又偷瞄 | 都市/校园 |\n| 05 | 温柔守护者 | 守护所爱 | 暖色针织+随身旧物 | 蹲身平视、轻抚 | 都市温情 |\n| 06 | 蛰伏扫地僧 | 大隐于市 | 粗布衣+老茧手+浑浊眼 | 随手一挡举重若轻 | 武侠 |\n| 07 | 天真引路者 | 被满足 | 明亮纯色童装+仰头拽衣角 | 蹦跳、原地转圈 | 全题材 |\n| 08 | 悲情白月光 | 被记住 | 浅色长裙+逆光+回眸定格 | 缓步远离不回头 | 全题材 |\n| 09 | 疯批美人 | 毁灭与爱共舞 | 红黑撞色+不对称发饰 | 笑中带泪、贴面逼近 | 悬疑/复仇 |\n| 10 | 冷面教官 | 铸造强者 | 制服笔挺+疤+短促手势 | 背手踱步、突然点名 | 军事/修真 |\n| 11 | 市井小人物 | 过好今天 | 围裙油渍+大嗓门手势 | 擦手、算账、拍腿 | 烟火剧 |\n| 12 | 落魄贵公子 | 重拾尊严 | 旧呢大衣+挺直的背+擦亮的旧皮鞋 | 掸灰、正衣领 | 民国/都市 |\n| 13 | 病娇守护灵 | 唯一归属 | 影子感构图+过近距离 | 无声出现身后 | 悬疑 |\n| 14 | 硬核科学家 | 求真 | 皱白大褂+乱发+灼痕 | 推眼镜、疾书记写 | 科幻 |\n| 15 | 浪子剑客 | 自由 | 破斗篷+酒葫芦+半睁眼 | 拍坛畅饮、甩剑归鞘 | 武侠 |\n| 16 | 反派枭雄 | 重塑秩序 | 高领黑袍+背光站位 | 负手观局、缓缓鼓掌 | 全题材 |\n| 17 | 元气少女 | 被喜欢 | 亮色百褶裙+双马尾+书包挂饰 | 奔跑挥手、比心(简化手势) | 校园/日常 |\n| 18 | 忧郁艺术家 | 被理解 | 黑色高领+颜料渍+瘦削 | 伏案、望窗外出神 | 文艺 |\n| 19 | 铁腕女强人 | 证明自己 | 剪裁利落西装+盘发+腕表 | 敲桌定案、抬下巴 | 都市职场 |\n| 20 | 憨厚力士 | 被需要 | 宽大背心+护腕+憨笑 | 挠头、拍胸脯 | 全题材 |\n\n## 二、性格外化特征表（12 内核 × 静态/动态/微表情三列）\n\n| 性格内核 | 静态外化（生图可用） | 动态外化（生视频可用） | 微表情链（KB_02 五节联动） |\n|---|---|---|---|\n| 隐忍克制 | 拳收袖中、下颌绷紧 | 深呼吸肩部微沉、指节泛白 | 单侧嘴角冷笑→眼神下压后抬 |\n| 天真烂漫 | 踮脚、双手背后 | 蹦跳步态、原地转圈 | 眼睛瞪圆→嘴角咧开露牙 |\n| 温柔坚定 | 抱物于胸前、身体前倾 | 轻抚、蹲下平视 | 眼睛弯月→先笑后叹 |\n| 阴鸷算计 | 指尖敲桌、侧身半脸 | 缓慢踱步、突然驻足 | 眼睑半垂→瞳孔不移 |\n| 暴烈冲动 | 衣襟半敞、青筋 | 拍桌、掀翻、大步逼近 | 眉骨紧锁→鼻翼扇动 |\n| 懦弱犹疑 | 缩肩、抓衣角 | 后退半步、欲言又止 | 眼神游移→抿唇 |\n| 骄傲矜持 | 下巴微抬、双手交叠 | 转身背对、斜眼回瞟 | 眼梢上挑→嘴角单侧轻哼 |\n| 母性包容 | 围裙/护子站位 | 张臂护住、俯身搂抱 | 眉眼舒展→含泪笑 |\n| 油滑市侩 | 点头哈腰、袖手 | 搓手、递烟(改递物) | 挤眼→笑纹堆起 |\n| 沉默寡言 | 帽檐压低、侧身 | 只用手势应答、点头 | 嘴唇紧抿→眼神示意 |\n|偏执疯狂 | 瞳孔失焦、乱发 | 反复摩挲单物、自语 | 盯物不眨→突然咧嘴 |\n| 江湖义气 | 拍胸配刀、敞怀 | 拍肩、抛物给兄弟 | 眉飞色舞→正色抱拳 |\n\n## 三、年龄感设计规范（6 档 × 骨相/皮肤/禁用词）\n\n| 年龄段 | 骨相特征词 | 皮肤质感词 | 禁用词（防跨龄漂移） |\n|---|---|---|---|\n| 婴幼儿(0-3) | 头身比1:3.5~4、囟门感、乳发 | 吹弹可破、奶胖 | 任何骨相棱角词 |\n| 幼儿(3-6) | 头身比1:4~4.5、婴儿肥脸颊、大圆眼占比大 | 婴儿肥、透红 | \"成熟眼神\"\"九头身\" |\n| 少年(12-16) | 骨相未长开、圆润带初棱角、喉结未显 | 少年感、清爽 | \"锋利下颌线\"\"风霜\" |\n| 青年(18-28) | 下颌线清晰、胶原饱满、喉结利落 | 细腻光泽、纹理细腻 | \"皱纹\"\"松弛\"\"老年斑\" |\n| 中年(35-50) | 法令纹、眉间纹、下颌缘微垂 | 眼角细纹、皮肤纹理真实 | \"婴儿肥\"\"胶原蛋白满满\" |\n| 老年(60+) | 颧骨突出、眼窝深陷、白发、耳垂长 | 深皱纹、老年斑、松弛 | \"紧致\"\"饱满苹果肌\" |\n\n## 四、人设记忆点词库（32 词条 · 四大类，每人选 1主1备，全剧不重复）\n\n| 类别 | 词条（均为\"可特写拍摄+连前史\"级） |\n|---|---|\n| 疤痕体征类(8) | 左手虎口旧疤、右眉断眉、锁骨烫疤、耳后胎记(朱砂色)、掌心老茧、小腿旧枪伤、指节磨痕、眼角泪痣 |\n| 随身旧物类(8) | 停摆怀表(针停3:07)、母亲遗物红绳、缺角玉佩、军牌一对(一枚缺失)、旧照片对折痕、缠布旧酒壶、断齿木梳、褪色平安符 |\n| 服饰细节类(8) | 唯一白衬衫(领口补丁)、永不系的鞋带、剑柄暗红绫布、缝错位的纽扣、袖口藏小刀、帽上小熊耳朵、半旧工牌、单边耳骨钉 |\n| 动作口癖类(8) | 冷笑只扯单侧嘴角、思考时摩挲戒指、说话前先吸气半口、紧张时压帽檐、答应时眨两下眼、开战前活动左腕、撒谎摸耳垂、想你时望东南窗 |\n\n**记忆点四律**：可视化(特写可拍)｜可叙事(连前史)｜可复现(进注册表摘要)｜不冲突(全剧唯一)。\n\n## 五、人物关系词库（12 型 · 三角填写用）\n\n| 关系型 | 表面关系示例 | 真实关系示例 | 变化方向示例 |\n|---|---|---|---|\n| 母子 | 日常照料 | 相依为命的共谋 | 隐瞒→共担 |\n| 宿敌 | 大比对手 | 杀亲仇人之徒 | 轻视→忌惮→了结 |\n| 师徒 | 传艺授业 | 替代父子 | 严苛→托付 |\n| 挚友 | 同门并肩 | 过命之交 | 并肩→分道→重逢 |\n| 恋人(甜) | 欢喜冤家 | 双向暗恋 | 试探→表白 |\n| 恋人(虐) | 契约夫妻 | 各怀目的 | 利用→沦陷→抉择 |\n| 主仆 | 忠心侍奉 | 隐藏的血缘 | 伺机→相认 |\n| 竞争 | 同期对手 | 互相成就的镜子 | 敌意→惺惺相惜 |\n| 破镜 | 离异前侣 | 未放下的亏欠 | 回避→和解/诀别 |\n| 忘年 | 邻里忘年交 | 互为救赎 | 旁观→挺身 |\n| 群像兄弟 | 排行义气 | 利益与情义拉扯 | 聚义→离散 |\n| 猎人与猎物 | 追查者与嫌疑人 | 身份倒置 | 追捕→并肩(真相) |\n\n## 六、潜台词三层转化公式（含 6 组速查示例）\n\n```text\n公式 = 台词字面(≤15字) + 潜台词(只进剧本备注) + 外化动作(先做什么/说到哪个字做什么/说完留什么表情)\n```\n| 台词字面 | 潜台词 | 外化动作 |\n|---|---|---|\n| \"等爸爸回来给你买\" | 家里不宽裕但不想你早懂事 | 蹲身平视→理帽檐→说\"等爸爸\"时眼神先亮后垂→手多停半秒 |\n| \"我今日登台\" | 讨公道而非夺名 | 负剑缓步→立定不语三秒→抬眼扫视→低声开口 |\n| \"你来了\" | 等了很久假装刚到 | 背对不回头→手停一拍→侧半脸 |\n| \"吃了吗\" | 想留你多坐一会 | 递碗筷多一副→拉凳→瞟门口 |\n| \"我没哭\" | 别拆穿我 | 抹脸→仰头眨眼→笑得用力 |\n| \"随便你\" | 你敢再走一步试试 | 抱臂→别开脸→指尖掐进手臂 |\n\n## 七、台词经济学规范\n\n- 单句 ≤15 字为佳；5 秒镜台词 ≤20 字（4字/秒，联动 NARR-03）。\n- 台词三禁：禁心理独白入画面｜禁无主语长句｜禁书面语（\"我认为此事欠妥\"→\"不行\"）。"},{"p":"kb_library/KB_02_人体与面部设计.md","t":"KB_02 人体与面部设计词典（高密度工业速查版）","d":"","raw":"# KB_02 人体与面部设计词典（高密度工业速查版）\n\n> 用途：人物外貌描写的唯一权威词库。同一角色的\"外貌锁定摘要\"一经登记，所有 Prompt 必须逐字复用本典词条（换词=换脸）。\n> 词条统计：体型 8 ｜ 脸型 12 ｜ 下颌颧骨 10 ｜ 眉 10 ｜ 眼型瞳色眼神 30 ｜ 鼻唇耳 20 ｜ 发型发色发饰 44 ｜ 皮肤手部 20 ｜ 微表情链 8 组 —— **合计 150+ 词条**。\n\n---\n\n## 一、头身比与体型词典（8 型）\n\n| 体型代码 | 描述词组 | 适用 |\n|---|---|---|\n| 婴幼儿比例 | 头身比1:3.5~4、圆润短四肢 | 0~3 岁 |\n| 幼儿比例 | 头身比1:4~4.5、圆润短四肢、小翘鼻 | 3~6 岁孩童（如@张三） |\n| 少年比例 | 头身比1:6.5、肩窄、四肢修长感初显 | 10~15 岁 |\n| 标准成人女 | 头身比1:7、肩宽约1.5头宽、腰臀曲线柔和 | 都市女性 |\n| 标准成人男 | 头身比1:7.5、肩宽约2头宽、倒三角微显 | 都市男性 |\n| 修长英气男 | 头身比1:8~9（九头身）、肩宽腰窄、长腿 | 玄幻剑修/模特感（如@林烬） |\n| 健硕壮汉 | 头身比1:7、虎背熊腰、脖颈粗 | 武将/保镖 |\n| 佝偻老者 | 头身比1:6、脊柱微弓、关节突出 | 老年角色 |\n\n**体型差速记（多人同框防串色）**：身高差写具体数值（\"母亲一米六五，孩童一米一，差约半米\"）优于\"一大一小\"。\n\n## 二、脸型与骨相词典（22 词条）\n\n| 维度 | 词条（同角色锁定后禁换同义词） |\n|---|---|\n| 脸型(12) | 鹅蛋脸、瓜子脸、方脸、国字脸、圆脸、娃娃脸(圆+婴儿肥)、心形脸、长脸、由字脸(下宽)、申字脸(中宽)、甲字脸(上宽)、梨形脸 |\n| 下颌线(6) | 锋利清晰、流畅柔和、方正刚硬、微垂圆润、窄而下收、宽而下颌角外扩 |\n| 颧骨与额头(4) | 颧骨微高立体、颧骨柔和平缓、额头饱满圆润、额头平整微窄 |\n\n## 三、眉部词典（10 词条）\n\n剑眉入鬓、剑眉星目、柳叶细眉、卧蚕眉、刀眉浓黑、新月眉、远山眉(淡而弯)、英气挑眉、八字愁眉、断眉(右眉中间缺口)。\n\n## 四、眼部词典（30 词条：眼型10+瞳色8+眼神12）\n\n| 维度 | 词条 |\n|---|---|\n| 眼型(10) | 丹凤眼(眼尾微挑)、杏眼、桃花眼、瑞凤眼、下垂眼(无辜)、眯缝眼、圆杏眼(孩童)、吊梢眼、深窝眼(欧式)、狭长眼 |\n| 瞳色(8) | 漆黑深邃、深棕、琥珀棕、墨绿、灰蓝、浅茶、玄金瞳(玄幻)、赤瞳(玄幻) |\n| 眼神-静态(6) | 静水深流、清冷疏离、温润含笑、锐利如鹰、懵懂清澈、疲惫涣散 |\n| 眼神-转变(6) | 从错愕转为狠戾、由暗淡重新点亮、笑意从眼底漫出、警觉地眯起、怒意凝成一点、光缓缓熄灭 |\n| 睫毛(4) | 浓密纤长、根根分明、长而微翘(孩童强调)、下睫明显 |\n\n## 五、鼻·唇·耳词典（20 词条）\n\n| 维度 | 词条 |\n|---|---|\n| 鼻型(8) | 鼻梁高挺笔直、秀气微翘、鼻头圆润、鹰钩鼻、山根低平、直鼻窄翼、小翘鼻(孩童)、剑鼻(骨感明显) |\n| 唇形(8) | 薄唇微抿、唇形饱满、M唇峰明显、嘴角微上扬、嘴角下垂、樱桃小口、厚唇大气、唇色淡(病弱感) |\n| 耳部(4) | 耳垂厚润(福相)、精灵尖耳(奇幻)、耳骨钉单边、招风耳(喜剧) |\n\n## 六、发型发色发饰词典（44 词条）\n\n| 维度 | 词条 |\n|---|---|\n| 长度造型(12) | 黑色长发束高马尾、低马尾、半扎发、丸子头、垂顺长直发、齐肩微卷发、黑色短碎发、利落短发、复古手推波纹、脏辫、板寸、双马尾(少女) |\n| 刘海碎发(8) | 齐刘海、空气刘海、中分、侧分37、额前两缕碎发、微翘呆毛(孩童)、龙须刘海、无露额 |\n| 发色(10) | 乌黑、栗色、亚麻金、银白、酒红、深灰蓝、渐变墨蓝(玄幻)、挑染金棕、自然黑棕、花白(中老) |\n| 发质(6) | 垂顺有光泽、蓬松微卷、粗硬直立、细软贴头、毛躁分叉(落魄)、油亮健康 |\n| 发饰(8) | 素色发夹、白玉簪、银链发带、红绳、珠钗、贝雷帽压发、运动发带、断发带(战损派生钩子) |\n\n## 七、皮肤与手部词典（20 词条）\n\n| 维度 | 词条 |\n|---|---|\n| 皮肤质感(12) | 细腻光泽、皮肤纹理细腻真实、哑光健康、冷白皮瓷感、暖黄皮通透、麦色油亮、婴儿肥透红、苍白如纸(病弱)、风吹微红、晒痕分层、毛孔可见(写实)、伤痕覆盖 |\n| 汗泪湿态(4) | 额角薄汗、泪痕未干、鼻尖冒汗、雨湿贴额 |\n| 手部(4·高危区从严) | 五指自然并拢、单手握拳、指节泛白(用力)、虎口旧疤；**严禁**\"十指交叉/复杂比心\"(崩坏02) |\n\n## 八、微表情神态词典（8 大情绪 × 四相递进链 · 视频秒级节点专用）\n\n| 情绪 | 基准相→触发相→过渡相→定格相（按秒展开） |\n|---|---|\n| 喜 | 平静含笑 → 嘴角先单侧上扬 → 眼睛弯成月牙+露齿 → 笑出声肩部轻颤 |\n| 怒 | 平静 → 眉骨紧锁+鼻翼扇动 → 咬紧牙关下颌绷出棱角 → 瞳孔收缩定住 |\n| 哀 | 平静 → 睫毛颤动垂下 → 嘴角向下微抿+眼眶泛泪光 → 一滴泪滑落 |\n| 惧 | 平静 → 瞳孔骤缩+倒吸凉气微张嘴 → 后缩半步 → 手指攥紧衣角 |\n| 冷笑 | 平静 → 只扯单侧嘴角 → 眼神下压再缓缓抬起 → 鼻息轻嗤收势 |\n| 惊 | 平静 → 眼睛瞪圆+微张嘴倒吸 → 定格两秒 → 缓缓恢复眨眼一次 |\n| 温柔安慰 | 平静 → 先弯眼笑 → 伸手轻抚+语气放软尾音上扬 → 眼神先亮后垂(克制的爱) |\n| 渴望(孩童) | 平静 → 眼睛瞪圆紧盯+舔嘴唇 → 咽口水喉头微动 → 拽衣角仰头 |\n\n**眨眼规范**：特写 ≥3 秒必标\"眨眼频率自然，约三秒一次轻微眨眼\"（防崩坏15：死鱼眼/高频抽搐）。\n\n## 九、角色外貌锁定摘要模板（写入资产注册表的唯一格式）\n\n```text\n@资产名｜年龄段｜头身比｜脸型+下颌线｜眉+眼型瞳色｜鼻+唇｜发型发色发饰｜肤色质感｜穿搭索引(KB_03编号)｜记忆点2个｜禁用词(易混淆特征)\n```\n**示例(@林烬)**：`青年22岁｜九头身｜鹅蛋脸下颌线锋利｜剑眉+丹凤眼漆黑瞳｜鼻梁高挺+薄唇微抿｜黑长发高马尾额前两缕碎发｜冷白皮细腻｜GX-01玄黑劲装｜左手虎口旧疤+单侧嘴角冷笑｜禁用\"笑容灿烂/圆润脸\"`\n**换词红线**：锁定后\"杏眼\"不得改\"桃花眼\"、\"栗色\"不得改\"棕色\"——一律回查本典原词条逐字复用。"},{"p":"kb_library/KB_03_服装与装备设计.md","t":"KB_03 服装与装备设计词典（高密度工业速查版）","d":"","raw":"# KB_03 服装与装备设计词典（高密度工业速查版）\n\n> 用途：人物穿搭与道具结构的结构化词库。服装描写必须\"版型+面料(KB_04)+配色(KB_04)+工艺细节\"四件套齐全——缺件即跨镜换装。\n> 编号规则：题材代码-序号（GX古风玄幻/DS都市/KH科幻/MQ民国/XY校园/SH市井）。\n> 词条统计：套装 38 ｜ 部件剪裁 46 ｜ 配饰 24 ｜ 道具 10 ｜ 战损 9 ｜ 穿搭层次组合示例 6 —— **合计 120+ 词条**。\n\n---\n\n## 一、题材套装库（38 套 · 每套四件套齐备）\n\n### 古风玄幻 GX（10 套）\n\n| 编号 | 套装名 | 版型 | 面料 | 配色 | 工艺细节 |\n|---|---|---|---|---|---|\n| GX-01 | 玄黑剑修正装(@林烬) | 窄袖劲装+立领+腰封 | 玄铁锦缎 | 玄黑+银线 | 银线云纹暗绣、皮甲缚带收小臂、墨玉扣 |\n| GX-02 | 白鹤道袍 | 交领大袖+腰间丝绦 | 香云纱 | 月白+黛青 | 领缘青色滚边、暗纹提花 |\n| GX-03 | 宗门弟子服 | 圆领袍+束革带 | 粗缎 | 靛蓝+皂色 | 袖口宗门徽记刺绣 |\n| GX-04 | 战甲将军袍 | 鱼鳞甲+护肩兽吞+战裙 | 甲片+内衬织锦 | 玄铁黑+鎏金 | 红缨盔缨、甲片错金 |\n| GX-05 | 女修纱裙 | 齐胸襦裙+披帛+广袖 | 云雾纱 | 藕荷+月白 | 银丝暗绣流云、裙摆渐变晕染 |\n| GX-06 | 魔道黑袍 | 高领连帽大氅 | 重缎 | 墨黑+暗红 | 暗红衬里、银线符纹锁边 |\n| GX-07 | 剑庐布衣 | 粗麻对襟+绑腿 | 粗麻 | 灰白 | 补丁两处、袖口磨毛 |\n| GX-08 | 女帝朝服 | 交领大衫+霞帔+冕旒 | 妆花缎 | 玄金+茜红 | 金线日月纹、垂珠十二旒 |\n| GX-09 | 游侠劲装 | 短打+护腕+束袖 | 皮革+细布 | 棕褐 | 皮带扣、绑带十字缠 |\n| GX-10 | 少宗主礼服 | 直裾深衣+大带+玉佩绶 | 提花锦 | 玄青 | 绶带玉璜、暗纹星辰 |\n\n### 现代都市 DS（10 套）\n\n| 编号 | 套装名 | 版型 | 面料 | 配色 | 工艺细节 |\n|---|---|---|---|---|---|\n| DS-01 | 温柔母亲装(@李梅) | 针织开衫+A字连衣裙 | 罗纹针织 | 米白+浅杏 | 小圆领、罗纹袖口、托特包斜挎 |\n| DS-02 | 童装卫衣(@张三) | 连帽套头+落肩宽松+直筒裤 | 摇粒绒 | 天蓝+深灰 | 帽上小熊耳朵、袖口罗纹 |\n| DS-03 | 商务精英 | 修身西装+戗驳领+直筒裤 | 精纺羊毛 | 炭灰+白 | 双排扣、袖扣、口袋巾 |\n| DS-04 | 街头少年 | Oversize卫衣+工装裤+板鞋 | 华夫布 | 黑+荧光橙 | 印花、抽绳、多口袋 |\n| DS-05 | 市井摊主 | 围裙+挽袖衬衫+胶靴 | 涤棉 | 藏蓝 | 油渍做旧、毛巾搭肩 |\n| DS-06 | 大学生日常 | 卫衣+牛仔裤+帆布鞋 | 棉 | 燕麦色+浅蓝 | 帽绳、膝盖磨白 |\n| DS-07 | 急诊医生 | 白大褂+刷手服 | 抗菌面料 | 白+深绿 | 胸牌、口袋笔、听诊器 |\n| DS-08 | 律政佳人 | 西装套裙+丝巾 | 三醋酸 | 藏青+香槟 | 腰带扣、真丝巾印花 |\n| DS-09 | 外卖骑手 | 骑手服+护膝+头盔 | 防风面料 | 黄+黑 | 反光条、箱体贴标 |\n| DS-10 | 居家休闲 | 针织开衫+阔腿裤 | 毛圈布 | 燕麦灰 | 抽绳、口袋滚边 |\n\n### 科幻机能 KH（6 套）\n\n| 编号 | 套装名 | 版型 | 面料 | 配色 | 工艺细节 |\n|---|---|---|---|---|---|\n| KH-01 | 义体特工 | 机能马甲+磁吸护臂+束脚战术裤 | 复合尼龙 | 曜石黑+电光蓝 | 导 ) | 左肩衣摆撕裂口、膝盖磨破、发带断裂散发+脸颊一道血痕 |\n| 重度(3) | 左肩衣袍撕裂渗血、半身焦痕、断剑缺口扩大+绫布碳化 |\n\n**规则**：派生资产(`@林烬战损`)登记后才能上镜；战损只增不减，重置须剧本事件。\n\n## 六、穿搭层次组合示例（6 组 · 三层拆解示范）\n\n| 角色 | 基底层 | 中间层 | 点缀层 | 视频防崩备注 |\n|---|---|---|---|---|\n| @李梅 | 浅杏连衣裙 | 米白针织开衫 | 帆布托特包+素色发夹 | 层次3层→奔跑镜禁用 |\n| @林烬 | 玄黑劲装本体 | 皮甲缚带(小臂) | 墨玉扣+背负断剑 | 宽袖镜加\"袖口与手腕分离清晰\" |\n| @张三 | 深灰长裤+T恤 | 天蓝连帽卫衣 | 小熊耳帽+黄雨靴 | 幼儿比例锁定防成人化 |\n| 商务精英 | 白衬衫 | 炭灰西装 | 袖扣+口袋巾 | 三层叠穿→视频降速 |\n| 魔道黑袍 | 暗红衬里中衣 | 墨黑大氅 | 银线符纹锁边 | 大氅+高动作→衣摆分离描述 |\n| 拾荒者 | 土棕内层 | 锈橙拼接斗篷 | 滤罐面罩+绑带 | 多层围裹→静态镜为主 |\n\n## 七、着装防崩八律\n\n1. 宽袍大袖+大动作必加\"衣袂随动作自然摆动，袖口与手腕分离清晰\"（崩坏08）。\n2. 裙装奔跑改\"裙摆扬起弧度自然\"（崩坏14）。\n3. 连帽衫帽子状态(戴起/未戴)跨镜显式声明。\n4. 层次 ≥3 层的穿搭视频镜头降速。\n5. 围巾/披风类强风镜写\"随风单侧飘起\"防裹缠。\n6. 金属配饰(甲片/徽章)写\"静态缝制贴附，不旋转\"（崩坏18 前置）。\n7. 鞋履特写与全身镜鞋款一致（注册表摘要含鞋）。\n8. 战损派生按五节三要素写，缺侧别=场记打回。"},{"p":"kb_library/KB_04_材质与色彩设计.md","t":"KB_04 材质与色彩设计词典（高密度工业速查版）","d":"","raw":"# KB_04 材质与色彩设计词典（高密度工业速查版）\n\n> 用途：材质质感词与色彩脚本的权威来源。豆包 Seedream 对本典中文光影/材质术语直响应，可直接编译进 Prompt。\n> 词条统计：织物 14 ｜ 金属玉石石木玻 26 ｜ 自然介质 12 ｜ 光影术语 26 ｜ 情绪色板 12 ｜ 60-30-10 方案 10 ｜ 色彩连续性 6 律 —— **合计 100+ 词条**。\n\n---\n\n## 一、织物材质词典（14 词条）\n\n| 材质 | 质感描述词 | 光影表现 | 适用 |\n|---|---|---|---|\n| 真丝 | 垂坠流淌、镜面般柔光 | 高光滑移、珍珠光泽 | 礼服/旗袍 |\n| 香云纱 | 挺括哑光、暗纹起伏 | 低反射、古朴素雅 | 道袍 |\n| 粗麻 | 布面粗粝、纤维肌理可见 | 漫反射、哑光 | 布衣/斗篷 |\n| 针织 | 罗纹起伏、毛绒感 | 柔和漫射、无高光 | 开衫(如@李梅) |\n| 皮革 | 光滑微亮、弯折起细纹 | 局部镜面高光 | 夹克/护具 |\n| 呢料 | 厚实紧密、表面绒毛 | 极哑光、吸光 | 大衣 |\n| 玄铁锦缎 | 缎面暗纹、冷光内蕴 | 定向微反光 | GX-01劲装 |\n| 摇粒绒 | 颗粒绒面、蓬松 | 全漫射 | 童卫衣 |\n| 欧根纱 | 半透轻盈、层叠透色 | 透光发亮 | 女修披帛 |\n| 灯芯绒 | 条绒沟壑、温润 | 侧光条纹高光 | 休闲裤 |\n| 牛仔 | 斜纹粗织、磨白渐变 | 哑光+磨白漫射 | 日常 |\n| 天鹅绒 | 立绒深邃、随角变色 | 边缘轮廓光佳 | 礼服/幕布 |\n| 华夫布 | 蜂窝纹理、透气感 | 微漫射 | 卫衣 |\n| 妆花缎 | 金银线交织、富贵 | 定向闪缎 | 女帝朝服 |\n\n## 二、硬质材质词典（26 词条）\n\n| 类别 | 词条（材质+质感描述） |\n|---|---|\n| 金属-铁器(4) | 玄铁(乌沉无光+锻打纹理)、精钢(寒光凛冽+镜面打磨)、生铁(粗糙铸痕+锈斑)、陨铁(暗纹流转+微蓝光) |\n| 金属-贵金属(4) | 鎏金(温润+斑驳做旧)、白银(冷亮+柔反射)、黄铜(暖哑光+包浆)、白金(冷白+锐利高光) |\n| 玉石(4) | 白玉(温润通透+糯感内光)、翡翠(水头足+翠色分层)、玛瑙(条纹晕染+蜡光)、黑曜石(纯黑+贝壳状断口反光) |\n| 石材(4) | 青石(粗粝多孔+风化痕)、大理石(云纹+抛光镜面)、花岗岩(颗粒致密+哑光)、鹅卵石(圆润+湿反光) |\n| 木质(4) | 老榆木(开裂+包浆)、紫檀(深红致密+缎光)、竹材(节理+清漆微光)、碳化木(黑哑+龟裂) |\n| 其他(6) | 陶瓦(哑光粗糙+釉面剥落)、玻璃(通透折射+边缘冷光)、瓷器(釉面如镜+胎质温润)、混凝土(毛孔+冷灰)、橡胶(哑光弹性质感)、纸(纤维纹理+透光) |\n\n## 三、自然介质词典（12 词条 · 流体从严）\n\n| 类别 | 词条（安全描述写法） |\n|---|---|\n| 水-静态(3) | 水面如镜倒影、雨后湿反光地面、杯中水微漾 |\n| 水-动态(2) | 细雨飘落丝线感、水流倾注拉出弧线(表面张力) |\n| 水汽(3) | 白雾蒸腾自锅沿翻涌、薄雾漫过石板路、氤氲热气模糊轮廓 |\n| 火(2) | 烛火摇曳映瞳、余烬暗红微光(非明焰) |\n| 尘土(2) | 落地尘土轻扬弥散、光柱中浮尘缓浮 |\n\n**流体红线**：瓢泼大雨/海啸/泼溅=崩坏14 高危——降复杂度(细雨/涟漪)或 B 级静态图+剪映粒子层。\n\n## 四、光影术语词典（26 词条 · 豆包直响应核实版）\n\n| 类别 | 词条 | 用途 |\n|---|---|---|\n| 三点基础(3) | 主光、补光、轮廓光(Rim) | 一切布光骨架 |\n| 人像高级(8) | 伦勃朗光(单侧三角)、分割光(左右对分)、环形光/蝴蝶光(鼻下小环)、鳄鱼光(上下夹光)、侧逆光镶金边、顶光压抑、底光惊悚、宽光/窄光(胖瘦控制) | 人像/特写 |\n| 氛围(8) | 丁达尔体积光柱、体积光弥散、逆光剪影、边缘轮廓光、窗格投影、树影斑驳、水面反光粼粼、雾中光晕 | 场景氛围 |\n| 色温(7) | 冷青蓝(压抑/神性)、暖金橙(温情/黄昏)、青橙对撞(电影感)、烛光暖黄、月光冷白、霓虹紫粉、正午白亮 | 全局基调 |\n\n## 五、色彩心理学词库（12 情绪色板）\n\n| 情绪目标 | 主色相 60% | 辅助 30% | 点缀 10% | 适用场景 |\n|---|---|---|---|---|\n| 压迫威严 | 冷青蓝/玄黑 | 灰蓝 | 剑气银白 | 压场/殿宇 |\n| 温情治愈 | 暖金橙/米白 | 浅杏 | 白雾暖黄 | 母子/家 |\n| 复仇危险 | 深红/黑 | 暗金 | 余烬红 | 复仇线 |\n| 纯真童年 | 天蓝/明黄 | 白 | 小熊棕 | 孩童 |\n| 悬疑诡谲 | 墨绿/紫黑 | 冷灰 | 单点暖光 | 夜巷 |\n| 爽感爆发 | 金红 | 白热 | 电光蓝 | 突破/觉醒 |\n| 清冷仙气 | 月白/淡青 | 云灰 | 樱粉 | 仙门 |\n| 热血战场 | 铁灰/火橙 | 焦土棕 | 旗红 | 战争 |\n| 病弱忧郁 | 灰白/淡紫 | 冷蓝 | 枯黄 | 病榻 |\n| 市井烟火 | 暖褐/黄 | 青灰 | 灯笼红 | 街道 |\n| 赛博未来 | 霓虹蓝/紫 | 深灰 | 荧光绿 | 都市场 |\n| 回忆闪回 | 低饱和暖褐 | 褪色米 | 高光留白 | 记忆段 |\n\n## 六、60-30-10 配色公式与 10 套成品方案（可直接编译）\n\n**公式**：`60%主导色(基调)+30%辅助色(层次)+10%点缀色(钩子)`；编译句式：`画面以[色相]为主导（约六成），辅以[色相]（约三成），点缀[元素]（约一成）`。\n\n| # | 场景 | 60% | 30% | 10% | 编译句式成品 |\n|---|---|---|---|---|---|\n| 01 | @玄天宗比武台 | 冷青蓝天光 | 云海灰白+石质灰 | 符文银白高光 | \"冷青蓝主调天光为主导（约六成），辅以云海灰白与石质灰（约三成），符文银白高光点缀（约一成）\" |\n| 02 | @光大街边 | 暖金橙黄昏 | 梧桐绿荫+楼宇灰 | 白雾+暖黄灯串 | \"暖金橙黄昏主导（约六成），梧桐绿荫与楼宇灰（约三成），点缀蒸腾白雾与暖黄灯串（约一成）\" |\n| 03 | 深夜办公室 | 冷白顶灯 | 深灰桌面 | 屏幕蓝光 | 同构句式 |\n| 04 | 仙门晨练 | 月白晨雾 | 淡青山影 | 樱粉花瓣 | 同构句式 |\n| 05 | 地下停车场 | 灰绿顶灯 | 水泥灰 | 车灯红 | 同构句式 |\n| 06 | 婚礼现场 | 象牙白 | 香槟金 | 花门粉 | 同构句式 |\n| 07 | 废墟战场 | 焦土棕 | 铁灰 | 未熄火橙 | 同构句式 |\n| 08 | 病房 | 灰白 | 冷蓝床品 | 窗外枯黄一枝 | 同构句式 |\n| 09 | 霓虹夜市 | 紫粉霓虹 | 深灰雨夜 | 招牌荧光绿 | 同构句式 |\n| 10 | 回忆教室 | 低饱和暖褐 | 褪色米 | 尘埃金光一束 | 同构句式 |\n\n## 七、色彩连续性六律（场记核查项）\n\n1. 同场次色温锁定，正午/黄昏/夜不得中途跳变（烟火线锁黄昏金橙）。\n2. 人物服装主色不得与背景主导色同色相（防\"融化\"）。\n3. 60-30-10 写入分镜总说明，逐镜核对点缀色在场（丢失=画面变脏）。\n4. 首帧参考图生成的色彩脚本文字逐字复用（防色温漂移）。\n5. 双线剧两线色温对撞须声明，切换点 0.3s 交叉过渡（R8 执行）。\n6. 派生时段(夜景/雨天)按\"母场景+时段缀\"命名并单独出色彩方案（如@光大街边夜：靛蓝60+湿反光灰30+灯串暖10）。"},{"p":"kb_library/KB_05_视觉风格词典.md","t":"KB_05 视觉风格词典（高密度工业速查版）","d":"","raw":"# KB_05 视觉风格词典（高密度工业速查版）\n\n> 用途：全剧画风的唯一权威定义处。`@画风锁` 是项目级全局常量，定稿后全剧 Prompt 末尾逐字挂载，杜绝画风漂移。\n> 词条统计：流派 20 ｜ 渲染引擎 8 ｜ 画质词缀 12 ｜ 镜头感 10 ｜ 负向兜底 10 ｜ 成品画风锁 5 套 —— **合计 75+ 词条**。\n\n---\n\n## 一、画风流派词典（20 型 · 每型含核心描述词+渲染特征）\n\n| # | 流派 | 核心描述词（可直接入 Prompt） | 渲染特征 | 适配题材 |\n|---|---|---|---|---|\n| 01 | 电影级写实 | 电影级写实质感、皮肤纹理真实、浅景深 | 摄影光学感 | 都市/悬疑 |\n| 02 | 东方新国风写实厚涂 | 厚涂笔触、水墨晕染边缘、细腻织物纤维 | 手绘+渲染混合 | 玄幻/古风 |\n| 03 | 3D国漫渲染 | 3D卡通渲染、PBR材质、皮克斯式柔光 | 次世代游戏CG | 全龄漫剧 |\n| 04 | 赛璐璐动画 | 赛璐璐平涂上色、硬阴影分面、日式作画 | 二维动画 | 热血番 |\n| 05 | 韩漫厚涂 | 韩式厚涂、柔雾皮肤、高光锐利 | 插画感 | 都市言情 |\n| 06 | 水墨写意 | 留白意境、墨色浓淡五色、飞白笔触 | 国画 | 武侠意境 |\n| 07 | 工笔重彩 | 勾线填色、石青石绿、沥粉贴金 | 传统工笔 | 古装殿堂 |\n| 08 | 蒸汽朋克 | 黄铜齿轮、铆钉管线、维多利亚剪裁 | 做旧金属 | 奇幻冒险 |\n| 09 | 赛博朋克 | 霓虹雨夜、全息广告、高对比冷暖 | 反光湿地面 | 科幻 |\n| 10 | 吉卜力水彩 | 手绘水彩、云朵蓬松、绿意盎然 | 柔边水彩 | 治愈 |\n| 11 | 美漫粗线 | 粗描边、网点纸、肌肉夸张 | 版画感 | 超英 |\n| 12 | 低多边形 | Low Poly几何切面、单色渐变 | 极简 | 概念/片头 |\n| 13 | 黏土定格 | 黏土质感、指纹痕迹、微缩布景 | 定格动画 | 童趣 |\n| 14 | 黑白胶片 | 银盐颗粒、高反差、暗角 | 老电影 | 文艺/回忆 |\n| 15 | 青橙调色 | 青橙对撞、肤色橙保真、阴影青 | 达芬奇调色风 | 电影感通用 |\n| 16 | 港风霓虹 | 霓虹招牌雨、烟雾、复古颗粒 | 王家卫式 | 都市夜 |\n| 17 | 极简矢量 | 扁平矢量、大色块、无渐变 | 平面设计 | 片头/科普 |\n| 18 | 暗黑哥特 | 高对比暗部、烛光、巴洛克纹样 | 油画质感 | 哥特悬疑 |\n| 19 | 皮克斯写实卡通 | 柔光子表面、夸张比例、眼神高光双点 | 高级卡通渲染 | 合家欢 |\n| 20 | 废土写实 | 尘土蒙层、锈蚀做旧、硬日光 | 末世质感 | 末世 |\n\n## 二、渲染引擎感词缀（8 词条）\n\n`虚幻引擎5渲染`、`OC渲染`、`Blender Cycles光线追踪`、`Arnold全局光照`、`Redshift渲染`、`Octane渲染`、`Unity Toon Shader卡通着色`、` Mental Ray 老派CG`（3D 类流派选用其一，2D 流派禁用）。\n\n## 三、画质词缀词典（12 词条）\n\n| 类别 | 词条 |\n|---|---|\n| 分辨率(4) | 8K超高清、4K、2K、超精细细节 |\n| 品质(4) | 大师级构图、获奖短片质感、业界顶级概念设计、博物馆级完成度 |\n| 细节(2) | 微距级材质细节、毛发级刻画 |\n| 整体(2) | 高完成度无瑕疵、专业级色彩管理 |\n\n## 四、镜头感词缀词典（10 词条）\n\n`35mm胶片颗粒`、`浅景深大光圈`、`变形宽银幕镜头光晕`、`长焦压缩空间`、`广角畸变张力`、`微距探镜`、`手持呼吸感`、`斯坦尼康平滑`、`航拍上帝视角`、`水下折射视角`。\n\n## 五、负向兜底词条（10 · 进 KB_09 负向包）\n\n`低分辨率`、`模糊`、`崩坏`、`错误解剖`、`过饱和`、` JPG 压缩噪点`、`画风混杂`、`厚涂与平涂同框`、`过度磨皮`、`塑料感`。\n\n## 六、@画风锁 规范（结构公式 · 变更流程 · 例外条款）\n\n**结构公式**：\n```text\n@画风锁 = [流派与质感] + [细节颗粒度] + [光影氛围] + [影调色温] + [画质词缀]\n```\n**五律**：\n1. 定义后不可篡改；变更须美术+编剧双签，全局替换并通知未完成分集重编译，旧锁留档。\n2. 所有生图/生视频 Prompt 末尾逐字挂载（顺序：内容→构图→画风锁）。\n3. 资产锁定图例外条款：锁内\"光影氛围\"词替换为\"均匀漫射平光\"（KB_06 零光影优先），其余逐字保留。\n4. 分线追加缀独立声明（冷线/暖线），只追加不替换。\n5. 画风锁字符串登记《资产注册表》常量区，与分集文档顶部声明一致。\n\n## 七、五套成品画风锁（不同题材即取即用）\n\n| 题材 | 成品 @画风锁（逐字复制） | 分线追加缀示例 |\n|---|---|---|\n| 东方玄幻双线(本示范剧) | `电影级东方新国风写实厚涂质感，细腻皮肤纹理与织物纤维细节，volumetric 体积光氛围，高对比冷暖双色温影调，8K超高清画质，电影感构图` | 苍穹线`+冷青蓝主调+剑气银白高光`｜烟火线`+暖金橙主调+黄昏柔焦光晕` |\n| 都市温情单线 | `电影级写实质感，真实皮肤纹理与生活化场景细节，柔和自然光氛围，暖金橙低对比影调，4K超高清画质，细腻生活流构图` | 雨夜段`+青灰主调+橱窗暖光点缀` |\n| 3D合家欢漫剧 | `皮克斯式3D卡通渲染，PBR材质柔光子表面，明快柔光氛围，高饱和明快影调，8K超高清画质，夸张可爱的电影感构图` | 冒险段`+峡谷金光+飞天云海` |\n| 赛博悬疑 | `赛博朋克写实风格，霓虹湿反光与全息投影细节，体积雾夜氛围，青紫霓虹高对比影调，8K超高清画质，黑色电影构图` | 白日线`+灰蒙日光+褪色饱和` |\n| 水墨武侠意境 | `水墨写意国风，墨分五色与飞白笔触，留白意境构图，淡雅低饱和影调，4K高清画质，国画长卷式构图` | 打斗段`+浓墨重笔+血朱砂一点` |\n\n## 八、画风一致性自检清单（五问）\n\n- [ ] 当前 Prompt 末尾是否逐字含 @画风锁（含分线追加缀）？\n- [ ] 锁内光影词与资产图零光影要求冲突时，是否按例外条款替换？\n- [ ] 生成结果与既有镜头对比：笔触/色温/细节密度同源？\n- [ ] 是否误混流派（厚涂+赛璐璐同框=废片，负向兜底\"画风混杂\"）？\n- [ ] 引擎感词缀是否与流派匹配（2D 流派误挂 UE5=违和）？"},{"p":"kb_library/KB_06_三视图与角色一致性.md","t":"KB_06 三视图与角色一致性规范（高密度工业速查版）","d":"","raw":"# KB_06 三视图与角色一致性规范（高密度工业速查版）\n\n> 用途：重要资产图（三视图/表情矩阵/立绘/特写）生成铁律库。\n> 核心原则：**用正面物理状态描述替代否定词**——扩散模型对\"无高光无阴影\"不敏感，对\"平光/Albedo/正交投影\"等物理事实高度敏感。\n> 本册包含：正反词组对照公式 ×22 组 ｜ 姿态规范 6 式 ｜ 五件套清单 ｜ **五套可直接复制的编译母版** ｜ 防多头怪四步指南 ｜ 锁脸权重表 ｜ 质检对照清单。\n\n---\n\n## 一、零光影正交核心词组 · 正反对照公式（22 组 ❌否定式 → ✅正面物理式）\n\n| 维度 | ❌ 错误否定式（失效） | ✅ 正面物理式（逐字编译） |\n|---|---|---|\n| 布光(4) | ~~无高光~~ | `360度环形无影棚拍柔光` |\n| | ~~不要阴影~~ | `均匀漫射平光（Flat Even Lighting）` |\n| | ~~光要均匀~~ | `大型柔光箱正面平光` |\n| | ~~没有明显光比~~ | `影棚基准平光，受光面与背光面明度差极小` |\n| 贴图(3) | ~~不要反光~~ | `漫反射固有色贴图质感（Flat Lit Albedo）` |\n| | ~~哑光一点~~ | `PBR 漫反射贴图（Diffuse Pass）质感` |\n| | ~~像手办的表面~~ | `哑光固有色，无镜面反射` |\n| 投影(3) | ~~不要透视~~ | `正交投影相机（Orthographic Projection）` |\n| | ~~别近大远小~~ | `平行视线无消失点，零透视畸变` |\n| | ~~平面化一点~~ | `等距视角（Isometric-flat）贴图式呈现` |\n| 背景(3) | ~~背景干净~~ | `中性18%灰背景` |\n| | ~~纯色背景~~ | `纯白无接缝背景（Seamless Backdrop）` |\n| | ~~别出现场景~~ | `背景无任何环境元素，仅纯色基底` |\n| 姿态(3) | ~~手臂自然下垂~~（衣袖粘连） | `A-Pose双臂自然微张约30~45度` |\n| | ~~标准站姿~~ | `T-Pose双臂水平展开`（展袖需求专用） |\n| | ~~站好别动~~ | `双脚与肩同宽站立基准，头部正视前方` |\n| 版式(3) | ~~三个角度~~ | `正面、左侧面、背面三视角等距水平排列` |\n| | ~~多视图~~ | `角色设定三视图（Turnaround Sheet / Model Sheet）` |\n| | ~~别画成多个人~~ | `同一角色三个视角比例严格一致（非三个人物，非合影）` |\n| 通用(3) | ~~简洁一点~~ | `信息密度仅保留角色本体与必要道具` |\n| | ~~高质量~~ | `超精细细节，8K超高清` |\n| | ~~专业设定图~~ | `animation model sheet，industry character sheet standard` |\n\n**英文对照串**（ComfyUI/Flux 等英文语义强模型直接使用）：\n`character turnaround sheet, three view (front / side / back), orthographic projection, A-pose, full body, consistent proportions, flat lighting, albedo map style, neutral white background, model sheet layout`\n\n## 二、姿态规范词典（6 式）\n\n| 姿态式 | 描述词 | 适用 |\n|---|---|---|\n| A-Pose(首选) | 双臂微张30~45度、掌心朝内、五指自然分开贴腿侧 | 绝大多数角色（防衣袖粘连） |\n| T-Pose | 双臂水平展开90度、掌心朝前 | 宽袖/披风完整展示 |\n| 自然立正 | 双脚与肩同宽、垂手、正视 | 主图/立绘 |\n| 微侧立 | 身体转向15度、头回正 | 主图增加体积感 |\n| 坐姿基准 | 正坐椅上、双手置膝、双足落地 | 坐姿角色资产 |\n| 道具持握式 | 单手持道具45度朝镜头、另一手自然垂 | 道具三视图（防手遮结构） |\n\n## 三、图集五件套清单（人物）/ 两件套（场景/道具）\n\n| 资产类型 | 必产图集 | 用途 |\n|---|---|---|\n| 人物五件套 | ①主图 ②正侧背三视图 ③3x3表情矩阵 ④独立面部特写 ⑤独立全身立绘 | ①对外展示 ②锁定设定 ③微表情锚点 ④⑤**视频/单镜专用参考（防多头怪）** |\n| 场景两件套 | ①全景图 ②空镜基准图(主机位无人物) | ①展示 ②所有同场景镜头图生图底图 |\n| 道具两件套 | ①正交三视图 ②特写基准图(无手部) | ①锁定结构 ②Cutaway/特写镜素材 |\n\n## 四、五套可直接复制的编译母版（[ ]=注册表锁定摘要填空）\n\n**母版① 人物主图**：\n```prompt\n[年龄段+身份]@[资产名]全身主图：[骨相锁定摘要5~8词]，[肤色质感]；[套装编号+四件套]，[持物与手别]，[记忆点]；[单一明确姿态+手部五指自然并拢]；360度环形无影棚拍柔光，均匀漫射平光，漫反射固有色贴图质感（Flat Lit Albedo），正交投影相机零透视畸变，纯白无接缝背景，全身完整入画；@画风锁（[光影氛围词]替换为均匀漫射平光）+[线别追加缀]，16:9，4K\n```\n\n**母版② 正交三视图**：\n```prompt\n角色设定三视图（Turnaround Sheet）：@[资产名]，[骨相摘要]，[套装四件套+背饰走向]；A-Pose双臂自然微张约30~45度防衣袖粘连，双脚与肩同宽；正面、左侧面、背面三视角等距水平排列，同一角色三个视角比例严格一致（非三个人物，非合影），全身完整造型含[背面关键细节]；360度环形无影棚拍柔光，均匀漫射平光，漫反射固有色贴图质感（Flat Lit Albedo / Diffuse Pass），正交投影相机零透视畸变，中性18%灰背景，@画风锁（[光影氛围词]替换为均匀漫射平光）+[线别追加缀]，16:9横幅，4K\n```\n\n**母版③ 3x3 表情矩阵**：\n```prompt\n3x3九宫格表情矩阵图：同一角色@[资产名]半身正面构图，[骨相摘要+套装]，九格分别为：①平静（基准无表情）②喜[具体面部动作]③哀[...]④怒[...]⑤惧[...]⑥[线别特色格]⑦惊讶[...]⑧沉思[...]⑨[角色专属格]；每格统一构图同一张脸，格间留白分隔；360度环形无影棚拍柔光，均匀漫射平光，漫反射固有色（Flat Lit Albedo），正面平视角度，中性18%灰背景，@画风锁（[光影氛围词]替换为均匀漫射平光）+[线别追加缀]，16:9，4K\n```\n*九格情绪词必须给\"具体面部动作\"（眼睛弯成月牙/眉骨紧锁），禁抽象词（开心/难过）。*\n\n**母版④ 独立面部特写（视频参考专用）**：\n```prompt\n@[资产名]独立面部特写图：正面头像，发际线至锁骨入画，[骨相摘要]，[发型+颊侧碎发]，[肤色]；[基准表情]；单视角单人（非三视图非多人）；360度环形无影棚拍柔光，均匀漫射平光，漫反射固有色贴图（Flat Lit Albedo），正交投影零透视畸变，中性18%灰背景，@画风锁（[光影氛围词]替换为均匀漫射平光）+[线别追加缀]，1:1，4K\n```\n\n**母版⑤ 独立全身立绘（素材位专用）**：\n```prompt\n@[资产名]独立正面全身立绘图：单视角单人（非三视图非多人），[骨相摘要+套装四件套]，自然站姿双臂垂于身侧五指并拢，A-Pose微张约20度；360度环形无影棚拍柔光，均匀漫射平光，漫反射固有色（Flat Lit Albedo），正交投影零透视畸变，纯白背景，@画风锁（[光影氛围词]替换为均匀漫射平光）+[线别追加缀]，9:16竖构图，4K\n```\n\n**（附）母版⑥ 场景空镜基准 / 母版⑦ 道具三视图**：\n```prompt\n@[场景名]主场景空镜基准图：[主机位视角]（无任何人物），[空间三段：前景…/中景焦点…/远景…]；[时间天气+色温+光型]；@画风锁+[线别追加缀]，16:9，4K\n道具标准正交三视图：@[道具名]，[三级结构各带材质词]，[记忆点]；正面、左侧面、背面三个视角等距水平排列，同一道具三视角比例严格一致；360度环形无影棚拍柔光，均匀漫射平光，漫反射固有色（Flat Lit Albedo），正交投影零透视畸变，中性18%灰背景；@画风锁（替换光影词）+[线别追加缀]，16:9横幅，4K\n```\n\n## 五、三视图切分单人参考防多头怪指南（四步）\n\n**问题**：视频/单镜生图模型把三视图识别为\"三个人同框\"→ 复制人、全员乱张嘴、串脸（崩坏05/06 前置）。\n1. **选格**：从三视图裁\"正面\"单格（侧面格备侧拍镜）。\n2. **补图**：分辨率不足时以该格为图生图参考（重绘 0.3）重出高清单人——用母版⑤。\n3. **特写**：另出母版④ 面部特写——多图参考锁脸首选。\n4. **入位**：即梦素材位\"立绘 1 位+特写可选 1 位\"；ComfyUI PuLID/IP-Adapter 挂特写；可灵首帧用立绘合成图。\n**红线**：素材位/首帧/ControlNet 参考位出现完整三视图或矩阵图=防呆违规。\n\n## 六、锁脸手段权重表（跨镜一致性）\n\n| 手段 | 权重区间 | 平台 | 越界后果 |\n|---|---|---|---|\n| 角色 LoRA | 0.6~0.85 | ComfyUI | >0.9 塑胶脸 |\n| PuLID | 0.6~0.8 | Flux/SD | >0.8 表情锁死 |\n| IP-Adapter | 0.5~0.7 | 通用 | >0.7 串风格 |\n| 素材位参考 | 立绘1位+特写1位 | 即梦 | 多位稀释串色 |\n| 尾帧接力 | 链 ≤2 段 | 全平台 | 第3段脸漂(崩坏09) |\n| 首帧重锚 | 每 5 秒 | 全平台 | 连续镜身份漂移 |\n\n## 七、资产图质检对照清单（送 KB_10 前自检）\n\n- [ ] 三视角同比例同间距无透视？ [ ] Albedo 平光词组逐字在、无否定式残留？\n- [ ] A-Pose 手臂与躯干间空隙可见？ [ ] 背景纯白/18%灰无环境元素？\n- [ ] 矩阵九格同一张脸（骨相同源）？ [ ] 画风锁挂载且例外条款执行？\n- [ ] 画幅+分辨率标注？ [ ] ④⑤单人参考图已入生产计划？\n- [ ] 英文模型使用时对照串已附？ [ ] 道具三视图含三级结构+记忆点？"},{"p":"kb_library/KB_07_构图与资产板规范.md","t":"KB_07 构图与资产板规范（高密度工业速查版）","d":"","raw":"# KB_07 构图与资产板规范（高密度工业速查版）\n\n> 用途：导演分镜与美术资产板的构图权威词库——分镜表\"构图\"字段唯一词源，执行防崩补丁2（竖屏自适应）。\n> 本册包含：通用构图 12 式 ｜ 多人分区句式 6 式 ｜ 横屏法则 8 ｜ 竖屏法则 7 ｜ 轴线规则 6 ｜ 资产板版式 7 式 ｜ 景别 8 级 ｜ 构图组合速查矩阵 —— **合计 55+ 词条**。\n\n---\n\n## 一、通用构图法则词典（12 式）\n\n| 构图法 | 描述词（直接入 Prompt） | 心理效果 |\n|---|---|---|\n| 中心构图 | 主体居中、对称稳定 | 威严、压场（@林烬比武台） |\n| 三分法 | 主体落于左/右三分线 | 自然、电影感 |\n| 黄金螺旋 | 视线沿螺旋落点汇聚 | 引导聚焦 |\n| 对角线构图 | 主体沿对角线排布 | 动势、冲突 |\n| 引导线构图 | 街道/灯串纵深线条引向主体 | 纵深（@光大街边） |\n| 框式构图 | 门窗/门洞框住主体 | 窥视、宿命 |\n| 对称构图 | 中轴严格对称 | 仪式、庄严 |\n| 留白构图 | 大面积负空间 | 孤独、意境 |\n| 前景遮挡 | 前景虚化人群/花枝遮一角 | 临场、偷窥感 |\n| 三角形构图 | 三主体/三元素成稳定三角 | 稳定博弈 |\n| L形构图 | 主体占一角+延伸线 | 闲适、叙事角落 |\n| 满构图 | 主体充满画面无留白 | 压迫、冲击 |\n\n## 二、多人空间分区句式库（6 式 · 防崩补丁1 防串色必用）\n\n| 情形 | 标准句式（象限+体型差+服装色差三重锚定） |\n|---|---|\n| 双人并行(横屏) | `画面左侧三分之一为成年女性@A（身高约一米六五，[服装主色]），右侧三分之二为孩童@B（身高约一米一，[服装主色]），两人[间距/互动]` |\n| 双人对峙 | `画面左前侧@A（高位俯视感站位），右后侧@B（低半头），两人相距两臂对峙` |\n| 过肩主客 | `越过@B的右肩与后脑（画面右下角虚化剪影）拍摄@A（主体占画面左侧三分之二）` |\n| 前后纵深 | `前景为@A半身背影虚化，中景焦点为@B清晰` |\n| 上下分区(竖屏) | `上半画面为站姿@A，下半画面为蹲姿仰视的@B` |\n| 群像压角 | `主体居中，人群虚化剪影分布于画面四角外圈` |\n\n## 三、16:9 横屏构图法则（8 条）\n\n1. 允许横向大空间铺开：`宗门广场横向铺开、人群两侧环形围绕、建筑群水平展开`。\n2. 中心构图+横向展开=压场标配。\n3. 三分法+引导线=街景标配。\n4. 对称纵深=殿宇标配。\n5. 对话正反打：标准过肩（越A肩拍B ↔ 越B肩拍A，轴线两机位）。\n6. 群像两翼展开+主体中轴。\n7. 横移运镜配横向长景深（走廊/河流）。\n8. 宽幅全景奇观（云海/战场）最大化画幅优势。\n\n## 四、9:16 竖屏构图法则（7 条 · 防崩补丁2 强制）\n\n1. **前中后大纵深叠压**：`前景虚化美食摊白雾，中景母子主体清晰，远景居民楼暖灯虚化`——纵深换横向信息。\n2. **上下高低机位对角线**：高机位俯拍仰望/低机位仰拍俯身；或人物从头到脚沿对角线贯穿。\n3. **竖屏紧凑过肩正反打**：面部占画面高 ≥1/3。\n4. 禁用横向铺开构图（防崩补丁2 明令）。\n5. 双人同框用上下半分区替代左右分区。\n6. 字幕安全区：底部 15% 预留，构图下沿避开关键信息。\n7. 远景慎用（人物过小），多用中近景/近景/特写。\n\n## 五、轴线与机位半圆规则（6 条）\n\n1. 180 度轴线：一场戏确立轴线（A→B 连线或运动方向线）后，所有机位位于同侧半圆。\n2. 越轴=观众方向感崩塌；分镜表必写轴线声明（谁左谁右+机位半圆侧）。\n3. 合法越轴三法：中性镜（正对/背对轴线骑轴）过渡｜动作剪辑点越轴（大幅动作顶点帧遮）｜主体改写轴线（转身/走动+跟随镜交代）。\n4. 多轴线同场（三人+）：以主对手戏二人连线为主动轴，第三人插入镜处理。\n5. 运动轴线：人物转身改方向=轴线改写，须在分镜备注留痕。\n6. 正反打成对出图（防色温跳变，联动 IMG-02）。\n\n## 六、资产板排版规范（7 式）\n\n| 板类型 | 版式规范 | 必含元素 |\n|---|---|---|\n| 角色资产设定板 | 2x2 或 1x3 网格 | @资产名水印、比例尺、画风锁标注 |\n| 三视图板 | 正/侧/背等距水平排列+顶部标题栏 | A-Pose、18%灰背景 |\n| 表情矩阵板 | 3x3 九宫格、格间留白 | 每格表情标签（具体面部动作） |\n| 场景全景板 | 单幅大图+右下角细节放大 | 光源方向箭头标注 |\n| 道具三视图板 | 正/侧/背+一格特写 | 材质标注（KB_04 索引） |\n| 多宫格分镜垫图 | 2x2 四格按时间顺序 | 每格秒区间标注 |\n| 双人组合立绘板 | 固定站位（A左B右）+身高差标尺 | 间距数值、互动关系 |\n\n## 七、景别词典（8 级 · 分镜表字段唯一来源）\n\n| 景别 | 取景范围 | 功能速记 |\n|---|---|---|\n| 大远景 | 环境主导，人物极小 | 定世界 |\n| 远景 | 全身+大量环境 | 定关系 |\n| 全景 | 全身+少量环境 | 定动作 |\n| 中景 | 膝上 | 定互动 |\n| 中近景 | 腰上 | 过渡铺垫 |\n| 近景 | 胸上 | 给情绪 |\n| 特写 | 面部 | 给爆点 |\n| 大特写 | 眼/手/物局部 | 给细节针脚 |\n\n**竖屏建议**：多用中近景/近景/特写；远景慎用。\n\n## 八、构图组合速查矩阵（题材×画幅×构图三维索引）\n\n| 题材场景 | 16:9 首选组合 | 9:16 首选组合 |\n|---|---|---|\n| 压场立威 | 全景+中心构图+仰拍 | 对角线贯穿+低机位仰拍 |\n| 街道行走 | 远景+三分法+引导线 | 三层纵深叠压+缓推 |\n| 双人对白 | 过肩正反打+紧凑构图 | 竖屏过肩(面部≥1/3高) |\n| 打斗爆发 | 全景+对角线+低角度 | 高低机位对角+近景切 |\n| 空镜氛围 | 满构图/留白 | 上下留白+中心主体 |\n| 群像场面 | 两翼展开+中轴对称 | 四角压群像+中心主体 |\n| 追逐戏 | 横移跟拍+引导线 | 纵深跟拍(迎面/背跟) |\n| 回忆杀 | 框式+逆光留白 | 框式+上下留白 |\n\n## 九、构图连续性自检（场记用 5 项）\n\n- [ ] 同场次景别序列符合递进（远→全→中→近→特）或刻意跳级有戏剧理由？\n- [ ] 9:16 集全部规避横向铺开？ [ ] 多人镜头都有分区句式？\n- [ ] 机位全部位于轴线同侧（或留合法越轴记录）？ [ ] 前景遮挡元素跨镜一致？"},{"p":"kb_library/KB_08_Prompt编译器.md","t":"KB_08 Prompt 编译器（高密度工业速查版）","d":"","raw":"# KB_08 Prompt 编译器（高密度工业速查版）\n\n> 用途：框架\"编译器内核\"。所有中文提示词按本典公式查表拼装，严禁大模型用空洞形容词自由造句。\n> 本册包含：生图八层全量公式+**可复制母版** ｜ 视频 20/80 差分公式+**可复制母版（三档时长）** ｜ 口型排他锁句式库 ｜ 秒级节点规范 ｜ 首尾帧/接力编译 ｜ 编译前后正反对照 ｜ 前置检查 7 项。\n\n---\n\n## 一、生图全量编译公式（八层 · 资产图/首帧基准图）\n\n```text\n[主体层] @资产名+骨相锁定摘要5~8词(KB_02)\n+ [服饰层] 版型编号+面料+配色+工艺(KB_03/KB_04四件套)\n+ [动作层] 单一明确姿态+手部状态(五指并拢等)\n+ [空间层] 多人分区句式(KB_07二节,≥2人必填)\n+ [环境层] @场景资产+时间天气+关键陈设三层\n+ [光学层] 光型+色温+过曝防护(KB_04四节;资产图替换为KB_06零光影铁律)\n+ [镜头层] 景别+机位+构图(KB_07/KB_11)\n+ [画风层] @画风锁(末尾逐字;资产图按KB_06例外条款)\n+ [规格层] 画幅+分辨率(2K/4K)\n```\n\n**可复制母版（生图）**：\n```prompt\n[主体：@资产+5~8骨相词+肤色]，[服饰：编号+版型+面料+配色+工艺]，[动作：单一姿态+手部状态]；[空间：多人分区句式/单人省略]；[环境：@场景，前景…中景…远景…，时间天气]；[光学：光型+色温，高光不过曝保留面部细节]；[镜头：景别+机位+构图]；@画风锁+[线别追加缀]，[画幅]，[分辨率]\n```\n\n**编译成品示例（@林烬主图）**：\n```prompt\n青年剑修@林烬，鹅蛋脸下颌线锋利，剑眉入鬓丹凤眼漆黑瞳，鼻梁高挺薄唇微抿，黑色长发束高马尾额前两缕碎发，九头身挺拔，冷白皮细腻；玄黑窄袖劲装(玄铁锦缎，玄黑+银线，云纹暗绣皮甲缚带)，腰束墨玉扣腰封，右手负剑@焚天断剑于背后；站姿笔直，双手负于身后五指自然并拢，左手虎口旧疤清晰可见；背景纯白无接缝；360度环形无影棚拍柔光，均匀漫射平光，漫反射固有色贴图质感（Flat Lit Albedo），正交投影相机零透视畸变，全身完整入画；@画风锁（体积光氛围替换为均匀漫射平光）+冷青蓝主调剑气银白高光，16:9，4K\n```\n\n## 二、视频差分编译公式（I2V 核心 · 20% 锚点 + 80% 动态）\n\n**八层分解表**：\n\n| 层 | 占比 | 内容 | 词源 | 违规判定 |\n|---|---|---|---|---|\n| 锚点层 | ~20% | @资产名+骨相词 ≤2/人 | KB_02 掐尖 | 超 2 词=V2 否决 |\n| 运镜动态 | 80%内 | 1 种运镜+幅度词 | KB_11 三/五节 | ≥2 种=V9 扣分 |\n| 主动作 | 80%内 | 1 个（可跨节点） | 分镜秒级节点 | 第 2 主动作=V3 否决 |\n| 次级微动作 | 80%内 | 1 个（指节收紧/睫毛颤） | KB_02 八节 | 点缀不抢戏 |\n| 材质动态 | 80%内 | 衣摆/发丝/白雾/尘埃 | KB_04 三节 | 环境死板=画面假 |\n| 光影变化 | 可选 | 光斑移动/天光渐暗 | KB_04 四节 | 强逆光=崩坏10 |\n| 口型层 | 独立 | 模式A台词+锁 / 模式B闭嘴基底 | 本典三节 | 缺失=V5/V6 否决 |\n| 画风层 | 末尾 | @画风锁+缀+画幅+秒数 | KB_05 | 缺失=V11/V12 扣分 |\n\n**可复制母版（三档时长）**：\n\n```prompt\n【5秒标准式】[锚点层]@资产（≤2词）[场景定位]，[00-02s]镜头[运镜+幅度]，[材质动态]+[环境动态]；[02-05s][主动作]+[次级微动作]，[光影变化可选]，[口型/静默声明]，@画风锁+[缀]，16:9，5秒\n```\n```prompt\n【3秒对白式】[锚点层]，[00-00.8s][铺垫微动作]；[00.8-03.0s][台词(引号+语气)+口型排他锁]，@画风锁+[缀]，16:9，3秒\n```\n```prompt\n【10秒长条式】[锚点层]，[0-2秒]…；[2-5秒]…；[5-8秒]…；[8-10秒]…（每段一个次级动作递进，主动作只在其中一段）；[第15秒类中段重锚@资产名]；@画风锁+[缀]，16:9，10秒\n```\n\n**编译成品示例（差分视频）**：\n```prompt\n黑衣长发@林烬立于@玄天宗比武台中央，[00-02s]镜头低角度缓慢推近，衣摆与额前碎发被罡风掀起轻扬，雷云天光渐暗翻涌；[02-05s]他缓缓抬眼扫视四周，右手取@焚天断剑自下而上划出弧线斜指前方，剑身暗红纹路亮起，气流掀动衣摆与马尾定格，台下人群剪影后倾半步，雷云中一道银白光柱落台，双唇闭合无张嘴动作，@画风锁+冷青蓝主调剑气银白高光，16:9，5秒\n```\n\n## 三、口型排他锁句式库（模式 A/B · 6 句式）\n\n| 场景 | 句式（逐字可复制） |\n|---|---|\n| Mode A·多人双锁 | `说话者@X抬头张嘴说话，嘴唇随台词自然开合：\"[台词]\"（[语气+TTS控制符]）；一旁的@Y保持双唇闭合、[神态]倾听，不发一言` |\n| Mode A·单人 | `@X张嘴说话，嘴唇随台词自然开合：\"[台词]\"（[语气]）` |\n| Mode A·静默镜 | `双唇闭合无张嘴动作`（防全员乱张嘴，崩坏05 对静默镜同样生效） |\n| Mode B·基底声明 | `面部微表情生动（[链式描述]），但嘴唇保持自然闭合或极轻微闭合微动（预留后期Lip-Sync口型合成干净基底）` |\n| Mode B·倾听者 | `@Y双唇闭合微笑倾听` |\n| 双管线选择 | `模式A=即梦/MiniMax H3/可灵原生音频直出；模式B=ComfyUI Wan无声+Fish Audio克隆+LatentSync/剪映对口型` |\n\n## 四、秒级节点编译规范（6 条）\n\n1. 格式 `[00-02s]` / `[0-2秒]`（即梦用\"秒\"字式）；节点数 ≤3；间隔 ≥1 秒。\n2. 全部对齐 0.5 秒网格（继承 NARR-03 精算）；禁\"持续地/渐渐地\"无锚词。\n3. 一镜一主动作；主动作+1 微动作+环境动态为上限。\n4. 台词节点写 `[1.5-4.0秒] 开口说台词（\"…\"，语气）`，时长=字数÷语速+停顿。\n5. 30 秒长条节点可加密至 5~7 段，每段仍单动作，第 15 秒重锚。\n6. 换运镜指令（MiniMax 类）必须落在节点边界。\n\n## 五、首尾帧与尾帧接力编译规范\n\n- **首尾帧**：Prompt 只写中间过渡运动；`运镜幅度匹配首尾画面差异`（可灵铁律）；禁复述起止静态。\n- **尾帧接力（Tail-to-Head）**：`以上一镜尾帧为首帧`；锚点压至 1 词；Prompt 只写增量（新增动作/光移/表情递进）；链 ≤2 段，第 3 段重锚全量首帧。\n\n## 六、编译前后正反对照（❌ 自由造句 → ✅ 查表编译）\n\n❌ **编译前（自由造句）**：\n> 一个很帅的黑衣剑客站在气势恢宏的比武台上，周围人山人海，天空电闪雷鸣，他潇洒地拔出剑指向前方，气场全开，画面震撼，电影感拉满。\n\n✅ **编译后（查表）**：\n> `黑衣长发@林烬立于@玄天宗比武台中央，[00-02s]镜头低角度缓慢推近，衣摆与额前碎发被罡风掀起轻扬，雷云天光渐暗翻涌，台下人群剪影静立；[02-05s]他缓缓抬眼扫视四周，右手取@焚天断剑自下而上划出弧线斜指前方，剑身暗红纹路亮起，气流掀动衣摆与马尾定格，台下人群剪影后倾半步，雷云中一道银白光柱落台，双唇闭合无张嘴动作，@画风锁+冷青蓝主调剑气银白高光，16:9，5秒`\n> **差异**：人山人海→人群剪影（串脸防线）｜潇洒震撼→秒级动作链（可执行）｜气场全开→物理动态+光影（可生成）｜补口型锁与规格。\n\n## 七、编译前置检查清单（7 项 · 评分官 R7 依据）\n\n1. [ ] 所有 `@资产` 在注册表内且名称纯中文？\n2. [ ] 生图八层齐全？视频锚点 ≤20%、动态 ≥80%、单主动作、节点 ≤3？\n3. [ ] 多人：分区句式+口型排他锁齐备？\n4. [ ] 台词：时长测算完成且与镜长匹配？模式 A/B 已声明？\n5. [ ] 末尾 @画风锁逐字挂载？画幅+分辨率/秒数标注？\n6. [ ] 崩坏词规避（十指交叉/360度/镜内切镜/狂奔/强逆光首帧）？\n7. [ ] 词条均出自 KB_01~07/11 原词（无自造同义词）？"},{"p":"kb_library/KB_09_错误修正与Negative_Prompt.md","t":"KB_09 错误修正与 Negative Prompt 词典（高密度工业速查版）","d":"","raw":"# KB_09 错误修正与 Negative Prompt 词典（高密度工业速查版）\n\n> 用途：生成翻车时的\"急救手册\"。与《全局复盘避坑黑名单》联动：黑名单定触发与根因，本典给可执行修正词与改写方案。\n> 本册包含：**17 种崩坏模式完整对照大表（编号/症状/触发/根因/Prompt级修正/技法级修正/负向词）** ｜ 生图修正词库 10 类 ｜ 标准负向词包双母版 ｜ 修正工作流 4 步。\n\n---\n\n## 一、AI 视频 17 种崩坏模式完整对照大表（一表在手 · 翻车即查）\n\n| 编号 | 崩坏 | 触发条件 | 根因 | Prompt 级修正写法 | 技法级修正 | 负向词 |\n|---|---|---|---|---|---|---|\n| 01 | 手部六指/融化 | 手部特写/快速手势 | 手部几何自由度跨帧不稳 | 改\"五指自然并拢\"\"单手握拳\"；手部出画 | OpenPose 手部控制；特写降速 | 多余手指,六指,手指粘连 |\n| 02 | 十指交叉融化 | \"十指交叉/对插\"描述 | 自遮挡超拓扑理解 | 改\"双手交叠一手覆一手\" | 避开手部特写 | 十指交叉,手指融合 |\n| 03 | 360度转身五官移位 | 单镜360度旋转/急甩头 | 旋转中面部锚点丢失 | 拆两镜+甩发Cutaway遮转场 | 可灵首尾帧锚定起止脸 | 360度旋转 |\n| 04 | 镜内切机位空间撕裂 | 一条Prompt含多机位 | 视频生成是连续单机位时空 | 一镜一机位；删除第二机位描述 | 拆镜各自生成剪辑台上切 | 镜头切换,机位跳变 |\n| 05 | 多人同框乱张嘴 | 多人+台词无口型归属 | 对白泛化到所有面部 | 口型排他锁（KB_08三节句式） | 模式B后期单人对口型 | 全员张嘴,多人说话 |\n| 06 | 多主体串脸 | 多人无空间分区 | 多主体特征注意力渗透 | 分区句式+身高差+服装色差三重锚 | 分镜参考图各自绑定 | 双人融合,身份混淆 |\n| 07 | 奔跑双腿穿模 | \"狂奔/疾跑/连跳\" | 腿部交替超帧间估计 | 降速\"小跑\"；半身景别 | 首尾帧锚定起止步态 | 腿部穿模 |\n| 08 | 衣袖粘连/消失 | 宽袍+大动作；T-Pose不足 | 布料自遮挡判断失败 | \"衣袂随动作自然摆动，袖口与手腕分离清晰\" | 三视图A-Pose重制 | 衣袖融合 |\n| 09 | 面部身份漂移 | 长镜/接力未刷新锚定 | 逐帧独立猜测误差累积 | 每5秒重锚@资产名 | 刷新首帧/尾帧接力≤2段 | 身份漂移,面部变化 |\n| 10 | 首帧强逆光过曝 | 首窗前剪影/背光大高光 | I2V放大首帧曝光特征 | 首帧\"柔和侧逆光、高光不过曝保留面部细节\" | 重出首帧基准图 | 过曝,高光溢出 |\n| 11 | 文字招牌乱码 | 招牌/字幕/书籍文字 | 文字渲染跨帧不稳 | \"字迹模糊虚化不可辨认\" | 剪映后期贴字 | 清晰文字,可读文本 |\n| 12 | 道具中途变形 | 手持道具换手/离画 | 道具跨帧一致性弱 | \"@焚天断剑始终握于右手、不入画出画\" | 道具特写Cutaway补 | 物体变形 |\n| 13 | 人物瞬移穿墙 | 长距离位移描述 | 大位移空间推理失败 | 单镜位移≤1身位；显式过渡动作 | 首尾帧锚定起终点 | 瞬移,穿模 |\n| 14 | 液体布料违和 | 泼水/大雨/丝绸瀑布 | 流体软体动力学失真 | 降复杂度（细雨/涟漪/轻扬） | B级静态图+剪映粒子 | 流体崩坏 |\n| 15 | 眨眼缺失/抽搐 | 长特写凝视 | 眼部微动作帧间不稳 | \"眨眼频率自然，约三秒一次轻微眨眼\" | H3微表情类平台 | 眨眼异常 |\n| 16 | 口型不同步 | 时长无测算/模式B大嘴基底 | 音画时长失配；二次合成打架 | 声画先行测算；模式B闭嘴基底声明 | LatentSync/剪映对口型±2帧 | 口型不同步 |\n| 17 | 背景周期闪烁 | 高频重复纹理+运动镜 | 重复纹理帧间相位差 | \"背景大光圈虚化，重复纹理柔化\" | 剪映智能补帧 | 背景闪烁 |\n\n## 二、生图错误修正词库（10 类 · 正反写法对照）\n\n| # | 错误 | ❌ 失效写法 | ✅ 修正写法（正面物理式） |\n|---|---|---|---|\n| 1 | 高光阴影污染 | ~~无高光无阴影~~ | `大型柔光箱正面平光加强，固有色均匀无明暗过渡，Albedo漫反射贴图质感，均匀顶光加双侧反光板补光` |\n| 2 | 透视畸变 | ~~不要透视~~ | `严格正交投影，平行视线无消失点，等距视角，平面化贴图视角` |\n| 3 | 多指/手糊 | ~~手指正常~~ | `五指自然并拢清晰可数，手部放松垂于身侧` |\n| 4 | 三视图复制人 | ~~只有一个人~~ | `同一角色的三个连续视角，非三个人物，角色设定图（model sheet），非合影` |\n| 5 | 双人融合 | ~~分开一点~~ | 空间分区句式强化+`两人轮廓边缘清晰分离，无身体接触面融合` |\n| 6 | 文字乱码 | ~~字写对~~ | `招牌字迹虚化不可辨认，景深模糊背景元素`（清晰文字后期贴） |\n| 7 | 儿童成人化 | ~~可爱一点~~ | `幼儿头身比1:4.5，婴儿肥脸颊，大圆眼占比大，短四肢圆润` |\n| 8 | 画风漂移 | ~~保持一致~~ | `@画风锁逐字重挂+附参考图+与参考图同一画风同一笔触同一色温` |\n| 9 | 皮肤塑料感 | ~~真实皮肤~~ | `细腻毛孔可见，皮肤纹理真实，次表面散射自然` |\n| 10 | 构图跑偏 | ~~按我想的来~~ | 景别+机位+构图三词钉死（KB_07/11 原词） |\n\n## 三、标准负向词包（双母版 · 可直接复制挂载）\n\n**生图母版（ComfyUI/Flux/SD 系）**：\n```prompt\n多余手指, 六指, 手指粘连, 十指交叉, 面部扭曲, 五官移位, 高光过曝, 硬阴影, 透视畸变, 双人融合, 三个相同人物, 复制人, 文字, 乱码, 水印, 签名, 低分辨率, 模糊, 噪点, 肢体比例错误, 器官错误, 畸形, 过饱和, 塑料感, 画风混杂, 成人比例孩童\n```\n\n**生视频母版（支持负向输入端）**：\n```prompt\n镜头切换, 机位跳切, 人物瞬移, 全员张嘴, 多人张嘴, 口型大开, 身份漂移, 面部变化, 肢体穿模, 腿部穿模, 手指畸形, 背景闪烁, 卡顿, 拖影, 鬼影, 色彩断层, 画面撕裂, 文字出现, 水印, 360度旋转\n```\n\n**使用规则**：①只挂支持负向输入的端（ComfyUI 系）；豆包/即梦/可灵等以正向物理式规避为主，本包供平台支持时兜底。②按任务裁剪（对白镜必留口型三词；多人镜必留融合两词）。③新增崩坏编号（18+）同步补词入包（EVO-01 职责）。\n\n## 四、修正工作流（翻车后 4 步闭环）\n\n1. **定位**：对照第一节大表按症状命中编号（口语症状先过 EVO-01 的 4.1 字典规范化）。\n2. **改词**：套用 Prompt 级修正写法重编译——**只改崩坏相关层，其余层逐字不动**（防二次漂移）。\n3. **换法**：改词两轮仍翻车 → 升级技法级修正（ControlNet/首尾帧/降级 B 级静态图）。\n4. **归档**：触发 Prompt 片段与现象填入复盘占位 → EVO-01 归档黑名单实战区并按高频规则升级 KB_10 否决项。"},{"p":"kb_library/KB_10_资产与视频质量检查.md","t":"KB_10 资产与视频质量检查（10 分制硬性质检 · 高密度速查版）","d":"","raw":"# KB_10 资产与视频质量检查（10 分制硬性质检 · 高密度速查版）\n\n> 用途：【AI 提示词质量评分专家 R7】的唯一评分标准（完整权威版）。对每一条资产图/前置资源图/视频 Prompt 独立评分。\n> 铁律：满分 10 分，**得分 <9.0 一票否决，强制打回 R5/R6 重写**；修改指令随评分一并下发；打回 ≤3 轮，超限人工裁决。\n\n---\n\n## 一、生图 Prompt 扣分表（G1~G12 完整版 · 分值总和 10）\n\n| # | 检查项 | 分值 | 扣分判定标准（◆=否决级） | 关联崩坏 |\n|---|---|---|---|---|\n| G1 | @资产合法性 | 1.5◆ | 引用未注册资产/名称含英文数字符号 | —— |\n| G2 | 骨相锁定完整 | 1.0 | 缺脸型/眼型/发型关键锚点，或与注册表摘要冲突（换词=换脸） | 09 |\n| G3 | 服饰四件套 | 1.0 | 版型/面料/配色/工艺每缺一项扣 0.25 | 08 |\n| G4 | 零光影铁律（资产图） | 1.5◆ | 资产图缺 Albedo 平光词组或混入光影描述 | 10 |\n| G5 | 正交与姿态 | 1.0 | 三视图缺\"正交投影/A-Pose\"任一扣 0.5 | 02 |\n| G6 | 背景规范 | 0.5 | 资产图背景非纯白/18%灰 | —— |\n| G7 | 空间分区（多人） | 1.0◆ | ≥2 人无象限+体型差句式 | 06 |\n| G8 | 崩坏词规避 | 1.0◆ | 含黑名单触发词（十指交叉/三人同框指令/强逆光） | 01/02/10 |\n| G9 | @画风锁挂载 | 1.0 | 末尾未逐字挂载（例外条款未执行亦扣） | —— |\n| G10 | 画幅与规格 | 0.5 | 缺画幅/分辨率标注 | —— |\n| G11 | 单一主体动作明确 | 0.5 | 动作含糊或多动作 | 04 |\n| G12 | 语言纯净 | 0.5 | 中英混杂乱序、空洞形容词（\"唯美大气\"无实指） | —— |\n\n## 二、生视频 Prompt 扣分表（V1~V12 完整版）\n\n| # | 检查项 | 分值 | 扣分判定标准（◆=否决级） | 关联崩坏 |\n|---|---|---|---|---|\n| V1 | @资产合法性 | 1.5◆ | 同 G1 | —— |\n| V2 | 差分编译比例 | 1.5◆ | 骨相词 >2/人、堆砌穿搭（违反 20/80） | 09 |\n| V3 | 一镜一机位一主动作 | 1.5◆ | ≥2 主动作或含机位切换描述 | 04 |\n| V4 | 秒级节点规范 | 1.0 | 缺节点/节点>3/间隔<1秒/有台词无测算 | 16 |\n| V5 | 口型排他锁（多人台词） | 1.5◆ | 未写说话者张嘴+倾听者闭嘴 | 05 |\n| V6 | 口型模式声明 | 1.0◆ | 未声明 A/B；模式 B 缺闭嘴基底 | 16 |\n| V7 | 台词时长测算 | 0.5 | 有台词无字数÷语速测算 | 16 |\n| V8 | 空间分区（多人） | 1.0◆ | 同 G7 | 06 |\n| V9 | 运镜单一明确 | 1.0 | 运镜 ≥2 种或幅度与内容矛盾 | —— |\n| V10 | 崩坏词规避 | 1.0◆ | 黑名单触发词（360度转身/狂奔/瞬移/强逆光首帧） | 03/07/13/10 |\n| V11 | @画风锁挂载 | 1.0 | 未逐字挂载（含分线追加缀） | —— |\n| V12 | 时长与画幅标注 | 0.5 | 缺时长秒数或画幅 | —— |\n\n*计分：得分 = 10 − Σ扣分（下限 0，保留一位小数）；任一◆触发 → 强制 ≤8.9 判打回。QC-01（skill_qc_prompt_scorer_10pt）直接引用本表编号 G1~G12 / V1~V12，不维护并行表；多项◆并发时扣分取最重项、其余转修改指令。*\n\n## 三、17 崩坏编号 → 检查项映射表（评分官快速索引）\n\n| 崩坏编号 | 主检查项 | 崩坏编号 | 主检查项 |\n|---|---|---|---|\n| 01 手部 | G8/V10 | 10 首帧过曝 | G4/G8/V10 |\n| 02 十指交叉 | G8/V10 | 11 文字乱码 | G8/V10 |\n| 03 转身移位 | V10 | 12 道具变形 | G3/V10 |\n| 04 镜内切镜 | G11/V3 | 13 瞬移 | V10 |\n| 05 乱张嘴 | V5/V6 | 14 流体布料 | V10 |\n| 06 串脸 | G7/V8 | 15 眨眼异常 | V4（特写≥3s查眨眼句） |\n| 07 奔跑穿模 | V10 | 16 口型不同步 | V4/V5/V6/V7 |\n| 08 衣袖粘连 | G3/V10 | 17 背景闪烁 | V10 |\n\n## 四、评分输出格式（R7 → 产出文档 · 双模板）\n\n**放行模板**：\n```markdown\n- **质量关卡得分**：9.X / 10 分（通过！）\n- **评分明细与使用建议**：\n  - 逐项核验：V1 ✓（资产在册）｜V2 ✓（锚点2词）｜V3 ✓（单主动作）｜V5 ✓（双锁齐）…\n  - 扣分说明：V9 幅度词轻微冗余 → 扣0.2（本轮已自动修正复审通过）\n  - 使用建议：参考图权重0.7｜ControlNet 0.6｜抽卡2~3次取优｜盯片点…\n```\n\n**打回模板**：\n```markdown\n- **质量关卡得分**：8.X / 10 分（打回！第N轮）\n- **打回原因**：V5 ◆ 否决——多人台词未写倾听者闭嘴状态（对应崩坏05）；证据：\"（引用原文）\"\n- **修改指令**：在 [0.8-3秒] 节点后原样追加\"一旁的@李梅保持双唇闭合、面带微笑低头倾听\"；补模式A声明；重写后提交复审。\n```\n\n## 五、评分流程（6 步）\n\n1. R5/R6 产出 Prompt → ` ```prompt ` 代码块封装（防崩补丁5）。\n2. R7 按对应表逐项核验，每项 ✓/✗ 附原文证据。\n3. 计分（10−Σ扣分，一位小数；◆触发强制 ≤8.9）。\n4. ≥9.0 → 放行写入产出文档；<9.0 → 打回单下发 R5/R6。\n5. 打回 ≤3 轮；第 3 轮仍 <9.0 → \"人工裁决\"上报用户并抄送 EVO-01。\n6. 评分明细随 Prompt 写入产出文档（透明可审计）。\n\n## 六、实测维度质检参考（生成之后 · 用户自查）\n\n- 资产图：三视角比例一致/无光影残留/手部可数/与锁定摘要逐项比对/矩阵同脸。\n- 视频片段：动作连贯无撕裂/口型对齐/身份稳定/背景无闪烁/道具在手。\n- 发现问题 → 填写 `Prompt 实际产出复盘：` → 触发 EVO-01（KB_09 四节修正工作流）。\n\n## 七、高频升级规则（与黑名单联动）\n\n同类崩坏在《全局复盘避坑黑名单》实战区归档 ≥3 次 → 对应检查项升为否决级（若未是）+ 分值上调 0.5 + 本表标注\"依据：实战区 N 次归档\"——由 EVO-01 执行落盘。"},{"p":"kb_library/KB_11_导演镜头与动态运镜词典.md","t":"KB_11 导演镜头与动态运镜词典（高密度工业速查版）","d":"","raw":"# KB_11 导演镜头与动态运镜词典（高密度工业速查版）\n\n> 用途：分镜表\"景别/机位/构图/画面/运镜\"字段唯一词源；视频差分编译\"动态层 80%\"主词库。\n> 本册包含：景别 8 ｜ 机位角度 12 ｜ 基础运镜 10（含 MiniMax 方括号映射）｜ 高级运镜 8 ｜ 幅度控制 3 档+速度阶梯 6 级 ｜ **运镜×内容组合矩阵 30 格** ｜ 场面调度 8 ｜ 运镜防崩对照 6 —— **合计 90+ 词条**。\n\n---\n\n## 一、景别词典（8 级）\n\n| 景别 | 取景 | 功能 | 竖屏适配 |\n|---|---|---|---|\n| 大远景 | 环境主导 | 定世界 | 慎用 |\n| 远景 | 全身+环境 | 定关系 | 少用 |\n| 全景 | 全身 | 定动作 | 可用 |\n| 中景 | 膝上 | 定互动 | 常用 |\n| 中近景 | 腰上 | 过渡铺垫 | 常用 |\n| 近景 | 胸上 | 给情绪 | 主力 |\n| 特写 | 面部 | 给爆点 | 主力 |\n| 大特写 | 眼/手/物 | 给针脚 | 主力 |\n\n## 二、机位与角度词典（12 词条）\n\n| 机位/角度 | 描述词 | 心理效果 |\n|---|---|---|\n| 平视 | 与人物视线等高 | 客观平和 |\n| 低角度仰拍 | 低机位仰视 | 威压崇高（@林烬压场） |\n| 高角度俯拍 | 高机位俯视 | 渺小怜惜（俯拍孩童） |\n| 鸟瞰 | 垂直向下 | 全知命运 |\n| 蚂蚁视角 | 贴地仰视 | 极端压迫 |\n| 过肩（OTS） | 越一人肩拍另一人 | 对话代入 |\n| 主观视角（POV） | 以角色眼睛为机位 | 沉浸 |\n| 越轴骑轴 | 正对运动方向 | 中性过渡 |\n| 侧面 90 度 | 侧剖面 | 仪式/对峙 |\n| 前侧 45 度 | 侧前跟拍 | 行走标配 |\n| 背跟 | 背后跟随 | 引入/孤独 |\n| 顶角俯冲 | 俯冲推近 | 突袭揭示 |\n\n## 三、基础运镜词典（10 词条 · 含 MiniMax H3 方括号映射）\n\n| 运镜 | 标准描述词（公用/即梦自然语言） | MiniMax H3 方括号 | 可灵幅度词参考 | 典型用途 |\n|---|---|---|---|---|\n| 推 | 镜头缓慢推近 | `[推近]`（同义`[推进]`） | 推近+幅度档 | 聚焦情绪、压场 |\n| 拉 | 镜头缓缓拉远 | `[拉远]` | 拉远 | 孤独揭示、退场 |\n| 摇-水平 | 镜头左摇/右摇 | `[左移]`/`[右移]` | 横移 | 展示横向空间 |\n| 摇-垂直 | 镜头上摇（仰角上抬）/下摇 | `[上摇]`/`[下摇]` | —— | 揭示高度/低头细节 |\n| 移 | 镜头平稳横移 | `[左移]`/`[右移]` | 横移 | 跟随与空间扫描 |\n| 跟拍 | 镜头平稳跟随人物前行 | 描述\"跟拍\" | 跟随 | 街道行走 |\n| 环绕 | 镜头围绕主体缓慢环绕（≤180°） | `[环绕]` | 缓慢环绕 | 高光时刻 |\n| 固定 | 镜头固定不动 | `[固定]` | 固定 | 对白/微表情首选 |\n| 升 | 镜头缓缓上升 | 描述\"上升\" | 升 | 大场面揭示 |\n| 降 | 镜头缓缓下降 | 描述\"下降\" | 降 | 俯瞰落定主体 |\n\n## 四、高级电影运镜词典（8 词条）\n\n| 运镜 | 描述词 | 用途 | 风险提示 |\n|---|---|---|---|\n| 希区柯克变焦 | 推镜同时变焦，背景压缩/膨胀 | 惊觉、世界观崩塌 | 高危，需首尾帧 |\n| 焦点转移 | 焦点由前景A移至后景B | 视线引导、关系揭示 | 稳定可用 |\n| 子弹时间 | 高速环绕定格慢放 | 奇观（S级） | 高危，可灵专属尝试 |\n| 手持呼吸感 | 轻微手持晃动 | 临场纪实 | 小幅度安全 |\n| 一镜到底 | 连续跟随不切 | 沉浸叙事 | 走尾帧接力≤2段 |\n| 慢推+微变焦 | 缓推同时轻微变焦 | 情绪压迫 | 稳定可用 |\n| 甩镜转场 | 快速甩动模糊转场 | 硬切替代 | 易崩，慎用 |\n| 升格慢动作 | 高帧率慢放 | 细节放大 | 后期变速更稳 |\n\n## 五、运镜幅度与速度控制（3 档 × 6 级阶梯）\n\n| 幅度档 | 副词 | 适用 |\n|---|---|---|\n| 微幅 | 轻微/缓缓/缓慢 | 情绪戏、B级、微差异首尾帧 |\n| 中幅 | 平稳/匀速/推近 | 常规A级的标配 |\n| 大幅 | 快速/急速/骤然 | S级爆点（必须首尾帧锚定） |\n\n**速度阶梯**：`轻缓 → 缓慢 → 匀速 → 中速 → 快速 → 急速`（急速禁裸用）。\n\n## 六、运镜 × 内容类型组合矩阵（30 格速查 · \"这样拍配这样动\"）\n\n| 内容类型 | 首选运镜 | 备选运镜 | 禁用运镜 | 竖屏改法 |\n|---|---|---|---|---|\n| 压场立威 | 低角度缓慢推近 | 环绕(≤90°) | 甩镜 | 对角贯穿+仰拍 |\n| 街道行走 | 前侧45°平稳跟拍 | 固定+人物入画 | 逆行跟拍 | 纵深跟拍 |\n| 双人对白 | 固定过肩正反打 | 缓推(微幅) | 横移 | 竖屏过肩 |\n| 微表情特写 | [固定] | [推近]缓慢 | 环绕 | 不变 |\n| 打斗爆发 | 跟随+急速推近(首尾帧) | 子弹时间(S级) | 长摇 | 高低对角 |\n| 空镜氛围 | 缓慢横移 | 升/降 | 快切 | 上摇/下摇 |\n| 追逐 | 背跟+横移组合(拆段) | 跟拍 | 360°环绕 | 迎面纵深跟 |\n| 群像揭示 | 升镜缓起 | 拉远 | 推近单点 | 四角压+升 |\n| 回忆闪回 | 缓推+焦点转移 | 固定 | 手持 | 不变 |\n| 揭示道具 | [下摇]至物+焦点锁定 | 缓推(微幅) | 环绕 | 不变 |\n\n## 七、场面调度词典（Mise-en-scène · 8 词条）\n\n| 调度 | 描述词 | 用途 |\n|---|---|---|\n| 入画出画 | 人物自画面左侧入画（方向合轴线） | 行进交代 |\n| 前后景置换 | 前景人物虚化后景人物走入焦点 | 关系转移 |\n| 静动对比 | 人群静止唯主角衣摆翻飞 | 压场 |\n| 视线引导 | 人物视线投向画外右下，下一镜揭示所见 | 剪辑钩子 |\n| 镜面反射调度 | 借橱窗/水面反射呈现第二空间 | 信息翻倍 |\n| 遮挡揭示 | 前景人流穿过逐次露出主体 | 临场揭示 |\n| 深景走位 | 人物由纵深处走向镜头变近景 | 一镜两级景别 |\n| 对角换位 | 双人沿对角线互换站位（显式事件） | 关系逆转可视化 |\n\n## 八、运镜防崩对照（6 条红线）\n\n- 摇镜+高频重复纹理背景 → 必加\"背景虚化\"（崩坏17）。\n- 环绕+多人 → 空间分区句式保留（崩坏06）。\n- 大幅推近+手部特写 → 降微幅（崩坏01）。\n- 单镜内严禁 ≥2 种主动运镜组合（V9 扣分）。\n- MiniMax 方括号指令禁同段叠加，换指令落在节点边界。\n- 可灵幅度必须匹配首尾帧差异（不匹配=运镜不执行）。\n\n## 九、分镜表填写规范（R2 输出 14 字段中本典负责 5 字段）\n\n```text\n镜号｜场次｜景别(一节)｜机位(二节)｜构图(KB_07)｜运镜(三四节1种+幅度五节)｜时长秒｜等级S/A/B｜@资产清单｜台词(口型模式)｜秒级节点摘要｜Cutaway标记｜轴线标记｜备注\n```\n**示例**：`镜头3｜场次B母子买莽莽｜近景过肩(越@张三右肩拍@李梅)｜竖屏式紧凑过肩主体占左2/3｜[固定]·微幅｜4秒｜A级｜@李梅@张三@光大街边｜李梅台词(模式A)｜[00-0.4s]抬手抚头；[00.4-3.6s]说台词；[3.6-4s]轻拍收势｜Cutaway否｜B场南半圆不越轴｜手部腕部截断入画防崩；戏眼=说\"等爸爸\"眼神先亮后垂`"},{"p":"kb_library/KB_12_TTS音色克隆与剪映后期词典.md","t":"KB_12 TTS 音色克隆与剪映后期词典（高密度工业速查版）","d":"","raw":"# KB_12 TTS 音色克隆与剪映后期词典（高密度工业速查版）\n\n> 用途：音色制作（R3/R8）与剪辑调音（R8）的唯一词源。\n> **铁律：严禁编造假特效名/假参数**——本典全部条目经联网核实（2026-10），来源见 memory/global/权威工作流与影视知识库.md。\n> 本册包含：TTS 四平台参数大表 ｜ 副语言标签字典 40 词条 ｜ 语速基准 8 档 ｜ **剪映真实菜单大表（曲线变速 6/转场 13/动画 10/调色特效音频 22）** ｜ **Foley 音效搜索关键词映射表 36 词条** ｜ 四轨混音 dB 表 ｜ 对口型流程。\n\n---\n\n## 一、TTS 音色克隆平台参数大表（4 平台 · 核实版）\n\n| 平台 | 克隆门槛 | 推荐样本 | 真实参数/机制 | 已知限制 |\n|---|---|---|---|---|\n| Fish Audio | 10 秒可克隆 | 15~30 秒（最佳 1~3 分钟）干声 | Instant Voice Clone；ComfyUI 节点 1~20 段、每段 10~30 秒、总时长硬校验 <270 秒；S2 词级控制+行内开放域标签 | 中文极致情感一般 |\n| MiniMax | 预设+微调 | 儿童声优先预设 | 文本内嵌 `<#>` 情绪标签、`( )` 停顿、语气词标记；混合音色 | 克隆需授权流程 |\n| CosyVoice | 3 秒可克隆 | 3~10 秒（像度要求低时） | instruct 指令模式（自然语言副语言）；头部全大写标记 `<|HAPPY|>` 等；SSML 控停顿发音 | 2.0 克隆模式语气描述可能失效（语气走 instruct） |\n| Noiz | 风格化预设 | 无需样本 | 年龄+性别+质感三键筛选；音高 ±2 半音、语速 ±10% 微调 | 克隆能力弱 |\n\n## 二、副语言控制标签字典（40 词条 · 按类别）\n\n| 类别 | 词条（平台兼容度） |\n|---|---|\n| 情感通用(10) | `(excited)`兴奋、`(softly)`轻柔、`(sad)`悲伤、`(angry)`愤怒、`(whisper)`气声、`(calm)`平静、`(gentle)`温柔、`(fierce)`狠戾、`(weak)`虚弱、`(proud)`骄傲（全平台） |\n| 笑叹泣咳(6) | `(laughter)`/`[laughter]`笑、`(sigh)`叹气、`(sob)`抽泣、`(chuckle)`轻笑、`(gasp)`倒吸、`(cough)`咳（全平台） |\n| 呼吸(4) | `(breath)`换气、`(deep breath)`深吸气、`(held breath)`屏息、`(shaky breath)`颤息（全平台） |\n| 停顿(4) | `(pause)`短停、`(long pause)`长停、MiniMax 专用 `( )`、句间自然停顿（句号后）（全平台/MiniMax 原生） |\n| 重音(3) | Fish S2 词级标注、注音方案层 `重音=「字」@秒位`、正向强调写法「把\"X\"字咬重」（Fish/注音层） |\n| 语速(5) | `急促5.5字/秒`、`正常4字/秒`、`童声3.5~4字/秒`、`沉吟2.5~3字/秒`、倍率 `0.8x~1.3x`（注音层） |\n| 声调(4) | `尾音升调/降调/平调`、`音调+3半音`（MiniMax 微调）、`压嗓`、`清亮` |\n| 平台专属(4) | `<#>` 情绪切换（MiniMax）、`<|HAPPY|>/<|SAD|>/<|ANGRY|>/<|SURPRISED|>/<|CALM|>`（CosyVoice 全大写头部，长文多点插入）、instruct 自然语言副语言指令（CosyVoice）、行内开放域标签（Fish S2） |\n\n## 三、语速基准表（8 档 · 声画先行联动）\n\n| 语速档 | 字/秒 | 单镜字数安全区 | 典型用途 |\n|---|---|---|---|\n| 急促 | 5.5 | 8~12 | 争吵/报信 |\n| 正常 | 4.0 | 10~20 | 日常对白 |\n| 正常偏缓 | 3.5~4.5 | 8~15 | 温柔/解说 |\n| 童声 | 3.5~4.0 | 5~10 | 孩童奶音 |\n| 沉吟 | 2.5~3.0 | 6~12 | 压场/深情/威吓 |\n| 哭腔 | 2.0~2.5 | 5~10 | 泪点戏 |\n| 耳语 | 2.5 | 4~8 | 秘密/告白 |\n| 宣誓吟唱 | 2.0 | 4~8 | 高光台词 |\n\n## 四、剪映专业版真实菜单大表（核实版 · 严禁超出此表命名）\n\n### 4.1 曲线变速（入口：素材→右侧「变速」→「曲线变速」，6 预设）\n\n| 预设名 | 节奏 | 用途 | 入点规则 |\n|---|---|---|---|\n| `蒙太奇` | 先慢后快再慢 | 片头闪过/结尾聚焦 | 首镜/集尾 |\n| `英雄时刻` | 突慢再恢复 | 高光燃点 | 动作顶点帧 |\n| `子弹时间` | 极致慢放 | 定格戏剧化 | S级奇观 |\n| `跳接` | 节奏跳跃 | 卡点快剪 | BGM 重拍连切 |\n| `闪进` | 开场加速 | 无缝入场 | 镜头入点 |\n| `闪出` | 结尾加速 | 无缝出场 | 镜头出点 |\n\n### 4.2 转场（「转场」面板 · Alt+T）\n\n| 类别 | 真实名 |\n|---|---|\n| 基础(3) | `叠化`（0.2~0.3s）、`闪黑`、`闪白` |\n| 运镜(6) | `推进`、`拉远`、`左移`、`右移`、`旋转`、`模糊` |\n| 氛围MG(4) | `漏光`（特效→氛围/光效类）、`故障`（转场-特效搜\"故障\"）、`燃烧`、`叠化-划像类`（按分类选取） |\n\n### 4.3 出入场动画（素材→「动画」面板 · 10 词条）\n\n`渐显`、`渐隐`、`放大入场`、`缩小入场`、`向左上飞入`、`向右上飞入`、`弹入`、`旋入`、`甩入`、`溶解出场`。\n\n### 4.4 调色与特效（「调节」/「特效」/「滤镜」面板 · 12 词条）\n\n| 类别 | 真实名/入口 |\n|---|---|\n| 调节参数(6) | `亮度`、`对比度`、`饱和度`、`色温`、`色调`、`HSL`（分区调色） |\n| LUT | 「调节」→「LUT」导入（双线剧冷青蓝/暖金橙各一套） |\n| 氛围特效(3) | `漏光`、`光斑`类（特效→氛围/光效搜索）、粒子光斑（搜索\"粒子\"或\"金粉\"） |\n| 功能(3) | `智能补帧`、`色度抠图`、`蒙版(线性/圆形/爱心)` |\n\n### 4.5 音频处理（音频轨→调节 · 5 词条）\n\n`人声美化`、`智能降噪`、`声音克隆`、`变声`、`音频卡点`（节拍标记自动对齐）。\n\n## 五、Foley 音效搜索关键词映射表（36 词条 · 剪映音效库直搜）\n\n| 场景类别 | 搜索关键词（直搜可用） |\n|---|---|\n| 脚步(5) | `脚步 碎石`、`脚步 柏油路`、`高跟鞋 走路`、`奔跑 脚步`、`孩童 跑步` |\n| 冷兵器(4) | `剑鸣 出鞘`、`金属 碰撞`、`刀剑 相击`、`箭矢 破空` |\n| 衣料身体(4) | `衣袂 摩擦`、`布料 飘动`、`拍打 身体`、`关节 活动` |\n| 环境自然(7) | `风声 呼啸`、`细雨 飘落`、`雷声 低鸣`、`雷声 骤响`、`鸟鸣 晨间`、`蝉鸣 夏夜`、`落叶 沙沙` |\n| 市井烟火(6) | `街道 嘈杂`、`炒菜 锅铲`、`白雾 蒸腾 嘶嘶`、`夜市 人声`、`硬币 落地`、`店铺 卷帘门` |\n| 情绪人声(4) | `孩童 笑声`、`人群 惊呼`、`叹息 轻声`、`抽泣 压抑` |\n| 特殊(6) | `心跳 加速`、`耳鸣 失神`、`时间 凝固 滴答`、`能量 蓄力`、`玻璃 碎裂`、`雨后 水滴` |\n\n**卡点规则**：音效入点=动作顶点帧或重音秒位（NARR-03）；点状音效卡单帧，环境音铺底。\n\n## 六、四轨混音 dB 表（R8 标准）\n\n| 轨道 | 内容 | 电平 | 要点 |\n|---|---|---|---|\n| T1 人声轨 | 克隆台词/原生对白 | **-6dB** | 降噪→美化；±2 帧对口型微调 |\n| T2 Foley 轨 | 动作音效 | **-12dB** | 卡点；点状不铺底 |\n| T3 BGM 轨 | 情绪音乐 | **-18~-20dB** | 对白段压低 30%；爆点瞬升 -14dB |\n| T4 环境底噪轨 | 街道/风/雷铺底 | **-24dB** | 全程连续；转场先行 0.3s |\n\n## 七、J-Cut / L-Cut 与对口型流程\n\n- **J-Cut**：下一镜音频提前 0.3s 入（听觉先导）；操作=音频块左移拖出画面块前缘。\n- **L-Cut**：上一镜尾音延入下一镜 0.5s；操作=音频右缘拉长覆盖下镜画面。\n- **遮瑕组合**：Cutaway 缓冲镜覆盖主轨+主镜尾音 L-Cut——观众耳朵在主镜、眼睛在缓冲镜。\n- **模式B 对口型四步**：克隆音频入 T1 → `智能降噪`+`人声美化` → 对口型（LatentSync/剪映）对齐重音秒位 → ±2 帧微调闭环。\n\n## 八、音色克隆工作卡模板（写入资产文档）\n\n```markdown\n### @人物 音色克隆卡\n- 目标平台：…（四平台选型）｜ 音色ID：音色-@人物-特征摘要\n- 音色特征：[质感+共鸣腔+年龄感]（KB_01/02 联动）\n- 参考音频要求：[秒数]干声，含[两种能量态]样本，背景干净\n- 克隆参数：[平台真实参数，禁编造]\n- 情感标签示例：台词\"…\" → [标签串+语速+重音+尾音]\n- 发音指导：[多音字/儿化/专有名词读法]\n```"}]},{"g":"技能索引","items":[{"p":"skills/SKILL_INDEX.md","t":"SKILL_INDEX.md — 全局技能插件路由索引表","d":"","raw":"# SKILL_INDEX.md — 全局技能插件路由索引表\n\n> 本索引是 `skills/` 目录的唯一路由入口（仿 anthropics/skills 按需加载规范）。\n> **使用规则**：总控（AGENTS.md）根据任务匹配下表 `WHEN 触发条件`，**只提取读取命中的 Skill 文件本体**，未命中的不读取，以节省上下文 Token。\n> 平台插件（05 类）互斥加载：一次任务最多激活一个 `plat_*`；未指定平台时激活 `plat_00`。\n\n---\n\n## 01 叙事编剧类（narrative）\n\n| 技能ID | 路径 | 挂载KB | WHEN 触发条件 |\n|---|---|---|---|\n| NARR-01 市场钩子调研 | `01_narrative_skills/skill_market_hook_research.md` | KB_01 | 当需要分析目标市场受众、设计黄金前3秒钩子或情绪曲线时 |\n| NARR-02 世界观与人物弧光 | `01_narrative_skills/skill_world_character_arc.md` | KB_01、KB_02 | 当需要构建世界观、人物立体小传、性格缺陷与潜台词时 |\n| NARR-03 台词秒数精算 | `01_narrative_skills/skill_dialogue_second_calc.md` | KB_11、KB_12 | 当台词需要按字数/语速精算镜头时长与重音节点（声画先行）时 |\n\n## 02 导演美术场记类（visual_director）\n\n| 技能ID | 路径 | 挂载KB | WHEN 触发条件 |\n|---|---|---|---|\n| VIS-01 导演分镜拆解 | `02_visual_director_skills/skill_director_storyboard.md` | KB_07、KB_11 | 当需要拆解分镜、标注S/A/B算力分级、规划Cutaway缓冲镜时 |\n| VIS-02 美术风格穿搭道具 | `02_visual_director_skills/skill_art_style_costume_prop.md` | KB_03、KB_04、KB_05 | 当需要确定画风、色彩脚本、人物穿搭、场景与道具视觉设定时 |\n| VIS-03 纯中文零光影资产 | `02_visual_director_skills/skill_asset_pure_chinese_no_light.md` | KB_06、KB_08 | 当需要策划重要资产图并执行 @纯中文命名 与零高光阴影铁律时（核心） |\n| VIS-04 连续性轴线守卫 | `02_visual_director_skills/skill_continuity_axis_guard.md` | KB_07 | 当需要校验180度轴线、左右站位、服装战损与跨集快照时 |\n\n## 03 生图技法类（image_gen）\n\n| 技能ID | 路径 | 挂载KB | WHEN 触发条件 |\n|---|---|---|---|\n| IMG-01 生图技法路由器 | `03_image_gen_skills/skill_img_tech_router.md` | KB_06、KB_09 | 当需要为某个出图任务选择图生图/ControlNet/灰度图/LoRA/Inpainting策略时 |\n| IMG-02 前置资源策划 | `03_image_gen_skills/skill_img_pre_resource_planner.md` | KB_06、KB_07 | 当需要为视频镜头策划首帧基准图、尾帧图、多宫格垫图时 |\n\n## 04 生视频技法类（video_gen）\n\n| 技能ID | 路径 | 挂载KB | WHEN 触发条件 |\n|---|---|---|---|\n| VID-01 秒级切片器 | `04_video_gen_skills/skill_vid_second_slicer.md` | KB_08、KB_11 | 当需要按秒切分视频、执行一镜一动一主体台词、差分编译、口型排他锁与双管线分流时 |\n| VID-02 技法选择器 | `04_video_gen_skills/skill_vid_method_selector.md` | KB_08、KB_09 | 当需要在首帧图生视频/首尾帧控制/分镜图转视频/多图参考融合/尾帧接力之间选型时 |\n\n## 05 平台专属插件类（platform_plugins · 互斥加载）\n\n| 技能ID | 路径 | 挂载KB | WHEN 触发条件 |\n|---|---|---|---|\n| PLAT-00 公用默认 | `05_platform_plugins/plat_00_universal_default.md` | KB_08 | 当用户未指定平台时（产出公用标准提示词+平台推荐） |\n| PLAT-01 豆包Seedream | `05_platform_plugins/plat_doubao_seedream.md` | KB_04、KB_08 | 当用户指定豆包/Seedream 生图时 |\n| PLAT-02 即梦 | `05_platform_plugins/plat_jimeng.md` | KB_08、KB_11 | 当用户指定即梦/Seedance 生视频时 |\n| PLAT-03 ComfyUI | `05_platform_plugins/plat_comfyui.md` | KB_06、KB_09 | 当用户指定ComfyUI（Flux/Wan2.1/2.2）时 |\n| PLAT-04 MiniMax H3 | `05_platform_plugins/plat_minimax_h3.md` | KB_08、KB_11 | 当用户指定MiniMax海螺H3生视频时 |\n| PLAT-05 可灵 | `05_platform_plugins/plat_kling.md` | KB_08、KB_11 | 当用户指定可灵/Kling生视频时 |\n\n## 06 音频后期质检类（audio_edit_qc）\n\n| 技能ID | 路径 | 挂载KB | WHEN 触发条件 |\n|---|---|---|---|\n| QC-01 十分制评分官 | `06_audio_edit_qc_skills/skill_qc_prompt_scorer_10pt.md` | KB_10、KB_09 | 每条提示词产出后必触发（<9.0 打回重写） |\n| AUD-01 音色克隆工作流 | `06_audio_edit_qc_skills/skill_tts_voice_clone_workflow.md` | KB_12 | 当需要制作角色音色或执行TTS克隆生成时 |\n| EDT-01 剪映剪辑调音 | `06_audio_edit_qc_skills/skill_jianying_edit_sound_master.md` | KB_12 | 当需要输出剪辑手法、语速声调、音效BGM配置时 |\n| EVO-01 复盘自进化 | `06_audio_edit_qc_skills/skill_retrospective_optimizer.md` | KB_09、KB_10 | 当用户填写\"实际产出复盘\"后自动触发 |\n\n---\n\n## 互斥与组合规则\n\n1. **平台互斥**：05 类一次仅激活一个 plat_*；跨平台对比需分次产出独立代码块。\n2. **固定组合**：任何 `plat_*` 激活时必伴随 KB_08（编译器）；评分 QC-01 对每条 Prompt 无条件触发。\n3. **上下文预算**：单次任务建议挂载 ≤1 个平台插件 + ≤2 个 KB + ≤3 个技法 Skill。\n4. **索引自检**：新增 Skill 必须同步登记本表（技能ID/路径/挂载KB/WHEN），否则总控视为不存在。"}]},{"g":"✍️ 编剧叙事","items":[{"p":"skills/01_narrative_skills/skill_dialogue_second_calc.md","t":"台词秒数精算器（NARR-03 · 皮克斯声画先行）· 工业级完整版","d":"WHAT：皮克斯声画先行（Audio-First）台词时长精算器——按情绪语速换算字数时长、计算气口停顿、锚定重音触发动作秒数，倒推视频秒级节点。WHEN：任何含台词的镜头在进入视频提示词编译（VID-01）之前必须先经本技能精算；用户要求'算台词时长/卡重音/倒推动作节点'时触发。","raw":"# 台词秒数精算器（NARR-03 · 皮克斯声画先行）· 工业级完整版\n\n## 一、核心职责与工业级法则（6 条硬核铁律）\n\n1. **以音定画铁律**：凡有台词的镜头，音频时长是因、视频节点是果——先算台词精确时长，再倒推动作节拍与镜头长度。禁止先定镜头时长再往里硬塞台词（嘴型赶帧是崩坏16 的第一大诱因）。\n2. **0.5 秒取整铁律**：台词总时长四舍五入到 0.5 秒粒度（TTS 与剪辑工具的时间轴最小舒适刻度）；镜内任何动作节点同样对齐 0.5 秒网格，禁止出现 2.3s 这种剪辑师没法卡的节点。\n3. **气口即戏铁律**：每个标点都是一个可设计的气口（换气/哽咽/蓄势），气口必须显式给秒数并入总时长；\"一口气念完\"只在急促吵架档允许，且单镜 ≤12 字。\n4. **铺垫+余韵铁律**：开口前留 0.5~1.5 秒动作铺垫（观众需要看\"谁要说话\"），收口后留 ≥0.5 秒情绪余韵（表情收势或对方反应）——镜头时长 = 铺垫 + 台词时长 + 余韵，三者必须分别列明。\n5. **重音锚定铁律**：每句台词圈定 1~2 个重音字，并标注其发生秒位（计算式见 4.3），重音秒位即 BGM 重拍/Foley 卡点/微表情爆发点的锚——无锚的卡点是剪辑师猜的，猜的就是错的。\n6. **超长截断铁律**：单镜台词 >20 字（正常档 >5 秒）必须拆镜或拆句接力；截断点必须落在语义完整处（逗号/句号后），禁止在词组中间切镜。\n\n## 二、标准执行 SOP（Step-by-Step）\n\n**Step 1 · 查表定档**：读 `KB_12` 第三节「语速基准表」（唯一权威源），按说话人情绪定语速档（用户覆写优先）；孩童自动套童声档，威压/深情自动套沉吟档。\n\n**Step 2 · 数字数**：台词去掉标点数汉字数 N（数字按位数计；儿语叠词\"莽莽\"计 2 字；语气词\"呀/呢/吧\"各计 1 字）。\n\n**Step 3 · 算气口**：按 4.2 气口停顿规则逐标点给秒数，列出明细表；特殊气口（哽咽/冷笑前置/换气蓄势）按情绪附加。\n\n**Step 4 · 求总时长**：`总时长 = N ÷ 语速 + Σ气口`，四舍五入到 0.5 秒。\n\n**Step 5 · 锚重音**：按 4.3 公式计算每个重音字的发生秒位（含铺垫偏移），生成\"重音锚点表\"。\n\n**Step 6 · 倒推节点**：`[铺垫 X~Ys]（动作…）→ [开口 Y~Zs]（台词+口型）→ [余韵 Z~W s]（收势动作）`，输出秒级节点串与镜头时长建议。\n\n**Step 7 · 校验**：与镜头预算时长比对，差值 >0.5s 时二选一——调语速档重算（注明\"紧凑处理\"）或上报导演改镜长；同步产出 TTS 控制符串交 AUD-01。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约\n\n| 字段 | 类型 | 必填 | 示例 |\n|---|---|---|---|\n| 台词原文 | text(含标点) | 是 | \"张三，上次我们才吃了，等爸爸回来给你买\" |\n| 说话人 | @资产名 | 是 | @李梅 |\n| 情绪档 | enum | 是 | 温柔（正常档偏缓） |\n| 口型模式 | A/B | 是 | A |\n| 镜头预算 | 秒 | 否 | 4 |\n\n### 输出契约（下游：导演 R2 定镜长 / VID-01 编译 / AUD-01 合成 / R8 卡点）\n\n```yaml\n台词精算:\n  原文: \"张三，上次我们才吃了，等爸爸回来给你买\"\n  有效字数: 15 ｜ 语速档: 正常偏缓4.0字/秒\n  气口明细: [逗号@字3:0.3s, 逗号@字10:0.3s, \"等爸爸\"前换气:0.4s]\n  台词时长: 15÷4.0+1.0=4.75 → 取4.5s（语速微提至4.5字/秒的紧凑处理,已注明）\n  重音锚点: [{字:\"买\", 秒位: 开口后3.6s, 触发: \"手在头顶轻拍收势\"}, {字:\"爸\", 秒位: 开口后2.2s, 触发: \"眼神先亮后垂+睫毛轻颤\"}]\n  秒级节点: \"[00-00.4s]蹲身平视理帽檐 → [00.4-03.6s]开口说台词(口型开合) → [03.6-04.0s]抚头轻拍收势\"\n  镜头时长建议: 4.0s（预算吻合,差值0）\n  TTS控制符串: \"(softly)张三，上次我们才吃了，(breath)等爸爸回来给你买 ‖ 4.5字/秒 ′ 买=降调收温\"\n  合规判定: 预算4.0s vs 精算4.5s → 紧凑档处理后吻合 ✓\n```\n\n## 四、专项工具箱\n\n### 4.1 语速基准 · 调用指针（表存于 KB_12）\n\n> 去重铁律：8 档情绪语速 × 字数安全区 × 气口特点全表（急促5.5/正常4/偏缓3.5~4.5/童声/沉吟/哭腔/耳语/宣誓），以 `KB_12` 第三节「语速基准表」为唯一权威源，本技能不抄写副本——测算时现查现用。\n\n**本技能独有速查公式**：`台词时长 ≈ 字数 ÷ 语速 + Σ气口`；20 字正常档 ≈ 5~5.5s（含气口）→ 已达单镜上限（超限按铁律 6 拆镜或拆句接力）。\n\n### 4.2 气口停顿 +0.5s 规则（标点 → 秒数）\n\n| 标点/情境 | 停顿时长 | 备注 |\n|---|---|---|\n| 逗号 | +0.3s | 换气或语势转折 |\n| 句号 | +0.5s | 语义闭合，允许对方插反应帧 |\n| 顿号 | +0.2s | 快速列举 |\n| 省略号/欲言又止 | +0.8s | 眼神动作填充 |\n| 问号 | +0.5s | 留给对方张嘴前的迟疑 |\n| 感叹号 | +0.2s | 情绪顶点后速收 |\n| 重音前微停 | +0.2s | 强调蓄势（\"我~要吃\"） |\n| 句首情绪前置（冷笑/叹气） | +0.5s | `(sigh)` `(breath)` 落点 |\n| 台词收口→镜头切走 | ≥+0.5s | 情绪余韵，禁止话音未落硬切 |\n\n### 4.3 重音触发动作秒数锚定示例\n\n**锚定公式**：`重音秒位 = 铺垫时长 + (重音字前的字数 + 0.5) ÷ 语速 + 其间气口Σ`\n\n**示例 A（@张三\"妈妈，我要吃莽莽\"，童声 4 字/秒，铺垫 0.8s）**：\n- 重音字\"吃\"前有 4 字 → (4+0.5)÷4 = 1.1s + 逗号 0.3s = 1.4s → **\"吃\"发生在开口后 1.4s，全镜 2.2s 处**\n- 锚定动作：`@李梅在 2.2s 处低头含笑视线落向孩子`（倾听反应卡点）；Foley\"衣角轻拽\"卡 0.8s 铺垫末。\n\n**示例 B（@林烬\"我今日登台，只为讨一个公道\"，沉吟 2.8 字/秒，铺垫 1.2s）**：\n- 重音\"公\"前有 11 字 → (11+0.5)÷2.8 ≈ 4.1s + 逗号 0.6s = 4.7s → **\"公\"发生在开口后 4.7s，全镜 5.9s 处**\n- 锚定：BGM 低频重拍卡 5.9s；`剑指前方的手在此秒位再压低半寸`（威压二次加码）。\n\n## 五、常见错误示范 vs 满分工业级示范\n\n### 对比组 1：时长测算\n\n❌ **Bad Case**：\n> 镜头4（5秒）：@李梅蹲下来跟孩子说了几句安抚的话，大概五六秒的样子，然后牵着孩子继续走。\n\n**扣分点**：\"说了几句/大概\"无字数无语速；台词内容缺失（TTS 无法合成）；无重音无节点；镜头 5 秒与\"五六秒\"自相矛盾；触发 KB_10 V7 扣 0.5 + 导演无法定镜。\n\n✅ **Good Case**：见\"输出契约\"完整示例——字数 15、语速 4.0、气口三处、总时长 4.75→4.5s 紧凑处理、重音\"爸@2.2s/买@3.6s\"双锚、秒级节点三段、镜头建议 4.0s 与预算吻合、TTS 控制符串齐备。\n\n### 对比组 2：超长台词处理\n\n❌ **Bad Case**：\n> 镜头7（5秒）：@李梅对孩子说：\"张三，听话，妈妈不是不给你买，是家里这个月真的很难，爸爸在外面打工挣钱也很辛苦，我们要体谅他，等他回来了，让他给你买好不好，乖。\"\n\n**扣分点**：52 字 ÷ 4 字/秒 ≈ 13s 塞进 5 秒镜——嘴型 2.6 倍速快放，崩坏16 一票否决；句意四层揉一镜，无重音重点。\n\n✅ **Good Case（截断拆镜接力）**：\n> 拆三镜：镜7a（4s，沉吟起）\"张三，听话，妈妈不是不给你买。\"（12字，重音\"不\"）→ 镜7b（3s，Cutaway 特写孩子攥紧的手，话音延入 L-Cut）→ 镜7c（4.5s，回过肩）\"是家里这个月真的很难。等爸爸回来，让他给你买，好不好？\"（19 字正常档，重音\"难/买\"）。三镜语义各完整、时长各自吻合、情绪由缓到哽到暖形成递进。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **双人抢话/台词重叠**：重叠部分只给主说话人算时长，被抢话者台词降为\"半句+被打断\"（字数 ≤6，结尾用破折号）；两镜间用 J-Cut 让抢话声音先入 0.3s。\n2. **无台词镜头**：本技能输出\"空镜节点卡\"——按预估动态时长（B 级 1.5s / 空镜 2s）给环境音卡点替代重音锚。\n3. **多语种/方言台词**：字数按音节折算（英语单词≈2 汉字时长）；方言先折普通话字数再 ÷0.9（方言普遍略慢）；TTS 控制符串注明语种标签。\n4. **唱词/吟诵**：套\"宣誓/吟唱档\"（2.0 字/秒、字字等距）；重音锚改为\"乐句重拍\"（每 4 字一拍）。\n5. **台词中途被动作打断（跌倒/门响）**：打断点前按正常测算，打断后余下字数重起一段测算并 +0.5s 反应气口；两段可分属前后两镜。\n6. **孩童超长句**：童声档单镜 >10 字即拆（孩童换气能力弱）；拆点必在逗号且给孩子一个 0.5s 小动作（舔嘴/拽衣角）过渡。"},{"p":"skills/01_narrative_skills/skill_market_hook_research.md","t":"市场钩子与情绪曲线技能（NARR-01）· 工业级完整版","d":"WHAT：短剧市场受众调研、黄金前3秒钩子公式设计与整集情绪过山车波形排布技能。WHEN：当需要分析目标市场受众、设计开局钩子、规划情绪曲线或新建剧集/新开一集进入剧本阶段时触发。","raw":"# 市场钩子与情绪曲线技能（NARR-01）· 工业级完整版\n\n## 一、核心职责与工业级法则（6 条硬核铁律）\n\n1. **3 秒生死线铁律**：短剧观众滑动决策窗口 ≤3 秒。前 3 秒内必须完成\"钩子事件启动\"（画面异动 + 身份反差或危机成立），禁止用空镜、片头 LOGO、缓慢环境铺垫开场——那是横屏电影的特权，不是竖屏短剧的。\n2. **痛点先行铁律**：先锁定受众\"未被满足的心理缺口\"（被轻视、亏欠、等待、逆袭渴望、护短、窥秘），钩子必须是痛点的直接引爆，而不是\"氛围感\"。写不出痛点分析的剧本不准进入分镜阶段。\n3. **情绪刻度量化铁律**：情绪必须用 1~10 的刻度标注在时间轴上，形成波形表；相邻两个情绪拐点间隔 ≤15 秒（竖屏）或 ≤25 秒（横屏），超过即\"情绪平原\"，观众流失。\n4. **钩子可画面化铁律**：任何钩子必须能翻译成\"一个可生成的首镜画面 + 一句台词/一个动作\"，写不进画面的钩子（\"他内心充满了不甘\"）判为废钩。\n5. **双钩备份铁律**：每集必须交付主钩 + 备钩两个方案，并注明 A/B 测试建议（同集双版本投放对比 3 秒完播率）。\n6. **钩尾闭环铁律**：每集结尾必须埋\"下一集钩子\"（悬念/反转/承诺悬置），并与本集开篇钩子形成呼应；只管开头不管结尾的剧本不是工业品。\n\n## 二、标准执行 SOP（Step-by-Step）\n\n**Step 1 · 查表定位受众**：读 `KB_01` 第一节原型库与第二节性格外化表，结合用户输入的题材赛道，在下方\"受众痛点核对清单\"中勾选 2~3 个核心痛点（不得超过 3 个——贪多则散）。\n\n**Step 2 · 选钩子公式并填空**：从\"五大钩子公式\"中选型，按公式字段逐项填空（身份反差元素、危机倒计时、反常道具、当众冲突、稚语戳心），产出主钩与备钩，各附\"首镜画面描述\"（交导演可直接拆镜）。\n\n**Step 3 · 绘制情绪过山车波形表**：按单集时长切格（竖屏 15s/格，横屏 25s/格），逐格填写情绪刻度与事件，强制满足\"压抑→反转→爆发\"至少一轮、大爆点 ≥1、小爆点 ≥2；波形表必须出现至少一次刻度落差 ≥4 的\"俯冲\"（压抑段）与落差 ≥5 的\"爬升\"（爆发段）。\n\n**Step 4 · 标注爽点秒位并交棒**：把爆点秒位换算为镜头等级建议（S 级对齐大爆点），写入输出 Schema 的\"爽点清单\"，交棒备注中明确提示导演 R2：黄金前 3 秒的钩子镜头固定 S 级。\n\n**Step 5 · 自检**：对照\"受众痛点核对清单\"与\"波形合规标准\"逐项打勾，缺项回炉。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约（上游：用户/总控）\n\n| 字段 | 类型 | 必填 | 示例 |\n|---|---|---|---|\n| 题材赛道 | enum | 是 | 男频玄幻爽剧 |\n| 分发画幅 | enum | 是 | 9:16 竖屏 |\n| 单集时长 | enum | 是 | 90 秒 |\n| 剧本梗概 | text | 是 | 叛徒之子重返宗门大比 |\n| 对标作品 | text | 否 | 《XXX》前三集 |\n\n### 输出契约（下游：导演 R2 / 美术 R3）\n\n```yaml\n市场受众分析:\n  赛道: 男频玄幻爽剧（竖屏分发）\n  核心痛点: [被轻视后的逆袭渴望, 为亲人正名的亏欠感]\n  对标: …\n黄金前3秒钩子:\n  主钩: {钩型: 压场型, 画面: \"雷云骤暗，@林烬负断剑立于台心，千名弟子齐退半步\", 首句台词: \"（无台词，静默压场）\", 等级建议: S}\n  备钩: {钩型: 冲突型, 画面: \"长老令牌掷于@林烬脚下碎裂\", 首句台词: \"罪人之子，也配登台？\", 等级建议: S}\n情绪过山车波形表:\n  - {秒位: 0-3,  刻度: 7, 事件: 钩子·压场}\n  - {秒位: 3-15, 刻度: 3, 事件: 压抑·讥笑如潮}\n  - {秒位: 15-30, 刻度: 6, 事件: 小反转·断剑纹路亮起}\n  - {秒位: 30-45, 刻度: 2, 事件: 再压·长老出手镇压}\n  - {秒位: 45-60, 刻度: 9, 事件: 大爆点·罡风席卷全场}\n  - {秒位: 60-90, 刻度: 8, 事件: 钩尾·\"只为讨一个公道\"+悬念}\n爽点清单: [{秒位: 15, 内容: 断剑觉醒, 等级: S}, {秒位: 60, 内容: 全场噤声, 等级: S}]\n交棒备注: \"0-3s 钩子镜头固定 S 级；45-60s 再压段建议 A 级反应镜；钩尾 88s 定格留白给剪辑上闪黑\"\n```\n\n## 四、专项工具箱\n\n### 4.1 短剧黄金前 3 秒五大钩子公式\n\n| 钩型 | 公式（字段填空） | 首镜画面要素 | 台词/声音 | 适用痛点 |\n|---|---|---|---|---|\n| 压场型 | `[被轻视者] + [反差实力道具/气场] + [全场噤声反应]` | 主体中心构图+环境异动（雷云/灯光骤变）+围观者后退 | 无台词静默 或 一句低声宣示 | 逆袭渴望 |\n| 危机型 | `[倒计时/坠落/走失] + [弱者无助] + [救援未至]` | 时钟/悬崖/人流大特写+主体渺小化 | 急促呼吸声+一句呼救 | 护短、亏欠 |\n| 悬念型 | `[反常细节特写] + [与常理矛盾] + [追问无人应]` | 停摆怀表/无人的生日蛋糕/反锁的门 | 环境死寂+一句自语 | 窥秘 |\n| 冲突型 | `[当众羞辱动作] + [隐忍者微表情] + [旁观者反应]` | 掷物/泼水动作顶点帧+主角攥拳特写 | 羞辱台词一句（≤12字） | 被轻视 |\n| 温情型 | `[稚语/弱者请求] + [守护者为难] + [环境温度反差]` | 孩童仰头视角+暖光食物特写对切 | 一句稚语（奶音拖尾） | 等待与承诺 |\n\n### 4.2 情绪过山车波形表（90 秒竖屏标准模板）\n\n| 秒位格 | 波段角色 | 情绪刻度目标 | 强制事件 | 禁止事件 |\n|---|---|---|---|---|\n| 0-3s | 钩子 | ≥7 | 钩子事件启动 | 空镜铺垫/LOGO |\n| 3-15s | 第一压抑 | ≤3 | 对立面施压 | 过早爆发 |\n| 15-30s | 小反转 | 5~6 | 实力/真相微露 | 全部解决 |\n| 30-45s | 第二压抑 | ≤2 | 代价显现/再受挫 | 情绪平原 |\n| 45-60s | 大爆点 | ≥9 | 爽点全额兑现+他人震惊反应 | 爆点无反应镜 |\n| 60-85s | 余韵+二次钩 | 6~8 | 收益展示/关系推进 | 新冲突无解 |\n| 85-90s | 钩尾 | 8（悬置） | 悬念定格/承诺悬置 | 圆满闭合 |\n\n### 4.3 受众痛点核对清单（Step 1 勾选用，≤3 项）\n\n- [ ] 被轻视后的逆袭渴望（爽）　[ ] 为亲人正名的亏欠感（燃）\n- [ ] 等待与承诺的悬置（泪）　[ ] 护短—弱者受欺（怒→爽）\n- [ ] 窥秘—反常事件（奇）　　[ ] 错位身份/错过的遗憾（唏嘘）\n- [ ] 占有/嫉妒反转（女频虐恋）　[ ] 生存倒计时（紧张）\n\n## 五、常见错误示范 vs 满分工业级示范\n\n### 对比组 1：钩子设计\n\n❌ **Bad Case（废钩三连）**：\n> 开头：夜幕降临，镜头缓缓扫过玄天宗的巍峨山门，云雾缭绕，配以悠远的古筝音乐，营造出神秘而宏大的氛围，为主角登场做铺垫。（约 5 秒）\n\n**扣分点**：纯空镜铺垫吃掉生死 3 秒；无痛点引爆；\"神秘宏大氛围\"不可量化、不可画面化判定成败；无钩子公式字段。\n\n✅ **Good Case（压场型公式填空）**：\n> **主钩（压场型）**：0-3s——雷云骤暗压城（环境异动），@林烬负 @焚天断剑一步踏上青石比武台（被轻视者+反差道具），台下千名弟子笑声戛然而止、齐退半步（全场噤声反应）。首句台词（低声，2.5 字/秒）：\"我今日登台——\"（留半句给 45-60s 大爆点闭环）。等级建议：S 级，首镜画面：低角度仰拍中心构图，剑柄自左肩探出入画。\n\n### 对比组 2：情绪波形排布\n\n❌ **Bad Case（情绪平原）**：\n> 0-30s 主角练剑；30-60s 与师兄弟切磋；60-90s 长老点评收尾。（刻度恒定 4-4-4）\n\n**扣分点**：无压抑无爆发，相邻拐点间隔=全集；90 秒零爆点；钩尾圆满闭合无悬念。\n\n✅ **Good Case（过山车波形）**：\n> 0-3s 钩子(7) 压场登台 → 3-15s 压抑(3) 讥笑如潮\"罪人之子\" → 15-30s 小反转(6) 断剑暗红纹路自亮，nearest 弟子惊退 → 30-45s 再压(2) 长老出手剑气镇压，@林烬单膝触地 → 45-60s 大爆点(9) 罡风席卷全场衣袂如黑焰 → 60-85s 余韵(7) 众弟子跪伏，长老眯眼（二次钩：长老袖中旧信） → 85-90s 钩尾(8) 定格 @林烬 抬眼：\"只为讨一个公道\"+闪黑。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **系列剧第 N 集（N>3）开场**：老观众已知世界观，钩子改为\"上集钩尾的即时兑付\"（悬念解决的前 3 秒先给一半），波形表首格从 5 起跳而非 7（保留空间给本集新钩）。\n2. **横屏 3-5 分钟漫剧**：生死线放宽到 8 秒（横屏观众耐受更高），但波形格改为 25s/格，且强制两个完整\"压抑→爆发\"轮回。\n3. **温情线接在爆爽线之后（双线剧）**：两线切换点必须落在前一线的情绪高点后 2 秒内（趁热换轨），切换瞬间用声音骤停/色温对撞（冷青→暖金）标记，防止观众误以为换台。\n4. **超短时长（≤30s 单元剧）**：波形压缩为\"钩子(7)→压抑(3)→爆点(9)\"三格，钩尾并入爆点最后一帧。\n5. **痛点冲突（勾选的痛点互斥，如\"窥秘+护短\"）**：以赛道主痛点为准，次痛点降级为本集暗线只埋不爆，下集再爆。"},{"p":"skills/01_narrative_skills/skill_world_character_arc.md","t":"世界观与人物弧光技能（NARR-02）· 工业级完整版","d":"WHAT：世界观三问建模、人物立体小传、性格缺陷外化与潜台词转化技能。WHEN：当新建剧集初始化 memory/projects/[剧名]/剧集圣经、立新人设、加深人物弧光或修改人物关系时触发。","raw":"# 世界观与人物弧光技能（NARR-02）· 工业级完整版\n\n## 一、核心职责与工业级法则（6 条硬核铁律）\n\n1. **世界观三问铁律**：世界观只用三句话定义——规则（力量/社会体系如何运作）、稀缺（什么最珍贵）、禁忌（什么不可为）。短剧观众不读百科，超出三问的设定一律砍掉或降为台词中的只言片语。\n2. **性格必须外化铁律**：所有性格描写必须同时落成三列——静态外化（生图可画）/ 动态外化（视频可生成）/ 微表情（KB_02 五节词典）。写不出三列的\"深沉复杂\"人物判为废卡。\n3. **缺陷驱动铁律**：主角必须有 1 个致命性格缺陷（过度隐忍/不信任/报喜不报忧），且该缺陷必须在本集剧情中至少造成一次\"付出代价\"的失误——无缺陷的主角没有弧光，只有爽文提线木偶。\n4. **记忆点 2+1 铁律**：每人 ≥2 个视觉记忆点（1 主 1 备，满足可视化/可叙事/可复现/全剧不重复四条）+1 个口头禅式微表情（如\"只扯单侧嘴角冷笑\"）。\n5. **外貌锁定唯一铁律**：人物外貌以\"外貌锁定摘要\"为唯一权威（KB_02 七节模板），写入资产注册表后，后续所有 Prompt 只能引用 `@资产名`+摘要关键词，严禁换同义词（\"杏眼\"不得时而写\"桃花眼\"——换词=换脸）。\n6. **潜台词禁入画面铁律**：台词只写字面，心理活动必须转化为外化动作写进\"动作节拍\"列；视频提示词里出现\"他心想/他内心\"字样即判废（模型无法生成心理）。\n\n## 二、标准执行 SOP（Step-by-Step）\n\n**Step 1 · 查表选型**：读 `KB_01` 第一节 16 型原型库，为人物选定原型；读第三节年龄感表，锁定年龄段与禁用词（防 AI 脸龄漂移）。\n\n**Step 2 · 填人物立体小传模板**（见 4.1），逐字段填写；性格缺陷必须填\"外化三列\"与\"本集代价事件\"。\n\n**Step 3 · 生成外貌锁定摘要**：按 `KB_02` 七节模板拼装（骨相 5~8 词 + 体型 + 发型 + 肤质 + 穿搭编号 + 记忆点 + 禁用词），交场记 R4 登记资产注册表，领取 `@纯中文资产名`。\n\n**Step 4 · 织关系三角网**：为每对主要人物填\"表面/真实/变化方向\"三栏（见 4.3），确保无孤立人物。\n\n**Step 5 · 潜台词转化**：对关键台词执行\"潜台词转化公式\"（见 4.4），产出\"台词字面 + 外化动作\"两列交付导演；心理描写清除出剧本。\n\n**Step 6 · 自检**：对照铁律 2/3/4/6 逐条打勾；新资产同步进\"资产注册变更单\"。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约\n\n| 字段 | 类型 | 必填 | 说明 |\n|---|---|---|---|\n| 人物需求 | enum | 是 | 新立 / 迭代 / 补缺陷 |\n| 基础设定 | text | 是 | 一句话也行：\"带娃等丈夫的年轻妈妈\" |\n| 所属线/阵营 | text | 是 | 苍穹线 / 烟火线 / 中立 |\n| 与已有人物关系 | text | 迭代必填 | \"与@林烬为宿敌\" |\n\n### 输出契约（下游：场记 R4 / 导演 R2 / 美术 R3）\n\n```yaml\n人物立体小传:\n  @资产名: 林烬\n  原型: 隐忍复仇者 ｜ 年龄段: 青年(18-28)\n  表层性格: 冷峻寡言 ｜ 深层渴望: 为母正名 ｜ 致命缺陷: 过度隐忍(该求助时不求助)\n  外化三列: {静态: \"拳收袖中、下颌绷紧、负剑而立\", 动态: \"深呼吸肩部微沉、指节泛白\", 微表情: \"单侧嘴角冷笑、眼神下压后抬\"}\n  记忆点: {主: \"左手虎口旧疤(母亲护子所留)\", 备: \"剑柄缠暗红绫(母亲遗物)\", 口头禅式: \"冷笑只扯单侧嘴角\"}\n  本集代价事件: \"因隐忍拒接师妹递的伤药，伤势恶化埋下第3集败局\"\n外貌锁定摘要: \"青年22岁｜九头身｜鹅蛋脸下颌线锋利｜剑眉+丹凤眼漆黑瞳｜鼻梁高挺+薄唇微抿｜黑长发高马尾额前两缕碎发｜冷白皮｜GX-01玄黑劲装｜记忆点:虎口旧疤+单侧冷笑｜禁用:笑容灿烂/圆润脸\"\n关系三角: [{对: \"@林烬—@玄天宗大师兄\", 表面: \"大比对手\", 真实: \"杀母仇人之徒\", 变化: \"由轻视到忌惮\"}]\n资产注册变更单: {新增: [\"@林烬\"], 派生: [], 备注: \"纯中文命名已自查\"}\n```\n\n## 四、专项工具箱\n\n### 4.1 人物立体小传模板（逐字段，禁留空）\n\n```text\n@资产名｜原型(KB_01)｜年龄段(KB_01)\n表层性格（一句话）｜深层渴望（一句话）｜致命缺陷（一句话）\n外化三列：静态外化… ／ 动态外化… ／ 微表情链…\n记忆点：主…（前史…）｜备…（前史…）｜口头禅式微表情…\n高光台词风格（语速档/情感倾向，联动 AUD-01）\n本集代价事件（缺陷如何让他付出代价）\n禁忌（该角色绝不会做的事——防 OOC）\n```\n\n### 4.2 性格缺陷外化表（缺陷 → 可生成画面）\n\n| 缺陷内核 | 静态外化 | 动态外化 | 微表情链 | 本集代价示例 |\n|---|---|---|---|---|\n| 过度隐忍 | 拳收袖中、伤处自行遮掩 | 拒绝递来的手、转身先走 | 眼神下压→深吸气→抬眼已平静 | 错过救援窗口伤势恶化 |\n| 报喜不报忧 | 笑容标准得体、手机屏朝下 | 掐灭已拨一半的电话 | 先弯眼笑→瞳孔失焦一瞬→笑恢复 | 谎言堆积引发误会爆发 |\n| 不信任 | 背对人而坐、物品随身不离手 | 接东西用双手但身体后倾 | 目光快速扫视对方双手 | 错过真心相助者 |\n| 控制欲 | 领带一丝不苟、物品码放整齐 | 反复调整他人摆好的物件 | 看到错位时眉心一跳 | 逼走最亲近的人 |\n| 天真执拗(孩童) | 攥紧许愿物不放 | 踮脚反复确认承诺 | 眼睛瞪圆→嘴角渐渐瘪 | 当众拆穿大人的谎 |\n\n### 4.3 关系三角表模板\n\n| 人物对 | 表面关系 | 真实关系 | 变化方向（本季终点） |\n|---|---|---|---|\n| @李梅—@张三 | 母子日常 | 相依为命的共谋者 | 由单向隐瞒走向共担 |\n| @李梅—（丈夫·未登场） | 电话里的承诺 | 缺席的悬念本体 | 由期待到真相揭晓 |\n\n### 4.4 潜台词转化公式\n\n```text\n潜台词三层转化 = 台词字面（≤15字，只写说什么）\n              + 潜台词（一句话，只进剧本备注，禁入画面）\n              + 外化动作（写进动作节拍：先做什么、说到哪个字时做什么、说完留什么表情）\n示例：\n  字面：\"张三，上次我们才吃了。\"\n  潜台词：家里不宽裕，但我不想让你懂事得太早。\n  外化动作：蹲身与孩子平视(先) → 说到\"吃了\"时替他理一下帽檐 → 说\"等爸爸回来\"时眼神先亮后垂、手在他头顶多停半秒(后)。\n```\n\n## 五、常见错误示范 vs 满分工业级示范\n\n### 对比组 1：人物卡\n\n❌ **Bad Case**：\n> @林烬是一个外冷内热、复杂深邃的角色，他背负着血海深仇，内心充满矛盾，时而冷酷时而温柔，是一个非常立体饱满的人物。\n\n**扣分点**：零外化（图画不出\"复杂\"）；无原型无年龄段；无记忆点；无缺陷代价；\"时而…时而…\"是 AI 无法执行的性格描述。\n\n✅ **Good Case**：见\"输出契约\"中 @林烬 完整小传——原型/缺陷/外化三列/记忆点带前史/代价事件/禁忌全部落地，美术可直接引用锁定摘要出图，导演可直接把外化列切进秒级节点。\n\n### 对比组 2：潜台词处理\n\n❌ **Bad Case（心理入画面）**：\n> 视频提示词：@李梅看着孩子渴望的眼神，心中一阵酸楚，她想起丈夫离家时的背影，内心挣扎许久，最终温柔地说：\"等爸爸回来给你买。\"\n\n**扣分点**：\"心中酸楚/想起背影/内心挣扎\"全是心理活动，视频模型无法生成；时长不可测（\"许久\"是几秒？）；触发 KB_10 V6 类问题。\n\n✅ **Good Case（外化入节拍）**：\n> 台词字面：\"等爸爸回来给你买。\"（8字，4字/秒）\n> 外化动作节拍：[先] 蹲身平视+理帽檐 → [说\"等爸爸\"时] 眼神先亮后垂、睫毛轻颤一次 → [说完] 手在头顶轻拍一下收势，嘴角笑意微收。\n> 潜台词（备注栏）：不想让孩子过早懂事。——心理只存在于备注，画面只存在动作。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **配角/群演快速立卡**：不填完整小传，走\"一句话卡\"：`@资产名｜原型｜1 个静态外化｜1 句功能台词`；无记忆点不注册美术资产，仅剧本引用。\n2. **反派魅力化**：反派也必须满足铁律 2/4（外化三列+记忆点），其\"魅力\"来自反差记忆点（如屠刀+喂猫）；禁止用\"纯粹的恶\"糊弄——观众记不住的脸留不住剧。\n3. **双主角弧光交织**：两主角缺陷必须互补互激（隐忍 × 报喜不报忧），本季终点两人缺陷各让一步产生关系跃迁；弧光时间表错峰（A 在第 3 集付代价，B 在第 5 集）。\n4. **人物中途换演员级设定变更（容貌/声线）**：视为新资产——旧名冻结、新名注册（如 @林烬面具形态），旧新关系写入关系三角表，跨集快照同步双状态。\n5. **孩童角色**：年龄段锁定幼儿档（KB_01），禁用词生效（成人比例/成熟眼神）；其\"缺陷\"降级为\"天真特质\"，代价事件不得涉及真实伤害（平台合规）。\n6. ** deceased/回忆角色（白月光）**：只以\"定格画面+逆光回眸\"资产存在，禁止给完整动态小传——回忆角色的崩坏成本最高，出场即特写定格。"}]},{"g":"🎬 导演·美术·场记","items":[{"p":"skills/02_visual_director_skills/skill_art_style_costume_prop.md","t":"美术风格与穿搭道具技能（VIS-02）· 工业级完整版","d":"WHAT：美术指导技能——全局@画风锁制定与变更管控、60-30-10色彩脚本、人物穿搭层次拆解、场景与道具视觉设定、音色视觉转听觉基线。WHEN：剧集初始化定画风、新角色/场景/道具上妆、出具色彩脚本或美术总说明时触发。","raw":"# 美术风格与穿搭道具技能（VIS-02）· 工业级完整版\n\n## 一、核心职责与工业级法则（6 条硬核铁律）\n\n1. **画风锁唯一权威铁律**：`@画风锁` 由本技能制定、由资产注册表常量区登记、由所有 Prompt 末尾逐字挂载；任何角色/词典/插件不得私自增删画风锁字符。锁内五要素（流派质感/细节颗粒度/光影氛围/影调色温/画质词缀）缺一即不合格。\n2. **双签变更铁律**：画风锁一经定稿不可篡改；变更须美术指导提请 + 编剧确认（不影响叙事调性）双签，全局替换并通知所有未完成分集重编译，旧锁在变更登记中留档（回滚依据）。\n3. **色彩 60-30-10 强制配比铁律**：每个场景必须给出主色 60% / 辅助 30% / 点缀 10% 的具体色相与占比句式（可直接编译进 Prompt）；无配比的\"氛围温暖\"判废。人物服装主色不得与场景主导色同色相（防人物融进背景）。\n4. **穿搭四件套+三层次铁律**：每套服装必须齐\"版型+面料+配色+工艺细节\"四件套，并拆解为三层（基底层/中间层/点缀层）；层次 ≥3 的穿搭视频镜头必须降速（层次越多越易粘连，崩坏08）。\n5. **道具可拆解铁律**：核心道具必须拆到\"部件×材质×记忆点\"三级（如剑身/剑格/剑柄各自材质索引 KB_04），并绑定归属人物与持握手别——不可拆解的道具没法出三视图，没三视图的道具跨镜必变形（崩坏12）。\n6. **色温连续性铁律**：同场次色温锁定（黄昏金橙不得中途变正午）；双线剧两线色温对撞须在分线追加缀中显式声明，切换点由导演备注（转场类型）承接。\n\n## 二、标准执行 SOP（Step-by-Step）\n\n**Step 1 · 查表定画风**：读 `KB_05` 14 型流派表选型 → 按\"结构公式\"（流派质感+细节颗粒度+光影氛围+影调色温+画质词缀）拼装 @画风锁 → 检查与题材/情感基调匹配 → 交注册表登记。\n\n**Step 2 · 出色彩脚本**：读 `KB_04` 五节色彩心理学表与六节 60-30-10 公式，为每个场景填色彩脚本表（含编译句式列——逐字可进 Prompt）。\n\n**Step 3 · 拆穿搭**：读 `KB_03` 题材套装表选编号 → 补齐四件套 → 按三层次拆
