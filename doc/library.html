解表展开 → 配饰 ≤3 件 → 写入人物视觉卡并同步 KB_02 外貌锁定摘要的穿搭索引。\n\n**Step 4 · 拆场景**：每场景出\"空间三段（前/中/远景）+光源方向与色温+关键陈设记忆物 3 件\"。\n\n**Step 5 · 拆道具**：按三级拆解 + 材质索引 + 持握手别 + 记忆点；交 VIS-03 出三视图。\n\n**Step 6 · 音色转听觉**：为每人出音色基线（音色质感/语速档/情感倾向），交 AUD-01 落地克隆卡。\n\n**Step 7 · 自检**：对照 4.1 画风锁自检清单与铁律 3/4/5 逐项打勾；产出变更登记（如有）。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约\n\n| 字段 | 类型 | 必填 | 示例 |\n|---|---|---|---|\n| 题材/基调 | text | 是 | 东方玄幻×冷 / 都市温情×暖 |\n| 人物清单 | list | 是 | 含原型与年龄段（来自 NARR-02） |\n| 场景/道具清单 | list | 是 | @玄天宗比武台 / @焚天断剑 |\n| 参考风格 | text | 否 | \"对标《XXX》电影感\" |\n\n### 输出契约（下游：VIS-03 资产 / R5 生图 / R6 视频 / AUD-01）\n\n```yaml\n@画风锁:\n  常量: \"电影级东方新国风写实厚涂质感，细腻皮肤纹理与织物纤维细节，volumetric 体积光氛围，高对比冷暖双色温影调，8K超高清画质，电影感构图\"\n  追加缀: {苍穹线: \"+冷青蓝主调+剑气银白高光\", 烟火线: \"+暖金橙主调+黄昏柔焦光晕\"}\n  例外条款: \"资产锁定图将'体积光氛围'替换为'均匀漫射平光'（KB_06 优先），其余逐字保留\"\n色彩脚本:\n  - 场景: \"@光大街边\"\n    编译句式: \"画面以暖金橙黄昏色调为主导（约六成），辅以梧桐绿荫与楼宇灰调（约三成），点缀美食摊蒸腾白雾与暖黄灯串（约一成）\"\n人物穿搭:\n  - \"@李梅\": {套装编号: \"DS-01\", 四件套: \"米白针织开衫+浅杏连衣裙｜罗纹针织面料｜米白+浅杏｜小圆领罗纹袖口\", 三层: \"基底=浅杏连衣裙 / 中间=米白开衫 / 点缀=帆布托特包+素色发夹\", 配饰: 3件, 视频降速: \"层次3层,奔跑镜禁用\"}\n道具卡:\n  - \"@焚天断剑\": {归属: \"@林烬(右手)\", 三级拆解: \"剑身=玄黑锻打+暗红余烬纹 / 剑格=火焰纹铸铜 / 剑柄=暗红绫布缠绕\", 材质索引: \"KB_04玄铁+精钢+绫布\", 记忆点: \"断而不折(缺口位置固定在剑尖下1/3)\", 持握手别: \"右手持/背负时剑柄自左肩后探出\"}\n音色基线:\n  - \"@李梅\": \"温软治愈女声｜4字/秒｜尾音轻扬带暖意｜安慰段气声增多\"\n```\n\n## 四、专项工具箱\n\n### 4.1 全局 @画风锁 制定规范\n\n**结构公式**：\n```text\n@画风锁 = [流派与质感]（KB_05流派表） + [细节颗粒度]（皮肤纹理/织物纤维级） + [光影氛围]（体积光/柔焦/颗粒） + [影调色温]（冷暖对比/单色系） + [画质词缀]（8K/大师级/电影感）\n```\n**制定流程**：选流派 → 填五要素 → 双线剧另出追加缀 → 登记 → 全剧挂载。\n**自检清单**：\n- [ ] 五要素齐全且无互相矛盾（\"赛璐璐平涂\"与\"细腻皮肤纹理\"互斥）？\n- [ ] 与题材基调匹配（温情剧不用高对比暗黑）？\n- [ ] 各线追加缀色温声明？\n- [ ] 资产图例外条款已注明？\n- [ ] 变更流程（双签+全局替换+留档）已写进剧集圣经？\n\n### 4.2 60-30-10 色彩脚本表（含编译句式）\n\n| 场景 | 主导色 60% | 辅助色 30% | 点缀色 10% | 可编译句式（逐字入 Prompt） |\n|---|---|---|---|---|\n| @玄天宗比武台 | 冷青蓝（天光+雷云） | 灰白云海+石质灰 | 符文银白高光 | \"冷青蓝主调天光为主导（约六成），辅以云海灰白与石质灰（约三成），符文银白高光点缀（约一成）\" |\n| @光大街边 | 暖金橙（黄昏） | 梧桐绿荫+楼宇灰 | 白雾热气+暖黄灯串 | \"暖金橙黄昏色调为主导（约六成），辅以梧桐绿荫与楼宇灰调（约三成），点缀蒸腾白雾与暖黄灯串（约一成）\" |\n| 悬疑夜巷 | 墨绿+紫黑 | 冷灰水泥 | 单点暖光（一盏灯） | \"墨绿紫黑主调（约六成），冷灰（约三成），单点暖光（约一成）\" |\n\n**点缀色在场核查**：逐镜核对 10% 点缀色元素是否入画——点缀色丢失=画面变\"脏\"（场记核查项）。\n\n### 4.3 人物穿搭层次与道具细节拆解表\n\n| 拆解维度 | 人物穿搭（@李梅 示例） | 道具（@焚天断剑 示例） |\n|---|---|---|\n| 基底/部件一 | 浅杏色连衣裙（A字裙摆） | 剑身：玄黑锻打纹理+暗红余烬纹+断口在剑尖下1/3 |\n| 中间/部件二 | 米白针织开衫（罗纹袖口、小圆领） | 剑格：火焰纹铸铜 |\n| 点缀/部件三 | 帆布托特包（斜挎）+素色发夹 | 剑柄：暗红绫布缠绕+剑镡云纹 |\n| 面料/材质索引 | KB_04 针织/帆布 | KB_04 玄铁/精钢/绫布 |\n| 状态派生登记 | 派生 `@李梅雨夜`（湿发+贴身裙摆）需登记 | 派生 `@焚天断剑觉醒`（纹路发亮）需登记 |\n| 视频防崩备注 | 层次 3 层→奔跑镜禁用/风镜降速 | 大动作镜加\"剑始终握于右手、不入画出画\" |\n\n## 五、常见错误示范 vs 满分工业级示范\n\n### 对比组 1：画风锁制定\n\n❌ **Bad Case**：\n> 画风：整体要高级一点，有电影感，然后色彩要丰富，人物要精致，背景要有意境，偶尔可以来点国风元素。\n\n**扣分点**：五要素全缺；\"高级/意境/偶尔\"不可执行不可验收；无画质词缀无色温声明；双线剧无追加缀——每条 Prompt 挂载后必然画风漂移。\n\n✅ **Good Case**：\n> `@画风锁 = 电影级东方新国风写实厚涂质感（流派+质感），细腻皮肤纹理与织物纤维细节（颗粒度），volumetric 体积光氛围（光影），高对比冷暖双色温影调（色温），8K超高清画质、电影感构图（词缀）`；苍穹线追加\"冷青蓝主调+剑气银白高光\"，烟火线追加\"暖金橙主调+黄昏柔焦光晕\"；资产图例外条款：体积光→均匀漫射平光。已登记注册表常量区。\n\n### 对比组 2：穿搭拆解\n\n❌ **Bad Case**：\n> @李梅穿着一身温柔知性的秋装，米色系搭配很有气质，整体给人岁月静好的感觉，包包和鞋子也很搭配。\n\n**扣分点**：无版型（开衫还是风衣？）、无面料、无工艺细节、无三层次、\"米色系\"到底几件米色？视频模型自由发挥=每镜换装；\"岁月静好\"不是服装词。\n\n✅ **Good Case**：见\"输出契约\"中 @李梅 完整拆解——DS-01 编号+四件套+三层拆解+配饰 3 件+降速备注；美术、生图、场记三方拿同一张卡工作，跨镜零歧义。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **双线双色温剧**：两线各自追加缀独立声明；切换集的切换镜在色彩脚本中加\"交叉过渡 0.3s\"条目（冷青→暖金交叉溶），交 R8 执行。\n2. **派生画风锁（回忆/梦境/幻境）**：不新建锁——在主锁后追加强限定缀（\"水彩晕染回忆滤镜/低饱和梦境\"），并限定仅在该段落镜头挂载；段落结束回归主锁。\n3. **跨季/跨篇章服装升级**：新套装=新派生资产（`@林烬宗门大比礼服`），走 VIS-03 五件套流程；旧套装注册表不删（ flashback 镜头引用）。\n4. **服装与背景同色相冲突**：优先改服装点缀层色相（成本最低）；服装已锁定则改场景辅助色 30% 的色相，并在色彩脚本表更新编译句式。\n5. **道具频繁易主剧情**：道具卡\"归属\"列改多人清单+持握手别矩阵（谁/哪只手/何时）；每次易主在分镜备注强制写显式交接动作（抛/递/掉落），交 R4 入核对清单。\n6. **极简主义/黑白风格剧集**：60-30-10 退化为\"明度 60-30-10\"（高调/中调/低调配比），色彩脚本表填明度值而非色相，其余流程不变。"},{"p":"skills/02_visual_director_skills/skill_asset_pure_chinese_no_light.md","t":"纯中文零光影资产技能（VIS-03 · 核心）· 工业级完整版","d":"WHAT：【核心】重要资产图策划技能——@纯中文资产名命名正则约束、Albedo漫反射零高光阴影正面物理词库、人物主图/正交三视图/多表情矩阵/全景场景/道具三视图五套完整编译模板、三视图切分单人参考图防多头怪指南。WHEN：新资产入库、产出《重要资产图片提示词》文档、任何需要资产设定图的时刻触发。","raw":"# 纯中文零光影资产技能（VIS-03 · 核心）· 工业级完整版\n\n## 一、核心职责与工业级法则（6 条硬核铁律）\n\n1. **命名正则铁律**：资产名必须满足 `^@[\\u4e00-\\u9fa5]{2,6}$`——`@` 后接 2~6 个纯中文汉字，严禁英文字母、数字、下划线、连字符、空格与任何特殊符号。派生名 = `@母资产名+状态词`（如 `@林烬战损`、`@光大街边夜`），同样受正则约束。未通过正则的名字，场记 R4 拒绝登记，生图专家 R5 拒绝引用。\n2. **正面物理描述铁律（Albedo 核心）**：扩散模型对否定词不敏感——\"无高光无阴影\"反而注入高光/阴影的概念激活。资产图一律使用 `KB_06` 第一节词库（唯一权威源）中的**正面物理状态描述**（\"360度环形无影棚拍柔光\"替代\"不要阴影\"）。\n3. **图集五件套铁律（人物）**：每位人物必须产出——①人物主图 ②正侧背正交三视图 ③多表情矩阵（3x3）④独立面部特写 ⑤独立全身立绘。缺任何一件，该人物禁止进入视频生产（④⑤是防\"三人同框\"的解药，见 4.4）。\n4. **画风锁例外铁律**：资产锁定图（三视图/矩阵/立绘/特写）挂载 @画风锁 时，锁内光影词\"体积光氛围\"必须替换为\"均匀漫射平光\"，其余字符逐字保留——零光影铁律优先级高于画风锁。\n5. **单镜防呆铁律**：三视图/表情矩阵只用于锁定设定（存档/LoRA 训练/Inpainting 锁脸参考），**严禁直接喂给视频模型或作为单镜首帧**——必须先切分出单人参考图（4.4 指南）。\n6. **先登记后引用铁律**：任何 Prompt 中出现的 `@资产名` 必须先在资产注册表登记（含外貌锁定摘要）；评分官 R7 对未注册资产直接 G1/V1 一票否决。\n\n## 二、标准执行 SOP（Step-by-Step）\n\n**Step 1 · 命名与登记**：按铁律 1 正则起名 → 查注册表去重（同音歧义禁止，如\"李梅/李湄\"不同时注册）→ 场记登记（人物/场景/道具/派生分区）→ 领取使用权。\n\n**Step 2 · 查表定图集**：人物走五件套；场景两件套（全景图+空镜基准图）；道具两件套（正交三视图+特写基准图）。在输出契约\"图集清单\"中打勾管理。\n\n**Step 3 · 逐图编译**：调取 `KB_06` 第四节母版①~⑦逐字复制后填空编译（[ ] 占位符全部替换为注册表锁定摘要关键词，禁留空，并过本技能 4.3 填空校验清单）；每条 Prompt 末尾挂画风锁（按铁律 4 替换光影词）+ 画幅 + 分辨率。\n\n**Step 4 · 防呆标注**：在三视图与矩阵 Prompt 下方追加\"单镜参考防呆说明\"（4.4 精简版），并在《重要资产图片提示词.md》〇节统一声明。\n\n**Step 5 · 送检**：全部 Prompt 送 R7 评分（G 表，G1/G4/G7/G8 为否决级），≥9.0 写入产出文档；同时附生图平台建议（豆包 Seedream 4.0 主力 / ComfyUI Flux 锁脸批量）。\n\n**Step 6 · 自检**：对照 4.5 质检自查表逐项打勾，交注册变更单给场记归档。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约\n\n| 字段 | 类型 | 必填 | 说明 |\n|---|---|---|---|\n| 资产类型 | enum | 是 | 人物 / 场景 / 道具 |\n| 设定来源 | 卡片 | 是 | 人物小传（NARR-02）/ 场景卡、道具卡（VIS-02） |\n| 母资产名 | @名 | 派生时 | 生成 `@母+状态词` |\n| 图集需求 | enum | 是 | 五件套 / 两件套 |\n\n### 输出契约（下游：R5 生图执行 / R7 评分 / R4 登记）\n\n```yaml\n命名合规判定: {资产名: \"@林烬\", 正则: \"^@[一-龥]{2,6}$\", 判定: \"通过\", 查重: \"无冲突\"}\n图集清单: {主图: \"✓9.4分\", 三视图: \"✓9.3分\", 表情矩阵: \"✓9.2分\", 面部特写: \"✓9.5分\", 全身立绘: \"✓9.4分\"}\n编译Prompt: [\"```prompt …```\" × 5]\n防呆说明: \"三视图仅锁定设定；视频首帧前必须切分④⑤单人参考图，防多头怪\"\n送检状态: \"全部≥9.0，已写入 workspace/重要资产图片提示词.md\"\n注册变更单: {新增: [], 派生: [], 摘要更新: []}\n```\n\n## 四、专项工具箱\n\n### 4.1 @纯中文资产名命名正则与规则\n\n```text\n正则：^@[\\u4e00-\\u9fa5]{2,6}$\n合规示例：@林烬 @李梅 @张三 @玄天宗比武台 @光大街边 @焚天断剑 @林烬战损 @光大街边夜\n违规示例（一律打回）：\n  @LiMei_v2（英文+数字+下划线）  @street-01（英文+连字符）  @张三3（数字）\n  @焚天·断剑（特殊符号）  @玄天宗比武台广场连带观礼席（超6字冗长）\n命名细则：2~6字为宜；人物用姓名或姓名+身份词；场景用地点核心名；派生用\"@母+状态词\"且状态词≤2字优先。\n```\n\n### 4.2 Albedo 零光影词库与编译母版 · 调用指针（表存于 KB_06，此处不抄副本）\n\n> 去重铁律：Albedo 正反词组与七套编译母版以 `kb_library/KB_06` 为唯一权威源——本技能只存指针与填空校验，防两处版本漂移。\n\n| 素材 | 唯一权威源（现查现用） |\n|---|---|\n| 正面物理词组 22 组（❌否定式 → ✅物理式逐维对照）+ 英文对照串 | `KB_06` 第一节 |\n| 编译母版：①人物主图 ②正交三视图 ③3x3表情矩阵 ④独立面部特写 ⑤独立全身立绘 ⑥场景空镜基准 ⑦道具三视图 | `KB_06` 第四节（逐字复制后填空） |\n\n### 4.3 母版填空校验清单（调用 KB_06 母版后逐项核对）\n\n- [ ] 每个 `[ ]` 槽位均用**注册表锁定摘要原词**填充（禁现场自造同义词）？\n- [ ] 骨相槽取 `KB_02` 摘要 5~8 词；套装槽取 `KB_03` 编号+四件套？\n- [ ] 三视图\"背面关键细节\"槽：背饰/包带/垂帽走向已明确？\n- [ ] 表情矩阵九格均为\"具体面部动作\"词（禁抽象词\"开心/难过\"）？\n- [ ] `@画风锁` 已挂载且例外条款执行（光影氛围词 → 均匀漫射平光）？\n- [ ] 线别追加缀、画幅、分辨率（4K）三件齐？\n\n### 4.4 三视图切分单人参考图防多头怪指南\n\n**问题**：视频/单镜生图模型把三视图识别为\"三个人同框\"→ 复制人、全员乱张嘴、串脸（黑名单崩坏05/06 前置诱因）。\n\n**切分流程（四步）**：\n1. **选格**：从三视图中裁出\"正面\"单格（视频首帧基本只用正面；侧面格供侧拍镜备用）。\n2. **补图**：裁切格分辨率不足时，以该格为图生图参考（重绘 0.3）重出高清单人图——`独立正面全身立绘图`（A-Pose 微张 20 度，纯白背景，9:16 竖构图便于竖屏镜）。\n3. **特写**：另出 `独立面部特写图`（发际线至锁骨，1:1）——多图参考素材位的锁脸首选。\n4. **入位**：即梦素材位\"人物立绘 1 位 + 面部特写可选 1 位\"；ComfyUI 用 PuLID/IP-Adapter 挂面部特写；可灵首帧直接用单人立绘合成图。\n\n**红线**：素材位/首帧/ControlNet 参考图中出现完整三视图或矩阵图 = 防呆违规，R7 按 G8 关联扣分。\n\n### 4.5 资产图质检自查表（送 R7 前自检）\n\n- [ ] 名称过正则且在册？ [ ] 五件套/两件套齐全？ [ ] Albedo 词组逐字在、无否定式残留？\n- [ ] A-Pose 手臂与躯干间空隙可见（无粘连）？ [ ] 背景纯白/18%灰？\n- [ ] 三视角同比例同间距无透视？ [ ] 矩阵九格同一张脸（骨相一致）？\n- [ ] 画风锁挂载且光影词已按例外条款替换？ [ ] 画幅+分辨率标注？\n- [ ] 防呆说明已附（三视图/矩阵图下方）？ [ ] ④⑤单人参考图已列入生产计划？\n\n## 五、常见错误示范 vs 满分工业级示范\n\n### 对比组 1：零光影写法\n\n❌ **Bad Case**：\n> @李梅三视图：米色穿搭的温柔女性三视图，无高光，无阴影，不要透视，背景干净，画面简洁，细节丰富。\n\n**扣分点**：全否定式（模型反而注入光影概念）；\"米色穿搭\"无四件套；无 A-Pose（衣袖粘连风险）；\"背景干净/细节丰富\"空洞矛盾——G4 一票否决，评分 ≤8.5 打回。\n\n✅ **Good Case**（模板②填空）：\n```prompt\n角色设定三视图（Turnaround Sheet）：@李梅，圆脸尖下巴柳叶眉杏眼，栗色齐肩微卷发素色发夹，米白针织开衫+浅杏色连衣裙，帆布托特包斜挎；A-Pose双臂自然微张约30度防袖身粘连，双脚与肩同宽；正面、左侧面、背面三视角等距水平排列，同一角色三个视角比例严格一致（非三个人物，非合影），全身完整造型含背面斜挎包带走向；360度环形无影棚拍柔光，均匀漫射平光，漫反射固有色贴图质感（Flat Lit Albedo / Diffuse Pass），正交投影相机零透视畸变，中性18%灰背景，@画风锁（体积光替换为均匀漫射平光）+暖金橙主调黄昏柔焦光晕，16:9横幅，4K\n```\n**过审依据**：正面物理词逐字挂载、四件套齐全、A-Pose 防粘连、含\"非三个人物\"反制词——G4/G5/G6 全过，9.4 分放行。\n\n### 对比组 2：单镜参考使用\n\n❌ **Bad Case**：\n> 镜头2 视频生成：上传 @张三 的三视图作为参考图，生成孩子在街上走路的视频，保持人物一致。\n\n**扣分点**：三视图整张入参考位=多头怪诱因（视频模型见\"三个张三\"）；\"保持一致\"无机制支撑。\n\n✅ **Good Case**：\n> 镜头2 素材位1：@张三 独立全身立绘（自三视图正面格切分+重绘 0.3 补高清）；Prompt 引用 `@张三（天蓝小熊耳卫衣，身高约一米一）`+一致性行\"人物与参考素材保持一致\"；备选素材位 2：@张三 独立面部特写（微表情戏时替换主参考）。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **带翅膀/披风/长裙摆角色三视图**：横向上占用超宽导致三视角挤压——改出\"两件套拆分版\"：正面+侧面一张、背面单独一张（均同规范）；或 T-Pose 改 A-Pose 收窄展幅；裙摆触地角色加\"裙摆边缘与背景留 5% 空隙\"防粘连。\n2. **双人 CP 资产（情侣/母子连体镜高频）**：可注册\"双人组合立绘\"派生资产（`@母子同行`，母左子右固定站位），一次性锁定双人身高差与间距——比每次双参考融合更稳；命名仍受正则约束。\n3. **场景带文字招牌需求**：资产阶段一律生成\"字迹模糊虚化\"版本（清晰文字必乱码，崩坏11）；拍摄所需可读文字由剪映后期贴字，在场景卡备注\"文字后期贴\"。\n4. **道具与手部强绑定（戒指/手套类）**：特写基准图加\"无手部佩戴展示，悬空平摆\"规避手部崩坏；佩戴态由视频阶段差分生成。\n5. **非人形资产（灵宠/机甲/法器）**：五件套退化为三件套（主图/三视图/特写），\"表情矩阵\"改为\"形态矩阵\"（待机/攻击/受损三形态）。\n6. **资产迭代（用户对已过审资产改设定）**：旧图不删——新摘要登记后出\"V2 图集\"，注册表标注版本与生效集数；已拍镜头维持 V1（防跨集突变），未拍镜头切 V2。"},{"p":"skills/02_visual_director_skills/skill_continuity_axis_guard.md","t":"连续性轴线守卫技能（VIS-04 · 防穿帮守门员）· 工业级完整版","d":"WHAT：场记与连续性监督技能——180度轴线法则校验表、跨镜头左右站位/视线方向/手持道具左右手/战损污渍状态四项核对清单、跨集State Diff快照生成与继承。WHEN：分镜表产出后核查、每集定稿生成快照、下一集开拍前读快照核对、发现穿帮问题时触发。","raw":"# 连续性轴线守卫技能（VIS-04 · 防穿帮守门员）· 工业级完整版\n\n## 一、核心职责与工业级法则（6 条硬核铁律）\n\n1. **轴线半圆铁律**：一场戏确立轴线（人物 A→B 连线或运动方向线）后，本场所有机位必须位于轴线**同一侧半圆**内活动；任何镜位的\"机位\"字段必须能回代到轴线声明，回代失败=疑似越轴，整场退回导演。\n2. **合法越轴三选一铁律**：确需越轴时必须且只能用——①中性镜过渡（正对/背对轴线的骑轴镜）②动作剪辑点越轴（大幅动作顶点帧遮越轴）③主体改写轴线（转身/走动，需一个跟随镜交代）；三种手段之外的越轴一律不批。\n3. **左右站位跨镜恒定铁律**：人物在画面中的左右位置跨镜恒定（对话正反打尤甚）；同场内站位变化必须由剧本显式事件（换位/推开）驱动，并在分镜备注留痕。\n4. **持物手别恒定铁律**：每个道具绑定\"归属人+左右手\"（@焚天断剑=林烬右手）；换手/易主必须写显式过渡动作（抛/递/掉落）；无过渡的换手=穿帮。\n5. **战损只增不减铁律**：服装战损/污渍/发型凌乱按时间单向累积，只有剧本明确事件（更换/治疗/洗澡）才能重置；每处战损按\"部位+程度+左右侧\"三要素登记进快照。\n6. **快照继承放行铁律**：下一集任何提示词引用人物/场景前，必须与最新 State Diff 快照五项全对齐（服装/伤势/持物/位置/情绪刻度+场景时空）——不对齐不准开拍，上报导演回修剧本。\n\n## 二、标准执行 SOP（Step-by-Step）\n\n**Step 1 · 读入**：读 `KB_07` 七节轴线与机位半圆规范；读入分镜总表 14 字段、场次轴线声明表、最新跨集快照。\n\n**Step 2 · 轴线校验**：逐镜把\"机位\"字段回代到所属场次轴线声明——同侧打 ✓；异侧检查该镜\"轴线标记/备注\"列是否有合法越轴三选一记录，有则 ✓（标记\"合法越轴\"），无则 ✗ 记入穿帮上报单。\n\n**Step 3 · 四项核对**：按 4.2 清单逐\"镜号→镜号\"对核对：左右站位 / 视线方向 / 持物手别 / 战损污渍；任何一项冲突记上报单（镜号对+核对项+冲突描述）。\n\n**Step 4 · 时空核对**：逐场次核对时间天气光效（黄昏金橙不得中途变正午）与关键陈设（白雾/灯串在场状态）。\n\n**Step 5 · 生成快照**：本集定稿时按 4.3 模板产出\"本集结束状态快照\"（人物五项表+场景表+道具流向+叙事钩子遗留+音色状态），同步写入 `memory/projects/[剧名]/跨集状态快照_StateDiff.md`（新快照置顶，旧快照归档）。\n\n**Step 6 · 派生登记**：快照中出现的新状态（战损/换装/夜景）→ 同步在《资产注册表.md》派生区登记（如 `@林烬战损`），未登记的派生态禁止上镜。\n\n**Step 7 · 放行判定**：轴线+四项+时空全绿 → 出具\"开拍放行判定\"；有红项 → 穿帮上报单退回导演 R2 修表。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约\n\n| 字段 | 类型 | 必填 | 说明 |\n|---|---|---|---|\n| 分镜总表 | 14字段表 | 是 | VIS-01 产出 |\n| 轴线声明表 | table | 是 | VIS-01 Step2 产出 |\n| 最新快照 | StateDiff | 是 | 上一集留存 |\n| 变更事件清单 | list | 是 | 剧本中的换装/易主/受伤事件 |\n\n### 输出契约（下游：R2 回修 / R5R6 生产放行 / 记忆库）\n\n```yaml\n轴线校验结果:\n  - {场次: A, 镜号范围: 1, 轴线: \"台心—长老席连线\", 结果: \"✓东半圆\", 越轴: \"镜1骑轴俯拍=合法(手段②)\"}\n  - {场次: B, 镜号范围: 2-4, 轴线: \"街道纵深(向右)\", 结果: \"✓南半圆全程\", 越轴: \"无\"}\n四项核对清单:\n  - {对: \"镜2→镜4\", 站位: \"✓母左子右\", 视线: \"✓张三仰视→李梅垂视互为对望\", 手别: \"✓李梅右手抚头\", 战损: \"✓均无伤\"}\n穿帮上报单: []   # 无\nStateDiff快照: {…见4.3…}\n资产注册变更单: {派生新增: [], 摘要更新: []}\n开拍放行判定: \"✅ 放行（轴线/四项/时空 全绿）\"\n```\n\n## 四、专项工具箱\n\n### 4.1 180 度轴线法则校验表（逐镜填写）\n\n| 镜号 | 场次轴线定义 | 本镜机位描述 | 回代判定 | 越轴手段（仅异侧时填） | 结论 |\n|---|---|---|---|---|---|\n| 2 | B场·街道纵深线（行进向右） | 平视前侧45°跟拍 | 同侧·南半圆 | —— | ✓ |\n| 3 | 同上 | 固定平视（摊位侧） | 同侧·南半圆 | —— | ✓ |\n| 4 | 同上 | 越@张三右肩拍@李梅 | 同侧·南半圆 | —— | ✓ |\n| 1 | A场·台心—长老席连线 | 低角度仰拍（东） | 同侧·东半圆 | —— | ✓ |\n\n### 4.2 四项跨镜核对清单（\"镜号→镜号\"逐对过）\n\n| 核对项 | 核对内容 | 数据源 | 常见穿帮 |\n|---|---|---|---|\n| ① 左右站位 | 人物画面左右位置跨镜恒定 | 分镜表机位+构图字段 | 正反打拍反（左右互换） |\n| ② 视线方向 | A 视线出画方向 = B 所在方位；对望镜互为反向 | 秒级节点+备注 | A 向左看 B 却在左侧画内（应 B 在画外左） |\n| ③ 持物手别 | 道具归属人+左右手跨镜一致；换手有显式过渡 | 道具卡+分镜备注 | 镑剑忽左忽右；摸头手左右横跳 |\n| ④ 战损污渍 | 部位+程度+左右侧按时间单向累积 | StateDiff+变更事件 | 上镜已伤下镜痊愈；血痕左右脸跳 |\n\n**执行格式**：`{对: \"镜N→镜N+1\", 站位: ✓/✗, 视线: ✓/✗, 手别: ✓/✗, 战损: ✓/✗}`，任一 ✗ 触发上报。\n\n### 4.3 State Diff 快照模板（集末五表）\n\n```markdown\n### 本集结束状态快照（Episode State Snapshot）\n**人物状态**：\n| @人物 | 服装 | 伤势/妆容 | 情绪刻度(1-10) | 持有道具 | 位置 |\n**场景状态**：\n| @场景 | 时间 | 天气/光效 | 关键陈设变化 |\n**道具流向**：[道具→归属人+手别+状态]\n**叙事钩子遗留（供下集承接）**：[≥1条]\n**音色状态**：[克隆方案有无异常]\n```\n\n### 4.4 开拍前继承核对流程（下集 Step 0）\n\n1. 读最新快照五表 → 2. 逐人物比对：服装/伤势/持物/位置/情绪 → 3. 逐场景比对：时间天气陈设 → 4. 全对齐出具放行；任一冲突 → 上报 R2 回修剧本（改剧本比穿帮重拍便宜一百倍）。\n\n## 五、常见错误示范 vs 满分工业级示范\n\n### 对比组 1：轴线校验\n\n❌ **Bad Case**：\n> 镜头2 从母亲背后拍摄母子前行；镜头3 切到母亲面前迎面拍摄母子走来；镜头4 越孩子肩膀拍母亲。\n\n**扣分点**：镜2\"背后拍\"与镜3\"迎面拍\"分属轴线两侧且无任何合法越轴手段记录——观众方向感瞬间崩塌（孩子从妈妈右边跳到左边）。\n\n✅ **Good Case**：\n> 轴线声明：B场·街道纵深线（行进向右），机位锁南侧半圆。镜2 前侧 45°跟拍（南）→ 镜3 摊位侧固定（南）→ 镜4 越 @张三 右肩拍 @李梅（南）。如确需迎面镜：先插镜 2.5 骑轴正俯（手段①中性镜），再接迎面镜——校验表标注\"镜2.5=合法越轴过渡\"。\n\n### 对比组 2：战损与持物跨集继承\n\n❌ **Bad Case（穿帮三连）**：\n> 第2集开拍：@林烬 衣袍整洁立于台心（第1集结尾明明已\"左肩撕裂渗血\"）；@焚天断剑 挂在左侧剑鞘（注册表锁右手持/背负剑柄自左肩探出——剑柄方向反了）；@张三 手里多了个没来由的气球（第1集道具流向=无）。\n\n**扣分点**：三个穿帮全是\"没读快照直接开拍\"——战损重置违反铁律5、剑柄方向违反道具卡、气球无来源违反道具流向。\n\n✅ **Good Case**：\n> 第2集 Step0 继承核对：读快照\"左肩衣袍撕裂渗血、剑收入背负（剑柄自左肩后探出）、张三无持物\"→ 剧本如有\"疗伤\"事件则先登记 `@林烬疗后`（浅色绷带+撕裂仍在）派生资产再开拍；无事件则所有镜头 Prompt 引用 `@林烬战损` 状态词——五项全对齐，出具放行。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **运动轴线切换（人物转身改行进方向）**：轴线随之改写——必须在\"转身镜\"的分镜备注写明\"本镜后轴线改写为 X\"，校验表分前后两段分别回代；缺失改写记录按穿帮处理。\n2. **多轴线同场（三人以上对话）**：以\"主要对手戏二人连线\"为主动轴，第三人以\"插入镜+越轴三选一\"处理；禁止三人各自成轴（观众无法建立空间感）。\n3. **跨集快照冲突（下集剧本与快照矛盾）**：一律剧本让步回修；若剧本不可改（档期原因），走\"显式过渡事件\"补拍一镜（换装镜/疗伤镜）抹平差异并更新快照。\n4. **平行蒙太奇双线并行**：两线各自独立轴线与快照，剪辑顺序不影响各自连续性；快照按线分别记录，合并进同一 StateDiff 文档的两个分区。\n5. **回忆/闪回镜头**：闪回内使用\"回忆时点快照\"（历史版本），非当前快照——StateDiff 文档保留历史归档区供回溯引用；闪回镜在分镜备注标\"闪回@第N集状态\"。\n6. **长镜头接力段的场记**：尾帧接力（VID-02）的接力镜视为同场次延续，站位/手别以尾帧实际画面为准回填核对清单——发现尾帧画面已漂移时，以快照登记值为准重出尾帧。"},{"p":"skills/02_visual_director_skills/skill_director_storyboard.md","t":"导演分镜拆解技能（VIS-01）· 工业级完整版","d":"WHAT：导演分镜拆解技能——剧本场次切镜、14字段标准分镜表填写、S/A/B算力分级判定、16:9与9:16构图互转、Cutaway救场缓冲镜规划。WHEN：剧本定稿进入视觉开发阶段，或用户要求'拆分镜/镜头分级/竖屏改造/加缓冲镜/定轴线'时触发。","raw":"# 导演分镜拆解技能（VIS-01）· 工业级完整版\n\n## 一、核心职责与工业级法则（6 条硬核铁律）\n\n1. **一镜一主动作铁律**：一个镜头只允许 1 个主动作 + 1 个次级微动作 + 1 种运镜；第二个主动作出现即拆镜。AI 视频模型的时间轴算力有限，\"边走边说边转身\"三连动作必崩（崩坏04/03 前置）。\n2. **一镜一机位铁律**：单条视频提示词内严禁出现第二个机位描述（\"先全景再特写\"是剪辑语言不是生成语言）；机位切换发生在剪辑台上，不发生在 Prompt 里。\n3. **时长来自声画先行铁律**：台词镜头的时长由 NARR-03 精算结果决定（铺垫+台词+余韵），导演无权为了节奏硬改——要改节奏就改语速档重算或拆镜。\n4. **S/A/B 强制标注铁律**：每镜必须标注算力等级且通过 4.2 判定标准打分（≥3 项命中 S）；S 级镜头数量每集 ≤15%（约每 6~7 镜 1 个 S），防止算力预算爆炸。\n5. **Cutaway 配额铁律**：每 2~3 个主镜头必须规划 1 个 1~2 秒缓冲镜（特写插入/反应镜），全集 Cutaway 占比 ≥15%；缓冲镜默认 B 级（零视频生成，静态图+关键帧）。\n6. **轴线先行铁律**：拆镜前先写场次轴线声明（谁在左、运动方向、机位半圆侧），分镜表每镜的机位字段必须能回代到轴线声明上；场记 R4 核查不通过的表整场退回。\n\n## 二、标准执行 SOP（Step-by-Step）\n\n**Step 1 · 查表读入**：读 `KB_07`（构图词典+多人空间分区+竖屏法则+轴线规范）、`KB_11`（景别/机位/运镜词典+幅度控制）；读入 NARR-01 情绪波形表与 NARR-03 台词精算表。\n\n**Step 2 · 切场次+立轴线**：按\"场景×时空单元\"切场次；每场填轴线声明表（人物左右站位/运动方向线/机位半圆），写进分镜总说明。\n\n**Step 3 · 逐场拆镜**：按铁律 1/2/3 拆镜；台词镜先填\"时长\"列（来自精算），动作镜按 5s 上限（单镜 ≤5s，需更长走尾帧接力并标注）。\n\n**Step 4 · 逐镜分级**：按 4.2 判定标准给每镜打 S/A/B；统计 S 级占比（≤15%）与 B 级占比（≥20% 为健康，降本）。\n\n**Step 5 · 画幅适配**：16:9 集按 KB_07 三节构图；9:16 集逐镜过 4.3 转换表重写构图字段（禁横向铺开）。\n\n**Step 6 · 排 Cutaway**：在对话场次与长动作场次按铁律 5 插入缓冲镜，标注供 R8 做 J/L-Cut 的切入点秒位。\n\n**Step 7 · 填 14 字段总表并自检**：逐镜 14 字段无空缺；交 R4 场记核查轴线与连续性，通过后交 R5/R6 生产。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约\n\n| 字段 | 类型 | 必填 | 说明 |\n|---|---|---|---|\n| 单集剧本 | text | 是 | 含台词与 NARR-03 精算结果 |\n| 画幅制式 | enum | 是 | 16:9 / 9:16 |\n| 情绪波形表 | table | 是 | NARR-01 产出（爆点秒位对齐 S 级） |\n| @资产清单 | list | 是 | 必须在资产注册表内 |\n\n### 输出契约（下游：R4 场记 / R5 生图 / R6 视频 / R8 剪辑）\n\n#### 14 字段标准分镜表（字段定义 + 填写规范）\n\n| # | 字段 | 填写规范（词源） | 示例 |\n|---|---|---|---|\n| 1 | 镜号 | 全集唯一递增 | 镜头3 |\n| 2 | 场次 | 场次号+场次名 | 场次B·母子买莽莽 |\n| 3 | 景别 | KB_11 一节八档 | 近景过肩 |\n| 4 | 机位 | KB_11 二节（含轴线回代） | 越@张三右肩拍@李梅（南侧半圆） |\n| 5 | 构图 | KB_07 一/三/四节 | 竖屏式紧凑过肩，主体占左2/3 |\n| 6 | 运镜 | KB_11 三节1种+幅度词 | 固定镜头·微幅 |\n| 7 | 时长 | NARR-03 精算或动作预估 | 4秒 |\n| 8 | 等级 | S/A/B（4.2 判定） | A级 |\n| 9 | @资产清单 | 注册表内纯中文名 | @李梅@张三@光大街边 |\n| 10 | 台词+口型模式 | 精算结果+模式A/B | 李梅台词（模式A，4s 含铺垫余韵） |\n| 11 | 秒级节点摘要 | 0.5s 网格 | [00-0.4s]抬手抚头；[0.4-3.6s]说台词；[3.6-4s]轻拍收势 |\n| 12 | Cutaway标记 | 是/否+用途 | 否（本镜为被缓冲主镜） |\n| 13 | 轴线标记 | 回代场次轴线声明 | B场·南半圆·不越轴 |\n| 14 | 备注 | 交棒特殊说明 | 手部腕部截断入画防崩；戏眼=说\"等爸爸\"眼神先亮后垂 |\n\n## 四、专项工具箱\n\n### 4.1 轴线声明表模板\n\n| 场次 | 轴线定义 | 人物站位 | 机位半圆 | 合法越轴手段（如有） |\n|---|---|---|---|---|\n| 场次B | 街道纵深线（行进向右） | @李梅左 / @张三右 | 南侧半圆全镜位 | 无（对话紧凑不越轴） |\n| 场次A | 比武台中心—长老席连线 | @林烬台心面向北 | 东侧半圆 | 骑轴俯拍1镜（大爆点揭示） |\n\n### 4.2 S/A/B 算力分级判定标准（命中 ≥3 项判 S；命中 1~2 项判 A；0 项判 B）\n\n| 判定项 | S 级信号 | A 级信号 | B 级信号 |\n|---|---|---|---|\n| 时间位置 | 黄金前3秒 / 集尾大爆点 | 中段常规推进 | 过渡/缓冲 |\n| 动作幅度 | 大幅肢体+特效（剑气/罡风） | 行走/转头/抬手 | 静止或微动 |\n| 视觉奇观 | 奇观元素（光柱/变身/坍塌） | 常规场景动态 | 特写静物/空镜 |\n| 情绪刻度 | 波形表刻度 ≥9 的爆点 | 5~8 推进段 | ≤4 铺垫段 |\n| 多资产复合 | ≥3 资产同框互动 | 2 资产 | 1 资产或纯空镜 |\n| 生成路线 | 首尾帧双锚+顶级模型 | 首帧单锚 I2V | 静态图+Lip-Sync+剪映关键帧 |\n\n### 4.3 16:9 ↔ 9:16 构图转换表（逐项对照改写\"构图\"字段）\n\n| 构图维度 | 16:9 横屏写法 | 9:16 竖屏强制转换写法 |\n|---|---|---|\n| 空间铺开 | 宗门广场横向铺开、建筑群水平展开 | 前中后大纵深叠压（前景白雾虚化/中景主体/远景楼宇虚化） |\n| 双人对话 | 左右三分位并排+横向留白 | 上下高低机位对角线，或竖屏紧凑过肩（面部占画面高 ≥1/3） |\n| 人群场面 | 环形人群横向展开两翼 | 人群上下叠压虚化为背景层，主体贯穿对角线 |\n| 单人立像 | 中心构图+左右对称建筑 | 人物从头到脚沿对角线贯穿，头顶留 1/6 天空 |\n| 运动方向 | 左右横移跟随 | 纵深跟拍（迎面/背跟），位移≤1 身位 |\n| 字幕安全区 | 居下即可 | 底部 15% 预留，构图下沿避开关键信息 |\n| 特写 | 常规 1:1 取景 | 面部占高 ≥1/3，发际到下巴居中上 2/3 |\n\n### 4.4 Cutaway 剪辑救场特写插入规则\n\n| 规则项 | 标准 |\n|---|---|\n| 频率 | 每 2~3 个主镜头 1 个；对话场 ≥2 个/场 |\n| 时长 | 1~2 秒（1.5s 黄金值） |\n| 类型库 | 手部特写（握拳/攥衣角）、道具特写（剑柄/怀表/食物热气）、倾听者眼神微特写、环境反应（白雾/灯串/落叶）、脚步特写 |\n| 等级与生成路线 | 默认 B 级：超高清静态图 + 剪映关键帧缓推 + 粒子特效图层（零视频算力零崩坏面） |\n| 声画错位 | 每个缓冲镜标注 J-Cut/L-Cut 切入秒点（如\"镜3 尾音延入镜4 前 0.5s\"），交 R8 执行 |\n| 视线闭环 | 承接上一镜人物视线投向（他看什么→切什么），禁止无动机插入 |\n\n## 五、常见错误示范 vs 满分工业级示范\n\n### 对比组 1：分镜表行\n\n❌ **Bad Case（14 字段残缺+三违）**：\n> 镜头2：母子俩在街上边走边聊，孩子说要吃莽莽，妈妈安慰他，先来个全景再切妈妈特写再切孩子反应，大概五六秒，温馨一点。\n\n**扣分点**：无场次/轴线/等级/资产引用；\"边走边聊+安慰\"≥2 主动作（V3 否决）；\"全景→特写→反应\"三个机位塞一镜（V3 否决）；\"五六秒/温馨一点\"不可执行。\n\n✅ **Good Case（14 字段满配）**：\n> 镜头2｜场次B·母子买莽莽｜远景｜平视前侧45°跟拍（南侧半圆）｜三分法+街道纵深引导线｜镜头缓慢推近·微幅｜3秒｜A级｜@李梅@张三@光大街边｜张三台词（模式A，精算2.2s+铺垫0.8s）｜[00-0.8s]拽衣角仰头；[0.8-3.0s]张嘴说\"妈妈，我要吃莽莽\"；李梅闭嘴锁｜Cutaway否｜B场·南半圆·不越轴｜备注：张三瞟向画外右摊位，为镜3白雾特写埋视线\n\n### 对比组 2：9:16 竖屏转换\n\n❌ **Bad Case（横屏思维直灌竖屏）**：\n> 竖屏镜头1：@李梅和@张三并排在画面左右两侧走向镜头，街道美食摊从左到右一字排开，全景展示繁华的夜市全貌。\n\n**扣分点**：并排+左右站位在 9:16 中把两人压成两个细条；\"从左到右一字排开\"= 横向铺开，防崩补丁2 明令禁用；夜市全貌在竖屏里=主体过小。\n\n✅ **Good Case（纵深叠压转换）**：\n> 竖屏镜头1：前中后大纵深叠压——前景馄饨摊白雾与灯串虚化占下 1/4，中景母子牵手主体清晰（@李梅后半步居中偏左、@张三前半步居中偏右，上下半身入画），远景居民楼暖窗虚化占上 1/5；镜头纵深缓推·微幅；3 秒 A 级。构图下沿留 15% 字幕安全区。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **合法越轴三法**（必须三选一并写进轴线声明\"合法越轴手段\"列）：①中性镜过渡（正对/背对轴线的骑轴镜）；②动作剪辑点越轴（大幅动作顶点帧遮越轴，如挥剑转身瞬间）；③主体自身改变轴线（人物转身/走动改写轴线，需 1 个跟随镜交代）。\n2. **群像戏（≥4 人同框）**：禁止全人群像生成——拆为\"主体近景+人群虚化背景层+2~3 个反应 Cutaway\"三段式；人群只做剪影/虚化，绝给清晰人脸（多人串脸崩坏06 高危）。\n3. **一镜到底长镜头需求**：单镜 5s 上限不变，改走\"尾帧接力\"（VID-02）：在分镜表\"备注\"列标注接力链（镜A尾帧→镜B首帧），且接力段 ≤2 段，第 3 段起重锚全量首帧。\n4. **双线切换集（苍穹→烟火）**：切换点两镜必须同等级（S 接 S 或 A 接 A），且转场类型在备注列预声明（闪白/闪黑给 R8），防止情绪断层。\n5. **补拍救场（用户反馈某镜废片）**：优先把废镜降级为 Cutaway 蒙太奇素材；若必须重拍，等级最多升一级（A→S），禁止 B 级直接升 S（算力浪费）。\n6. **画幅中途变更（横转竖分发）**：不重拆镜——按 4.3 转换表逐行改写\"构图\"字段+复核\"运镜\"字段（横移改纵深），其余 12 字段不动（保持连续性资产不变）。"}]},{"g":"🖼️ 生图技法","items":[{"p":"skills/03_image_gen_skills/skill_img_pre_resource_planner.md","t":"分镜前置资源策划技能（IMG-02）· 工业级完整版","d":"WHAT：分镜前置图片资源策划技能——首帧基准图、尾帧设计图、2x2/3x3多宫格连贯分镜垫图的策划流程与编译模板。WHEN：每个分镜进入视频提示词生产前由本技能策划前置资源；用户问'这个镜头要先出什么图/怎么做垫图'时触发。","raw":"# 分镜前置资源策划技能（IMG-02）· 工业级完整版\n\n## 一、核心职责与工业级法则（6 条硬核铁律）\n\n1. **等级决定资源铁律**：S 级=首帧基准图+**尾帧设计图**双锚；A 级=首帧基准图单锚；B 级=超高清静态图 1 张（不生成视频，后期关键帧缓推动态）。等级与资源错配（S 级只出首帧 / B 级出双图）一律退回重规划。\n2. **首帧即首秒铁律**：首帧基准图的景别/机位/构图必须与分镜表逐字对齐（视频第一秒就是这个画面），人物挂单人参考图（立绘/面部特写），三视图整图禁止入位（VIS-03 防呆）。\n3. **同源双图铁律**：首尾帧两张图必须同光源、同色温、同画风——尾帧只改变\"动作顶点状态+运镜推进量\"，其余逐字复用首帧 Prompt；可灵的运镜幅度匹配前提就是两图差异可控。\n4. **动态范围防护铁律**：I2V 首帧禁止强逆光/大面积高光/纯剪影（崩坏10 视频过爆放大器）；光学层必写\"高光不过曝、保留面部细节\"。\n5. **成对出图铁律**：过肩正反打的两张首帧必须同批次成对生成（同 Prompt 仅换越肩方向），防对白正反打色温跳变；单张抽卡合格后再补拍另一张=废片率高发区。\n6. **垫图省抽卡铁律**：同场次 ≥3 个连续镜头且构图变化小 → 必须评估多宫格垫图方案（一次生成锁构图延续性，逐格裁切为首帧），而非逐镜独立抽卡。\n\n## 二、标准执行 SOP（Step-by-Step）\n\n**Step 1 · 读入定资源**：读分镜表行（等级/景别/机位/构图/时长/@资产/台词）；按铁律 1 定资源清单（S 双图 / A 单图 / B 静态）。\n\n**Step 2 · 路由技法**：过 IMG-01 决策树得技法组合（底图选择+锁脸手段+ControlNet 需求），写\"生图技巧策划说明\"。\n\n**Step 3 · 编译首帧**：按 `KB_08` 生图全量公式八层编译（主体/服饰/动作/空间/环境/光学/镜头/画风+规格），景别机位构图逐字对齐分镜表；多人镜头挂 KB_07 空间分区句式。\n\n**Step 4 · 编译尾帧**（仅 S 级）：复制首帧 Prompt，只改——动作顶点描述（剑指前方定格/相拥瞬间）、运镜推进后的景别变化、可强化的氛围（光柱落台/雨落），光源色温逐字不动。\n\n**Step 5 · 垫图评估**（多镜连拍时）：按 4.3 流程策划 2x2/3x3 宫格垫图——列\"格位分配表\"（每格对应镜号与构图），编译宫格 Prompt。\n\n**Step 6 · 一致性保障与送检**：写同源保障措施（成对出图/尾帧复用句/宫格裁切规范）；全部 Prompt 送 R7 评分（G 表），≥9.0 交用户跑图，并留\"交 R6 备注\"（首帧即视频第一秒/尾帧用于可灵锚定）。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约\n\n| 字段 | 类型 | 必填 | 示例 |\n|---|---|---|---|\n| 分镜表行 | 14字段 | 是 | 镜头2（远景缓推 3s A级 母子…） |\n| 视频技法预选 | enum | 是 | 首帧I2V（即梦模式A） |\n| @资产图集 | list | 是 | 含单人立绘/面部特写/空镜 |\n| 画幅 | enum | 是 | 16:9 |\n\n### 输出契约（下游：R5 执行跑图 / R6 视频生产 / R7 评分）\n\n```yaml\n资源清单: [{类型: \"首帧基准图\", 数量: 1, 用途: \"即梦I2V首帧+素材位\"}, {类型: \"尾帧设计图\", 数量: 0, 用途: \"—(A级不需)\"}]\n生图技巧策划说明: \"图生图(@光大街边空镜底图,重绘0.4) + IP-Adapter双参考(0.6/0.6) + OpenPose 0.7双骨架(母直站/子仰头拽衣角)；色温锁黄昏金橙与底图一致\"\n前置生图Prompt: [\"```prompt 黄昏@光大街边母子行进首帧基准图：画面左侧三分之一为…```\"]\n同源一致性保障: \"本镜与镜4过肩成对同批出图；若独立出图,镜4复用本镜光学层与环境层逐字\"\nR7送检状态: \"9.3分放行\"\n交R6备注: \"首帧即视频第0秒画面；素材位1=@李梅立绘 位2=@张三立绘 位3=本空镜\"\n```\n\n## 四、专项工具箱\n\n### 4.1 首帧基准图编译模板（八层全量）\n\n```prompt\n[场景与时段]@[场景名][镜头动作语境]首帧基准图：[空间分区句式(多人必填)——左侧三分之一为@人物A(身高+服装主色)，右侧三分之二为@人物B(身高差+服装主色)，间距与互动关系]；[主体姿态与手部状态(五指并拢等)]；[环境三层：前景虚化元素/中景主体动作/远景虚化延伸]；[光学层：色温+光型+「高光不过曝保留面部细节」]；[镜头层：景别+机位+构图(逐字对齐分镜表)]；@画风锁+[线别追加缀]，[画幅]，4K\n```\n\n### 4.2 尾帧设计图编译模板（S 级 · 同源改三点）\n\n```prompt\n（复制对应首帧Prompt，仅修改以下三层，其余逐字保留：）\n① 动作层 → 动作顶点定格描述（如\"右手持@焚天断剑斜指前方、衣袂上扬定格\"）\n② 镜头层 → 运镜推进后的景别/角度微变（如\"低角度仰拍推近后半段\"）\n③ 氛围层 → 可强化的戏剧元素（如\"雷云更暗、三道光柱落台、人群剪影后倾\"）\n光源、色温、人物骨相与服装层：逐字不动（可灵幅度匹配前提）\n```\n\n### 4.3 多宫格连贯分镜垫图策划流程与模板\n\n**适用判定**：同场次 ≥3 连续镜 + 构图变化小（同机位族/同景别族）+ 时长均 ≤5s → 用宫格垫图；跨场次/景别跳级大（远→特写）不适用。\n\n**策划流程**：\n1. **格位分配表**：把镜号映射进宫格（2x2 四格 / 3x3 九格），标注每格的\"构图差异增量\"（人物位置/朝向/前景元素微调）。\n2. **统一基准**：所有格共享——场景三层、光源色温、画风锁；仅变——格内主体姿态/朝向/局部前景。\n3. **编译宫格 Prompt**（模板如下）。\n4. **逐格裁切**：宫格图生成后按格裁切为独立首帧（4K 宫格裁后单格 ≥1080p 达标）；裁切图回填 IMG-01（补高清重绘 0.3）。\n5. **一致性红利**：同源宫格裁切的连续首帧，视频生成后镜头间空间延续性显著高于独立抽卡。\n\n**宫格模板（2x2）**：\n```prompt\n2x2四宫格连贯分镜垫图（Storyboard Grid）：同一@场景名[时段色温]，四格为同一机位族的连续瞬间——左上格[镜N构图与主体状态]，右上格[镜N+1增量变化]，左下格[镜N+2增量变化]，右下格[镜N+3增量变化]；四格统一[光源色温+环境三层]，格间白色细线分隔；@人物引用单人参考规范，[光学层+高光不过曝]；@画风锁+[线别追加缀]，正方形1:1（裁切后各16:9安全区），4K\n```\n\n**格位分配表格式**：\n| 格位 | 镜号 | 构图增量（相对左上格） |\n|---|---|---|\n| 左上 | 镜5 | 基准：母左子右中景行走 |\n| 右上 | 镜6 | +推近半档，子转头仰视 |\n| 左下 | 镜7 | +前景灯串入画一角 |\n| 右下 | 镜8 | +母低头含笑，子停下 |\n\n## 五、常见错误示范 vs 满分工业级示范\n\n### 对比组 1：首帧策划\n\n❌ **Bad Case**：\n> 镜头4 前置资源：生成一张李梅在街上的图片，最好是黄昏，好看一点，人物清晰。平台随便，出来直接用。\n\n**扣分点**：无空间分区（过肩构图谁前谁后？）；无\"高光不过曝\"防护（黄昏逆光高危）；无参考图挂载（人物必漂移）；无同源保障（与镜2色温跳变）；\"好看一点/随便\"不可验收。\n\n✅ **Good Case**：\n> **策划说明**：图生图（@光大街边空镜底图，重绘 0.4）+ IP-Adapter（@李梅立绘 0.7 锁脸）+ OpenPose 0.6（垂眸+右手抬至胸前骨架）；与镜 2 成对同批出图防色温跳变。\n> **Prompt**：`过肩镜头首帧基准图：越过孩童@张三的右肩与后脑（画面右下角虚化剪影，天蓝卫衣帽可见）拍摄成年女性@李梅：@李梅位于画面左侧三分之二，[骨相+套装]…右手刚抬至胸前…黄昏金橙色温柔和平射光，高光不过曝保留面部细节…@画风锁+暖金橙主调黄昏柔焦光晕，16:9，4K`——9.3 分放行。\n\n### 对比组 2：多宫格垫图\n\n❌ **Bad Case**：\n> 镜5~8 每个镜头单独生成一张首帧图，各自写一遍完整提示词，多抽几次卡总能对上。\n\n**扣分点**：四张独立抽卡=四套独立空间解读，镜头间墙面/摊位/灯串位置各画各的，剪辑时空间跳跃；抽卡成本 4 倍；违反铁律 6。\n\n✅ **Good Case**：\n> 判定镜 5~8 同场次同机位族（中景行走+微推）→ 2x2 宫格垫图：左上基准（母左子右行走）→ 右上（+推近半档子转头）→ 左下（+前景灯串一角）→ 右下（+母低头子停步）；统一黄昏金橙与三层环境；生成后逐格裁切+补高清 0.3 → 四张同源首帧，空间延续性一次锁定。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **首帧含 ≥3 人**：禁止单图直出（串脸高危）——拆\"主双人首帧（分区句式）+ 第三人后期贴入（剪映画中画）\"或改分镜为反应 Cutaway 递补第三人存在感。\n2. **首尾帧差异过大（S 级大幅动作）**：两图差异超出\"改三点\"范围（如全景→特写）→ 放弃首尾帧锚定，改\"首帧 I2V + 尾帧弃用 + 剪辑切镜\"方案，并通知 VID-02 改技法预选。\n3. **竖屏（9:16）首帧**：宫格垫图改用\"1x4 竖排条\"（各格 9:16）或 2x2 正方形内留竖向安全区；首帧单独出图时画幅字段写 9:16 且构图过 VIS-01 的 4.3 转换表。\n4. **B 级静态图的高清要求**：静态图承担\"放大 108% 缓推\"余量，分辨率必须 4K（裁切后局部仍 ≥1080p）；不足时 IMG-01 补高清（重绘 0.3）。\n5. **场景无空镜基准图**（新场景漏产）：先回 VIS-03 补两件套再策划前置资源——禁止\"拿别人镜的首帧当底图\"（误差累积漂移）。\n6. **接力镜（Tail-to-Head）的首帧**：不新出图——直接取上一镜生成视频尾帧 + 高清修复/Inpainting 微调（改衣摆角度/光斑位置），本技能只出\"尾帧修复指令单\"交 IMG-01 执行。"},{"p":"skills/03_image_gen_skills/skill_img_tech_router.md","t":"生图技法路由器（IMG-01）· 工业级完整版","d":"WHAT：生图技法路由器——图生图、ControlNet(OpenPose/Depth/Canny/Lineart)、灰度图光影、LoRA权重、Inpainting局部重绘、多宫格垫图的决策树与参数区间表。WHEN：任何生图任务（资产图/首帧图/修图）在写Prompt前先经本路由器选技法；用户问'怎么改图/怎么保持一致/怎么控姿态'时触发。","raw":"# 生图技法路由器（IMG-01）· 工业级完整版\n\n## 一、核心职责与工业级法则（6 条硬核铁律）\n\n1. **先路由后写词铁律**：任何生图任务在写 Prompt 前必须先过本路由决策树确定技法组合——技法决定参考图挂载与参数，参数决定 Prompt 里哪些层要写哪些层省略（图生图低重绘时静态层可简写）。\n2. **重绘幅度安全铁律**：图生图重绘幅度（denoising strength）锁定 0.3~0.45 区间——低于 0.3 改不动，高于 0.45 换脸漂移；要大改就换技法（ControlNet），不要硬拉重绘。\n3. **保人优先铁律**：涉及已注册人物的任务，锁脸手段（LoRA 0.6~0.85 / PuLID 0.6~0.8 / IP-Adapter 0.5~0.7）优先级高于一切风格参数；LoRA 严禁 >0.9（画风僵硬+\"塑胶脸\"）。\n4. **单一控制源铁律**：ControlNet 同类控制只用一个源（姿态就用 OpenPose，别再叠 Canny 钉轮廓除非显式说明权重减半）；多控制叠加时权重各 ×0.7 且总和等效 ≤1.2，互相打架=两头不执行。\n5. **最小干预铁律**：只改局部必须用 Inpainting（蒙版圈选，羽化 20~30px，重绘限蒙版内）；用整图重绘修一只手=全图重新抽卡，已过审部分全部作废。\n6. **两轮升级铁律**：同一技法改词两轮仍翻车 → 立即升级技法级（见决策树第 5 层失败预案），禁止第三轮同法重试——时间成本高于换法成本。\n\n## 二、标准执行 SOP（Step-by-Step）\n\n**Step 1 · 查表读入**：读 `KB_06` 六节锁脸规范（参考图链与权重）、`KB_09` 四节修正工作流（翻车对号入座）；读入任务输入四要素（目标/保留/改变/参考图清单）。\n\n**Step 2 · 过决策树**：按 4.1 决策树五问逐层路由，得出技法组合结论（可多技法叠加，按铁律 4 控制权重）。\n\n**Step 3 · 填参数区间表**：按 4.2 参数区间表逐项给出数值与理由（如\"IP-Adapter 0.7——过肩近景保脸优先级最高\"）。\n\n**Step 4 · 列参考图挂载清单**：明确每张参考图（@资产图集内的面部特写/全身立绘/空镜底图）挂到哪个节点、什么权重——**只允许单人参考图入位，三视图/矩阵整图禁止**（VIS-03 防呆铁律）。\n\n**Step 5 · 配负向词包**：从 `KB_09` 三节标准负向包按任务裁剪（生图/视频分用），随 Prompt 交付。\n\n**Step 6 · 交平台与预案**：给出平台落地建议（豆包 Seedream 4.0 / ComfyUI Flux 分工）与失败预案（两轮翻车后的升级路线）。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约\n\n| 字段 | 类型 | 必填 | 示例 |\n|---|---|---|---|\n| 出图目标 | enum | 是 | 分镜首帧基准图 |\n| 保留项 | list | 是 | 人物脸×2、场景空间 |\n| 改变项 | list | 是 | 光影（平光→黄昏）、站位（双骨架） |\n| 参考图清单 | list | 是 | @李梅立绘/@张三立绘/@光大街边空镜 |\n| 目标平台 | enum | 否 | 豆包 Seedream 4.0 |\n\n### 输出契约（下游：IMG-02 / R5 执行 / plat_* 落地）\n\n```yaml\n路由结论: \"图生图(空镜底图,重绘0.4) + IP-Adapter双参考(李梅0.6/张三0.6) + ControlNet-OpenPose 0.7(双骨架)\"\n参数区间表:\n  - {项: \"图生图重绘\", 值: 0.40, 区间: \"0.3~0.45\", 理由: \"保留空镜空间结构,只注入人物与光\"}\n  - {项: \"IP-Adapter\", 值: \"0.6/0.6\", 区间: \"0.5~0.7\", 理由: \"双人对称保脸,单边过高致另一人串脸\"}\n  - {项: \"OpenPose\", 值: 0.7, 区间: \"0.6~0.8\", 理由: \"钉'母站子仰头'骨架,防姿态漂移\"}\n参考图挂载清单: [{图: \"@李梅全身立绘\", 节点: \"IP-Adapter-A\", 权重: 0.6}, {图: \"@光大街边空镜\", 节点: \"图生图底图\", —}]\n负向词包: \"多人融合, 手指粘连, 成人比例孩童, 高光过曝, 文字, 水印\"\n平台落地: \"豆包Seedream 4.0(空间排布强)或ComfyUI Flux(需严格双锁脸时)\"\n失败预案: \"两轮翻车→骨架改手摆+Depth 0.6钉纵深；仍败→拆两镜单人对拍+剪辑合成\"\n```\n\n## 四、专项工具箱\n\n### 4.1 技法路由决策树（五问五层）\n\n```text\nQ1 要不要动\"形\"？（姿态/构图/空间结构）\n ├─ 动形 → Q1a 什么形？\n │   ├─ 姿态/动作 → ControlNet-OpenPose（0.6~0.8）【骨架图先行】\n │   ├─ 空间纵深/机位 → ControlNet-Depth（0.5~0.7）【深度图先行】\n │   └─ 轮廓/边缘（改材质不改形）→ ControlNet-Canny/Lineart（0.5~0.7）\n └─ 不动形，只改\"色/光/质\" → Q2\nQ2 要不要保\"人\"？（已注册人物入画）\n ├─ 保人 → 锁脸三选一：角色LoRA（0.6~0.85）＞PuLID（0.6~0.8，Flux/SD系）＞IP-Adapter（0.5~0.7，挂单人立绘/面部特写）\n └─ 不保人（纯场景/道具）→ 直接进 Q3\nQ3 只改一小块？（换手/去光影/换天/改局部道具）\n ├─ 是 → Inpainting（蒙版圈选，羽化20~30px，重绘仅限蒙版内0.4~0.5）\n └─ 否 → Q4\nQ4 要不要先控\"明暗布局\"再上色？\n ├─ 是 → 灰度图二段式（灰度草图定明暗→上色段重绘0.35~0.45）\n └─ 否 → 图生图（0.3~0.45）或文生图直出\nQ5 翻车了吗？（同法改词两轮仍废）\n └─ 是 → 升级路线：改词 → 换控制源(OpenPose↔Depth) → 加锁脸权重+0.05 → 拆单主体分图 → 降级B级静态图+剪映动效\n```\n\n### 4.2 参数区间总表（核实版基线）\n\n| 技法/参数 | 安全区间 | 越界后果 | 适用场景 |\n|---|---|---|---|\n| 图生图重绘幅度 | 0.3~0.45 | <0.3 改不动 / >0.45 换脸漂移 | 微调光影/场景，人物已在底图 |\n| ControlNet-OpenPose | 0.6~0.8 | <0.6 姿态不执行 / >0.8 肢体僵直 | 控姿态/双人站位骨架 |\n| ControlNet-Depth | 0.5~0.7 | >0.7 画面糊成深度图 | 钉空间纵深/多主体前后层次 |\n| ControlNet-Canny/Lineart | 0.5~0.7 | >0.7 边缘生硬描边感 | 改材质不改形（换装/换色） |\n| 灰度图二段式 | 灰度→上色重绘 0.35~0.45 | 上色段过高破坏明暗布局 | 强设计感光影构图 |\n| 角色 LoRA 权重 | 0.6~0.85 | >0.9 画风僵硬塑胶脸 | 角色专属长相复现 |\n| PuLID（Flux/SD） | 0.6~0.8 | >0.8 表情锁死 | 人脸 ID 严格锁定 |\n| IP-Adapter | 0.5~0.7 | >0.7 风格污染串脸 | 单人立绘/面部特写参考注入 |\n| Inpainting 羽化 | 20~30px | <20 蒙版硬边 / >30 改出圈 | 局部修补（手/疤/光影残留） |\n| 多控制叠加 | 各×0.7，总和等效≤1.2 | 打架=两头不执行 | Pose+Depth 复合 |\n\n### 4.3 技法×场景速查矩阵\n\n| 任务 | 首选组合 | 参数速记 |\n|---|---|---|\n| 资产三视图 | 文生图 / Flux+Lineart 0.6 | KB_06 词组+英文串 |\n| 人物换装不换脸 | Canny 0.6 + LoRA 0.7 | 蒙版可省（全身换） |\n| 首帧基准图（有人有景） | I2I 空镜底图 0.4 + IP-Adapter 0.6~0.7 | 单人参考入位 |\n| 双人首帧 | I2I 0.4 + 双 IP-Adapter 0.6/0.6 + OpenPose 0.7 | 骨架手摆先行 |\n| 只修手部/去高光 | Inpainting 羽化 25px 重绘 0.45 | 蒙版内限定 |\n| 同场连拍多首帧 | 多宫格垫图（IMG-02） | 2x2 逐格裁切 |\n| 强光影构图海报 | 灰度二段式 | 上色 0.4 |\n\n## 五、常见错误示范 vs 满分工业级示范\n\n### 对比组 1：改光影任务路由\n\n❌ **Bad Case**：\n> 任务：把已过审的 @光大街边 母子首帧从白天改成黄昏。做法：重新文生图一张黄昏母子街景，提示词完整重写一遍。\n\n**扣分点**：文生图重出=人物/构图全部重新抽卡，已过审资产作废（违反最小干预）；无锁脸手段，母子必漂移（崩坏09）。\n\n✅ **Good Case**：\n> 路由：Q1 不动形 → Q2 保人 → Q3 非局部 → Q4 否 → **图生图（原首帧为底，重绘 0.35）+ IP-Adapter 双参考（@李梅立绘 0.6 / @张三立绘 0.6）**；Prompt 仅改光学层（\"黄昏金橙平射光，高光不过曝\"）+空间层逐字复用。产出与原图人物一致、仅色温切换。\n\n### 对比组 2：控姿态任务路由\n\n❌ **Bad Case**：\n> 任务：让 @林烬 从\"负剑静立\"改成\"抬剑指前方\"。做法：图生图重绘拉到 0.7 强度硬改。\n\n**扣分点**：0.7 重绘越安全区间（铁律2）——脸和衣服全部重新生成，等于换人；大幅姿态变化必须走骨架控制。\n\n✅ **Good Case**：\n> 路由：Q1 动形（姿态）→ **ControlNet-OpenPose 0.75（手摆\"抬剑指前\"骨架图）+ PuLID 0.7（@林烬面部特写）+ Canny 0.5×0.7（保服装轮廓）**；原图为底图重绘 0.4。产出姿态精准、脸服同源。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **双人 ControlNet 骨架重叠打架**：OpenPose 双人骨架先分层（骨架A/B 分离渲染再合并）；仍打架则 Depth 0.6 整体钉纵深 + 单人 OpenPose 只控主体、配角靠 Prompt 分区句式约束。\n2. **参考图互相污染（人物参考与画风参考打架）**：砍掉画风参考（画风交给 @画风锁 文字层）；IP-Adapter 只留人物——参考图越多，每张权重越被稀释串色。\n3. **无底图无参考的全新资产**：决策树从 Q1 走完直接文生图，但必须挂 KB_06/KB_08 编译模板与负向包；产出后立刻走\"裁切→单人参考图\"流程反哺图集。\n4. **平台不支持 ControlNet（豆包等在线端）**：降级方案——\"参考图多图融合 + Prompt 空间分区句式 + 抽卡 3~5 次人工选优\"；需要骨架精控的镜头转 ComfyUI 执行。\n5. **LoRA 与 IP-Adapter 同时可用时**：有角色 LoRA 用 LoRA（0.7），IP-Adapter 留给服装/道具参考——同源功能不双挂，权重打架。\n6. **修图连环套（改了 A 处又想改 B 处）**：禁止多次 Inpainting 叠加（画质衰减累积）；回到上一层重路由一次成型，或接受 A 处结果只修 B。"}]},{"g":"🎥 生视频技法","items":[{"p":"skills/04_video_gen_skills/skill_vid_method_selector.md","t":"视频技法选择器（VID-02）· 工业级完整版","d":"WHAT：视频生成技法选择器——首帧I2V、首尾帧过渡、多图@资产融合、尾帧截取接力长镜头(Tail-to-Head)四大技法的适用场景判定与操作指南。WHEN：分镜进入视频生产前选技法、用户要求'长镜头/无缝接力/多图融合/首尾帧控制'时触发。","raw":"# 视频技法选择器（VID-02）· 工业级完整版\n\n## 一、核心职责与工业级法则（6 条硬核铁律）\n\n1. **等级路由铁律**：S 级（大幅动作/奇观）→ 可灵首尾帧优先；A 级（常规）→ 首帧 I2V；B 级（对白反应/空镜）→ **不生成视频**（静态图+Lip-Sync+剪映关键帧）。等级与技法错配（S 级裸 I2V 硬抽 / B 级上视频模型）= 算力浪费或质量不足，双向退回。\n2. **幅度匹配铁律**（可灵核心）：运镜与动作幅度必须匹配首尾帧画面差异——差异大写大幅（快速/急速），差异小写\"缓慢\"；错配的直接后果是**运镜指令不执行**（可灵实测）。\n3. **接力 ≤2 铁律**：尾帧接力长镜头每条链最多接力 2 段（总 ≤15 秒）；第 3 段起必须重锚全量首帧——误差累积漂移是接力段的固有税，第 3 段的脸已经\"不是同一个人\"（崩坏09）。\n4. **素材位克制铁律**：多图参考融合以\"人物 1~2 位+场景 1 位+道具 1 位\"为宜（≤4）；把 50 个素材位塞满=权重互相稀释串色，参考越多每张越没用。\n5. **模式对齐铁律**：对白镜头选型时先定口型模式——模式A选即梦/MiniMax H3（原生音频）；模式B选 ComfyUI Wan（无声输出+闭嘴基底）。平台能力与口型模式错配=返工重拍。\n6. **备选即预案铁律**：每次选型必须同时给出备选技法与触发降级条件（\"若可灵首尾帧两轮废片 → 降级为即梦多图参考+首帧I2V\"）——没有预案的选型在废片面前是裸奔。\n\n## 二、标准执行 SOP（Step-by-Step）\n\n**Step 1 · 读入**：读分镜表行（等级/时长/动作幅度/资产数/台词+模式）+ 前置资源就位状态 + 相邻镜信息 + 平台清单。\n\n**Step 2 · 过决策树**：按 4.1 决策树判定主技法与备选技法。\n\n**Step 3 · 定平台**：按技法×平台适配（4.2 表）选平台与模型，写推荐理由（引用 `memory/global/权威工作流与影视知识库.md` 三节选型路由）。\n\n**Step 4 · 声明接力链**（长镜头时）：`镜A（5s·首尾帧）→ 尾帧F1 → 修复/微调 → 镜B（5s·接力I2V）`，标注每段锚点策略（镜B锚点压至 1 词）。\n\n**Step 5 · 出操作指南**：按 4.3 四大技法操作指南摘取本镜执行要点（步骤清单），联动备注给 VID-01（锚点压缩指令/一致性行/负向包）。\n\n**Step 6 · 送检闭环**：技法结论随差分 Prompt 一并交 R7；废片两轮 → 启动备选技法并记录到复盘占位。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约\n\n| 字段 | 类型 | 必填 | 说明 |\n|---|---|---|---|\n| 分镜表行 | 14字段 | 是 | 重点：等级/幅度/资产数/台词模式 |\n| 前置资源 | list | 是 | 首帧✓/尾帧✓/垫图 |\n| 相邻镜信息 | text | 接力时 | \"上一镜镜A可截尾帧\" |\n| 平台清单 | list | 否 | 默认全平台可选 |\n\n### 输出契约（下游：VID-01 编译 / plat_* 落地 / R7）\n\n```yaml\n技法结论: {主: \"首尾帧控制(可灵)\", 备: \"多图参考融合(即梦2.5)\", 降级条件: \"可灵两轮废片→切备选\"}\n平台推荐: {平台: \"可灵\", 模型: \"标准版\", 理由: \"首尾帧锚定强项+3D时空注意力物理规律,适合S级取剑大幅动作\"}\n接力链: \"无\"\n操作指南要点: [\"上传首帧图1(负剑静立)+尾帧图2(剑指定格)\", \"Prompt按官方四段式:主体→运动(只写中间过渡)→场景→镜头语言\", \"运镜幅度写'推近'匹配两图中等差异\", \"物理语言:气流惯性/落地下沉\"]\n差分Prompt联动备注: \"锚点压至2词；Prompt禁复述首帧静态外貌；末尾挂画风锁\"\nR7送检状态: \"9.3分放行\"\n```\n\n## 四、专项工具箱\n\n### 4.1 技法选择决策树\n\n```text\nQ1 镜头等级？\n ├─ B级 → 【静态图方案】不生成视频：超高清静态图 + 后期Lip-Sync(模式B) + 剪映关键帧缓推 + 粒子特效图层\n ├─ A级 → Q2 前置资源？\n │   └─ 首帧就位 → 【首帧I2V】全平台通用；对白模式A→即梦/MiniMax H3；模式B→ComfyUI Wan\n └─ S级 → Q3 需求特征？\n     ├─ 大幅动作/物理奇观(打斗/坠落/爆发) → 【首尾帧控制】可灵（幅度匹配铁律）\n     ├─ 多资产复合(人+景+道具同镜强一致) → 【多图参考融合】即梦（素材位1~4）\n     └─ 需要>5s连续长镜 → 【尾帧截取接力】链长≤2段；首段按S/A正常产，次段锚点压至1词\nQ4 废片两轮？→ 启动备选技法 + 填复盘占位（EVO-01 归因）\n```\n\n### 4.2 四大技法适用场景与平台适配总表\n\n| 技法 | 原理 | 最佳平台 | 适用镜头 | 核心风险 | 备选切换 |\n|---|---|---|---|---|---|\n| 首帧 I2V | 首帧锚定 90% 外观 | 全平台（即梦/MiniMax H3 对白优先） | A 级常规、对白镜 | 首帧逆光过曝（崩坏10） | 多图融合 |\n| 首尾帧控制 | 双图锚定起止，Prompt 只写过渡 | **可灵**（强项） | S 级奇观/大幅动作 | 幅度错配→运镜不执行 | 即梦长条 |\n| 多图 @资产 融合 | 人物图+场景图+道具图同挂素材位 | **即梦 Seedance**（素材位多至50，实用≤4） | 多资产复合、跨场景合成 | 参考过多串色 | 首帧I2V+图生图合成 |\n| 尾帧接力 Tail-to-Head | 上镜尾帧→修复→下镜首帧 | 全平台 | >5s 长镜头、无缝衔接 | 累积漂移（链>2段） | 剪辑切镜+转场 |\n\n### 4.3 四大技法操作指南（逐技法步骤）\n\n**① 首帧 I2V 操作指南**：\n1. 首帧基准图就位（IMG-02 产出，含过曝防护）；2. VID-01 编译差分 Prompt（20/80）；3. 挂人物参考（即梦素材位/ComfyUI IP-Adapter）；4. 运镜 1 种+幅度；5. 模式A写台词+锁 / 模式B写闭嘴基底；6. 生成 2~3 次取优，废片填复盘占位。\n\n**② 首尾帧控制（可灵）操作指南**：\n1. 首帧+尾帧双图就位（同源改三点，IMG-02 铁律 3）；2. Prompt 按官方四段式：`主体（≤2词）→ 运动（只写中间过渡，禁复述起止静态）→ 场景 → 镜头语言+光影+氛围`；3. 运镜幅度=两图差异档（大差大幅/小差\"缓慢\"）；4. 大幅动作写物理语言（重力/惯性/气流）；5. 锚点间隔 ≥3 秒（多镜分段时切换生硬红线）。\n\n**③ 多图 @资产 融合（即梦）操作指南**：\n1. 素材位规划清单前置（位1 人物立绘/位2 第二人物/位3 场景空镜/位4 道具特写，≤4 位）；2. Prompt 中 @资产名与素材位一一对应；3. 结尾挂一致性行\"人物与场景外观全程与参考素材保持一致\"；4. 分区句式+口型锁照常（参考图不豁免防崩规则）；5. 单参考图权重失衡（一人像一人不像）→ 该人参考图换面部特写重试。\n\n**④ 尾帧接力 Tail-to-Head 操作指南**：\n1. 首段正常生产（按等级走①或②）；2. 导出首段视频，**截取最后一帧**为 F1；3. F1 修复：高清修复 + Inpainting 微调（只改接力所需：衣摆角度/光斑位置，羽化 25px）；4. 次段以 F1' 为首帧，VID-01 锚点压至 1 词，Prompt 只写增量（新增动作/光移/表情递进）；5. 链长 ≤2 段；第 3 段起重锚全量首帧；6. 接力段剪辑禁转场（无缝是目的），段间音效连续。\n\n### 4.3-b 接力链声明模板\n\n```yaml\n接力链:\n  首段: {镜号: A, 时长: 5s, 技法: \"首尾帧(可灵)\", 尾帧: \"导出截取F1\"}\n  修复: {操作: \"高清修复+Inpainting微调衣摆角度\", 工具: \"IMG-01路由\"}\n  次段: {镜号: B, 时长: 3s, 技法: \"接力I2V\", 首帧: \"F1'\", 锚点: \"压缩至1词@林烬\", 增量: \"+右手抬剑指前+光柱落台\"}\n  终止条件: \"链止于2段；第3段需求→重锚全量首帧\"\n```\n\n## 五、常见错误示范 vs 满分工业级示范\n\n### 对比组 1：S 级技法选型\n\n❌ **Bad Case**：\n> 镜头1 是 S 级压场爆发镜（取剑划弧+罡风+人群后倾）。做法：只用首帧图生视频，提示词写\"激烈地挥剑战斗，快速运镜，画面震撼\"，多抽几次卡碰运气。\n\n**扣分点**：S 级大幅动作裸 I2V（等级路由错配）——首帧锚定后中段动作漂移概率极高；\"激烈/震撼\"是空洞幅度词（可灵幅度匹配失效）；无尾帧锚定=收势定格全凭运气；无备选预案。\n\n✅ **Good Case**：\n> 主技法：可灵首尾帧——首帧图1（负剑静立）+尾帧图2（剑指定格衣袂上扬）；Prompt 四段式只写中间过渡（\"抬眼扫视→右手取剑自下而上划弧→气流掀动衣摆→人群后倾→光柱落台定格\"，物理语言齐）；运镜幅度\"推近\"匹配两图中等差异。备选：即梦多图参考（@林烬立绘+@玄天宗比武台空镜+@焚天断剑特写三位），降级条件\"可灵两轮废片\"。——9.3 分放行。\n\n### 对比组 2：长镜头接力\n\n❌ **Bad Case**：\n> 要做一个 20 秒连续打斗长镜头：写一条超长提示词塞给模型一次生成，不行就截成四段每段独立生成，剪辑时加转场连起来。\n\n**扣分点**：单次 20s 超时长（平台不支持+漂移爆炸）；四段独立生成=四张不同的脸四套空间（段间断层）；加转场=承认不连续（违背\"长镜头\"需求本体）。\n\n✅ **Good Case**：\n> 20s 拆\"5+5+5+5\"四段，走接力链：段1 首尾帧（可灵）产 0~5s → 截尾帧 F1 修复 → 段2 接力 I2V（锚点 1 词，增量=+进身压制）→ 段3 接力（锚点 1 词，增量=+格挡反冲）→ **段4 重锚全量首帧**（链≤2 铁律：段3 结束已到累积漂移红线，段4 用 IMG-02 新出首帧接续，剪辑在段3→4 之间安排 0.5s 武器碰撞特写 Cutaway 天然遮接缝）。全程段间禁转场，音效连续。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **8~15 秒中长镜**：≤10s 优先即梦单条长条（秒级节点加密版，VID-01 边界 4）；>10s 走接力链（首段即梦长条 10s + 接力段 5s）。\n2. **高动态打斗连续镜**：打斗每段主动作仍限 1 个（劈→格→反冲分段）；段间用武器/拳风特写 Cutaway 遮接缝——既符合接力终止条件又保节奏。\n3. **对白镜选型分歧（模式A可用但想用可灵）**：可灵对白能力弱 → 拆\"可灵产无台词动作段 + 模式B对面部段对口型\"两段接力，音轨统一后期合成。\n4. **平台不可用（无 API/无配额）**：按备选技法降级链执行：可灵→即梦→MiniMax H3→ComfyUI Wan（本地兜底，模式B）；选型输出注明\"降级原因=平台配额\"。\n5. **前置资源未就位**（尾帧图缺）：S 级镜头禁止带病开跑——回 IMG-02 补产；紧急情况降级为 A 级首帧 I2V 并通知导演改分镜表等级。\n6. **竖屏长条**：接力链规则不变；宫格垫图联动时用 1x4 竖排条（IMG-02 边界 3）；竖屏长条中段身份漂移更快，第 12 秒左右提前重锚。"},{"p":"skills/04_video_gen_skills/skill_vid_second_slicer.md","t":"视频秒级切片器（VID-01 · 视频提示词核心）· 工业级完整版","d":"WHAT：视频提示词核心编译技能——按秒切分[00-02s]模板、一镜一动一主体台词铁律、20%锚点+80%动态差分Prompt公式、多人同框空间分区与口型排他锁、原生配音Mode A与后期Lip-Sync Mode B双管线写法。WHEN：每个分镜的视频提示词生产、用户要求'按秒拆/秒级提示词/差分编译'时触发。","raw":"# 视频秒级切片器（VID-01 · 视频提示词核心）· 工业级完整版\n\n## 一、核心职责与工业级法则（7 条硬核铁律）\n\n1. **20/80 差分铁律**：视频 Prompt = **20% 极简锚点（@资产名+最多 2 个骨相词）+ 80% 纯物理运动变化量**（1 种运镜+幅度、1 主动作、1 次级微动作、材质动态、可选光影变化）。外貌描写超过 2 个骨相词即 V2 一票否决——首帧已锁定 90% 外观，堆砌外貌=浪费动态算力+诱发身份漂移（崩坏09）。\n2. **一镜一动一主体台词铁律**：单镜只允许 1 个主动作；同一时刻只允许 **1 个主体说台词**（配排他锁）；第二个主动作或第二主体开口=拆镜（崩坏03/04/05 前置）。\n3. **秒级节点铁律**：节点格式 `[00-02s]…；[02-05s]…`——节点数 ≤3、相邻节点间隔 ≥1 秒、全部对齐 0.5 秒网格（继承 NARR-03 精算）；\"持续地/渐渐地\"这类无锚时段词禁用（时间必须可指）。\n4. **口型双保险铁律**：多人画面+台词 → 必须写**口型排他锁**（\"说话者@X 张嘴说话嘴唇自然开合；一旁的@Y 保持双唇闭合、[神态]倾听，不发一言\"）；单人台词 → 仍须声明口型模式 A/B。无锁无声明=V5/V6 双否决。\n5. **Mode A/B 分流铁律**：\n   - **模式A（原生音画同出）**：写明台词文本+语气标注+张嘴动作——仅限即梦 Seedance / MiniMax H3 / 可灵类原生音频平台；\n   - **模式B（无声视频+后期 Lip-Sync）**：强制写\"**嘴唇保持自然闭合或极轻微闭合微动（预留后期 Lip-Sync 口型合成干净基底）**\"——ComfyUI Wan 等无声输出端标配；大嘴型基底+后期对口型=重影打架（崩坏16）。\n6. **分区句式铁律**：≥2 个人物资产同框 → KB_07 空间分区句式必挂（象限+身高差数值+服装主色差三重锚定），单靠 @名 引用防不住串色（崩坏06）。\n7. **末尾挂锁铁律**：Prompt 末尾逐字挂 @画风锁+线别追加缀+画幅+时长秒数；四缺一=V11/V12 扣分。\n\n## 二、标准执行 SOP（Step-by-Step）\n\n**Step 1 · 读入**：读分镜表行（镜号/景别/机位/构图/运镜/时长/等级/@资产/台词精算）+ 前置资源清单（首帧/尾帧是否就位）+ 目标平台（未指定→挂 plat_00 公用版）。\n\n**Step 2 · 搭骨架**：按差分公式五层拼装——锚点层（≤2 词）→ 动态层（运镜 1 种+幅度、主动作、微动作、材质动态、光影可选）→ 时长层（秒级节点 ≤3）→ 口型层（模式声明+排他锁）→ 画风层（锁+缀+画幅+秒数）。\n\n**Step 3 · 台词落位**（有台词镜）：把 NARR-03 的秒级节点直接引入（铺垫→开口→余韵三段）；台词文本以引号内嵌+语气标注+TTS 控制符；多人加排他锁句。\n\n**Step 4 · 崩坏扫描**：对照黑名单触发词逐个排查（360度转身/狂奔/瞬移/十指交叉/镜内切机位/强逆光首帧引用…）——命中即改写或退回 VIS-01 改镜。\n\n**Step 5 · 平台增强**（指定平台时）：按 plat_* 插件语法重排/补专属件（即梦素材位清单+一致性行 / MiniMax 方括号运镜+眨眼规范+声音栏 / 可灵首尾帧声明+四段式 / ComfyUI 中英双轨+节点参数+负向包）。\n\n**Step 6 · 送检交付**：R7 评分（V 表 12 项）≥9.0 → 代码块封装入档；同步给 R8 剪辑卡点备注（重音秒位/Cutaway 衔接点）。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约\n\n| 字段 | 类型 | 必填 | 说明 |\n|---|---|---|---|\n| 分镜表行 | 14字段 | 是 | VIS-01 产出 |\n| 台词精算 | NARR-03 | 有台词必填 | 含秒级节点+TTS控制符串 |\n| 前置资源 | IMG-02 | 是 | 首帧/尾帧/垫图就位状态 |\n| 目标平台 | enum | 否 | 未指定=公用+推荐 |\n\n### 输出契约（下游：plat_* 落地 / R7 / R8）\n\n```yaml\n镜号: 镜头2 ｜ 时长: 3秒 ｜ 等级: A ｜ 平台: 即梦Seedance(模式A)\n秒级节点串: \"[00-00.8s]拽衣角仰头铺垫 → [00.8-03.0s]张嘴说台词(2.2s)+李梅闭嘴锁\"\n差分Prompt·公用版: \"```prompt 米白开衫母亲@李梅与天蓝卫衣孩童@张三行于@光大街边：画面左侧三分之一为成年女性@李梅（身高约一米六五），右侧三分之二为孩童@张三（身高约一米一），两人牵手间距一臂；[00-00.8s]远景镜头缓慢推近，母子缓步前行，@张三仰头拽动母亲衣角，梧桐树影斑驳、馄饨摊白雾轻晃；[00.8-03.0s]@张三抬头张嘴说话，嘴唇随台词自然开合：\\\"妈妈，我要吃莽莽\\\"（奶声奶气，尾音拖长，渴望语气）；一旁的@李梅保持双唇闭合、嘴角含笑低头倾听，不发一言，@画风锁+暖金橙主调黄昏柔焦光晕，16:9，3秒```\"\n口型模式: \"A（即梦原生音画）｜排他锁双句齐备\"\n负向词包: \"多人融合, 手指粘连, 成人比例孩童, 文字, 水印\"\nR7送检状态: \"9.4分放行（V2锚点2+2词/V3单主动作/V5双锁/V8分区齐）\"\n交R8备注: \"重音'吃'@开口后1.4s(全镜2.2s处)可卡点；尾音'莽莽~'预留0.5s L-Cut延入镜3白雾\"\n```\n\n## 四、编译素材调用指针与拆解决策（表存于 KB，此处只存指针与逻辑）\n\n> 去重铁律：秒级模板、差分八层表、分区句式、口型句式均已收录为 KB 唯一权威源，本技能不抄写副本——编译时按下表指针现查现用，防版本漂移。\n\n| 素材 | 唯一权威源（现查现用） |\n|---|---|\n| 三档秒级模板（5s 标准 / 3s 对白 / 10s 长条） | `KB_08` 第二节「可复制母版（三档时长）」 |\n| 差分公式八层分解表（占比/词源/违规判定） | `KB_08` 第二节「八层分解表」 |\n| 口型排他锁句式（Mode A / Mode B / 静默锁） | `KB_08` 第三节「口型排他锁句式库」 |\n| 多人空间分区句式（并行/对峙/过肩/竖屏双人） | `KB_07` 第二节「多人空间分区句式库」 |\n| 秒级节点 6 条规范（含长条重锚 / 换指令边界） | `KB_08` 第四节 |\n| 首尾帧与尾帧接力编译规范 | `KB_08` 第五节 |\n\n### 拆解决策注意点（VID-01 独有逻辑，KB 不载）\n\n1. **模板档选择**：镜长 ≤3s 且有台词 → 3 秒对白式；常规 5s → 标准式；即梦 2.5 类长条（>8s）→ 长条式并在第 15 秒类中段重锚 @资产名。\n2. **模式 A/B 选型**：目标平台有原生音频（即梦 / MiniMax H3 / 可灵）→ 模式A；ComfyUI Wan 等无声端 → 模式B（必带闭嘴基底句）；平台未定 → 公用版默认 A 语法并标注\"模式以落地平台为准\"。\n3. **接力镜锚点压缩**：标注\"首帧=上一镜尾帧\"的镜头，锚点层压至 1 词，动态层只写增量（规范见 `KB_08` 五节）。\n4. **静默镜也锁嘴**：无台词的 S 级压场镜照挂\"双唇闭合无张嘴动作\"（崩坏05 不豁免静默镜）。\n5. **节点边界换指令**：MiniMax 类方括号运镜换档必须落在秒级节点边界，禁同段叠加（红线见 `KB_11` 八节）。\n\n## 五、常见错误示范 vs 满分工业级示范\n\n### 对比组 1：差分编译\n\n❌ **Bad Case（外貌堆砌+三违）**：\n> @李梅（鹅蛋脸柳叶眉温润杏眼、栗色齐肩微卷发别素色发夹、米白罗纹针织开衫配浅杏色A字连衣裙、斜挎帆布托特包、平底软鞋、温婉气质）牵着@张三（娃娃脸婴儿肥大圆眼长睫毛黑色短碎发呆毛、天蓝小熊耳连帽卫衣深灰长裤黄雨靴）走在街上边走边聊天，先拍全景再切妈妈特写再切孩子反应，两个人有说有笑，大概五秒钟。\n\n**扣分点**：外貌 60+ 字（V2 否决）；\"边走边聊+两人对话\"双主体台词无排他锁（V5 否决）；\"全景→特写→反应\"三机位（V3 否决）；\"有说有笑/大概\"不可执行——三重否决，评分 ≤8.0 强制打回。\n\n✅ **Good Case**：见\"输出契约\"镜头 2 完整示例——锚点 2+2 词、单主动作（张三说话）、双闭嘴锁、分区句式带身高差、秒级节点对齐精算、末尾四件齐挂——9.4 分放行。\n\n### 对比组 2：Mode B 写法\n\n❌ **Bad Case（模式B忘了闭嘴基底）**：\n> 模式B，ComfyUI Wan 生成：@李梅情绪激动地大声说着话，嘴巴大幅度开合，表情生动，台词后期再对口型。\n\n**扣分点**：模式 B 却写\"嘴巴大幅度开合\"——后期 LatentSync 对口型时与原视频大嘴型打架重影（崩坏16 一票否决，V6）；\"情绪激动\"无微表情链支撑。\n\n✅ **Good Case（模式B标准写法）**：\n> 模式B：@李梅面部微表情生动递进（先弯眼含笑→说到一半眼神垂下→睫毛轻颤一次），但嘴唇保持自然闭合或极轻微闭合微动（预留后期 Lip-Sync 口型合成干净基底）；台词音频按 NARR-03 控制符串 `(softly)…(breath)…` 由 Fish Audio 克隆生成，剪映对口型对齐重音秒位。——微表情全保留、口型基底干净，9.3 分放行。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **三人以上同框**：分区句式只保\"主互动双人\"，第三人降级为\"背景虚化剪影/画外声音\"——三清晰人脸=串脸温床；确需三人清晰 → 拆正反打轮播（每人单镜）。\n2. **9:16 竖屏镜**：分区句式换\"上下分区/纵深叠压\"（`KB_07` 二节竖屏双人句式）；运镜禁横移改纵深推拉；画幅字段写 9:16；字幕安全区备注交 R8。\n3. **超长台词（>20 字）**：不塞单镜——回 NARR-03 拆句接力（A 镜说前半+Cutaway 承气口+B 镜说后半）；两个半句各自带排他锁。\n4. **30 秒长条（即梦 2.5）**：节点加密至 5~7 段但\"每段单动作\"；台词分句落在不同段；首段必须重现锚点层（长条中段身份漂移风险高，中途第 15 秒左右再重锚一次 `@资产名`）。\n5. **接力镜（Tail-to-Head）**：锚点层压至 1 词（`@林烬`），动态层只写\"增量变化\"（新增动作/光移），参考节注明\"首帧=上一镜尾帧\"。\n6. **静默爆发镜（S 级无台词压场）**：仍写\"双唇闭合无张嘴动作\"；威压感全部转嫁给运镜幅度+材质动态+光影变化三件套（参考第 01 集分镜 1）。"}]},{"g":"🔌 平台语法插件","items":[{"p":"skills/05_platform_plugins/plat_00_universal_default.md","t":"公用默认标准提示词插件（PLAT-00）· 工业级完整版","d":"WHAT：公用默认标准提示词插件——五大平台模型在人物特写/大幅度打斗/中式美学/多主体交互/运镜控制上的优劣对比矩阵、公用标准中文提示词公式与多题材完整示例、平台智能推荐逻辑。WHEN：用户未指定生图/生视频平台时作为兜底插件触发；或需要跨平台通用版提示词与平台推荐建议时。","raw":"# 公用默认标准提示词插件（PLAT-00）· 工业级完整版\n\n## 一、核心职责与工业级法则（6 条硬核铁律）\n\n1. **安全交集铁律**：公用版只使用全平台安全交集语法——纯中文自然语言、`@资产名` 引用、`[00-02s]` 秒级节点、空间分区句式、口型排他锁；**严禁**混入任何平台专属件（MiniMax 方括号运镜、即梦素材位计数、可灵四段式、ComfyUI 节点参数）——语法污染会让\"通用版\"在半数平台失效。\n2. **推荐必附铁律**：输出公用版的同时必须给出\"首推平台+次推平台+理由\"，理由必须引用优劣矩阵的具体维度（\"S 级大幅动作→可灵：首尾帧锚定+物理规律模拟强项\"），禁止\"都行/看喜好\"。\n3. **迁移提示铁律**：每条公用 Prompt 附\"迁移差异清单\"——转即梦补素材位清单+一致性行；转可灵补首尾帧声明+四段式重排；转 MiniMax 补方括号运镜+声音设计栏；转 ComfyUI 补中英双轨+节点参数+负向包；转豆包补三层空间分句+4K 词缀。\n4. **互斥加载铁律**：本插件与 plat_01~05 互斥——用户一旦指定平台立即卸载本插件转对应插件；跨平台对比场景必须分次产出独立代码块并逐块标注平台名。\n5. **公式对齐铁律**：公用公式即 `KB_08` 编译器的平台中立投影——生图八层全量、视频 20/80 差分；本插件不得增删公式层，只做\"语法中立化\"。\n6. **风险前置铁律**：输出时必须预告该镜头类型在推荐平台的已知崩坏点（引用黑名单编号），让用户抽卡前就知道要盯什么。\n\n## 二、标准执行 SOP（Step-by-Step）\n\n**Step 1 · 读入镜头特征**：任务类型、景别、动作幅度、资产数、台词模式、题材——五个特征向量。\n\n**Step 2 · 查矩阵定推荐**：按 4.1 优劣矩阵逐维度比对，得出首推+次推平台与理由；同时读 `memory/global/权威工作流与影视知识库.md` 三节选型路由表交叉验证。\n\n**Step 3 · 编译公用版**：按 4.2 公式（生图八层 / 视频 20/80 差分）编译全平台安全交集语法的中文 Prompt，代码块封装。\n\n**Step 4 · 生成迁移提示**：按铁律 3 逐平台列差异清单。\n\n**Step 5 · 风险前置**：按镜头类型引用黑名单编号输出 1~2 条已知崩坏点与盯片要点。\n\n**Step 6 · 送检**：R7 评分 ≥9.0 后交付；产出文档标注\"默认公用提示词（附最佳模型推荐）\"。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约\n\n| 字段 | 类型 | 必填 | 示例 |\n|---|---|---|---|\n| 任务类型 | enum | 是 | 生视频 |\n| 镜头特征 | 结构化 | 是 | 近景过肩/微动作/2资产/模式A对白/都市温情 |\n| 用户限制 | text | 否 | 无本地显卡（排除ComfyUI） |\n\n### 输出契约（下游：用户直用 / plat_* 迁移 / R7）\n\n```yaml\n平台推荐: {首推: \"即梦Seedance 2.5\", 次推: \"MiniMax H3\", 理由: \"模式A对白直出+双素材位锁双人；H3微表情细腻可作备选\"}\n公用Prompt: \"```prompt …（安全交集语法）…```\"\n迁移提示: {转即梦: \"+素材位清单(李梅立绘/张三立绘/空镜)+一致性行\", 转可灵: \"改模式B+四段式重排\", 转MiniMax: \"运镜换[固定]+补声音设计栏\", 转ComfyUI: \"中英双轨+IP-Adapter 0.7+负向包\"}\n风险提示: \"双人同框盯串脸(崩坏06)与乱张嘴(崩坏05)——排他锁已写入；抽卡2~3次取双脸同真的一张\"\n```\n\n## 四、专项工具箱\n\n### 4.1 五大平台模型优劣对比矩阵（★=强 ☆=可用 ✕=弱）\n\n| 维度 | 豆包 Seedream 4.0（生图） | 即梦 Seedance 2.x（生视频） | ComfyUI Flux/Wan（生图+视频） | MiniMax H3（生视频） | 可灵 Kling（生视频） |\n|---|---|---|---|---|---|\n| 人物特写 | ★ 中文骨相词响应佳 | ☆ 依赖参考图质量 | ★ PuLID 锁脸天花板 | ★★ 微表情细腻度第一 | ☆ 需主体参考急救 |\n| 大幅度打斗 | ✕（生图平台） | ☆ 长条中段易漂 | ☆ Wan Motion 0.7~0.9 可控但慢 | ✕ 极限动作受限 | ★★ 3D时空注意力+物理规律 |\n| 中式美学 | ★★ 原生中文+新国风强 | ☆ 继承即系审美 | ☆ 靠 LoRA/画风锁文字 | ☆ | ☆ |\n| 多主体交互 | ★ 空间象限排布强 | ★★ 素材位≤4 多资产融合 | ☆ 双 IP-Adapter 可行但打架 | ☆ 参考模式六栏位 | ☆ 主体参考单一 |\n| 运镜控制 | ✕（不执行运镜） | ★ 自然语言运镜+秒级时间轴 | ☆ ControlNet 间接控 | ★★ 方括号指令直执行 | ★★ 首尾帧+幅度匹配 |\n| 附加维度 | 4K 原生/组图 | 30s 长条/原生音频 | 本地零 API 费/负向词独立 | 32kHz 立体声原生 | 首尾帧锚定/长镜物理 |\n\n**选型口诀**：人设场景找豆包，对白融合用即梦，锁脸批量 ComfyUI，微表情找海螺，大动作交给可灵。\n\n### 4.2 公用标准中文提示词完整公式\n\n**生图（八层全量）**：\n```text\n[主体层 @资产+骨相5~8词] + [服饰层 四件套] + [动作层 单一姿态+手部状态] + [空间层 分区句式(多人)] + [环境层 场景三层+时间天气] + [光学层 光型+色温+过曝防护] + [镜头层 景别+机位+构图] + [画风层 @画风锁+线别缀] + [规格 画幅+分辨率]\n```\n**生视频（20/80 差分）**：\n```text\n[锚点20% @资产+≤2骨相词] + [动态80% 运镜1种+幅度｜主动作1个｜微动作1个｜材质动态｜光影变化(可选)] + [时长层 秒级节点≤3] + [口型层 模式A台词+排他锁 / 模式B闭嘴基底] + [画风层 @画风锁+缀] + [规格 画幅+秒数]\n```\n\n### 4.3 三个不同题材完整示例\n\n**示例① 东方玄幻打斗（生视频 · S 级）**：\n```prompt\n黑衣长发@林烬立于@玄天宗比武台中央，[00-02s]镜头低角度缓慢推近，衣摆与额前碎发被罡风掀起轻扬，雷云天光渐暗翻涌；[02-05s]他缓缓抬眼扫视四周，右手取@焚天断剑自下而上划出弧线斜指前方，剑身暗红纹路亮起，气流掀动衣摆与马尾定格，台下人群剪影后倾半步，雷云中一道银白光柱落台，双唇闭合无张嘴动作，@画风锁+冷青蓝主调剑气银白高光，16:9，5秒\n```\n\n**示例② 都市温情对白（生视频 · A 级模式A）**：\n```prompt\n米白开衫母亲@李梅与天蓝卫衣孩童@张三行于@光大街边：画面左侧三分之一为成年女性@李梅（身高约一米六五），右侧三分之二为孩童@张三（身高约一米一），两人牵手间距一臂；[00-00.8s]远景镜头缓慢推近，@张三仰头拽动母亲衣角，梧桐树影斑驳、馄饨摊白雾轻晃；[00.8-03.0s]@张三抬头张嘴说话，嘴唇随台词自然开合：\"妈妈，我要吃莽莽\"（奶声奶气，尾音拖长）；一旁的@李梅保持双唇闭合、嘴角含笑低头倾听，不发一言，@画风锁+暖金橙主调黄昏柔焦光晕，16:9，3秒\n```\n\n**示例③ 悬疑夜巷氛围（生图 · 氛围海报）**：\n```prompt\n悬疑夜巷氛围图：墨绿色调老城窄巷纵深构图，前景湿漉漉的石板路面反光（虚化），中景一盏昏黄路灯下立着黑风衣侦探@沈默（侧身四分之三背对，右手插袋，帽檐压低遮眼），远景巷口浓雾中一个模糊人影剪影；体积雾浓厚，单点暖光与大面积冷暗对比（高光不过曝保留暗部层次），低机位平视，引导线构图，@画风锁+墨绿紫黑主调单点暖光缀，16:9，4K\n```\n\n## 五、常见错误示范 vs 满分工业级示范\n\n### 对比组 1：公用版语法污染\n\n❌ **Bad Case**：\n> （用户未指定平台的）公用提示词：`[推近]镜头…素材位1上传@李梅…负向词：多余手指…`混合了 MiniMax 方括号、即梦素材位、ComfyUI 负向输入三种专属语法。\n\n**扣分点**：违反安全交集铁律——方括号在豆包/可灵被当普通文本、素材位计数在无素材位平台误导用户、负向词在不支持负向输入的端直接画进画面。\n\n✅ **Good Case**：\n> 公用版纯安全交集（见 4.3 示例②），随后附迁移提示：\"转 MiniMax：句首运镜改 `[推近]缓慢`+段尾补声音设计栏；转即梦：前置素材位清单；转 ComfyUI：补英文双轨与负向包输入端。\"\n\n### 对比组 2：无理由推荐\n\n❌ **Bad Case**：\n> 这个镜头用哪个平台都差不多，你自己挑一个顺手的就行，提示词我已经写好了。\n\n**扣分点**：推荐必附铁律违例——无矩阵维度引用、无崩坏风险预告；用户在错误平台抽卡浪费的每一次都是框架的责任。\n\n✅ **Good Case**：\n> 首推即梦 Seedance 2.5（模式A对白直出+素材位双锁，矩阵\"多主体交互★\"）；次推 MiniMax H3（\"人物特写★★\"，微表情细腻）；风险预告：双人同框盯崩坏06 串脸与崩坏05 乱张嘴——排他锁已写入，抽卡取\"双脸同真\"那张。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **跨平台对比需求**：分次激活各平台插件产出独立代码块，逐块标注平台名；禁止一条 Prompt 标\"多平台通用\"之外再标某平台专属件。\n2. **平台能力更新（模型迭代）**：以 `memory/global/权威工作流与影视知识库.md` 为准——复盘引擎 EVO-01 检测到平台语法变更时先更新知识库再更新本矩阵，本插件矩阵注明\"最后核实日期\"。\n3. **用户受限（无本地显卡/无某平台配额）**：推荐链自动裁剪排除项（ComfyUI 需显存、可灵需配额），沿\"即梦→MiniMax→豆包\"降级。\n4. **B 级降本镜头**：推荐固定为\"不生成视频\"（静态图+Lip-Sync+剪映关键帧）——本插件输出静态图 Prompt 与 R8 动效指令单，不走视频推荐链。\n5. **公用版被用户直接拿去不支持中文的平台**：迁移提示中显式警告\"目标平台中文支持弱，请转 ComfyUI 英文双轨版\"，并附英文对照串（KB_06）。"},{"p":"skills/05_platform_plugins/plat_comfyui.md","t":"ComfyUI 平台插件（PLAT-03）· 工业级完整版","d":"WHAT：ComfyUI 专属插件——Flux 生图与 Wan2.1/2.2 生视频的工作流节点配置建议（PuLID/Redux 锁脸、ControlNet 预处理器与权重、LoRA 区间、采样器/步数/CFG）、结构化 Tag+自然语言混合语法与专属 Negative Prompt 模板。WHEN：用户指定 ComfyUI（Flux/Wan/SD系）生图或生视频，或需要本地可控管线、锁脸批量出图、模式B无声视频+后期对口型降本时触发。","raw":"# ComfyUI 平台插件（PLAT-03）· 工业级完整版\n\n## 一、核心职责与工业级法则（6 条硬核铁律）\n\n1. **中英双轨铁律**：Flux/SD/Wan 系英文语义强——交付必须双轨：`正向EN（喂模型）+ 中文存档行（人读与注册表对照）`；中文稿直接喂英文模型=语义损耗过半。\n2. **节点参数随行铁律**：ComfyUI 是工作流引擎，Prompt 必须与节点配置单**同单交付**（锁脸节点+权重、ControlNet 预处理器+强度、LoRA 权重、采样器/步数/CFG、视频 Motion）——无参数的 Prompt 无法复现，等于没交付。\n3. **负向独立铁律**：ComfyUI 保留独立负向输入端——负向模板必挂（4.4）；把负向内容写进正向自然语言（\"不要六指\"）反而注入概念激活。\n4. **模式B闭嘴铁律**：Wan 生成对白镜一律无声输出+`嘴唇自然闭合或极轻微闭合微动（预留后期 Lip-Sync 干净基底）`；大嘴型+LatentSync=重影（崩坏16）。\n5. **锁脸优先铁律**：已注册人物入画必挂锁脸件——角色 LoRA（0.6~0.85）> PuLID（0.6~0.8）> IP-Adapter（0.5~0.7，挂单人立绘/面部特写）；三视图整图禁止入参考位（多头怪）。\n6. **显存预算铁律**：交付前核对显存档位（4.5 节降级链）；24G 满配、12G 降采样两段式、8G 以下建议转在线平台并在选型备注声明。\n\n## 二、标准执行 SOP（Step-by-Step）\n\n**Step 1 · 读入定件**：读编译稿+锁脸需求+ControlNet 需求+显存预算 → 按 IMG-01 路由结论确定节点件清单。\n\n**Step 2 · 组配置单**：按 4.1/4.2 表逐项填节点参数（生图走 Flux 段，视频走 Wan 段），锁脸与控制件按铁律 5 与权重区间。\n\n**Step 3 · 双轨编译**：正向 EN（Tag 前置+自然语言主体段，权重语法 `(tag:1.2)`）+ 中文存档行（@资产名保留原样——注册表对照用）。\n\n**Step 4 · 挂负向**：按 4.4 模板裁剪（生图全量/视频全量+模式B条目）。\n\n**Step 5 · 视频附加段**：首帧声明、Motion Strength 定档（情绪 0.4~0.6/常规 0.5~0.7/动作 0.7~0.9）、模式B闭嘴句、Wan2.2-S2V 特例（无限时长数字人）。\n\n**Step 6 · 送检交付**：R7 评分（平台附加项：负向齐/双轨齐/参数齐）≥9.0 → 单据化交付。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约\n\n| 字段 | 类型 | 必填 | 示例 |\n|---|---|---|---|\n| 编译稿 | text | 是 | KB_08/VID-01 |\n| 任务类型 | enum | 是 | 生视频 I2V（模式B） |\n| 锁脸/控制需求 | list | 是 | 双人锁脸+Depth |\n| 显存预算 | enum | 是 | 24G |\n\n### 输出契约（下游：用户载工作流 / R7）\n\n```yaml\n工作流节点配置单:\n  生图段: {底模: \"Flux.1-dev\", 锁脸: \"PuLID(flux) 0.7\", 控制: \"ControlNet-Depth 0.6(预处理器:MidasDepth)\", LoRA: \"角色LoRA×0(已有PuLID不双挂)\", 采样: \"euler + simple｜steps 24｜guidance 3.5\", 分辨率: \"1344×768(16:9)\"}\n  视频段: {模型: \"Wan2.1-I2V-14B\", 首帧: \"前置基准图\", Motion: \"0.5(情绪戏)\", 采样: \"uni_pc｜steps 20｜cfg 5.0\", 输出: \"无声(模式B)\"}\n正向EN: \"```prompt masterpiece, (1girl:1.2), beige knit cardigan …lips naturally closed …```\"\n中文存档: \"-- 米白开衫@李梅过肩镜头…嘴唇自然闭合(模式B基底)…@画风锁\"\n负向模板: \"```prompt …4.4裁剪版…```\"\n交付格式: \"双轨+节点单同页；文件名含镜号与版本\"\n```\n\n## 四、专项工具箱\n\n### 4.1 Flux 生图工作流节点配置表（基线值）\n\n| 节点段 | 推荐配置 | 参数区间 | 越界后果 |\n|---|---|---|---|\n| 底模 | Flux.1-dev（fp8 可省显存） | —— | —— |\n| PuLID（锁脸） | PuLID(flux)，权重 0.7 | 0.6~0.8 | >0.8 表情锁死 |\n| IP-Adapter | 面部特写参考 0.6 | 0.5~0.7 | >0.7 串风格 |\n| Redux（参考重铺） | 参考图风格迁移 0.5 | 0.4~0.6 | >0.6 抄图 |\n| ControlNet-OpenPose | 预处理器 DWPose，强度 0.7 | 0.6~0.8 | >0.8 肢体僵 |\n| ControlNet-Depth | 预处理器 MidasDepth，0.6 | 0.5~0.7 | >0.7 画面糊 |\n| ControlNet-Canny/Lineart | 预处理器 Canny，0.6 | 0.5~0.7 | >0.7 描边感 |\n| LoRA | 角色专属 0.7 | 0.6~0.85 | >0.9 塑胶脸 |\n| 采样器 | euler + simple | flux guidance 3.0~4.0 | guidance>5 过饱和 |\n| 步数 | 24 | 20~28 | >30 边际极小 |\n| SDXL 旧管线备选 | DPM++ 2M Karras，steps 28，CFG 6 | CFG 5~7 | CFG>7 油画感 |\n\n### 4.2 Wan2.1/2.2 生视频节点配置表\n\n| 节点段 | 推荐配置 | 区间 | 说明 |\n|---|---|---|---|\n| 模型 | Wan2.1-I2V-14B（首帧锚定） | —— | T2V 仅空镜用 |\n| Fun Control 三分支 | 姿态/深度/边缘引导视频 | 单支起步 | 官方工作流，多支各×0.7 |\n| Motion Strength | 情绪 0.5 | 0.4~0.6 | 静态表情戏 |\n| Motion Strength | 常规 0.6 | 0.5~0.7 | 行走交互 |\n| Motion Strength | 动作 0.8 | 0.7~0.9 | 打斗（配合首尾帧思路） |\n| 采样 | uni_pc，steps 20，cfg 5.0 | steps 20~30 / cfg 5~6 | cfg>6 运动过冲 |\n| 帧率/时长 | 16fps × 5s = 80 帧 | ≤5s/条 | 长镜走接力 |\n| Wan2.2-S2V | 数字人无限时长口播 | —— | 模式B口播特化 |\n| 输出 | 无声 + 闭嘴基底 | —— | 后期 LatentSync/剪映对口型 |\n\n### 4.3 结构化 Tag + 自然语言混合语法\n\n```text\n正向EN结构 = [质量Tag: masterpiece, best quality, 8k] + [主体Tag(带权重): (1girl:1.2), black high ponytail] +\n           [自然语言段: a young sword cultivator stands center of stone arena, robe hem lifted by wind…] +\n           [光学/构图Tag: cinematic lighting, low angle] + [@画风锁中文行原样保留于存档行]\n权重语法：(tag:1.2) 强化 / (tag:0.8) 弱化；Tag 在前抢注意力，自然语言在后管语义连贯。\n```\n\n### 4.4 专属 Negative Prompt 模板（裁剪用母版）\n\n**生图母版**：\n```prompt\n多余手指, 六指, 手指粘连, 面部扭曲, 五官移位, 高光过曝, 硬阴影, 透视畸变, 双人融合, 三个相同人物, 复制人, 文字, 乱码, 水印, 签名, 低分辨率, 模糊, 噪点, 肢体比例错误, 畸形, 过饱和, 卡通辱画风\n```\n**生视频母版（+模式B条目）**：\n```prompt\n镜头切换, 机位跳切, 人物瞬移, 全员张嘴, 多人张嘴, 口型大开, 身份漂移, 肢体穿模, 手指畸形, 背景闪烁, 拖影, 鬼影, 色彩断层, 画面撕裂, 文字出现, 水印\n```\n\n## 五、常见错误示范 vs 满分工业级示范\n\n### 对比组 1：无参数交付\n\n❌ **Bad Case**：\n> ComfyUI 提示词：一个穿黑衣服的长发剑客站在台子上，风吹起衣角，电影感，高清。（就这些，节点自己看着配）\n\n**扣分点**：纯中文喂英文模型（语义损耗）；无节点配置单（无法复现）；无锁脸件（人物即兴）；无负向；\"电影感高清\"空洞——违反铁律 1/2/3/5。\n\n✅ **Good Case**：\n> 节点单：`Flux.1-dev + PuLID(flux)0.7(@林烬面部特写) + Depth 0.6(MidasDepth) ｜ euler+simple, steps 24, guidance 3.5 ｜ 1344×768`；正向EN：`masterpiece, (1boy:1.2), black outfit, high ponytail, a young sword cultivator stands center of stone arena, robe hem and loose strands lifted by wind force…`；负向母版全挂；中文存档行含 `@林烬…@画风锁`。——单据化可复现交付。\n\n### 对比组 2：模式B口型\n\n❌ **Bad Case**：\n> Wan 视频：@李梅情绪饱满地大声说话，嘴型夸张开合，台词激昂，生成后我再用对口型软件配音。\n\n**扣分点**：模式B写\"嘴型夸张开合\"——LatentSync 后期对口型与原视频大嘴型重影打架（崩坏16 一票否决）。\n\n✅ **Good Case**：\n> Wan 无声输出 + `lips naturally closed or near-closed micro movement (clean base for post lip-sync)`；微表情链保留（eye smile→gaze lowers→lash flutter）；台词按 NARR-03 控制符串由 Fish Audio 克隆 → LatentSync/剪映对口型 → 音画 ±2 帧微调。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **显存不足（<16G）**：降级链——fp8 底模 → 分辨率降档（1024 级）→ Tiled VAE 分块解码 → 视频换 Wan2.1-1.3B 草稿迭代+单帧高清；8G 以下建议整任务转在线平台并备注。\n2. **双参考打架（双人物锁脸失衡）**：双 IP-Adapter 各 0.6 起步；一人不像→该位换面部特写；仍打架→Depth 0.6 钉纵深+单 PuLID 只锁主角，配角靠分区句式。\n3. **Wan 输出抖动（高频微震）**：Motion 降 0.1 档；fps 帧率补齐（16→24 补帧）；仍抖→剪辑段用剪映「智能补帧」+稳定（R8 流程）并复盘归档。\n4. **批量出图（同角色多镜）**：固定种子区间+批量 Prompt 队列（JSON 清单）；每批抽 20% 人工抽检锁脸；注册表摘要词全程逐字复用。\n5. **Flux guidance 过曝**：guidance 降到 3.0~3.5；高光区仍爆→正向加 `soft highlight rolloff`，负向加 `overexposed`。\n6. **英文 Tag 与中文 @资产共存需求**：喂模型用 EN；@资产名只活在中文存档行与素材命名（文件名=镜号_@资产_版本）——保证批量脚本按名归档不错位。"},{"p":"skills/05_platform_plugins/plat_doubao_seedream.md","t":"豆包 Seedream 平台插件（PLAT-01）· 工业级完整版","d":"WHAT：豆包 Seedream 专属生图插件——长句空间方位排布语法（前景/中景/背景+左中右象限）、中式光影质感词库、中文文字渲染技巧、分辨率推荐与正反例。WHEN：用户指定豆包/Seedream 生图，或镜头需要中式美学、多主体空间分区构图、4K 组图时触发。","raw":"# 豆包 Seedream 平台插件（PLAT-01）· 工业级完整版\n\n## 一、核心职责与工业级法则（6 条硬核铁律）\n\n1. **中文原生铁律**：豆包 Seedream 中文理解顶级（官方 4.0 中文原生）——**禁止翻译成英文**喂豆包；英文串只在 ComfyUI 用。中文打光/材质/骨相术语直响应，翻译反而丢语义。\n2. **三层空间分句铁律**：豆包对\"前景…中景…远景…\"分句式空间层次理解极强——任何含空间的图必须按三层分句组织；三层顺序固定（前景→中景→远景），每层一句，句内给虚实（\"虚化/实焦\"）。\n3. **象限量化铁律**：多主体排布必须用量化象限词——`画面左侧三分之一 / 右侧三分之二 / 左前景 / 右后景纵深处 / 中轴线上`；模糊的\"旁边/一旁\"在多主体时必串位（配合身高差+服装色差三重锚定）。\n4. **光影直命名铁律**：光学层直接点名光型术语（豆包强项）——伦勃朗光/轮廓光/逆光/分割光/环形光/顶光/丁达尔体积光；同时保留\"高光不过曝、保留面部细节\"防护句（I2V 首帧必挂，崩坏10）。\n5. **文字克制铁律**：豆包 4.0 中文文字能力虽有增强，但**长句清晰文字仍不稳**——画面文字策略：①无文字（首选）②\"字迹模糊虚化\"（景深元素化）③短词 2~4 字（招牌/匾额，可尝试且备后期）；清晰长文一律剪映后期贴字。\n6. **分辨率声明铁律**：末尾缀 `2K` / `4K`（4.0 原生 4K）；横幅资产/场景 4K、竖屏立绘 4K、快速草稿 2K；组图需求显式写\"组图\"并说明每格内容。\n\n## 二、标准执行 SOP（Step-by-Step）\n\n**Step 1 · 读入初稿**：取 KB_08 编译初稿（八层全量）；确认出图目标与多主体数。\n\n**Step 2 · 空间重排**：按铁律 2/3 把初稿的空间/环境/主体层重排为\"前景句→中景句→远景句\"，多主体套象限句式+身高差+服装色差。\n\n**Step 3 · 光影替换**：按 4.2 光影词替换表把通用光学描述换成豆包直响应术语；首帧图加过曝防护句。\n\n**Step 4 · 文字方案**：按铁律 5 处理画面文字需求（三选一）。\n\n**Step 5 · 规格与挂锁**：末尾依序挂 @画风锁+线别缀+画幅+分辨率；资产锁定图按 KB_06 例外条款替换光影词为 Albedo 平光组。\n\n**Step 6 · 抽卡建议**：给次数（资产 2~3 次/首帧 3~5 次）与选优标准（下颌线最锐/双脸同真/白雾层次最好等具体指标）。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约\n\n| 字段 | 类型 | 必填 | 示例 |\n|---|---|---|---|\n| 出图目标 | enum | 是 | 分镜首帧基准图 |\n| KB_08 初稿 | text | 是 | 八层编译稿 |\n| 多主体数 | int | 否 | 2 |\n| 文字需求 | enum | 否 | 招牌短词 |\n\n### 输出契约（下游：用户跑图 / R7 / IMG-02 复用）\n\n```yaml\n豆包版Prompt: \"```prompt 远景俯瞰@玄天宗比武台：前景为青石台面与四角符文石柱局部（微虚化）…中景…远景…，雷云压城冷青蓝主调…，16:9，4K```\"\n光影替换: {\"柔和侧光\"→\"伦勃朗光+暗部补光\", \"背光\"→\"侧逆光镶金边\"}\n文字渲染方案: \"招牌'光大小吃'四字短词可尝试(备后期贴字)；其余字迹全部虚化\"\n分辨率推荐: \"4K（资产/首帧）；2K（草稿迭代）\"\n抽卡建议: \"3次取雷云密度最压迫的一张；石柱符文若糊，Inpainting局部修(羽化25px)\"\n```\n\n## 四、专项工具箱\n\n### 4.1 长句空间方位排布语法（结构模板 + 象限词表）\n\n**结构模板**：\n```text\n[景别+视角]@[场景/主体]：前景为[元素+虚实+占比暗示]，中景为[主体/核心元素+状态]，远景为[延伸元素+虚化]；\n（多主体时）画面[象限词]为@人物A（身高+服装主色），[象限词]为@人物B（身高差+服装主色差）；\n[光学层+色温]，[镜头层构图]，@画风锁+[缀]，[画幅]，[分辨率]\n```\n**象限词表**：`画面左侧三分之一 / 画面右侧三分之二 / 左半区 / 右半区 / 中轴线上 / 左前景 / 右前景 / 左后景纵深处 / 右后景纵深处 / 上三分之一（天空区）/ 下三分之一（地面区）`。\n**虚实词表**：前景虚化 / 微虚化 / 实焦 / 大光圈虚化 / 焦点落于… / 景深外柔化。\n\n### 4.2 中式光影质感词库（豆包直响应术语 · 替换表）\n\n| 通用写法（弱） | 豆包直响应术语（强） |\n|---|---|\n| 脸上有光有影 | `伦勃朗光（单侧三角光）` / `分割光（左右脸明暗对分）` |\n| 背着光 | `侧逆光镶金边` / `逆光剪影（高光不过曝）` |\n| 光从上面来 | `顶光压迫感` / `教堂式顶光垂落` |\n| 有氛围光 | `丁达尔体积光柱自云隙垂落` / `晨雾中的体积光` |\n| 脸打匀了 | `蝴蝶光（环形光）` / `大型柔光箱正面平光` |\n| 金属亮 | `精钢寒光凛冽镜面打磨` / `鎏金温润斑驳做旧` |\n| 水汽感 | `白雾蒸腾自锅沿翻涌` / `薄雾漫过石板路面` |\n\n### 4.3 中文文字渲染技巧（三档策略）\n\n| 档位 | 适用 | 写法 | 风险 |\n|---|---|---|---|\n| ① 无文字 | 默认 | 不提文字；负向意识上规避（招牌只写色块形状） | 零 |\n| ② 虚化文字 | 氛围招牌/匾额 | `招牌字迹模糊虚化不可辨认，作为景深元素` | 低 |\n| ③ 短词尝试 | 剧情必需招牌（2~4字） | `匾额上书\"玄天宗\"三字楷书` + 抽卡 3 次 | 中（错字率存在，必配后期贴字备份） |\n\n### 4.4 推荐分辨率与规格\n\n| 场景 | 规格 |\n|---|---|\n| 资产三视图/场景全景/首帧基准 | 16:9 / 9:16，4K |\n| 独立立绘（竖） | 9:16，4K |\n| 快速草稿迭代（构图试错） | 2K（定稿后 4K 重出） |\n| 组图（表情/分镜宫格） | 显式写\"组图/九宫格\"+每格内容，4K |\n\n## 五、常见错误示范 vs 满分工业级示范\n\n### 对比组 1：空间排布\n\n❌ **Bad Case**：\n> 一个大大的比武台，很多人围着看，远处有山有云有宫殿，主角站在中间很威风，光线很有氛围感，画质高清。\n\n**扣分点**：无三层分句（豆包的空间强项没用上）；\"很多人/有山有云\"堆名词无层次无虚实；\"中间/远处\"未量化；\"氛围感/高清\"空洞——人群必糊成一团，宫殿飘在云上无纵深。\n\n✅ **Good Case**：\n```prompt\n远景俯瞰@玄天宗比武台：前景为青石台面与四角符文石柱局部（微虚化），中景为立于台心的黑衣长发@林烬（九头身，玄黑劲装银线暗纹，小比例不抢戏），远景为云海之上层叠浮空山岳与凌霄殿玄铁飞檐（虚化）；台下环形人群剪影散布广场两翼；雷云压城冷青蓝主调天光，丁达尔光柱自云隙垂落三道，符文银白高光点缀石柱；低角度仰拍与中心构图，@画风锁+冷青蓝主调剑气银白高光，16:9，4K\n```\n\n### 对比组 2：文字与光影\n\n❌ **Bad Case**：\n> 街道招牌上写着\"光大美食街欢迎品尝正宗手工馄饨\"，字体清晰漂亮，人物站在光线下，光影效果好。\n\n**扣分点**：12 字长句清晰文字（铁律5 红线，必乱码崩坏11）；\"光影效果好\"无术语（豆包直响应能力被浪费）。\n\n✅ **Good Case**：\n> 文字档②：`街道两侧招牌字迹模糊虚化不可辨认，作为黄昏景深元素`（\"光大小吃\"四字若剧情必需，短词尝试 3 次并备剪映贴字）；光影直命名：`黄昏暖金橙主调，侧逆光为@李梅母子镶金边轮廓，高光不过曝保留面部细节`。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **多主体 ≥3**：豆包象限词只保主互动 2 人量化分区；第三人写\"背景虚化剪影\"（清晰三人脸=串脸温床，崩坏06）。\n2. **竖屏（9:16）图**：象限词改纵向——\"上三分之一天空区/下三分之一地面区/中轴主体贯穿\"；空间三层改\"下前景/中主体/上远景\"纵向叠压。\n3. **多图融合编辑（改图需求）**：豆包 4.0 支持多图融合创作——底图（要保留的构图）+人物参考图（立绘）双上，Prompt 注明\"保持底图构图与人物参考外观\"；重绘等效幅度靠\"轻改/仅改光影层\"文字指令控制。\n4. **组图九宫格表情矩阵**：写\"3x3组图\"+九格情绪词逐格列出（每格给具体面部动作词）；抽卡选优标准=\"九格同一张脸\"，不同脸即废。\n5. **资产锁定图（三视图）**：本插件同样适用——Albedo 平光词组是豆包可执行的正面物理描述；但三视角一致性要求高时，评估转 ComfyUI（Lineart 钉轮廓）。\n6. **生成结果画幅不符**：豆包偶发画幅漂移——Prompt 末尾画幅词重复一次（\"16:9横幅，16:9\"），仍漂则后期裁切并在复盘占位归档（EVO-01 修订本插件）。"},{"p":"skills/05_platform_plugins/plat_jimeng.md","t":"即梦 Seedance 平台插件（PLAT-02）· 工业级完整版","d":"WHAT：即梦（Jimeng / Seedance）专属生视频插件——@资产参考图素材位绑定语法、自然语言运镜词库（推拉摇移环绕跟随升降）、按秒时间轴叙事结构、运动幅度控制建议与完整示例。WHEN：用户指定即梦/Seedance 生成视频，或需要多素材参考融合、30秒内分秒叙事、模式A原生对白直出时触发。","raw":"# 即梦 Seedance 平台插件（PLAT-02）· 工业级完整版\n\n## 一、核心职责与工业级法则（6 条硬核铁律）\n\n1. **四段公式铁律**：即梦官方结构 = `主体（外貌+服装）+ 动作序列 + 镜头语言（运镜）+ 视觉风格 + 约束条件`——差分稿迁入时按此序重排；主体段锚点仍守 20%（≤2 骨相词），禁止借\"四段式\"之名堆外貌。\n2. **素材位前置铁律**：Prompt 正文之前必须先输出素材位规划清单（`素材位1：@资产立绘…`），且 @资产名与位次一一对应；人物立绘/面部特写/场景空镜/道具特写各占其位，**总数 ≤4**（素材位克制铁律，权重失衡串色）。\n3. **秒级时间轴铁律**：即梦原生支持秒级时间戳——统一用 `[0-1秒]…[1-3秒]…` 格式（带\"秒\"字）；单条 ≤30 秒；长条（>10s）中段第 15 秒左右重锚一次 @资产名（中段漂移高发）。\n4. **一致性行铁律**：凡挂了素材位，Prompt 末尾必附一致性行——`人物与场景外观全程与参考素材保持一致`；无此行即梦不保证跨镜同脸。\n5. **模式A口型铁律**：即梦是模式A（原生音画同出）首选——台词写引号内嵌+语气标注+张嘴动作+**倾听者闭嘴锁**；环境音/音效可随音频能力一并写明（\"童声对白与脚步环境音同步生成\"）。\n6. **幅度克制铁律**：即梦运镜与动作写\"幅度副词+运动词\"（缓慢推近/平稳横移）；大幅高速动作（急速转身/狂奔）是其弱区——需求出现时改可灵或拆解降速，并在选型备注声明。\n\n## 二、标准执行 SOP（Step-by-Step）\n\n**Step 1 · 读入**：VID-01 差分公用稿 + 分镜行（等级/时长/台词模式）+ 参考图清单。\n\n**Step 2 · 规划素材位**：按铁律 2 列清单——人物 1~2 位（立绘优先，微表情戏换面部特写）+ 场景空镜 1 位 + 道具特写 ≤1 位；标注每位用途。\n\n**Step 3 · 四段重排**：主体段（锚点 ≤2 词+服装主色）→ 动作序列（秒级时间轴）→ 镜头语言（运镜词库映射）→ 视觉风格（@画风锁+缀）→ 约束（分区句式+口型锁+一致性行）。\n\n**Step 4 · 时间轴本地化**：`[00-00.8s]` → `[0-0.8秒]`；节点对齐 0.5 秒网格；长条加密节点仍守\"每段单动作\"。\n\n**Step 5 · 音频备注**（模式A）：台词+语气+同步声说明；模式B 则改声明\"无声输出需求另选平台\"（即梦强项是模式A，模式B 建议转 ComfyUI）。\n\n**Step 6 · 盯片建议**：给抽卡次数与盯片点（双脸同真/尾帧可用性/口型对齐）；送 R7 评分 ≥9.0 交付。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约\n\n| 字段 | 类型 | 必填 | 示例 |\n|---|---|---|---|\n| VID-01 差分稿 | text | 是 | 公用版 20/80 |\n| 台词模式 | A/B | 是 | A |\n| 参考图清单 | list | 是 | @李梅立绘/@张三立绘/@光大街边空镜 |\n\n### 输出契约（下游：用户即梦跑片 / R7 / R8 卡点）\n\n```yaml\n素材位规划: [{位1: \"@李梅全身立绘\", 用途: \"锁母亲外观\"}, {位2: \"@张三全身立绘\", 用途: \"锁孩童\"}, {位3: \"@光大街边空镜\", 用途: \"锁场景\"}]\n即梦版Prompt: \"```prompt 素材位1：@李梅全身立绘；素材位2：@张三全身立绘；素材位3：@光大街边空镜。\\n黄昏@光大街边人行道，画面左侧三分之一为成年女性@李梅（米白针织开衫，身高约一米六五）…[0-0.8秒]…[0.8-3秒]…人物与场景外观全程与参考素材保持一致，@画风锁+暖金橙主调黄昏柔焦光晕，16:9```\"\n运镜映射: {\"远景镜头缓慢推近\"→\"远景缓慢推近（自然语言保留）\", \"环绕\"→\"镜头环绕主体缓慢旋转\"}\n幅度建议: \"推近配'缓慢'；行走配'平稳'；禁'急速/猛然'\"\n模式A音频: \"童声对白与街道环境音同步生成；尾音'莽莽~'拖长\"\n盯片建议: \"抽3次：①双脸同真 ②李梅全程闭嘴 ③白雾层次未糊\"\n```\n\n## 四、专项工具箱\n\n### 4.1 @资产参考图素材位绑定语法\n\n**清单格式（Prompt 首行块）**：\n```text\n素材位1：@李梅全身立绘；素材位2：@张三全身立绘；素材位3：@光大街边空镜；素材位4：@焚天断剑特写（按需）。\n```\n**绑定规则**：①正文 @资产名与位次名严格同名（纯中文优势：名即位即引用三合一）；②人物位优先立绘（全身份），微表情特写镜可换面部特写占人物位；③场景空镜必占一位（无场景位=街景自由发挥）；④道具位仅道具叙事镜挂；⑤总位 ≤4——平台上限 50 位（2.5），但实用四位，多则权重稀释串色。\n\n### 4.2 自然语言运镜词库（公用词 → 即梦写法 + 幅度副词）\n\n| 公用运镜词 | 即梦自然语言写法 | 微幅副词 | 中幅 | 大幅（慎用） |\n|---|---|---|---|---|\n| 推 | `镜头缓慢推近` / `推镜` | 缓慢 | 匀速推进 | 急速推近（弱区） |\n| 拉 | `镜头缓缓拉远` | 缓缓 | 匀速拉远 | 骤然拉开 |\n| 摇 | `镜头左摇/右摇` | 轻缓 | 平稳 | 甩镜（禁，易崩） |\n| 移 | `镜头平稳横移` | 缓慢平移 | 平稳横移 | 快速横移 |\n| 环绕 | `镜头环绕主体缓慢旋转` | 缓慢环绕 | 环绕一周（禁>180°） | —— |\n| 跟随 | `镜头平稳跟随人物前行` | 缓步跟随 | 跟拍 | 追逐跟拍（弱区） |\n| 升降 | `镜头缓缓上升/下降` | 缓缓 | 匀速 | —— |\n| 固定 | `镜头固定不动` | —— | —— | —— |\n\n### 4.3 按秒时间轴叙事结构（三档模板）\n\n**3 秒对白镜**：`[0-0.8秒]铺垫微动作；[0.8-3秒]张嘴说台词（引号+语气）+排他锁`\n**5 秒动作镜**：`[0-2秒]运镜+材质动态；[2-5秒]主动作+微动作`\n**30 秒长条**：`[0-2秒]…[2-5秒]…[5-8秒]…[8-12秒]…[15秒处重锚@资产名]…[25-30秒]收势定格`——每段单动作，台词分句落段。\n\n### 4.4 运动幅度控制建议表\n\n| 内容类型 | 建议幅度档 | 理由 |\n|---|---|---|\n| 情绪对白/微表情 | 全部\"缓慢/轻\" | 即梦微动态稳定，大幅反漂 |\n| 行走/日常交互 | \"平稳/匀速\" | 中幅安全区 |\n| 打斗/奔跑 | 拆解降速或转可灵 | 即梦大幅物理弱区 |\n| 镜内位移 | ≤1 身位 | 大位移瞬移崩坏13 |\n\n## 五、常见错误示范 vs 满分工业级示范\n\n### 对比组 1：素材位绑定\n\n❌ **Bad Case**：\n> 提示词：一对母子在黄昏的街上走路，孩子说想吃东西，妈妈安慰他，画面温馨唯美，人物要好看。（未上传任何参考图，也未写素材位）\n\n**扣分点**：无素材位=人物外观全凭模型即兴（跨镜必换脸）；\"温馨唯美/要好看\"不可执行；台词未引号未排他锁；无时间轴无一致性行——四段公式与素材位体系全部旁路。\n\n✅ **Good Case**：见\"输出契约\"完整示例——三位清单前置、四段重排、`[0-0.8秒]`/`[0.8-3秒]` 时间轴、台词引号+奶声奶气+李梅闭嘴锁、末尾一致性行+画风锁+画幅。\n\n### 对比组 2：时间轴与幅度\n\n❌ **Bad Case**：\n> [0-5秒] 母子俩快步跑过街道，妈妈突然转身抱起孩子转了一圈，然后镜头先是环绕又推近再拉远，孩子大喊妈妈我要吃莽莽妈妈说好好好下次买。\n\n**扣分点**：单段三主动作（跑+抱+转，V3 否决）；三种运镜连用（V9）；360 度转圈（崩坏03 一票否决）；双主体台词挤一句无排他锁（V5 否决）；台词 20+ 字无时间锚。\n\n✅ **Good Case**：\n> 拆三镜：镜A `[0-3秒] 镜头平稳跟随母子缓步前行，@张三仰头说\"妈妈，我要吃莽莽\"（奶声尾音拖长），@李梅双唇闭合含笑倾听`；镜B Cutaway 白雾特写（B级静态）；镜C `[0-4秒] 固定镜头，@李梅蹲身抚头说\"等爸爸回来给你买\"（温柔轻叹），@张三闭嘴仰望`——每镜单动单运镜单台词主体。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **模式B 需求（后期对口型）**：即梦强项是模式A——确需模式B 时转 ComfyUI Wan；若必须用即梦，台词段改写\"面部微表情生动，嘴唇自然闭合或极轻微微动（预留后期对口型基底）\"，并放弃其原生音频（后期再合成）。\n2. **素材位人物不像（权重失衡）**：不像的那位参考图从立绘换**面部特写**重试；仍不像 → 该镜降级单人对拍+剪辑正反打合成。\n3. **30 秒长条中段漂移**：第 15 秒处 Prompt 重锚 `@资产名+1 骨相词`；仍漂 → 拆两条 15 秒独立生成+转场缝合（叠化 0.2s）。\n4. **竖屏长条**：时间轴规则不变；构图过 VIS-01 转换表（纵深叠压）；竖屏对白镜面部占画面高 ≥1/3，字幕安全区底部 15% 备注 R8。\n5. **音频不同步（模式A口型滞后）**：即梦音频-口型偶发半帧差——导出后剪映微移音频 ±2 帧；反复不同步则该台词改模式B 重生成（复盘占位归档，EVO-01 修订本插件\"模式A音频备注\"）。\n6. **首帧图与素材位冲突（既有首帧又有参考图）**：以首帧为主锚（I2V），素材位减至\"人物面部特写 1 位\"辅助锁脸；场景不再占位（首帧已含），避免双场景指令打架。"},{"p":"skills/05_platform_plugins/plat_kling.md","t":"可灵 Kling 平台插件（PLAT-05）· 工业级完整版","d":"WHAT：可灵（Kling）专属插件——首尾帧精准锚定语法、长镜头物理流体/布料解算描述词、运镜参数化控制（幅度×速度矩阵）与高表现模式提示词模板。WHEN：用户指定可灵/Kling 生成视频，或镜头为S级奇观、大幅度打斗、需要首尾帧精准控制或物理规律模拟时触发。","raw":"# 可灵 Kling 平台插件（PLAT-05）· 工业级完整版\n\n## 一、核心职责与工业级法则（6 条硬核铁律）\n\n1. **四段式公式铁律**：可灵官方公式 = `主体（主体描述）+ 运动 + 场景（场景描述）+（镜头语言 + 光影 + 氛围）`——迁入差分稿时按此序重排；核心三要素主体+运动+场景缺一不可。\n2. **首尾帧过渡铁律**：首尾帧模式下 Prompt **只写中间过渡运动**——起止状态的静态描述（首帧已含）严禁复述（浪费过渡算力+诱发漂移）；开头必须显式声明 `首帧=图1（…），尾帧=图2（…）`。\n3. **幅度匹配铁律**（可灵第一铁律）：运镜与动作幅度必须匹配首尾帧画面差异——差异大→大幅词（快速/急速），差异小→\"缓慢\"；错配的直接后果是**运镜指令不执行**（可灵实测）。\n4. **物理语言铁律**：可灵 3D 时空联合注意力擅长物理规律模拟——大幅动作必写物理因果词（重力/惯性/气流/反冲/落地缓冲）；\"凭空帅气地飞起\"不如\"借剑撑地反冲跃起，落地单膝下沉缓冲\"。\n5. **锚点间隔铁律**：多镜头分段叙事（单条内多段）时时间锚点间隔 ≥3 秒，否则分镜切换生硬；单条常规 ≤5s，长镜走接力。\n6. **主体参考急救铁律**：生成主体崩坏（脸漂/形变）→ 两步急救：①Prompt 增加外貌细节锚 ②挂主体参考图；仍崩则降级备选技法（即梦多图参考）并填复盘占位。\n\n## 二、标准执行 SOP（Step-by-Step）\n\n**Step 1 · 读入**：差分稿 + 分镜行（等级/幅度/时长）+ 首尾帧图就位状态 + 物理类型需求。\n\n**Step 2 · 定锚定方式**：S 级大幅→首尾帧双图；A 级→首帧单图（图生视频）；无图文生视频仅限纯空镜。\n\n**Step 3 · 四段重排**：主体段（锚点 ≤2 词）→ 运动段（只写过渡+物理因果）→ 场景段（三层）→ 镜头语言段（运镜+幅度+光影+氛围）。\n\n**Step 4 · 幅度定档**：按 4.3 差异-幅度对照表给运镜与动作定幅度词；差异与幅度错配即回 IMG-02 调尾帧图。\n\n**Step 5 · 物理注入**：按 4.2 解算词库把物理类型词注入运动段（流体/布料/碰撞/坠落各选）。\n\n**Step 6 · 模式与交付**：标准/高性能档建议（4.4 模板）；盯片点（收势定格是否到尾帧/物理是否违和）；R7 ≥9.0 交付；备选降级条件随单。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约\n\n| 字段 | 类型 | 必填 | 示例 |\n|---|---|---|---|\n| 差分稿 | text | 是 | VID-01 公用版 |\n| 首尾帧 | 就位状态 | S级必填 | 图1静立/图2剑指定格 |\n| 物理类型 | enum | 大幅镜必填 | 气流+布料+碰撞 |\n| 模式偏好 | enum | 否 | 标准（高质量） |\n\n### 输出契约（下游：用户可灵跑片 / R7 / VID-02 接力链）\n\n```yaml\n可灵版Prompt: \"```prompt 首帧=图1（@林烬负剑静立于@玄天宗比武台台心），尾帧=图2（@林烬持@焚天断剑斜指前方、衣袂上扬定格）。主体：黑衣长发@林烬；运动：镜头低角度推近的同时，他缓缓抬眼扫视，右手取@焚天断剑自下而上划出弧线，剑身暗红纹路亮起，气流自剑锋扩散掀动衣摆与马尾，台下人群剪影后倾半步，光柱落台后定格（符合气流惯性与重力）；场景：青石比武台、四角符文石柱、云海山岳、雷云压城；镜头语言：低角度推近，冷青蓝主调天光，剑气银白高光，威压氛围，双唇闭合无张嘴动作，@画风锁+冷青蓝主调剑气银白高光，16:9，5秒```\"\n差异-幅度结论: \"两图差异=中（站位同/剑势与衣袂变）→运镜'推近'中幅+动作'划出弧线'中速\"\n物理注入: \"气流扩散(轻流体)+衣摆马尾(布料)+后倾(群体惯性)+光柱落台(光影物理)\"\n模式建议: \"标准档（S级不省）；备选降级：可灵两轮废片→即梦多图参考(素材位3)\"\n```\n\n## 四、专项工具箱\n\n### 4.1 首尾帧精准锚定语法\n\n```text\n挂载声明（Prompt 首行）：首帧=图1（[一句静态概括]），尾帧=图2（[一句静态概括]）。\n主体段：@资产名+≤2骨相词。\n运动段：只写\"从首帧状态到尾帧状态\"的中间过程——过程拆为 2~3 个物理子动作，每子动作带因果词。\n场景段：与首帧图同源的三层描述（简写，防模型重造空间）。\n镜头语言段：运镜+幅度（按对照表）+光影+氛围+口型声明+@画风锁+画幅+秒数。\n红线：①不复述首帧静态 ②运镜幅度匹配差异 ③尾帧必须是\"动作顶点定格\"而非中间态。\n```\n\n### 4.2 长镜头物理流体/布料解算描述词库\n\n| 物理类型 | 高表现描述词（可灵强区） | 慎用/降级词 |\n|---|---|---|\n| 流体-水 | 雨滴沿发梢坠落飞溅细珠、水面向外荡开同心涟漪、倾注水流表面张力拉出弧线 | 瓢泼大雨（闪烁）、海啸巨浪 |\n| 流体-气 | 气流自剑锋呈扇面扩散、罡风掀起衣摆前缘、尘土随落地弥散上扬 | 龙卷风 |\n| 布料 | 衣袂随气流上扬后受重力缓落、袖口随抬手垂坠摆动、裙摆涟漪式荡开 | 大风狂舞布料撕扯 |\n| 毛发 | 马尾随转体惯性甩出弧线后回摆、碎发拂过眼角 | 高速甩发糊影 |\n| 碰撞/惯性 | 剑刃相击迸出火星反震手臂后移半寸、落地单膝下沉缓冲尘土轻扬 | 高速连击多段碰撞 |\n| 坠落/重力 | 坠落加速衣摆向上翻涌、落地屈膝卸力 | 无缓冲直坠（违和） |\n\n### 4.3 运镜参数化控制（差异-幅度-速度三维对照）\n\n| 首尾帧差异 | 运镜幅度词 | 动作速度词 | 组合示例 |\n|---|---|---|---|\n| 微差（同景微变） | 缓慢 | 轻缓 | `[缓慢推近]`+衣摆轻扬 |\n| 中差（动作完成/位移半身位） | 中幅（推近/横移） | 匀速/中速 | `推近`+划弧取剑 |\n| 大差（全景→特写/大位移） | 快速/急速 | 急速（配锚定） | `急速推近`+跃起（首尾帧必须双锚） |\n| 环绕需求 | 缓慢环绕（≤180°） | 匀速 | 高光时刻环绕 |\n\n**速度副词阶梯**：轻缓 → 缓慢 → 匀速 → 中速 → 快速 → 急速（急速必须配首尾帧，裸用必糊）。\n\n### 4.4 高表现模式提示词模板\n\n```text\n模板（S级标准档）：\n首帧=图1（…），尾帧=图2（…）。主体：@资产+2词；运动：[运镜+幅度]的同时，[物理子动作1因果词]，[物理子动作2]，[群体/环境反应]，[顶点定格描述]（符合[重力/惯性/气流]物理规律）；场景：[三层简写]；镜头语言：[景别+角度]，[色温主调]，[高光类型]，[氛围词]，双唇闭合无张嘴动作，@画风锁+[线别缀]，16:9，5秒\n\n模式建议：S级用\"标准档\"保质量（不省算力）；A级行走交互可用\"高性能档\"提速；批量 B级禁用可灵（静态图方案）。\n```\n\n## 五、常见错误示范 vs 满分工业级示范\n\n### 对比组 1：首尾帧使用\n\n❌ **Bad Case**：\n> 上传了首帧和尾帧图。提示词：@林烬穿着黑色劲装束着高马尾背着断剑静静地站在比武台中央，四周是符文石柱和云海，雷云密布，他看起来很威严。（100 字全在复述首帧静态）\n\n**扣分点**：运动段被静态复述挤占（铁律2）——模型没有\"过渡指令\"只能在两帧间匀速淡变；外貌超 2 词（V2）；\"看起来很威严\"不可生成；未声明首尾帧挂载。\n\n✅ **Good Case**：见\"输出契约\"全文——首行双图声明、运动段三物理子动作、幅度中档匹配中差、四段式齐、双唇闭合防乱张嘴——9.3 分放行。\n\n### 对比组 2：物理与幅度\n\n❌ **Bad Case**：\n> 首帧=站立，尾帧=站远处的另一个位置。提示词：镜头急速360度环绕旋转，人物瞬间移动到远处，衣角飞舞，帅到爆炸。\n\n**扣分点**：360 度环绕（崩坏03 一票否决）；\"瞬间移动\"（崩坏13）；两帧差异大却无过程拆解；\"帅到爆炸\"空洞——V10 否决打回。\n\n✅ **Good Case**：\n> 拆解：首帧=站立 → 尾帧=三步外收势 → 运动段写\"借右腿蹬地起身前冲三步（惯性），衣摆向后翻涌（气流），末步落地屈膝缓冲尘土轻扬（重力），随即立定收剑\"；运镜\"`跟随`匀速\"匹配中差；物理三因果齐——违和感归零。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **首尾帧差异过大（全景→特写）**：超出\"过渡可插值\"范围——放弃尾帧，改\"首帧 I2V+剪辑切镜\"；或回 IMG-02 重出\"同机位推进版尾帧\"。\n2. **运镜不执行（画面只做动作没推近）**：三步排查——①幅度与差异错配？②动态层缺\"运镜理由\"（加光斑移动/景深变化）？③锚点间隔 <3s？——逐项修后重试，仍不执行则该运镜降为固定+剪辑关键帧模拟（R8）。\n3. **续写长镜（尾帧接力）**：可灵首尾帧与接力天然契合——上镜生成视频截尾帧修复后作下镜首帧，尾帧另拍\"下一顶点\"；链 ≤2 段，第 3 段重锚全量首帧。\n4. **对白镜头（模式需求）**：可灵对白弱——A 级对白镜改模式B（无声+闭嘴基底+后期对口型）；确需原生对白转即梦/H3（选型联动 VID-02）。\n5. **群体场景物理（人群后倾）**：群体动作写\"整体趋势\"不写个体——`台下人群剪影整体后倾半步` 可执行；`第三排左侧那个人后退` 必崩（个体级控制超出能力）。\n6. **高性能档废片率高**：降回标准档重跑；高性能档只用于 A 级预览迭代，S 级成片禁用（复盘归档经验）。"},{"p":"skills/05_platform_plugins/plat_minimax_h3.md","t":"MiniMax 海螺 H3 平台插件（PLAT-04）· 工业级完整版","d":"WHAT：MiniMax 海螺 H3 专属插件——原生方括号运镜指令全表（[推近]/[拉远]/[左移]/[右移]/[上摇]/[下摇]/[环绕]/[固定]及其分镜组合用法）、细腻微表情递进描写公式、32kHz原生音频声音设计与物理动态优势。WHEN：用户指定 MiniMax/海螺 H3 生成视频，或镜头以微表情情感戏、原生对白音频、运镜指令直执行为核心诉求时触发。","raw":"# MiniMax 海螺 H3 平台插件（PLAT-04）· 工业级完整版\n\n## 一、核心职责与工业级法则（6 条硬核铁律）\n\n1. **方括号单指令铁律**：运镜用 H3 原生方括号指令（`[推近]` `[拉远]` `[左移]` `[右移]` `[上摇]` `[下摇]` `[环绕]` `[固定]`，`[推进]` 为同义写法）——**一个时间段只挂一个指令**；组合运镜靠\"分段换指令\"实现，同段叠两个方括号=执行混乱。\n2. **微表情链优先铁律**：H3 的第一生产力是细腻微表情——凡近景/特写，主动作位让给\"微表情递进链\"（4.2 公式），大幅肢体动作反是其弱区（让给可灵）。\n3. **声音设计栏铁律**：H3 原生预测 32kHz 立体声（对白/音效/音乐同出）——模式A镜头必须在 Prompt 末尾显式写\"环境音：…；对白：…；音效：…\"声音设计栏，不写=浪费原生音频能力且音轨随机。\n4. **参考保留行铁律**：挂参考图必写保留行——`参考图1：@资产面部特写（保持@资产面部与参考一致）`；多人多位参考时逐位声明；眨眼规范随行（`眨眼频率自然，约三秒一次轻微眨眼`，防崩坏15）。\n5. **物理克制铁律**：H3 物理动态优势体现在\"轻物理\"（发丝惯性、衣料轻摆、水汽流动、光斑游移）；重物理（高速碰撞/坠落/流体泼溅）弱区——需求出现拆镜降速或转可灵。\n6. **20/80 不豁免铁律**：H3 语法花活不改变差分编译本质——锚点 ≤2 词、单主动作、秒级节点、口型锁（多人）照常；方括号只替换\"运镜层\"的表达形式。\n\n## 二、标准执行 SOP（Step-by-Step）\n\n**Step 1 · 读入**：VID-01 差分稿 + 分镜行 + 微表情链（分镜备注或 KB_02 五节词典选取）。\n\n**Step 2 · 运镜映射**：按 4.1 映射表把公用运镜词换成方括号指令+幅度副词（`[推近]缓慢`）；组合运镜拆时间段（`[00-02s][固定]…；[02-05s][推近]…`）。\n\n**Step 3 · 微表情落链**：按 4.2 公式把微表情链落进对应秒级节点（每节点一个\"表情相\"）。\n\n**Step 4 · 参考与保留**：列参考图位（面部特写优先）+ 保留行 + 眨眼规范。\n\n**Step 5 · 声音设计栏**（模式A）：环境音+对白（语气/语速）+点状音效三行写全；模式B 省略对白行并写闭嘴基底。\n\n**Step 6 · 盯片交付**：盯片点（眨眼自然/口型对齐/身份第 5 秒仍稳）+ 抽卡建议；R7 ≥9.0 交付。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约\n\n| 字段 | 类型 | 必填 | 示例 |\n|---|---|---|---|\n| VID-01 差分稿 | text | 是 | 公用版 |\n| 微表情链 | list | 近景必填 | 弯眼含笑→眼神先亮后垂→睫毛轻颤 |\n| 台词模式 | A/B | 是 | A |\n| 参考图清单 | list | 是 | @李梅面部特写 |\n\n### 输出契约（下游：用户 H3 跑片 / R7 / R8）\n\n```yaml\nH3版Prompt: \"```prompt [固定]近景过肩，参考图1：@李梅面部特写（保持@李梅面部与参考一致），眨眼频率自然约三秒一次轻微眨眼。[00-00.4s]她垂眸含笑，右手五指并拢抬入画抚向画外孩子头顶；[00.4-03.6s]…眼神先亮起随即轻轻垂下，睫毛轻颤一次…；[03.6-04s]抚头的手轻拍一下收势。肩前@张三后脑静止虚化、双唇闭合倾听。环境音：黄昏街道市井嘈杂低鸣；对白：温软女声与轻微衣料摩擦声同步；@画风锁+暖金橙主调黄昏柔焦光晕，16:9```\"\n运镜映射: {\"固定镜头微幅\"→\"[固定]\", \"缓慢推近\"→\"[推近]缓慢\", \"镜头上摇\"→\"[上摇]\"}\n微表情核对: \"三相连环✓(基准→触发→过渡→定格四步齐全)\"\n参考保留行: \"✓ 双位声明（面部+立绘截肩）\"\n盯片建议: \"抽3次盯：①眨眼自然非抽搐 ②'等爸爸'眼神转变清晰 ③第4秒脸未漂\"\n```\n\n## 四、专项工具箱\n\n### 4.1 方括号运镜指令全表与组合用法\n\n| 指令 | 公用词映射 | 幅度副词 | 典型用途 |\n|---|---|---|---|\n| `[推近]`（同义 `[推进]`） | 镜头缓慢推近 | 缓慢/匀速 | 聚焦情绪、压场逼近 |\n| `[拉远]` | 镜头缓缓拉远 | 缓缓 | 孤独揭示、退场余韵 |\n| `[左移]` / `[右移]` | 镜头左摇/右摇、横移 | 平稳 | 展示空间、跟移 |\n| `[上摇]` | 镜头仰角上抬 | 缓缓 | 揭示高度（脚→脸） |\n| `[下摇]` | 镜头俯角下压 | 缓缓 | 揭示细节（脸→手） |\n| `[环绕]` | 镜头环绕主体 | 缓慢 | 高光时刻（≤180°） |\n| `[固定]` | 固定镜头 | —— | 对白/微表情戏首选 |\n\n**组合用法（分段换指令，禁同段叠加）**：\n```text\n[00-02s][固定]面部特写微表情铺垫；[02-04s][推近]缓慢，情绪聚焦；[04-05s][拉远]缓缓，环境余韵收势。\n（一条 5 秒镜最多 2 次换指令；每次换指令必须落在秒级节点边界上）\n```\n\n### 4.2 细腻微表情递进描写公式\n\n```text\n微表情链 = [基准相]（0.5~1s，静止情绪底色：垂眸含笑）\n         + [触发相]（台词/事件点，1~2s，第一反应：眼神先亮起）\n         + [过渡相]（0.5~1s，情绪转折：随即轻轻垂下、睫毛轻颤一次）\n         + [定格相]（收势，嘴角笑意未消微微收拢）\n词源：KB_02 五节微表情词典（喜怒哀惧冷笑惊七链）\n规则：每秒级节点一个\"相\"；触发相对齐台词重音秒位（NARR-03）；禁写心理词（\"她很感动\"→写成四相）。\n```\n\n### 4.3 物理动态优势词库（H3 强区：轻物理）\n\n| 类别 | 推荐描述词（H3 表现稳定） | 弱区（改可灵） |\n|---|---|---|\n| 毛发 | 发丝随呼吸轻颤、碎发被微风拂起、马尾惯性轻摆 | 高速甩发 |\n| 衣料 | 衣摆轻扬、袖口随抬手垂坠、裙摆涟漪 | 大风狂舞 |\n| 光影 | 光斑在脸上游移、烛光摇曳映瞳 | 强光爆闪 |\n| 水汽 | 白雾缓缓升腾漫过、热气氤氲 | 泼水飞溅 |\n| 眼部 | 眨眼频率自然约三秒一次、瞳孔微缩 | —— |\n\n### 4.4 声音设计栏模板（模式A）\n\n```text\n环境音：黄昏街道市井嘈杂低鸣（持续铺底）；\n对白：温软女声（4.5字/秒，\"等爸爸\"前轻换气），与轻微衣料摩擦声同步；\n音效：抚头轻拍声卡 3.8s（点状）。\n```\n\n## 五、常见错误示范 vs 满分工业级示范\n\n### 对比组 1：运镜指令使用\n\n❌ **Bad Case**：\n> [推近][环绕][拉远] 镜头不断运动，@李梅深情地看着孩子，表情非常丰富感人，说了很多心里话，画面十分唯美动人。\n\n**扣分点**：三个指令同段叠加（铁律1，执行混乱）；\"深情/丰富感人/很多心里话/唯美\"全是不可生成词；无秒级节点无声音栏无保留行——H3 三大强项全废。\n\n✅ **Good Case**：\n> `[固定]近景过肩，参考图1：@李梅面部特写（保持@李梅面部与参考一致），眨眼频率自然约三秒一次轻微眨眼。[00-00.4s]垂眸含笑抬手抚向画外头顶；[00.4-03.6s]开口说台词（引号+语气+排他锁）…四相微表情链落节点；[03.6-04s]轻拍收势。环境音/对白/音效三行声音栏。`——9.4 分放行（见输出契约全文）。\n\n### 对比组 2：微表情 vs 心理描写\n\n❌ **Bad Case**：\n> @林烬内心翻江倒海，想起了母亲的死，悲愤交加，情绪复杂到了极点，眼眶渐渐湿润，最后化作坚定。\n\n**扣分点**：\"内心/想起/悲愤交加/复杂到极点\"全是心理词（模型无法生成）；\"渐渐/最后\"无秒锚；无四相结构。\n\n✅ **Good Case**：\n> `[推近]缓慢，参考图：@林烬面部特写（保持一致），眨眼自然。[00-01s]基准相：眼神静水深流直视前方；[01-02.5s]触发相：眉骨骤然紧锁，瞳孔微缩，下颌绷紧；[02.5-04s]过渡相：眼眶泛起泪光盈盈但未落，喉结滚动一次；[04-05s]定格相：泪意收回，眼神转为狠戾，嘴角紧抿。环境音：风声低鸣；音效：剑鸣轻颤卡 4s。`——四相俱全、秒锚清晰、心理全部外化。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **指令不执行（画面静止没推近）**：幅度副词与内容矛盾所致——`[推近]` 配\"静立\"内容会失效；改写动态层（衣摆扬起/光斑移动）给运镜\"理由\"，或换 `[推近]缓慢`。\n2. **多人镜头**：H3 参考位多时易串——保主互动双位（面部特写×2）+分区句式+口型锁；第三人虚化或画外声。\n3. **长时漂移（8~10s 条）**：H3 长条中段脸漂风险——第 5 秒左右 Prompt 重锚 `保持@资产面部与参考一致`；仍漂拆两条 5s。\n4. **模式B 需求**：H3 原生音频是其价值——模式B 建议 Wan；坚持 H3 则声音栏删除、加闭嘴基底句，并在复盘记录\"放弃原生音频\"。\n5. **指令与竖屏**：`[左移]/[右移]` 在 9:16 中位移感被压缩——竖屏改 `[推近]/[拉远]/[上摇]/[下摇]` 纵向族。\n6. **音频过载（对白+音乐+音效糊）**：声音栏降密——对白镜只写\"环境音+对白\"两行，音乐交 R8 后期铺（-20dB 轨）。"}]},{"g":"⚖️ 评分·配音·剪辑·自进化","items":[{"p":"skills/06_audio_edit_qc_skills/skill_jianying_edit_sound_master.md","t":"剪映剪辑调音技能（EDT-01）· 工业级完整版","d":"WHAT：剪映专业版(CapCut)剪辑调音技能——真实存在的曲线变速/转场/出入场动画/调色特效名词库、J-Cut与L-Cut声画错位手法详解、人声+BGM卡点+Foley+环境底噪四轨混音SOP(含dB值)。WHEN：每条视频提示词下方的单镜剪辑建议、整集末尾剪辑总指南、用户问'怎么剪/怎么卡点/加什么音效'时触发。","raw":"# 剪映剪辑调音技能（EDT-01）· 工业级完整版\n\n## 一、核心职责与工业级法则（6 条硬核铁律）\n\n1. **真实菜单铁律**：只准使用 KB_12 收录的剪映专业版真实功能名——曲线变速 6 预设（`蒙太奇/英雄时刻/子弹时间/跳接/闪进/闪出`）、转场（`叠化/闪黑/闪白/推进/拉远/左移/右移/旋转/模糊/漏光/故障/燃烧`）、音频（`人声美化/智能降噪/声音克隆/变声/音频卡点`）——**严禁编造**\"时光倒流转场/梦幻星轨\"等不存在的效果名。\n2. **卡点秒位铁律**：任何变速/音效/转场建议必须给到秒位（\"「英雄时刻」上在取剑顶点帧 3.5s 处\"）——无秒位的建议是给剪辑师的谜语；秒位来源=NARR-03 重音锚+分镜秒级节点。\n3. **声画错位遮瑕铁律**：每 2~3 主镜的 Cutaway 缓冲镜必须配 J-Cut/L-Cut 落点（\"镜2 尾音'莽莽~'延入镜3 前 0.5s\"）——Cutaway 是素材，声画错位才是缝合线；两者配套交付。\n4. **四轨dB铁律**：混音固定四轨分层——人声轨 -6dB ＞ Foley 动作音效轨 -12dB ＞ BGM 情绪卡点轨 -18~-20dB ＞ 环境音底噪轨 -24dB；对白段 BGM 手动压低 30%（等效侧链）；导出前整轨响度统一校验。\n5. **变速不保调铁律**：剪映常规变速勾选\"变调\"会破音高——曲线变速默认保调；需要\"慢放压嗓\"效果时才开变调并在备注声明。\n6. **模式B闭环铁律**：TTS 人声导入后必须走完\"智能降噪→人声美化→对口型→±2 帧微调\"四步——少一步就是\"贴脸念稿\"。\n\n## 二、标准执行 SOP（Step-by-Step）\n\n**Step 1 · 读入**：分镜行（等级/秒级节点/Cutaway 标记）+ NARR-03 重音秒位 + 台词音频清单 + 情绪波形。\n\n**Step 2 · 单镜变速定档**：按 `KB_12` 4.1 曲线变速预设表（唯一权威源）选曲线变速（爆点镜=英雄时刻/子弹时间；卡点快剪=跳接；无缝出入=闪进/闪出；常规=不变速 1.0~1.2x）；标注入点秒位。\n\n**Step 3 · 动画转场**：按 4.2 表选出入场动画与转场名（同场次同转场族）；叠化统一 0.2~0.3s。\n\n**Step 4 · J/L-Cut 落位**：为 Cutaway 镜标注错位切入秒点（J-Cut 声先入 0.3s / L-Cut 声延出 0.5s）。\n\n**Step 5 · 音频配置**：Foley 搜索词+卡点秒；BGM 情绪铺排（按波形表）；环境底噪铺底 dB；人声指导（引用音色卡参数）。\n\n**Step 6 · 整集汇总**：集末输出整集指南（节奏曲线/粗精剪 SOP/四轨混音/对口型流程/竖屏字幕安全区）。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约\n\n| 字段 | 类型 | 必填 | 示例 |\n|---|---|---|---|\n| 分镜行 | 14字段 | 是 | 镜1（S级/5s/3.5s顶点帧） |\n| 重音秒位 | list | 有台词必填 | \"吃@2.2s\" |\n| 台词音频 | list | 模式B必填 | 集数_镜号_音色ID |\n\n### 输出契约（下游：剪辑师执行 / 产出文档）\n\n```yaml\n单镜剪辑建议:\n  变速: \"曲线变速「英雄时刻」上在取剑顶点帧3.5s\"\n  动画转场: \"出场无动画；与下一镜转场「闪白」0.2s\"\n  JLCut: \"无Cutaway（本镜为被缓冲主镜）\"\n人声指导: \"无台词；@林烬音色备用\"\n音效配置: \"「雷声低鸣」铺底-24dB｜「剑鸣出鞘」卡2.8s -18dB｜「风声呼啸」3~5s渐强至-18dB后速收\"\nBGM: \"低频弦乐渐强；5s「闪白」处骤停0.3s接暖钢琴\"\n```\n\n## 四、专项工具箱\n\n### 4.1 曲线变速预设 · 调用指针（表存于 KB_12）\n\n> 去重铁律：6 种真实预设（`蒙太奇/英雄时刻/子弹时间/跳接/闪进/闪出`）的节奏效果、短剧用途与入点规则，以 `KB_12` 4.1 节为唯一权威源——定档时现查现用；本技能铁律 1（真实菜单名）与铁律 2（卡点秒位）不变。\n\n### 4.2 转场/动画/调色/特效真实名词库\n\n| 类别 | 真实名（KB_12 核实） | 用法要点 |\n|---|---|---|\n| 转场-基础 | `叠化`（0.2~0.3s）`闪黑` `闪白` | 时空切换/爆点收束 |\n| 转场-运镜 | `推进` `拉远` `左移` `右移` `旋转` `模糊` | 模拟机位运动 |\n| 转场-氛围MG | `漏光`（氛围/光效类）`故障`（转场-特效搜\"故障\"）`燃烧` | 风格化段落 |\n| 出入场动画 | `渐显/渐隐`、`放大/缩小入场`、`向左上/右上飞入`、`弹入`、`旋入` | 出入点轻修饰（勿滥用） |\n| 调色 | 「调节」面板：亮度/对比度/饱和度/色温/色调/HSL；「LUT」导入；滤镜库按类目筛选 | 双线剧分线 LUT：冷青蓝/暖金橙+接缝 0.3s 交叉 |\n| 特效 | 特效面板「氛围」类（漏光/光斑类）、「MG」「复古胶片」类；搜索关键词：漏光/光斑/金粉 | Cutaway 静态镜叠粒子光斑，不透明度 ≤40% |\n| 音频处理 | `人声美化` `智能降噪` `变声` `音频卡点` | 人声三件套+节拍标记 |\n| 功能 | `智能补帧` `关键帧` `画中画` `蒙版` `色度抠图` `文本朗读` `美颜美体` | B级动效/合成/字幕 |\n\n### 4.3 J-Cut / L-Cut 声画错位详解\n\n```text\nJ-Cut（声先画后）：下一镜的音频提前 0.3s 入（听觉先导引）——用于\"听其声先到再见面\"；\n  剪映操作：下一镜音频块左移拖出画面块前缘，J 型错位。\nL-Cut（画先声后/声延画外）：上一镜的台词尾音延入下一镜画面 0.5s（对话余韵）；\n  剪映操作：上一镜音频右缘拉长覆盖在下一镜画面上方，L 型错位。\n遮瑕标准用法：Cutaway 缓冲镜（白雾/道具特写1.5s）覆盖主轨，主镜尾音 L-Cut 延入——\n  观众耳朵在主镜、眼睛在缓冲镜，主镜局部崩坏帧被视觉跳过。\n```\n\n### 4.4 四轨混音 SOP · 调用指针（表存于 KB_12）\n\n> 去重铁律：四轨 dB 明细与操作要点以 `KB_12` 第六节「四轨混音 dB 表」为唯一权威源。**主值速记**：人声 -6dB ＞ Foley -12dB ＞ BGM -18~-20dB（对白段压低 30%）＞ 环境底噪 -24dB；导出前校验（不失真/人声抽检/竖屏字幕安全区）同查 KB_12 六节。\n\n## 五、常见错误示范 vs 满分工业级示范\n\n### 对比组 1：单镜剪辑建议\n\n❌ **Bad Case**：\n> 这个镜头剪的时候节奏拉满，配合燃爆的bgm，加个帅气的转场和慢动作，音效随便配点打铁声就行。\n\n**扣分点**：编造/模糊效果名（\"帅气的转场\"不是剪映菜单名，违反铁律1）；无秒位（\"剪的时候\"=何时？）；\"随便配点\"无搜索词无 dB——剪辑师无法执行。\n\n✅ **Good Case**：见\"输出契约\"——`「英雄时刻」@3.5s 顶点帧｜「闪白」0.2s 转下镜｜「剑鸣出鞘」卡 2.8s -18dB｜「风声呼啸」3~5s 渐强-18dB｜BGM 低频弦乐 5s 骤停 0.3s 接暖钢琴`——每个名词真实存在、每个动作有秒位有 dB。\n\n### 对比组 2：混音与对口型\n\n❌ **Bad Case**：\n> 配音直接拖进剪映和视频叠一起，BGM 音量开到和台词差不多响，这样气氛足；口型对不上就多看几遍习惯一下。\n\n**扣分点**：BGM 与人声同级（人声被吞，铁律4）；未走降噪美化三件套；\"习惯一下\"违反模式B闭环铁律——口型不同步是崩坏16 的成片形态。\n\n✅ **Good Case**：\n> 人声 -6dB（智能降噪→人声美化）｜BGM -20dB 且台词段压低 30%｜Foley -12dB 卡重音｜环境 -24dB 铺底；对口型：LatentSync/剪映对口型→逐句 ±2 帧微调至音节与抚头动作节拍吻合——四轨分层+闭环微调。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **竖屏 9:16 集**：字幕底部 15% 安全区；构图下沿关键信息上移；「旋转/左移/右移」转场在竖屏观感放大，慎用（改用叠化族）。\n2. **变速后音频变调**：曲线变速默认保调；误开变调致压嗓——关闭变调或重挂该段音频。\n3. **BGM 版权**：剪映音乐库商用曲与个人曲授权不同——发布前核对授权范围；自制剧建议使用可商用分类并留存曲目名记录。\n4. **Cutaway 缺素材（缓冲镜未拍）**：从主镜废片中抽\"手部/白雾\"局部放大做替补（0.5x~2x 放大裁切）；无可用素材则用「漏光」特效+黑场 0.5s 过渡替代遮瑕。\n5. **口型反复对不齐（±5 帧以上漂移）**：音频整体变速 5%（NARR-03 重算备案）或该句重出模式A版本——复盘归档\"该平台模式B基底合格率\"给 EVO-01。\n6. **整集只有环境无台词（空镜集）**：四轨退化三轨（T1 空置）；BGM 升 -16dB 主导；环境轨分\"近场/远景\"两条增强纵深。"},{"p":"skills/06_audio_edit_qc_skills/skill_qc_prompt_scorer_10pt.md","t":"十分制评分官（QC-01 · 质量门禁）· 工业级完整版","d":"WHAT：【质量门禁】10分制提示词评分官——生图与视频双硬性扣分表（各10项明细）、<9.0标准《打回重写指令单》与初稿7.5分被打回修改至9.5分的完整实战演示。WHEN：R5/R6每产出一条提示词后无条件触发；用户要求'评分/质检/为什么打回'时触发。","raw":"# 十分制评分官（QC-01 · 质量门禁）· 工业级完整版\n\n## 一、核心职责与工业级法则（6 条硬核铁律）\n\n1. **每条必检铁律**：框架产出的**每一个单独的提示词**（资产图/前置资源图/分镜视频）独立送检——不搞整集平均分、不搞\"这批一起过\"；一镜不合格即该镜打回，同批其余照常。\n2. **一票否决铁律**：否决级项任一触发，无论其余项多优秀，得分强制 ≤8.9 并出具打回单——否决项对应 KB_09 崩坏编号（串色/乱张嘴/镜内切机位/口型无锁等），是实测废片率最高的四类。\n3. **证据可审计铁律**：每个 ✓/✗ 必须引用 Prompt 原文片段作证据（\"V5 ✓——原文'一旁的@李梅保持双唇闭合'\"）；无证据的分数无效，评分明细随 Prompt 写入产出文档接受复核。\n4. **指令可执行铁律**：打回单的每条修改指令必须\"可直接改写\"——给出具体句式（\"在 [0.8-3秒] 节点后追加……\"），禁止\"再优化一下/加强一致性\"这类空话。\n5. **三轮上限铁律**：同一 Prompt 打回 ≤3 轮；第 3 轮仍 <9.0 → 标注\"人工裁决\"上报用户并记录在案（问题归档给 EVO-01）。\n6. **免检豁免铁律**：B 级降本镜头的\"无视频 Prompt\"（纯静态图+剪映动效方案）免视频表——按降本方案完整性评分（三件套齐=高分）；但其静态图 Prompt 本身仍走生图表全检。\n\n## 二、标准执行 SOP（Step-by-Step）\n\n**Step 1 · 定表**：Prompt 类型 → 生图走 `KB_10` 生图表（G1~G12），视频走 `KB_10` 视频表（V1~V12）；B 级降本镜走豁免规则（铁律 6）。\n\n**Step 2 · 逐项核验**：按 KB_10 双表逐项打 ✓/✗ 并摘录原文证据；否决项标红。核查 G1/V1 时对照《资产注册表》，核查崩坏词时对照 `KB_09` 第一节崩坏大表（`全局复盘避坑黑名单.md` 仅核查新增实战崩坏时按需加载）。\n\n**Step 3 · 计分**：`得分 = 10 − Σ扣分`（下限 0，保留一位小数）；任一否决项触发 → 得分强制 ≤8.9。\n\n**Step 4 · 裁决**：≥9.0 放行（输出明细+使用建议）；<9.0 打回（出具《打回重写指令单》）。\n\n**Step 5 · 归档**：评分明细+轮次写入产出文档；第 3 轮失败升级人工裁决并抄送 EVO-01。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约\n\n| 字段 | 类型 | 必填 | 说明 |\n|---|---|---|---|\n| 被评 Prompt | 代码块 | 是 | ```prompt 封装 |\n| Prompt 类型 | enum | 是 | 生图 / 生视频 |\n| 分镜上下文 | 结构化 | 视频必填 | 等级/台词/资产数 |\n| 打回轮次 | int | 是 | 1~3 |\n\n### 输出契约（下游：R5/R6 重写 / 产出文档 / EVO-01）\n\n```yaml\n得分: 9.4\n逐项明细: [\"G1 ✓ @李梅@张三均注册在册\", \"G4 ✓ Albedo平光词组逐字在（'360度环形无影棚拍柔光…'）\", \"G7 ✓ 分区句式带身高差（'左侧三分之一…一米六五'）\", …]\n否决记录: []\n门禁结论: \"放行\"\n使用建议: \"IP-Adapter 0.6/0.6 双锁；抽卡3次取双脸同真；白雾糊则Inpainting修\"\n```\n\n## 四、专项工具箱\n\n### 4.1 扣分表唯一权威引用（G1~G12 / V1~V12 · 不维护并行表）\n\n生图扣分表 **G1~G12** 与视频扣分表 **V1~V12** 以 `kb_library/KB_10_资产与视频质量检查.md` 为**唯一权威来源**，本技能直接引用其编号、分值与扣分判定标准，**严禁在任何 Skill 内另行抄写合并版**（防编号错位与分值漂移——本节曾存在的 10 项合并版已因此废弃）。\n\n- **计分**：`得分 = 10 − Σ扣分`（下限 0，保留一位小数）；任一◆否决项触发 → 强制 ≤8.9 判打回。\n- **否决项速记**（编号语义以 KB_10 为准）：生图 **G1 / G4 / G7 / G8**｜视频 **V1 / V2 / V3 / V5 / V6 / V8 / V10**。\n- **多项否决并发取重规则**：多个◆项同时触发时，扣分只计最重一项（保得分可读），其余触发项以\"证据+修改指令\"形式列入打回单——**修改义务不减免**。\n- 分档扣分细则（如 G3\"每缺一项扣 0.25\"）与全部判定标准，逐条以 KB_10 表内原文为准；评分输出中的条款编号一律使用全序号（G1~G12 / V1~V12）。\n\n### 4.3 《打回重写指令单》标准格式\n\n```markdown\n## 🔴 打回重写指令单（第 N 轮）\n- **被评对象**：[镜号/Prompt编号] · [生图/生视频] · 目标平台[…]\n- **初稿得分**：X.X / 10（触发否决项：[编号+崩坏号]）\n- **扣分明细**：\n  1. [V5 ◆ −1.5] 证据：\"（引用初稿原文）\"——问题：多人台词无倾听者闭嘴锁（崩坏05）\n  2. [V2 ◆ −1.5] 证据：\"（原文 40 字外貌）\"——问题：外貌超锚点配额（分值以 KB_10 为准）\n- **修改指令（逐条可直接执行）**：\n  1. 在 [0.8-3秒] 台词节点后原样追加句式：\"一旁的@李梅保持双唇闭合、面带微笑低头倾听，不发一言\"\n  2. 将主体段删改为\"米白开衫母亲@李梅与天蓝卫衣孩童@张三\"（保留 ≤2 词/人），其余外貌信息移入首帧图职责\n  3. （…）\n- **复审入口**：按上修改后重新送检；预计通过线 ≥9.0\n- **抄送**：产出文档评分栏（留痕）｜若为第3轮 → 升级人工裁决\n```\n\n## 五、实战演示：初稿 7.5 分被打回 → 修改后 9.5 分（完整过程）\n\n**❌ Bad Case【初稿】**（镜2 · 例子1 镜头1 · 视频类 · 第 1 轮送检）：\n```prompt\n@李梅（鹅蛋脸柳叶眉温润杏眼、栗色齐肩微卷发别素色发夹、米白罗纹针织开衫配浅杏连衣裙、斜挎帆布托特包）牵着@张三（娃娃脸婴儿肥大圆眼长睫毛黑色短碎发呆毛、天蓝小熊耳连帽卫衣）走在黄昏的街上，孩子跟妈妈说想吃东西，妈妈温柔地回应他，镜头先是全景然后慢慢推近最后切到孩子特写，两人有说有笑，大概五秒钟，画面温馨，@画风锁+暖金橙主调\n```\n\n**【第 1 轮评分：7.5 / 10 · 打回】**（编号按 KB_10 V1~V12）\n- V1 ✓（资产在册）\n- **V2 ◆ −1.5（取重计分项）**：证据\"（鹅蛋脸柳叶眉…帆布托特包）+（娃娃脸婴儿肥…连帽卫衣）\"——外貌 50+ 字堆砌，超 ≤2 词锚点配额\n- **V4 −0.5**：无秒级节点、\"大概五秒钟\"非 0.5s 网格（台词时长测算缺失与本题同源，从重并计不叠加）\n- **V12 −0.5**：缺画幅与秒数标注 → Σ=2.5 → **7.5**（已处否决线内）\n- 取重留档（不计分、修改义务不减）：**V3 ◆** 证据\"先是全景然后慢慢推近最后切到孩子特写\"=单镜三机位（崩坏04）｜**V5 ◆** 证据\"孩子跟妈妈说想吃东西，妈妈温柔地回应\"=双主体台词、无台词文本、无口型排他锁（崩坏05/16 双高危）｜V9 \"先推近再切特写\"复合运镜证据并入 V3 修改项\n\n**【打回重写指令单（第 1 轮）】**：\n1. 主体段压缩为\"米白开衫母亲@李梅与天蓝卫衣孩童@张三\"（各 1 词）；全部外貌移入首帧基准图职责（IMG-02）。\n2. 删除\"最后切到孩子特写\"——单镜单机位\"远景缓慢推近\"。\n3. 台词落 NARR-03 精算：张三台词\"妈妈，我要吃莽莽\"（8字/4字每秒≈2.2s+铺垫0.8s=3s）；李梅改\"双唇闭合含笑倾听\"（本镜单台词主体）。\n4. 补秒级节点 `[0-0.8秒]`/`[0.8-3秒]`；补画幅与秒数标注。\n5. 补空间分区句式（左1/3 母·一米六五 / 右2/3 子·一米一）。\n\n**✅ Good Case【修改稿】**（第 2 轮送检）：\n```prompt\n米白开衫母亲@李梅与天蓝卫衣孩童@张三行于@光大街边：画面左侧三分之一为成年女性@李梅（身高约一米六五），右侧三分之二为孩童@张三（身高约一米一），两人牵手间距一臂；[00-00.8s]远景镜头缓慢推近，母子缓步前行，@张三仰头拽动母亲衣角，梧桐树影斑驳、馄饨摊白雾轻晃；[00.8-03.0s]@张三抬头张嘴说话，嘴唇随台词自然开合：\"妈妈，我要吃莽莽\"（奶声奶气，尾音拖长，渴望语气）；一旁的@李梅保持双唇闭合、嘴角含笑低头倾听，不发一言，@画风锁+暖金橙主调黄昏柔焦光晕，16:9，3秒\n```\n\n**【第 2 轮评分：9.5 / 10 · 放行】**（V1~V12 逐项，编号同 KB_10）：\n- V1 ✓ ｜ V2 ✓ 锚点 1+1 词 ｜ V3 ✓ 单主动作（说话）+铺垫微动作 ｜ V4 ✓ 双节点 0.5s 网格 ｜ V5 ✓ 双锁齐（张嘴者+闭嘴者）｜ V6 ✓ 模式A声明（语气标注）｜ V7 ✓ 测算在册（8 字÷4 字/秒+铺垫 0.8s=3s）｜ V8 ✓ 分区+身高差 ｜ V9 ✓ 单运镜\"缓慢推近\" ｜ V10 ✓ 无崩坏词 ｜ V11 ✓ 锁+缀挂载 ｜ V12 ✓ 画幅+秒数标注\n- 扣分 −0.5（审慎扣减）：\"拽衣角+树影斑驳+白雾轻晃\"三动态并列，虽属微动作/环境层允许范围，预留 0.5 分人工复核空间 → **9.5**\n- **使用建议**：即梦素材位 3 位（双立绘+空镜）；抽卡 3 次取\"双脸同真+李梅全程闭嘴\"；尾帧可复用作镜 4 前参考。\n\n## 六、边界情况处理（Edge Cases）\n\n1. **三轮仍 <9.0**：出\"人工裁决单\"（问题清单+三轮演进+建议人工决策点）上报用户；该 Prompt 标记冻结，问题归档 EVO-01（可能暴露 KB 词库缺口）。\n2. **平台专属附加项**：指定平台的 Prompt 追加平台项核验——即梦（素材位清单/一致性行）、ComfyUI（双轨/节点单/负向包）、MiniMax（方括号单指令/声音栏）、可灵（首尾帧声明/幅度匹配）、豆包（三层分句/4K 缀）——缺项各扣 0.3（非否决）。\n3. **修改稿引入新问题**：只盯指令单条目复核+全表快扫——新问题新一轮计分，不因\"改了旧的\"豁免新的。\n4. **同一 Prompt 多平台版本**：每平台版本独立送检独立计分（语法差异不共享分数）。\n5. **用户坚持发布 <9.0 的 Prompt**：产出文档标注\"未过门禁·用户裁决发布\"，复盘占位预填\"重点关注：[否决项]\"——废片后 EVO-01 有据可归因。\n6. **打回单被 R5/R6 部分执行**：复审逐条对账——未执行条目原样重列并轮次+1；连续两轮部分执行升级导演介入。"},{"p":"skills/06_audio_edit_qc_skills/skill_retrospective_optimizer.md","t":"复盘自进化技能（EVO-01 · 自进化引擎）· 工业级完整版","d":"WHAT：复盘自进化引擎——解析产出文档底部「Prompt实际产出复盘」的标准工作流：崩坏关键词提取、缺陷定位(KB词典/平台插件/分镜层)、补丁自动生成并写入全局黑名单与对应Skill文件。WHEN：用户填写了实测复盘、反馈'翻车/崩了/效果不对'，或要求'优化框架/更新黑名单'时触发。","raw":"# 复盘自进化技能（EVO-01 · 自进化引擎）· 工业级完整版\n\n## 一、核心职责与工业级法则（6 条硬核铁律）\n\n1. **非占位即触发铁律**：总控每次任务开始时扫描产出文档中所有 `Prompt 实际产出复盘：` 字段——凡非\"占位\"即激活本技能；用户口头反馈\"翻车了\"同样触发（先补录进复盘字段再走流程）。\n2. **编号归因铁律**：每条复盘必须归因到黑名单 01~17 编号；全部不匹配才立新号（从 18 起，附触发条件+根因假设+待验证标记）——\"归因不了就放着\"是框架腐烂的开始。\n3. **高频升级铁律**：同类崩坏在实战区归档 ≥3 次 → 自动升级为 KB_10 一票否决题 + 通知 QC-01 更新扣分表；\"屡犯不改\"的规则不是规则。\n4. **补丁落盘铁律**：归因必须落到具体文件的具体节区（\"KB_09 二节速查表 07 行\"+\"plat_jimeng 四节幅度建议表\"），修订内容直接写入文件本体并在文件内留 `<!-- EVO 修订 YYYY-MM-DD -->` 注释——只汇报不落盘=没修。\n5. **复测闭环铁律**：每次补丁附复测指令（哪些 Prompt 按新规则重跑、跑几次、看什么指标）——无复测的优化无法验证，黑名单永远是假设。\n6. **禁改产出文档铁律**：复盘流程只修订框架文件（黑名单/KB/Skill），不改用户已实测的 Prompt 原文（那是证据）——修改建议以\"复测指令\"形式另发。\n\n## 二、标准执行 SOP（Step-by-Step · 标准工作流）\n\n**Step 1 · 提取崩坏关键词**：读复盘原文，按 4.1 症状词字典抽取关键现象词（\"嘴都动了/脸变了/腿穿了/糊了/闪了\"），规范化为症状术语（乱张嘴/身份漂移/肢体穿模/模糊/闪烁）。\n\n**Step 2 · 编号映射**：症状术语 → 对照 4.2 映射表命中黑名单编号；一条复盘含多个症状则逐个映射（一因多果也拆开）。\n\n**Step 3 · 缺陷定位**（为何门禁没拦住？）：按 4.3 定位树找漏网环节——①Prompt 是否含触发词（KB_09 词库缺口？）②评分表是否有对应检查项（KB_10 缺项？）③平台专属写法是否诱因（plat_* 正例缺失/参数基线错误？）④分镜层是否先天高危（VIS-01 拆镜不当）——定位到文件+节区。\n\n**Step 4 · 补丁生成**：按 4.4 模板产出修订内容——黑名单实战区归档行、KB_09 速查行、KB_10 扣分项（高频时）、plat_* 正反例/参数修订。\n\n**Step 5 · 落盘写入**：逐文件执行写入（Edit 落盘+修订注释）；确认输出各文件\"已写入\"。\n\n**Step 6 · 复测指令与汇报**：输出复测清单（镜号×次数×盯片指标）+ 向用户汇报优化摘要（改了什么/为什么/下次如何避免）。\n\n## 三、结构化输入/输出契约模板\n\n### 输入契约\n\n| 字段 | 类型 | 必填 | 示例 |\n|---|---|---|---|\n| 复盘原文 | text | 是 | \"镜2跑出来妈妈嘴也在动…\" |\n| Prompt 编号 | text | 是 | 第01集·分镜2·镜头1 |\n| 平台/模型 | text | 是 | 即梦 Seedance 2.0 |\n| 黑名单编号上限 | int | 是 | 17 |\n\n### 输出契约（下游：框架文件落盘 / 用户复测）\n\n```yaml\n关键词提取: [\"嘴也在动→乱张嘴\", \"脸不太像→轻微身份漂移\"]\n归因结论: [{症状: \"乱张嘴\", 编号: \"崩坏05\", 置信度: \"高\"}, {症状: \"身份漂移\", 编号: \"崩坏09\", 置信度: \"中(待复测)\"}]\n缺陷定位: [{文件: \"plat_jimeng.md\", 节: \"4.4幅度建议\", 缺陷: \"未声明'多人长条需中段重锚'\"}, {文件: \"KB_09.md\", 节: \"二节速查05行\", 缺陷: \"修正写法缺即梦素材位版本\"}]\n补丁清单: [{目标: \"全局复盘避坑黑名单.md·实战区\", 内容: \"归档行(见4.4模板)\"}, {目标: \"plat_jimeng.md\", 内容: \"4.4节追加'长条15秒重锚'规则+正例\"}]\n复测指令: [\"镜2按新版重跑2次：盯李梅全程闭嘴\", \"镜4参考图换面部特写重跑1次：盯第4秒脸稳\"]\n档案写入确认: [\"黑名单实战区+1行 ✓\", \"plat_jimeng 4.4 修订 ✓\"]\n```\n\n## 四、专项工具箱\n\n### 4.1 崩坏症状关键词字典（口语 → 术语 → 编号）\n\n| 用户口语（复盘常见） | 规范症状术语 | 映射编号 |\n|---|---|---|\n| 嘴都在动/嘴跟着动/全员说话
