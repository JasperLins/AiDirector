绳、珠钗 |\n| 耳颈(5) | 珍珠耳钉、长流苏耳坠、银锁片、狗牌、项链坠盒(可开合) |\n| 手腕(5) | 红绳手链、旧怀表、护腕、串珠、玉镯 |\n| 腰间(5) | 酒葫芦、香囊、枪套、腰链、玉佩绶 |\n| 眼镜面具(3) | 金丝圆框、半框黑框、只遮半脸面具 |\n| 其他(2) | 围巾(单一色)、耳机挂颈 |\n\n## 四、道具结构词典（10 词条 · 三视图用）\n\n> **道具锁形铁律（R9-20261005 实测固化）**：重要道具 `@引用仅为索引，不锁形状`——Prompt 必须复述关键形态三要素（造型+材质+工艺/尺寸），跨平台垫图时叠加\"垫图类型声明（角色面部参考/构图参考）+ 首句记忆点文字复述\"双保险，防跨平台图生图洗掉微特征。材质矛盾词必须拆解（\"暗金玉质\"→\"蜜黄玉质底+黄金镶边\"）；微光/发光剧情态用强物理句（\"纹路缝隙深处透出细如发丝的暗红辉光，如余烬隐现\"）。\n\n> **全身立绘微距道具尺度分层铁律（R9-20261005-17 · 候补 23 转正；R9-20261005-19 双轨制升级，废止「手背朝向+清晰可辨」妥协写法）**：全身构图中\"戒指级\"微道具（约 3~8 像素）**低于细节渲染阈值**，强行要求展示＝算力过载手部融化（崩坏 01 变种，实测 100% 崩手）——①全身立绘主图**绝对禁止描写**戒指/手串等微距级细小配饰，微细道具一律**强制剥离**，交由独立道具特写资产承担（道具两件套之②特写基准图）；②主图手部处理双轨制（KB_08 一节⑤层）：优先【空手自然态】（`双手空无一物自然下垂，五指自然并拢`），反复穿模才降级【藏拙法】（`双手背于身后`/`插兜`）；③中近景叙事镜（玉戒有戏：摩挲/捻戒/认主）不受此限，由分镜近景镜/特写镜负责呈现；④大道具（背负剑/怀抱食盒等非微距级）不受此限，按道具锁形双保险复述。\n\n| 道具 | 三级结构分解 | 材质索引(KB_04) | 记忆点 |\n|---|---|---|---|\n| @焚天断剑 | 剑身断口参差+火焰纹剑格+绫布缠柄 | 玄铁+铸铜+绫布 | 断而不折(缺口在剑尖下1/3) |\n| 长枪 | 枪杆缠布+红缨+枪尖 | 白蜡杆+精钢 | 缨色随阵营 |\n| 油纸伞 | 16骨+晕染伞面+竹柄挂穗 | 竹+宣纸 | 穗断=信物 |\n| 旧怀表 | 黄铜壳+磨平刻字+停摆指针 | 黄铜做旧 | 停在3:07 |\n| 托特包 | 帆布+内袋+提手斜挎带 | 帆布 | 左下角补丁 |\n| 罗盘 | 铜盘+天池磁针+缠绳 | 黄铜 | 指针逆颤 |\n| 灯笼 | 竹骨+红纸+烛火 | 竹+纸 | 烧角一只 |\n| 手机 | 裂纹屏+旧壳+挂绳 | 玻璃+硅胶 | 裂纹形状固定 |\n| 药箱 | 木质+铜扣+十字标 | 木+铜 | 边角磕痕 |\n| 信封 | 火漆+折角+浸水痕 | 纸 | 火漆家族纹 |\n\n## 五、服装状态派生词库（9 级 · 跨集快照联动）\n\n| 程度 | 词条（部位+程度+左右侧三要素） |\n|---|---|\n| 轻度(3) | 衣角沾尘、袖口微皱、发丝凌乱两缕 |\n| 中度(3) | 左肩衣摆撕裂口、膝盖磨破、发带断裂散发+脸颊一道血痕 |\n| 重度(3) | 左肩衣袍撕裂渗血、半身焦痕、断剑缺口扩大+绫布碳化 |\n\n**规则**：派生资产(`@林烬战损`)登记后才能上镜；战损只增不减，重置须剧本事件。\n\n## 六、穿搭层次组合示例（6 组 · 三层拆解示范）\n\n| 角色 | 基底层 | 中间层 | 点缀层 | 视频防崩备注 |\n|---|---|---|---|---|\n| @李梅 | 浅杏连衣裙 | 米白针织开衫 | 帆布托特包+素色发夹 | 层次3层→奔跑镜禁用 |\n| @林烬 | 玄黑劲装本体 | 皮甲缚带(小臂) | 墨玉扣+背负断剑 | 宽袖镜加\"袖口与手腕分离清晰\" |\n| @张三 | 深灰长裤+T恤 | 天蓝连帽卫衣 | 小熊耳帽+黄雨靴 | 幼儿比例锁定防成人化 |\n| 商务精英 | 白衬衫 | 炭灰西装 | 袖扣+口袋巾 | 三层叠穿→视频降速 |\n| 魔道黑袍 | 暗红衬里中衣 | 墨黑大氅 | 银线符纹锁边 | 大氅+高动作→衣摆分离描述 |\n| 拾荒者 | 土棕内层 | 锈橙拼接斗篷 | 滤罐面罩+绑带 | 多层围裹→静态镜为主 |\n\n## 七、着装防崩八律\n\n**第 9 律·服饰身份律（R9-20261005 实测增补）**：服饰是跨镜人物身份第一判别器（大众脸型下五官区别弱，服装对不上即被判\"换人\"）——①资产级服饰四件套逐字复用禁改；②着装须体现社会地位与人物关系（主仆同色系邻色阶差、情侣互补色搭配、侍女气质低调卑微不抢戏）；③派生装束先登记注册表再使用。\n\n1. 宽袍大袖+大动作必加\"衣袂随动作自然摆动，袖口与手腕分离清晰\"（崩坏08）。\n2. 裙装奔跑改\"裙摆扬起弧度自然\"（崩坏14）。\n3. 连帽衫帽子状态(戴起/未戴)跨镜显式声明。\n4. 层次 ≥3 层的穿搭视频镜头降速。\n5. 围巾/披风类强风镜写\"随风单侧飘起\"防裹缠。\n6. 金属配饰(甲片/徽章)写\"静态缝制贴附，不旋转\"（崩坏18 前置）。\n7. 鞋履特写与全身镜鞋款一致（注册表摘要含鞋）。\n8. 战损派生按五节三要素写，缺侧别=场记打回。"},{"p":"kb_library/KB_04_材质与色彩设计.md","t":"KB_04 材质与色彩设计词典（高密度工业速查版）","d":"","raw":"# KB_04 材质与色彩设计词典（高密度工业速查版）\n\n> 用途：材质质感词与色彩脚本的权威来源。豆包 Seedream 对本典中文光影/材质术语直响应，可直接编译进 Prompt。\n> 词条统计：织物 14 ｜ 金属玉石石木玻 26 ｜ 自然介质 12 ｜ 光影术语 26 ｜ 情绪色板 12 ｜ 60-30-10 方案 10 ｜ 色彩连续性 6 律 —— **合计 100+ 词条**。\n\n---\n\n## 一、织物材质词典（14 词条）\n\n| 材质 | 质感描述词 | 光影表现 | 适用 |\n|---|---|---|---|\n| 真丝 | 垂坠流淌、镜面般柔光 | 高光滑移、珍珠光泽 | 礼服/旗袍 |\n| 香云纱 | 挺括哑光、暗纹起伏 | 低反射、古朴素雅 | 道袍 |\n| 粗麻 | 布面粗粝、纤维肌理可见 | 漫反射、哑光 | 布衣/斗篷 |\n| 针织 | 罗纹起伏、毛绒感 | 柔和漫射、无高光 | 开衫(如@李梅) |\n| 皮革 | 光滑微亮、弯折起细纹 | 局部镜面高光 | 夹克/护具 |\n| 呢料 | 厚实紧密、表面绒毛 | 极哑光、吸光 | 大衣 |\n| 玄铁锦缎 | 缎面暗纹、冷光内蕴 | 定向微反光 | GX-01劲装 |\n| 摇粒绒 | 颗粒绒面、蓬松 | 全漫射 | 童卫衣 |\n| 欧根纱 | 半透轻盈、层叠透色 | 透光发亮 | 女修披帛 |\n| 灯芯绒 | 条绒沟壑、温润 | 侧光条纹高光 | 休闲裤 |\n| 牛仔 | 斜纹粗织、磨白渐变 | 哑光+磨白漫射 | 日常 |\n| 天鹅绒 | 立绒深邃、随角变色 | 边缘轮廓光佳 | 礼服/幕布 |\n| 华夫布 | 蜂窝纹理、透气感 | 微漫射 | 卫衣 |\n| 妆花缎 | 金银线交织、富贵 | 定向闪缎 | 女帝朝服 |\n\n## 二、硬质材质词典（26 词条）\n\n| 类别 | 词条（材质+质感描述） |\n|---|---|\n| 金属-铁器(4) | 玄铁(乌沉无光+锻打纹理)、精钢(寒光凛冽+镜面打磨)、生铁(粗糙铸痕+锈斑)、陨铁(暗纹流转+微蓝光) |\n| 金属-贵金属(4) | 鎏金(温润+斑驳做旧)、白银(冷亮+柔反射)、黄铜(暖哑光+包浆)、白金(冷白+锐利高光) |\n| 玉石(4) | 白玉(温润通透+糯感内光)、翡翠(水头足+翠色分层)、玛瑙(条纹晕染+蜡光)、黑曜石(纯黑+贝壳状断口反光) |\n| 石材(4) | 青石(粗粝多孔+风化痕)、大理石(云纹+抛光镜面)、花岗岩(颗粒致密+哑光)、鹅卵石(圆润+湿反光) |\n| 木质(4) | 老榆木(开裂+包浆)、紫檀(深红致密+缎光)、竹材(节理+清漆微光)、碳化木(黑哑+龟裂) |\n| 其他(6) | 陶瓦(哑光粗糙+釉面剥落)、玻璃(通透折射+边缘冷光)、瓷器(釉面如镜+胎质温润)、混凝土(毛孔+冷灰)、橡胶(哑光弹性质感)、纸(纤维纹理+透光) |\n\n## 三、自然介质词典（12 词条 · 流体从严）\n\n| 类别 | 词条（安全描述写法） |\n|---|---|\n| 水-静态(3) | 水面如镜倒影、雨后湿反光地面、杯中水微漾 |\n| 水-动态(2) | 细雨飘落丝线感、水流倾注拉出弧线(表面张力) |\n| 水汽(3) | 白雾蒸腾自锅沿翻涌、薄雾漫过石板路、氤氲热气模糊轮廓 |\n| 火(2) | 烛火摇曳映瞳、余烬暗红微光(非明焰) |\n| 尘土(2) | 落地尘土轻扬弥散、光柱中浮尘缓浮 |\n\n**流体红线**：瓢泼大雨/海啸/泼溅=崩坏14 高危——降复杂度(细雨/涟漪)或 B 级静态图+剪映粒子层。\n\n## 四、光影术语词典（26 词条 · 豆包直响应核实版）\n\n| 类别 | 词条 | 用途 |\n|---|---|---|\n| 三点基础(3) | 主光、补光、轮廓光(Rim) | 一切布光骨架 |\n| 人像高级(8) | 伦勃朗光(单侧三角)、分割光(左右对分)、环形光/蝴蝶光(鼻下小环)、鳄鱼光(上下夹光)、侧逆光镶金边、顶光压抑、底光惊悚、宽光/窄光(胖瘦控制) | 人像/特写 |\n| 氛围(8) | 丁达尔体积光柱、体积光弥散、逆光剪影、边缘轮廓光、窗格投影、树影斑驳、水面反光粼粼、雾中光晕 | 场景氛围 |\n| 色温(7) | 冷青蓝(压抑/神性)、暖金橙(温情/黄昏)、青橙对撞(电影感)、烛光暖黄、月光冷白、霓虹紫粉、正午白亮 | 全局基调 |\n\n## 五、色彩心理学词库（12 情绪色板）\n\n| 情绪目标 | 主色相 60% | 辅助 30% | 点缀 10% | 适用场景 |\n|---|---|---|---|---|\n| 压迫威严 | 冷青蓝/玄黑 | 灰蓝 | 剑气银白 | 压场/殿宇 |\n| 温情治愈 | 暖金橙/米白 | 浅杏 | 白雾暖黄 | 母子/家 |\n| 复仇危险 | 深红/黑 | 暗金 | 余烬红 | 复仇线 |\n| 纯真童年 | 天蓝/明黄 | 白 | 小熊棕 | 孩童 |\n| 悬疑诡谲 | 墨绿/紫黑 | 冷灰 | 单点暖光 | 夜巷 |\n| 爽感爆发 | 金红 | 白热 | 电光蓝 | 突破/觉醒 |\n| 清冷仙气 | 月白/淡青 | 云灰 | 樱粉 | 仙门 |\n| 热血战场 | 铁灰/火橙 | 焦土棕 | 旗红 | 战争 |\n| 病弱忧郁 | 灰白/淡紫 | 冷蓝 | 枯黄 | 病榻 |\n| 市井烟火 | 暖褐/黄 | 青灰 | 灯笼红 | 街道 |\n| 赛博未来 | 霓虹蓝/紫 | 深灰 | 荧光绿 | 都市场 |\n| 回忆闪回 | 低饱和暖褐 | 褪色米 | 高光留白 | 记忆段 |\n\n## 六、60-30-10 配色公式与 10 套成品方案（可直接编译）\n\n**公式**：`60%主导色(基调)+30%辅助色(层次)+10%点缀色(钩子)`；编译句式：`画面以[色相]为主导（约六成），辅以[色相]（约三成），点缀[元素]（约一成）`。\n\n| # | 场景 | 60% | 30% | 10% | 编译句式成品 |\n|---|---|---|---|---|---|\n| 01 | @玄天宗比武台 | 冷青蓝天光 | 云海灰白+石质灰 | 符文银白高光 | \"冷青蓝主调天光为主导（约六成），辅以云海灰白与石质灰（约三成），符文银白高光点缀（约一成）\" |\n| 02 | @光大街边 | 暖金橙黄昏 | 梧桐绿荫+楼宇灰 | 白雾+暖黄灯串 | \"暖金橙黄昏主导（约六成），梧桐绿荫与楼宇灰（约三成），点缀蒸腾白雾与暖黄灯串（约一成）\" |\n| 03 | 深夜办公室 | 冷白顶灯 | 深灰桌面 | 屏幕蓝光 | 同构句式 |\n| 04 | 仙门晨练 | 月白晨雾 | 淡青山影 | 樱粉花瓣 | 同构句式 |\n| 05 | 地下停车场 | 灰绿顶灯 | 水泥灰 | 车灯红 | 同构句式 |\n| 06 | 婚礼现场 | 象牙白 | 香槟金 | 花门粉 | 同构句式 |\n| 07 | 废墟战场 | 焦土棕 | 铁灰 | 未熄火橙 | 同构句式 |\n| 08 | 病房 | 灰白 | 冷蓝床品 | 窗外枯黄一枝 | 同构句式 |\n| 09 | 霓虹夜市 | 紫粉霓虹 | 深灰雨夜 | 招牌荧光绿 | 同构句式 |\n| 10 | 回忆教室 | 低饱和暖褐 | 褪色米 | 尘埃金光一束 | 同构句式 |\n\n## 七、色彩连续性六律（场记核查项）\n\n1. 同场次色温锁定，正午/黄昏/夜不得中途跳变（烟火线锁黄昏金橙）。\n2. 人物服装主色不得与背景主导色同色相（防\"融化\"）。\n3. 60-30-10 写入分镜总说明，逐镜核对点缀色在场（丢失=画面变脏）。\n4. 首帧参考图生成的色彩脚本文字逐字复用（防色温漂移）。\n5. 双线剧两线色温对撞须声明，切换点 0.3s 交叉过渡（R8 执行）。\n6. 派生时段(夜景/雨天)按\"母场景+时段缀\"命名并单独出色彩方案（如@光大街边夜：靛蓝60+湿反光灰30+灯串暖10）。\n\n## 八、@光位常量规范（R9-20261005 实测固化）\n\n- **定义**：每个场景资产登记一条 ≤25 字光位常量（高浓度短语，严禁散文），该场景所有首帧/分镜 Prompt 末尾一致挂载，与轴线声明同级，场记跨镜核查。\n- **格式**：`[光位锁：时段+方位角度+光质，暗部色彩约束]`，例：`[光位锁：午后西晒，左后方45°冷白主光，暗部青灰无暖光污染]`。\n- **依据**：E01 实测同场景（@沈府偏院）三平台基准图主光方向互相矛盾（左前/右前/左后），未锁光位常量将导致跨镜光影跳变。\n- **与画风锁分工**：@画风锁管色温与风格，@光位常量管**光源方向与光质**——两者都受 25 字预算约束（KB_05 六节）。"},{"p":"kb_library/KB_05_视觉风格词典.md","t":"KB_05 视觉风格词典（高密度工业速查版）","d":"","raw":"# KB_05 视觉风格词典（高密度工业速查版）\n\n> 用途：全剧画风的唯一权威定义处。`@画风锁` 是项目级全局常量，定稿后全剧 Prompt 末尾逐字挂载，杜绝画风漂移；**6 维工业风格预设包（PACK-01~04）是全框架画风路由的唯一中枢单元**（R9-20261005-17 立制）。\n> 词条统计：流派 20 ｜ 渲染引擎 8 ｜ 画质词缀 12 ｜ 镜头感 10 ｜ 负向兜底 10 ｜ 成品画风锁 5 套 ｜ **风格预设包 4 套（各 6 维）** —— **合计 75+ 词条 · 预设包 24 维**。\n\n---\n\n## 一、画风流派词典（20 型 · 每型含核心描述词+渲染特征）\n\n| # | 流派 | 核心描述词（可直接入 Prompt） | 渲染特征 | 适配题材 |\n|---|---|---|---|---|\n| 01 | 电影级写实 | 电影级写实质感、皮肤纹理真实、浅景深 | 摄影光学感 | 都市/悬疑 |\n| 02 | 东方新国风写实厚涂 | 厚涂笔触、水墨晕染边缘、细腻织物纤维 | 手绘+渲染混合 | 玄幻/古风 |\n| 03 | 3D国漫渲染 | 3D卡通渲染、PBR材质、皮克斯式柔光 | 次世代游戏CG | 全龄漫剧 |\n| 04 | 赛璐璐动画 | 赛璐璐平涂上色、硬阴影分面、日式作画 | 二维动画 | 热血番 |\n| 05 | 韩漫厚涂 | 韩式厚涂、柔雾皮肤、高光锐利 | 插画感 | 都市言情 |\n| 06 | 水墨写意 | 留白意境、墨色浓淡五色、飞白笔触 | 国画 | 武侠意境 |\n| 07 | 工笔重彩 | 勾线填色、石青石绿、沥粉贴金 | 传统工笔 | 古装殿堂 |\n| 08 | 蒸汽朋克 | 黄铜齿轮、铆钉管线、维多利亚剪裁 | 做旧金属 | 奇幻冒险 |\n| 09 | 赛博朋克 | 霓虹雨夜、全息广告、高对比冷暖 | 反光湿地面 | 科幻 |\n| 10 | 吉卜力水彩 | 手绘水彩、云朵蓬松、绿意盎然 | 柔边水彩 | 治愈 |\n| 11 | 美漫粗线 | 粗描边、网点纸、肌肉夸张 | 版画感 | 超英 |\n| 12 | 低多边形 | Low Poly几何切面、单色渐变 | 极简 | 概念/片头 |\n| 13 | 黏土定格 | 黏土质感、指纹痕迹、微缩布景 | 定格动画 | 童趣 |\n| 14 | 黑白胶片 | 银盐颗粒、高反差、暗角 | 老电影 | 文艺/回忆 |\n| 15 | 青橙调色 | 青橙对撞、肤色橙保真、阴影青 | 达芬奇调色风 | 电影感通用 |\n| 16 | 港风霓虹 | 霓虹招牌雨、烟雾、复古颗粒 | 王家卫式 | 都市夜 |\n| 17 | 极简矢量 | 扁平矢量、大色块、无渐变 | 平面设计 | 片头/科普 |\n| 18 | 暗黑哥特 | 高对比暗部、烛光、巴洛克纹样 | 油画质感 | 哥特悬疑 |\n| 19 | 皮克斯写实卡通 | 柔光子表面、夸张比例、眼神高光双点 | 高级卡通渲染 | 合家欢 |\n| 20 | 废土写实 | 尘土蒙层、锈蚀做旧、硬日光 | 末世质感 | 末世 |\n\n## 二、渲染引擎感词缀（8 词条）\n\n`虚幻引擎5渲染`、`OC渲染`、`Blender Cycles光线追踪`、`Arnold全局光照`、`Redshift渲染`、`Octane渲染`、`Unity Toon Shader卡通着色`、` Mental Ray 老派CG`（3D 类流派选用其一，2D 流派禁用）。\n\n## 三、画质词缀词典（12 词条）\n\n| 类别 | 词条 |\n|---|---|\n| 分辨率(4) | 8K超高清、4K、2K、超精细细节 |\n| 品质(4) | 大师级构图、获奖短片质感、业界顶级概念设计、博物馆级完成度 |\n| 细节(2) | 微距级材质细节、毛发级刻画 |\n| 整体(2) | 高完成度无瑕疵、专业级色彩管理 |\n\n## 四、镜头感词缀词典（10 词条）\n\n`35mm胶片颗粒`、`浅景深大光圈`、`变形宽银幕镜头光晕`、`长焦压缩空间`、`广角畸变张力`、`微距探镜`、`手持呼吸感`、`斯坦尼康平滑`、`航拍上帝视角`、`水下折射视角`。\n\n## 五、负向兜底词条（10 · 进 KB_09 负向包）\n\n`低分辨率`、`模糊`、`崩坏`、`错误解剖`、`过饱和`、` JPG 压缩噪点`、`画风混杂`、`厚涂与平涂同框`、`过度磨皮`、`塑料感`。\n\n## 六、@画风锁 规范（结构公式 · 变更流程 · 例外条款）\n\n**结构公式**：\n```text\n@画风锁 = [流派与质感] + [细节颗粒度] + [光影氛围] + [影调色温] + [画质词缀]\n```\n**五律**：\n1. 定义后不可篡改；变更须美术+编剧双签，全局替换并通知未完成分集重编译，旧锁留档。\n2. 所有生图/生视频 Prompt 末尾逐字挂载（顺序：内容→构图→画风锁）。\n3. 资产锁定图例外条款：锁内\"光影氛围\"词替换为\"均匀漫射平光\"（KB_06 零光影优先），其余逐字保留。\n4. 分线追加缀独立声明（冷线/暖线），只追加不替换。\n5. 画风锁字符串登记《资产注册表》常量区，与分集文档顶部声明一致。\n6. **三级拆分铁律（R9-20261005）**：@画风锁按资产类型拆为 **@画风锁_人物 / @画风锁_场景 / @画风锁_道具** 三级常量分别登记——场景与人物共用同一锁会互相稀释（实测 5/6 场景图\"冷调\"被人物锁的暖肌理描述暖化）；场景锁须含冷调占比与材质感控制词（如\"青碧玄黑冷调七成，水墨晕染\"）。\n7. **画风锁 35 字预算与题材保真铁律（R9-20261005 立 25 字版，R9-20261005-11 回归复盘修订）**：三级画风锁压缩为 **≤35 汉字高浓度短语**（@光位常量维持 ≤25 字不变），严禁冗长散文——叠加特征三要素/表情前置/道具复述后，超长 Prompt 会稀释关键指令的注意力权重；**压缩优先级＝题材身份＞氛围动态＞技法＞画质**，题材身份词（如\"仙侠唯美漫剧质感\"）为保真红线严禁删除，压缩后须对照总纲做\"题材/氛围/技法/画质\"四维语义覆盖自查，缺任一维即回炉（实测教训：25 字删除式压缩丢光题材词后，豆包资产图退化\"写实古风定妆照\"）。示例：`@画风锁_人物＝仙侠唯美漫剧质感，新中式工笔写实厚涂，肤若凝脂衣袂仙气流转，8K电影感`（★R9-20261005-17：进入 PACK 体系后，PACK-01 项目内该锁执行维度④替换——`写实厚涂`→`工笔厚涂`、`8K电影感`→`8K高清`，示例原文仅作历史格式参考）。\n8. **成熟度分级认证制（风格预设包可靠性法则一）**：全部风格预设包分为两档——`🌟 S级·实测封板认证`（经 ≥20 张多平台/多轮实测验证，开箱即用，直接放行批量生产）与 `🧪 A级·权威基线待验版`（基于联网核实词库构建，**新剧启用时必过 Gate 1 三图校准测试**，2 轮实测通过后由 R9 升为 S 级）。项目绑定 A 级包时，产出文档顶部须标注\"⚠️ 本项目画风包为 A 级待验版，首三图为校准测试图\"。\n9. **包内六维正交互锁律（风格预设包可靠性法则二）**：每个包的维度①（句首媒介）、维度②（二维尾锁矩阵）、维度③（零光影轨道）、维度④（画种排斥禁词表）严格互锁——**维度②与维度③文本内严禁出现本包维度④中的任何禁词**！立项与每次修订后必须逐包自检（禁词逐个 grep 维度②③全文），一处命中即整包打回重写；同时维度①媒介词与维度②锁的题材必须同向（仙侠媒介配仙侠锁、现代媒介配现代锁），跨时代混挂＝画风漂移直接诱因（候补 24 教训）。\n10. **二维尾锁矩阵硬约束（风格预设包可靠性法则三）**：每个包的维度②按 `[古装/奇幻 vs 现代/都市] × [人物锁 / 场景锁 / 道具锁]` 矩阵定义（古现双线剧至少 5 条锁：古装人物/现代人物/古装场景/现代场景/道具），每条 ≤35 汉字，必含 `题材画种 + 核心技法 + 材质光感 + 画质词缀` 四要素——缺任一要素即回炉（对齐第 7 条四维语义覆盖自查）。\n11. **三图试金石校准协议（3-Shot Litmus Test · 风格预设包可靠性法则四）**：新剧注入任何预设包后，必须先跑通三张试金石图、全部达标后方可放行批量生产——**①主时代主角立绘**（锁 `@全局画风基准图`，验媒介词+尾锁+轨道三件套贴合）；**②跨时代/特殊体型配角立绘**（验分流锁是否正确切换+年龄双向反锚+画风是否被配角内容带偏传染）；**③核心主场景空镜**（验冷暖配比+光位常量+场景锁控制力）。任一张不达标＝修包重测，严禁带病批量。\n\n## 七、6 维工业风格预设包标准档案（4 套 · 新剧立项唯一取包处 · R9-20261005-17 全面重写）\n\n> **取包规则**：新剧初始化（VIS-02 Step 1）必须从本节 4 套包中选择与题材匹配的 `PACK-XX`，将其 **6 大维度完整实例化写入 `memory/projects/[剧名]/资产注册表.md` 第五节**；阶段Ⅲ日常生产直接读取注册表热记忆，无需重复加载本册。旧版\"五套成品画风锁\"表已由 PACK 体系全面取代（原东方玄幻双线/都市温情单线两题材的锁已分别吸收进 PACK-01 的古装/现代分流矩阵）。\n> **六维总览**：①句首媒介前置词（编译层 KB_08 一节第①层）｜②二维画风尾锁矩阵（古现×人物/场景/道具，≤35 字）｜③绑定零光影轨道（KB_06 四轨互锁）｜④画种排斥禁词与替换表（G9/V11 ◆ 执法依据）｜⑤比例与年龄防漂移基线｜⑥画风基准传染协议。\n\n---\n\n### PACK-01：国风仙侠 × 现代都市唯美漫剧厚涂包【🌟 S级 · 豆包 Seedream 4.5 实测封板认证】\n\n> 认证依据：《两界食单·豆包测试版》26 条 Prompt 多轮实测（V1→V6 六轮迭代，候补 22/23/24/25/26 全部转正），2026-10-05 封板。适用于古现双线穿越/都市幻想漫剧；开箱即用。\n\n**① 句首媒介前置词（古/现时代分流 · 编译层必占句首前 15 字）**：\n- 古装/仙侠场：`国风仙侠漫剧插画，二维国漫工笔厚涂画风；`\n- 现代/都市场：`现代都市漫剧插画，二维国漫厚涂画风；`\n- 分流铁律：媒介词必须与内容时代语境同向——现代装人物/现代场景挂仙侠媒介＝真人电商模特化直通证（候补 24 实测）。\n\n**② 二维画风尾锁矩阵（≤35 字 · 题材画种+核心技法+材质光感+画质词缀四要素齐备）**：\n| 锁名 | 锁文本（逐字复制） | 挂载对象 |\n|---|---|---|\n| `@画风锁_古装人物` | `仙侠唯美漫剧质感，新中式工笔厚涂，肤若凝脂衣袂仙气流转，8K高清` | 古装人物资产图/人物主体首帧 |\n| `@画风锁_现代人物` | `唯美漫剧质感，现代都市厚涂插画，肤若凝脂发丝细腻，8K高清` | 现代人物资产图/现代人物主体首帧 |\n| `@画风锁_古装场景` | `仙侠唯美漫剧质感，青碧玄黑冷调山水七成，水墨晕染工笔重彩，8K高清` | 沧澜界场景/空镜 |\n| `@画风锁_现代场景` | `唯美漫剧质感，现代都市厚涂插画，暖调光影层次细腻，8K高清` | 现代地球场景/空镜（纯白底资产图场景不适用） |\n| `@画风锁_道具` | `仙侠古韵唯美漫剧质感，新中式工笔质感，玉润金工细腻锐利，8K微距` | 道具特写（古今通用） |\n\n**③ 绑定零光影轨道**：**【B轨·绘画平涂柔光轨】**＝`平涂式均匀柔和平光，光影平面化处理，标准正面立绘构图，保持插画固有色与笔触质感`——资产图与首帧一律使用本轨词组；现代暖调场景可按场景锁另加暖调光影层次（氛围层），但严禁任何摄影工程词入块。\n\n**④ 画种排斥禁词与替换表（一票否决执法依据 · 任何一条入块即 G4/G9 ◆）**：\n| 禁词（真人化/摄影工程引力） | 替换词（插画引力） |\n|---|---|\n| `写实厚涂` | `工笔厚涂` / `厚涂插画` |\n| `8K电影感` / `电影感构图` | `8K高清` / `插画级构图` |\n| `环形无影棚均匀漫射平光` | B 轨词组（`平涂式均匀柔和平光，光影平面化处理`） |\n| `正交投影相机` | `标准正面立绘构图` |\n| `漫反射固有色贴图质感` / `Flat Lit Albedo` | `保持插画固有色与笔触质感` |\n| `毛孔可见` / `真实皮肤纹理` | `肤若凝脂` / `细腻平滑` |\n| `轻熟`（电商模特气） | 具体年龄数字+身形词（如 `二十四岁清爽身形一米六二`） |\n\n**⑤ 比例与年龄防漂移基线（年龄双向锚 · 候补 25 转正）**：\n- 女主型角色（16~18 岁）**防成熟上浮**（豆包漂移史 16→18-20 视感）：必配 `十六岁娇小身形一米六二`＋`脸颊微带少女圆润感` 数字+稚气双锚。\n- 丫鬟/双髻少女型角色（14~16 岁）**防幼童塌缩**（漂移史 15→5 岁视感）：强制配齐三件套——`十五岁及笄少女`（年龄硬词）＋`五官已长开、四肢纤长已抽条的亭亭少女身形`（发育反锚）＋`与十六岁小姐身量相近仅矮小半个头`（关系相对锚）。\n- 通用：年龄一律写具体数字+身高/头身比；禁抽象词\"稚气未脱\"单独使用（无反锚即塌缩）。\n\n**⑥ 画风基准传染协议（候补 26 转正）**：全剧首张锁定的人物主图登记为 `@全局画风基准图`；后续所有人物/道具资产**首次生图强制**在生图策略中挂载该图作画风参考垫图（多图融合上传+指令：`保持参考图的插画笔触、厚涂颗粒度与上色风格，仅按以下文字生成新角色`）；已漂移图以\"漂移图为底+基准图为参考\"改图统一；文字锁只保\"类\"，跨资产画风统一靠像素级基准传染。\n\n---\n\n### PACK-02：电影级真人写实短剧包【🧪 A级 · 权威基线待验版】\n\n> 认证状态：基于真人影视摄影权威词库构建，未满 2 轮实测——**新剧启用必过 Gate 1 三图校准测试**（第六节法则四），2 轮通过后升 S。适用于都市短剧/悬疑罪案/民国谍战等真人质感题材。\n\n**① 句首媒介前置词（古/现时代分流）**：\n- 古装/年代场：`古装真人实拍电影剧照，35mm定焦镜头光学摄影质感；`\n- 现代/都市场：`现代都市真人实拍电影剧照，35mm定焦镜头光学摄影质感；`\n\n**② 二维画风尾锁矩阵（≤35 字）**：\n| 锁名 | 锁文本（逐字复制） | 挂载对象 |\n|---|---|---|\n| `@画风锁_古装人物` | `电影级写实质感，真实皮肤纹理与织物细节，8K超高清电影感` | 古装人物资产图/人物主体首帧 |\n| `@画风锁_现代人物` | `电影级写实质感，真实皮肤纹理与生活妆造细节，8K超高清电影感` | 现代人物资产图/现代人物主体首帧 |\n| `@画风锁_古装场景` | `电影级实景质感，胶片色彩层次与自然光比，8K超高清电影感` | 古装/年代场景空镜 |\n| `@画风锁_现代场景` | `电影级实景质感，都市光比与浅景深层次，8K超高清电影感` | 现代都市场景空镜 |\n| `@画风锁_道具` | `电影级道具陈设质感，微距材质纹理与做旧痕迹，8K超高清` | 道具特写 |\n\n**③ 绑定零光影轨道**：**【A轨·摄影无影棚拍轨】**＝`360度环形无影棚拍柔光，均匀漫射平光，漫反射固有色贴图质感（Flat Lit Albedo），正交投影相机零透视畸变`——资产锁定图（三视图/立绘/特写）一律使用本轨词组（KB_06 A 轨全表）。\n\n**④ 画种排斥禁词与替换表（一票否决执法依据 · 任何一条入块即 G4/G9 ◆）**：\n| 禁词（绘画/卡通引力） | 替换词（真人摄影引力） |\n|---|---|\n| `插画` | `电影剧照` / `实拍质感` |\n| `漫剧` | `真人短剧` |\n| `二次元` | `真人比例` |\n| `厚涂笔触` | `真实皮肤纹理` |\n| `平涂` | `自然光比` |\n| `赛璐璐` | `实景质感` |\n| `水墨晕染` | `胶片色彩层次` |\n| `卡通渲染` | `光学摄影质感` |\n| `过度磨皮塑料感` | `保留真实毛孔与皮肤肌理` |\n\n**⑤ 比例与年龄防漂移基线（真人头身比与年龄骨相锚）**：\n- 成人女性（18~30 岁）：`头身比一比七，肩宽约一点五头宽，身高写具体数值`＋年龄数字+职业气质词（`二十四岁健身教练身形紧致` 式）；真人写实下禁用 Q 版/夸张比例词。\n- 成人男性（18~35 岁）：`头身比一比七点五，肩宽约两头宽，倒三角微显`；中年以上按 KB_01 三节中年档骨相词（法令纹/眉间纹）锚定，禁\"少年感\"混挂。\n- 青少年（12~16 岁）：`头身比一比六点五，肩窄，四肢修长感初显`+年龄数字；写实题材未成年角色严禁性征成熟化描述。\n- 通用：真人剧年龄以**骨相阶段词**（胶原饱满/法令纹/眼窝深陷）+数字双锚，单独数字在写实端漂移幅度大。\n\n**⑥ 画风基准传染协议（同剧摄影棚色温与滤镜 LUT 基准图传染）**：全剧首张锁定的人物主图登记为 `@全局画风基准图`；同剧统一**摄影棚色温基准**（如 5600K 日光棚/3200K 钨丝棚，登记于注册表第五节）与**滤镜 LUT 感基调**（青橙调/暖褐调，登记为分线追加缀）；后续人物/道具资产首生图一律垫基准图+指令 `保持参考图的人物摄影质感、色温与肤感基调，仅按以下文字生成新角色`；场景图传染 LUT 基准（`保持与基准图一致的调色基调`）。\n\n---\n\n### PACK-03：3D 国漫玄幻 CG 渲染包【🧪 A级 · 权威基线待验版】\n\n> 认证状态：基于追光动画/国漫 CG 工业管线权威词库构建，未满 2 轮实测——**新剧启用必过 Gate 1 三图校准测试**，2 轮通过后升 S。适用于玄幻/科幻 3D 动画电影质感题材。\n\n**① 句首媒介前置词（古/现时代分流）**：\n- 古装/玄幻场：`3D国漫次世代CG渲染，追光玄幻动画电影质感；`\n- 现代/都市场：`3D国漫次世代CG渲染，追光现代动画电影质感；`\n\n**② 二维画风尾锁矩阵（≤35 字）**：\n| 锁名 | 锁文本（逐字复制） | 挂载对象 |\n|---|---|---|\n| `@画风锁_古装人物` | `3D国漫次世代CG渲染，PBR高精度材质与柔光子表面散射，发丝根根分明，8K超高清` | 古装人物资产图/人物主体首帧 |\n| `@画风锁_现代人物` | `3D国漫次世代CG渲染，现代装束PBR材质与柔光肤感，发丝根根分明，8K超高清` | 现代人物资产图/现代人物主体首帧 |\n| `@画风锁_古装场景` | `3D国漫CG场景渲染，体积雾效与PBR山水材质，宏大纵深，8K超高清` | 玄幻/古装场景空镜 |\n| `@画风锁_现代场景` | `3D国漫CG场景渲染，现代都市PBR材质与夜景光效，8K超高清` | 现代场景空镜 |\n| `@画风锁_道具` | `3D国漫CG道具渲染，高精度建模与PBR材质细节，8K超高清` | 道具特写 |\n\n**③ 绑定零光影轨道**：**【C轨·3D引擎视口柔光轨】**＝`3D引擎标准无影漫反射视口光照，三点均匀柔光漫射，PBR材质固有色通道呈现，标准正面立绘视口零透视畸变`——资产锁定图一律使用本轨词组（KB_06 C 轨全表）。\n\n**④ 画种排斥禁词与替换表（一票否决执法依据 · 任何一条入块即 G4/G9 ◆）**：\n| 禁词（二维/实拍/低质引力） | 替换词（3D CG 引力） |\n|---|---|\n| `二维平涂` | `PBR材质着色` |\n| `赛璐璐硬边` | `柔光过渡着色` |\n| `水彩手绘` | `次世代CG渲染` |\n| `真人实拍写真` | `3D动画电影质感` |\n| `粗粝毛孔` | `柔光子表面散射肤感` |\n| `塑料反光过曝` | `PBR金属度与粗糙度平衡` |\n| `低多边形` | `高精度建模` |\n\n**⑤ 比例与年龄防漂移基线（3D 建模头身比锚）**：\n- 少女/少年型（14~18 岁）：`头身比一比六点五至一比七，面部软组织圆润，眼睛占比略放大`（3D 国漫少女基准）；年龄数字+`脸部胶原蛋白感` 双锚防写实化。\n- 成人女（18~30 岁）：`头身比一比七，三庭五眼匀称，眼型略stylized放大`；成人男（18~35 岁）：`头身比一比七点五至一比八，肩宽腰窄英雄比例`。\n- Q 版配角（喜剧向）：显式声明 `三头身Q版比例`，禁与常规比例同框混挂（比例系统冲突=渲染崩坏源）。\n- 通用：3D 题材年龄以**头身比+眼部占比+软组织**三锚定位，纯数字年龄在 CG 端几乎不解码。\n\n**⑥ 画风基准传染协议（主角色 3D 材质球与渲染光感基准图传染）**：全剧首张锁定的主角立绘登记为 `@全局画风基准图`，同时登记其**材质球基线**（皮肤 SSS 强度/头发各向异性高光/布料粗糙度区间，文字登记于注册表第五节）；后续所有角色资产首生图垫基准图+指令 `保持参考图的3D渲染光感、材质精度与角色作画规范，仅按以下文字生成新角色`；场景与道具首图同法传染渲染光感，防跨资产\"塑料感/油腻感\"方差。\n\n---\n\n### PACK-04：2D 赛璐璐热血番剧包【🧪 A级 · 权威基线待验版】\n\n> 认证状态：基于日式番剧作画工业权威词库构建，未满 2 轮实测——**新剧启用必过 Gate 1 三图校准测试**，2 轮通过后升 S。适用于热血战斗/校园运动/王道冒险番剧题材。\n\n**① 句首媒介前置词（古/现时代分流）**：\n- 古装/奇幻场：`二维日式赛璐璐动画番剧作画，清晰勾线平涂质感；`\n- 现代/都市场：`二维日式赛璐璐动画番剧作画，现代场景清晰勾线平涂质感；`\n\n**② 二维画风尾锁矩阵（≤35 字）**：\n| 锁名 | 锁文本（逐字复制） | 挂载对象 |\n|---|---|---|\n| `@画风锁_古装人物` | `二维赛璐璐动画番剧质感，清晰锐利勾线与平涂色块，硬阴影二分法分面，4K高清作画` | 古装/奇幻人物资产图 |\n| `@画风锁_现代人物` | `二维赛璐璐动画番剧质感，现代装束勾线平涂与硬阴影分面，4K高清作画` | 现代人物资产图 |\n| `@画风锁_古装场景` | `二维赛璐璐番剧背景美术，手绘线条与色块分层，光影二分，4K高清作画` | 奇幻/古装场景空镜 |\n| `@画风锁_现代场景` | `二维赛璐璐番剧背景美术，现代都市线条色块与光影二分，4K高清作画` | 现代场景空镜 |\n| `@画风锁_道具` | `二维番剧道具设定质感，线条干净色块分明，高光锐利，4K高清` | 道具特写 |\n\n**③ 绑定零光影轨道**：**【B-Cel轨·赛璐璐设定稿平光轨】**＝`二维动画设定稿标准均匀平光，赛璐璐色块清晰分明无渐变过渡，标准正面全身设定立绘，保持番剧线稿与固有色`——资产锁定图一律使用本轨词组（KB_06 B-Cel 轨全表）。\n\n**④ 画种排斥禁词与替换表（一票否决执法依据 · 任何一条入块即 G4/G9 ◆）**：\n| 禁词（厚涂/写实/3D/摄影引力） | 替换词（赛璐璐作画引力） |\n|---|---|\n| `厚涂笔触` | `清晰勾线` |\n| `写实` | `作画级stylized` |\n| `电影感` | `番剧演出感` |\n| `体积光` | `光影二分色块` |\n| `次表面散射` | `固有色色块` |\n| `无影棚` | `设定稿均匀平光` |\n| `正交相机` | `标准正面全身设定立绘` |\n| `贴图Albedo` | `番剧线稿与固有色` |\n| `3D渲染` | `二维作画` |\n| `柔焦模糊` | `锐利作画线条` |\n\n**⑤ 比例与年龄防漂移基线（番剧年龄头身比锚）**：\n- 少女/少年型（12~16 岁）：`头身比一比六至一比六点五，脸部线条圆润，眼睛占比大`（番剧少年基准）；年龄数字+`校服/少年体型` 语境锚。\n- 青年型（16~25 岁）：`头身比一比七至一比七点五，脸部线条利落，肩线清晰`；热血主角可放大至 `一比八英雄比例`（显式声明）。\n- Q 版插入（喜剧 CUT 用）：显式声明 `二头身至三头身Q版`，与常规镜严格分资产登记，禁同框混挂。\n- 通用：番剧题材年龄以**头身比+眼睛占比+线条风格**三锚定位；\"成熟感\"只能靠眼神与服装表达，禁写实骨相词（法令纹/毛孔类）入块。\n\n**⑥ 画风基准传染协议（番剧作画监督修正级首图线条与色指定传染）**：全剧首张锁定的主角设定立绘登记为 `@全局画风基准图`＝**作画监督修正级基准**（线宽/色指定/阴影层规则以它为准）；同时登记**色指定表**（每个角色的固有色三色值区间，登记于注册表第五节）；后续角色资产首生图垫基准图+指令 `保持参考图的线条粗细、色指定与阴影层画法，仅按以下文字生成新角色`；跨资产作画漂移（线宽变细/阴影层加多）即回退重染。\n\n## 八、画风一致性自检清单（八问 · 预设包时代 · R9-20261005-17）\n\n- [ ] 当前 Prompt **首句**是否含项目 `PACK-XX` 维度①媒介词，且古/现时代与内容匹配（分流铁律）？\n- [ ] 末尾是否按维度②矩阵逐字挂载**对应时代×资产类型**的锁（古装人物≠现代人物锁）？\n- [ ] 全文是否**零命中**本包维度④排斥禁词（逐词 grep，命中 1 个即 G9/V11 ◆ 打回）？\n- [ ] 锁内光影词与资产图轨道要求冲突时，是否按 `PACK-XX` 维度③对应轨道词组替换（B/A/C/B-Cel 四轨互锁，KB_06）？\n- [ ] 新剧是否已通过「三图试金石校准测试」（主角主图+跨时代配角+主场景空镜，第六节法则四）后才放行批量？\n- [ ] 生成结果与既有镜头对比：笔触/色温/细节密度同源（不符即查 `@全局画风基准图` 传染协议是否执行）？\n- [ ] 是否误混流派（厚涂+赛璐璐同框=废片，负向兜底\"画风混杂\"）？\n- [ ] 引擎感词缀是否与流派匹配（2D 流派误挂 UE5=违和；3D 流派必挂 KB_05 二节引擎词之一）？"},{"p":"kb_library/KB_06_三视图与角色一致性.md","t":"KB_06 三视图与角色一致性规范（高密度工业速查版）","d":"","raw":"# KB_06 三视图与角色一致性规范（高密度工业速查版）\n\n> 用途：重要资产图（三视图/表情矩阵/立绘/特写）生成铁律库。\n> 核心原则：**用正面物理状态描述替代否定词**——扩散模型对\"无高光无阴影\"不敏感，对\"平光/Albedo/正交投影/平涂柔光\"等物理事实高度敏感。\n> 本册包含：**零光影轨道四轨总表（A/B/C/B-Cel · 与 KB_05 PACK-01~04 一一互锁，R9-20261005-17 拆分）** ｜ A 轨正反词组对照 ×22 组 ｜ 姿态规范 6 式 ｜ 五件套清单 ｜ **分轨编译母版（①~⑩ · ⑧＝场景机位库九宫格 R9-20261006-6／⑨⑩＝头身分区板与分区轮转板 R9-20261006-7）** ｜ 防多头怪四步指南 ｜ 锁脸权重表 ｜ 质检对照清单。\n\n---\n\n## 〇、零光影轨道四轨总表（先选轨再编译 · R9-20261005-17）\n\n| 轨道 | 名称 | 轨道词组（逐字复制） | 对应风格包 | 误用后果 |\n|---|---|---|---|---|\n| **A轨** | 摄影无影棚拍轨 | `360度环形无影棚拍柔光，均匀漫射平光，漫反射固有色贴图质感（Flat Lit Albedo），正交投影相机零透视畸变` | PACK-02 真人写实包 | 在 PACK-01/04 项目出现任一词 → 真人化/摄影化崩坏，KB_10 G4/G9 ◆ 一票否决 |\n| **B轨** | 绘画平涂柔光轨 | `平涂式均匀柔和平光，光影平面化处理，标准正面立绘构图，保持插画固有色与笔触质感` | PACK-01 漫剧厚涂包 | 在 PACK-02 项目出现 → 写实剧被插画化；在 PACK-04 出现\"笔触\"→ 厚涂污染赛璐璐 |\n| **C轨** | 3D引擎视口柔光轨 | `3D引擎标准无影漫反射视口光照，三点均匀柔光漫射，PBR材质固有色通道呈现，标准正面立绘视口零透视畸变` | PACK-03 3D CG包 | 在 2D 项目出现 → 渲染感污染手绘画种 |\n| **B-Cel轨** | 赛璐璐设定稿平光轨 | `二维动画设定稿标准均匀平光，赛璐璐色块清晰分明无渐变过渡，标准正面全身设定立绘，保持番剧线稿与固有色` | PACK-04 赛璐璐番剧包 | 在 PACK-01 项目出现\"无渐变过渡\"→ 厚涂质感被抹平 |\n\n**选轨规则**：读项目《资产注册表》第五节绑定的 `PACK-XX` 维度③ → 取对应轨道词组逐字挂载；**严禁跨包混轨**（跨轨词组互相污染画种）。四轨共用的姿态/背景/版式/通用正反对照见下文 A 轨总表（其余三轨仅替换\"布光/贴图/投影\"三维词组，其余维度通用）。\n\n## 一、A轨 正反词组对照（22 组 ❌否定式 → ✅正面物理式 · B/C/B-Cel 轨沿用其姿态/背景/版式/通用四维，只换布光/贴图/投影三维）\n\n| 维度 | ❌ 错误否定式（失效） | ✅ 正面物理式（逐字编译） |\n|---|---|---|\n| 布光(4) | ~~无高光~~ | `360度环形无影棚拍柔光` |\n| | ~~不要阴影~~ | `均匀漫射平光（Flat Even Lighting）` |\n| | ~~光要均匀~~ | `大型柔光箱正面平光` |\n| | ~~没有明显光比~~ | `影棚基准平光，受光面与背光面明度差极小` |\n| 贴图(3) | ~~不要反光~~ | `漫反射固有色贴图质感（Flat Lit Albedo）` |\n| | ~~哑光一点~~ | `PBR 漫反射贴图（Diffuse Pass）质感` |\n| | ~~像手办的表面~~ | `哑光固有色，无镜面反射` |\n| 投影(3) | ~~不要透视~~ | `正交投影相机（Orthographic Projection）` |\n| | ~~别近大远小~~ | `平行视线无消失点，零透视畸变` |\n| | ~~平面化一点~~ | `等距视角（Isometric-flat）贴图式呈现` |\n| 背景(3) | ~~背景干净~~ | `中性18%灰背景` |\n| | ~~纯色背景~~ | `纯白无接缝背景（Seamless Backdrop）` |\n| | ~~别出现场景~~ | `背景无任何环境元素，仅纯色基底` |\n| 姿态(3) | ~~手臂自然下垂~~（衣袖粘连） | `A-Pose双臂自然微张约30~45度` |\n| | ~~标准站姿~~ | `T-Pose双臂水平展开`（展袖需求专用） |\n| | ~~站好别动~~ | `双脚与肩同宽站立基准，头部正视前方` |\n| 版式(3) | ~~三个角度~~ | `正面、左侧面、背面三视角等距水平排列` |\n| | ~~多视图~~ | `角色设定三视图（Turnaround Sheet / Model Sheet）` |\n| | ~~别画成多个人~~ | `同一角色三个视角比例严格一致（非三个人物，非合影）` |\n| 通用(3) | ~~简洁一点~~ | `信息密度仅保留角色本体与必要道具` |\n| | ~~高质量~~ | `超精细细节，8K超高清` |\n| | ~~专业设定图~~ | `animation model sheet，industry character sheet standard` |\n\n**英文对照串**（ComfyUI/Flux 等英文语义强模型直接使用）：\n`character turnaround sheet, three view (front / side / back), orthographic projection, A-pose, full body, consistent proportions, flat lighting, albedo map style, neutral white background, model sheet layout`\n\n**B轨 正反替换表（绘画平涂柔光轨 · PACK-01 专用 · 布光/贴图/投影三维替换，其余维度沿用 A 轨表）**：\n\n| 维度 | ❌ 禁用（A 轨摄影工程词＝PACK-01 维度④禁词） | ✅ B 轨正面绘画语（逐字编译） |\n|---|---|---|\n| 布光 | ~~360度环形无影棚拍柔光~~ | `平涂式均匀柔和平光` |\n| 布光 | ~~均匀漫射平光（摄影语义）~~ | `光影平面化处理` |\n| 贴图 | ~~漫反射固有色贴图质感（Flat Lit Albedo）~~ | `保持插画固有色与笔触质感` |\n| 投影 | ~~正交投影相机零透视畸变~~ | `标准正面立绘构图` |\n| 背景通用 | （沿用 A 轨：`纯白无接缝背景`/`中性18%灰背景`） | 同左（背景维度四轨通用） |\n\n**C轨 正反替换表（3D引擎视口柔光轨 · PACK-03 专用）**：\n\n| 维度 | ❌ 禁用（2D 绘画语＝PACK-03 维度④禁词方向） | ✅ C 轨 3D 视口语（逐字编译） |\n|---|---|---|\n| 布光 | ~~柔和手绘光影~~ | `3D引擎标准无影漫反射视口光照，三点均匀柔光漫射` |\n| 贴图 | ~~保持插画固有色与笔触质感~~ | `PBR材质固有色通道呈现` |\n| 投影 | ~~平涂式构图~~ | `标准正面立绘视口零透视畸变` |\n\n**B-Cel轨 正反替换表（赛璐璐设定稿平光轨 · PACK-04 专用）**：\n\n| 维度 | ❌ 禁用（厚涂/写实/摄影语＝PACK-04 维度④禁词方向） | ✅ B-Cel 轨作画语（逐字编译） |\n|---|---|---|\n| 布光 | ~~柔和平光/漫射~~ | `二维动画设定稿标准均匀平光` |\n| 贴图 | ~~笔触质感/皮肤纹理~~ | `赛璐璐色块清晰分明无渐变过渡`＋`保持番剧线稿与固有色` |\n| 投影 | ~~正交投影相机~~ | `标准正面全身设定立绘` |\n\n> **母版挂轨总则**：任何资产锁定图母版（下节①~⑦）中的 `[轨道光影词组]` 槽位＝本节〇总表四选一逐字填入；跨轨混用（如 B 轨句中混入\"无影棚\"）＝KB_10 G4 ◆ 一票否决。\n\n## 二、姿态规范词典（6 式）\n\n| 姿态式 | 描述词 | 适用 |\n|---|---|---|\n| A-Pose(首选) | 双臂微张30~45度、掌心朝内、五指自然分开贴腿侧 | 绝大多数角色（防衣袖粘连） |\n| T-Pose | 双臂水平展开90度、掌心朝前 | 宽袖/披风完整展示 |\n| 自然立正 | 双脚与肩同宽、垂手、正视 | 主图/立绘 |\n| 微侧立 | 身体转向15度、头回正 | 主图增加体积感 |\n| 坐姿基准 | 正坐椅上、双手置膝、双足落地 | 坐姿角色资产 |\n| 道具持握式 | 单手持道具45度朝镜头、另一手自然垂 | 道具三视图（防手遮结构） |\n\n## 三、图集五件套清单（人物）/ 两件套（场景/道具 · S/A级主场景可选扩三件套）\n\n| 资产类型 | 必产图集 | 用途 |\n|---|---|---|\n| 人物五件套 | ①主图 ②正侧背三视图 ③3x3表情矩阵 ④独立面部特写 ⑤独立全身立绘（默认主流·⑨头身分区板为按需备选：复杂度命中或备用抽卡时经VIS-05路由追加，R9-20261006-9） | ①对外展示 ②锁定设定 ③微表情锚点 ④⑤**视频/单镜专用参考（防多头怪）** |\n| 场景两件套(可选三件套) | ①全景图 ②空镜基准图(主机位无人物) ③机位库宫格(S/A级主场景可选·R9-20261006-6，3x3室内降2x2) | ①展示 ②所有同场景镜头图生图底图 ③多机位垫图弹药库(逐格裁切回填高清后供分镜垫图) |\n| 道具两件套 | ①正交三视图 ②特写基准图(无手部) | ①锁定结构 ②Cutaway/特写镜素材 |\n\n## 四、分轨编译母版（①~⑩ · `[轨道光影词组]`＝〇节四轨按项目 PACK-XX 维度³选一逐字填入 · [ ]=注册表锁定摘要填空 · R9-20261005-17 拆分，⑧＝R9-20261006-6，⑨⑩＝R9-20261006-7）\n\n> **句首媒介前置**：每条母版首槽 `[媒介前置]`＝项目 `PACK-XX` 维度①（古/现分流）；**句首负向版式锁已废除**，版式由第②层正向构图锚定承担（KB_08 一节）。\n\n**母版① 人物主图**：\n```prompt\n[媒介前置·PACK-XX维度①]；[表情前置短句]，单人全身居中立像：[年龄段+身份]@[资产名]，[骨相锁定摘要5~8词]，[肤色质感]，[年龄双向锚]；[套装编号+四件套]，[持物与手别/道具三要素复述]，[记忆点三要素+正向排他句]；[单一明确姿态+手部五指自然并拢]；[轨道光影词组·四轨选一]，纯白无接缝背景，全身完整入画；@画风锁（[PACK-XX维度②对应锁纯文本]），16:9横幅，16:9，4K\n```\n\n**母版② 正交三视图**：\n```prompt\n[媒介前置]；角色设定三视图（Turnaround Sheet）：@[资产名]，[骨相摘要]，[套装四件套+背饰走向]；A-Pose双臂自然微张约30~45度防衣袖粘连，双脚与肩同宽；正面、左侧面、背面三视角等距水平排列，同一角色三个视角比例严格一致（非三个人物，非合影），全身完整造型含[背面关键细节]；[轨道光影词组·四轨选一]，中性18%灰背景，@画风锁（[维度②锁纯文本]），16:9横幅，16:9，4K\n```\n*V2 参考图增强（R9-20261006-11 立·推荐）：垫本角色母版①主图达标图作参考，Prompt 首句改写为\"参考图中的人物形象，角色设定三视图（Turnaround Sheet）：…\"（官方参考图生图两部式——指明参考对象+描述生成画面，plat_01 六节）——三视角与主图同脸同服，显著降低抽卡轮次；主图未锁定时退纯文生图（本母版原式）。*\n\n**母版③ 3x3 表情矩阵**：\n```prompt\n[媒介前置]；3x3九宫格表情矩阵图：同一角色@[资产名]半身正面构图，[骨相摘要+套装]，九格分别为：①平静（基准无表情）②喜[具体面部动作]③哀[...]④怒[...]⑤惧[...]⑥[线别特色格]⑦惊讶[...]⑧沉思[...]⑨[角色专属格]；每格统一构图同一张脸，格间留白分隔；[轨道光影词组·四轨选一]，正面平视角度，中性18%灰背景，@画风锁（[维度②锁纯文本]），16:9横幅，16:9，4K\n```\n*九格情绪词必须给\"具体面部动作\"（眼睛弯成月牙/眉骨紧锁），禁抽象词（开心/难过）。可选增强格位（R9-20261006-7 · VIS-05 板式C）：wink 单侧闭眼格（写\"右眼闭合呈眨眼wink状态，左眼睁开\"——单侧动作必须写明左右防双眼全闭）／口型张合格（写\"嘴唇张开呈O型，齿列微露\"——口型戏角色专用，供视频口型锚参考）。V2 参考图增强（R9-20261006-11）：垫主图/面部特写达标图作参考+首句改\"参考图中的人物形象，3x3九宫格表情矩阵图…\"（同母版②注记，同脸率提升）。*\n\n**母版④ 独立面部特写（视频参考专用）**：\n```prompt\n[媒介前置]；[基准表情前置短句]，单幅正面特写：@[资产名]独立面部特写图，正面头像，发际线至锁骨入画，[骨相摘要]，[发型+颊侧碎发]，[肤色]，[记忆点三要素+正向排他句]；单视角单人；[轨道光影词组·四轨选一]，中性18%灰背景，@画风锁（[维度②锁纯文本]），1:1，4K\n```\n\n**母版⑤ 独立全身立绘（素材位专用）**：\n```prompt\n[媒介前置]；[表情前置短句]，单人全身居中立像：@[资产名]独立正面全身立绘图，单视角单人（非三视图非多人），[骨相摘要+年龄双向锚+套装四件套]，自然站姿双臂垂于身侧五指并拢，A-Pose微张约20度；[轨道光影词组·四轨选一]，纯白背景，@画风锁（[维度②锁纯文本]），9:16竖构图，4K\n```\n\n**（附）母版⑥ 场景空镜基准 / 母版⑦ 道具三视图**：\n```prompt\n[媒介前置]；@[场景名]主场景空镜基准图：[主机位视角]（无任何人物），[空间三段：前景…/中景焦点…/远景…]；[时间天气+色温+光型+光位常量纯文本]；@画风锁（[维度②场景锁纯文本]），16:9横幅，16:9，4K\n[媒介前置]；单幅侧面微距平视特写：道具标准正交三视图，@[道具名]，[三级结构各带材质词]，[记忆点]；正面、左侧面、背面三个视角等距水平排列，同一道具三视角比例严格一致；[轨道光影词组·四轨选一]，中性18%灰背景；@画风锁（[维度②道具锁纯文本]），16:9横幅，16:9，4K\n```\n\n**母版⑧ 场景机位库（R9-20261006-6 立 · 20261006-11 V2 重构 · S/A级主场景强制件 R9-20261006-9 · 场景锁+光位常量轨，不用轨道光影词组）**：\n\n**V2 生成方式两铁律（2026-10-06 用户实测重构·黑名单 37 复测；同日复测②反转——用户实测验证单画布宫格可行）**：①**必垫本场景已锁定的全景基准图生成**（图生图，官方参考图两部式＝指明参考对象\"参考图中的@[场景名]建筑\" + 描述生成画面\"九机位视角\"），建筑构件一致性由参考图直接继承——**禁止文生图盲抽**（实测：盲抽九宫格仅 6/9 格可用——机位重复/格间漂移/匾额涂黑/人物乱入）；②**首选单画布多角度宫格（形态A）**——豆包 App 实测支持（2026-10-06 用户验证：垫基准图+极简提示词产出 3x3 九格、格间建筑一致、无崩坏）；一张图管九机位＝**垫图工作流本体**（【宫格指定格垫·补丁7 档②】的载体）+裁格弹药库；V1 失败根因＝提示词质量与未垫基准图，**非通道问题**；**复测③警示：长文本（500+字）+每格量化构图锚版实测出\"单图融合怪\"（九机位元素揉进一张）——宫格文字层必须极简（V3 版式：版式词前置+语义短标签+零量化锚+≤240字，plat_01 六节 10）**。官方\"生成N张图\"多图输出为**形态B 备选**——仅用于单机位补产/裁格图重跑（【实测证据位阶铁律·AGENTS 〇节9】用户实测>官方文档，低阶证据不得立首选）。\n\n**形态A 母版（单画布多角度宫格 · 首选 · 豆包实测支持 · V4 镜头位置极简式·复测④）**：\n```prompt\n[媒介前置]；3x3组图，参考图中的@[场景名]的九个不同拍摄机位——[机位短词]、[机位短词]、[机位短词]、[机位短词]、[机位短词]、[机位短词]、[机位短词]（文字载体格带\"无字\"）、[机位短词]、[机位短词]；九格空镜无人物，风格色调与参考图一致；16:9，4K\n```\n*V4 版式铁律（复测③④立·plat_01 六节 10）：机位**开放式顿号列表、禁绑格位编号**（\"第一格…\"绑定实测无效，模型做不了标签→格位映射）；**文字只管\"版式+镜头位置\"**——构件复述/光位句/线别缀全删（参考图承载）；全文 ≤150 字；**成图后按实际内容回填格位登记表**（注册表格序=实际产出，非 Prompt 标签序）；缺的机位走多图输出单补。*\n\n**形态B 母版（多图输出 · 备选 · 单机位补产用）**——每批 ≤4 张，各批复用同一参考图（下例为首批四张）：\n```prompt\n[媒介前置]；生成四张图，同一场景机位组图（Scene Camera Set）：参考图中的@[场景名]建筑为主体，四张图均为该场景空镜（无任何人物），建筑结构、构件（[关键构件×3]）与色调严格遵循参考图；第一张[机位A+独有构图锚，如：正面平视全景，石阶占画面下方三分之一]；第二张[机位B+构图锚]；第三张[机位C+构图锚]；第四张[机位D+构图锚]（每张机位各附一个独有构图锚，防相邻机位重复）；四张同一时段同一光位同一色温，[时间天气+色温+光型+光位常量纯文本]；@画风锁（[维度②场景锁纯文本]），16:9，4K\n```\n*配套规则：①室内场景降级 2x2 四机位（保留俯瞰全景/平视中景/低角度仰拍/陈设特写）——室内遮挡链复杂，空间漂移风险高；②**一致性语义前置铁律**——\"参考图中的@场景名…严格遵循参考图\"声明必须位于机位列表**之前**（长提示词末段降权实测：一致性描述压句尾会被弱化）；③文字载体一律档①无字留白（匾额写\"无字木匾\"），禁档②\"模糊虚化\"（实测：九宫格内\"模糊字\"生成涂黑崩坏；V2 无字版实测通过）；④机位内容**禁人物诱导词**（连\"剪影/人影\"都不写——实测诱导乱入人物），人物位由分镜层 Prompt 自行添加；⑤验收＝逐张/逐格空间一致性比对（KB_10 六节）——任一格陈设拓扑与全景参考矛盾即该格废弃重出，不作整批废片；⑥产出图不另立资产名（正则禁数字）——垫图指引按\"@场景名 机位库第N格\"（汉字数字，空格分隔防 linter 误连读）引用；**形态A 宫格：指定格垫用整图免裁切，裁格子图须回填 IMG-01 补高清重绘 0.3 后方可入垫图位；形态B 多图产出已是满分辨率，直接入垫图位（免补高清）**；⑦S 级首帧仍单独精出，机位库图仅作垫图/参考锚禁直出首帧；⑧机位库资产登记于注册表**紧跟其场景资产行**（衍生资产位）；⑨**同族机位语义互斥铁律（2026-10-06 实测立·同日复测③修正）**——同族机位（双门框格/双侧面格等）的**短标签必须语义互斥**（一仰一平/一内一外/一左一右，如\"门内向外框景\"vs\"门外向内纵深平视\"）；**禁用量化构图锚实现互斥**（\"占画面X分之一\"类——九组量化锚互相竞争诱发\"单图融合怪\"，复测③实测）；同族重复时改标签语义再抽，不打回加锚。*\n\n**母版⑨ 人物头身分区设定板（R9-20261006-7 立 · R9-20261006-9 订 · 复杂度按需件：头部记忆点≥3项并发或服饰层次≥3层时经 VIS-05 判定产出；亦可作备用抽卡方案，传统母版②为默认主流）**：\n```prompt\n[媒介前置]；3+3头身分区设定图（Head-Body Split Sheet）：同一角色@[资产名]——上排头部三角度高精度特写：左格[左侧正侧面头像]，中格[正面头像]，右格[右侧正侧面头像]，[骨相摘要+瞳色记忆点+发型发饰细节词组]；下排无头人台三视角服饰展示：正面、左侧面、背面等距水平排列的无头服装人台（Fashion Mannequin），[套装编号+四件套+部件剪裁词组]，三视角比例严格一致；上排三头像骨相同源同一张脸，下排同一套服饰，上排与下排为同一角色同一套服饰，格间留白分隔；[轨道光影词组·四轨选一]，中性18%灰背景，@画风锁（[维度②对应时代人物锁纯文本]），1:1，4K\n```\n*配套规则：①只用于锁定设定，严禁直接入视频/生图参考位（多格板红线，VIS-05 铁律2，同三视图）；②平台首选豆包组图写法（plat_01），ChatGPT 强制版式锁（黑名单\"擅自拼图\"前科）；③零实测新板式，新剧 Gate 1 先试一张转正（VIS-05 铁律6）；④头部区词源＝KB_02 二/四/六节，服饰区词源＝KB_03 二节，槽位用注册表锁定摘要原词；⑤传统母版②为默认主流永不替代——⑨仅复杂度命中/用户点名/备用抽卡时按需追加（②主选、⑨备选池择优，VIS-05 4.5），裁切子图不另立资产名，须回填 IMG-01 补高清重绘 0.3 后方可入基准位/参考位（六格裁后单格分辨率不足，同⑧④）。*\n\n**母版⑩ 非人形分区轮转板（R9-20261006-7 立 · R9-20261006-9 订 · 经 VIS-05 路由触发 · 怪兽/灵宠/机甲/法器/大型道具）**：\n```prompt\n[媒介前置]；3x2六格非人形分区轮转设定图（Creature Turnaround Grid）：@资产名（[生物/器械类型]）——上排头部三视角特写：左格[四分之三侧视头部]，中格[正视头部]，右格[正侧视头部]，[头部结构记忆点三要素：如獠牙/角/发光瞳]；下排全身三视角：正面、左侧面、背面等距水平排列，[形体结构摘要+材质词组]，画面旁标尺寸标注（体长约[X]米，体高约[X]米）；六格同一生物同一比例，格间留白分隔；[轨道光影词组·四轨选一]，中性18%灰背景，@画风锁（[维度②按资产性质分流：生物类（灵宠/怪兽）挂对应时代人物锁／器械法器类挂道具锁·纯文本]），1:1，4K\n```\n*配套规则：①升级 VIS-03 边界5 非人形三件套中的三视图件（形态矩阵保留——轮转板锁空间轴、形态矩阵锁状态轴，正交互补）；②多格板红线同母版⑨；③尺寸标注为跨镜体量一致性依据（R4 场记核对项）；④零实测，Gate 1 先试一张转正；⑤裁切子图回填 IMG-01 补高清重绘 0.3 后方可使用（同⑧④/⑨⑤·R9-20261006-9 补）。*\n\n**B 轨完整示例（PACK-01 人物主图 · 逐字参考）**：\n```prompt\n国风仙侠漫剧插画，二维国漫工笔厚涂画风；神情隐忍倔强，单人全身居中立像：十六岁少女沈小满，圆润杏眼瞳色浅琥珀，柳叶眉，鹅蛋脸，自然黑长发束高马尾，娇小身形一米六二；素青色交领襦裙四件套，左手中指戴一枚蜜黄玉质细金线包边的古朴饕餮纹玉戒；站姿端正，双手交叠于腹前五指自然并拢；平涂式均匀柔和平光，光影平面化处理，标准正面立绘构图，保持插画固有色与笔触质感，纯白无接缝背景，全身完整入画；仙侠唯美漫剧质感，新中式工笔厚涂，肤若凝脂衣袂仙气流转，8K高清，16:9横幅，16:9，4K\n```\n\n**A 轨完整示例（PACK-02 三视图 · 逐字参考）**：\n```prompt\n古装真人实拍电影剧照，35mm定焦镜头光学摄影质感；角色设定三视图（Turnaround Sheet）：@李梅，圆脸尖下巴柳叶眉杏眼，栗色齐肩微卷发素色发夹，米白针织开衫+浅杏色连衣裙，帆布托特包斜挎；A-Pose双臂自然微张约30度防袖身粘连，双脚与肩同宽；正面、左侧面、背面三视角等距水平排列，同一角色三个视角比例严格一致（非三个人物，非合影），全身完整造型含背面斜挎包带走向；360度环形无影棚拍柔光，均匀漫射平光，漫反射固有色贴图质感（Flat Lit Albedo / Diffuse Pass），正交投影相机零透视畸变，中性18%灰背景，电影级写实质感，真实皮肤纹理与织物细节，8K超高清电影感，16:9横幅，16:9，4K\n```\n\n## 五、三视图切分单人参考防多头怪指南（四步）\n\n**问题**：视频/单镜生图模型把三视图识别为\"三个人同框\"→ 复制人、全员乱张嘴、串脸（崩坏05/06 前置）。\n1. **选格**：从三视图裁\"正面\"单格（侧面格备侧拍镜）。\n2. **补图**：分辨率不足时以该格为图生图参考（重绘 0.3）重出高清单人——用母版⑤。\n3. **特写**：另出母版④ 面部特写——多图参考锁脸首选。\n4. **入位**：即梦素材位\"立绘 1 位+特写可选 1 位\"；ComfyUI PuLID/IP-Adapter 挂特写；可灵首帧用立绘合成图。\n**红线**：素材位/首帧/ControlNet 参考位出现完整三视图或矩阵图=防呆违规。\n\n## 六、锁脸手段权重表（跨镜一致性）\n\n| 手段 | 权重区间 | 平台 | 越界后果 |\n|---|---|---|---|\n| 角色 LoRA | 0.6~0.85 | ComfyUI | >0.9 塑胶脸 |\n| PuLID | 0.6~0.8 | Flux/SD | >0.8 表情锁死 |\n| IP-Adapter | 0.5~0.7 | 通用 | >0.7 串风格 |\n| 素材位参考 | 立绘1位+特写1位 | 即梦 | 多位稀释串色 |\n| 尾帧接力 | 有中帧锚≤3段／裸链≤2段 | 全平台 | 裸链第3段脸漂(崩坏09)；调和铁律见 KB_08 五节 |\n| 首帧重锚 | 每 5 秒 | 全平台 | 连续镜身份漂移 |\n\n## 七、资产图质检对照清单（送 KB_10 前自检）\n\n- [ ] 三视角同比例同间距无透视？ [ ] **项目 PACK-XX 维度③对应轨道词组逐字在**（A 轨 Albedo／B 轨平涂柔光／C 轨视口柔光／B-Cel 轨设定稿平光）、无否定式残留、无跨轨混用？\n- [ ] A-Pose 手臂与躯干间空隙可见？ [ ] 背景纯白/18%灰无环境元素？\n- [ ] 矩阵九格同一张脸（骨相同源）？ [ ] 画风锁挂载且按维度②矩阵取对应时代×类型锁？\n- [ ] 画幅+分辨率标注？ [ ] ④⑤单人参考图已入生产计划？ [ ] 机位库宫格九格同一时段同光位、关键陈设跨格拓扑一致、机位序逐格标注（R9-20261006-6）？ [ ] 分区板/轮转板上排（头部格）骨相同源、下排（全身格）部件一致、与注册表摘要同脸同套（R9-20261006-7）？\n- [ ] 英文模型使用时对照串已附？ [ ] 道具三视图含三级结构+记忆点？"},{"p":"kb_library/KB_07_构图与资产板规范.md","t":"KB_07 构图与资产板规范（高密度工业速查版）","d":"","raw":"# KB_07 构图与资产板规范（高密度工业速查版）\n\n> 用途：导演分镜与美术资产板的构图权威词库——分镜表\"构图\"字段唯一词源，执行防崩补丁2（竖屏自适应）。\n> 本册包含：通用构图 12 式 ｜ 多人分区句式 6 式 ｜ 横屏法则 8 ｜ 竖屏法则 7 ｜ 轴线规则 6 ｜ 资产板版式 10 式 ｜ 景别 8 级 ｜ 构图组合速查矩阵 —— **合计 55+ 词条**。\n\n---\n\n## 一、通用构图法则词典（12 式）\n\n| 构图法 | 描述词（直接入 Prompt） | 心理效果 |\n|---|---|---|\n| 中心构图 | 主体居中、对称稳定 | 威严、压场（@林烬比武台） |\n| 三分法 | 主体落于左/右三分线 | 自然、电影感 |\n| 黄金螺旋 | 视线沿螺旋落点汇聚 | 引导聚焦 |\n| 对角线构图 | 主体沿对角线排布 | 动势、冲突 |\n| 引导线构图 | 街道/灯串纵深线条引向主体 | 纵深（@光大街边） |\n| 框式构图 | 门窗/门洞框住主体 | 窥视、宿命 |\n| 对称构图 | 中轴严格对称 | 仪式、庄严 |\n| 留白构图 | 大面积负空间 | 孤独、意境 |\n| 前景遮挡 | 前景虚化人群/花枝遮一角 | 临场、偷窥感 |\n| 三角形构图 | 三主体/三元素成稳定三角 | 稳定博弈 |\n| L形构图 | 主体占一角+延伸线 | 闲适、叙事角落 |\n| 满构图 | 主体充满画面无留白 | 压迫、冲击 |\n\n## 二、多人空间分区句式库（6 式 · 防崩补丁1 防串色必用）\n\n| 情形 | 标准句式（象限+体型差+服装色差三重锚定） |\n|---|---|\n| 双人并行(横屏) | `画面左侧三分之一为成年女性@A（身高约一米六五，[服装主色]），右侧三分之二为孩童@B（身高约一米一，[服装主色]），两人[间距/互动]` |\n| 双人对峙 | `画面左前侧@A（高位俯视感站位），右后侧@B（低半头），两人相距两臂对峙` |\n| 过肩主客 | `越过@B的右肩与后脑（画面右下角虚化剪影）拍摄@A（主体占画面左侧三分之二）` |\n| 前后纵深 | `前景层为@A半身背影虚化，中景焦点为@B清晰` |\n| 上下分区(竖屏) | `上半画面为站姿@A，下半画面为蹲姿仰视的@B` |\n| 群像压角 | `主体居中，人群虚化剪影分布于画面四角外圈` |\n\n## 三、16:9 横屏构图法则（8 条）\n\n1. 允许横向大空间铺开：`宗门广场横向铺开、人群两侧环形围绕、建筑群水平展开`。\n2. 中心构图+横向展开=压场标配。\n3. 三分法+引导线=街景标配。\n4. 对称纵深=殿宇标配。\n5. 对话正反打：标准过肩（越A肩拍B ↔ 越B肩拍A，轴线两机位）。\n6. 群像两翼展开+主体中轴。\n7. 横移运镜配横向长景深（走廊/河流）。\n8. 宽幅全景奇观（云海/战场）最大化画幅优势。\n\n## 四、9:16 竖屏构图法则（7 条 · 防崩补丁2 强制）\n\n1. **前中后大纵深叠压**：`前景虚化美食摊白雾，中景母子主体清晰，远景居民楼暖灯虚化`——纵深换横向信息。\n2. **上下高低机位对角线**：高机位俯拍仰望/低机位仰拍俯身；或人物从头到脚沿对角线贯穿。\n3. **竖屏紧凑过肩正反打**：面部占画面高 ≥1/3。\n4. 禁用横向铺开构图（防崩补丁2 明令）。\n5. 双人同框用上下半分区替代左右分区。\n6. 字幕安全区：底部 15% 预留，构图下沿避开关键信息。\n7. 远景慎用（人物过小），多用中近景/近景/特写。\n\n## 五、轴线与机位半圆规则（6 条）\n\n1. 180 度轴线：一场戏确立轴线（A→B 连线或运动方向线）后，所有机位位于同侧半圆。\n2. 越轴=观众方向感崩塌；分镜表必写轴线声明（谁左谁右+机位半圆侧）。\n3. 合法越轴三法：中性镜（正对/背对轴线骑轴）过渡｜动作剪辑点越轴（大幅动作顶点帧遮）｜主体改写轴线（转身/走动+跟随镜交代）。\n4. 多轴线同场（三人+）：以主对手戏二人连线为主动轴，第三人插入镜处理。\n5. 运动轴线：人物转身改方向=轴线改写，须在分镜备注留痕。\n6. 正反打成对出图（防色温跳变，联动 IMG-02）。\n\n## 六、资产板排版规范（10 式）\n\n| 板类型 | 版式规范 | 必含元素 |\n|---|---|---|\n| 角色资产设定板 | 2x2 或 1x3 网格 | @资产名水印、比例尺、画风锁标注 |\n| 三视图板 | 正/侧/背等距水平排列+顶部标题栏 | A-Pose、18%灰背景 |\n| 表情矩阵板 | 3x3 九宫格、格间留白 | 每格表情标签（具体面部动作） |\n| 场景全景板 | 单幅大图+右下角细节放大 | 光源方向箭头标注 |\n| 场景机位库板（R9-20261006-6） | 3x3 九宫格·格间留白（室内降 2x2） | 每格机位标签（固定机位序·同一时段同光位·格序登记注册表） |\n| 人物头身分区板（R9-20261006-7） | 3+3：上排三角度头像特写+下排无头人台正侧背 | 头部骨相词+服饰部件词双区标注（上排同一张脸/下排同一套服饰） |\n| 非人形分区轮转板（R9-20261006-7） | 3x2：上排头部三视角特写+下排全身三视角 | 尺寸标注（体长/体高）+形体记忆点（六格同一生物同一比例） |\n| 道具三视图板 | 正/侧/背+一格特写 | 材质标注（KB_04 索引） |\n| 多宫格分镜垫图 | 2x2 四格按时间顺序 | 每格秒区间标注 |\n| 双人组合立绘板 | 固定站位（A左B右）+身高差标尺 | 间距数值、互动关系 |\n\n## 七、景别词典（8 级 · 分镜表字段唯一来源）\n\n| 景别 | 取景范围 | 功能速记 |\n|---|---|---|\n| 大远景 | 环境主导，人物极小 | 定世界 |\n| 远景 | 全身+大量环境 | 定关系 |\n| 全景 | 全身+少量环境 | 定动作 |\n| 中景 | 膝上 | 定互动 |\n| 中近景 | 腰上 | 过渡铺垫 |\n| 近景 | 胸上 | 给情绪 |\n| 特写 | 面部 | 给爆点 |\n| 大特写 | 眼/手/物局部 | 给细节针脚 |\n\n**竖屏建议**：多用中近景/近景/特写；远景慎用。\n\n## 八、构图组合速查矩阵（题材×画幅×构图三维索引）\n\n| 题材场景 | 16:9 首选组合 | 9:16 首选组合 |\n|---|---|---|\n| 压场立威 | 全景+中心构图+仰拍 | 对角线贯穿+低机位仰拍 |\n| 街道行走 | 远景+三分法+引导线 | 三层纵深叠压+缓推 |\n| 双人对白 | 过肩正反打+紧凑构图 | 竖屏过肩(面部≥1/3高) |\n| 打斗爆发 | 全景+对角线+低角度 | 高低机位对角+近景切 |\n| 空镜氛围 | 满构图/留白 | 上下留白+中心主体 |\n| 群像场面 | 两翼展开+中轴对称 | 四角压群像+中心主体 |\n| 追逐戏 | 横移跟拍+引导线 | 纵深跟拍(迎面/背跟) |\n| 回忆杀 | 框式+逆光留白 | 框式+上下留白 |\n\n## 九、构图连续性自检（场记用 5 项）\n\n- [ ] 同场次景别序列符合递进（远→全→中→近→特）或刻意跳级有戏剧理由？\n- [ ] 9:16 集全部规避横向铺开？ [ ] 多人镜头都有分区句式？\n- [ ] 机位全部位于轴线同侧（或留合法越轴记录）？ [ ] 前景遮挡元素跨镜一致？"},{"p":"kb_library/KB_08_Prompt编译器.md","t":"KB_08 Prompt 编译器（高密度工业速查版）","d":"","raw":"# KB_08 Prompt 编译器（高密度工业速查版）\n\n> 用途：框架\"编译器内核\"。所有中文提示词按本典公式查表拼装，严禁大模型用空洞形容词自由造句。\n> 本册包含：生图八层黄金语序公式（句首媒介前置铁律）+**可复制母版** ｜ 视频 20/80 差分公式+**可复制母版（三档时长）** ｜ 口型排他锁句式库 ｜ 秒级节点规范 ｜ 首尾帧/接力编译 ｜ 编译前后正反对照 ｜ 前置检查 10 项。\n\n---\n\n## 一、生图八层黄金语序公式（资产图/首帧基准图 · 句首媒介前置铁律）\n\n> **句首负向版式锁废除令（R9-20261005-17）**：明文废除在中文 Prompt 句首写 `单幅满画幅全身立绘，严禁设定集排版、多视图分格与画中画特写` 的旧版式锁——①该句霸占句首前 15 字最高注意力权重，把画种媒介挤出权重位，导致画种被前文写实人体/服饰词压垮（候补 22 实测真人化根因之一）；②\"设定集/多视图/分格/画中画\"在自然语言平台（豆包/ChatGPT/大香蕉）触发**粉色大象效应**，反向激活分格概念（实测拼图率不降反升）。版式控制一律改为**第②层正向构图锚定**（`单人全身居中立像` / `单幅侧面微距平视特写`）；ChatGPT 平台防拼图改挂**句尾规格层英文短指令** `Single full-frame illustration of one character only`（见 plat_chatgpt_image），严禁抢占中文句首权重。\n\n**八层黄金语序（按 Token 权重从高到低严格锁定 · 第①层必占句首前 15 字最高权重位）**：\n\n| 层 | 名称 | 编译内容 | 词源 |\n|---|---|---|---|\n| ① | **画种媒介前置层**（句首前 15 字最高权重） | 直接调用当前项目激活的 `PACK-XX` 维度①：古装/仙侠场=`国风仙侠漫剧插画，二维国漫工笔厚涂画风；`；现代/都市场=`现代都市漫剧插画，二维国漫厚涂画风；`（写实剧/3D剧/赛璐璐剧按 KB_05 七节对应包取词） | KB_05 七节 |\n| ② | **表情前置 + 正向构图锚定层** | 先写独立表情短句（如 `含笑，画面左侧脸颊浅现一枚梨涡；` 或 `神情隐忍倔强，`），紧接纯正向构图词 `单人全身居中立像`（或 `单幅侧面微距平视特写`）——**绝不出现\"设定集/多视图/分格/画中画\"字眼** | 本典八节3 |\n| ③ | **角色身份 + 年龄双向锚 + 同框关系锚 + 骨相记忆点层** | 身份+年龄数字双向锚（女主型防上浮配稚气锚／丫鬟型防塌缩配\"五官已长开、四肢纤长已抽条\"反锚三件套，KB_02 一节）+骨相 5~8 词+记忆点三要素（位置锚+形态比喻+数量尺寸量词，画面绝对方位）+正向排他句 `其余面部肌肤光洁无瑕`；多人同框加同框关系锚（KB_02 九节） | KB_02 |\n| ④ | **服饰四件套与关系色层** | 版型+面料+配色+工艺细节；主仆邻色系／情侣互补色呼应（KB_03 第9律） | KB_03/KB_04 |\n| ⑤ | **姿态手部与道具分层复述层** | 单一明确姿态；全身立绘主图**绝对禁止描写戒指/手串等微距级细小配饰**（否则100%崩手）。手部处理采取双轨制：① 优先【空手自然态】（如：双手空无一物自然下垂，五指自然并拢）保证姿态自然；② 若大模型反复穿模或为配合人设，才降级使用【藏拙法】（如：双手背于身后/插兜）。微细道具一律强制剥离交由独立『道具特写资产』承载。**【载具/掩体嵌套遮挡法则】：当人物处于载具内（如马车、船）或掩体后（如桌案、柜台）时，绝对禁止描写全身完整穿搭（尤其是鞋履和下摆）！必须显式写明物理遮挡状态（例如：\"傲立于敞篷王辇之上，大腿以下被车厢栏杆遮挡\"），强迫 AI 接受遮挡，否则 AI 会为了展现全身衣服把人物强行拉出车外变成车夫。** | KB_03 |\n| ⑥ | **空间环境三层分句层**（场景/首帧适用） | `前景层为[元素+虚实]，中景层为[主体+象限量化]，背景层为[延伸+虚化]`。**【特写多肢体防融合铁律】：若为两人以上的肢体交互特写（如递物、针刺、拼刀），必须为每个肢体给定相对/对角线的「绝对入画坐标」（如：\"自左上角伸入\" vs \"自右下角横置\"），绝对禁止只写\"手拿某物\"导致 AI 算力原点坍缩缝合肢体。** **【透视与焦段匹配铁律】：绝对禁止在 Prompt 中制造物理空间悖论（如：同时要求\"高角度俯瞰全景\"与\"前景特写桌上的小碗\"）。大模型无法同时满足宏观视角与微观前景，会导致桌椅强行悬空上天！全景机位的前景只能写大尺度景物（如大树干、屋檐），若要刻画微距道具，必须强制降机位（如写明\"桌面微距低机位平视\"）。** **【微距空镜防穿帮法则】：纯微距镜头（如植物、桌上小物件）严禁对背景彻底放权！大模型极易触发\"生态地貌幻觉\"（如给盆栽配群山背景）。必须采取双重防护：1. 垫图级：必须垫入该场次的【场景全景图】，用以锚定背景建筑质感；2. Prompt 级：必须在文本中显式切断自然地貌（如：\"背景为虚化的高墙与厢房，绝对禁止出现远山、旷野等自然地貌\"），并配合\"极大光圈虚化\"压制全景图带来的高低机位透视冲突。** | KB_07 |\n| ⑦ | **光影质感与背景层**（按风格包绑定轨道分流） | 直接调用项目 `PACK-XX` 维度③：漫剧/插画走 **B 轨平涂柔光**、真人写实走 **A 轨无影棚**、3D 走 **C 轨视口柔光**、赛璐璐走 **B-Cel 轨**（KB_06 四轨互锁）；场景/首帧图另内联 `@光位常量` 纯文本 + `高光不过曝保留面部细节` | KB_06 |\n| ⑧ | **尾锁与规格层** | 对应时代与类型的画风锁**纯文本展开**（按 `PACK-XX` 维度②矩阵＝[古装/奇幻 vs 现代/都市]×[人物/场景/道具] 取锁）+ 画幅重复防漂移 `16:9横幅，16:9，4K` | KB_05 |\n\n**可复制母版（生图 · 八层黄金语序）**：\n```prompt\n[①媒介]国风仙侠漫剧插画，二维国漫工笔厚涂画风；[②表情前置短句]，单人全身居中立像：[③身份+年龄双向锚+骨相5~8词+记忆点三要素+正向排他句]；[④服饰四件套+关系色呼应]；[⑤单一明确姿态+空手自然态或藏拙法（双手空无一物五指并拢 / 双手背于身后，严禁描写微小配饰）]；[⑥前景层为…（场景/首帧适用，人物资产图改写\"前景人物全身实焦，背景纯白无接缝景深外柔化\"）]；[⑦轨道光影（按PACK-XX维度③）+高光不过曝保留面部细节]；[⑧画风锁纯文本]，16:9横幅，16:9，4K\n```\n\n**编译成品示例①（@沈小满主图 · PACK-01 · B 轨平涂柔光）**：\n```prompt\n国风仙侠漫剧插画，二维国漫工笔厚涂画风；神情隐忍倔强，单人全身居中立像：十六岁少女沈小满，圆润杏眼瞳色浅琥珀微微低垂，柳叶眉，鼻梁小巧微翘，唇珠饱满轻抿，鹅蛋脸稚气中带倔强，自然黑长发束高马尾额前两缕碎发，娇小匀称身形身高一米六二，脸颊微带少女圆润感，肤色白皙如瓷；素青色交领襦裙（窄袖衫裙制式，粗棉麻面料，素青+月白配色，衣摆两处细密补丁工艺），腰系旧布带；站姿端正，双手空无一物自然下垂，五指自然并拢；前景人物全身实焦，背景纯白无接缝景深外柔化；平涂式均匀柔和平光，光影平面化处理，标准正面立绘构图，保持插画固有色与笔触质感，全身完整入画；仙侠唯美漫剧质感，新中式工笔厚涂，肤若凝脂衣袂仙气流转，8K高清，16:9横幅，16:9，4K\n```\n> 示例①第⑤层按双轨制执行空手自然态；玉戒等微距配饰已剥离——由独立道具特写资产（@饕餮戒）承载（KB_03 四节）。\n\n**编译成品示例②（@林烬主图 · PACK-02 · A 轨无影棚——仅当项目绑定真人写实包时使用此轨）**：\n```prompt\n古装真人实拍电影剧照，35mm定焦镜头光学摄影质感；神情冷峻，单人全身居中立像：青年剑修林烬，鹅蛋脸下颌线锋利，剑眉入鬓丹凤眼漆黑瞳，鼻梁高挺薄唇微抿，黑色长发束高马尾额前两缕碎发，九头身挺拔，冷白皮细腻；玄黑窄袖劲装（玄铁锦缎，玄黑+银线，云纹暗绣皮甲缚带），腰束墨玉扣腰封，右手负剑焚天断剑于背后；站姿笔直，双手负于身后五指自然并拢，左手虎口旧疤清晰可见，双手空无一物；前景人物全身实焦，背景纯白无接缝；360度环形无影棚拍柔光，均匀漫射平光，漫反射固有色贴图质感（Flat Lit Albedo），正交投影相机零透视畸变，全身完整入画；电影级写实质感，真实皮肤纹理与织物细节，8K超高清电影感，16:9横幅，16:9，4K\n```\n\n> 轨道互锁警示：示例②的 A 轨词组（无影棚/正交投影相机/Flat Lit Albedo）与\"电影级写实质感/真实皮肤纹理/8K超高清电影感\"锁**只允许在 PACK-02 项目出现**——在 PACK-01 漫剧项目中出现任一词即触发 KB_10 G4/G9 ◆ 一票否决（维度④排斥禁词）。\n\n## 二、视频差分编译公式（I2V 核心 · 20% 锚点 + 80% 动态）\n\n**八层分解表**：\n\n| 层 | 占比 | 内容 | 词源 | 违规判定 |\n|---|---|---|---|---|\n| 锚点层 | ~20% | @资产名+骨相词 ≤2/人 | KB_02 掐尖 | 超 2 词=V2 否决 |\n| 运镜动态 | 80%内 | 单一运镜 或 **运镜连续渐变序列**（推近→上摇→横移，一镜到底·R9-20261006-5）+幅度词 | KB_11 三/五节 | 机位**跳切**或渐变与内容矛盾=V9 扣分 |\n| 主动作 | 80%内 | 1 个（可跨节点） | 分镜秒级节点 | 第 2 主动作=V3 否决 |\n| 次级微动作 | 80%内 | 1 个（指节收紧/睫毛颤） | KB_02 八节 | 点缀不抢戏 |\n| 材质动态 | 80%内 | 衣摆/发丝/白雾/尘埃 | KB_04 三节 | 环境死板=画面假 |\n| 光影变化 | 可选 | 光斑移动/天光渐暗 | KB_04 四节 | 强逆光=崩坏10 |\n| 口型层 | 独立 | 台词写\"嘴唇随台词自然开合\"+排他锁（多人）；静默镜写\"双唇闭合\"表演声明 | 本典三节 | 缺失=V5/V6 否决 |\n| 画风层 | 末尾 | @画风锁+缀+画幅+秒数 | KB_05 | 缺失=V11/V12 扣分 |\n\n**可复制母版（三档时长）**：\n\n```prompt\n【5秒标准式】[锚点层]@资产（≤2词）[场景定位]，[00-02s]镜头[运镜+幅度]，[材质动态]+[环境动态]；[02-05s][主动作]+[次级微动作]，[光影变化可选]，[口型/静默声明]，@画风锁+[缀]，16:9，5秒\n```\n```prompt\n【3秒对白式】[锚点层]，[00-00.8s][铺垫微动作]；[00.8-03.0s][台词(引号+语气)+口型排他锁]，@画风锁+[缀]，16:9，3秒\n```\n```prompt\n【10秒长条式】[锚点层]，[0-2秒]…；[2-5秒]…；[5-8秒]…；[8-10秒]…（每段一个次级动作递进，主动作只在其中一段）；[第15秒类中段重锚@资产名]；@画风锁+[缀]，16:9，10秒\n```\n\n> **母版占位符警示（八节7）**：母版中的 `@画风锁` 等为**编译占位符**——编译产出的成品代码块必须将其展开为锁全文纯文本，严禁成品里残留任何外壳（母版本身不是可直发 Prompt）。\n\n**编译成品示例（差分视频）**：\n```prompt\n黑衣长发@林烬立于@玄天宗比武台中央，[00-02s]镜头低角度缓慢推近，衣摆与额前碎发被罡风掀起轻扬，雷云天光渐暗翻涌；[02-05s]他缓缓抬眼扫视四周，右手取@焚天断剑自下而上划出弧线斜指前方，剑身暗红纹路亮起，气流掀动衣摆与马尾定格，台下人群剪影后倾半步，雷云中一道银白光柱落台，双唇闭合无张嘴动作，电影级东方新国风写实厚涂质感，细腻皮肤纹理与织物纤维细节，volumetric 体积光氛围，高对比冷暖双色温影调，8K超高清画质，电影感构图+冷青蓝主调剑气银白高光，16:9，5秒\n```\n\n## 三、口型排他锁句式库（含音频可替换原则 · 6 句式）\n\n| 场景 | 句式（逐字可复制） |\n|---|---|\n| 多人双锁 | `说话者@X抬头张嘴说话，嘴唇随台词自然开合：\"[台词]\"（[语气+TTS控制符]）；一旁的@Y保持双唇闭合、[神态]倾听，不发一言` |\n| 单人台词 | `@X张嘴说话，嘴唇随台词自然开合：\"[台词]\"（[语气]）` |\n| 静默镜闭唇 | `双唇闭合无张嘴动作`（防全员乱张嘴，崩坏05 对静默镜同样生效——此为表演声明，非音频约束） |\n| 倾听者纪律 | `@Y双唇闭合微笑倾听` |\n| **音频可替换原则**（R9-20261005-2，废止\"模式A/B双管线\"与\"闭嘴基底\"） | 生成视频原生音频仅占位参考；不满意**不重抽、不强制闭嘴**——后期静音原视频轨 → 导入外部 TTS 台词音频 → 剪辑手动对齐口型（±2 帧微调）；AI 对口型（LatentSync/剪映）为可选加速工具，不再是强制管线 |\n| 平台注 | 原生音频端（即梦/MiniMax H3/可灵）直出音频可作参考轨；无声端（ComfyUI Wan）照常写口型动作，后期统一 TTS 轨替换 |\n\n## 四、秒级节点编译规范（6 条）\n\n1. 格式 `[00-02s]` / `[0-2秒]`（即梦用\"秒\"字式）；节点数 ≤3；间隔 ≥1 秒。\n2. 全部对齐 0.5 秒网格（继承 NARR-03 精算）；禁\"持续地/渐渐地\"无锚词。\n3. 一镜一主动作**链**（先后递进合法，一镜到底·R9-20261006-5）；同时并发多主动作仍非法；主动作链+微动作+环境动态为帧内并发上限。\n4. 台词节点写 `[1.5-4.0秒] 开口说台词（\"…\"，语气）`，时长=字数÷语速+停顿。\n5. 30 秒长条节点可加密至 5~7 段，每段仍单动作，第 15 秒重锚。\n6. 换运镜指令（MiniMax 类）必须落在节点边界。\n\n## 五、首尾帧与尾帧接力编译规范（R9-20261006 升级·一镜到底拆解重组法）\n\n- **首尾帧**：Prompt 只写中间过渡运动；`运镜幅度匹配首尾画面差异`（可灵铁律）；禁复述起止静态。\n- **多图参考（Keyframe Interpolation · 一镜到底三段管线）**：向视频大模型同时喂入首帧、**中帧**、尾帧关键帧，用图像强制锁定物理运动轨迹——每段 Prompt 只写该段区间内的过渡运动；**中帧锚是 A/B/C 三段管线的成立前提**（抵消接力误差累积，防第 3 段脸漂崩坏09），中帧关键帧由 IMG-02 前置资源策划产出（首帧同源改三点法）。\n- **尾帧接力（Tail-to-Head）**：`以上一镜尾帧为首帧`；锚点压至 1 词；Prompt 只写增量（新增动作/光移/表情递进）；**接力链调和铁律：有中帧图像锚 ≤3 段；无中帧锚的纯尾帧裸链 ≤2 段、第 3 段重锚全量首帧**（误差累积漂移是接力段的固有税）。\n- **拼接交棒（→R8）**：接力段在剪辑软件拼接实现伪\"一镜到底\"——帧级对位/匹配剪辑/接缝隐藏规范见 R8 剪辑技能「接力段拼接」节。\n\n## 六、编译前后正反对照（❌ 自由造句 → ✅ 查表编译）\n\n❌ **编译前（自由造句）**：\n> 一个很帅的黑衣剑客站在气势恢宏的比武台上，周围人山人海，天空电闪雷鸣，他潇洒地拔出剑指向前方，气场全开，画面震撼，电影感拉满。\n\n✅ **编译后（查表）**：\n> `黑衣长发@林烬立于@玄天宗比武台中央，[00-02s]镜头低角度缓慢推近，衣摆与额前碎发被罡风掀起轻扬，雷云天光渐暗翻涌，台下人群剪影静立；[02-05s]他缓缓抬眼扫视四周，右手取@焚天断剑自下而上划出弧线斜指前方，剑身暗红纹路亮起，气流掀动衣摆与马尾定格，台下人群剪影后倾半步，雷云中一道银白光柱落台，双唇闭合无张嘴动作，电影级东方新国风写实厚涂质感，细腻皮肤纹理与织物纤维细节，volumetric 体积光氛围，高对比冷暖双色温影调，8K超高清画质，电影感构图+冷青蓝主调剑气银白高光，16:9，5秒`\n> **差异**：人山人海→人群剪影（串脸防线）｜潇洒震撼→秒级动作链（可执行）｜气场全开→物理动态+光影（可生成）｜补口型锁与规格。\n\n## 八、实测增补铁律（R9-20261005 固化 · E01 首轮 20 图复盘产物）\n\n1. **特征词三要素铁律**：人物记忆点特征（痣/疤/雀斑/梨涡等）必须写全三要素——①**位置锚点**（骨点+量距）②**形态比喻**（形似落墨一点/细盐粒轻撒）③**数量与尺寸量词**（一枚/疏落三两点/直径约一毫米/极淡浅褐色）。\n2. **方位绝对方位铁律（防镜像）**：Prompt 一律使用**画面方位**（\"画面左侧眉尾\"=\"viewer's left\"），**废除\"人物自身左右\"双表述**（左右同现会激活双侧语义，实测增加镜像与双侧长痣概率）；正面/四分之三侧视图：人物自身右侧=画面左侧；背身视图单独标注\"背身（左右对调）\"。资产注册表摘要可保留叙事方位，编译时必须按本条换算。\n3. **表情前置铁律**：表情/情绪词从长句中拆出为**独立前置短句**置于主体描述之首（如\"含笑，画面左侧脸颊浅现一枚梨涡；\"）——实测埋在长句中的表情词两平台 100% 失效。\n4. **负向语法平台分流铁律**：独立负向框平台（ComfyUI/SD/Flux 系）→ 挂 KB_09 负向包；**纯自然语言平台（ChatGPT/大香蕉/豆包）严禁堆砌\"不要X/无X\"式否定**（粉色大象效应：越说不要越画出来）→ 一律转化为**正向排他句**（\"其余面部肌肤光洁无瑕\"\"双手空无一物\"\"疏落六七人全部背身或侧身剪影\"）。**版式/机位级约束亦不例外**：不得占用句首权重位、不得出现\"设定集/多视图/分格/画中画\"字眼——版式控制一律改为第②层正向构图锚定（一节八层语序）；ChatGPT 平台防拼图唯一合法形态＝句尾规格层英文短指令（R9-20261005-17，与 plat_chatgpt_image 同步）。\n5. **@光位常量铁律**：每个场景资产定义 ≤25 字光位常量（高浓度短语，登记格式：`[光位锁：午后西晒，左后方45°冷白主光，暗部青灰无暖光污染]`，存档于注册表/文档常量表），该场景所有首帧/分镜 Prompt 一致挂载，与轴线声明同级——**编译进 Prompt 代码块时剥除 `[光位锁：…]` 外壳只留内文纯文本**（八节7）；实测同场景三平台光向互相矛盾，跨镜光影跳变。\n6. **道具锁形双保险铁律**：重要道具 `@引用仅为索引`，Prompt 必须复述关键形态三要素（造型+材质+工艺/尺寸）；**跨平台垫图时**必须声明垫图类型（角色面部参考 Character Ref / 构图参考 Composition Ref）且首句保留核心记忆点文字复述——实测跨平台图生图会洗掉微特征（泪痣/蟒纹/玉戒）。\n7. **代码块 100% 纯净直发铁律（R9-20261005-5）**：```prompt 代码块＝可直接复制进平台输入框的最终态——画风锁/光位锁一律写入**展开后的纯文本**，严禁 `@画风锁`、`@画风锁_人物（…）`、`[光位锁：…]` 等变量名外壳与 `（体积光替换为均匀漫射平光）` 类编译器备注残留在代码块内污染模型语义（注册表与文档常量表的登记格式、母版占位符不受此限）；所属锁类别与替换说明移至代码块下方\"评分明细\"行。**首次文生图资产主图**（无前置参考图可 @ 绑定）：块内人物/道具名一律去 @ 直书（写 `少女沈小满` 不写 `少女@沈小满`），佩戴道具必须按三要素文字复述（写 `左手中指戴一枚蜜黄玉质细金线包边的古朴饕餮纹玉戒`，与八节6 双保险联动），严禁只写 `@饕餮戒`。\n8. **句首媒介前置与八层黄金语序铁律（R9-20261005-17，候补 22/24 转正固化）**：生图 Prompt 一律按一节**八层黄金语序**编译——**第①层画种媒介前置词必占句首前 15 字**（调用项目 `PACK-XX` 维度①，古/现时代分流）；**句首负向版式锁已明文废除**（`单幅满画幅全身立绘，严禁设定集排版…` 整句禁用，理由＝霸占句首权重压垮画种 + 粉色大象反向激活分格概念），版式控制改由第②层正向构图锚定承担（`单人全身居中立像`/`单幅侧面微距平视特写`）；第⑦层光影按风格包维度③轨道分流（PACK-01=B 轨平涂柔光，严禁摄影工程词）；第⑧层尾锁按维度②矩阵取对应时代×资产类型锁。违反任一层序＝KB_10 G9/V11 ◆ 一票否决。\n9. **场景多机位资产注册法则（R9-20261006 立 · 20261006-9 补强）**：**【场景多机位资产注册法则】：在阶段Ⅱ（视觉资产开发）构建高频核心场景（如主角居所、主城街道）时，绝对禁止只生成单一视角（尤其是上帝视角全景）。为了防范阶段Ⅲ（分镜垫图）引发的\"垫图透视权重悖论\"，必须为核心场景强制配置至少 2 张基准图：1张用于交代宏观环境的「高角度全景基准图」，1张用于人物对话与特写垫图的「平视/低机位基准图」。**（与总控补丁7 垫图机位三分法联动：分镜机位就近匹配同机位基准图，机位冲突宁盲抽不垫图。）**20261006-9 补强：S/A 级主场景在 2 张基准图之上**强制加建机位库宫格**（室外 3x3／室内 2x2 防格间漂移，每格登记机位语义入注册表）——实测仅 2 张基准仍会出现\"一刀切垫全景\"把近景/过肩镜背景锁死为建筑全貌且 I2V 整段继承（黑名单 37）。**20261006-11 再补：机位库必垫本场景全景基准图作图生图参考生成（官方参考图两部式，禁文生图盲抽——实测盲抽仅 6/9 格可用），首选单画布多角度宫格（豆包 App 实测通过 2026-10-06 用户验证——一张图管九机位=指定格垫载体+裁格弹药库；\"生成N张图\"多图输出仅作单机位补产备选，KB_06 母版⑧ V2），注册表登记紧跟其场景资产行（衍生资产位）**。宫格跑通后作为分镜垫图弹药库，按优先级三路使用（补丁7 档②）：**首选【宫格指定格垫】**——上传整张宫格图 + Prompt 追加\"背景机位取场景参考宫格图的第X格视角，忽略宫格排版与留白边\"（九机位同出一图，跨镜环境天然同源，切镜头不穿帮）；**实测两雷任一触发即降级【裁格垫】**——a.版式传染（成图变九宫格排版）b.取错格：裁对应格补高清后单独上传；大虚化近景/特写镜可退【卸垫盲抽】（文字背景层承载，八节11），中浅景深镜禁用盲抽（环境漂移=跨镜穿帮）。\n10. **三层术语消歧铁律（R9-20261006-8 立 · 用户裁决）**：空间层次三句统一用**「前景层／中景层／背景层」**——\"层\"字锚定纵深维度，杜绝层词与景别词（中景=medium shot／远景=long shot）双义撞车（近景/特写构图下模型可能把\"中景为…\"误读为半身景而拉远取景）；第三层锁定\"背景层\"（background 零歧义＋与资产图\"背景纯白\"用语一致），不用\"远景层\"。景别词（中景平视／远景俯瞰／近景特写）照常使用，与层词并存不冲突；单主体资产图的\"前景人物实焦，背景纯白\"短语（非三层分句模式）不变。\n11. **背景层景别匹配律（R9-20261006-9 立 · 垫图机位锁死实测）**：背景层描述的**内容尺度必须与镜头景别同缩放**——近景/特写镜的背景层只写**局部级背景词**（\"虚化的门钉墙一角／檐影色块／灯笼虚光\"），严禁建筑全貌词（\"大门／正门全景\"）：全貌词+全景垫图双重夹击会把完整建筑拉进近景背景（实测：胸前近景镜背景生成完整朱漆大门，门钉石狮灯笼俱全）；远景/全景镜才允许建筑全貌词。**卸垫盲抽镜头尤其依赖本律**——卸垫后文字背景层就是唯一取景指令，必须以局部词+虚化词把背景压到与景别匹配的尺度。\n\n## 九、编译前置检查清单（10 项 · 评分官 R7 依据）\n\n1. [ ] 所有 `@资产` 在注册表内且名称纯中文？\n2. [ ] 生图八层黄金语序齐全（①句首媒介就位且古/现时代匹配？②表情前置+正向构图锚定？③年龄双向锚+记忆点三要素+排他句？④四件套？⑤手部/道具分层？⑥场景三层？⑦轨道光影？⑧尾锁+规格）？视频锚点 ≤20%、动态 ≥80%、单主动作、节点 ≤3？\n3. [ ] 主代码块**零句首负向版式锁残留**（无\"单幅满画幅…严禁设定集排版…\"整句、无\"设定集/多视图/分格/画中画\"字眼）？\n4. [ ] 多人：分区句式+口型排他锁+同框关系锚齐备？\n5. [ ] 台词：时长测算完成且与镜长匹配？台词镜写\"嘴唇随台词自然开合\"/静默镜写闭唇声明（多人配排他锁）？\n6. [ ] 末尾画风锁**纯文本展开**挂载（按 `PACK-XX` 维度②矩阵取对应时代×类型锁，无 `@画风锁`/`[光位锁]` 外壳与编译备注——八节7）？画幅+分辨率/秒数标注？\n7. [ ] 崩坏词规避（十指交叉/360度/镜内切镜/狂奔/强逆光首帧）＋**项目风格包维度④排斥禁词零命中**（KB_10 G9/V11 ◆）？\n8. [ ] 词条均出自 KB_01~07/11 原词（无自造同义词）？\n9. [ ] 实测增补铁律（八节）执行：记忆点三要素？画面绝对方位（无\"人物自身左右\"双表述）？表情前置？自然语言平台用正向排他（无\"不要X\"堆砌）？@光位常量 ≤25 字？道具跨平台垫图双保险？首帧背景层与景别同缩放（八节11，近景无建筑全貌词）？垫图指引带机位匹配档位（同档／裁格第X格／卸垫盲抽·补丁7）？\n10. [ ] 代码块纯净直发（八节7）：零变量外壳/编译备注？首次生图块内已去 @ 直书？佩戴道具三要素复述齐备？"},{"p":"kb_library/KB_09_错误修正与Negative_Prompt.md","t":"KB_09 错误修正与 Negative Prompt 词典（高密度工业速查版）","d":"","raw":"# KB_09 错误修正与 Negative Prompt 词典（高密度工业速查版）\n\n> 用途：生成翻车时的\"急救手册\"。与《全局复盘避坑黑名单》联动：黑名单定触发与根因，本典给可执行修正词与改写方案。\n> 本册包含：**17 种崩坏模式完整对照大表（编号/症状/触发/根因/Prompt级修正/技法级修正/负向词）** ｜ 生图修正词库 10 类 ｜ 标准负向词包双母版 ｜ 修正工作流 4 步。\n\n---\n\n## 一、AI 视频 17 种崩坏模式完整对照大表（一表在手 · 翻车即查）\n\n| 编号 | 崩坏 | 触发条件 | 根因 | Prompt 级修正写法 | 技法级修正 | 负向词 |\n|---|---|---|---|---|---|---|\n| 01 | 手部六指/融化 | 手部特写/快速手势 | 手部几何自由度跨帧不稳 | 改\"五指自然并拢\"\"单手握拳\"；手部出画 | OpenPose 手部控制；特写降速 | 多余手指,六指,手指粘连 |\n| 02 | 十指交叉融化 | \"十指交叉/对插\"描述 | 自遮挡超拓扑理解 | 改\"双手交叠一手覆一手\" | 避开手部特写 | 十指交叉,手指融合 |\n| 03 | 360度转身五官移位 | 单镜360度旋转/急甩头 | 旋转中面部锚点丢失 | 拆两镜+甩发Cutaway遮转场 | 可灵首尾帧锚定起止脸 | 360度旋转 |\n| 04 | 镜内切机位空间撕裂 | 一条Prompt含多机位 | 视频生成是连续单机位时空 | 一镜一机位；删除第二机位描述 | 拆镜各自生成剪辑台上切 | 镜头切换,机位跳变 |\n| 05 | 多人同框乱张嘴 | 多人+台词无口型归属 | 对白泛化到所有面部 | 口型排他锁（KB_08三节句式） | 后期静音原轨+TTS手动对齐 | 全员张嘴,多人说话 |\n| 06 | 多主体串脸 | 多人无空间分区 | 多主体特征注意力渗透 | 分区句式+身高差+服装色差三重锚 | 分镜参考图各自绑定 | 双人融合,身份混淆 |\n| 07 | 奔跑双腿穿模 | \"狂奔/疾跑/连跳\" | 腿部交替超帧间估计 | 降速\"小跑\"；半身景别 | 首尾帧锚定起止步态 | 腿部穿模 |\n| 08 | 衣袖粘连/消失 | 宽袍+大动作；T-Pose不足 | 布料自遮挡判断失败 | \"衣袂随动作自然摆动，袖口与手腕分离清晰\" | 三视图A-Pose重制 | 衣袖融合 |\n| 09 | 面部身份漂移 | 长镜/接力未刷新锚定 | 逐帧独立猜测误差累积 | 每5秒重锚@资产名 | 刷新首帧/尾帧接力（有中帧锚≤3段，裸链≤2段——KB_08 五节调和铁律） | 身份漂移,面部变化 |\n| 10 | 首帧强逆光过曝 | 首窗前剪影/背光大高光 | I2V放大首帧曝光特征 | 首帧\"柔和侧逆光、高光不过曝保留面部细节\" | 重出首帧基准图 | 过曝,高光溢出 |\n| 11 | 文字招牌乱码 | 招牌/字幕/书籍文字 | 文字渲染跨帧不稳 | \"字迹模糊虚化不可辨认\" | 剪映后期贴字 | 清晰文字,可读文本 |\n| 12 | 道具中途变形 | 手持道具换手/离画 | 道具跨帧一致性弱 | \"@焚天断剑始终握于右手、不入画出画\" | 道具特写Cutaway补 | 物体变形 |\n| 13 | 人物瞬移穿墙 | 长距离位移描述 | 大位移空间推理失败 | 单镜位移≤1身位；显式过渡动作 | 首尾帧锚定起终点 | 瞬移,穿模 |\n| 14 | 液体布料违和 | 泼水/大雨/丝绸瀑布 | 流体软体动力学失真 | 降复杂度（细雨/涟漪/轻扬） | B级静态图+剪映粒子 | 流体崩坏 |\n| 15 | 眨眼缺失/抽搐 | 长特写凝视 | 眼部微动作帧间不稳 | \"眨眼频率自然，约三秒一次轻微眨眼\" | H3微表情类平台 | 眨眼异常 |\n| 16 | 口型不同步 | 时长无测算/音频替换错位 | 音画时长失配 | 声画先行测算；剪辑静音原轨+TTS导入+±2帧手动对齐 | AI对口型为可选工具 | 口型不同步 |\n| 17 | 背景周期闪烁 | 高频重复纹理+运动镜 | 重复纹理帧间相位差 | \"背景大光圈虚化，重复纹理柔化\" | 剪映智能补帧 | 背景闪烁 |\n\n## 二、生图错误修正词库（10 类 · 正反写法对照）\n\n| # | 错误 | ❌ 失效写法 | ✅ 修正写法（正面物理式） |\n|---|---|---|---|\n| 1 | 高光阴影污染 | ~~无高光无阴影~~ | `大型柔光箱正面平光加强，固有色均匀无明暗过渡，Albedo漫反射贴图质感，均匀顶光加双侧反光板补光` |\n| 2 | 透视畸变 | ~~不要透视~~ | `严格正交投影，平行视线无消失点，等距视角，平面化贴图视角` |\n| 3 | 多指/手糊 | ~~手指正常~~ | `五指自然并拢清晰可数，手部放松垂于身侧` |\n| 4 | 三视图复制人 | ~~只有一个人~~ | `同一角色的三个连续视角，非三个人物，角色设定图（model sheet），非合影` |\n| 5 | 双人融合 | ~~分开一点~~ | 空间分区句式强化+`两人轮廓边缘清晰分离，无身体接触面融合` |\n| 6 | 文字乱码 | ~~字写对~~ | `招牌字迹虚化不可辨认，景深模糊背景元素`（清晰文字后期贴） |\n| 7 | 儿童成人化 | ~~可爱一点~~ | `幼儿头身比1:4.5，婴儿肥脸颊，大圆眼占比大，短四肢圆润` |\n| 8 | 画风漂移 | ~~保持一致~~ | `@画风锁逐字重挂+附参考图+与参考图同一画风同一笔触同一色温` |\n| 9 | 皮肤塑料感 | ~~真实皮肤~~ | `细腻毛孔可见，皮肤纹理真实，次表面散射自然` |\n| 10 | 构图跑偏 | ~~按我想的来~~ | 景别+机位+构图三词钉死（KB_07/11 原词） |\n| 11 | 场景人群露正脸 | ~~不要露脸~~ | `疏落六七人全部背身或侧身剪影，无一人面向镜头`（人数上限量化+体态正向排他） |\n| 12 | 道具俯拍产品图化 | ~~不要俯拍~~ | `镜头与道具处于同一水平高度的侧面微距平视机位，视线正对道具侧面`（实测戒指类 3/3 平台默认俯拍） |\n| 13 | 玉质金属化 | ~~不要金属感~~ | `温润半透玉质如凝脂，蜡状光泽内蕴，透光见棉絮纹理`（材质三征：半透+蜡光+棉絮） |\n\n## 三、标准负向词包（双母版 · 可直接复制挂载）\n\n**生图母版（ComfyUI/Flux/SD 系）**：\n```prompt\n多余手指, 六指, 手指粘连, 十指交叉, 面部扭曲, 五官移位, 高光过曝, 硬阴影, 透视畸变, 双人融合, 三个相同人物, 复制人, 文字, 乱码, 水印, 签名, 低分辨率, 模糊, 噪点, 肢体比例错误, 器官错误, 畸形, 过饱和, 塑料感, 画风混杂, 成人比例孩童\n```\n\n**生视频母版（支持负向输入端）**：\n```prompt\n镜头切换, 机位跳切, 人物瞬移, 全员张嘴, 多人张嘴, 口型大开, 身份漂移, 面部变化, 肢体穿模, 腿部穿模, 手指畸形, 背景闪烁, 卡顿, 拖影, 鬼影, 色彩断层, 画面撕裂, 文字出现, 水印, 360度旋转\n```\n\n**使用规则**：①只挂支持负向输入的端（ComfyUI 系）；豆包/即梦/可灵等以正向物理式规避为主，本包供平台支持时兜底。②按任务裁剪（对白镜必留口型三词；多人镜必留融合两词）。③新增崩坏编号（18+）同步补词入包（EVO-01 职责）。④**平台分流铁律（R9-20261005）**：纯自然语言平台（ChatGPT/大香蕉 Nano Banana/豆包）**严禁在正文堆砌\"不要X/无X\"式内容否定**（粉色大象效应，越说越画）——一律转为正向排他句（\"其余面部肌肤光洁无瑕\"\"双手空无一物\"），见 KB_08 八节第 4 条；指令级版式/机位约束（\"严禁多视图分格\"）不受此限。\n\n## 四、修正工作流（翻车后 4 步闭环）\n\n1. **定位**：对照第一节大表按症状命中编号（口语症状先过 EVO-01 的 4.1 字典规范化）。\n2. **改词**：套用 Prompt 级修正写法重编译——**只改崩坏相关层，其余层逐字不动**（防二次漂移）。\n3. **换法**：改词两轮仍翻车 → 升级技法级修正（ControlNet/首尾帧/降级 B 级静态图）。\n4. **归档**：触发 Prompt 片段与现象填入复盘占位 → EVO-01 归档黑名单实战区并按高频规则升级 KB_10 否决项。"},{"p":"kb_library/KB_10_资产与视频质量检查.md","t":"KB_10 资产与视频质量检查（10 分制硬性质检 · 高密度速查版）","d":"","raw":"# KB_10 资产与视频质量检查（10 分制硬性质检 · 高密度速查版）\n\n> 用途：【AI 提示词质量评分专家 R7】的唯一评分标准（完整权威版）。对每一条资产图/前置资源图/视频 Prompt 独立评分。\n> 铁律：满分 10 分，**得分 <9.0 一票否决，强制打回 R5/R6 重写**；修改指令随评分一并下发；打回 ≤3 轮，超限人工裁决。\n\n## 〇、双擎联审门禁总则（L1 Machine Linter + L2 Semantic Scorer · R9-20261005-18 立）\n\n**第一关 · L1 确定性机器硬检（`scripts/qc_linter.py`）**：负责机械语法层——查禁词残留、变量外壳（`@画风锁`/`[光位锁]`）、句首媒介前置词、尾锁画幅格式、`<details>` 零空行语法、视频时间轴节点数（≤3）与间隔（≥1.0s）、以及跨文件《资产注册表》合法性对账。**凡 `qc_linter.py` 报错未清零，R7 评分强制锁定为 0 分打回，严禁人工/AI 越权给分**——L1 未过即产出不可进入评分流程。\n\n**第二关 · L2 导演级语义智检（R7 十分制评分官）**：在 L1 机检 `PASS` 的基础上，R7 免去机械查字负担，100% 聚焦于 Python 无法判断的 **5 大深度语义与视听逻辑核验**：\n1. **人设三要素与关系色语义（G2/G3）**：记忆点是否真正包含「画面绝对方位+形态比喻+数量尺寸上限」？服饰是否落实四件套及主仆/情侣关系色呼应？\n2. **单镜动作与机位纯度（G11/V3）**：语义上是否严格\"一镜一主动作一机位\"？是否存在隐性多机位切换？是否命中双人近身抓握/夺物高危物理区需强制挂载「蒙太奇 B 计划」（VIS-01 铁律 7）？\n3. **空间象限与口型排他锁语义（G7/V5/V6/V8）**：多人同框是否具备清晰的左中右/前中后物理分区与身高差？说话者张嘴+倾听者闭嘴的排他语义是否严密无歧义？\n4. **20/80 差分编译纯度（V2/V9）**：视频 Prompt 是否严守 ≤2 骨相词，把 80% 篇幅留给物理运动轨迹、微表情四相递进与材质动态？\n5. **光位与轴线跨镜连续性（G9/V11）**：光位方向、人物左右站位是否与场次 180° 轴线声明及《跨集状态快照》完全自洽？\n\n**评分行双签格式（强制）**：产出文档评分行统一标注 `L1机检: PASS ｜ L2智检得分: 9.X / 10（通过）`——单签视为门禁未执行，文档不得定稿。\n\n**双擎与扣分表的关系**：L1 的职责已内化为 G4/G5/G9/G10/G12 的机器可判定子项（禁词/外壳/媒介/画幅）；L2 继续使用下方 G1~G12 / V1~V12 全表语义判定——双擎不改分值结构，只改执法方式（机器先扫、智检后审）。\n\n---\n\n## 一、生图 Prompt 扣分表（G1~G12 完整版 · 分值总和 10）\n\n| # | 检查项 | 分值 | 扣分判定标准（◆=否决级） | 关联崩坏 |\n|---|---|---|---|---|\n| G1 | @资产合法性 | 1.5◆ | 引用未注册资产/名称含英文数字符号；或调用资产图未产出的人物进 A/S 级露脸正戏镜（无锚生成·候选条款 R9-20261005：暂扣 0.5，黑名单实战区归档 ≥3 次后并入◆） | 09 |\n| G2 | 骨相锁定完整 | 1.0 | 缺脸型/眼型/发型关键锚点，或与注册表摘要冲突（换词=换脸） | 09 |\n| G3 | 服饰四件套 | 1.0 | 版型/面料/配色/工艺每缺一项扣 0.25 | 08 |\n| G4 | 零光影铁律（资产图 · 四轨兼容） | 1.5◆ | 资产图**按项目激活的 `PACK-XX` 维度③对应轨道评分**：轨道词组逐字在（PACK-01=B 轨\"平涂式均匀柔和平光，光影平面化处理，标准正面立绘构图，保持插画固有色与笔触质感\"／PACK-02=A 轨\"360度环形无影棚拍柔光…Flat Lit Albedo…正交投影\"／PACK-03=C 轨视口柔光／PACK-04=B-Cel 轨设定稿平光）即满分；**跨轨误用反判 ◆**——如 PACK-01 项目误用 A 轨\"无影棚/正交相机/Albedo\"任一词，或混入光影描述，一票否决 | 10 |\n| G5 | 正交与姿态（四轨兼容） | 1.0 | 三视图缺\"正交投影/A-Pose\"任一扣 0.5；**PACK-01/04 二维项目**中\"正交投影相机\"已替换为\"标准正面立绘构图/标准正面全身设定立绘\"（KB_06 四轨），以对应轨道语判分——用轨道正确语＝满分，缺对应轨构图锚定词扣 0.5 | 02 |\n| G6 | 背景规范 | 0.5 | 资产图背景非纯白/18%灰 | —— |\n| G7 | 空间分区（多人） | 1.0◆ | ≥2 人无象限+体型差句式 | 06 |\n| G8 | 崩坏词规避 | 1.0◆ | 含黑名单触发词（十指交叉/三人同框指令/强逆光） | 01/02/10 |\n| G9 | 风格预设包六维合规门禁 | 1.0◆ | ①句首媒介词（`PACK-XX` 维度①）就位且古/现时代匹配；②尾锁按维度②矩阵＝[古/现]×[人物/场景/道具]正确挂载；③全文**零命中**项目风格包维度④排斥禁词——**一旦命中任何 1 个排斥禁词，直接触发 ◆ 一票否决，强制打回重写**（R9-20261005-17 升格，候补 22/24/26 转正） | —— |\n| G10 | 画幅与规格 | 0.5 | 缺画幅/分辨率标注 | —— |\n| G11 | 单一主体动作明确 | 0.5 | 动作含糊或多动作 | 04 |\n| G12 | 语言纯净 | 0.5 | 中英混杂乱序、空洞形容词（\"唯美大气\"无实指） | —— |\n\n## 二、生视频 Prompt 扣分表（V1~V12 完整版）\n\n| # | 检查项 | 分值 | 扣分判定标准（◆=否决级） | 关联崩坏 |\n|---|---|---|---|---|\n| V1 | @资产合法性 | 1.5◆ | 同 G1 | —— |\n| V2 | 差分编译比例 | 1.5◆ | 骨相词 >2/人、堆砌穿搭（违反 20/80） | 09 |\n| V3 | 主动作链与机位纯度 | 1.5◆ | **同时并发**≥2 主动作或含机位**跳切**描述（节拍先后递进与运镜连续渐变合法——一镜到底 R9-20261006-5） | 04 |\n| V4 | 秒级节点规范 | 1.0 | 缺节点/节点>3/间隔<1秒/有台词无测算 | 16 |\n| V5 | 口型排他锁（多人台词） | 1.5◆ | 未写说话者张嘴+倾听者闭嘴 | 05 |\n| V6 | 台词口型声明 | 1.0◆ | 有台词未写\"嘴唇随台词自然开合\"；静默镜未写闭唇声明（多人场景联动 V5；音频后期可整轨替换，不再要求模式声明） | 16 |\n| V7 | 台词时长测算 | 0.5 | 有台词无字数÷语速测算 | 16 |\n| V8 | 空间分区（多人） | 1.0◆ | 同 G7 | 06 |\n| V9 | 运镜连续性 | 1.0 | 机位跳切式运镜、或渐变序列与幅度/内容矛盾 | —— |\n| V10 | 崩坏词规避 | 1.0◆ | 黑名单触发词（360度转身/狂奔/瞬移/强逆光首帧） | 03/07/13/10 |\n| V11 | 风格预设包六维合规门禁 | 1.0◆ | ①句首媒介词/画风基调（`PACK-XX` 维度①②）就位且古/现时代匹配（视频 Prompt 媒介并入尾锁画风段）；②尾锁按维度②矩阵正确挂载（含分线追加缀）；③全文**零命中**项目风格包维度④排斥禁词——**命中任何 1 个即 ◆ 一票否决**（R9-20261005-17 升格） | —— |\n| V12 | 时长与画幅标注 | 0.5 | 缺时长秒数或画幅 | —— |\n\n*计分：得分 = 10 − Σ扣分（下限 0，保留一位小数）；任一◆触发 → 强制 ≤8.9 判打回。QC-01（skill_qc_prompt_scorer_10pt）直接引用本表编号 G1~G12 / V1~V12，不维护并行表；多项◆并发时扣分取最重项、其余转修改指令。否决级速记：生图 G1/G4/G7/G8/**G9** ｜ 视频 V1/V2/V3/V5/V6/V8/V10/**V11**（G9/V11＝风格预设包六维合规门禁，R9-20261005-17 升格为 ◆）。*\n\n*宫格资产附加核查（R9-20261006-6 立 · R9-20261006-7 扩 · 叠加于 G 表之上，不占分值结构）：凡宫格/多格资产图 Prompt（表情矩阵/场景机位库/分镜垫图宫格/头身分区板/非人形分区轮转板）——缺\"每格同一时段同一光位（或上排同一颗头）/格间留白/跨格一致\"约束句 → 按 G12 扣 0.5 并转修改指令；场景机位库（KB_06 母版⑧）另须逐格标注固定机位序，缺机位标签 → 按 G11 关联扣分；头身分区板/轮转板（母版⑨⑩）另须含\"上排与下排为同一角色同一套服饰（或六格同一生物同一比例）\"头身关联句，缺失 → 按 G11 关联扣分（多格板禁入参考位红线由 VIS-05 铁律2 执法）；生成后格间一致性验收见六节。*\n\n> **2026-10-05 R9-20261005-17 门禁升级落盘记录**：①G4/G5 多轨兼容——按项目激活的 `PACK-XX` 维度③对应轨道评分（PACK-01 项目使用 B 轨平涂柔光与标准立绘构图词组直接判满分；误用 A 轨\"无影棚/正交相机/Albedo\"反判 G4 ◆）；②G9/V11 升格为一票否决项 ◆——「风格预设包六维合规门禁」（依据：候补 22/24/26 转正，画种权重被压垮/时代语境错配/跨资产画风漂移三类实战崩坏归档 ≥3 次）。\n\n## 三、17 崩坏编号 → 检查项映射表（评分官快速索引）\n\n| 崩坏编号 | 主检查项 | 崩坏编号 | 主检查项 |\n|---|---|---|---|\n| 01 手部 | G8/V10 | 10 首帧过曝 | G4/G8/V10 |\n| 02 十指交叉 | G8/V10 | 11 文字乱码 | G8/V10 |\n| 03 转身移位 | V10 | 12 道具变形 | G3/V10 |\n| 04 镜内切镜 | G11/V3 | 13 瞬移 | V10 |\n| 05 乱张嘴 | V5/V6 | 14 流体布料 | V10 |\n| 06 串脸 | G7/V8 | 15 眨眼异常 | V4（特写≥3s查眨眼句） |\n| 07 奔跑穿模 | V10 | 16 口型不同步 | V4/V5/V6/V7 |\n| 08 衣袖粘连 | G3/V10 | 17 背景闪烁 | V10 |\n\n## 四、评分输出格式（R7 → 产出文档 · 双模板）\n\n**放行模板（L1+L2 双签制 · R9-20261005-18）**：\n```markdown\n- **质量关卡得分**：L1机检: PASS ｜ L2智检得分: 9.X / 10（通过！）\n- **评分明细与使用建议**：\n  - L1 机检：qc_linter 0 错误（禁词/媒介/外壳/对账/DOM/时间轴全绿）\n  - L2 逐项核验：V1 ✓（资产在册）｜V2 ✓（锚点2词）｜V3 ✓（单主动作）｜V5 ✓（双锁齐）…\n  - 扣分说明：V9 幅度词轻微冗余 → 扣0.2（本轮已自动修正复审通过）\n  - 使用建议：参考图权重0.7｜ControlNet 0.6｜抽卡2~3次取优｜盯片点…\n```\n\n**打回模板（双签制）**：\n```markdown\n- **质量关卡得分**：L1机检: PASS/FAILED ｜ L2智检得分: 8.X / 10（打回！第N轮；L1 FAILED 时强制 0 分）\n- **打回原因**：V5 ◆ 否决——多人台词未写倾听者闭嘴状态（对应崩坏05）；证据：\"（引用原文）\"\n- **修改指令**：在 [0.8-3秒] 节点后原样追加\"一旁的@李梅保持双唇闭合、面带微笑低头倾听\"；补口型开合声明；重写后提交复审（复审前重跑 python scripts/qc_linter.py）。\n```\n\n## 五、评分流程（6 步）\n\n1. R5/R6 产出 Prompt → ` ```prompt ` 代码块封装（防崩补丁5）。\n2. R7 按对应表逐项核验，每项 ✓/✗ 附原文证据。\n3. 计分（10−Σ扣分，一位小数；◆触发强制 ≤8.9）。\n4. ≥9.0 → 放行写入产出文档；<9.0 → 打回单下发 R5/R6。\n5. 打回 ≤3 轮；第 3 轮仍 <9.0 → \"人工裁决\"上报用户并抄送 EVO-01。\n6. 评分明细随 Prompt 写入产出文档（透明可审计）。\n\n## 六、实测维度质检参考（生成之后 · 用户自查）\n\n- 资产图：三视图比例一致/无光影残留/手部可数/与锁定摘要逐项比对/矩阵同脸/机位库九格同一时段同光位且关键陈设跨格拓扑一致（任一格与俯瞰格空间矛盾＝该格废弃局部重绘，不作整图废片——R9-20261006-6）/头身分区板上排三头像骨相同源且与主图同脸、下排人台服饰部件跨格一致、无头人台不得长出头（R9-20261006-7）。\n- 视频片段：动作连贯无撕裂/口型对齐/身份稳定/背景无闪烁/道具在手。\n- 发现问题 → 填写 `Prompt 实际产出复盘：` → 触发 EVO-01（KB_09 四节修正工作流）。\n\n## 七、高频升级规则（与黑名单联动）\n\n同类崩坏在《全局复盘避坑黑名单》实战区归档 ≥3 次 → 对应检查项升为否决级（若未是）+ 分值上调 0.5 + 本表标注\"依据：实战区 N 次归档\"——由 EVO-01 执行落盘。\n\n> **2026-10-05 R9 候选条款落盘记录**：①G1 增补\"资产图未产出人物进 A/S 级露脸镜\"判定（依据：E01 镜03 @温亦舟／镜06 @沈玉罗 无锚生成风险，见黑名单实战区）；②IMG-02 同步新增铁律 7——首帧 Prompt 必附生图策略行（底图@来源/人物参考@来源/权重）且 @场景锚点不得降级为自然语言，缺项送检前退回。"},{"p":"kb_library/KB_11_导演镜头与动态运镜词典.md","t":"KB_11 导演镜头与动态运镜词典（高密度工业速查版）","d":"","raw":"# KB_11 导演镜头与动态运镜词典（高密度工业速查版）\n\n> 用途：分镜表\"景别/机位/构图/画面/运镜\"字段唯一词源；视频差分编译\"动态层 80%\"主词库。\n> 本册包含：景别 9 ｜ 机位角度 13 ｜ 基础运镜 10（含 MiniMax 方括号映射）｜ 高级运镜 8 ｜ **图鉴回流 13（十节）** ｜ 幅度控制 3 档+速度阶梯 6 级 ｜ **运镜×内容组合矩阵 30 格** ｜ 场面调度 8 ｜ 运镜防崩对照 6 ｜ 中英术语对照桥（十一节）—— **合计 105+ 词条**。\n> **运镜选型分工（KB_15 联动）**：选型（47 式案例图鉴：编号/定义/适用/风险）查 KB_15，写法以本册为唯一源，两册冲突以本册为准。\n\n---\n\n## 一、景别词典（8 级）\n\n| 景别 | 取景 | 功能 | 竖屏适配 |\n|---|---|---|---|\n| 大远景 | 环境主导 | 定世界 | 慎用 |\n| 远景 | 全身+环境 | 定关系 | 少用 |\n| 全景 | 全身 | 定动作 | 可用 |\n| 中景 | 膝上 | 定互动 | 常用 |\n| 美式中景 | 大腿以上 | 对峙/拔武器（位阶④·外部教程） | 可用 |\n| 中近景 | 腰上 | 过渡铺垫 | 常用 |\n| 近景 | 胸上 | 给情绪 | 主力 |\n| 特写 | 面部 | 给爆点 | 主力 |\n| 大特写 | 眼/手/物 | 给针脚 | 主力 |\n\n**景别情绪映射口诀**（外部教程·位阶④）：情绪＝特写/大特写，动作＝中景/全景，交代环境＝远景/大远景。\n\n## 二、机位与角度词典（12 词条）\n\n| 机位/角度 | 描述词 | 心理效果 |\n|---|---|---|\n| 平视 | 与人物视线等高 | 客观平和 |\n| 低角度仰拍 | 低机位仰视 | 威压崇高（@林烬压场） |\n| 高角度俯拍 | 高机位俯视 | 渺小怜惜（俯拍孩童） |\n| 鸟瞰 | 垂直向下 | 全知命运 |\n| 蚂蚁视角 | 贴地仰视 | 极端压迫 |\n| 过肩（OTS） | 越一人肩拍另一人 | 对话代入 |\n| 主观视角（POV） | 以角色眼睛为机位 | 沉浸 |\n| 越轴骑轴 | 正对运动方向 | 中性过渡 |\n| 侧面 90 度 | 侧剖面 | 仪式/对峙 |\n| 前侧 45 度 | 侧前跟拍 | 行走标配 |\n| 背跟 | 背后跟随 | 引入/孤独 |\n| 顶角俯冲 | 俯冲推近 | 突袭揭示 |\n| 倾斜机位（Dutch angle） | 机身倾斜、地平线歪斜 | 失控/危险/不对劲（位阶④·外部教程） |\n\n## 三、基础运镜词典（10 词条 · 含 MiniMax H3 方括号映射）\n\n| 运镜 | 标准描述词（公用/即梦自然语言） | MiniMax H3 方括号 | 可灵幅度词参考 | 典型用途 |\n|---|---|---|---|---|\n| 推 | 镜头缓慢推近 | `[推近]`（同义`[推进]`） | 推近+幅度档 | 聚焦情绪、压场 |\n| 拉 | 镜头缓缓拉远 | `[拉远]` | 拉远 | 孤独揭示、退场 |\n| 摇-水平 | 镜头左摇/右摇 | `[左移]`/`[右移]` | 横移 | 展示横向空间 |\n| 摇-垂直 | 镜头上摇（仰角上抬）/下摇 | `[上摇]`/`[下摇]` | —— | 揭示高度/低头细节 |\n| 移 | 镜头平稳横移 | `[左移]`/`[右移]` | 横移 | 跟随与空间扫描 |\n| 跟拍 | 镜头平稳跟随人物前行 | 描述\"跟拍\" | 跟随 | 街道行走 |\n| 环绕 | 镜头围绕主体缓慢环绕（≤180°） | `[环绕]` | 缓慢环绕 | 高光时刻 |\n| 固定 | 镜头固定不动 | `[固定]` | 固定 | 对白/微表情首选 |\n| 升 | 镜头缓缓上升 | 描述\"上升\" | 升 | 大场面揭示 |\n| 降 | 镜头缓缓下降 | 描述\"下降\" | 降 | 俯瞰落定主体 |\n\n## 四、高级电影运镜词典（8 词条）\n\n| 运镜 | 描述词 | 用途 | 风险提示 |\n|---|---|---|---|\n| 希区柯克变焦 | 推镜同时变焦，背景压缩/膨胀 | 惊觉、世界观崩塌 | 高危，需首尾帧 |\n| 焦点转移 | 焦点由前景A移至后景B | 视线引导、关系揭示 | 稳定可用 |\n| 子弹时间 | 高速环绕定格慢放 | 奇观（S级） | 高危，可灵专属尝试 |\n| 手持呼吸感 | 轻微手持晃动 | 临场纪实 | 小幅度安全 |\n| 一镜到底 | 连续跟随不切 | 沉浸叙事 | 走一镜到底拆解重组法：多图参考(首/中/尾帧)三段管线≤3段，无中帧锚裸链≤2段（R9-20261006） |\n| 慢推+微变焦 | 缓推同时轻微变焦 | 情绪压迫 | 稳定可用 |\n| 甩镜转场 | 快速甩动模糊转场 | 硬切替代 | 易崩，慎用 |\n| 升格慢动作 | 高帧率慢放 | 细节放大 | 后期变速更稳 |\n\n## 五、运镜幅度与速度控制（3 档 × 6 级阶梯）\n\n| 幅度档 | 副词 | 适用 |\n|---|---|---|\n| 微幅 | 轻微/缓缓/缓慢 | 情绪戏、B级、微差异首尾帧 |\n| 中幅 | 平稳/匀速/推近 | 常规A级的标配 |\n| 大幅 | 快速/急速/骤然 | S级爆点（必须首尾帧锚定） |\n\n**速度阶梯**：`轻缓 → 缓慢 → 匀速 → 中速 → 快速 → 急速`（急速禁裸用）。\n\n## 六、运镜 × 内容类型组合矩阵（30 格速查 · \"这样拍配这样动\"）\n\n| 内容类型 | 首选运镜 | 备选运镜 | 禁用运镜 | 竖屏改法 |\n|---|---|---|---|---|\n| 压场立威 | 低角度缓慢推近 | 环绕(≤90°) | 甩镜 | 对角贯穿+仰拍 |\n| 街道行走 | 前侧45°平稳跟拍 | 固定+人物入画 | 逆行跟拍 | 纵深跟拍 |\n| 双人对白 | 固定过肩正反打 | 缓推(微幅) | 横移 | 竖屏过肩 |\n| 微表情特写 | [固定] | [推近]缓慢 | 环绕 | 不变 |\n| 打斗爆发 | 跟随+急速推近(首尾帧) | 子弹时间(S级) | 长摇 | 高低对角 |\n| 空镜氛围 | 缓慢横移 | 升/降 | 快切 | 上摇/下摇 |\n| 追逐 | 背跟+横移组合(拆段) | 跟拍 | 360°环绕 | 迎面纵深跟 |\n| 群像揭示 | 升镜缓起 | 拉远 | 推近单点 | 四角压+升 |\n| 回忆闪回 | 缓推+焦点转移 | 固定 | 手持 | 不变 |\n| 揭示道具 | [下摇]至物+焦点锁定 | 缓推(微幅) | 环绕 | 不变 |\n\n## 七、场面调度词典（Mise-en-scène · 8 词条）\n\n| 调度 | 描述词 | 用途 |\n|---|---|---|\n| 入画出画 | 人物自画面左侧入画（方向合轴线） | 行进交代 |\n| 前后景置换 | 前景人物虚化后景人物走入焦点 | 关系转移 |\n| 静动对比 | 人群静止唯主角衣摆翻飞 | 压场 |\n| 视线引导 | 人物视线投向画外右下，下一镜揭示所见 | 剪辑钩子 |\n| 镜面反射调度 | 借橱窗/水面反射呈现第二空间 | 信息翻倍 |\n| 遮挡揭示 | 前景人流穿过逐次露出主体 | 临场揭示 |\n| 深景走位 | 人物由纵深处走向镜头变近景 | 一镜两级景别 |\n| 对角换位 | 双人沿对角线互换站位（显式事件） | 关系逆转可视化 |\n\n## 八、运镜防崩对照（6 条红线）\n\n- 摇镜+高频重复纹理背景 → 必加\"背景虚化\"（崩坏17）。\n- 环绕+多人 → 空间分区句式保留（崩坏06）。\n- 大幅推近+手部特写 → 降微幅（崩坏01）。\n- 单镜内严禁 ≥2 种主动运镜组合（V9 扣分）。\n- MiniMax 方括号指令禁同段叠加，换指令落在节点边界。\n- 可灵幅度必须匹配首尾帧差异（不匹配=运镜不执行）。\n\n## 九、分镜表填写规范（R2 输出 14 字段中本典负责 5 字段）\n\n```text\n镜号｜场次｜景别(一节)｜机位(二节)｜构图(KB_07)｜运镜(三四节1种+幅度五节)｜时长秒｜等级S/A/B｜@资产清单｜台词(口型)｜秒级节点摘要｜Cutaway标记｜轴线标记｜备注\n```\n**示例**：`镜头3｜场次B母子买莽莽｜近景过肩(越@张三右肩拍@李梅)｜竖屏式紧凑过肩主体占左2/3｜[固定]·微幅｜4秒｜A级｜@李梅@张三@光大街边｜李梅台词(口型开合)｜[00-0.4s]抬手抚头；[00.4-3.6s]说台词；[3.6-4s]轻拍收势｜Cutaway否｜B场南半圆不越轴｜手部腕部截断入画防崩；戏眼=说\"等爸爸\"眼神先亮后垂`\n\n**景别渐变箭头记法**（来源：分镜表格模板.xlsx·位阶④）：一镜到底/推拉类镜头的「景别」字段可写「景别A→景别B」（如「超广角→缓推至中景」），表示镜内景别渐变——仅限 KB_15 三节渐变白名单内的连续渐变路径，禁止用于跨机位跳切。\n\n## 十、图鉴回流补充词条（13 词条 · 来源：运镜50图鉴·位阶④定义类；选型速查见 KB_15 一节主表）\n\n| 运镜 | 标准描述词（公用自然语言） | 典型用途 | 风险提示 |\n|---|---|---|---|\n| 斜移 | 镜头沿对角线方向斜向移动 | 运动/战斗/追逐动感 | 竖屏改上下对角纵深 |\n| 变焦（Zoom） | 镜头位置不动，画面视野放大/缩小 | 快速聚焦/空间压缩叙事 | 与「推」易混淆——必须显式写「镜头位置不动」；高危配首尾帧 |\n| 旋转（Roll） | 画面整体绕镜头轴倾斜旋转 | 失控/眩晕/风格化 | AI 常误解为环绕——写「画面整体旋转」并配首尾帧 |\n| 快动作/加速 | 主体动作以快进速度呈现，时间压缩 | 时间流逝/蒙太奇压缩 | 主体戏禁用；空镜类可用 |\n| 延时 | 固定机位间隔拍摄，云影天光快速流动 | 日出日落/天象变化 | 豆包类理解弱→分镜宫格多帧替代更稳 |\n| 穿越/纵深推进 | 镜头穿过前景物（门/枝叶/人群）沿纵深推入 | 进场/探索/一镜到底 | 前景穿越需垫图透视匹配（补丁7） |\n| 跟焦 | 焦点始终跟随运动主体，背景动态模糊 | 奔跑/骑行/驾驶跟随 | ＝焦点转移+跟拍组合，写法拆两句 |\n| 脱焦 | 画面整体柔化失焦，光源化为光斑 | 回忆/梦境/情绪过渡 | 视频内「由清变糊」执行率低→首帧直出脱焦 |\n| 运动模糊 | 主体清晰+背景方向性速度模糊 | 高速运动/追逐 | 主体糊＝废片；写「主体清晰背景模糊」 |\n| 幻觉/梦境 | 柔焦+色彩偏移+漂浮感运镜 | 精神世界/闪回/幻觉 | 双重曝光高危→后期双轨叠加更稳 |\n| 水下介质 | 水下光斑折射质感，气泡悬浮 | 水下场景/神秘氛围 | 参考图必垫（AI 水折射弱） |\n| 景深控制 | 背景虚化程度控制（低景深突出主体） | 对白/特写背景分离 | 静态属性词，写入首帧 Prompt 层 |\n| 航拍 | 空中俯视运动视角（运动形态的鸟瞰） | 宏观场景/S级奇观 | 对应二节「鸟瞰」；竖屏改上下纵深 |\n\n## 十一、中英术语对照桥（读外部教程/AI 对话翻译对齐用 · Prompt 代码块仍纯中文）\n\n| 英文缩写/术语 | 框架标准中文词（词源节） |\n|---|---|\n| ECU（Extreme Close-Up） | 大特写（一节） |\n| CU（Close-Up） | 特写（一节） |\n| MCU（Medium Close-Up） | 中近景（一节；注：外部图鉴体系「近景=腰上」即本词） |\n| MS（Medium Shot） | 中景（一节） |\n| American Shot | 美式中景（一节） |\n| FS（Full Shot） | 全景（一节） |\n| WS（Wide Shot） | 远景（一节） |\n| ELS（Extreme Long Shot） | 大远景（一节） |\n| Eye-level | 平视（二节） |\n| Low angle | 低角度仰拍（二节） |\n| High angle | 高角度俯拍（二节） |\n| Bird's-eye / Top-down | 鸟瞰（二节） |\n| Ground-level | 蚂蚁视角（二节） |\n| POV | 主观视角（二节） |\n| OTS | 过肩（二节） |\n| Dutch angle | 倾斜机位（二节） |\n| Push in / Pull out | 推/拉（三节） |\n| Pan / Tilt | 摇-水平/摇-垂直（三节） |\n| Tracking / Dolly | 跟拍/移（三节） |\n| Orbit / Arc | 环绕（三节） |\n| Dolly Zoom（滑动变焦） | 希区柯克变焦（四节） |\n| Rack Focus | 焦点转移（四节） |\n| Zoom | 变焦（十节） |\n| Roll | 旋转（十节） |\n| Time Lapse / Fast Motion | 延时/快动作（十节） |\n| Match Cut / Transition | 匹配剪辑/转场（KB_15·35/36·R8 剪辑层） |\n\n（对照桥来源：分镜提示词.txt＋运镜50图鉴英文名，均位阶④——仅做翻译对齐，严禁英文镜头词写入 Prompt 代码块。）"},{"p":"kb_library/KB_12_TTS音色克隆与剪映后期词典.md","t":"KB_12 TTS 音色克隆与剪映后期词典（高密度工业速查版）","d":"","raw":"# KB_12 TTS 音色克隆与剪映后期词典（高密度工业速查版）\n\n> 用途：音色制作（R3/R8）与剪辑调音（R8）的唯一词源。\n> **铁律：严禁编造假特效名/假参数**——本典全部条目经联网核实（2026-10），来源见 memory/global/权威工作流与影视知识库.md。\n> 本册包含：TTS 四平台参数大表 ｜ 副语言标签字典 40 词条 ｜ 语速基准 8 档 ｜ **剪映真实菜单大表（曲线变速 6/转场 13/动画 10/调色特效音频 22）** ｜ **Foley 音效搜索关键词映射表 36 词条** ｜ 四轨混音 dB 表 ｜ 对口型流程。\n\n---\n\n## 一、TTS 音色克隆平台参数大表（4 平台 · 核实版）\n\n| 平台 | 克隆门槛 | 推荐样本 | 真实参数/机制 | 已知限制 |\n|---|---|---|---|---|\n| Fish Audio | 10 秒可克隆 | 15~30 秒（最佳 1~3 分钟）干声 | Instant Voice Clone；ComfyUI 节点 1~20 段、每段 10~30 秒、总时长硬校验 <270 秒；S2 词级控制+行内开放域标签 | 中文极致情感一般 |\n| MiniMax | 预设+微调 | 儿童声优先预设 | 文本内嵌 `<#>` 情绪标签、`( )` 停顿、语气词标记；混合音色 | 克隆需授权流程 |\n| CosyVoice | 3 秒可克隆 | 3~10 秒（像度要求低时） | instruct 指令模式（自然语言副语言）；头部全大写标记 `<|HAPPY|>` 等；SSML 控停顿发音 | 2.0 克隆模式语气描述可能失效（语气走 instruct） |\n| Noiz | 风格化预设 | 无需样本 | 年龄+性别+质感三键筛选；音高 ±2 半音、语速 ±10% 微调 | 克隆能力弱 |\n\n## 二、副语言控制标签字典（40 词条 · 按类别）\n\n| 类别 | 词条（平台兼容度） |\n|---|---|\n| 情感通用(10) | `(excited)`兴奋、`(softly)`轻柔、`(sad)`悲伤、`(angry)`愤怒、`(whisper)`气声、`(calm)`平静、`(gentle)`温柔、`(fierce)`狠戾、`(weak)`虚弱、`(proud)`骄傲（全平台） |\n| 笑叹泣咳(6) | `(laughter)`/`[laughter]`笑、`(sigh)`叹气、`(sob)`抽泣、`(chuckle)`轻笑、`(gasp)`倒吸、`(cough)`咳（全平台） |\n| 呼吸(4) | `(breath)`换气、`(deep breath)`深吸气、`(held breath)`屏息、`(shaky breath)`颤息（全平台） |\n| 停顿(4) | `(pause)`短停、`(long pause)`长停、MiniMax 专用 `( )`、句间自然停顿（句号后）（全平台/MiniMax 原生） |\n| 重音(3) | Fish S2 词级标注、注音方案层 `重音=「字」@秒位`、正向强调写法「把\"X\"字咬重」（Fish/注音层） |\n| 语速(5) | `急促5.5字/秒`、`正常4字/秒`、`童声3.5~4字/秒`、`沉吟2.5~3字/秒`、倍率 `0.8x~1.3x`（注音层） |\n| 声调(4) | `尾音升调/降调/平调`、`音调+3半音`（MiniMax 微调）、`压嗓`、`清亮` |\n| 平台专属(4) | `<#>` 情绪切换（MiniMax）、`<|HAPPY|>/<|SAD|>/<|ANGRY|>/<|SURPRISED|>/<|CALM|>`（CosyVoice 全大写头部，长文多点插入）、instruct 自然语言副语言指令（CosyVoice）、行内开放域标签（Fish S2） |\n\n## 三、语速基准表（8 档 · 声画先行联动）\n\n| 语速档 | 字/秒 | 单镜字数安全区 | 典型用途 |\n|---|---|---|---|\n| 急促 | 5.5 | 8~12 | 争吵/报信 |\n| 正常 | 4.0 | 10~20 | 日常对白 |\n| 正常偏缓 | 3.5~4.5 | 8~15 | 温柔/解说 |\n| 童声 | 3.5~4.0 | 5~10 | 孩童奶音 |\n| 沉吟 | 2.5~3.0 | 6~12 | 压场/深情/威吓 |\n| 哭腔 | 2.0~2.5 | 5~10 | 泪点戏 |\n| 耳语 | 2.5 | 4~8 | 秘密/告白 |\n| 宣誓吟唱 | 2.0 | 4~8 | 高光台词 |\n\n## 四、剪映专业版真实菜单大表（核实版 · 严禁超出此表命名）\n\n### 4.1 曲线变速（入口：素材→右侧「变速」→「曲线变速」，6 预设）\n\n| 预设名 | 节奏 | 用途 | 入点规则 |\n|---|---|---|---|\n| `蒙太奇` | 先慢后快再慢 | 片头闪过/结尾聚焦 | 首镜/集尾 |\n| `英雄时刻` | 突慢再恢复 | 高光燃点 | 动作顶点帧 |\n| `子弹时间` | 极致慢放 | 定格戏剧化 | S级奇观 |\n| `跳接` | 节奏跳跃 | 卡点快剪 | BGM 重拍连切 |\n| `闪进` | 开场加速 | 无缝入场 | 镜头入点 |\n| `闪出` | 结尾加速 | 无缝出场 | 镜头出点 |\n\n### 4.2 转场（「转场」面板 · Alt+T）\n\n| 类别 | 真实名 |\n|---|---|\n| 基础(3) | `叠化`（0.2~0.3s）、`闪黑`、`闪白` |\n| 运镜(6) | `推进`、`拉远`、`左移`、`右移`、`旋转`、`模糊` |\n| 氛围MG(4) | `漏光`（特效→氛围/光效类）、`故障`（转场-特效搜\"故障\"）、`燃烧`、`叠化-划像类`（按分类选取） |\n\n### 4.3 出入场动画（素材→「动画」面板 · 10 词条）\n\n`渐显`、`渐隐`、`放大入场`、`缩小入场`、`向左上飞入`、`向右上飞入`、`弹入`、`旋入`、`甩入`、`溶解出场`。\n\n### 4.4 调色与特效（「调节」/「特效」/「滤镜」面板 · 12 词条）\n\n| 类别 | 真实名/入口 |\n|---|---|\n| 调节参数(6) | `亮度`、`对比度`、`饱和度`、`色温`、`色调`、`HSL`（分区调色） |\n| LUT | 「调节」→「LUT」导入（双线剧冷青蓝/暖金橙各一套） |\n| 氛围特效(3) | `漏光`、`光斑`类（特效→氛围/光效搜索）、粒子光斑（搜索\"粒子\"或\"金粉\"） |\n| 功能(3) | `智能补帧`、`色度抠图`、`蒙版(线性/圆形/爱心)` |\n\n### 4.5 音频处理（音频轨→调节 · 5 词条）\n\n`人声美化`、`智能降噪`、`声音克隆`、`变声`、`音频卡点`（节拍标记自动对齐）。\n\n## 五、Foley 音效搜索关键词映射表（36 词条 · 剪映音效库直搜）\n\n| 场景类别 | 搜索关键词（直搜可用） |\n|---|---|\n| 脚步(5) | `脚步 碎石`、`脚步 柏油路`、`高跟鞋 走路`、`奔跑 脚步`、`孩童 跑步` |\n| 冷兵器(4) | `剑鸣 出鞘`、`金属 碰撞`、`刀剑 相击`、`箭矢 破空` |\n| 衣料身体(4) | `衣袂 摩擦`、`布料 飘动`、`拍打 身体`、`关节 活动` |\n| 环境自然(7) | `风声 呼啸`、`细雨 飘落`、`雷声 低鸣`、`雷声 骤响`、`鸟鸣 晨间`、`蝉鸣 夏夜`、`落叶 沙沙` |\n| 市井烟火(6) | `街道 嘈杂`、`炒菜 锅铲`、`白雾 蒸腾 嘶嘶`、`夜市 人声`、`硬币 落地`、`店铺 卷帘门` |\n| 情绪人声(4) | `孩童 笑声`、`人群 惊呼`、`叹息 轻声`、`抽泣 压抑` |\n| 特殊(6) | `心跳 加速`、`耳鸣 失神`、`时间 凝固 滴答`、`能量 蓄力`、`玻璃 碎裂`、`雨后 水滴` |\n\n**卡点规则**：音效入点=动作顶点帧或重音秒位（NARR-03）；点状音效卡单帧，环境音铺底。\n\n## 六、四轨混音 dB 表（R8 标准）\n\n| 轨道 | 内容 | 电平 | 要点 |\n|---|---|---|---|\n| T1 人声轨 | 克隆台词/原生对白 | **-6dB** | 降噪→美化；±2 帧对口型微调 |\n| T2 Foley 轨 | 动作音效 | **-12dB** | 卡点；点状不铺底 |\n| T3 BGM 轨 | 情绪音乐 | **-18~-20dB** | 对白段压低 30%；爆点瞬升 -14dB |\n| T4 环境底噪轨 | 街道/风/雷铺底 | **-24dB** | 全程连续；转场先行 0.3s |\n\n## 七、J-Cut / L-Cut 与对口型流程\n\n- **J-Cut**：下一镜音频提前 0.3s 入（听觉先导）；操作=音频块左移拖出画面块前缘。\n- **L-Cut**：上一镜尾音延入下一镜 0.5s；操作=音频右缘拉长覆盖下镜画面。\n- **遮瑕组合**：Cutaway 缓冲镜覆盖主轨+主镜尾音 L-Cut——观众耳朵在主镜、眼睛在缓冲镜。\n- **后期音频替换四步（R9-20261005-2，取代旧\"模式B对口型\"管线）**：静音原视频音频轨 → 克隆/TTS 音频入 T1 → `智能降噪`+`人声美化` → 剪辑逐句手动对齐口型重音秒位（±2 帧微调；AI 对口型为可选加速）。\n\n## 八、音色克隆工作卡模板（写入资产文档）\n\n```markdown\n### @人物 音色克隆卡\n- 目标平台：…（四平台选型）｜ 音色ID：音色-@人物-特征摘要\n- 音色特征：[质感+共鸣腔+年龄感]（KB_01/02 联动）\n- 参考音频要求：[秒数]干声，含[两种能量态]样本，背景干净\n- 克隆参数：[平台真实参数，禁编造]\n- 情感标签示例：台词\"…\" → [标签串+语速+重音+尾音]\n- 发音指导：[多音字/儿化/专有名词读法]\n```"},{"p":"kb_library/KB_13_框架术语白话词典.md","t":"KB_13 框架术语白话词典（中英对照 · 面向人类导演的唯一术语总入口）","d":"","raw":"# KB_13 框架术语白话词典（中英对照 · 面向人类导演的唯一术语总入口）\n\n> 用途：全框架术语的**唯一权威白话源**——每个术语＝中文主导名（英文括注）＋一句白话。所有面向人类阅读的产出文档头部「📖 术语速查」精简行均出自本典（可按文档实际用词裁剪）；镜区块标题英文术语一律**中文主导＋英文括注**格式。\n> 分工去重：框架自造术语以本典为唯一权威；影视后期术语（转场/变速/混音 dB）详解在 KB_12；镜头语言与运镜详解在 KB_11——本典只给一句白话并指回。\n> 使用铁律：新术语入框架（R9 立法/新技法命名）必须同步在本典登记，未登记术语不得进入面向人类的产出文档。\n\n---\n\n## 一、框架自造术语（38 条 · 本典唯一权威）\n\n| 术语 | 白话释义 |\n|---|---|\n| **画风锁**（Style Lock） | 项目级画风常量字符串（≤35 字），挂在每条 Prompt 末尾逐字复用，防止画风漂移；按人物/场景/道具分三级 |\n| **光位常量**（Lighting Lock） | 每个场景定义的固定光方向描述（≤25 字），同场景所有镜头一致挂载，防止光影跳变 |\n| **风格预设包**（PACK-01~04） | 一套打包好的画风方案：媒介词＋尾锁矩阵＋光影轨道＋禁词表＋年龄基线＋传染协议六件套，新剧整包取用 |\n| **八层黄金语序**（8-Layer Golden Order） | 生图 Prompt 的固定层序：①句首媒介词→②表情+构图→③身份年龄记忆点→④服饰→⑤姿态手部→⑥空间三层→⑦光影轨道→⑧尾锁规格——层序错乱＝画风崩 |\n| **差分编译**（Delta Prompting · 20/80） | 视频 Prompt 只写 20% 人物锚点＋80% 运动变化——长相衣服全在底图里，重复描写反而崩 |\n| **无损膨胀**（Lossless Expansion） | 一句剧本含多个连续动作时拆成多个独立单镜（拆 1 为 3），细节零删减 |\n| **信息守恒**（Info Conservation） | 剧本里的情感铺垫/情节推动细节必须 100% 变成分镜，禁止为省镜头数删戏 |\n| **单镜时空唯一性**（One Shot One Spacetime） | 一条视频 Prompt 只描述一个 3~5 秒连续时空——AI 不会剪辑，塞两个机位＝像素融化 |\n| **蒙太奇拆镜防崩**（Montage Split） | \"关键动作\"与\"细腻表情\"禁止同框——拆成 A 纯动作特写＋B 纯面部特写两个镜 |\n| **蒙太奇B计划**（Montage Plan B） | 高危交互镜（抓腕/夺物等）必配的 3 切快剪救场方案：起势特写→接触点定格微距→结果反应，主方案废片即切换 |\n| **接力段（R 镜号）**（Relay Segments · 02R-A/B/C） | 伪一镜到底的分段渲染标记——剧本连贯段落拆 A/B/C 段生成，剪辑后视觉无缝 |\n| **一镜到底拆解重组**（Long-Take Recomposition） | 长镜高阶管线：多图参考锁轨迹＋尾帧接力分段＋剪辑拼接，突破 5 秒限制 |\n| **中帧锚**（Mid-Keyframe Anchor） | 三段接力的中段关键帧图（首帧同源改三点产出）——有它才能安全接力 3 段，没有则最多 2 段 |\n| **同框关系锚**（Pairing Anchor） | 双人同框时的身份关系描述（高差量化＋服色关系＋气质关系），让观众一眼读出人物关系 |\n| **年龄双向锚**（Age Bidirectional Anchor） | 年龄防漂移双保险：女主型防\"上浮变熟\"配稚气词；丫鬟型防\"塌缩变幼\"配\"及笄/已长开/矮半个头\"三件套 |\n| **三图试金石**（3-Shot Litmus Test） | 新剧绑定风格包后必先跑的 3 张校准图（主角立绘/跨时代配角/主场景空镜），全过才准批量 |\n| **四道闸门**（4-Gate Pipeline） | 生产流水线四关卡：①试金石定锚→②资产扩展→③样板首帧→④全集放行——严禁跳闸批量 |\n| **双擎联审**（L1+L2 Dual Gate） | 质量门禁双签字：L1＝Python 机检查语法（禁词/格式），L2＝R7 智检查视听语义——L1 不过强制 0 分 |\n| **崩坏编号**（Defect No.01~33） | 黑名单里登记的 33 类 AI 生成翻车类型编号（手部融化/串脸/穿模等），评分与复盘按编号对号入座 |\n| **画风基准传染**（Style Contagion） | 全剧首张人物基准图作为画风标尺，后续资产生图全部垫它作画风参考 |\n| **垫图透视排他**（Reference Perspective Exclusion） | 分镜机位与垫图机位冲突时禁止垫图（俯瞰图垫平视镜＝缝合怪），宁盲抽不垫错图 |\n| **群组绑定**（Group Binding） | 写多人 NPC 群组（使者/守卫）必须先绑相对距离（\"并肩紧凑而立\"）再给全局坐标，否则被随机打散 |\n| **S·A·B 分级**（Shot Tiering） | 镜头算力分档：S 级奇观核心镜用顶级资源，A 级常规，B 级零视频（静态图＋剪映关键帧） |\n| **切出缓冲镜配额**（Cutaway Quota） | 每 2~3 个主镜头配 1 个 1~2 秒插入镜的节奏缓冲定额（≥15%） |\n| **状态快照**（State Diff） | 每集结束时的人物/道具/时间/情绪登记表，下集开拍前核对防穿帮 |\n| **场景机位库**（Scene Camera Grid） | 一张 3x3（室内可 2x2）宫格图同时产出同一场景多个机位视角（俯瞰/平视/仰拍/纵深等），逐格裁切补高清后作各分镜垫图弹药库，减少垫图透视排他冲突下的盲抽（R9-20261006-6） |\n| **头身分区设定板**（Head-Body Split Sheet） | 3+3 六格人物设定板：上排三角度头像满分辨率特写+下排无头人台正侧背服饰——头部细节不因全身等比缩小而丢失；只锁设定禁入参考位（R9-20261006-7） |\n| **非人形分区轮转板**（Creature Turnaround Grid） | 3x2 六格非人形设定板：上排头部三视角特写+下排全身三视角+尺寸标注——怪兽/灵宠/机甲/大型道具的形体锁定件，与形态矩阵（状态轴）正交互补（R9-20261006-7） |\n| **分镜图总控大师**（Storyboard Master · R10） | 视频生成之前的分镜图生产总关卡角色——对\"每个镜头先出什么图、图与图如何保一致\"负全责，产出《分镜图生产单》作为 R5 开工令（R9-20261007-14） |\n| **分镜图生产单**（Storyboard Production Order） | R10 产出的开工令文档：镜组划分＋组模式＋参考图分配表＋一致性链声明＋分段方案＋抽卡预算——无此单 R5 不得逐镜生图 |\n| **镜组四模式**（4 Group Modes A/B/C/D） | R10 的镜组路由模式：A 多分镜宫格组（同场连续镜一次生成）／B 单帧+尾帧锚（S 级双锚）／C 接力链（超上限长镜）／D 多图参考组（长镜多机位轨迹锚） |\n| **一致性链**（Consistency Chain） | 每个镜组的锚点传递路径声明：垫哪些参考图→组内如何同源→跨组复用哪个锚——没有一致性链的生产单=未完成 |\n| **按叙事设计、按上限分段**（Design by Story, Split by Limit） | 长视频宪法：镜头时长由叙事决定（10s/20s/30s 自由设计），平台上限只是生产参数——分段公式 ⌈时长÷上限⌉ 自动切接力链，永不迁就上限砍叙事 |\n| **多分镜宫格组**（Multi-Shot Grid Group） | 同场 ≥3 连续镜合成一张宫格（2x2~5x4）一次生成全部分镜图——格间同源互锚，逐格裁切即首帧，抽卡预算约为逐镜独立生产的 1/10~1/3 |\n| **多图参考组**（Multi-Reference Group） | 用机位库子图作多图参考的关键帧轨迹锚——长镜内镜头从机位A视角渐变到机位B视角，用两（三）张机位图锁运动轨迹 |\n| **统一资产 DNA**（Unified Asset DNA） | 一致性六法之首：先固化角色/场景参考图资产（主图/三视图/机位库），所有分镜图生产必须挂这些锚——一致性是工作流产物不是模型赠品（KB_14 二节） |\n| **运镜图鉴**（Camera Movement Atlas · KB_15） | 47 式运镜案例图鉴（编号+定义+适用+风险），R2 选运镜/R6 选动态词/R10 评估渐变合法性的选型速查册——选型查 KB_15、写法查 KB_11、冲突以 KB_11 为准（R9-20261007-15） |\n\n## 二、影视视听术语速查（15 条 · 详解指回 KB_11/KB_12）\n\n| 术语 | 白话释义 | 详解 |\n|---|---|---|\n| **切出缓冲镜**（Cutaway） | 临时切离主体拍 1~2 秒相关物/反应再切回——情绪垫、遮瑕疵、埋伏笔（⚠️非工程\"剖面图\"） | KB_11 |\n| **声音先入**（J-Cut） | 下一镜的声音提前半秒进入本镜尾，听觉先导引转场 | KB_12 七节 |\n| **声音延出**（L-Cut） | 本镜声音延续到下一镜头画面，余韵不断 | KB_12 七节 |\n| **拟音**（Foley） | 后期补录的动作音效（脚步/衣料/落针叮响），剪映音效库直搜 | KB_12 五节 |\n| **副镜头素材**（B-Roll） | 主线外的补充画面素材（空镜/细节），Cutaway 的素材来源 | KB_11 |\n| **极限特写**（Macro） | 微距大特写（睫毛颤/指尖触针尖），算力专注单点画质极高 | KB_11 |\n| **正反打**（Shot/Reverse Shot） | 对话双方交替各拍一方的标准剪辑法 | KB_11 |\n| **180度轴线**（180° Axis） | 同场对话 imaginary 连线，摄像机只在轴线一侧半圆活动，越轴＝观众方位混乱 | KB_11 |\n| **景别系列**（Shot Size） | 远景/全景/中景/近景/特写/大特写六级取景范围 | KB_11 |\n| **关键帧插值**（Keyframe Interpolation） | 向视频模型同时喂首/中/尾多张关键帧图，锁定运动轨迹 | KB_08 五节 |\n| **尾帧接力**（Tail-to-Head Relay） | 上一段视频截最后一帧修复后作下一段首帧，链式续接长镜头 | KB_08 五节 |\n| **匹配剪辑**（Match Cut） | 接缝两侧保持同一运动方向延续，剪点不被察觉 | R8 技能 4.5 |\n| **过肩镜头**（Over-the-Shoulder） | 越过一方肩膀拍另一方的对话构图 | KB_11 |\n| **声画先行**（Audio-First / Pre-lay） | 先按字数语速精算音频时长与重音点，再倒推画面秒级动作 | KB_08 |\n| **蒙太奇**（Montage） | 多个短镜头快速组接表达时间流逝/情绪累积的剪辑手法 | KB_12 |\n\n## 三、平台与工程术语（10 条）\n\n| 术语 | 白话释义 |\n|---|---|\n| **图生视频**（I2V · Image-to-Video） | 上传一张首帧图＋运动描述生成视频——静态信息全在图里 |\n| **文生视频**（T2V） | 纯文字生成视频（无底图盲抽），一致性弱，仅特定空镜用 |\n| **首尾帧**（First/Last Frame） | 视频模型同时喂起点图和终点图，只生成中间过渡 |\n| **素材位/参考位**（Reference Slots） | 即梦/豆包等平台上传参考图的栏位（人物/场景各占位） |\n| **垫图**（Reference Image） | 生图/生视频时上传的参考图——垫对锦上添花，垫错透视缝合 |\n| **基准图**（Base Image） | 资产的官方标准图（人物主图/场景全景），后续一切生成以它为参照 |\n| **文生图盲抽**（ Blind Gen） | 无任何参考图纯文字出图——地貌易幻觉，需防穿帮法则保护 |\n| **LUT / 滤镜**（Look-Up Table） | 统一调色预设——接力段全链必须同一 LUT 复制粘贴 |\n| **G 表 / V 表**（G1~G12 / V1~V12） | R7 评分官的生图 12 项/视频 12 项扣分检查表编号 |\n| **修复/高清放大**（Upscale & Restore） | 截帧模糊时用 AI 提质（接力尾帧的标配处理） |\n\n---\n\n> **登记流程**：新术语由 R9 立法时同步写入对应分区（一行一译）；产出文档「📖 术语速查」从本典裁剪；本典词条命名争议以\"中文主导＋英文括注\"格式为最终裁决。"},{"p":"kb_library/KB_14_长视频分段与一致性作战手册.md","t":"KB_14 长视频分段与一致性作战手册（R9-20261007-14 立 · R10 分镜图总控专属词典）","d":"","raw":"# KB_14 长视频分段与一致性作战手册（R9-20261007-14 立 · R10 分镜图总控专属词典）\n\n> 用途：【R10 分镜图总控大师】的作战手册——长视频/多镜头生产的六大一致性方法族、2026 平台能力矩阵、「按叙事设计、按上限分段」分段法则、20 镜连续分镜宫格实例分析。\n> **证据位阶警示（AGENTS 〇节9 执法）**：本册第二节平台矩阵大部分为**外部资料（位阶③④），未经本项目实测**——生产引用时一律标注\"待实测\"，用户实测值到位后优先覆盖并留痕。\n> 立法背景：黑名单 38（一镜到底立法未执法）+ 用户裁决（2026-10-07）——\"不用担心平台能生成多少秒，未来模型肯定适配长视频，这是大趋势，框架定位长视频提示词生成\"。\n\n---\n\n## 一、行业共识基线（为什么分镜图控制是长视频生命线）\n\n- CSDN 评测 9 款主流模型结论（2026-09，外部资料）：**\"角色一致性优先靠上层分镜+资产参考图工作流解决，不要单纯期待底层模型自由生成解决跨镜头一致性\"**——AIGC 长剧没有\"演员本体\"，一致性是工作流产物不是模型赠品；\n- 模型演化趋势：文生视频→图生视频→首尾帧控制→主体参考→动作迁移→**多镜头生成→音画同步→视频编辑**——本质是把 AI 视频从\"随机生成器\"改造成\"可控制作工具\"；长视频上限持续放宽（即梦 30s 原生叙事已落地）；\n- **框架立场（用户裁决）**：设计层完全按叙事自由设计时长；生产层按平台上限自动分段——上限是生产参数，永远不是设计约束。\n\n## 二、一致性六法（方法族详解·按位阶排序）\n\n### ① 统一资产 DNA（一切的前提）\n先固化角色/场景的参考图资产——人物主图/三视图/表情矩阵、场景三件套（KB_06 五节：全景+空镜基准+机位库宫格）；所有分镜图生产必须挂这些锚。\n**位阶：本项目已实测✓**（资产-01/04 基准锁定+机位库 V4 流程）。要点：角色 DNA 描述词组全链逐字复用（换词=换脸）；场景 DNA 靠机位库宫格一图管多机位。\n\n### ② 多分镜宫格一次生成\n同场连续镜组用一张宫格（2x2~5x4）一次生成全部分镜图——格间同源互锚（同脸同服同场景同光），逐格裁切即首帧。\n**位阶：外部验证✓+本项目实测中**（E02 正门组登记待跑）。要点：极简版式铁律（plat_01 六节10——开放列表/零量化锚/≤150字）；格位成图后看图登记；垫场景机位库格+人物主图多图融合。\n\n### ③ 首尾帧链\n前镜尾帧（或其高清修复图）=后镜首帧底图；或后镜 Prompt 显式描述\"前一个画面的最后状态\"——镜头间自然衔接，接缝在剪辑中消失。\n**位阶：本项目部分实测（E01 02R 接力段）**。要点：尾帧必须\"首帧同源改三点\"产出（IMG-02 4.2）保证幅度匹配；跨镜衔接优先复用叙事相邻镜的尾帧（如 E02 镜 12 闪回复用镜 06 尾帧——零生成成本）。\n\n### ④ 关键帧续写（分段视频提示词）\n长视频=多个 12~15s 段落，每段独立视频 Prompt+共享关键帧锚，段成拼接成片（外部实测案例：50 秒短片=4 段拼接）。\n**位阶：外部资料（即梦案例）·未经本项目实测**。要点：段 Prompt 只写本段增量（差分编译）；段边界切在动作节拍/台词句读处。\n\n### ⑤ 多素材参考（多图融合）\n一次生成挂多张参考（人物主图+场景机位库格+道具特写）——参考图数量按平台（豆包多图融合已实测；即梦最多 50 张系外部资料）。\n**位阶：本项目已实测✓**（豆包人物+场景双参考）。要点：参考对象声明前置（官方两部式）；参考图越准文字越省（图锁 80%、字管 20%——宫格极简铁律同源）。\n\n### ⑥ 局部重绘/编辑修补\n单镜抽卡仍不达标的残镜，就位修图（换脸/改手/调背景）而非整镜重抽。\n**位阶：外部资料（即梦局部编辑）·未经本项目实测**。要点：修图后必须回填注册表（基准变更走双签）；修补痕迹过重的镜降 B 级用剪映关键帧缓推遮瑕。\n\n## 三、「按叙事设计、按上限分段」分段法则（长视频宪法）\n\n1. **设计层**：镜头时长完全由叙事决定（R2 拆镜时按情绪曲线/台词精算自由定 5s/10s/20s/30s），**禁止为迁就平台上限砍叙事时长**；\n2. **生产层分段公式**：`段数 = ⌈镜时长 ÷ 平台实测上限⌉`（余数进位）；段长按叙事节拍切分（切在动作节拍/台词句读处，不机械平分）；\n3. **段间锚规范**：2 段链=纯尾帧接力（A 段尾帧高清修复→B 段首帧底图）；**≥3 段链=必须加中帧锚**（动作中间态/机位中间位/光影中间档——\"首帧同源改三点\"产出，抵消接力误差累积）；全链同光源同色温同画风；\n4. **上限校准协议**：新平台首用先跑 1 个校准镜（建议取 S 级长镜）实测最大可出时长→校准值登记注册表平台档案→此后按值分段不再逐镜试探；实测值与官方标称不符时以实测为准（证据位阶），漂移则全局刷新段数（SBM-01 六节5）。\n\n## 四、20 镜连续分镜宫格实例分析（用户素材·2026-10-07）\n\n用户提供实例：仙侠题材 **20 格（5x4）连续分镜图**——同一白衣神仙角色与仙宫场景贯穿全部 20 镜（全景/特写/俯视/跟拍多机位），格间角色服饰、场景建筑、画风光效高度一致。\n**可借鉴点**：①一次生成 20 个分镜图=单镜独立抽卡预算的约 1/10；②5x4 大宫格适合\"整集分镜总览图\"用途（每镜首帧的批量底图）；③组内一致性靠\"同一角色同一场景\"强约束达成，文字仅需极简机位列表。\n**风险注记（本项目宫格实测教训连坐）**：20 格单格分辨率摊薄严重（4K 下单格约 0.2K，必须逐格补高清/重绘才能当首帧）；格数越多机位重复与偷懒填格风险越高（V3 实测：无把握机位被重复元素填充）——**大宫格建议分段批跑（如 2 批 2x5）+垫统一资产 DNA 参考**，不追求一张出全。\n\n## 五、2026 平台能力矩阵（外部资料·未经本项目实测·引用须标\"待实测\"）\n\n| 平台 | 长视频能力 | 一致性能力 | 宫格/多图 | 备注 |\n|---|---|---|---|---|\n| 即梦 Seedance 2.5 | **30s 原生长叙事**·时间控制 | 多素材参考（**最多 50 张**）+音视频协同 | 支持 | 外部评测综合首推；12-15s 段落拼 50s 短片有实测案例 |\n| 可灵 3.0 | 单段较长（2.x 起） | 参考图像+参考视频；2K/4K 专业资产 | 支持 | 运镜幅度匹配依赖首尾帧差异可控（IMG-02 铁律3） |\n| Vidu Q1 | 常规段长 | 外形服饰一致性较好；**细节（伤疤位置）与运镜控制仍偏差** | 支持 | \"多镜头连贯\"评测靠前；细节锚要文字复述双保险 |\n| PixVerse V6 | 常规段长 | 多镜头音视频一起生成·原生音频 | 支持 | 拍我 AI |\n| Sora 2 | 多镜头连贯标杆 | 强 | — | 海外参考系 |\n| 豆包（本项目主平台） | 图生视频与即梦同源（Seedance 系） | 多图融合（人物+场景）已实测✓ | 宫格已实测✓（V4 极简式） | **时长上限待校准**（按三节协议首跑校准镜） |\n| ComfyUI（备产线） | Wan2.1/2.2 自由 | LoRA/ControlNet 全链可控 | 工作流自定义 | B 级降本与批量锁脸 |\n\n> 矩阵维护规则：每季复检一次；本项目实测值到位即覆盖外部值并标注日期（证据位阶留痕）；新平台接入先补校准镜再入表。\n\n---\n\n## 六、R7 评分联动（生产单核验要点）\n\nR10 生产单送 R7 核验时附加四查（叠加 KB_10 常规项）：①镜组划分合理（可成组镜未独立）；②每组一致性链声明完备（参考图分配+锚点路径）；③超上限镜分段方案齐（段数公式+段间锚）；④抽卡预算合理（组化生产预算显著低于逐镜总和）。四查任一缺项=生产单打回 R10。"},{"p":"kb_library/KB_15_运镜图鉴.md","t":"KB_15 运镜图鉴（47 式 · 选型速查版）","d":"","raw":"# KB_15 运镜图鉴（47 式 · 选型速查版）\n\n> 用途：运镜**选型**唯一图鉴——R2 拆镜选运镜、R6 视频差分编译选动态词、R10 一镜到底渐变合法性评估、R7 运镜描述质检，四岗共用。\n> **词源分工铁律：选型查本册，写法查 KB_11**（Prompt 措辞唯一源，本册不写 Prompt 措辞）；两册冲突以 KB_11 为准。KB_11 十节另有「图鉴回流补充词条 13 式」（本册图鉴有而 KB_11 三/四节原无的运镜，已回流登记）。\n> 出处位阶：案例图＝用户整理的外部图鉴（**位阶④·定义类知识，可安全吸收**；非实测结论）；「KB_11 映射」列＝框架自有写法。图片本体存 `reference/运镜50/<编号>.png`（共 47 张，原位不迁移不复制），**供人类与多模态智能体按需开图（见〇节读图协议）**；整包 PDF 载体见四节（外部对话工具用）。\n\n---\n\n## 〇、使用协议（谁在何时查什么）\n\n| 岗位 | 时机 | 查什么 |\n|---|---|---|\n| R2 高级导演 | 拆分镜填「运镜」列前 | 二节速查矩阵：叙事目的 → 推荐编号 top3~5 → 回一节主表核对该式定义与风险 →（可选）开图核对 |\n| R6 视频提示词专家 | 写视频 Prompt 动态层（80% 变化量）前 | 一节主表「KB_11 映射」列 → 到 KB_11 三/四/十节取标准描述词 |\n| R10 分镜图总控 | 一镜到底/接力链/分段设计时 | 三节联动表：渐变白名单 + 单镜禁入清单 |\n| R7 评分专家 | 运镜描述完整性质检 | 主表「风险/禁配」列 + KB_11 八节红线 |\n\n**【多模态按需读图协议（R9-20261007-15 · 文字表是索引，图才是 ground truth）】**\n本框架运行平台（ZCode/Trae/WorkBuddy）均为多模态智能体，可直接 `Read` 卡片原图。「示意形态」列含前后帧对比/箭头/多格分镜的卡，其右栏帧差＝该运镜的**所见即所得效果定义**——两帧之间什么变了（主体大小？背景透视？清晰层？）就是这条运镜的物理本质，比任何文字转述都准。**四类强制读图场景**（单任务累计 ≤3 张，防上下文膨胀；读图结论必须落回文字产出——分镜表运镜列/Prompt 动态句，图片本体绝不嵌入产出文档）：\n\n| 触发场景 | 执行者 | 操作 |\n|---|---|---|\n| 相近运镜二选一摇摆（推 vs 变焦 vs 推拉变焦／环绕 vs 旋转／摇 vs 移） | R2 选型时 | Read 对应 2~3 张卡，比对前后帧差异定夺（如 12 号四格透视注 vs 01 号两格主体放大，一眼分清 Dolly Zoom 与普通推） |\n| 冷门运镜首次写 Prompt（十节回流词条：变焦/旋转/延时/跟焦/脱焦…） | R6 编译前 | Read 该卡，把右栏前后帧变化直译成 I2V 动态句（变化量写进 80% 动态层） |\n| 运镜翻车复盘（生成效果≠设计意图） | R7/R9 归因 | Read 该卡与用户实测截图并排比对：语义混淆（模型理解成别的运镜）还是幅度不足（方向对没到位） |\n| 用户口头描述模糊（\"那种推进的感觉\"/\"电影里常见的那个\"） | R2/R6 | Read 候选编号卡确认语义再落笔，禁凭空猜 |\n\n**读图 vs 查表分工**：日常选型走文字表（快路径，零图片开销）；上表四场景走 Read 原图（深路径，帧差即定义）。**禁止**把 47 张图整包读入上下文（必须按编号精准读 1~3 张）；**禁止**把卡片图当作生成参考图/垫图上传（教学卡带文字标注与分格，垫图必崩——垫图只用资产注册表登记的基准图）。\n\n## 一、编目主表（47 式）\n\n**分类总览（8 族）**：A 机位运动 15 式（1,2,3,4,7,8,9,10,11,15,16,20,22,38,43）｜B 机位角度/视角 5 式（5,6,17,19,47）｜C 光学与焦点 7 式（12,13,14,21,23,44,45）｜D 时间形态 4 式（24,25,26,27）｜E 景别 4 式（28,29,30,31）｜F 画面构成/空镜 4 式（18,32,33,34）｜G 剪辑语言 2 式（35,36）｜H 特殊介质/风格 6 式（37,39,40,41,42,46）。\n\n| 编 | 名称（中·英） | 定义（副标） | 适用叙事 | 图鉴要点摘录 | 示意形态（右栏速记） | KB_11 映射 | 风险/禁配 |\n|---|---|---|---|---|---|---|---|\n| 01 | 推近（Push In） | 画面快速向前推进 | 突出角色/强调情绪/剧情转折紧张感 | 直线推进；景别远景→近景或特写；主体居中稳定 | 两格前后帧+箭头 | 三节·推＋五节幅度 | 大幅推近+手部特写→降微幅（崩坏01） |\n| 02 | 拉远（Pull Out） | 画面向后拉远 | 展现环境/氛围规模感/反转后局势 | 匀速后移；主体位置合理；景深构图渐变 | 两格前后帧+箭头 | 三节·拉 | 竖屏拉远易空→前中后大纵深压（补丁2） |\n| 03 | 跟随/左移（Follow/Move Left） | 跟随角色或水平左移 | 移动/探索/追逐/对话动态 | 主体稳定或偏一侧；运动平滑；结合环境叙事 | 两格前后帧+左移箭头 | 三节·跟拍/移 | 逆行跟拍慎用（六节追逐行） |\n| 04 | 环绕/右移（Orbit/Move Right） | 环绕一周或水平右移 | 全方位展示/沉浸感/视觉动态  10 升 | S：05+10 组合 | 上下纵深构图 |\n| 沉浸代入/第一人称 | 47 主观 | 40 手持 | A | 不变 |\n| 一镜到底范式 | 43 空镜转主体 | 16 穿越、01+38 组合渐变 | S：首尾帧+中帧锚 | 纵深递进为主轴 |\n\n## 三、框架法则联动表（R10 执法依据）\n\n**① 一镜到底运镜渐变白名单**（单镜内合法的「先后递进」组合，AGENTS R2 一场一镜到底优先法则）：\n- 合法渐变链：01 推 → 38 慢摇 → 04 横移（推→摇→移）；10 升 → 01 推（升起后推近）；43 空镜推 + 主体纵深入画（深景走位）；16 穿越前景 → 01 继续推进；02 拉 → 10 升（拉远同时升高）；44 跟焦（跟拍中焦点变化）。\n- 非法（＝机位跳切/多并发）：任意两式硬切拼接；「边走边说边转身」类三并发；35/36/15 的切场景语义。\n\n**② 单镜时空唯一性对照（禁入单镜 Prompt 清单）**：35 转场、36 匹配剪辑＝纯剪辑语言（R8 层执行，R2 只做预设计）；15 滑动切场景＝跨空间语义，单镜内只允许「平滑移动」不含切换；25/26 时间压缩＝仅空镜类单镜可用，主体戏禁用；42 VR＝AI 生成语境不可用。\n\n**③ 差分编译 80% 动态量映射示例**（全量写法以 KB_11 三/四/十节为源）：\n- 01 →「镜头缓缓推近，主体在画面中逐渐变大，背景细节渐次清晰」；\n- 20 →「镜头平稳跟随人物前行，人物始终位于画面左三分之一，环境向后流动」；\n- 46 →「主体保持清晰，背景呈强烈方向性速度模糊，增强冲刺感」；\n- 43 →「镜头自空景缓缓前推，人物自画面纵深处走入并渐成近景」。\n\n## 四、档案说明\n\n- **图集本体**：`reference/运镜50/`，47 张 PNG（1~47 连续无缺，单张 1.6~2.9MB，合计约 99MB，文件日期 2025-07-13）。文件夹名「运镜50」实为 47 张——以实物为准备案。\n- **整包 PDF 载体**：`reference/运镜50_图鉴合集.pdf`（47 页·12.2MB，JPEG 压缩版）——供外部对话工具（ChatGPT/豆包网页版等无法读本地文件的场合）整包上传讨论运镜用；框架内智能体不需要它（按编号直接 Read 原图更清晰，见〇节读图协议）。\n- **版式**：每张＝运镜教学信息卡——左栏深色面板（编号徽章+中文名+英文名+副标+使用场景/镜头说明/运镜要点 3~6 条），右栏同一角色（黑衣马尾女性冒险者）游戏 CG 风格示例剧照（部分带前后帧对比与箭头/多格分镜示意），同一角色贯穿全集保证可比性。\n- **编目方法**：Read 图片 + 视觉模型逐张提取卡面文字（2026-10-06）；33.png 原格式解析异常，经 JPG 转码后成功提取。卡面文字为图鉴原文，主表「定义/适用叙事/要点摘录」列保留原文措辞（适度压缩）。\n- **编目发现（供使用者知悉）**：24/27 同为慢动作（副标侧重情感/细节，图鉴原集即近似重复）；21/23 高度相近（写法已并流）；12 卡面定义偏「推拉改变主体大小」与标准 Dolly Zoom（滑动变焦）有偏差——写法一律以 KB_11 为准。\n- **吸收边界**：本册只吸收定义/场景/要点类知识；任何 Prompt 写法、平台行为结论不来自本图鉴——涉实测一律走证据位阶（AGENTS 〇节9）。"}]},{"g":"技能索引","items":[{"p":"skills/SKILL_INDEX.md","t":"SKILL_INDEX.md — 全局技能插件路由索引表","d":"","raw":"# SKILL_INDEX.md — 全局技能插件路由索引表\n\n> 本索引是 `skills/` 目录的唯一路由入口（仿 anthropics/skills 按需加载规范）。\n> **使用规则**：总控（AGENTS.md）根据任务匹配下表 `WHEN 触发条件`，**只提取读取命中的 Skill 文件本体**，未命中的不读取，以节省上下文 Token。\n> 平台插件（05 类）互斥加载：一次任务最多激活一个 `plat_*`；未指定平台时激活 `plat_00`。\n\n---\n\n## 01 叙事编剧类（narrative）\n\n| 技能ID | 路径 | 挂载KB | WHEN 触发条件 |\n|---|---|---|---|\n| NARR-01 市场钩子调研 | `01_narrative_skills/skill_market_hook_research.md` | KB_01 | 当需要分析目标市场受众、设计黄金前3秒钩子或情绪曲线时 |\n| NARR-02 世界观与人物弧光 | `01_narrative_skills/skill_world_character_arc.md` | KB_01、KB_02 | 当需要构建世界观、人物立体小传、性格缺陷与潜台词时 |\n| NARR-03 台词秒数精算 | `01_narrative_skills/skill_dialogue_second_calc.md` | KB_11、KB_12 | 当台词需要按字数/语速精算镜头时长与重音节点（声画先行）时 |\n| NARR-04 单集剧本与脚本转化 | `01_narrative_skills/skill_episode_script_writer.md` | KB_01、KB_02、KB_12 | 当需要撰写单集完整文学剧本、把大纲/小说改编为可拍摄剧本、或界定\"文学剧本/分镜脚本/生成提示词\"三层边界（台词双轨隔离+音频ID 预埋）时 |\n\n## 02 导演美术场记类（visual_director）\n\n| 技能ID | 路径 | 挂载KB | WHEN 触发条件 |\n|---|---|---|---|\n| VIS-01 导演分镜拆解 | `02_visual_director_skills/skill_director_storyboard.md` | KB_07、KB_11、KB_15（运镜选型按需） | 当需要拆解分镜、标注S/A/B算力分级、规划Cutaway缓冲镜时 |\n| VIS-02 美术风格穿搭道具 | `02_visual_director_skills/skill_art_style_costume_prop.md` | KB_03、KB_04、KB_05 | 当需要确定画风、色彩脚本、人物穿搭、场景与道具视觉设定时 |\n| VIS-03 纯中文零光影资产 | `02_visual_director_skills/skill_asset_pure_chinese_no_light.md` | KB_06、KB_08 | 当需要策划重要资产图并执行 @纯中文命名 与零高光阴影铁律时（核心） |\n| VIS-04 连续性轴线守卫 | `02_visual_director_skills/skill_continuity_axis_guard.md` | KB_07 | 当需要校验180度轴线、左右站位、服装战损与跨集快照时 |\n| SBM-01 分镜图总控 | `02_visual_director_skills/skill_storyboard_master.md` | KB_14、KB_06、KB_07、KB_15（渐变白名单按需） | 当 R2 分镜表定稿后规划分镜图生产（镜组四模式路由/一致性链/长视频分段），或用户问\"这些镜头怎么出图/怎么保持一致/长镜头怎么办\"时（R10 专属技能·R9-20261007-14） |\n| VIS-05 资产设定板式路由器 | `02_visual_director_skills/skill_asset_sheet_board_router.md` | KB_06、KB_02、KB_03 | 当框架识别资产复杂度高（人物头部记忆点≥3项并发/服饰层次≥3层/非人形多形态/大型道具）需宫格设定板，或需宫格备用抽卡方案时按需触发——默认传统单视图五件套，同 IMG-02 多宫格分镜一样按需使用（R9-20261006-9） |\n\n## 03 生图技法类（image_gen）\n\n| 技能ID | 路径 | 挂载KB | WHEN 触发条件 |\n|---|---|---|---|\n| IMG-01 生图技法路由器 | `03_image_gen_skills/skill_img_tech_router.md` | KB_06、KB_09 | 当需要为某个出图任务选择图生图/ControlNet/灰度图/LoRA/Inpainting策略时 |\n| IMG-02 前置资源策划 | `03_image_gen_skills/skill_img_pre_resource_planner.md` | KB_06、KB_07 | 当需要为视频镜头策划首帧基准图、尾帧图、多宫格垫图时 |\n\n## 04 生视频技法类（video_gen）\n\n| 技能ID | 路径 | 挂载KB | WHEN 触发条件 |\n|---|---|---|---|\n| VID-01 秒级切片器 | `04_video_gen_skills/skill_vid_second_slicer.md` | KB_08、KB_11、
